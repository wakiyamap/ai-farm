# Phase 16e: a scout instance on codex (gpt-6-sol), run as harness (the agent@ default user).
# Replaces the 14b/14c Qwen drop-in: no qwen-server dependency, no dsh bind mounts.
[Unit]
StartLimitIntervalSec=1h
StartLimitBurst=60

[Service]
Restart=no
RuntimeMaxSec=35min
Environment=SESSION_MAX_MIN=35
UMask=0002
ExecCondition=/bin/sh -c 'ls /srv/farm/ws/scout/queue | grep -c json >/dev/null'
