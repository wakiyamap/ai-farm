# Start the earner at boot, once the local LLM answers (the model takes minutes to load).
[Unit]
After=qwen-server.service
Wants=qwen-server.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 120); do curl -sf -m 3 http://127.0.0.1:8003/v1/models >/dev/null && exit 0; sleep 5; done; echo "earner: LLM on :8003 not answering after 10 min" >&2; exit 1'

[Install]
WantedBy=multi-user.target
