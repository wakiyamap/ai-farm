id: trial-gmx-buyback-slow-arbitrum
author: builder/claude-mythos-5-2
chains: [arbitrum]
strategy: "trial: take GMX v2 FeeHandler fee-buyback batches of the slow fee tokens on Arbitrum (1.5 WETH in, USDG / LINK / ARB / SOL / ... out at the oracle price plus 0.4-0.6 pct) with a flash loan when a pot pays, using signed price reports copied from confirmed keeper transactions"
copied_from: "Inventory EOAs 0xbd7927efd017b67dfed59005b13e58d970d3ba54 (11 USDG batches from block 525,321,631, first tx 0xd2a01736e1c9e38177ad9944a52eb1eb68a21be4c7c21dd072b0ed40e0842eb4, a FeeHandler multicall of claimFees + buyback) and 0x86fe53a6d47d9a0fdea4c5ac3d80e0e6cc3354cc (USDG 0x2bf1ead9..., LINK 0x0b8c4af9...); the flash route is the one of the USDC takers (e.g. 0x9916cf54df77d16c2d9ff5a44bf07a1dc290c76592dc987e4eb61be6fabc0c22) with a pool path per fee token"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "GmxBuybackPath.sol take() is owner-only, repays the flash loan inside the callback and reverts NoProfit unless its WETH balance grew by minProfit, then unwraps and pays the bot wallet native ETH; a lost attempt costs gas only. bot.py attempt(): gas limit = eth_estimateGas x 1.25 (refused above 12,000,000), maxFeePerGas = base fee x 1.5 + 0.001 gwei tip (refused above 0.1 gwei), the send is refused when gasLimit x maxFeePerGas is worth more than 0.90 USD at the pool price (MAX_CAP_USD) and when the simulated gain is not above gasLimit x maxFeePerGas; minProfit = that cap + 1 wei. Priority fee bid: a fixed 0.001 gwei per gas, about 6e-9 ETH per send = under 0.1 pct of a full-premium gross (0.0045 WETH)."
expected_value: "Trial: send-measured win rate, no counted EV. Competition, 30 days to block 525,514,766 (scratch/gmxpots/buybacks-arbitrum-30d.json): 137 buybacks; USDC 104 and WBTC 17 are taken by flash executors inside the block the pot crosses (lead 294, not this bot). The other fee tokens: USDG 12 batches, LINK 2, WAVAX 2, taken by two inventory EOAs calling the FeeHandler directly, tx index 1-7, base-fee gas. The USDG pot held 9.3 batches 7 days before the first take and 12.2 at the take (scratch/gmxpots/slow.json), so 12 batches x 0.0045 WETH (8 USD each, scratch/trial-gmx-buyback-slow-arbitrum/sim-relay-result.json) sat for more than a week. USDG accrues about 0.4 batch a day; SOL (0.93 of a batch), LINK (0.84) and ARB (0.78) are next (scratch/gmxpots/scan-arbitrum.json, 2026-11-19). The bot aims at every slow batch: about 0.5 a day x 8 USD."
executor: scratch/trial-gmx-buyback-slow-arbitrum/contracts/out/GmxBuybackPath.sol/GmxBuybackPath.json
executor_args: "{bot}"
executor_note: "Constructor takes the owner only. take(Plan, minProfit): every target (flash vault, FeeHandler, wrapped native, batch, fee token, markets, oracle reports, pool path) is a call argument. Balancer-V2-style flash of one batch, claimFees per market (try/catch), approve exactly the batch to the FeeHandler, buyback, approval reset to 0 and read back (Leftover(weth) unless the allowance is 0), sell the whole fee-token balance hop by hop on Uniswap-V3-style pools (callback checks msg.sender against the pool set for this hop and cleared after; after each hop Leftover(token) unless the executor's balance of that hop's input token is 0, so neither the fee token nor an intermediate token can stay behind; BadPath unless the path ends in the wrapped native), repay, NoProfit unless the balance grew by minProfit, unwrap, pay the owner native. The executor gives no approval to pools (it pays inside the swap callback). receiveFlashLoan checks msg.sender against the vault set for this call. No setup tx. Live code reads EXECUTOR_ADDR_ARBITRUM or EXECUTOR_ADDR only; paper mode uses an eth_call / eth_estimateGas code override taken with eth_getCode from the fork deployment (executor-runtime.hex, re-taken 2026-11-19 by run 7b88063f after the Leftover change)."
fork_evidence: "scratch/trial-gmx-buyback-slow-arbitrum/proof.py -> proof-result.json, run 2026-11-19 17:4x UTC by run 7b88063f (one Arbitrum fork lease; fork reset arbitrum 525,321,630 = parent of the paid capture 0xd2a01736e1c9e38177ad9944a52eb1eb68a21be4c7c21dd072b0ed40e0842eb4; fork deploy of the artifact with --args at 0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352, source sha256 7616c33d8d2aea7f4e7e4fc155f93a6c63762c6583f489636ae2388b0728a6a1; fund the owner; block timestamps pinned to the capture's so its signed reports stay valid; same 8 markets and reports as the capture, read from its calldata). All are real fork transactions with the current executor: non-owner take 0xad9e853565d9f6f1ad26757903571aede7b8478aa24b037bd695bd9e5d9168ee block 525,321,632 status 0 NotOwner() 0x30cd7471; guard (owner, minProfit 1 WETH) 0x90a86624a22276ce2a620b0c7010756ab3641c8cb2fff002eb7868633b026fca block 525,321,633 status 0 NoProfit(4511663393612052) 0xd4989a94, 3,335,012 gas, owner -100,050,360,000,000 wei (gas only, at the script's 0.03 gwei); SUCCESS (owner, minProfit half the gain seen) 0xaafa89d60cbf30bb260ca04c13a12d494a4dac81f5b628c63453d6326777ad70 block 525,321,634 status 1, 2,910,796 gas, owner native delta +4,424,339,513,612,052 wei net of gas (+0.004424 ETH; gross 0.004512 WETH); read right after it and before any other transaction: executor native 0, WETH 0, USDC 0 (the intermediate hop token), USDG 0 (the fee token), and allowance 0 from the executor for each of WETH, USDC and USDG to the FeeHandler, the Balancer vault and both swap pools; second batch, same call 0x9dea9ba5c56249b14b03bae0553577201138e351805484b376997b3b76ffcc6f block 525,321,635 status 1, owner +4,256,875,053,318,120 wei (the pot held 12 batches); same call 117 s later 0xd3c82d8ef2b86fa5838c764dfe3f4f0e71710968fe43efedbb59487a48c50d98 block 525,321,636 status 0, oracle revert 0x4e3f62a8 (reports too old), owner -77,549,550,000,000 wei (gas only). Earlier, with the executor before the Leftover checks: proof_head.py / proof-head-result.json at recent block 525,619,327 (NotOwner 0xb234977809344054b157db4a1964adb5dc9bfd59c57615cbb3495937a5ee2007, NoProfit(0) 0xa7ac0ee698741b2f081e82f0a4bec59f5bcaa0aadbc8780045abd05cf04fc5b6 with reports lifted by the bot code from keeper txs while the pot was below a batch, 4,632,577 gas = the cost of a lost attempt, 0.25 USD at 0.03 gwei). selftest.py re-run by run 7b88063f with the new artifact (bot calldata == cast calldata byte for byte; the bot's 14-market calldata at the capture's parent block by archive eth_call with a code override); lifttest.py shows the oracle refusing reports more than 60 s apart (0xdd9c6b9a(180,60)); the bot only uses reports both younger than 20 s."
awaited_events: "A slow fee token's pot (available amount plus the WETH-buyer share of claimable fees) growing past the value of 1.5 WETH plus costs; then the next confirmed GMX keeper tx carrying that token's price report. Last slow takes: USDG blocks 525,321,631-525,325,105 (2026-11-18 about 12:29 UTC). SOL was at 0.93 of a batch on 2026-11-19, LINK 0.84, ARB 0.78, USDG 0.43 (about 0.4 batch a day)."
good_signs: "check rows with ratio rising toward 1; state armed followed by opportunity and paper_sim success (live: send_result won with the wallet's ETH up)."
bad_signs: "armed with only no_reports or reports_stale rows until rest (keeper txs for that token too sparse); simulate_revert with an oracle error (provider or report format changed); a BuybackFees event for a configured token by someone else while the bot was armed; read_budget rows."
rpc_reads_per_min: "0.8 while idle (one getOutputAmount eth_call per token, 10 tokens, every 900 s; pool prices hourly). While a pot pays: every 8 s that pot, eth_blockNumber and one eth_getLogs, plus one eth_getTransactionByHash per new keeper tx, for at most 900 s per token and 2 h."
alchemy_cu_per_day: "Idle 96 x 10 x 26 = 25,000 CU/day plus hourly prices 24 x 12 x 26 = 7,500; a pot within 10 pct of a batch is re-read every 180 s with its pool price (480 x about 78 = 37,000 CU/day per near pot, idle pots keep the 900 s pace); armed about 140 CU per 8 s = 1,050 CU/min, at most 15 min per token per 2 h. Code cap 90,000 CU/day (0.048 USD at 0.53 USD per million CU). No feed (the EventEmitter's events are busy)."
legal_note: "FeeHandler.buyback and claimFees are public functions that GMX built so that anyone converts accrued fees at the oracle price plus a fixed premium. The price reports are Chainlink-signed data that GMX keepers have already published in confirmed transactions; the bot reads confirmed blocks only, never pending transactions, and the FeeHandler itself bounds their age to 30 s. No price is moved: the fee token is sold once on public pools inside the same transaction."
expedite: false
