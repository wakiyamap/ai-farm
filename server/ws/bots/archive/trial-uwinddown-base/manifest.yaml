id: trial-uwinddown-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: flash USDC from Morpho, buy a Universal uAsset on its WETH pool, redeem it at the UniversalWindDownVault's fixed USDC rate, keep the USDC difference, all in one transaction"
copied_from: "Flash takers on UniversalWindDownVault 0x1f69bbf9f7ed316bcf1e0cf12f81d261a9bdc2ca (Base): 0x7475c030849538ce47990db32429eb4445db0b9d tx 0x3a9b478adaf576337b8f869239b36a7eb6d5a00c2a9fd7b38b6898cf90767597 (uSUI, +0.00229 WETH), 0x329e8a68143f5d8725e343d125f2193f59dd23f0 tx 0xdfc6197e010f71f23cd2695de3dc44487a74e500625085a20374e29de7a2522c (uSOL, +0.00113 WETH), 0xf743c84ae244c5d9005c774dcab9f876f8667b84 tx 0x6e68459abde47d7447042c395994ccb98e277d5a40e5f69ab8ec2dfa5bf97de5 (uXRP, +0.176 USDC), 0x4d98dbc5bb8c4c830384b9e0a64938f6ee0cc481 tx 0x24c66b07251b3dd1fbe5989d574e47b65244c4f6ba7ac694d45f210830733fdd (uZEC, +0.0000409 WETH)"
capital_usd: 15
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "WindDownArb.sol run() (scratch/trial-uwinddown-base/contracts/src/WindDownArb.sol:54-60) reverts unless the executor's USDC balance grew by minProfit, and bot.py evaluate() sets minProfit to this send's gas cap in USDC (bot.py:293), so a lost attempt costs gas only. Gas cap: bot.py:275-286 keeps gas limit x maxFeePerGas + the L1 fee upper bound under 0.95 USD at the pool ETH price x 1.15 and sends only if the simulated gain is at least 1.2 x that cap. Bids at most 35 pct of simulated gross as priority fee (BID_SHARE, bot.py:276). No principal: the USDC is a Morpho flash loan repaid in the same transaction."
expected_value: "Trial, measures the win rate by sending. The vault opened 2026-11-18 (block 58,882,222); in the 2.9 days to block 60,121,843 it paid 378,155 USDC in 1,021 redemptions. Five flash executors took atomic gains (sampled receipts, scratch/rf5f3/wd-takers.json): 0x329e8a68 25 takes sum 65.7 USD (median 2.22), 0x7475c030 14 takes sum 47.0 USD (median 3.25), 0xf743c84a 205 takes median 0.157 USD (about 40 USD), 0xa344e110 4 takes 5.7 USD, 0x4d98dbc5 16 takes 1.6 USD: about 160 USD in 2.9 days, front-loaded (two bursts on 11-18). Gas per take 0.004-0.03 USD. Of 26 sampled takes this bot's own scan was already positive 3 s before the take in 25, 10 s before in 21, 30 s before in 14 and 3 minutes before in 12 (scratch/trial-uwinddown-base/windows.json), so a 27 s poll sees most of them. Aim: 10-30 pct of the class while the wind-down lasts (vault holds 171,845 USDC against about 2.4M USD of uAssets outstanding at the redemption rates)."
executor: scratch/trial-uwinddown-base/contracts/out/WindDownArb.sol/WindDownArb.json
executor_args: "{bot}"
executor_note: "Owner-only run(Params). Morpho, USDC, WETH, both pools, the uAsset and the vault are call arguments; constructor takes only the bot address; no setup transaction. Callbacks (onMorphoFlashLoan, uniswapV3 / pancakeV3 / algebra swap callbacks) accept only the counterparty set for the current step and cleared after it. The vault allowance is set to the redeemed amount and reset to 0; Morpho's allowance equals the repayment and is used up by it. WETH left by a partially filled swap is sold back to USDC inside the transaction. The whole USDC balance is paid to the owner. Deploy gas 1,082,873. scan() / probe() are eth_call helpers (owner-only / self-only) that revert every probe. Live address only from EXECUTOR_ADDR_BASE or EXECUTOR_ADDR."
fork_evidence: "scratch/trial-uwinddown-base/proof.py (one script: lease, reset, deploy, fund, guards, success; result proof.json). Reset Base 59,145,100 = parent of incumbent take 0x3a9b478a (block 59,145,101). Deploy block 59,145,101. Scan positive on uSUI, uDOGE, uLTC, uATOM, uLINK, uZEC. Success 0xf6f9394a2fcfa49af53574b8b17354dd13eb8a751a61bb88a4d691b22b7eb056 (block 59,145,104, uSUI, 800 USDC flash): owner +2.435715 USDC, 522,469 gas, executor left with 0 WETH / USDC / uSUI and 0 allowances, vault USDC 135,545.69 -> 134,743.25. Reverts: non-owner 0x1508d079365a8edc511b98e4ce685e8e3d2be3488b52c859126bb2ec8eed363a; minProfit x 1000 0x72b327bf2b0c938421ade68cf724b025a15fb8a9db14d828880a8fc99e06f3f1; same run again with nothing left 0x6e4713ff084e2344020bf1f38fc0b321ab007e1f66956f4e0a3e508d828eb39f. Paper code override = eth_getCode of that fork deployment (executor-runtime.hex, 4,757 bytes; selftest.py)."
awaited_events: "No event: the gap opens when ETH falls against USD (the uAssets are quoted in WETH and redeem at a fixed USDC rate) or when someone sells a uAsset into its pool. Timer: one scan eth_call every 27 s. Last incumbent take 2026-11-20 about 21:20Z (block 60,095,327); at 22:55Z nothing is open (pools 0.4-2.5 pct above the rate), the next opening needs ETH about 0.8 pct lower for the small pools and 2-3 pct lower for uSOL / uXRP / uDOGE / uADA."
good_signs: "opportunity rows with gain above the gas cap; send_result won with USDC arriving in the wallet; lost sends that are a few blocks behind the winner."
bad_signs: "scan always 0 for days (pools drained or priced above the rate), vault paused or out of USDC (every probe reverts), all sends lost, read budget rows (CU cap hit)."
rpc_reads_per_min: "2.2 eth_call per minute (one scan per 27 s); about 6 more reads around each evaluated opportunity"
alchemy_cu_per_day: "3,200 scans x 26 CU = 83,200 CU/day plus evaluations (about 160 CU each, rate-limited to one per route per 120 s); hard cap 98,000 CU/day in code = 0.052 USD/day at 0.53 USD per 1M CU. No feed filter."
legal_note: "redeem(asset, amount, minimumUSDCAmount) is the vault's public, intended payout to anyone holding a uAsset (verified source: 'Redeems supported Universal Assets from one progressively funded USDC pool'); buying the token cheaper on a public pool and redeeming it is plain arbitrage. No bug, no mempool watching, no other user's pending transaction. The owner may pause the vault or change rates while paused; then every probe reverts and the bot does nothing."
expedite: true
