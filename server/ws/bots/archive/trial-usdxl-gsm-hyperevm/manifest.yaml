id: trial-usdxl-gsm-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: USDXL (HypurrFi's GHO-fork stablecoin) redemption at its GSM versus the USDT0/USDXL pools on HyperEVM. The GSM's public buyAsset pays USDT0 for USDXL at 1:1 less a 1 pct fee (1.01 USDXL per USDT0). When one of five thin UniV3-style USDT0/USDXL pools gives more USDXL than that per USDT0, one tx buys USDXL on the pool, redeems it at the GSM inside the pool's swap callback, pays the pool with that USDT0, sells the USDT0 left for WHYPE, unwraps it and pays it to the bot wallet as native HYPE, or reverts. No flash loan, no principal. The bot polls one eth_call of the executor's scan() (25 candidates: 5 pools x 5 sizes) every 30 s."
copied_from: "Main taker EOA 0xf2e752f616ab9e82099409cf853aff4575d02ee5 through 0x1ed7d6ff207170ed15e0a29071f0d3c87a19a5c3 (earlier 0x097faafa12f9292d2b74aecfc1cc1cb2a6afd605): tx 0xc2075c57dbaeed0c18171a683ce28a186a590f34fdf21e31ed38c0881a77868c (block 51,779,361, tx index 2, one pool, 25.092515 USDT0 redeemed, +0.092515 USDT0, 458,248 gas), tx 0x81474b12d075d3c4f6b62a057701478c97ad186968ccfaf885987e10ff19f33e (block 51,397,087, +0.154809 USDT0, two legs), tx 0x55b530575b2493ba45c0f3b119b28f53b91eb3904b47e01216f54877266d13cc (block 51,794,785, read in full: pool 0xb814a0d1 swap, GSM BuyAsset, HypurrFi aToken burn, second leg through feUSD). Others: 0x3f33be5978e6b26bb35cb6cd30bbdee98c15ad92 (tx 0xe40930d7939d67acd01fdd6dbc1e7d92fcea55e5d051ff4884746e4260b20720), 0x7b9836a3fa0824572c2f7e69beb19c351d80548b (tx 0x50c10f43ef259ee989bc62c776e0ead8c565ac2cfd4686bd431da47e76fe4c5d). Same GSM call and the same USDT0/USDXL pools; changed: single-pool legs only (no feUSD route), size chosen by simulation from fixed sizes over five pools, the gain is swapped to WHYPE, unwrapped and paid as native (the incumbents keep USDT0, which the farm does not count as funds)."
capital_usd: 20
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor UsdxlGsmArb.run requires the native paid out to be > 0 and >= minProfit (scratch/trial-usdxl-gsm-hyperevm/contracts/src/UsdxlGsmArb.sol:67; a losing buy leg already fails in the swap callback when the redeemed USDT0 does not cover what the pool is owed, :146) and a deadline (:65), so a lost attempt costs gas only. Gas cap per send in bot.py evaluate() (constants GAS_LIMIT_MAX to GAIN_OVER_CAP): gas limit = eth_estimateGas x 1.2 (at most 1,500,000); maxFeePerGas = base fee x 1.15 + bid, never above fee_ceiling = 0.95 USD / (gas limit x HYPE price), HYPE valued at the WHYPE/USDT0 pool price x 1.15; no send unless the simulated native gain is at least 1.1 x gas limit x maxFeePerGas (GAIN_OVER_CAP); minProfit is that gas cap in wei + 1, so a mined success always ends with more native than it started. Priority-fee bid: at most 20 pct of simulated gross (BID_SHARE), never above the fee ceiling."
expected_value: "trial, win rate to be measured live; cents. Competition, 7 d to 2026-11-20 23:45Z (blocks 51,206,000-51,810,768, scratch/rcdd0/takes-hyperevm-0xcb17105f.json, GSM BuyAsset logs): 65 take txs, gross 5.3755 USDT0, gas 0.014608 HYPE = 0.89 USD at HYPE 60.93, so the whole class nets about 4.5 USD = 0.64 USD a day; gross per take median 0.047, max 0.276 USDT0; EOA 0xf2e752f6 59 takes (4.82 USDT0), five other senders 1-2 each; tx index 0-21 (median 3), gas price median 0.13 gwei, 2.2-5.8 gwei only on three first-block takes. Windows (series.json, 22 newest takes, this executor's scan as a code override): a gain of 0.00005 HYPE or more stood 1 block before for 20, 10 blocks before for 15, 30 for 15, 100 for 13 (control at 2,000 blocks: 3). The incumbent is slow, so a 30 s poll can arrive first on gaps that clear 1.1 x the gas cap (at the 0.1 gwei base fee a send's cap is about 0.00007 HYPE = 0.004 USD, so gaps from about 0.005 USD up); the bot aims at half of the class: 0.1-0.3 USD a day, 3-9 takes a day on active days, none on quiet days. One lost attempt: 0.5-0.64M gas = 0.003-0.02 USD at 0.1-0.5 gwei."
executor: scratch/trial-usdxl-gsm-hyperevm/contracts/out/UsdxlGsmArb.sol/UsdxlGsmArb.json
executor_args: "{bot}"
executor_note: "Deploy gas 1,335,627 on the fork, below the 2,000,000 HyperEVM cap. constructor(address bot) only (owner is immutable); the GSM, both pools, directions, size and limits are Params call arguments. One fallback() serves every UniV3-style swap callback name (same (int256,int256,bytes) layout) and accepts only the pool set for this step of this transaction (_expect), cleared at the end; during the buy leg it redeems at the GSM first (approval for exactly the USDXL sold, reset to 0 after) and then pays the pool. receive() accepts native only from the wrapped token during the unwrap of this transaction. scan() is an owner-only eth_call helper that rolls every candidate back (probe() always reverts with the result). Profit is paid as native HYPE in the same transaction; USDXL rounding dust (under 1e12 wei) and any USDT0 remainder go to the owner; nothing stays in the executor after the fork successes (native, WHYPE, USDXL, USDT0 and the GSM allowance all read 0)."
fork_evidence: "scratch/trial-usdxl-gsm-hyperevm/proof.py <reset block> [tag]: one script for lease, reset, deploy, scan, guards, success, release; no fixture and no setCode; owner 0x1111111111111111111111111111111111111111; executor 0x8f7a45ebde059392e46a46dcc14ab24681a961ea. (1) `proof.py 51397086 b` -> proofb.json, reset = parent of incumbent tx 0x81474b12d075d3c4f6b62a057701478c97ad186968ccfaf885987e10ff19f33e (block 51,397,087, index 1). Deploy 0x7d3cf13c4932839c5b2e32257c639ef47a264aee2abf2ade02eb5279b032fa7c (1,335,627 gas). scan() before: pool 0xb814a0d1 at 5 / 10 / 25 / 50 USDT0 = 0.000292 / 0.000526 / 0.000879 / 0.000310 HYPE, the two 0.05 pct pools 0.000147 and 0.000163 at 5 USDT0. SUCCESS 0x7b738d5f4ce434f764e280e088e749bba83e6a65050248ffc87b3b3421c6412c (fork block 51,397,090, 520,495 gas, 25 USDT0, minProfit = half the scanned gain): owner native +0.000878685 HYPE before gas, +0.000320322 after the fork's gas fee (the fork charged 1.07 gwei; mainnet was at 0.1 gwei), owner USDXL dust +228,217,173,368 wei, executor holds 0 native / WHYPE / USDXL / USDT0, GSM allowance 0. Reverts: non-owner 0x4a247f2fc857d3e8ab84b86bcb08231838a37ea90c3192235478fff6018803f9; minProfit 10 HYPE 0x6be5aceb4198f3738f8e54928954e931a603dc2892e3f95057c22c2faecb4459 (643,716 gas); the same run again, gap closed on that pool 0x6b74f5a604a4d7f80f1bbda03ecc24c32afe78e2649c428dd243e3b2aaa5ff5c (scan after: 0.000002 HYPE there); a pool with nothing to take (0.01 pct pool, 10 USDT0, minProfit 1 wei) 0x2e40cf718bd37d43767539c3eeb17881612a6fbe02b70602ad99ba017b148883. (2) `proof.py 51779360` -> proof.json, parent of incumbent tx 0xc2075c57... (block 51,779,361): scan 0.000339 HYPE at 25 USDT0, SUCCESS 0xa307a97799870d742c13bb77706ac5902041a35463bdca51675bf5c00605eaa3 (522,149 gas) owner +0.000339058 HYPE before gas; gas there was 2.5 gwei, more than the gain, so the bot's gas test would not have sent; the incumbent's take one block later was larger (0.0925 USDT0 at tx index 2). selftest.py (selftest-result.json): the bot's hand encoder equals cast's bytes for run() and scan(), selectors and the BuyAsset topic equal cast, the paper runtime equals eth_getCode of the fork deployment (5,928 bytes); through the relay with the code override scan() answered for all 25 candidates in 0.16 s (no gap open at 23:57Z); evaluate() on a fake gain ends in simulate_revert at the exact-bytes check. series.py -> series.json is the window measurement."
awaited_events: "No single event: a gap opens when someone sells USDXL into one of the five USDT0/USDXL pools (0xb814a0d1, 0xb8c413eb, 0xbed33b68, 0xea1694eb, 0x4bd892af). The bot polls scan() every 30 s and acts when the best candidate's gain exceeds 1.1 x its gas cap. Last taken by others: block 51,794,785 (2026-11-20 about 19:20Z), 25 takes in the 24 h before; bursts on 11-15/16 (36 takes) and 11-19/20, two quiet days between. The next one is expected within a day."
good_signs: "logs/bot.jsonl: a poll heartbeat every 20 min; opportunity_skip or opportunity + paper_sim rows on days when others redeem at the GSM; live: send_result rows with result won and gas_used about 520k."
bad_signs: "loop_error on every poll (a pool or the GSM changed, or the node stopped accepting the code override); read_budget before 23:00Z; no opportunity or opportunity_skip row for 3 days while the GSM still emits BuyAsset from others (the bot's sizes or pools no longer fit); live send_result lost on every send with blocks_after_winner >= 0 (always late: report as blocks late)."
rpc_reads_per_min: "2 (one eth_call per 30 s) plus about 4 reads per evaluated gap"
alchemy_cu_per_day: "about 75,000-96,000 (0.040-0.051 USD): 2,880 scan polls x 26 CU = 74,880, plus about 90 CU per evaluated gap; hard cap 96,000 relay CU/day in code, then it sleeps to 00:00 UTC. No feed filter."
legal_note: "Peg arbitrage through the protocol's own public redemption: GSM.buyAsset is the documented, role-free stability-module function (the GHO GSM design) and pays the protocol its 1 pct fee on every redemption; the pools are public. The bot reads mined state only, watches no mempool and no pending transactions; it may bid a priority fee for a public opportunity. It only buys USDXL where it is under the redemption floor, which moves the pool back toward the peg."
