id: trial-aeb-migrate-avalanche
author: builder/claude-mythos-5-2
chains: [avalanche]
strategy: "trial: old Avalanche bridge tokens (2020 AEB USDT, DAI, ETH, WBTC, LINK, AAVE) bought with flash-swapped WAVAX on their stale V2 pools, migrated 1:1 into the .e token with the public BridgeToken.swap(token, amount), and the .e token paid back to the flash pair, all in one transaction"
copied_from: "executor 0xd1f6ca075b345c3532ee3957f0a32a0a0c881449 (EOAs 0x644e5b7c.., 0xaee4b193.., 0xd312427b..; take 0x5b110b1411... at block 100,875,860 reproduced on the fork within 0.001 pct of what the incumbent kept; tx 0xe607270da9cd76535c87433947516cf3198c1f1e082d4cdca1c4f8091a47eec4) and executor 0x777e0fc6d730cc42b853dc66e9fa1d8700000000 (tx 0xcaaab2f32b513a96ab66fa8daba1b63543dc990d086672a01409ba829cfedf40)"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "MigrateArb.take reverts NoProfit unless the wrapped-native balance grew by minProfit, and the bot sets minProfit = this send's gas cap (contracts/src/MigrateArb.sol take(); bot.py check(): gas limit x maxFee below 0.95 USD at the pool AVAX price x 1.15, gas limit at most 600,000, maxFee at most 60 gwei, send only when the simulated gross is above 1.3 x the gas cap). A lost attempt costs gas only (166,058 gas on the fork). Priority fee bid: at most 10 pct of gross, never above 3 gwei"
expected_value: "56 takes by two operators between 2026-11-20 12:22Z and 11-21 06:12Z (kept median 0.0135 WAVAX = 0.09 USD, gas median 0.0046 AVAX), 199 migrations on 15 of the last 31 days: class gross about 1.5 USD a day, in bursts when AVAX makes a new low against a token. The gap stands 20-200+ s before the incumbents take it (they wait for about 3-4 x their gas); the bot sends at 1.3 x its gas cap, so it aims at the first slice of each burst: honest expectation 0.1-0.5 USD a day on burst days, 0 on the others. No gap is open at placement (AVAX is 8-30 pct above the old pools' levels)"
executor: scratch/trial-aeb-migrate-avalanche/contracts/out/MigrateArb.sol/MigrateArb.json
executor_args: "{bot}"
executor_note: "constructor(owner) only; pairs, tokens and amounts are call arguments; the flash callback (joeCall / pangolinCall / uniswapV2Call) accepts only the pair set for this transaction and cleared at its end; the approval of the old token to the .e token is the exact amount and reset to 0; profit is unwrapped and paid to the bot wallet as native AVAX; probe() is an owner-only eth_call helper. Creation code 5,122 bytes"
fork_evidence: "scratch/trial-aeb-migrate-avalanche/proof.py (reset 100,875,859 = parent of incumbent take 0x5b110b14..., result proof-result-100875859.json): success 0x7c2b3da758a9a2da796152ed0036b42d5a57731a70246d939cd61857d119da79 in fork block 100,875,863, 256,361 gas, executor paid the owner 0.007532602228502984 AVAX (equal to the probe and to the bot's off-chain math; owner native delta +0.001123577 AVAX after gas at the fork's 25 gwei); guard revert NoProfit 0x172bbb2ed230ef09862923c2f7fc23c248f3e7ac698ad43b597f74b4bb761597 (owner delta = gas only); non-owner revert NotOwner 0x90f70aade02fdbd42453f4fe6e91f7ada2c3b0632978fafc3c52c37e11d0e0e6; repeat with nothing left to take reverts 0xefab211b1befa75db6487946f76ee9fe77098cf391e01bcc3ada9e26ecf7376b (166,058 gas); executor holds nothing after, allowance 0. Second run proof.py 100906874 (parent of incumbent DAI take 0x40d1bf43..., flash from the Pangolin DAI.e pair, so the pangolinCall callback; proof-result-100906874.json): success 0xb331120af564893032040881ada8d76b85c26460c055b6d80edae511ac9dfb79 paid the owner 0.007816848079039942 AVAX (owner delta +0.001322798 AVAX after gas), guard 0x79df980f52564daf75233f4b1a8dc6f9c7ae97179c66cd7eebd924319448f72a, non-owner 0x248d3b71a1b3351e5d106388750fec4f226d3e8c878020a963f1c156780ffd66, repeat revert 0xc7d77be0a6cd55a6a5b6cc773e187c1cc2fe9d8462fd12d3e9bf8603d3fd5fae. selftest.py: paper code override returns the same gain at that block through the relay"
awaited_events: "AVAX falling below an old pool's price (USDT pools about 6.13 USDT per AVAX, DAI 5.89, against 6.63 on the .e pools at 2026-11-21 15:51Z; ETH, WBTC, LINK, AAVE pools 10-30 pct below their .e pools). Last takes: 2026-11-21 06:12Z (USDT), 05:5xZ (DAI). Next: whenever AVAX revisits those lows; not predictable"
good_signs: "send_result won; opportunity lines whose gross passes the send line minutes before an incumbent migration"
bad_signs: "send_result lost with winner_block equal to or just before send_block every time (the incumbents lowered their threshold); calc_gain_not_on_chain lines (a pool fee assumption is wrong); no opportunity line for days (AVAX stays above the old pools' levels: the class is idle, not broken)"
rpc_reads_per_min: 1.5
alchemy_cu_per_day: 56200
legal_note: "BridgeToken.swap is the bridge's own public 1:1 migration from the old token; the bot buys the old token on public pools and migrates it, an ordinary price-gap arbitrage. No mempool use, no other user's transaction involved"
expedite: false
