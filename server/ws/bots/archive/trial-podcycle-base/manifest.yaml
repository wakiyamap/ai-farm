id: trial-podcycle-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: Peapods leftovers on Base after each CoW TWAP fill on the PEAS/USDC pool: the pool cycle WETH to pJailbrkPE to PEAS to USDC to WETH through the pod's two Aerodrome V2 pairs, and the bond round trip WETH to FUEGO to pFUEGOx to PEAS to USDC to WETH (flash WETH, six routes, one executor call)"
copied_from: "Pool cycle: executor 0xe143175ee1e7aee3639c08f5e57dad0d9e964eb5 (tx 0xd18aa9651d0c714201bfdf14219d1a0e1a0c6f1b751421b89b65c612612f861a, +0.0000943 WETH) and 0x57266d6c36f7bd64325f86a5209d3b150c2f8b0a. Leftovers and bond round trip: the rotating self-call accounts (tx.from = tx.to), e.g. 0x5bfa9d4964710d3f448d3f7251aec8fa729151c7 (tx 0x2bb37ee4544cd12dd743796da242827c277a66703e1bf4b766c94cb69e2da578, +0.000028 WETH) and 0xa96bdff9085de0920631ab7e4ed7cdfc89159f84 (tx 0xf6776a2f8801094a44bb867046dfaaa743fde1f96dcdcc604939168def89ffb2, +0.000026 WETH)"
capital_usd: 0.75
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Same mechanism as the live sibling trial-peapods-arb-base. Base charges the L1 data fee and the operator fee at inclusion and no signed field bounds them, so the worst case of one send is the bot wallet's native balance, kept under 1 USD: capital_usd 0.75, all native, no top-up, and bot.py:354 (live branch of take(), wallet_bound() at bot.py:240, WALLET_MAX_USD bot.py:90) refuses to sign while balance x ETH/USD is 0.95 USD or more. Inside that bound a lost attempt costs gas only: PodArbTake.sol:71-79 run() is owner-only and reverts NoProfit unless the executor's WETH balance grew by minProfit after the Balancer flash loan was repaid (minProfit 0 refused), then unwraps the gain and pays the bot wallet native ETH. A send needs simulated gain above the signed cap (bot.py:324 cap = gasLimit x maxFeePerGas + L1 allowance, bot.py:334 skip when gross is not above it, bot.py:326 minProfit = cap + 1), refused when the cap is 0.90 USD or more at a 4,000 USD/ETH reference (MAX_TX_USD bot.py:94). Priority fee bid: at most 20 pct of the simulated gross (TIP_SHARE_PCT bot.py:103), between 0.0001 and 0.05 gwei."
expected_value: "Trial: send-measured win rate. Competition 2026-11-22 (README table; scratch/trial-podcycle-base facts.json, trigger.json, fuego.json): 104 pool-cycle takes a day on pJailbrkPE; of the last 45 the first take comes 0 or 1 block after the CoW TWAP fill (12 of 12 fills), by 0x57266d6c (tip up to 0.142 gwei, about 70 pct of the gain) and 0xe143175e (tip 0.001 gwei, same block): out of reach. The bot aims at the leftovers one slow operator takes 12-170 s later at a 0.002 gwei tip: 8 in 4.67 h (pool cycle and pFUEGOx bond together), about 41 a day, 0.00002-0.00005 WETH each, about 2.1 USD a day in total; the pFUEGOx bond takes of 0x949a7a7c (26 in 13.3 h, 0.000002-0.000033 WETH) come 1-6 blocks after the fill. Aim: a third of the leftovers, about 0.7 USD a day gross; the result that matters is the win rate at a 3 s reaction on a feed trigger."
executor: scratch/trial-podcycle-base/contracts/out/PodArbTake.sol/PodArbTake.json
executor_args: "{bot}"
executor_note: "PodArbTake.sol, byte-identical source to the executor of the live trial-peapods-arb-base (sha256 835323403217bcbf...), compiled in this bot's own scratch directory. Constructor takes only the bot owner. run(vault, weth, amount, steps, minProfit): the flash lender, the flash token, every pool, pair and pod are call arguments (step list: UniV3-style swap, V2-style swap, pod bond, pod debond, ERC4626 deposit / redeem); each step spends the executor's whole balance of its input token. probe() is for eth_call only (owner-only, every trial reverts). The Balancer callback and uniswapV3SwapCallback (called by the Uniswap V3 and the Aerodrome Slipstream pools) check msg.sender against the lender / pool set for this call and cleared after it. Approvals are exact and reset to 0; no setup tx; run() reverts Leftover when any step token stays in the executor. A V2 step reads reserves after its transfer and prices what actually arrived, so the pod's transfer fee is paid, not bypassed (no Router02 recipient route; human decision 2026-11-21). Live code reads EXECUTOR_ADDR_BASE or EXECUTOR_ADDR only; paper mode uses a code override taken with eth_getCode from the Base fork deployment (executor-runtime.hex)."
fork_evidence: "scratch/trial-podcycle-base/proof.py 60623884 proof-result-60623884.json (one Base fork lease: reset, deploy the artifact with --args, fund, non-owner, guard, success per route, leftovers, repeat, release). Reset 60,623,884 = the block of the CoW TWAP fill before incumbent take 0xd18aa965 (block 60,623,885). Non-owner revert NotOwner 0xd3d3266e70e340676fcb37462cea90e410c34ddc4e9b4fbc4ab2ba1fee280b18. Guard revert NoProfit (minProfit 1 ETH) 0x4ff53d85c057c4aa7c4fa78a331df1ef963d2308cb2f7e95e942a71e622c5528, 812,628 gas, owner -0.0000813 ETH at the fork's 0.1 gwei. Success jb_fwd at 0.003 WETH 0xe4763b0d7227ec670e871873308965fb4b5b224e83913f3c5ac99cb83a89af6b fork block 60,623,888, 671,079 gas, gross +0.000104869 ETH, owner +0.0000378 ETH net of gas at the fork's 0.1 gwei. Success jb_fwd_slip 0xba8b3c6e2c2c3deed949a691f33699d7b467ab3d286468555742120a2c37412e gross +0.0000389 ETH; fuego_bond 0x5e5c92bf3c13773cd3c0dfc25ad1baddd490e0e03de8b6035ecbd0207d6cee92 gross +0.0000337 ETH; fuego_bond_slip 0x88a6ddf10fb9baa2d0efc2592a1a8a59c8804299acacb2088c75ebbd5b802fd9 gross +0.0000171 ETH (these three net negative at the fork's 0.1 gwei gas price; at the live 0.005 gwei base fee the gas is about 0.000004 ETH). Executor balances (native and 6 tokens) and allowances read right after each success: all zero; the repeated call reverts each time. jb_rev and fuego_debond show no gain at this block (no success tx for the mirrors). selftest.py 60623884: the bot's hand ABI encoding of run() and probe() equals cast, and its own check() at that block logs paper_sim success (fuego_bond_slip at 0.002 WETH, gross 0.000127 ETH, cap 0.0000365 ETH; selftest-60623884.jsonl)."
awaited_events: "Feed /logs/base: Swap (topic 0xc42079f9...) of the Uniswap V3 PEAS/USDC pool 0x8f8184bb6d3817910bc2ef91a393d2fe3ca8d774, plus a 60 s timer. The CoW TWAP fill arrives about every 864 s (last seen block 60,662,754, 2026-11-22 about 04:53Z); each is followed by takes in the same or next block and, about 8 times in 4.67 h, by a leftover take 12-170 s later. Next: within 15 minutes for as long as the TWAP order runs; when it ends the gaps come only from ordinary PEAS trades."
good_signs: "opportunity and paper_sim rows with gross_wei above gas_cap_wei some seconds after a pool swap; live send_result won with positive net_wei."
bad_signs: "No opportunity row in a day (the fast executors leave nothing above the cap, or the TWAP order ended); every send lost with blocks_after_winner of 10 or more; opportunity_skip wallet_at_or_above_usd_bound or wallet_below_gas_cap; repeated simulate_revert, estimate_revert, feed_error, read_budget or loop_error rows; the pods' pairs losing their liquidity."
rpc_reads_per_min: "1 on the timer (one probe() eth_call every 60 s covers all six routes) plus one probe per feed trigger (at most one per 3 s, about 400 a day); a route that shows a gain adds 1 eth_getBlockByNumber, up to 3 eth_call, 1 eth_estimateGas, 1 guarded eth_call, 1 slot0 eth_call and (live) 1 eth_getBalance."
alchemy_cu_per_day: "Timer 1,440 x 26 = 37,440 CU; feed-triggered probes about 400 x 26 = 10,400 CU; sweeps about 200 CU each; about 50,000 relay CU per day (0.03 USD at 0.53 USD per million CU), code cap 90,000. Feed CU for about 400 logs a day is metered by the feed."
legal_note: "bond() is the public mint entry of a Peapods pod and the swaps are ordinary pool trades that pay every fee, the pod's transfer fee included (no fee-bypass route; human decision 2026-11-21): arbitrage that brings the pod pairs back in line after a trade. The bot reads confirmed state only, watches no pending transactions, reacts to no one's unconfirmed order, and bids a priority fee only for its own public arbitrage."
expedite: false
