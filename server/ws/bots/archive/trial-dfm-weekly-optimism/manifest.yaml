id: trial-dfm-weekly-optimism
author: builder/claude-mythos-5-2
chains: [optimism]
strategy: "trial: defi.money PrimaryFeeAggregator.processWeeklyDistribution() on OP Mainnet pays its caller 10 MONEY once per protocol week (weeks start Sunday 12:00:00 UTC); one executor transaction moves accrued fees in (public withdraw_profit and transferToAggregator), calls it, sells the 10 MONEY for USDC on the Curve USDC / MONEY pool and reverts unless the bot's USDC grew"
copied_from: "0x953c1ba7029c92741a1739dcd18a8a462109b618 (EOA) and its contract 0x67807260e87d4f9560a3ba1703600eac66d5aaa7, tx 0x5b761cadd2d322f0db953a88918221b9cd07bbe2f7924e44b94ab72386226f21 (2026-11-22 12:00:13 UTC, same three calls, 10 MONEY sold through an aggregator for 9.97 USDC); earlier callers 0x9edd211b2deb6176e19e4931dda3441171bfd35a (3 takes), 0x00bfd5004d8503007c007bfb7500158500f90052, 0x4a00e700c0005610c9e0c0000040126e55007821"
capital_usd: 3
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "WeeklyCaller.run reverts with NoProfit unless the owner's USDC balance grew by at least minProfit (scratch/trial-dfm-weekly-optimism/contracts/src/WeeklyCaller.sol:75-77), so a lost send costs gas only. bot.py check() sends only when the simulated USDC gross is above that send's gas cap (gas limit x maxFeePerGas + twice the OP L1 data fee, valued at 4000 USD per ETH: bot.py:244-254), refuses a cap of 0.95 USD or more and a gas limit above 2,500,000 (bot.py:249), never signs above 2 gwei (bot.py:233) and sends at most 3 times per protocol week (bot.py:59). Bid: a fixed priority fee of 0.005 gwei (bot.py:60), never raised = at most 0.031 USD at 4000 USD per ETH and a 1.54M gas limit, under 0.5 pct of the 9.9 USD gross."
expected_value: "Trial, the win rate is what it measures. One window per week, about 9.87 USDC gross, gas under 0.01 USD. The bot's exact transaction simulated at the first block of each of the last 9 protocol weeks (118-126) returns 9.80-9.94 USDC every time (scratch/trial-dfm-weekly-optimism/weeks.py, weeks-result.json). Incumbents took 6 of those 9 weeks, 13 s, 35 s, 41 s, 249 s, 2.7 h and 10.3 h after the week start (three callers; four over 13 weeks), and weeks 122, 123 and 124 were never taken at all. The bot simulates once a second from the week start and sends in the first block where the simulation passes, about 2-4 s after it. If it wins every week: 1.41 USD a day; a third of the weeks: 0.47 USD a day. Last 7 days: one paid take, 10 MONEY (9.97 USDC) for 0.005 USD of gas."
executor: scratch/trial-dfm-weekly-optimism/contracts/out/WeeklyCaller.sol/WeeklyCaller.json
executor_args: "{bot}"
executor_note: "WeeklyCaller(address bot): owner-only run(preTargets, preSelectors, aggregator, stable, pool, i, j, usdc, minProfit). No stored targets and no setup transaction: every address is a call argument. Approves the pool for exactly the MONEY received and resets the approval to 0 in the same call. Has receive() because the aggregator refunds unused native to its caller (the bot sends none). Deploy gas on the fork about 0.6M. Paper code override: executor-runtime.hex = eth_getCode of the fork deployment 0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352 (owner 0xc0ffee0000000000000000000000000000000321)."
fork_evidence: "scratch/trial-dfm-weekly-optimism/proof.py (one lease: reset to 159875017 = parent of the incumbent's take, deploy, fund, calldata equals cast, non-owner, guard, success, repeat; result in proof-result-159875017.json). Success 0x73b94e3d33a3ee2f94f7d13f2ed7b015bc77d92ba19afe367757a001990118a9 (fork block 159875021, 979,995 gas): owner USDC +9.891487, lastDistributionWeek 125 -> 126, executor left with 0 native / USDC / MONEY and 0 allowance. Guard 0x81fd9fa14f350c56a91d7c476d54266856dc89536fff7389db8de1392ebca714 (minProfit 1e24): revert NoProfit(9891487), owner USDC delta 0. Nothing to take (same call again, the week is distributed) 0x690f1bf7f4ca520e890f81c9dcea60deeed8417affade573ade03c3dcbb25f59: revert 'DFM: Already distro'd this week', USDC delta 0. Non-owner 0x8b93ba76ac4d6ad5b6face657c829575edfc603cdb190ef8c14a0f07661234d4: revert NotOwner. Paper path: scratch/trial-dfm-weekly-optimism/selftest.py (the bot's own eth_call with the code override: 9.891487 USDC at block 159875017, 0 at 159875018 and at head)."
awaited_events: "The start of each protocol week: Sunday 12:00:00 UTC (week n starts at 1719144000 + n x 604800). Last: week 126, 2026-11-22 12:00:00 UTC, taken 13 s later by 0x953c1ba7. Next: week 127, 2026-11-29 12:00:00 UTC (after the trials' close on 11-24: see README). If the week start passes with nothing to distribute, any later moment in that week when the simulation turns positive."
good_signs: "A paper_sim line (paper) or a send_result won line (live) within seconds of a Sunday 12:00:00 UTC; wait lines with distributed=true during the week."
bad_signs: "send_result lost with winner_block at or before our send block (an incumbent now sends in the first block); check lines with result nothing through a whole week (the aggregator, the pool or the incentive changed); loop_error or read_budget lines; signer_reject."
rpc_reads_per_min: 0.2
alchemy_cu_per_day: 4000
legal_note: "processWeeklyDistribution() is documented in the verified source as unguarded with a caller incentive ('The caller receives a stableCoin incentive of callerIncentive'); withdraw_profit() and transferToAggregator() are public fee-moving functions the incumbent calls the same way. No mempool watching, no other user's transaction is involved, plain Curve swap of the bot's own 10 MONEY."
