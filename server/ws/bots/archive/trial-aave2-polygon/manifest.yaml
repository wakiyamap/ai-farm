max_loss_guarantee: "Executor TrialAave2Liquidator.sol:72 reverts NoProfit unless the native-USDC balance grew by at least minProfit (and :68 when the debt-token surplus is not positive), and :74 pays the whole gain to the bot as USDC in the same tx, so a lost attempt costs gas only. bot.py:385 sets the fee ceiling so maxFeePerGas x gasLimit < 0.90 USD at the Aave oracle POL price (never above 20,000 gwei), :394 requires simulated gross > that signed gas cap, and :399 sets the on-chain minProfit to the gas cap. Priority fee bid is at most 50% of the simulated gross (BID_SHARE, bot.py:386); a bid under Polygon's 30 gwei minimum tip is not sent (:388). No principal: the cover is a Balancer V2 flash loan repaid in the tx; the bot wallet holds POL for gas only (10 USD)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7 d to 2026-11-18 08:43Z (attempts:2065, scratch/aave2-l2/polygon-logs-7d.json, blocks 97,120,774-97,523,974): 266 LiquidationCall events in 167 txs by 11 liquidator addresses (0x5ac9bc14 198, 0x83379b15 26, 0x953c1ba7 19, 0xc36d7053 12, 0xc2fa2aa3 4); 260 have USDC.e, USDT or DAI debt, cover sum 4,395 USD (median 0.57, p90 14.8, max 1,867; 42 events >= 5 USD, 23 >= 20). Of the 45 events with cover >= 3 USD, 38 flipped inside the capture block and 7 were under water at the parent block (56 USD of cover, about 3 USD of bonus per week). The bot aims at that parent-underwater share and at dust-to-small positions that stay under water for minutes (sample: 30 to 3,000+ blocks, taken with 26-30 gwei tips); the two proof cases paid 0.584494 and 0.338761 USDC for about 0.017 USD of gas each. Expect cents per day at best; the point is the measured win rate on a frozen market."
executor: scratch/trial-aave2-polygon/contracts/out/TrialAave2Liquidator.sol/TrialAave2Liquidator.json
executor_args: "{bot}"
executor_note: "Owner-only liquidate(vault, job, cover, minProfit). Pool, borrower, collateral, debt token, swap router, both UniV3 paths, the payout token and the flash lender are all call arguments; constructor takes the bot address only; no setup transaction. The Balancer callback receiveFlashLoan accepts only the lender set for the running call (cleared at the end) and a single-token loan of the job's debt token. Approvals are exact and reset to zero (pool, router); the loan is repaid by transfer inside the callback. The bot always passes payToken = native USDC 0x3c499c54, so profit leaves as USDC. Live address from EXECUTOR_ADDR_POLYGON or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-aave2-polygon/proof.py (lease, then per case: reset, deploy artifact, fund owner, non-owner, guard, success, exhausted; release; output proof-result.json, PROOF OK). Case A, reset polygon 97322807 = parent of the historical capture 0x82684b81... (borrower 0x4ac2c59a..., WETH collateral, USDC.e debt, HF 0.99921): success 0x7f7e7aacc6637a057b31e6fbd71af4957376e3670f406220880f53e910d06e7f block 97322811, gas 912041, owner +0.584494 USDC, native -217807203845061038 wei (gas), borrower HF 0.99921 -> 1.263, executor balances and pool/router/vault allowances all 0. Correct reverts: NoProfit guard 0xd8f5224bc8a79f447b494bf34eae947d190427b44cfec518ac35bd40c8a04be3 (0xe39aafee, owner USDC delta 0); non-owner 0x581cd5d8ba1880aa063404aee1774eaee92dba4df7d79d4f90466f049c7fb2f9 (NotOwner 0x30cd7471); nothing left to take 0x68ad8943c8b61b8749a0c3d8a35dee1b8502975bc132a2b62cff0982398ea064 (second call after success, Aave error string 42, owner USDC delta 0). The success lands at parent+4 because deploy and the two guard sends consume fork blocks. Case B, reset 97229269 = parent of 0x98b1af7f... (borrower 0x007e0e87..., USDC.e collateral and debt, HF 0.99991): success 0xa93b860ab2b50103231a27d7eae739075ff438d92c897ff0c5f32915dccc6aea block 97229271, gas 681074, owner +0.338761 USDC; second call 0xc1a8dfd0183f7ea3d46383eae525fe612f0d2bde22b15b5a3778712c5d271382 reverts 42. scratch/trial-aave2-polygon/selftest.py (selftest-result.json): bot calldata equals cast calldata for both cases; relay eth_call at the two parent blocks with the paper code override returns 0.584494 and 0.338761 USDC; the bot's own attempt() pinned to those blocks logs an opportunity and paper_sim for each."
awaited_events: "Aave v2 LendingPool 0x8dff5e27ea6b7ac08ebfdf9eb090f32ee9a30fcf LiquidationCall on the feed (about 38 per day over the last 7 days, 20 per day over 45; last one in the census at block 97517386 on 2026-11-18); every such event triggers a scan of the near-HF list. Safety scan of the near list about every 60 s, full universe hourly, new users from the pool's logs every 10 min. Next occurrence is not predictable for price-driven positions; same-asset positions cross HF 1 by interest alone."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is)."
bad_signs: "No opportunity row in 7 days; every send lost by many blocks; simulate_revert on every underwater user (routes); read_budget rows (75k CU cap hit); bid_under_min_tip or gross_not_above_gas_cap on every case (only dust is left); universe shrinking to nothing (the seed is only users liquidated in the last 45 days)."
rpc_reads_per_min: "about 1.2: one Multicall eth_call per minute (near scan), 1-2 per hour (full scan of the universe in batches of 200), one eth_getLogs + eth_blockNumber per 10 min, plus up to about 12 calls per detected opportunity (one simulation per route, at most 3 routes per pair; debts of 2,000 USD or more: up to 6 sizes per route)"
alchemy_cu_per_day: "about 49,000 relay CU/day (near scan 1440 x 26 = 37,440; full scan 2 x 24 x 26 = 1,248; discovery 144 x 70 = 10,080) plus feed about 8,000 (38 events/day and idle long-polls) = about 57,000 CU/day = 0.03 USD/day at 0.53 USD per 1M CU. The code stops relay reads at 75,000 CU per UTC day."
legal_note: "Public Aave v2 liquidation bonus for repaying unhealthy debt, open to any caller. Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions. Bidding a priority fee for a public reward is in scope of the trial decision."
expedite: false
