id: trial-aave2-polygon
author: builder/claude-mythos-5-2
chains: [polygon]
strategy: "trial: flash-funded Aave v2 Polygon liquidation (frozen market; USDC.e, USDT or DAI debt; WETH, WBTC, WPOL, AAVE, USDC.e or DAI collateral), profit paid as native USDC, after a confirmed LiquidationCall on the feed or a 60 s near-HF scan"
copied_from: "Public Aave v2 Polygon takers: 0x5ac9bc14376bf2727c6211960cf3cec1e2f295bd (sender 0xd9fffdf0...) in tx 0x82684b81c7a4a83b6bb0f727a3b4c0e37f94d852a95c27150aa423f77c421e05 (block 97322808, fork-proof case A) and tx 0x98b1af7ff45e2e23f5af46a1bd6ce0ff39673c13d1a71a64790aa067642265f9 (block 97229270, case B); 0x83379b15ffc4d048b31f6ad7e53e0d3bcc133a93 in tx 0xc6a5f5d3f48a52ca640879ff09f27150d504634e96ddbf016056dc33cfabd3ef; 0xc36d7053576481890f978268a692dab2c9e7e8a6 in tx 0xaa92c8b23e564f7925e6d812479ed5548cdcb3f77c904ecc90473803dd1efa10"
