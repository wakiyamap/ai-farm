max_loss_guarantee: "Enforceable bound per send: Base charges the L1 data fee and the operator fee at inclusion and no signed field bounds them, so the worst case of one send is the bot wallet's native balance, and that balance is kept under 1 USD. (1) Funding: capital_usd 0.75, all native, no top-up. (2) Code: bot.py:319-334, live branch of take(): right before the signer call it reads ETH/USD (eth_usd(), bot.py:211, slot0 of the Uniswap V3 WETH/USDC 0.01 pct pool, refused outside 300-20,000) and the wallet's eth_getBalance, and wallet_bound() (bot.py:221) refuses the send while balance x price is 0.95 USD or more (WALLET_MAX_USD, bot.py:75); it logs opportunity_skip and never signs. Inside that bound a lost attempt costs gas only: RTokenNavTake.sol:67-75 run() is owner-only and reverts NoProfit (line 70) unless the executor's WETH balance grew by minProfit after the Balancer flash loan was repaid (minProfit 0 is refused), then unwraps the gain and pays the bot wallet native ETH; no principal leaves the wallet. Expected cost, not the bound: bot.py:285-339 take(): gas limit = eth_estimateGas x 1.20 + 100,000 (line 295, refused above 3.0m), tip = min(0.05 gwei, 20 pct of the simulated gross / gas limit), at least 0.0001 gwei (line 296), maxFeePerGas = latest base fee x 1.05 + tip (refused above 0.1 gwei), cap = gasLimit x maxFeePerGas + 1e11 wei L1 allowance (line 298), sent only if the simulated gain is above the cap (line 308) with minProfit = cap + 1 (line 300) and the exact guarded call simulated at the signed gas limit; refused when the cap is 0.90 USD or more at a 4,000 USD/ETH reference (line 304); typical cap 1.9e13 wei = 0.03 USD. Priority fee bid: at most 20 pct of gross (tip x gas limit), passed explicitly to the signer (line 247)."
expected_value: "Trial: send-measured win rate. Competition, 7 days to block 59,948,000 (scratch/r2f4e/rtlogs.py, rtlogs.json): 457 bsdETH Redemption and 68 Issuance events; redeems per day, newest first, 23 / 16 / 4 / 95 / 178 / 75 / 67; two are user exits (1,198.6 and 21.4 bsdETH), the rest 0.03-1.1 bsdETH round trips by at least eight executors (0xe6b032b4 108 redeems, 0xc12392e7 51, 0x0000000000be226a 27, 0x1bad7ff3 18, 0xd119df50 13, 0x955cc3ae 12, 0x8957fac0 10, plus throwaway contracts deployed per take by EOA 0xab36085a). Newest 40 arbitrage redeems (blocks 58,700,872-59,798,764 = 2.5 days; scratch/trial-rtoken-nav-base/series.py, series-windows.json): WETH kept by the taker median 0.0000141 (0.024 USD), p90 0.0000652 (0.11 USD), 12 of 40 show none in WETH; fee median 0.0000143 ETH (1.30M gas), priority fee 0.00009-0.154 gwei (p10 0.00025, median 0.001, p90 0.013), tx index 2-171 (median 19). Blocks to take: this bot's own route probed with a code override before each of the 40 takes shows a gain above its gas cap (1.8e13 wei) at the parent block for 29, 1 s before for 24, 3 s before for 18, 10 s before for 15, 30 s before for 9. So about 7 takes a day stand 3 s or longer above the cap, median gain 0.0000259 WETH (0.045 USD) before about 0.000014 ETH gas: the bot aims at a share of those, a net of 0.01-0.05 USD per win, well under 1 USD a day in total. Paid entries in the last 7 days whose gross exceeds one attempt's gas: 0x4f1b188a... (+0.0000376 WETH for 0.0000128 ETH), 0xdbe5653a9b81a3c61ad30492a5aff1864868f551571078e1cf093565f524ebe8 (+0.0000750 for 0.0000124)."
executor: scratch/trial-rtoken-nav-base/contracts/out/RTokenNavTake.sol/RTokenNavTake.json
executor_args: "{bot}"
executor_note: "Adapted from the reviewed FolioNavTake executor of trial-folio-nav-base (same flash, probe-by-reverted-trial, profit check and strict cleanup), compiled in this bot's own scratch directory. Constructor takes only the bot owner. run(vault, weth, amount, steps, minProfit): the flash lender, the flash token, every pool, the RToken and the ERC-4626 wrapper are call arguments (a step list: 0 = UniV3-style pool swap, 1 = Solidly-style V2 pool swap, 2 = RToken redeem(uint256), 3 = ERC-4626 redeem); each step spends the executor's whole balance of its input token or share. probe(vault, weth, amounts, steps) is for eth_call only: owner-only, it tries each size through trial(), which always reverts (Trial(gain) or the underlying error), so nothing changes and nothing is paid even if it were sent. The Balancer callback and uniswapV3SwapCallback check msg.sender against the lender / pool set for this call and cleared after it. No approvals are given at all (V3 pools are paid by transfer in the callback, the V2 pool by transfer before swap, the redeems burn the executor's own shares). No setup tx. After the profit check run() clears the executor: _clear() sends any leftover of each swap's input token and of each redeemed share to the owner and reverts Leftover(token) when a balance cannot be read, when the transfer fails or returns false, or when anything is still held after it. Live code reads EXECUTOR_ADDR_BASE or EXECUTOR_ADDR only; paper mode uses an eth_call / eth_estimateGas code override taken with eth_getCode from the Base fork deployment (executor-runtime.hex)."
fork_evidence: "scratch/trial-rtoken-nav-base/proof.py (one Base fork lease: reset to block 59,670,349 = parent of incumbent take 0x37bcec7c..., deploy the artifact with --args, fund the owner, non-owner, guard, success, repeat; run 2026-11-20 about 12:52Z; proof-result.json, proof.log). probe() from the owner answers, from a stranger it reverts. Sweep by one probe eth_call: 0.01 WETH +1.452e13 wei, 0.02 +2.601e13, 0.03 +3.447e13, 0.04 +3.990e13, 0.05 +4.230e13, 0.07 +3.804e13, 0.10 +0.899e13, 0.15 reverts. Non-owner run revert NotOwner 0x77a11e7b01096ab99e00d09e886eab9ce2fd2013f7018156927da6b8b54ae219 (block 59,670,351). Guard revert NoProfit (minProfit 1 ETH, the revert data carries gain 4.23e13) 0xdde6a4b032e7666fb397a7272b2180994d24444e480a4eaa4a1a2aba7b43e6e2, block 59,670,352, 1,467,503 gas, owner -0.0000176 ETH (gas only, at 0.012 gwei). Success at 0.05 WETH 0xe1937143f472b9c4d8da85ea7a63d4c854ef5dfb282dcac493488b1f2717f4f4, block 59,670,353, 1,268,889 gas: owner native balance +0.000027068 ETH after gas at 0.012 gwei (gross +0.000042295 ETH paid as native; incumbent take 0x4f1b188a... three blocks after it, at 59,670,356, paid 0.0109 gwei all-in and kept 0.0000376 WETH). Right after the success the executor's native balance, its balances of WETH, bsdETH, wsuperOETHb, superOETHb, cbETH, wstETH and its allowances of those 6 tokens to the 6 step targets and the vault were read: all zero; the owner holds none of those tokens (nothing was swept as dust). The same call repeated right after reverts (0x93561b83989248d992b0b7bef8f26d0b79b94f84651edd58702379e19cc4cd83) and every size shows no gain in the sweep after it. The bot's own check() replayed through the relay (scratch/trial-rtoken-nav-base/selftest.py, which first checks both hand ABI encodings against cast): paper_sim success at 59,670,349 (0.05 WETH, gross 4.23e13 wei, cap 1.86e13), nothing_to_take at 59,667,349 (control, 10 minutes earlier) (selftest-*.jsonl)."
awaited_events: "Feed /logs/base on the bsdETH pool 0x6b87b8663ee63191887f18225f79d9eeb2de0d34, topic0 Swap(address,address,uint256,uint256,uint256,uint256) 0xb3e2773606abfd36b5bd91394b3a54d1398336c65005baf7bf7a05efeffaf75b (about 20-200 logs a day, the incumbents' takes included), plus a 60 s timer because basket-side price moves have no single event: each triggers one probe() eth_call. On gap, 429, 503 or timeout the timer keeps re-reading state. Last incumbent redeem take: block 59,798,764 (2026-11-20 about 04:50Z); 16-23 redeems a day in the last two days, 67-178 a day earlier in the week. Next: any time; at 12:50Z the gap was closed."
good_signs: "opportunity and paper_sim rows with gross_wei above gas_cap_wei; live send_result won with positive net_wei."
bad_signs: "opportunity_skip wallet_at_or_above_usd_bound or wallet_below_gas_cap (the 0.75 USD is spent: the trial is over), eth_usd_unreadable; only check rows with nothing_to_take for a week (bsdETH supply is down to 143 after a 1,199 bsdETH exit on 11-17: the pool may go quiet); every send lost with blocks_after_winner of 5 or more; repeated simulate_revert or estimate_revert; read_budget rows; loop_error rows from probe (a basket change: the RToken's basket gained a token the route does not sell, the take then reverts Leftover or NoProfit, so re-read BasketHandler.quote and add its pool; or RToken redemption paused / basket not ready)."
rpc_reads_per_min: "1 on the timer (one probe() eth_call every 60 s), plus one per bsdETH pool swap from the feed (about 0.02-0.15 a minute); a gain adds 1 eth_getBlockByNumber, 1 eth_estimateGas, 1 guarded eth_call, 1 slot0 eth_call and (live) 1 eth_getBalance."
alchemy_cu_per_day: "Timer 1,440 x 26 = 37,440 CU; feed-triggered probes up to about 200 x 26 = 5,200 CU; a gain about 110 CU; about 43,000 CU per day (0.023 USD at 0.53 USD per million CU), code cap 90,000 relay CU per day. Feed: one filter, under 2,000 CU per day."
legal_note: "RToken.redeem is the public redemption entry of a Reserve yield DTF and the swaps are ordinary pool trades: the arbitrage the protocol relies on to keep the token at its basket value. The bot reads confirmed state only, watches no pending transactions, and bids a priority fee only for its own public arbitrage; it moves no price for others to trade against."
