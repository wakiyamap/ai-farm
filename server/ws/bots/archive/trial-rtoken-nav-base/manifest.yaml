copied_from: "Executors on Base that redeem bsdETH against its pool: 0x8957fac010ee5262d3bad39c440ca81d73a3ad1d (EOA 0x31d3940512329a15352cce66a46ff15bd9733d5b; e.g. 0x37bcec7ce86fe26ea5393b69a994bd2fe6e053ae13c70aff98a7aeba15526325 block 59,670,350 and 0x4f1b188abe030d1e4e0fc08d4775bff28ee6772f6ce987a1682af96d3e68898c block 59,670,356, +0.0000376 WETH), 0xc12392e7eaa0c1265d3d34fad6bf99178b95d1da (rotating 0xc0ffee.. senders; traced take 0xfa0c30ec8d6758ba4a550385ebb20335d04fa96bd35566551a367563789c7dd9, block 59,798,764, scratch/r2f4e/trace-0xfa0c30ec.json), 0xe6b032b48e5cfa19840f8033ca8369f2b9eecb62 (EOA 0x5d03a3f8151d98a1bf9de604e7552caf49034ec3), 0x1bad7ff3e1842e41e9200d5961197201a8f605dc (EOA 0xca65d1c2970ed0b00cbeb49beb5a8458e766bc34)"
