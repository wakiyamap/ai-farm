id: trial-ryeth-arb-arbitrum
author: builder/claude-mythos-5-2
chains: [arbitrum]
strategy: "trial: Sommelier Real Yield ETH cellar on Arbitrum, public multiAssetDeposit of rETH (or wstETH) at the cellar's price-router value and public redeem for WETH in the same transaction, versus the Uniswap V3 rETH/WETH pool; one Morpho-flash-funded transaction"
copied_from: "EOA 0xf62b10b2... via contract 0x0b2d9635b6bb953d31891b8710c2bf549ce8de1e (take 0xc932a7594a8e367db89049ba7f8ed89f96424898c241a227861cf928e7d43d47, block 526,077,494, 6 WETH Balancer flash, 0.00305 WETH kept); EOA 0xab36085a... through a contract it creates per take (0xe7af5a330c8a9f124479d3a050ad2e0256f59ce18a35f279d4235192e5e70546, block 525,998,837, 2 WETH flash, 0.000543 WETH kept); account 0x953c1ba7029c92741a1739dcd18a8a462109b618 calling itself (0x0f08d461ed6f1848c8de17db580ac7ef1c9e87d9febe8e903ef686e559b10804 block 525,996,087 and a take in block 525,988,179)"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "StepArb.sol:108 reverts NoProfit unless the WETH balance grew by at least minProfit after the flash loan was repaid (and Morpho itself reverts when the loan cannot be repaid); take() is owner-only (StepArb.sol:57) and the flash callback accepts only the lender set for this call (StepArb.sol:124); the gain is unwrapped and paid to the bot wallet as native ETH in the same transaction. So a lost attempt costs only gas. bot.py check() and send_live(): cap = gasLimit x maxFeePerGas (gas limit = eth_estimateGas x 1.2, refused above 3,000,000; maxFeePerGas = base fee x 1.25, refused above 0.5 gwei), the send is skipped unless cap is under 0.95 USD at a conservative 4,000 USD per ETH and unless the simulated gross is above cap, and minProfit = cap, re-simulated at the signed gas limit before the send. Typical cap 0.000031 ETH = 0.06 USD (1,234,882 gas x 0.0252 gwei, selftest at head). Priority fee: none (0); Arbitrum orders by arrival and the bot never bids."
expected_value: "Trial: win rate measured by sending, no counted EV. Competition, last 7 days (blocks 523,717,125-526,117,125, the cellar's Deposit / Withdraw logs, scratch/rf1c5/ryeth_takes.py, ryeth-takes.json): 4 atomic takes, all in the last 9 hours, by 3 operators (0x953c1ba7 two, 0xab36085a one, 0xf62b10b2 one), sizes 1 / 2 / 2 / 6 WETH, kept 0.000543 and 0.00305 WETH on the two flash takes (what the two takes by 0x953c1ba7 kept was not measured; the bot's own probe one block before them shows 0.00285 and 0.00382 WETH available), gas 0.00005-0.0001 ETH a take, tx index 1-6, no priority fee. Windows (scratch/trial-ryeth-arb-arbitrum/series-windows.json, the bot's own probe at blocks before each take): a gain stood for at least 1 hour before every take (nonzero at every offset -0.25 s, -1 s, -3 s, -10 s, -1 min, -5 min, -10 min and -1 h; for three of the four also at -4 h); a 0.00091 WETH gain stood at block 525,000,000, three days before the first take; at head 526,117,993 (2026-11-21 03:10 UTC) 0.00095 WETH (about 1.7 USD at 1,800 USD per ETH) stands and has stood for 10 min or more. Not a speed contest: the bot polls every 120 s and aims at every gap above its gas cap; the four takes of the last 9 hours were worth about 0.010 WETH (18 USD) together."
executor: scratch/trial-ryeth-arb-arbitrum/contracts/out/StepArb.sol/StepArb.json
executor_args: "{bot}"
executor_note: "Same source as the executor of trial-xspace-arb-polygon (StepArb.sol, byte-identical copy). Constructor takes only the bot owner. take(lender, token, amount, steps, clear, minProfit, unwrap): the flash lender (Morpho Blue 0x6c247b1F..., 234 WETH at head, no fee), the flash token (WETH) and every step (target, token spent, spender, calldata) are call arguments; nothing is baked in and there is no setup tx. Steps here: SwapRouter02 exactInputSingle WETH -> rETH (0.05 pct pool) or wstETH (0.01 pct pool); cellar multiAssetDeposit(LST, whole balance, executor); cellar redeem(whole share balance, executor, executor). A step spends the executor's whole balance of its token, approves exactly that amount and resets the approval to 0. take() is owner-only and the executor holds nothing between transactions: the worst a bad route can do is revert. probe(bytes[]) is for eth_call only: owner-only, it tries each take() calldata through trial(), which always reverts (Trial(gain)). The Morpho callback checks msg.sender against the lender set for this call and cleared after it. After the profit check every token named in clear (rETH, wstETH, cellar shares) is sent to the owner (dust; zero in both fork runs). If the cellar ever pays a redeem partly in another asset, the WETH check fails and the take reverts. Live code reads EXECUTOR_ADDR_ARBITRUM or EXECUTOR_ADDR; paper mode uses an eth_call code override (executor-runtime.hex = eth_getCode of the fork deployment, owner 0xc0ffee...0321). Runtime 5,138 bytes, deployment about 1.2M gas, under the 3,000,000 limit."
fork_evidence: "scratch/trial-ryeth-arb-arbitrum/proof.py <parent block> (one Arbitrum fork lease per run: reset, deploy the artifact with --args, fund, probe, non-owner, guard, success, repeat, leftovers, allowances; calldata built by bot.py itself). Run 1, reset 526,077,493 = parent of the incumbent take in block 526,077,494 (proof-result-526077493.json): probe from the owner rETH 0.000482 / 0.000808 / 0.001214 / 0.001062 / 0 / 0 WETH at 0.5 / 1 / 2 / 4 / 8 / 16 WETH, wstETH 0; from a stranger it reverts. Non-owner take revert NotOwner 0xc4de9f680b20e4efab2894c3b1e29cee68ac55668c8becabcd8ab95f1ff77ace. Guard revert NoProfit(0.001214e18, 1e24) 0xb91faad0c5c7ced485afde315661a92db2f060f4a187c4f00fd794adc9b6e0e2, 989,854 gas, owner -0.000099 ETH at the script's 0.1 gwei. Success 0x25f997fb82fe1eb63f02370cb00b8489c80cff5034d08f3d54d1b4bf1f453df6 block 526,077,497, 829,360 gas, owner native +0.001131 ETH net of gas (gross 0.001214 ETH). The same call again with minProfit = the first gain reverts (0x626632dfe5037eeb3572f6f3948bc0f72994d2304188a2fc1bc2e9cb527c6c5f, Morpho 'transferFrom reverted': the gap is closed and the loan cannot be repaid); probe after: every candidate at 2 WETH and above is 0; executor balances 0 in native, WETH, rETH, wstETH, cellar shares; all four executor allowances 0. Run 2, reset 525,000,000 (three days earlier, no incumbent yet; proof-result-nogap-525000000.json, the file name is a misnomer: a gap stood there too): probe 0.000914 WETH at 2 WETH, success 0x289fb70fd0c63ef784aa84129749a819f9236f95c71109bfe3e03794813a4ab4 block 525,000,004, 829,154 gas, owner +0.000832 ETH net; repeat reverts 0x69fae482b2f5a5b4844503ae562e48f733ce8a286bb5740e04cb8c38e5b3b258; probe after 0 for 1 WETH and above; balances and allowances 0. The same non-owner and guard hashes appear in both runs because the fork sender, nonce and calldata are identical. The paper bot's own check() at head through the relay (scratch/trial-ryeth-arb-arbitrum/selftest.py, selftest.jsonl): opportunity and paper_sim success, gross 0.000950 WETH against a cap of 0.000031 ETH, gas estimate 1,029,069."
awaited_events: "No event: a 120 s timer. The bot waits for the rETH price in the Uniswap V3 rETH/WETH 0.05 pct pool 0x09ba302a... to sit below the cellar's price-router value by more than the pool fee and slippage. That was true at head on 2026-11-21 03:10 UTC (0.00095 WETH at 2 WETH), before each of the four takes of 2026-11-20/21 and at block 525,000,000 on 2026-11-18; it re-opens whenever rETH trades down in the pool or the cellar's rETH rate steps up."
good_signs: "check rows every 120 s; opportunity and paper_sim success rows with gross 0.0003-0.004 WETH above a cap near 0.00003 ETH (in paper the same standing gap is logged every poll, because nobody takes it there); live send_result won with net_wei positive."
bad_signs: "Every probe 0 for several days (the cellar is shut down, its withdrawable WETH is used up, or rETH deposits are switched off: alternativeAssetData(rETH) no longer supported); simulate_revert rows at the estimate step on every look; every live send lost with a winner_block just before send_block (the incumbents have started polling faster than 120 s); read_budget rows."
rpc_reads_per_min: "0.5: one probe eth_call per 120 s; a look that sees a gain adds 3 reads (block, estimate, guard simulation); live only, 2 follow-up probes after such a look."
alchemy_cu_per_day: "18,720 relay CU with no gap (720 probes x 26 CU); 66,240 CU when a gap stands at every poll, as in paper (720 x 92 CU): 0.010-0.035 USD/day at 0.53 USD per million CU. No feed filter. Code cap 95,000 CU/day."
legal_note: "Public deposit and public redeem of a vault at the vault's own published price, against a public AMM pool: arbitrage between the vault's deposit / withdraw price and the pool price, the class the human allowed for ICHI vaults in decisions/human/2026-11-21-ichi-yes-peapods-fee-no.md (item 1: a price-gap arbitrage, not an attack on vault accounting). No bug is used: multiAssetDeposit and redeem are the documented user functions, the deposit fee for rETH is set to 0 by the cellar's owner, and three unrelated operators do the same. No pending-transaction watching; the bot reads confirmed state on a timer. Reviewer: if this reading of that decision is too wide for a cellar that looks unmanaged (protocols:951: no adaptor calls in 7 days), send it back and write inbox/human."
expedite: true
