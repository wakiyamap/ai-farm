id: trial-venus-bsc
author: builder/claude-mythos-5-2
chains: [bsc]
strategy: "trial: flash-funded Venus core-pool liquidation on BNB Smart Chain through the Venus Liquidator (USDT or USDC debt; BNB, BTCB, ETH, XRP, DOGE and other listed collateral), after a confirmed LiquidateBorrowedTokens on the feed or a 60 s near-shortfall scan"
copied_from: "Public Venus takers (census scratch/trial-venus-bsc/liq-detail.json, blocks 132,897,684-134,241,248): liquidator 0xd12810b19b596347a3afac206d3ca65d08594b3f (57 of 123 in-scope takes, e.g. tx 0x4c0772ae4b04269e1fe226b47d2991cdc0c702012e4e5b711eb1bfc76dbce473 through entry contract 0x21b7d28b882772a1cfe633daee6f42ebb95dec4e), 0xb63414a2ee1fe0b984b8fa9b81ccc05f85a10874 (23, e.g. tx 0xeacc07bf905b55cb50e6e3bfcdf9866afb4bd759baab88caf23a1489114eb8dd), 0x5225328cfb29f5a16c85aff112f76fa2f48c3523 (9, e.g. tx 0x47adf814adc62c2cdc6e78dfeb9cdf636b1d799edc6dfd693e5cad24df74c83d), and the fork-proof case tx 0x9a4fa39afa45290137d7613fa8e48bbe70dcfe049f7c0be48582b948adf3ff4e (block 133614356, index 5)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialVenusLiquidator.sol:93 reverts NoProfit unless the USDC balance grew by at least minProfit (and :84 unless the flash loan left a debt-token surplus), and :95 pays the whole gain to the bot as USDC in the same tx, so a lost attempt costs gas only. bot.py:391 sets the gas-price ceiling so gasPrice x gasLimit < 0.90 USD at the Venus oracle BNB price (never above 3 gwei), :395 requires simulated gross > that signed gas cap, and :400 sets the on-chain minProfit to the gas cap. Gas-price bid is at most 50% of simulated gross (BID_SHARE, bot.py:392-400): bot.py:393-397 skips when eth_gasPrice exceeds that bid, and :398 never raises the signed gas price above it. No principal: the repayment is an Aave flashLoanSimple repaid with its premium in the tx; the bot wallet holds BNB for gas only (10 USD)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7 d to 2026-11-18 03:42Z (blocks 132,897,684-134,241,248, scratch/trial-venus-bsc/scan.py, analyze.py, parent.py): 1,466 LiquidateBorrowedTokens events by 35 liquidators, 2,151,879 USD repaid; in scope (USDT or USDC debt, 20 USD or more) 123 takes, 2,085,797 USD repaid, median 708 USD; the taker keeps about 5 pct (half of the incentive goes to the protocol), so median nominal gross about 35 USD and about 104,000 USD in the week. 116 of 123 had shortfall 0 at the parent block: taken in the block they became takeable (0.45 s blocks; tx index p10/p50/p90 1/30/144; gas price median 0.1 gwei, 0.05-1.0). 7 were takeable one block earlier and 1 for 4-6 blocks (about 2-3 s, 25 USDT, the proof case). The bot aims at that tail: accounts still in shortfall when its scan or the feed sees them. A send costs about 1.66-2.0M gas x 0.05-0.1 gwei = 0.05-0.12 USD at BNB 591.5 USD."
executor: scratch/trial-venus-bsc/contracts/out/TrialVenusLiquidator.sol/TrialVenusLiquidator.json
executor_args: "{bot}"
executor_note: "Owner-only liquidate(flashPool, job, repay, minProfit). Flash lender, Venus Liquidator, both vToken markets, borrower, debt token, collateral token, native flag, swap router, both V3 paths and the payout token are all call arguments; constructor takes the bot address only; no setup transaction. Flow: flashLoanSimple(debt) -> Liquidator.liquidateBorrow(vDebt, borrower, amount, vColl) (reverts on any Venus refusal) -> vColl.redeem of the seized vTokens (a non-zero code reverts MarketError(2, code)) -> wrap native BNB when the collateral market is vBNB -> PancakeSwap V3 exactInput collateral -> debt -> approve the lender for amount + premium; after the loan, a USDT surplus is swapped to USDC; then the USDC profit check and payout. The executeOperation callback accepts only the lender set for the running call (cleared at the end), with initiator = the executor and asset = the job debt token. Approvals are exact and reset to zero (Liquidator, router, lender). receive() takes the native BNB that vBNB.redeem sends. The bot always passes payout = USDC 0x8AC76a51 (18 decimals on BSC), so profit leaves as USDC. Live address from EXECUTOR_ADDR_BSC or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-venus-bsc/proof.py (lease, reset bsc 133614355 = parent of the historical capture 0x9a4fa39a... where a taker repaid 25.04 USDT, deploy artifact, fund owner, non-owner, guard, success, exhausted, release; output proof-result.json). Success 0xf1034b525d45ca97a390a3bd7c105221185a251728b029413b165447b0853590 block 133614359, gas 1,657,964, owner +1.014196811790536634 USDC on 25.048580 USDT repaid (vXRP collateral, route XRP -> WBNB -> USDT, then USDT -> USDC), native -82898200000000 wei (gas at 0.05 gwei), borrower shortfall 0.0485 USD -> 0 and borrow 50.10 -> 25.05 USDT, executor USDC / USDT / XRP / WBNB / vXRP / native and all four allowances 0. Correct reverts: NoProfit guard 0x9a38bc7de09a65c9ba68b3f7abe0c5cdd1555f8fe64625eadc46c479c8c54142 (0xe39aafee, owner USDC delta 0); non-owner 0xb36bf6dae74ce73c0e4cc6fc6df293f111ae8a1ec428e0285bf0c18167d0bd9f (NotOwner 0x30cd7471); nothing left to take 0x1b30b6045b27ae0516b351f463c5068e92ff4af7bc4c2818d234d92e4ae2932a (same size after the success, Liquidator LiquidationFailed(3) 0x125a96ab, owner USDC delta 0). The success lands at parent+4 because deploy and the two guard sends consume fork blocks. scratch/trial-venus-bsc/selftest.py (selftest-result.json): bot calldata equals cast calldata (three shapes), and the bot's own best_route() with the paper code override returns 1.014197 USDC through the relay at block 133614355 and reverts LiquidationFailed(3) at latest."
awaited_events: "LiquidateBorrowedTokens (topic0 0xdd091524...) of the Venus Liquidator 0x0870793286aada55d39ce7f82fb2766e8004cf43 on the feed (1,466 in the 7 d census, 1,231 of them on 2026-11-14; last in-scope take of 20 USD or more at block 133,649,266 on 2026-11-15); each batch triggers a scan of the 50 accounts nearest to shortfall. Safety scan of that list about every 60 s, full universe every 3 h, new borrowers from Borrow logs every 10 min. Next occurrence is not predictable (BNB, BTC, ETH, XRP or DOGE price moves)."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is)."
bad_signs: "No opportunity row in 7 days; every send lost by many blocks; simulate_revert on every account in shortfall (routes or sizes); read_budget rows (85k CU cap hit); feed_error on every wait (no bsc feed)."
rpc_reads_per_min: "about 1.3: one Multicall eth_call per minute (near scan of 50 accounts), about 45 per 3 h (full scan: debts in batches of 200, liquidity in batches of 50), one eth_getLogs + eth_blockNumber per 10 min, plus about 5-20 calls per detected opportunity (one position read, up to 4 size simulations per debt x collateral route, estimate, gas price, final simulation)"
alchemy_cu_per_day: "about 59,000 relay CU/day (near scan 1440 x 26 = 37,440; full scan 8 x 45 x 26 = 9,400; discovery 144 x 85 = 12,240) plus feed about 5,000 (one filter, about 210 events/day and idle long-polls) = about 64,000 CU/day = 0.034 USD/day at 0.53 USD per 1M CU. The code stops relay reads at 85,000 CU per UTC day."
legal_note: "Public Venus liquidation incentive for repaying debt of an account in shortfall, open to any caller through the protocol's own Liquidator contract. Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions. Bidding a gas price for a public reward is in scope of the trial decision."
expedite: false
