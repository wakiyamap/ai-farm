max_loss_per_tx_usd: 20
max_loss_guarantee: >
  The whole action runs in ONE transaction through the bot-deployed
  AaveLiquidator executor, which REVERTS unless its debt-asset balance ends
  strictly higher than it started (contract liquidate(): require(balAfter >=
  balBefore + minProfit + 1, "NO_PROFIT") — AaveLiquidator.sol v3:118 (was :93 in v2), the loss
  bound is the transaction itself). The Balancer flash supplies 100% of the
  cover, so no principal of ours is ever spent or retained; a reverted or
  failing execution rolls all state back. bot.js liveLiquidate() enforces,
  in code, before any send:
  (1) GAS: worstCaseGasLossUsd() = (MAX_GAS_LIMIT x MAX_GAS_PRICE_WEI +
  L1_DATA_FEE_WEI) / 1e18 x ETH_USD must be <= MAX_LOSS_PER_TX_USD=20,
  valued at the FULL fresh oracle ETH price (no discount) whose age fails
  closed (> 15 min => no send); the signer send carries gas = MAX_GAS_LIMIT
  (1,200,000 = 3x the fork-measured executor liquidation gasUsed 364561 and
  guard-revert 390057) and maxFeePerGas = MAX_GAS_PRICE_WEI (0.5 gwei = 22x
  the measured 0.0224 gwei effective price, which already includes
  Arbitrum's L1 data component; the flat L1_DATA_FEE_WEI=0.0001 ETH is extra
  headroom), so the wei burned is capped at 7e14 = 0.0007 ETH ~= 1.6 USD at
  the measured 2282 USD/ETH, still < 20 USD even at a 12x ETH overshoot.
  (2) PRINCIPAL: cover is capped at MAX_COVER_USD=250 of debt at sizing
  (simulateLiquidation coverUsdCap) and re-checked in liveLiquidate(); the
  executor is OWNER-ONLY (owner() must equal our wallet, checked on-chain
  before sending, else we skip instead of burning gas on a guaranteed
  ONLY_OWNER revert) and CROSS-ROUTE-GATED (cross-asset
  pairs execute only on the ONE measured WETH->USDC(native) fee-500 UniV3 route with
  the swap router passed as executor calldata — router=0 on a cross pair reverts
  NO_SWAP_ROUTER fail-closed, proven on the fork; any other cross pair is
  watch-only); the
  executor approves the Pool exactly `cover` and resets it to 0 inside the
  tx (no lingering allowance); the pre-send eth_call of the EXACT live bytes
  from OUR wallet must return success; priceStable() skips when either
  side's oracle price moved more than PRICE_MOVE_MAX_BPS=200 bps (2%)
  between the parent block and latest. A reverted send can only burn the gas
  bound; signer rejections are final (no retry loop). Paper mode sends
  nothing.
