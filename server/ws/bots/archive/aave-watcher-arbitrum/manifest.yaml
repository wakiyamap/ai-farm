awaited_events: >
  Waits for any tracked borrower's HF to cross below 1.0 (on-chain eligibility
  is exactly HF < HEALTH_FACTOR_LIQUIDATION_THRESHOLD, same LiquidationLogic
  rule as the base pool). Ledger shows ~11.3 such events/day on this pool;
  last measured: block 521054999, 2026-11-04T02:59:01Z (tx 0x04ae2b3b...,
  50.55 USDC debt) and block 521055451, 2026-11-04T03:01:00Z (tx
  0xf2fa4f83..., 30.47 USDC debt), both oracle-race class (parent-HF
  healthy, window 0 — attempt 86); before that block 520544718,
  2026-11-02T10:49:07Z (relay eth_getBlockByNumber timestamp 1793616547; tx
  0xd8d2f4d82fce52124a7c1508a317e15c35f4cd12d5d9128107816b7ac8b09120).
good_signs: >
  logs/bot.jsonl heartbeat lines with scanned=200 rotating over the universe
  (cursor advancing; full sweep at the 20000 cap is 20000/200 x 8 s = 800 s
  ~ 13 min 20 s before RPC overhead, NOT ~200 s), debtors>0, min_hf tracking;
  opportunity lines at hf<1 followed by simulate lines with real pair
  discovery (collateral/debt from user config bits), oracle prices,
  cover<=250 USD, decimal-correct seized_units (validates against the measured
  1517789 raw = 1.517789 six-decimal-collateral event at the 4.5% bonus) and
  executor-path sim records:
  sim_ok/sim_return or sim_revert of the EXACT live bytes, executor_calldata,
  min_profit; cross-asset pairs log opportunity_watch_only. The startup
  config line carries executor=0x14115b5f... and executor_runtime_len>0
  (the constructor-linked runtime code loaded for the state-override sims);
  a startup seed line with logs>0, chunk_failed=0 and universe in the
  thousands (the deep 3,000,000-block one-off discovery; state seed.missing
  is empty only then — failed chunk ranges persist and are retried at the
  next start), and seed_chunk_failed lines rare; `--pure-check` logs one
  pure_check line with ok=true (retention AT the cap: confirmed debtors
  kept, confirmed non-debtors evicted first, seedRanges covering the window
  exactly);
  in live mode, live_send lines with to = the executor and calldata = the
  0x2c250cfd call, or live_skip lines naming the enforced check that fired.
  Note: replay_discovery/replay_detection (block-520544717 historical reads)
  error out through the relay today because the lane serves only
  ~1000-block-deep state; the scan path reads latest only and is unaffected.
bad_signs: >
  error/fatal lines, heartbeat debtors=0 for hours while the ledger logs new
  aave_v3 liquidations on arbitrum, simulate lines with wrong pair discovery
  (e.g. assets the user never borrowed), sim_result success on positions with
  hf>1, or seized_units off by 10^k from the measured event.
rpc_reads_per_min: 8 (one Multicall3 eth_call per 8 s cycle carrying up to 200
  getUserAccountData calls), plus one eth_getLogs per 5 min refresh (200,000
  block window), plus a one-off ~16-chunk startup seed fetch (3,000,000 blocks,
  retried/splitting chunks — relay getLogs is transiently flaky on deep
  windows, measured 2026-11-04), plus at most ~20 per detected opportunity
  (cooldown 10 min per user; live mode adds 2 priceStable calls per pair before
  a send).
legal_note: >
  Aave v3 liquidation is a public protocol incentive: the pool pays the
  liquidator the liquidation bonus to keep reserves solvent. We act only when
  the on-chain oracle itself marks a position under water; no frontrunning of
  pending txs (arbitrum has no public mempool), no price manipulation. Like
  the real liquidators, our live path flash-loans the cover from the Balancer
  vault (0 fee) — at most 250 USD of borrowed principal per liquidation,
  repaid inside the same transaction from the seized collateral, with our
  own capital exposed to gas only.
expedite: false
