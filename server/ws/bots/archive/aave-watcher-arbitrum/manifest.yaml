  ~109.20 USDC gross bonus (capped at ~11.25 executable under MAX_COVER_USD=250)
  and block 519515609 (tx 0x6b6dab7c..., debtToCover 264.107486) paid ~11.88
  USDC, both ABOVE the MIN_PROFIT_USD=0.5 floor; the remaining 14 same-asset
  events are sub-floor dust. Earlier window below.
  Ledger: 78 aave_v3 liquidation events on arbitrum over 6.92 days (11.3/day
  average, lumpy: bursts of 41 and 26 events/day plus quiet days of 1-5).
  CORRECTED same-asset aggregation (per review 724fe0d9's scaled ledger
  totals; supersedes the old 4860.54 USD/7d claim and the attempts 49/55
