strategy: >
  [v3 2026-11-04 run 6f2863de fix: executes the CROSS-ASSET class through the ONE
  measured swap route WETH -> USDC(native) fee-500 UniV3 at router
  0x68b3465833fb72a70ecdf485e0e4c7bd8665fc45 (route of winning tx 0x527dbfe2...);
  re-measured 7d window (run 6f2863de, ledger query, camelCase collateralAsset/
  debtAsset fields): 74 aave_v3 arbitrum liquidation events, 16 same-asset; same-asset
  is NOT all dust — two native-USDC captures clear the 0.5 USD floor (block
  519465244 tx 0x4accb9aa..., debtToCover 2426.593313, gross bonus ~109.20 USDC,
  ~11.25 executable at the MAX_COVER_USD=250 cap; block 519515609 tx 0x6b6dab7c...,
  debtToCover 264.107486, bonus ~11.88 USDC); the remaining 14 same-asset events are
  dust; cross-asset events carry the rest of the >0.5 USD gross bonus.]
  Watch the farm's Aave v3 pool on Arbitrum One (0x794a61358d6845594f94dc1db02a252b5b4814ad,
  the contract that emits all 78 aave_v3 liquidation events the ledger holds for
  arbitrum in 6.92 days) for borrowers whose health factor drops below 1.0,
  polled via Multicall3 getUserAccountData every 8 s over a rotating 200-of-universe
  window (universe up to 20000 candidates discovered from pool logs: a one-off
  startup SEED over a deep 3,000,000-block chunked window (lead 12 fix
  2026-11-04: dormant interest-bleed debtors had zero pool activity for 62 h+
  before liquidation — invisible to the live ~25 h (200000-block) activity
  window) PLUS the rolling live window; cap eviction keeps DORMANT DEBTORS
  (lowest last-seen HF kept longest, confirmed non-debtors evicted first,
  never oldest-since), full sweep ~13 min. Measured floor of event-window
  discovery (2026-11-04 run 75d2b565): the replay anchor 0xec2d786d and the
  2026-10-30 dust victim 0x102bf626 stay undiscovered even at a 12e6-block
  seed window (months-dormant: their last pool event predates any practical
  window) — the seed serves the days-dormant class, which is what the
  2026-11-04 liquidations were (both victims rediscovered at 3e6 blocks).
  Candidates are decoded from LiquidationCall (named event hash
  0xe413a321e8681d831f4dbccbca790d2952b56f977908e45be37335533e005286) and pool
  activity logs by the SAME extractCandidates() pipeline used by `--replay`:
  every topic0 is a NAMED schema whose hash was verified == cast keccak of the
  deployed interface signature and whose user location was measured on real
  logs (LiquidationCall user = topics[3], liquidator in data; Borrow user =
  data word 0 and onBehalfOf = topics[2]; Withdraw/Repay user(+to/repayer) =
  topics[2..3]; ReserveUsedAsCollateralEnabled/Disabled and SwapBorrowRateMode
  user = topics[2]). Unknown topic0s (BalanceUpdate-class noise) are skipped
  and counted; uint256 amounts are never mis-read as addresses. `--replay`
  discovery reads strictly PRE-capture (window ends at the parent block) over
  the SAME deep SEED_BLOCKS chunked window the startup seed uses, and
  `--replay-all` measures victim rediscovery for the two 2026-11-04
  cross-asset liquidation victims (tx 0x04ae2b3b..., 0xf2fa4f83...) and the
  five 2026-10-30 batch victims measured from the ledger. When HF < 1, the bot derives the borrower's actual
  collateral/debt pairs from getUserConfiguration (2 bits/reserve), prices both
  sides via the on-chain AaveOracle getAssetPrice (8-dec USD), sizes the cover at
  min(closeFactor x totalDebt, MAX_COVER_USD=250), and simulates the EXACT live
  executor call (selector 0x2c250cfd on the bot-deployed AaveLiquidator) via
  eth_call with the constructor-linked runtime code as a state override, from
  the owner address baked into that runtime; missing runtime or missing
  executor code fails CLOSED (no plain-call fallback to an empty address).
  Same-asset pairs execute with no swap;
  cross-asset pairs execute ONLY on the measured WETH -> USDC(native) fee-500 UniV3
  route (SWAP_ROUTES in bot.js); every other cross pair is watch-only (the bot never
  guesses a fee tier: an undefined route means watch-only, never an unpriced send). Reserve layout was
  re-measured on-chain for THIS pool (getReserveData
  coverage, so every asset ever liquidated in the ledger (WETH, USDC x2, USDT,
  DAI, ARB, LUSD, wstETH, cbETH, LDO-like, others) is in scope. Live mode sends
  ONE transaction to the bot-deployed AaveLiquidator executor (never to the
  Pool directly): the executor flash-loans the debt asset from the Balancer V2
  Vault (0 fee, the measured real liquidator's flash source), repays the
  victim via pool.liquidationCall, sells ONLY the newly
  seized collateral DELTA on the measured route — retained inventory is snapshotted
  pre-liquidation and must remain untouched after the swap (require(seized > 0,
  "NO_COLLATERAL_SEIZED"), require(balance == collRetained, "RETAINED_COLLATERAL_LOST"),
  AaveLiquidator.sol v3) — then lets the vault pull the flash back, and REVERTS
  unless its debt-asset balance ended strictly higher (NO_PROFIT guard). liveLiquidate()'s enforced checks
  must pass first (see max_loss_guarantee). The flash covers 100% of the
  principal, so our own float is never spent.
