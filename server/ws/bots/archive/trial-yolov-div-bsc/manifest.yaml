id: trial-yolov-div-bsc
author: builder/claude-mythos-5-2
chains: [bsc]
strategy: "trial: the YoloVerse helper's public triggerDivRewards() on BSC pays its caller 2,400 YOLOV (2,256 after the token's burn and fee) once every 28,800 blocks, at a block known 3.6 hours ahead; one executor transaction calls it, sells the YOLOV for WBNB on the PancakeSwap V2 pair, unwraps and reverts unless the BNB paid to the bot is at least minProfit"
copied_from: "0xf38c67a72476b23e60700dc0bbad07d7be02ea14 (executor, rotating sender keys; actors:366), tx 0x636a959c29d39f37958ee01e9fd51cee58e7238bfdb7b58152e0249e60a561ee (block 135131936, 2,256 YOLOV sold for 0.000951805 BNB) and 0x6332f7ac3ff4f5cbdc3a8ebc12ad3b2a9ca09d80230e1e8691f1be626baca391; the same call is made by 0x4d33a2b8ee4b2bc1083284d978c0a762e7b6cf0a (EOA 0x93cbe460, e.g. tx 0xebb4f46856c0a771 at block 135045533) and 0x9f634fb8a6b5b2208d2e158dae93a67d588e70cb"
capital_usd: 4
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "DivTrigger.run reverts with NoProfit unless the native paid to the owner is at least minProfit (scratch/trial-yolov-div-bsc/contracts/src/DivTrigger.sol:61), and the trigger itself reverts 'Not time yet !' when the reward is not due or already taken, so a lost send costs gas only (48,151 gas on the fork). bot.py plan() sends only when the simulated BNB gross is above that send's gas cap (gas limit 900,000 x signed gas price: bot.py:198), refuses a cap of 0.95 USD or more at 1,200 USD per BNB (bot.py:195), sets minProfit to the larger of the gas cap and half the gross (bot.py:192), never signs above 0.8 gwei (bot.py:57) and sends at most 2 times per window (bot.py:52). Bid: a gas price of at most 25 pct of the simulated gross over 670,000 gas (bot.py:55), about 0.355 gwei = 0.00024 BNB on a won take; BSC has no base fee, so the signed price is the whole bid."
expected_value: "Trial, the win rate is what it measures. 47 takes in the 7 days to 2026-11-22 19:45 UTC (one every 28,801 blocks = 12,965 s), 0.000951805 BNB = 0.529 USD gross each, pot 3.55 USD a day; 42 of 46 landed in the due block, 4 one block later. Takers: the project's keeper 0x4d33a2b8 24 (0.05 gwei, tx index median 11), 0xf38c67a7 19 (tx index 1 in 13, pays about 43 pct of gross to a builder), 0x9f634fb8 4 (0.0501 gwei). The bot aims at the 28 takes that went to plain public transactions at 0.05 gwei, with a gas price about 7 times theirs, timed on the known block. Net per won take about 0.00071 BNB = 0.39 USD; every window won = 2.6 USD a day, a third = 0.85 USD a day; a lost send costs about 0.01 USD (scratch/trial-yolov-div-bsc/competition.json)."
executor: scratch/trial-yolov-div-bsc/contracts/out/DivTrigger.sol/DivTrigger.json
executor_args: "{bot}"
executor_note: "DivTrigger(address bot): owner-only run(keeper, selector, token, pair, wrapped, pairFeeBps, minProfit). No stored targets and no setup transaction: every address is a call argument. No approval is given (the reward is transferred to the pair and swapped out directly, fee-on-transfer safe). Has receive() for the WBNB unwrap. Deploy gas on the fork under 0.6M. Paper code override: executor-runtime.hex = eth_getCode of the fork deployment 0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352 (owner 0xc0ffee0000000000000000000000000000000321)."
fork_evidence: "scratch/trial-yolov-div-bsc/proof.py (one lease: reset to 135131935 = parent of the incumbent's take, deploy, fund, calldata equals cast, non-owner, guard, success, repeat; result in proof-result-135131935.json). Success 0x8f9bc2283e2c4eb6f94591e0ce974efb2e55d6e6a2efcb57862d0026e5cfca9e (fork block 135131939, 669,733 gas): owner native +884832030073073 wei net of 66973300000000 wei gas, gross 951805330073073 wei, lastDivRewBlock 135103135 -> 135131939, executor left with 0 native / WBNB / YOLOV. Guard 0x8a9f2f21583605ddffe95e661c43b82027cf66ca309d161d3a0e9ce809c96ac9 (minProfit 1e24): revert NoProfit(951805330073073), owner delta = gas only. Nothing to take (same call again right after the take) 0xba57edae8de02df0493b18b29d183d1e86ec187fedfaafda2971add383569730: revert TriggerFailed('Not time yet !'), 48,151 gas, gas only. Non-owner 0x11ff89ba896f1754f60d4be3d5de0e9ff61956d8ad747ea64853a3481b571fb9: revert NotOwner. Paper path: scratch/trial-yolov-div-bsc/selftest.py, selftest-result.json (the bot's own eth_call with the code override and the block-number override: 951805330073073 / 951913478799436 / 952021645967110 wei at the due block of the last three takes, 0 one block earlier, 0 after the take)."
awaited_events: "The block YOLOV.getNextDivBlock() + 1, every 28,801 blocks (about 3 h 36 min). Last: block 135131936 (2026-11-22 19:04:46 UTC by block timestamp), taken in that block by 0xf38c67a7. Next: block 135160737, about 2026-11-22 22:40 UTC, then every 3 h 36 min."
good_signs: "A paper_sim line with gross_wei near 9.5e14 a few blocks before each due block and a paper_outcome line after it (paper); send_result won, or lost with lost_why outbid_same_block and send_block equal to due_block (the timing works, only the ordering lost) (live)."
bad_signs: "send_result lost with lost_why early or late in window after window (the send does not land in the intended block: LEAD is not converging); check lines with result nothing at a due block (the helper, the reward or the pair changed); winner_tx_index always 1 by the builder-paying executor; loop_error, read_budget or signer_reject lines."
rpc_reads_per_min: 1.5
alchemy_cu_per_day: 15000
legal_note: "triggerDivRewards() is a public no-argument function of the project's own helper that pays whoever calls it a fixed token refund once per period; the project's own keeper and two unrelated executors call it the same way. The bot calls it and sells its own tokens on a public pair. No mempool watching, no other user's transaction is involved; it bids a gas price for a public reward at a block known in advance."
expedite: false
