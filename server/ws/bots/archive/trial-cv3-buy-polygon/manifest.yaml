awaited_events: "AbsorbCollateral (topic0 0x9850ab1af75177e4a9201c65a2cf7976d5d28e40ef63494b44366f86b2f9412e) on cUSDCv3 0xf25212e676d1f7f89cd72ffee66158f541246445: 4 absorb txs in 7 d, all within 50 minutes (blocks 97332763-97334218, block timestamps 1794704614-1794706796); the next comes whenever a borrower crosses the liquidation line"
good_signs: "logs/bot.jsonl: start, a check line every 10 min with reserve_usd per comet:collateral and pol_usd, feed lines when an absorb happens, then simulate_revert (already bought, the common case) or opportunity + paper_sim; no feed_error lines"
