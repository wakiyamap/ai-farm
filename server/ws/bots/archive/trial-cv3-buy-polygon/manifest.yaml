id: trial-cv3-buy-polygon
author: builder/claude-mythos-5-2
chains: [polygon]
strategy: "trial: Compound v3 cUSDCv3 Polygon buyCollateral of reserve residue left after anyone's absorb, flash-swapped on UniV3 in one tx (no principal, USDC.e surplus sold to native USDC); feed-triggered, sends only when simulated surplus > that send's gas cap"
copied_from: "residue buys 0x6aa6a3d33b53643ebe7786bf0689a6f42eae55bdfe0dbf261a158180a14d19d2 (executor 0xa0000470c3e42e9ecc0ddf083cdce04c6c344457, 193.47 USDC.e for 2660 WPOL, block 97332764, 1 block after absorb 0xb81c2391..) and 0x4be4f088e0664528bccad730c4fa8264f2231516f02d4907ae65fbd962ab25b3 / 0x5828395dd1c01d3cf8269bc7e7f2f8c7951f6851129eaa7749fff522dce08e33 (executor 0x10e3c6c054e709c4878acc831048a470ce97951a, 2930.25 USDC.e for 1.7729 WETH and 23,155.48 USDC.e for 0.3959 WBTC); bot structure copied from paper trial-cv3-buy-optimism (same author)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Cv3FlashBuyOut.sol buy(): reverts NoProfit unless the executor's payout-token (native USDC) balance ends above its start by minProfit+1, then sends it all to the owner (scratch/trial-cv3-buy-polygon/contracts/src/Cv3FlashBuyOut.sol:98); bot.py attempt() (bot.py:248) sets minProfit = the send's gas cap and sends only if simulated gross > gas cap = gasLimit (eth_estimateGas x 1.25, refused above 2,000,000) x maxFeePerGas x POL price, where maxFeePerGas = min(fee cap, 2 x gas price + priority) and the fee cap (bot.py:290) keeps the whole expression at or below 0.95 USD; the POL price used is max(0.10, 1.15 x the price the comet itself quotes WPOL at), re-read at every check (POL is ~0.076 USD). Priority bid is at most 25% of simulated gross (BID_SHARE, bot.py:81), at least 30 gwei (polygon minimum tip) and never above the fee cap. Worst case per send = gas"
expected_value: "trial, no EV floor (decision 2026-11-17-cheap-chain-trials). 7 d on the comet (blocks 97,060,731-97,463,919): 4 absorb txs, 13 BuyCollateral, 4 inside the absorb tx, 9 residue buys by 6 buyers, 8 non-dust, all taken 0-2 blocks (0-3 s) after the absorb. 0x10e3c6c0 took the 4 largest (gross 10.6 / 124 / 174 / 1131 USD) at tx index 0 bidding 27,000-2,637,000 gwei priority (10-13% of gross, 1-122 USD per tx): out of reach under a 1 USD cap (~9,700 gwei at 1M gas). The other 4 (gross ~64, 11.8, 3.6, 2.7 USD) were won at 35-30,654 gwei by 0x30a9f049, 0xa0000470, 0xb2407d89, 0x8f33bea7. The bot aims at this second group and at lots 0x10e3c6c0 is late for (its WETH 4930 lot landed 2 blocks after the absorb); the share is what the trial measures"
executor: scratch/trial-cv3-buy-polygon/contracts/out/Cv3FlashBuyOut.sol/Cv3FlashBuyOut.json
executor_args: "{bot}"
executor_note: "Cv3FlashBuyOut: owner-only buy(comet, collateral, pool, payBase, minProfit, outPool); comet, collateral and both pools are call arguments, constructor arg is the bot wallet only. UniV3 callback accepts only the pool set for the running swap (cleared at the end); approves the comet for exactly payBase and resets to 0. The comet base is USDC.e 0x2791bca1; outPool is the UniV3 USDC.e/USDC 0.01% pool 0xd36ec33c and the whole USDC.e surplus is sold to native USDC 0x3c499c54 (the farm's polygon USDC) before the profit check. Holds nothing between transactions; owner-only sweep(token) for strays. Fork deploy gas 950,161. Same source as the optimism and arbitrum trials' executor, own copy"
