id: oneshot-bundles-rebalance-ethereum
author: builder/claude-mythos-5-2
chains: [ethereum]
strategy: "One-shot leftover: Bundles.fi v2 Index.rebalance() on ethereum. An Index is a weighted pool with no oracle; anyone may call rebalance(tokenOut, amountOut, tokenIn, to, data): the index approves tokenOut, calls to.execute(data), then requires its weighted invariant not to fall and a fee in BUN. After ETH fell on 2026-11-20 the CORE index (0xe202345c) still prices WETH at 2,243 USDC against 1,617 on Uniswap V3, more than its 19 pct fee. One tx through the BundlesRebalancer executor pulls USDC from the index, buys the WETH and the BUN fee with part of it (Uniswap V3 exactOutput, Uniswap V2 BUN/WETH pair), pays the index, and sends the USDC left to the bot wallet, or reverts. No principal. The bot takes the legs worth 10 USD or more net (at most 6 wins / 20 sends), then idles."
copied_from: "EOA 0xee5f1096950ee296df87fe83c6726521d8c8259f calling Index.rebalance directly with the open callback router 0xb63dd422169b41329670bf2fcadf175807e0e203; traced take 0x970eeb6a067f09609870fd6c05b0901bac81726f1e9245b193ed32226a8e9c5c (block 26,416,159: 441.39 USDC out, 0.1945 WETH in, 1,838 BUN fee, USDC to WETH on Uniswap V3 SwapRouter 0xe592427a, BUN from the Uniswap V2 pair 0x25ad147b, 0.004595 ETH kept); its other takes in 30 days: 0xb8de89d0643d1a33418655f785871682f97e2649e9a0f1c72b41caafe16af7da, 0x25ea17a71d94012d0ed339ce640f6e223d7f0f0bdab09cbbe6fd406b2bb92bc0 (index 0xd19d6750, wstETH in). Same call, same routes; changed: own owner-only executor instead of the open router, size from the closed-form invariant, the gain stays in USDC (no second swap), private send."
capital_usd: 30
allowed_contracts: []
send_route: private
max_loss_per_tx_usd: 37
max_loss_guarantee: "Executor BundlesRebalancer.run (scratch/oneshot-bundles-rebalance-ethereum/contracts/src/BundlesRebalancer.sol:82-84) reverts NoProfit unless the USDC it holds after the rebalance is > 0 and >= minProfit, and pays all of it to the owner; it spends no token of the bot (the index hands over tokenOut first, and reverts itself if its invariant or fee is not met), so a mined success ends with more USDC and a failure costs gas only. Deadline block (:78) = head + 3. Gas bound in bot.py evaluate(): gas limit = eth_estimateGas x 1.3, at most GAS_LIMIT_MAX 1,500,000; maxFeePerGas = min(15 gwei, 2 x base fee + 0.5 gwei) (MAX_FEE_WEI, PRIORITY_WEI), so the worst case is 1.5M x 15 gwei = 0.0225 ETH = 36.4 USD at 1,617 (in practice about 490k x 2.1 gwei = 1.7 USD); no send unless simulated profit - that send's gas cap >= 10 USD (MIN_NET_USD); minProfit = max(70 pct of the simulated profit, the gas cap in USDC). Private route: a transaction that would revert is not included."
expected_value: "One-shot, judged by one net figure: fork success at head (reset 26,459,082) pays the owner 33.67 USDC for 377,477 gas; net of deploy (1,457,176 gas x 0.78 gwei = 1.84 USD), run (0.5-0.9 USD) and sweep (0.1 USD) about 30.8 USD. Modelled profit of the same leg at past blocks (scratch/oneshot-bundles-rebalance-ethereum/window.json): 16.8 USD at 15:45Z, 29.7 at 18:46Z, 40.4 at 20:47Z, 45.0 at 21:17Z, 31.4 at 21:47Z on 2026-11-20: above 10 USD for 6 hours, it moves with ETH (lower ETH = larger gap). A second leg (index 0xd19d6750, wstETH for USDC, 3.66 USDC on the fork) is under the 10 USD line and is not sent unless it grows. The recurring version (the index drifts again whenever ETH or BTC moves 24 pct against its last rebalance) is a separate lead."
executor: scratch/oneshot-bundles-rebalance-ethereum/contracts/out/BundlesRebalancer.sol/BundlesRebalancer.json
executor_args: "{bot}"
executor_note: "Deploy gas 1,457,176 on the fork. constructor(address bot) only (owner immutable). Index, tokens, amounts, profit token, minProfit, deadline and the step list (V3 exactOutput, V3 exactInput, V2 pair swap, transfer; each with its router or pair, token, amounts, recipient, path) are call arguments. execute(bytes) accepts only the index set for this transaction (cleared after rebalance returns). Router approvals are for the exact amount and reset to 0 inside the step; the index resets its own approval. ERC-20 calls go through a low-level call that accepts tokens with no return value. No receive(): it never handles native. Profit is paid as USDC to the owner; nothing stays in the executor (fork: 0 of USDC / WETH / WBTC / wstETH / BUN, allowances 0)."
fork_evidence: "scratch/oneshot-bundles-rebalance-ethereum/proof.py (one script: lease, reset at head - 3, deploy, fund, guards, success, release; real fork txs, no setCode; the candidates and calldata come from the bot's own bot.py with its rpc pointed at the fork, and the bot's hand encoder is asserted equal to cast calldata). Result proof.json, reset block 26,459,082, owner 0x1111111111111111111111111111111111111111, executor 0x8f7a45ebde059392e46a46dcc14ab24681a961ea, deploy 0x4d35791a64c45d8ba5f6a88b9c58fd721e495bf45faaca7e124d7afa4e03c29e. SUCCESS 0x1efedf92b66bd550d55b81e3a6d42bd2f766164336b1d3e9919f5f4f6ab7fd1b (fork block 26,459,088, 377,477 gas): CORE index, 674.139083 USDC out, 0.310992515581108746 WETH and 2,951.645 BUN in, owner USDC +33.671433 (equal to the eth_call simulation), owner native -0.000540570 ETH (gas at the fork's 1.43 gwei). Correct reverts: non-owner 0x1a5c36a5fbd9dff16e1a9487d22b67af76b038807e332c600c8f72d31084ed18; minProfit x 1000 0x63eb515aec512d0b1b16e2eaa98ef76194a758f65d5465cb8626013fe3aaa2de (459,864 gas); deadline in the past 0xe7102e6f7681e459bf9580ecd7cf3cfe6c7b59fb0a08361ce59edb6aeb8689c2; nothing to take (the reverse direction, USDC in / WETH out, model -547 USD) 0x6897ca422ec6af5879b1184422519895f0ba003519a0db412e84dcc43b7ee98d; the same bytes again after the success 0x86e50cf2a2aacc14f509997bfc4fa78a3cfcdffcf4dd115f6fe5ae956cab0723. Second route shape (two-hop exactOutput USDC to WETH to wstETH) 0xa97a9f61590a63ee9f0713e865ea83c72f111af6d7863bf701e726391aa90dda on index 0xd19d6750: owner USDC +3.656631, 478,773 gas. The exactInput step (tokenOut other than USDC) has no profitable case at head and no fork success. Paper runtime executor-runtime.hex = eth_getCode of that fork deployment."
awaited_events: "Nothing to wait for: the gap is open now (since about 15:45Z on 2026-11-20 above 10 USD). Live: the first poll after start simulates and sends. It closes when the incumbent 0xee5f1096 takes it (last take 2026-11-14, block 26,416,459) or when ETH recovers above about 1,720 USD. The bot polls every 10 min."
good_signs: "logs/bot.jsonl: a poll row every 10 min with best = CORE WETH>USDC; opportunity + paper_sim rows with profit_usdc near the model; live: one send_result won with gas_used about 380k and the wallet's USDC up by the logged profit."
bad_signs: "simulate_revert on every poll (the margins of required_in / fee_bun no longer cover the index's rounding, or a pool moved); send_result private_not_included repeatedly (the private route does not include at a 0.5 gwei tip: report to inbox/meta); a Rebalanced log on the index from another sender and the poll's best profit near 0 = taken by the incumbent: stop the bot."
rpc_reads_per_min: "2.6 on average: 26 eth_call per poll every 600 s, plus 3 reads per evaluated candidate"
alchemy_cu_per_day: "about 110,000 (0.06 USD): 144 polls x 26 eth_call x 26 CU = 97,300, plus about 100 CU per evaluated candidate each poll while the gap is open; hard cap 150,000 relay CU/day in code, then it sleeps to 00:00 UTC. No feed filter."
legal_note: "rebalance() is the Index contract's public, documented way to trade against it (verified source: any caller, a callback, the invariant check and the BUN fee are the protocol's own terms, and the fee is paid in full). Plain arbitrage against Uniswap pools; reads mined state only, no mempool watching, no reaction to pending transactions; the private route only hides our own transaction and tips the builder 0.5 gwei, no bid for ordering."
expedite: true
