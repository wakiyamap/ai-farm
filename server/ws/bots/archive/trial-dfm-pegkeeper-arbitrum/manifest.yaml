id: trial-dfm-pegkeeper-arbitrum
author: builder/claude-mythos-5-2
chains: [arbitrum]
strategy: "trial: defi.money (MONEY stablecoin) PegKeeper update reward on Arbitrum; the public PegKeeperRegulator.update(pk, beneficiary) pays the beneficiary 20 pct of the keeper's new profit as Curve pool LP; one transaction takes it, removes the LP to USDT, swaps to USDC and reverts unless USDC grew"
copied_from: "EOA 0x629dad154ef836df0acc060aaff2399709440fd4 calling regulator.update for 2-4 keepers through Multicall3 0xca11bde0... with beneficiary 0x344e42e3...: 0x20b5ad22741baceb9c87175b358415b6507488fa26e42940a5b1095f99e91043 (block 526,250,483, USDT keeper share 0.04477 LP), 0xbfbef8e89a92fcf7223bc47bc2bd001fd47a0b3d77088819f9ab3004a50baae6 (block 526,250,784, 0.05127 LP), 0x2c69e1ec704f86755a338d4ca9985fcf69b5e51bd0f105bd35b8ba5ae2b8f7d0 (block 526,251,081, 0.05309 LP)"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "StepArb.sol:108 reverts NoProfit unless the executor's USDC balance grew by at least minProfit after the 1 USDC flash loan was repaid (Morpho itself reverts when it cannot be repaid); take() is owner-only (StepArb.sol:57) and the flash callback accepts only the lender set for this call (StepArb.sol:124); the gain is paid to the bot wallet as USDC in the same transaction. So a lost attempt costs only gas. bot.py check(): cap = gasLimit x maxFeePerGas (gas limit = eth_estimateGas x 1.2, refused above 3,000,000; maxFeePerGas = base fee x 1.25, refused above 0.5 gwei); the send is skipped unless cap is under 0.95 USD at a conservative 4,000 USD per ETH and unless the simulated USDC gain is above cap converted to USDC at the Uniswap V3 WETH/USDC pool price; minProfit = that cap in USDC, re-simulated at the signed gas limit before the send. Typical cap about 0.000026 ETH = 0.043 USD (866,427 gas estimate x 1.2 x 0.025 gwei). Priority fee: none (0); Arbitrum orders by arrival and the bot never bids."
expected_value: "Trial: win rate measured by sending, no counted EV; the class is cents. Competition, last 7 days (blocks 523,835,204-526,255,204; scratch/trial-dfm-pegkeeper-arbitrum/history.py, history.json): 6 transactions with 20 keeper actions, all on 2026-11-21 (06:50:12Z, 11:33:55Z, 13:36:38Z, 13:37:54Z, 13:39:09Z, 13:40:28Z), all by the one EOA 0x629dad15 (beneficiary 0x344e42e3); the one before is from 2026-06-15. USDT keeper caller share per transaction 0.0294 / 0.0405 / 0.0448 / 0.0513 / 0.0531 / 0.0229 LP (LP virtual price 1.022), all keepers together 0.29 LP in 7 days; the incumbent's gas 1.43e13-2.59e13 wei (0.024-0.043 USD) for 2-4 keepers, tx index 9-29, no priority fee. Blocks to take: the regulator opens the next action 30 s after the last one and the incumbent came 75-79 s after its own previous action (three times), and 17,023 s and 7,363 s after for the first action of an episode; at 13:54:35Z a share of 0.0117 LP had stood 847 s untaken (below the incumbent's bar and below this bot's gas cap too). The bot aims at every USDT-keeper share above its gas cap (about 0.043 USDC): three of the six past transactions; net about 0.02 USD each when won."
executor: scratch/trial-dfm-pegkeeper-arbitrum/contracts/out/StepArb.sol/StepArb.json
executor_args: "{bot}"
executor_note: "Same source as the executor of the live trial-ryeth-arb-arbitrum (StepArb.sol, byte-identical copy). Constructor takes only the bot owner. take(lender, token, amount, steps, clear, minProfit, unwrap): the flash lender (Morpho Blue 0x6c247b1F..., 360,425 USDC at head, no fee), the flash token (USDC, 1 USDC, only the frame the executor measures the gain in) and every step (target, token spent, spender, calldata) are call arguments; nothing is baked in and there is no setup tx. Steps here: regulator.update(USDT keeper, executor); pool.remove_liquidity_one_coin(whole LP balance, 0, 0) on the keeper's Curve pool 0x81fdbd70... (the pool is its own LP token, no approval); SwapRouter02 exactInputSingle USDT -> USDC in the 0.01 pct pool (0xbe3ad6a5..., 54,625 USDC + 619,923 USDT). A step spends the executor's whole balance of its token, approves exactly that amount and resets the approval to 0 (USDT without a return value is handled). take() is owner-only and the executor holds nothing between transactions: the worst a bad route can do is revert. probe(bytes[]) is for eth_call only: owner-only, it tries each take() calldata through trial(), which always reverts (Trial(gain)). After the profit check the tokens named in clear (pool LP, USDT) are sent to the owner (zero in the fork run). unwrap = false: the gain reaches the bot wallet as USDC. Live code reads EXECUTOR_ADDR_ARBITRUM or EXECUTOR_ADDR; paper mode uses an eth_call code override (executor-runtime.hex = eth_getCode of the fork deployment, owner 0xc0ffee...0321). Deployment about 1.2M gas, under the 3,000,000 limit."
fork_evidence: "scratch/trial-dfm-pegkeeper-arbitrum/proof.py [parent block] (one Arbitrum fork lease: reset, deploy the artifact with --args, fund, probe, non-owner, guard, success, repeat, leftovers, allowances; calldata built by bot.py itself). Reset 526,250,482 = parent of the incumbent's update in block 526,250,483 (proof-result-526250482.json): probe from the owner 45,868 USDC units (0.045868 USDC), from a stranger it reverts. Non-owner take revert NotOwner 0x359bb3d8f2f9257c9e40f010b872cd5a51c0e48f67c70b2ff69a4ec8e57fe16e. Guard revert NoProfit(45868, 1e24) 0x50604d63ee45f935d342d4d035d7824020c9146e3d2071fab09906f158758236, 835,122 gas, owner USDC delta 0. Success 0x3279c55d5a4760d94931d3288612bf49011dd4190b1429287beaf504b661cdad fork block 526,250,486, 735,827 gas, owner USDC +45,868 units (+0.045868 USDC), gas 0.0000736 ETH at the script's 0.1 gwei (0.0000147 ETH = 0.024 USD at the 0.02 gwei the incumbent paid). Nothing to take: the same call again in the next block reverts StepFailed(0, 'DFM:R Action delay still active') 0x5cdb54b50f076f74502f5ae3ffc2cadfe98dc0b946cc1913e1932a1fc9f3b85f, owner USDC delta 0; probe after 0; executor balances 0 in native, USDC, USDT, LP; executor allowances 0 (USDC to Morpho, USDT to the router)."
awaited_events: "No event: a 40 s timer (one probe eth_call of the exact transaction). The bot waits for the MONEY / USDT pool 0x81fdbd70... to be pushed off balance (someone buys or sells MONEY there) by enough that the keeper's update pays a caller share above the gas cap, about 0.043 USDC. Last happened 2026-11-21 13:36:38Z-13:40:28Z (four updates, three above the line), before that 11:33:55Z and 06:50:12Z the same day, before that 2026-06-15. It may happen again whenever MONEY trades off its peg in that pool; it may also not happen again before the trials close on 11-24."
good_signs: "check rows every 40 s; opportunity rows with gross_usdc above cap_usdc followed by paper_sim success; live send_result won with expected_gross_usdc above the gas cost."
bad_signs: "opportunity_skip gross_not_above_gas_cap on every look for days (the shares stay under the gas cap: the class is too small); every live send lost with winner_block just before send_block (the incumbent reacts faster than a 40 s poll); simulate_revert at the estimate step on every look; read_budget rows."
rpc_reads_per_min: "1.5: one probe eth_call per 40 s; a look that sees a share above 0.025 USDC (and not under 80 pct of the gas cap computed in the last 10 min) adds up to 4 reads (block, estimate, price every 30 min, guard simulation); live only, 3 follow-up probes after a send."
alchemy_cu_per_day: "56,160 relay CU with nothing to take (2,160 probes x 26 CU); up to 95,000 CU (the code cap) when a share stands at every poll: 0.030-0.050 USD/day at 0.53 USD per million CU. No feed filter."
legal_note: "A public keeper reward: PegKeeperRegulator.update(pk, beneficiary) is the protocol's documented open entry (source comment 'unguarded nonpayable functions', beneficiary defaults to msg.sender) and pays the caller share the protocol set (20 pct) for running the peg keeper, exactly as the Curve crvUSD PegKeepers it is forked from. No pending-transaction watching, no manipulation of the pool: the bot only calls update when the pool is already off balance, and it never trades in the MONEY pool beyond removing its own LP share."
expedite: false
