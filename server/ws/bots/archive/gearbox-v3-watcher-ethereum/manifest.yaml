max_loss_per_tx_usd: 35
max_loss_guarantee: >
  The whole action runs in ONE transaction through the bot-deployed
  GearboxFlashLiquidator5 (source scratch/gearbox-v3/contracts/src/GearboxFlashLiquidator5.sol). Its onMorphoFlashLoan ends with if (balW < principal + minProfit) revert
  NoProfit(balW, need) (GearboxFlashLiquidator5.sol:114, balW = the contract's own
  WETH balance: the contract entered with 0 WETH — the same-tx sweep keeps it 0 after
  every success), so any shortfall — failed adapter leg, non-liquidatable account,
  premium below minProfit, failed pull-back — rolls the whole tx back: worst case is
  gas only. On this chain (plain public mainnet, EIP-1559, no OP-Stack L1 data fee)
  the gas worst case IS enforced by the signed transaction: maxFeePerGas DERIVED each
  cycle from the latest header (basefee x 9/8 + 0.001 gwei tip, capped 10 gwei =
  FEE_CAP_WEI, bot.js updateFeePolicy) x gasLimit 1500000 <= 0.015 ETH = 35 USD at any
  native valuation <= 2333 USD/ETH (the live path refuses when the bound times the
  fresh oracle price exceeds 35 USD — fail closed; measured oracle 2239.78 USD/WETH at
  head 26360848); at today's derived maxFee ~0.046 gwei the bound is ~0.10 USD. Entry
  is open to anyone (the guard, not the caller, protects the route); the premium sweep
  to the owner is part of the guarded transaction.
expected_value: >
  Fork-measured occurrence economics: the tx1-layout debtor (debt ~87.7 WETH) paid
  3.222826 WETH premium to the executor = 7,218 USD gross at the measured live oracle
  price 2239.78 USD/WETH (3.222825835 x 2239.78; premium = 3.67% of debt,
  remainingFunds mechanism); the same liquidation's gas measured 1,350,704 gas =
  0.0000535 ETH = ~0.12 USD at the current head base fee 0.0396 gwei x the measured
  price (signed worst-case bound 35 USD at the 10 gwei cap, NOT the expected spend).
  Cadence measured 0.31 liquidations/day with poll-catchable windows 34-10398 blocks
  (attempts 358: windows measured from the backward HF ladder — a 20 s poll catches
  them; same-block-race crossings are outside this class). After-gas expectation: the
  ONE measured large debtor nets ~7,218 USD per capture minus ~0.12 USD gas — clearly
  positive for it. The premium scales linearly with the repaid debt (3.67% of debt),
  so the after-gas EV is positive for any debtor down to the on-chain minProfit floor
  0.1 WETH = ~224 USD premium gross (covering debt >= ~2.7 WETH ~ 6,100 USD at the
  measured 3.67% rate; smaller debtors revert NoProfit and cost only gas, bounded by
  L). The debtor distribution beyond the ONE measured large case is UNMEASURED
  (single-measured-case caveat): the ledger source gearbox_v3.liquidate_credit_account
  (installed 2026-11-07) ingests every future facade liquidation, so paper + ledger
  measure the debt distribution of the class before any promotion decision.
executor: scratch/gearbox-v3/contracts/out/GearboxFlashLiquidator5.sol/GearboxFlashLiquidator5.json
executor_note: >
  The artifact is a forge build (solc0.8.24) at scratch/gearbox-v3/contracts;
  NO constructor args (constructor() { owner = msg.sender; } — the only difference
  between the fork proof and the live deployment is the deployer: the gate deploys
  through the bot wallet, whose address is baked into the deployed code and becomes
  the sweep target, so executor_args stays unset and the gate needs no ABI input).
  Paper sims use the fork runtime override (executor-runtime.hex = eth_getCode of the
  fork executor 0x14115b5fdab3afcd72cf03785041c720100edb0e, re-taken by
  proof-flash5.py from the deployment with owner 0xc0ffee...01 baked as deployer —
  never forge deployedBytecode, whose immutable group is a zero placeholder).
