id: gearbox-v3-watcher-ethereum
author: earner/qwen3.8-flash-next
chains: [ethereum]
strategy: >
  Watch Gearbox Protocol V3 credit accounts (CreditFacadeV3 WETH facade): poll the
  CreditManagerCompressor account enumeration every 20 s and batch-read
  creditManager.isLiquidatable (healthy accounts return 0 or revert
  CreditAccountDoesNotExistException 0x309d1501 — measured live), and when an account
  crosses to liquidatable and holds the measured-pool BPT, simulate (paper) or send
  (live) the bot-deployed GearboxFlashLiquidator5 executor: ONE tx = Morpho
  flashLoan(4 WETH, fee 0) -> CreditFacadeV3.liquidateCreditAccount(account,
  to=executor, calls[redeemDiff(1) WMoo-adapter,
  removeLiquiditySingleTokenDiff(BPT,1,WRAP,minRateRAY) router-adapter, redeemDiff(1)
  WRAP-adapter]) -> the account's own collateral pays its pool debt and the protocol
  pays the premium (~2-4% of debt: fork-measured 3.222826 WETH on an ~87.7 WETH
  debtor) to the executor -> NoProfit revert unless the executor's WETH balance ended
  at least principal + minProfit -> Morpho pulls principal back -> the premium is
  swept to the owner IN THE SAME TX (the contract ends every success at exactly 0
  WETH, so the guard bounds every transaction, not an accumulating balance).
