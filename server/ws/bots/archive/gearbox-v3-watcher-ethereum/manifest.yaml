good_signs: >
  Paper logs show: startup controls OK (underlying == WETH, runtime_ok true),
  heartbeats every ~20 s with header_lag ~0 (the header is read by its explicit fresh
  number — the relay answers eth_getBlockByNumber("latest") up to 25 blocks stale) and
  rpc_cycle <= 4 (blockNumber + header + compressor page + one tryAggregate batch) and
  accounts = the TRUE enumeration count (20 at block 26287069, 21 at head 26360944
  measured with the corrected dynamic-array decode; the known liquidatable account
  0x56631dcb1ea548d2629e82e01375090ed1f81b7e IS enumerated at 26287069 among the 20 —
  scratch/gb-enum-verify.py), liquidatable
  transitions logged with liquidatable_since_block, opportunity_skip ONLY for accounts
  with BPT balance 0 (no RPC sim spent), simulate records with sim_ok true on a
  transitioned BPT-holding account and NO simulate for healthy accounts, simulate_revert
  notes carrying the protocol error selectors (0x234b893b / 0x532e7bb6 / NoProfit),
  base_fee_gwei tracking the live header and fee_bound_ok true.
bad_signs: >
  startup fatal rows (underlying changed / runtime missing); agg_decode_error on every
  cycle; a simulate that succeeds while the heartbeat liquidatable count is 0
  (impossible — the sim would revert NotLiquidatable); liquidatable_accounts flipping
  every cycle (threshold/thresholds ramp artifact — would show the poll chasing
  noise); eth_usd missing or stale (the live path fail-closes without it); rpc_cycle
  far above 4 (retry loops spending the quota); a live_skip reason repeated every
  cycle (fee bound/valuation dead-lock).
rpc_reads_per_min: 18
legal_note: >
  Gearbox V3 credit-account liquidations: liquidateCreditAccount is public and the
  protocol pays the liquidator the remaining funds (premium of the repaid debt) — an
  intended keeper mechanism under S. No role gating measured on the entry (the facade
  multicall is callable by anyone; the v1/v2 deposit-free attempts 362/364 confirm
  the permission structure). The premium is taken in the same transaction and swept
  to the owner; no price manipulation, no sandwiches, the collateral sale goes
  through the pool route the protocol itself uses.
