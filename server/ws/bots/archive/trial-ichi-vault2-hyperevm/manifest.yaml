strategy: "trial: the two WHYPE-deposit ICHI vaults on Nest, deposit / withdraw pricing versus another pool. IV-NEST-2 (NEST + WHYPE in the Algebra NEST/WHYPE pool) versus the NEST/kHYPE pool; IV-NEST-17 (WHYPE + USDC in the Algebra WHYPE/USDC pool) versus the UniV3-style WHYPE/USDC pool 0x6c9a33e3. When the vault's other token is dearer on the other pool than on the vault's own pool, one tx flash-borrows WHYPE on Morpho Blue, deposits it into the vault, withdraws the shares at once (pro-rata both tokens), sells the other token for WHYPE (NEST -> kHYPE -> WHYPE, or USDC -> WHYPE), repays, unwraps the WHYPE gain and pays it to the bot wallet as native HYPE, or reverts. The bot polls one eth_call of the executor's scan() (19 candidates: sizes x 3 routes) every 27 s."
copied_from: "IV-NEST-2: flash recipients 0x79350c4b4f09650af22d4755c32727bd87878ea8 (EOA 0x867b39b6b4a90c8855fd8aa843af46534752de11): tx 0x1a123c761b633041c94d2e86755a7e3dc61390c27dfd232fcbba1f1ffccd3afd (block 51,759,659, +0.024617 WHYPE, 701,955 gas; traced: scratch/trial-ichi-vault2-hyperevm/trace-1a123c76.json); 0x7b9836a3fa0824572c2f7e69beb19c351d80548b (EOA 0x0b8d87ee4ee429a60e8f5738c3a2d7d6e8ad8471): tx 0xe25b232db71c4e630003d8184e00b833d63940b9e183db2910cd598427f7b892 (block 51,759,513, tx index 0, +0.016833 WHYPE); 0x30e81e4d8790fd5203072ebba81f8e5d85f513a3 (EOA 0x454c16ca9e6b817f4b6ff86292783c14db07a7e4): tx 0x2f5a61cd139ba1264d67ab7a6a11a4a0ba7314c9fa9dd6c05bd9f0d056449d68 (+0.028736 WHYPE). IV-NEST-17: 0x79350c4b.. tx 0xbe899f6d9ee4ec34cba4daaec3a8ee402d2366c1e194a1b24811e917bd36bff2 (block 51,771,271, tx index 0, +0.053799 WHYPE, 591,348 gas, flash 63,600 WHYPE; traced: trace-be899f6d.json); 0x30e81e4d.. tx 0xf8bd3b354e5ea388069f0fecac855fed7a942c0806b76c88315a32e76f3846f5 (+0.449909 WHYPE). Same vaults, lender and pools, same call order (Morpho flashLoan, vault.deposit, vault.withdraw, pool swaps); changed: size chosen by simulation from fixed sizes, two kHYPE/WHYPE pools tried, the gain is unwrapped and paid as native. Sibling of the farm's trial-ichi-vault-hyperevm (IV-NEST-16, USDC deposit), which covers neither vault."
