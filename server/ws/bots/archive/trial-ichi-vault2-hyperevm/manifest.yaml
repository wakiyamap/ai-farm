executor_note: "Deploy gas 1,316,598 on the fork, below the 2,000,000 HyperEVM cap. constructor(address bot) only (owner is immutable); Morpho, token, size, vault, sell hops, limits and the unwrap flag are Params call arguments, so both vaults go through the one deployment. The Morpho callback and the swap callbacks (uniswapV3SwapCallback, algebraSwapCallback, pancakeV3SwapCallback) accept only the counterparty set for this step of this transaction; it is cleared at the end. receive() accepts native only from the wrapped token during the unwrap of this transaction. Approvals are for the exact amount (vault: reset to zero after the deposit; Morpho: used up by its repayment pull; both read 0 after the fork successes). scan() is an owner-only eth_call helper that rolls every candidate back (probe() always reverts with the result). Profit is paid as native HYPE: the executor unwraps its whole WHYPE balance (WHYPE.withdraw) and sends the native to the owner in the same transaction; nothing stays in the executor after the fork successes. Same source as the live trial-ichi-vault-hyperevm executor plus the unwrap flag and receive()."
fork_evidence: "Two scripts, each one script for lease, reset, deploy, scan, guards, success, release; no fixture and no setCode (these routes read no HyperCore precompile); owner 0x1111111111111111111111111111111111111111; executor 0x8f7a45ebde059392e46a46dcc14ab24681a961ea in both. (1) IV-NEST-2: scratch/trial-ichi-vault2-hyperevm/proof.py -> proof.json, reset 51,759,512 = parent of incumbent tx 0xe25b232db71c4e630003d8184e00b833d63940b9e183db2910cd598427f7b892 (block 51,759,513, index 0, +0.016833 WHYPE). Deploy 0x39c4158898fea3573c764428d7399c18c0be7c14cd1fedb172516dd682757a86 (1,316,598 gas). scan() before: route A 10 / 25 / 50 / 100 WHYPE = 0.003817 / 0.008719 / 0.014356 / 0.015325 WHYPE, route B 0.003861 / 0.008828 / 0.014571 / 0.015746, 200+ = 0. SUCCESS 0xeb067027565c970c0e1538d40b658766363c472ca00d62f5b96dc23cad0db6d2 (fork block 51,759,516, 812,832 gas, 100 WHYPE, route B, minProfit 0.00787 WHYPE, unwrap): owner native +0.015733146 HYPE before gas (+0.014857665 after the fork's gas fee), owner WHYPE unchanged, executor holds 0 native / WHYPE / NEST / kHYPE / shares, allowances 0. Reverts: nothing left 0x9255c12fdb407937591b4d87018ca860912017a2af0b7113e8938f2a4d9997ee (969,595 gas; scan after = 0), minProfit 10 WHYPE 0x923168615c196abd77e1e2e0e3d10ffe41e611148beb44a5580d6eb3ae3fdc4c (978,455 gas), non-owner 0xac8c0b5e70a48ab4e4769ba3113c088e6414e39bf038b3b9180edc8ec14da465. (2) IV-NEST-17: proof17.py -> proof17.json, reset 51,771,270 = parent of incumbent tx 0xbe899f6d9ee4ec34cba4daaec3a8ee402d2366c1e194a1b24811e917bd36bff2 (block 51,771,271, index 0, +0.053799 WHYPE). Deploy 0x75a62a9edaa73363ddf0d5c36ce3609b7b61827ff6e59c32e4a7588ca8badb50. scan() before: 300 / 1,000 / 3,000 / 10,000 / 30,000 / 63,600 / 120,000 WHYPE = 0.003945 / 0.011728 / 0.026563 / 0.045381 / 0.053020 / 0.053799 / 0.053599 WHYPE. SUCCESS 0xae3009ecebc9aad113a7cac25f1f079eec81b6ae4ee83de02ed57e8f2da86445 (fork block 51,771,274, 684,701 gas, 63,600 WHYPE): owner native +0.053798770 HYPE