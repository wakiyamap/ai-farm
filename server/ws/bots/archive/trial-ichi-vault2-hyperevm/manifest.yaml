max_loss_guarantee: "Executor IchiVaultArb2.run requires profit > 0 and profit >= minProfit in the borrowed token (WHYPE) after the flash loan is repaid (scratch/trial-ichi-vault2-hyperevm/contracts/src/IchiVaultArb2.sol:75; a losing route already fails at Morpho's repayment pull) and a deadline (:72), so a lost attempt costs gas only. Gas cap per send in bot.py evaluate() (constants GAS_LIMIT_MAX to GAIN_OVER_CAP): gas limit = eth_estimateGas x 1.25 (at most 1,900,000); maxFeePerGas = base fee x 1.3 + bid, never above fee_ceiling = 0.95 USD / (gas limit x HYPE price), HYPE valued at the WHYPE/USDT0 pool price x 1.15; no send unless the simulated native gain is at least 1.2 x gas limit x maxFeePerGas (GAIN_OVER_CAP); minProfit is that gas cap in wei + 1, so a mined success always ends with more native than it started. Priority-fee bid: at most 35 pct of simulated gross (BID_SHARE), never above the fee ceiling."
expected_value: "trial, win rate to be measured live. Competition, 7.06 d to 2026-11-20 19:43-19:52Z (scratch/trial-ichi-vault2-hyperevm/measure7-0x6bd209f2.json, measure7-0x71b7da3a.json; gains are floors, HYPE at 61.3 USD). IV-NEST-2, blocks 51,175,836-51,795,836: 579 same-transaction round trips = 82 a day, gain 2.3539 WHYPE = 144 USD, median 0.00107, max 0.03974 WHYPE; 80 takes of 0.01 WHYPE or more sum 91 USD, 44 at tx index 0; fee share of gross on those, median 22 pct, gas price median 5.1 gwei. IV-NEST-17, blocks 51,176,327-51,796,327: 197 round trips = 28 a day, gain 3.3296 WHYPE = 204 USD, median 0.00244, max 0.4499 WHYPE (27.6 USD, bid 186 gwei); 66 takes of 0.01 WHYPE or more sum 190.5 USD, 41 at tx index 0; fee share median 15 pct, gas price median 5.4 gwei. Takers on both: 0x30e81e4d (352 + 81 takes, +0.900 + 1.516 WHYPE; bids up to 186 gwei on the largest), 0x7b9836a3 (75 + 17, +0.860 + 0.553; 6-52 gwei), 0x79350c4b (69 + 24, +0.500 + 0.474; a steady 5.1 gwei), about 15 more contracts. This bot's fee ceiling is about 11-13 gwei (0.95 USD cap at a 1.0-1.2M gas limit), so it can outbid the 5.1 gwei taker but not the 10-186 gwei bids on the largest gaps; it aims at mid-size gaps (0.01-0.05 WHYPE) and pieces left after a first taker: a few sends a day expected, share unknown. One lost attempt: 0.8-1.0M gas = 0.005-0.3 USD at 0.1-5 gwei."
