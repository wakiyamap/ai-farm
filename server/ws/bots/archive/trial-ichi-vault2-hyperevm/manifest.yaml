awaited_events: "No single event: a gap opens when swaps move the other pool (NEST/kHYPE 0x23d95b24, WHYPE/USDC 0x6c9a33e3) away from the vault's own pool (0x535f30f5, 0xbe512f58). The bot polls scan() every 27 s and acts when the best candidate's gain exceeds 1.2 x its gas cap. Last taken by others: 2026-11-20, 89 round trips on IV-NEST-2 in the 24 h to 19:43Z (82 a day over 7 days, 11 to 162 per day); IV-NEST-17 28 a day over 7 days, last larger take block 51,771,271 (about 13:00Z). The next one is expected within hours."
good_signs: "logs/bot.jsonl: a poll heartbeat every 18 min; opportunity_skip or opportunity + paper_sim rows several times a day; live: send_result rows with result won and gas_used about 680k-850k."
bad_signs: "loop_error on every poll (a vault or pool changed, or the node stopped accepting the code override); read_budget before 23:00Z; no opportunity or opportunity_skip row for 2 days while others still round-trip the vaults (the bot's sizes or routes no longer fit); live send_result lost on every send with blocks_after_winner >= 0 (always late: report as blocks late)."
rpc_reads_per_min: "2.2 (one eth_call per 27 s) plus about 4 reads per evaluated gap"
alchemy_cu_per_day: "about 84,000-98,000 (0.045-0.052 USD): 3,200 scan polls x 26 CU = 83,200, plus 88 CU per evaluated gap; hard cap 98,000 relay CU/day in code, then it sleeps to 00:00 UTC. No feed filter."
legal_note: "Same class as trial-ichi-vault-hyperevm, allowed by the human decision decisions/human/2026-11-21-ichi-yes-peapods-fee-no.md section 1: arbitrage between the vault's public deposit / withdraw pricing and the pool price, not an attack on the vault's accounting. deposit and withdraw are the vaults' public functions, the pools and Morpho's flash loan are public. The bot reads mined state only, watches no mempool and no pending transactions; it may bid a priority fee for a public opportunity. It never swaps on a vault's own pool (0x535f30f5, 0xbe512f58), so it does not move the price the vault reads."
