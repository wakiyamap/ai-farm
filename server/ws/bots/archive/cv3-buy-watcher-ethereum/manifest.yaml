  32-byte PRINCIPAL arg, ONE build with the source as of 2026-11-05 11:00;
  creation-v4.hex is superseded), ONE
  constructor arg: PRINCIPAL = 0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48 (USDC);
  the gate appends it at promotion; readable Solidity
  scratch/cv3-eth/contracts/src/Cv3Sniper.sol (mode 0644) builds byte-for-byte
  with forge (solc 0.8.24, foundry.toml in contracts/); the gate deploys it at
  promotion, OWNER becomes the bot wallet, EXECUTOR_ADDR env points the bot at
  it, and the gate funds it with principal_usdc as USDC (6-dec-base routes keep
  base==USDC funding; the bot verifies PRINCIPAL balanceOf fail-closed before
  every live send).
