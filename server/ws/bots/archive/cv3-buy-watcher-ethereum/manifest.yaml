id: cv3-buy-watcher-ethereum
author: earner/qwen3.8-flash-next
chains: [ethereum]
strategy: >
  Compound v3 residual-collateral sniper: after ANYONE absorbs an underwater
  comet account (AbsorbCollateral topic0 0x9850ab1a...2f9412e), the borrower's
  collateral sits in the comet's reserves and anyone may buyCollateral() it at
  the comet's discounted oracle quote, then sell it on a Uniswap v3 pool.
  Polled every ~3 s via eth_getLogs AbsorbCollateral on the three watched
  comets cUSDCv3 (0xc3d688b66703497daa19211eedff47f25384cdc3, base USDC),
  cUSDTv3 (0x3afdc9bca9213a35503b077a6072f3d0d5ab0840, base USDT) and cWETHv3
  (0xa17581a9e3356d9a858b789d68b4d866e593ae94, base WETH — the ACTIVE comet:
  its absorb at block 26342224, tx
  0x3f7109f2873b3082e8a7df7bf226e71afd3ce09f1227a3e1a07de61fc084c9fa, is the
  fresh natural absorb of the 30d window, USDT collateral sold on the
  USDT/WETH pool). On a
  watched asset with a measured {asset, base} UniV3 pool (WETH/WBTC -> USDC
  and USDT -> WETH
  executable; the LINK/UNI -> USDC 500bps pools exist at the real factory
  0x1f98431c8ad98523631ae4a59f267346ea31f984 but hold no base-side liquidity
  (USDC balances 0.83 / 0.06 at block 26302063, measured 2026-11-04), so
  LINK/UNI are watch-only too; no USDT-side pools exist for these assets, so
  cUSDTv3 and COMP events are watch-only; measured token orders include BOTH
  orientations — the WETH/USDC pool is token0=USDC/token1=WETH, the
  WBTC/LINK/UNI pools are token0=asset/token1=USDC (eth_call token0/token1
  through the relay, 2026-11-04)), the bot
  sizes a PARTIAL buy with the comet's own linear quoteCollateral quote capped
  at 360 base units (matches the principal_usdc 360 funding; reserves-limited
  buys scale linearly), estimates proceeds
  from the pool's slot0 sqrtPriceX96 with integer-safe BigInt price math
  (multiply/divide by sqrtPriceX96^2 / 2^192, 0.995 factor applied exactly as
  199/200), and simulates the EXACT live executor call buy(comet, collateral,
  pool, payBase, minCollOut, minProfit, wrapPool, wrapLimitLow, wrapLimitHigh)
  (selector 0xc1d7afaa; wrapPool/limits only for the flash route base != USDC,
  the bot's fresh ±5% slot0 read of the {USDC, base} wrap pool as strict
  uint160 BigInt words) via eth_call against the
  deployed fork runtime (executor-runtime.hex): paper mode overrides only the
  CODE of a per-base funded placeholder — a live-chain address holding >= 360
  of the comet base (and >= 400e6 USDC for the flash route, so the paper sim's
  flash leg repays from a REAL principal balance), discovered from recent Transfer logs and verified
  fail-closed at startup (type=funding log; no candidate -> the deterministic
  placeholder, whose sims then revert on funding, never a false success) — so
  a paper call spends payBase <= 360 from a REAL executor base balance; no
  balance override; missing runtime fails CLOSED. minProfit = the FULL gas
  budget in base-token units + 80% of the gross-minus-gas margin, so the
  on-chain guard enforces an after-FEE profit floor. Live mode sends ONE
  transaction through the gate-deployed Cv3Sniper executor at EXECUTOR_ADDR
  (env; never to the comet directly), after verifying deployed code is
  nonempty, OWNER() == the signer wallet (20-byte compare of the padded
  return word) and base.balanceOf(executor) >= payBase (gate funding check);
  any of these fails CLOSED.
