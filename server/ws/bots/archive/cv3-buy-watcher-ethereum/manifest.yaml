good_signs: >
  bot.jsonl shows absorb/opportunity/simulate machine records with payBase <=
  360e6, collOut and proceedsEst consistent with the quote, a funding record
  per comet base naming the executor placeholder (balance >= 360e6 of the
  base), sim_ok on profitable absorbs and reserves_gone/no_edge logs when
  snipers were first or the discount is below gas; zero cycle errors;
  heartbeat counts growing. Window measurement (added run 122e6875, review
  3c9b5d18 requirement): opportunity records carry blk_ts (absorb-block unix
  time) and poll_delay_s (our poll latency event->detection), simulate
  records carry alive_at_s (residual still available this long after its
  absorb block at sim time) and est_incl_s = alive_at_s + the ~12 s expected
  inclusion, and reserves_gone records carry gone_after_s (upper bound on the
  natural residual lifetime). Capture is compatible with the ~3 s poll iff a
  measured alive_at_s/est_incl_s capture succeeds while gone_after_s events
  show the reserve outlasted est_incl_s. Occasional relay_lag records (the
  relay's getLogs head lagging our head reading; run 00fc9c93 guard: the
  cursor is preserved and the same range re-scans 3 s later) are the expected
  transient state, not a failure sign - unlike the pre-fix code they no
  longer appear in the cycle-error count.
bad_signs: >
  repeated sim_revert NO_PROFIT on profitable-looking events (proceeds
  estimate too optimistic), reserves_gone on EVERY event (we are slower than
  the 0-block snipers — then the strategy is race-blocked, record
  blocked_infra), funding_unresolved at startup (placeholder balance 0: every
  sim reverts on funding), or runtime_ok=false (fail closed, no simulation at
  all).
