max_loss_per_tx_usd: 20
max_loss_guarantee: >
  Cv3Sniper.buy() (bots/paper/cv3-buy-watcher-ethereum + executor source
  scratch/cv3-eth/contracts/src/Cv3Sniper.sol) snapshots base, collateral and
  the PRINCIPAL USDC balances BEFORE every leg, spends payBase at the comet
  quote, swaps ONLY the newly bought collateral delta on the owner-supplied
  pool (require collateral balance == start, "COLL_NOT_PRESERVED"), and reverts
  unless the executor's base balance ended at least minProfit+1 higher
  (require(baseAfter >= baseBefore + minProfit + 1), "NO_PROFIT"); on the flash
  route the transaction additionally reverts unless the PRINCIPAL USDC ended
  STRICTLY above its pre-trade balance (require principalAfter >
  principalBefore, "PRINCIPAL_LOSS" — review 9fe6b863 blocker 1: the flash
  repays the borrowed base side from the sale proceeds, so USDC depletion is a
  revert, not a loss) and unless the base inventory ended exactly where it
  started (require base == baseAfter-conversion, "BASE_NOT_PRESERVED"), with
  minProfit >= the gas budget estimate — principal loss is impossible, worst
  case = gas: bot.js caps gasLimit 640000 (run d237253f measured route gas
  496576 with deep frames starved below a 640000 signed cap under the 61/64
  rule); maxFeePerGas is DERIVED from the live base fee each cycle (maxFee =
  basefee + basefee/8 + tip; measured live
  base fee 0.0915 gwei at relay block 26348362 via eth_getBlockByNumber
  (re-measured run af858120 2026-11-05T11:33Z; the earlier build read
  0.0591 gwei at 26345032) — the
  relay rejects eth_baseFee — tip = maxPriorityFeePerGas estimate with a 2
  gwei fallback -> ~2.07 gwei at today's base fee = 0.00093 ETH ~ 2.3 USD at
  fresh pool prices; absolute cap 12.5 gwei (640000 x 12.5 gwei = 19.25 USD
  worst case < 20 USD, L; run d237253f raised the cap from 17.5 when GAS_LIMIT
  went to 640000), and every send fails CLOSED when the live base fee is not
  includable below the cap: the old fixed 1.5 gwei
  cap sat BELOW the historical base fees 4.6-16.1 gwei measured at blocks
  26301784-26302063, so it was not includable there), live send refuses when the fresh
  pool-priced worst case > MAX_LOSS_PER_TX_USD=20, fail closed; fork-measured
  executor gasUsed 273216/323932 success and 339402/402784 guard on the
  current direction-fixed artifact (the reviewer measured the initial
  398 USDC WBTC guard at 402784, replacing this file's earlier stale 372720;
  still within the 450000 cap). Signer enforces the same
  caps; a signer rejection is final.
expected_value: >
  ~1 absorb/day across the watched comets (30 AbsorbCollateral in the 30d window
  measured via eth_getLogs, protocols row 5; 14 absorbs in the ledger 7d
  window blocks 26300861-26342224, ~2.4/day across all comets; the THREE
  watched comets show ZERO absorbs in 26342225-26348399 — re-measured
  2026-11-05T11:4xZ run af858120 via eth_getLogs), the ACTIVE one being cWETHv3 (its
  26342224 absorb paid the 4.18%-under quote: 110.0203 WETH for USDT
  274708.044, and the 274.708 USDT residue sat in reserves until bought ~1
  block later). The buy discount is the mechanism: the
  fork-proven replay of the 26302053 reserve paid 11003.38 USDC for 5.2037
  WETH, ~8.6% under the same-block market; reserves stay catchable for many
  blocks (snipers measured buying 0-24 blocks after absorbs, protocols row 5).
  Our partial buy is capped at 360 base units (matches principal_usdc; the
  WETH cap 1.49e17 wei = 0.149 ETH <= 360 USD only while ETH/USD <= 2416), so
  a caught ~4-8% discount
  event pays ~14-35 USD gross minus ~0.1-15.5 USD worst-case gas; the
  earlier-build fork reproduction of the 26302052 state at the 398 USDC cap
  bought 0.18822 WETH
  for 398 USDC and sells for an estimated 413.284416 USDC (199/200-discounted
  slot0 quote; executed 415.266380 on the fork): +17.266380 USDC profit before
  gas, on-chain minProfit 12.525526 (fee budget 1.489969 included); small dust
  absorbs (the 26331463 buy was 1.32 USDC) pay less than gas and are skipped
  by the no_edge check. Poll-compatible watcher windows MEASURED from the 7d
  ledger (watcher buys after the same-asset absorb): 1 block / 12 s
  (0xa26ea01af0b7 at 26302053, 11003.38 USDC), 10 blocks / 120 s
  (0x0f2500d7a59b at 26302062, 119.08 USDC), 24 blocks / 288 s
  (0xdbb0d5399f14 at 26301808, 27.90 USDC) — our ~3 s poll cycle fits inside
  the 120-288 s windows; the 1-block case is the same-block-sniper race class
  we do not chase. Paper interval first, then promotion.
