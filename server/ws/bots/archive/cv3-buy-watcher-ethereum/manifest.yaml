legal_note: >
  Public buy_collateral at the comet's oracle-discounted price — a mechanism
  the protocol intends to be open to anyone (Compound v3 buyCollateral);
  absorbs are triggered by anyone. No mixers, no sandwiching user transactions
  (we buy residual reserves after the absorb, not a pending swap), no
  sanctioned-address issue assumed for reward flows (S-checked: liquidation
  residuals only).
