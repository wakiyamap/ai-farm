id: trial-aave4-avalanche
author: builder/claude-mythos-5-2
chains: [avalanche]
strategy: "trial: Aave V4 liquidations on the Avalanche Core Hub spoke (0x435272ce...), USDC debt against WAVAX, BTC.b, WETH.e or USDC collateral; the bot waits on the farm feed for AnswerUpdated of the Chainlink AVAX / USD aggregator behind the spoke oracle, re-reads the 100 borrowers nearest the threshold when the price changed, then one tx through the executor - Aave V3 USDC flash loan, liquidationCall, sell the seized collateral on UniV3 pools, repay, USDC gain or revert."
copied_from: "takers of the spoke's LiquidationCall in the last 7 d: 0xf86efcf912e59f82318081b9ec2884b8ec779d77 (tx 0xc6e96719c5c14300088fe1d10cfbb6cbe5f0111f8ddc888517e19f1bed19ba54 block 100333136, kept 45.66 USDC, the fork-proof case), 0x11df212054e561ab512b0011ac43a2907e705034 (tx 0x1848868aaf694b3af31a43504044228db7c31b81dec06e3bd2e44d840f287aa1 kept 143.99 USDC: Aave V3 flashLoanSimple + UniV3 WAVAX/USDC, the same route), 0x5ac9bc14376bf2727c6211960cf3cec1e2f295bd (tx 0xc9e9b0f40d36f9d71bd4558966b7db326abc364dc585689d7995abfad25b8c1b kept 192.0 USDC), 0x6ebfb34731d9714afe453ff447bc9441b25e88c8, 0x3dbddadf5d0c933e6827af9a58836dd3338b7205, 0xff296e47bb9d934c6850d9e2d25503e2a971eee7; sister bot trial-aave4-optimism"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialAave4TakeAvax.take reverts NoProfit() unless its USDC balance grows by minProfit after the flash premium (scratch/trial-aave4-avalanche/contracts/src/TrialAave4TakeAvax.sol:89), so a lost attempt costs gas only. Gas cap per send in bot.py:81-84 and 338-349: GAS_LIMIT 1,300,000 x maxFeePerGas, with maxFeePerGas <= 0.90 USD / (AVAX price of the spoke oracle x GAS_LIMIT) (about 98 gwei at AVAX 7 USD) and never above 300 gwei; the bot sends only when the cap is under 1 USD and the simulated gross is above it, and passes the cap as minProfit. Priority-fee bid: at most 50% of simulated gross (BID_SHARE, bot.py:84), and never above the fee ceiling minus the base fee."
expected_value: "trial, win rate to be measured live; honest expectation 0-1 wins per week. 7 d competition at this entry (blocks 100,140,245-100,820,693; scratch/trial-aave4-avalanche/windows.json): 12 LiquidationCall, all USDC debt (WAVAX 8, BTC.b 3, WETH.e 1 collateral), 6 takers (0x6ebfb347 4, 0x5ac9bc14 2, 0x3dbddadf 2, 0x11df2120 2, 0xf86efcf9 1, 0xff296e47 1); 6 taken in the block they became liquidatable (priority 0.66-27 gwei, tx index 3-83), 6 one block (about 1 s) later, of which five paid 873-46,758 gwei priority (1.0-112 AVAX of fees per take) and one paid 22 gwei (0xc6e96719, kept 45.66 USDC; the bot's full take of that position at the parent block pays 117.89 USDC on the fork). The bot aims at that last kind: its fee ceiling is about 98 gwei. One attempt is about 0.74-0.84M gas = 0.006-0.04 AVAX (0.04-0.28 USD) at the 8-39 gwei base fees of the window, at most 0.90 USD at the cap."
executor: scratch/trial-aave4-avalanche/contracts/out/TrialAave4TakeAvax.sol/TrialAave4TakeAvax.json
executor_args: "{bot}"
executor_note: "No principal: the repayment comes from an Aave V3 flashLoanSimple (5 bps premium) taken and repaid inside take(), so no principal_usdc. constructor(address bot) only; flash lender, debt token, spoke, reserve ids, collateral token, user, flash size, pool path and minProfit are call arguments, nothing is baked in and there is no setup tx. executeOperation accepts only the lender named for the running take(), initiator == the executor itself, and the asset and amount of that take; the swap callback accepts only the pool of the running swap; both peers are cleared. Debt-token approvals (spoke: the loan; lender: loan + premium) are exact and reset to 0. Only the collateral received in this call is sold and all of it must be sold (Leftover revert on a partial fill); an empty path is required exactly when the collateral is the debt token (BadPath otherwise). Profit is paid to the bot wallet in the debt token; the bot always passes native USDC 0xB97EF9Ef8734C71904D8002F8b6Bc66Dd9c48a6E. Token calls accept tokens without a bool return. Owner-only sweep(token) for recovery. Live address from EXECUTOR_ADDR_AVALANCHE or EXECUTOR_ADDR only; the paper address is a code-override target and is never used live."
fork_evidence: "scratch/trial-aave4-avalanche/proof.py (lease, reset avalanche 100333135 = parent of the mainnet take 0xc6e96719..., deploy the artifact, fund, 3 guards, success, repeat, release); result in scratch/trial-aave4-avalanche/proof-result.json, PROOF OK. WAVAX collateral, user 0x3c42aaafe27f8fcd279a07bbaedb605ad6426c6f, health factor 0.99809 before: success 0x248c2ea5bc86109e3185bf949daf268818f3b35e6311a0e0405d1f4eca697939 (fork block 100333140: the deploy and the three guard sends consume fork blocks; gas 739,552): owner USDC +117.888557, owner native -0.007821 AVAX (gas), debt 1,524.98 USDC fully repaid, executor left with 0 USDC / 0 WAVAX / 0 allowances. Reverts: non-owner 0x14ff8bc577573f8b415f01d698a17aacd9b7f9caf967ac278080c3b2eaa999bf (NotOwner 0x30cd7471), healthy user 0xa0f4b32f4a027ae776c72a74d3121869ee53feaa63d77ce060b3b6d8db3de9d2 (spoke error 0x930bb771, gas 346,339, owner USDC delta 0), minProfit above gain 0xb24f61f84271a967b4cff4d2b47fcd3ae37302aa3a74d211dbd090c83dbfafa3 (NoProfit 0xe39aafee, gas 835,173), same user again after the take 0x28e7d7c7639abe39199fd5369322127e96b0dfea64ac6f47072279622db1f394 (0x7b55ea4a: nothing left to take). Paper override = eth_getCode of the fork deployment (executor-runtime.hex). scratch/trial-aave4-avalanche/selftest.py (selftest-result.json) runs the bot's own scan / attempt paper path through the relay at the parent blocks of three mainnet takes: 117.888554 USDC (block 100333135), 322.134400 (100331791), 17.089215 (100333300), each an opportunity row and paper_sim success; hand-built calldata equals cast calldata; full scan at head: 531 borrowers, 272 debtors, 0 candidates, min health factor 1.0020. Not fork-proven: the BTC.b and WETH.e pool paths (no take of theirs was liquidatable at a parent block)."
awaited_events: "Feed /logs filter on avalanche: AnswerUpdated(int256,uint256,uint256) topic0 0x0559884fd3a460db3073b7fc896cc77986f16e378210ded43186175bf646fc5f on the Chainlink AVAX / USD aggregator 0xcfbfe648ba88bf7d9776d970417a0b26c315feb4 (source of reserve 0 behind spoke.ORACLE(); 109 logs in the last 10,000 blocks = about 1,050 per day, the next one within minutes). On each log the bot re-reads the near set's health factors (getUserAccountData by Multicall) and attempts those under 1. Last liquidation at block 100348589 (2026-11-14); 12 in the last 7 days, clustered (8 within blocks 100,313,402-100,348,589). At placement the lowest health factor is 1.0020, so the next one needs about a 0.2% fall of that borrower's collateral."
good_signs: "logs/bot.jsonl: feed rows (events, blocks, delay_s about 1-2 s) each followed by a scan row labelled oracle_update with min_hf moving, safety_poll scans only when the feed was silent for 5 minutes; opportunity + paper_sim success rows when a health factor crosses 1; live: send_result rows with result won."
bad_signs: "feed_error on every cycle (feed down or the chain's 16 filter slots full: the bot then re-reads the near set every 60 s through the relay) or no feed row for an hour (aggregator replaced: re-read aggregator() of source 0x0a77230d...); feed delay_s above 3; scan_error or loop_error on every cycle; simulate_revert on every candidate with an error other than 930bb771 (route or flash source broken); opportunity_skip on every candidate (base fee above the fee ceiling); live send_result lost with blocks_after_winner >= 1 on every send (always late); read_budget rows."
rpc_reads_per_min: "about 0.8: 1 Multicall eth_call per feed delivery (about 1,050 per day) plus 1 per 5 minutes of feed silence; about 12 reads per full scan every 12 h; 1 per 60 s only while the feed is unreachable"
alchemy_cu_per_day: "about 65,000 (0.034 USD): feed filter about 34,000 (1,050 logs x about 660 bytes x 0.04 CU, plus 3-4 CU/min idle) + one 26 CU re-read per delivery about 27,300 + safety polls <= 7,500 (in practice few) + full scans 1,100 + attempts; relay hard cap 60,000 in code (CU_CAP), feed on top, total under 100,000"
legal_note: "The Aave V4 liquidation bonus is a public payout to any caller of liquidationCall(); no mempool watching, the bot reacts to confirmed Chainlink AnswerUpdated logs and reads confirmed state; it bids a priority fee for a public reward."
expedite: false
