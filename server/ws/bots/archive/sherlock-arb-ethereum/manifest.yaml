id: sherlock-arb-ethereum
author: builder/claude-mythos-5-2
chains: [ethereum]
strategy: "Sherlock V2 staking pool (0x0865a889) public arbRestake(id): a staking position whose lockup ended more than 2 weeks ago and whose owner neither redeemed nor restaked may be restaked for 26 weeks by anyone; the caller is paid USDC out of the position, 0 at lockupEnd + 2 weeks growing linearly to 20 pct of the position over 7 days. The start of every ramp is known weeks ahead from lockupEnd(id). The bot scans lockupEnd once a day, sleeps until a position is 6 h into its ramp (the dust sweeper 0x00008004 takes at about 0.30 USDC of reward, hours in; one large position, id 703, was taken by 0x9fe5f3ee 696 s after its start on 2026-11-08, before this point), and sends one private transaction through the SherlockArb executor, which calls arbRestake for the listed ids, reverts unless it received at least minProfit USDC, and pays it to the bot wallet. No principal."
copied_from: "Keeper 0x00008004f94cfede26393adb288001f1c987bb52 through 0x0000c94a3aadb903f436bb1000521c0023516000 (tx 0x010f3becda0b1c96733e16e04308156deccec4604c52763a3bd28a005a0d0c33, block 25,386,151: ids 8 and 29, 47.11 + 23.43 USDC, 623 and 619 min after the ramp start; last 7 days 0x3c51a03f345c8283fa0c69121bb0b3def5122de48009ca343ed77d73da6b67dd, 30 ids, 4.43 USDC) and 0x70828487ca8c7b1f06d1e1c7e86dc094c96911bd (tx 0x96bb3e13e06493f1438c495e9d686fe28dae3fcbbf49bdee3b6b2e5d716519f0). Same call (arbRestake per id, batched); changed: own owner-only executor with a minProfit check, a fixed 6 h point on the ramp instead of a daily sweep, private send."
capital_usd: 20
allowed_contracts: []
send_route: private
max_loss_per_tx_usd: 15
max_loss_guarantee: "Executor SherlockArb.run (scratch/sherlock-arb-ethereum/contracts/src/SherlockArb.sol:37-46) spends no token of the bot: it calls arbRestake(id) for each id, then reverts NoProfit unless the USDC it received is > 0 and >= minProfit, and transfers all of it to the owner; so a mined success ends with more USDC and a failure costs gas only. Deadline block (:36) = head + 3. Gas bound in bot.py evaluate(): gas limit = eth_estimateGas x 1.3, at most GAS_LIMIT_MAX 2,500,000; maxFeePerGas = min(3 gwei, 1.5 x base fee + 0.1 gwei) (MAX_FEE_WEI, PRIORITY_WEI), so the worst case is 2.5M x 3 gwei = 0.0075 ETH = 12.4 USD at 1,650 (in practice one restake = 314,487 gas x about 0.22 gwei = 0.11 USD); no send unless simulated USDC reward - that send's gas cap >= 0.02 USD (MIN_NET_USD); minProfit = max(95 pct of the simulated reward, the gas cap in USDC); at most 8 sends per UTC day (MAX_SENDS_DAY). Private route: a transaction that would revert is not included."
expected_value: "Counted class, net of gas, per occurrence (README table; scratch/sherlock-arb-ethereum/occurrences.py, run 2026-11-22T06:44Z): last 30 days (blocks 26,252,924 - 26,468,924) 71 occurrences, 22 counted (window from the bot's own send condition to the incumbent's take: min 564 s, median 41,424 s), bot gross 5.61 USDC, bot gas 2.87 USD, net 2.73 USD = 0.091 USD/day; last 361 days 402 occurrences, 94 counted (windows min 168 s, median 9,696 s), gross 65.25, gas 12.50, net 52.75 USD = 0.146 USD/day, of which 40.55 USD is one transaction (0x010f3bec, block 25,386,151, ids 8 and 29 left for 10.4 h). This is below 1 USD/day. The earlier 0.3 to 2 USD/day was the incumbents' realized gross and is withdrawn. 49 of 71 (308 of 402) occurrences were not takeable: the incumbent took them before the bot's rule was true, including id 703 (4,843.74 USDC) taken 696 s into its ramp by 0x9fe5f3ee (tx 0x749de1ab1b1893f6b971485831a26c519526915f5429d2cf996e4016dd1c6429), so the forward cluster of 2026-12-22 to 2027-01-02 (14 positions, up to 98 USDC at the 6 h point if no owner and no faster taker acts) may pay 0. No-lag threshold rules on the same occurrences pay 0.013 - 0.059 USD/day (occ_alt.py). Next known occurrence: id 668 (247.52 USDC), ramp start 2026-11-30T18:59:23Z, 1.77 USDC at the 6 h point (time-warped fork) for about 0.11 USD gas. Read cost 0.013 - 0.015 USD/day."
executor: scratch/sherlock-arb-ethereum/contracts/out/SherlockArb.sol/SherlockArb.json
executor_args: "{bot}"
executor_note: "Deploy gas 357,130 on the fork. constructor(address bot) only (owner immutable). Pool, reward token, id list, minProfit and deadline block are call arguments; nothing is stored, no approval is given, no callback is received (arbRestake only transfers USDC to the caller). An id that is no longer restakable is skipped by try / catch so one stale id does not void a batch; the minProfit check is on the total received. The transfer to the owner accepts tokens with or without a return value. No receive(): it never handles native. Nothing stays in the executor (fork: 0 USDC after each success)."
fork_evidence: "scratch/sherlock-arb-ethereum/proof.py (one script: lease, reset at head - 3, deploy, fund, guards, success, release; real fork txs, no setCode; the scan, the ids, the calldata and the send decision come from the bot's own bot.py with its rpc pointed at the fork; the bot's hand encoder is asserted equal to cast calldata). Result proof.json: fork reset 26,468,666 (first block read 26,468,667, ts 1795326563), owner 0x1111111111111111111111111111111111111111, executor 0x8f7a45ebde059392e46a46dcc14ab24681a961ea, deploy 0x79e5eabf4bb5d1e8abab54822f1f5fc8691c930d544521c15ecdd58a627b20e5. SUCCESS 0x8235cc71aa5e96606f550e59bdc2484e44c32dee0f97e9e7f7c7bc5e8ab991e9 (fork block 26,468,673, 314,487 gas): id 479, owner USDC +0.122772 (the simulation one block earlier said 0.122710: the reward grows with time), owner native -0.000333861 ETH (gas at the fork's 1.06 gwei), executor USDC 0, lockupEnd(479) moved to 1811051471. Correct reverts: non-owner 0xf3403ed173b767a4a57d989a81350f3a0031a0ae76f36a31a586b2aa7ea76b55; nothing to take (id 3, not in its ramp, NoProfit) 0x72a08147ac8f48c8a5c034d79a5de465fd6e95cadb6ed0e26d6cd4bf3e117d48; minProfit x 1000 0xb1f895a6a060b9c42618ce4e45f968208a30b170b742a28947e439ef423ff10c (323,140 gas); deadline in the past 0x76b50b5fa132a2417d1c6f7db59f2d6b1261cc44b06aa242261b97038882199f; the same id again after the success 0x09ebf14d4db957a092b9a4b3318790fbf341ead62ba74ed3170aff8afd9ce409. Time-warped fork (evm_setNextBlockTimestamp to ramp start of id 668 + 6 h + 60 s = 1796086823; not a past block, labelled as such): bot.step() logged opportunity + paper_sim for id 668 (1.77292 USDC, gas estimate 334,363), and the same bytes sent 0x177fac1bc2471d1edc3f987e2628910531518496a07ff51cf2953c93472de705 paid the owner +1.773002 USDC. Paper runtime executor-runtime.hex = eth_getCode of that fork deployment."
awaited_events: "A position reaching 6 h into its ramp (lockupEnd + 2 weeks + 6 h). Last natural occurrence: tx 0x7a0fb23188270acbd0d0974ba1ddb9b4cb996ea1fd0ebec35f50de8642d68ee1, block 26,459,861 (2026-11-20, 5 dust ids). Now: id 479 (1.78 USDC) is in its ramp since 2026-11-19T19:46:59Z, its reward (0.12 USDC) is about one restake's gas. Next: id 668 ramp start 2026-11-30T18:59:23Z, bot acts 2026-12-01T00:59Z unless the owner redeems or restakes before; 7 dust ids 2026-12-02T08:05:11Z; the larger cluster from 2026-12-22T10:33:47Z."
good_signs: "logs/bot.jsonl: a scan row once a day with about 203 positions and next_starts listing id 668; sleep rows; on 2026-12-01 an opportunity + paper_sim row for id 668 near 1.77 USDC; live: send_result won with gas_used about 315k and the wallet's USDC up by the logged reward."
bad_signs: "scan row with positions far from 203 (a getter failing is read as 'does not exist'); position_left_ramp for id 668 before the bot's 6 h point (an incumbent got faster: shorten LAG_S or close) or its lockupEnd changing before 2026-11-30 (the owner acted: no occurrence); send_result private_not_included repeatedly (the private route does not include at a 0.1 gwei tip: report to inbox/meta); simulate_revert on a position in its ramp (pool paused or strategy withdrawal failing).; a large position taken within minutes of its ramp start by another address (as id 703 on 2026-11-08): the 6 h point earns nothing on large positions."
rpc_reads_per_min: "0.6 on average: one scan of about 865 eth_call a day, plus 4-6 reads every 30 min while a position is in its ramp and its reward is under gas"
alchemy_cu_per_day: "about 25,000 (0.013 USD): 865 eth_call x 26 CU = 22,500 for the daily scan, plus up to 48 x 5 x 26 = 6,200 while a dust position waits; hard cap 60,000 relay CU/day in code, then it sleeps to 00:00 UTC. No feed filter (times are known in advance)."
legal_note: "arbRestake is the protocol's own documented incentive for third parties (verified source: 'Allows someone who doesn't own the position (an arbitrager) to restake the position for 26 weeks', reward schedule fixed in the contract; the owner had 2 weeks to act and agreed to these terms by staking). Reads mined state only, no mempool watching, no reaction to pending transactions; the private route only hides our own transaction and tips the builder 0.1 gwei, no bid for ordering."
