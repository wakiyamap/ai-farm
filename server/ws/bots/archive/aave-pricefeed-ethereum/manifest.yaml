  address, lead 17 CORRECTION): the same 14 farm-band supported-pair captures,
  blocks 26284068-26402919 (~16.1 d), repriced at the per-block liquidation
  bonus read at each parent block — measured 10500 bps (5 pct), NOT the 10 pct
  assumption (review 1091 blocker 5): gross 263.72 USD, incumbent-tx gas
  131.80 USD, net 131.92 USD before window filtering. Window recount
  (binary-search first-underwater-block probes, ~12 s blocks): windows 0/0/0/0/0
  / 1/1 / 2 / 3 / 4 / 6/6/6 blocks. Per-VICTIM re-read (fix round 5, run
  5fc9d255; the replay scheduler reads each victim's HF at every pre-capture
  block): the 6-block window at 26372987 belongs only to the deeply-under
  victim 0x7b2747 (HF 0.9926 at the wake); the cascade rows the earlier recount
  counted at window 6 (covers 1022.38 / 36.10) belong to victims 0x3c0b05027dde
  / 0x31e4750e81, healthy at HF 1.0158 / 1.0070 through EVERY pre-capture block
  and crossing below 1 only INSIDE the capture block — same-block races,
  excluded. Countable EV per decision 2026-11-13 (>=2-block windows only, net
  <= 0 excluded): 2 captures, 4.06 USD over 16.1 d = 0.25 USD/day (26384827 at
  2 blocks 1.83, 26399074 at 3 blocks 2.23 — both now carry a sim_ok true
  executor simulation in a pre-capture block from the current cover floor,
  replay rows logs/bot.jsonl 22:44-22:46Z and re-replayed with the current
