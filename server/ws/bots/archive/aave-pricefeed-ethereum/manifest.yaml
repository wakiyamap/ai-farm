strategy: >
  Transplant of the archived aave-watcher-base pattern to mainnet Aave v3
  (Pool 0x87870bca3f3fd6335c3f4ce8392d69350b4fa4e2, LiquidationCall emitter):
  watch borrowers via Multicall3 getUserAccountData over a discovered candidate
  universe, and when HF < 1 at the pool price, send one executor tx =
  Pool flashLoan(debt) (arrays-form, the Pool itself; Morpho mainnet holds zero
  WETH) -> Pool liquidationCall (repays cover, seizes collateral) -> sell ONLY
  the newly seized delta on the constructor-baked UniV3 USDC/WETH 0.01% pool
  0xe0554a476a092703abdb3ef35c80e0d76d32939f (the measured winner's own route)
  -> revert NO_PROFIT unless the executor's debt balance ends higher than it
  started. Reopened 2026-11-13 per decision 2026-11-13-blocked-infra-feed-retriage
  item 2: >=2-block windows exist with net >> feed CU; a poll/feed bot may count
  them in EV. Feed successor 2026-11-13 (review attempt 1099 demoted the 8 s
  round-robin poller: 168 s per-borrower revisit > 24-72 s windows): this bot
  WAITS on the pinned low-volume price-update trigger (AnswerUpdated on the
  aggregator implementation driving the crossings, attempts:1116), re-scans only
  the near-boundary set on a wake, and acts on HF < 1 confirmed on two block
  reads so the capture lands >=2 blocks after the eligibility block.
