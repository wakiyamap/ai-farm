max_loss_per_tx_usd: 20
max_loss_guarantee: >
  One transaction through the bot-deployed AaveEthLiquidator: its OWNER-ONLY
  liquidate() ends with require(balAfter >= balBefore + minProfit + 1, "NO_PROFIT")
  on the executor's debt-asset balance (scratch/aave-watcher-ethereum/contracts/src/AaveEthLiquidator.sol:116),
  so any shortfall rolls the tx back and the worst case is gas only; the same
  tx then transfers exactly balAfter - balBefore of the debt asset to the OWNER
  wallet (same file :124 — review 1091 blocker 2: the profit arrives in the
  watched bot wallet in the liquidation transaction itself, sweep() is only a
  leftover fallback and the executor keeps no profit inventory). Gas is
  bounded by the send itself: gas = MAX_GAS_LIMIT 900000 with maxFeePerGas = the
  derived cap (baseFee*9/8 + tip, hard cap 17.5 gwei; 900k x 17.5 gwei = 0.01855 ETH
  ~= 45 USD at 2400 USD/ETH) — and liveLiquidate REFUSES the send when the fresh
  USD valuation of gas x cap exceeds MAX_LOSS_PER_TX_USD 20 (bot.js fail closed),
  with 2 x APPROVE_GAS 80k added at the same cap, and refuses it unless the
  expected GROSS clears that fresh bound too (review 1091 blocker 4, bot.js
  liveLiquidate 'expected gross ... <= fresh gas bound'). Cover is capital-sized
  (<= MAX_COVER_USD 250).
