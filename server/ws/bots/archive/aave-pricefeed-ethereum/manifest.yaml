  re-simulation of ~23 permanently-underwater dust debtors in the cold-seed
  universe was suppressed after their first no-profitable-pair simulation), the
  pre-filter net 8.2 USD/day is the ceiling the class can pay at full size; our
  own send gas <= 20 USD is
  enforced at a fresh price (below the incumbent gas column, no priority race
