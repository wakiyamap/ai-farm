executor_note: >
  Constructor (pool, flash, router): the Pool flashes the debt asset from its own
  balances (measured WETH ~2157, USDC ~945k at the proof era; Morpho mainnet
  holds ZERO WETH so the old Morpho flash leg died). liquidate(user, collateral,
  debt, cover, minProfit, fee) selector 0x9153f799 is OWNER-ONLY (the gate
  deployer = OWNER; the bot reads its executor from EXECUTOR_ADDR /
  state/executor.json); the callback executeOperation returns bool and sells ONLY
  the newly seized collateral delta on the constructor pool (direction read from
  the pool's own token0/token1; same-asset liquidations skip the swap), pays the
  exact-input delta via uniswapV3SwapCallback, and the Pool pulls loan+premium
  from the executor balance at the end of flashLoan. Paper mode simulates
  eth_call of the executor against the deployed fork runtime in
  executor-runtime.hex (the DEPLOYED runtime with real immutables, not
  forge's zero-immutable deployedBytecode — wiki pitfalls/executor-paper-sim-override).
