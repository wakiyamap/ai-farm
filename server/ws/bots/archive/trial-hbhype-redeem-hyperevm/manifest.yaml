id: trial-hbhype-redeem-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: buy hbHYPE (Hyperbeat / Upshift vault share) on its four WHYPE V3 pools whenever a pool sells it under the vault's instant redemption value, redeem it at the vault in the same transaction (flash swaps, no principal), keep the difference as HYPE"
copied_from: "operator A EOA 0x4d396974c5813159c704e96acdada21eb01005ed through 0x822b3b26195d80178db1f60967f35cab8681527f (tx 0x2a2556209e8b1e4d55aee3bccedb5222926b457e66d4888017f1b4dddabd3cd8, block 51380628, kept 0.02976 WHYPE; also 0xb340f5d87af372cc3b9de8d9ce75c368c1cc840dcc44be4a41f2478ed43e15c4); operator B EOA 0x4021cf3f1df4156a659d6cfb00438e065fe5ab2c through 0xb42dd31bbc03c3b3de88cdaafa0285f68954c2bf (tx 0xba0a870e6c5dbe2301068a829d447fe0bf3c2084c74b13ac649aac25b1b1df72). They buy with their own WHYPE; this bot pays the pools from the redemption inside the swap callbacks instead."
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "Gas only. RedeemArb.take reverts NoProfit unless its WHYPE balance grew by at least minProfit, and the bot sets minProfit = gasLimit x maxFeePerGas of that send (bot.py check(): cap = gas_limit * max_fee, passed as min_profit to take_calldata), so an included send either pays more than its own gas cap or reverts and costs gas. A send happens only when the simulated gross > 1.3 x that gas cap (SEND_MULT). Caps in bot.py: MAX_FEE_CAP_WEI 7 gwei, GAS_LIMIT_MAX 1,400,000 (under the 2,000,000 hyperevm limit), so at most 0.0098 HYPE = 0.59 USD a send at HYPE 60.40 USD, and MAX_TX_USD 0.95 at a 90 USD reference price. Priority fee bid: at most 1/10 of the simulated gross, never above 2 gwei (TIP_SHARE_DEN, TIP_MAX_WEI). No principal: the pools hand out the shares first and are paid from the redemption."
expected_value: "Trial: measures the win rate by sending. Last 8 days (700,000 blocks to 51,872,631, scratch/ra22b/hb-scan.json and hb_pool.py): one burst, 7 paid takes by two operators plus one contract-creation take, about 0.14 WHYPE = 8.4 USD in total at HYPE 60.40 USD; gas price of the takes 0.10-0.98 gwei, no bidding. The first take came 4 blocks after the sale, but the takers use small fixed sizes: a 1.3-1.5 pct gap was still open 71 blocks later and a 1.0 pct gap stood 93,237 blocks (about 26 hours) before operator A closed it for 0.0298 WHYPE; this bot's optimal take at that parent block is 0.0305 WHYPE (relay eth_call, proof-result.json). Aim: the part of each gap that stays open for more than one 35 s look, i.e. most of it; about 0.5-1 USD a day in a week with a sale, cents in a week without. At head 2026-11-21 16:50Z the pools are 0.14-0.22 pct under value: 0.00098 HYPE = 0.06 USD takeable against a 0.00025 HYPE gas cap."
executor: scratch/trial-hbhype-redeem-hyperevm/contracts/out/RedeemArb.sol/RedeemArb.json
executor_args: "{bot}"
executor_note: "RedeemArb(address bot), Solidity 0.8.24, 3,055 runtime bytes, deploy 715,049 gas on the fork (hyperevm limit 2,000,000). take(vault, wnative, legs[], minProfit) is owner-only: nested V3 flash swaps (one per pool, each with its own sqrtPriceLimit and maxIn), one requestRedeem of all shares in the innermost callback, each pool paid from the redemption, then NoProfit unless the WHYPE balance grew by minProfit (> 0), unwrap, native to the owner. Vault, token, pools, directions and limits are call arguments; nothing is baked in, no setup tx, no approvals (the vault burns the holder's own shares, the pools are paid by transfer). The callback is the fallback (any V3 fork's callback name) and only accepts the pool that take() is calling at that moment (_expected, set before each swap, cleared at the end). Constructor arg = the bot wallet only."
fork_evidence: "scratch/trial-hbhype-redeem-hyperevm/proof.py (one lease; result proof-result.json). The hyperevm fork serves head storage at old blocks (wiki pitfalls/hyperevm-fork-head-state.md), so: (A) head fork 51873142, real txs: deploy 0x32c0cd9d... (715,049 gas); a fork-only Seller fixture sold 12 hbHYPE taken from Morpho Blue's collateral balance into three pools (no code or storage overwritten), gaps 2.2 pct; non-owner 0x4edbb867... reverts NotOwner; guard 0x7ab6ca01... (minProfit 1e24) reverts NoProfit(0.1482 WHYPE, 1e24), owner delta = gas only; success 0xabe1b793... block 51873151, 630,068 gas: owner native +0.146954 HYPE after 0.00126 HYPE gas (2 gwei), paid 0.148214408 = the eth_call value exactly, 13.43 WHYPE redeemed from the vault, executor leftovers 0; repeat 0xca7041e0... reverts (SPL, nothing left). (B) historical, relay eth_call with the fork runtime as code override: block 51380627 (parent of the incumbent's take) gain 0.030512791 WHYPE on four pools (incumbent kept 0.02976), block 51380628 (after it) 0.00075. selftest.py: the bot's own check() in paper mode logs paper_sim success at head (0.000977 HYPE) and pinned to block 51380627 (0.0305 HYPE)."
awaited_events: "Somebody selling hbHYPE into one of the four pools instead of redeeming (a liquidation of Morpho hbHYPE collateral, a routed sale). Last burst: blocks 51286953-51380628 (2026-11-15/16), three sales. Small dips of 0.1-0.3 pct happen every day or two (51829114, 51853347) and are takeable for cents. Next: unknown; the vault is withdrawal-only, so holders keep leaving."
good_signs: "paper_sim success lines; live send_result won with net_wei > 0; opportunity lines whose gross is well above cap_wei"
bad_signs: "send_result lost several times in a row (somebody now takes within one look); simulate_revert step=guard on every opportunity; check lines with error (vault paused, a withdrawal fee set, or redemptions no longer instant: the bot stands down when withdrawalsPaused or withdrawalFee is non-zero); vault WHYPE balance (19,856 at placement) running out"
rpc_reads_per_min: 1.8
alchemy_cu_per_day: 66000
legal_note: "Public redemption open to every holder (37 different senders redeemed in 8 days) and public pools. No mempool watching, no reaction to pending transactions: the bot reads confirmed state on a timer. Buying a token below its redemption value and redeeming it is plain arbitrage; it moves pool prices toward the vault's value."
expedite: false
