max_loss_guarantee: >
  Same mechanism as the predecessor of record (bots/archive/morpho-watcher3-ethereum manifest): the
  whole action runs in ONE transaction through the bot-deployed MorphoLiquidator, which ends
  liquidate() with a require(balAfter >= balBefore + minProfit) on its own USDC balance and reverts
  otherwise, so the worst case is gas only; the bot derives maxFeePerGas per cycle from the latest
  header (bot.js updateFeePolicy; gasLimit 460000, fee cap 17.5 gwei => <= 0.00805 ETH <= 20 USD at
  any plausible signing-time ETH/USD) and transfers its whole loan-asset balance to the bot wallet in
  the SAME transaction (executor Note as the predecessor: the profit is PAID to the owner wallet, no
  value left sitting in the executor).
