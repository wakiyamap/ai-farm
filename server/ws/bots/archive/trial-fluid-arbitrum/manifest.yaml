id: trial-fluid-arbitrum
author: builder/claude-mythos-5-2
chains: [arbitrum]
strategy: "trial: Fluid VaultT1 liquidations on Arbitrum (WBTC/USDC, WBTC/USDT, ARB/USDC, ETH/USDC, ETH/USDT, wstETH/USDC); a 40 s timer asks each vault what is liquidatable, then one tx flash-swaps the debt token out of a UniV3 WETH pool, calls the vault's open liquidate(), turns the collateral into WETH, repays the pool and keeps the rest as native ETH, or reverts."
copied_from: "takers of Fluid LogLiquidate (topic0 0x80fd9cc6...) on these vaults, e.g. tx 0x3208b3cc35cf43344163b2248972886e4e5ae19201af407b3eb30d7f44356c86 (liquidator 0x5ac9bc14..., block 524328070, 21.914705 USDC for 36359 sat on vault 0xe16a6f53) and tx 0xd43db5c06dc56a06a6bcfeb2c7bf08ea5ccba8b3c4d8fd958d32f80702da89a5 (liquidator 0xb9aea51c..., block 524328180, vault 0xbec491fe); attempts:1967."
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialFluidTake.take reverts NoProfit() unless its WETH balance grows by at least minProfit after the pool is repaid (scratch/trial-fluid-arb/contracts/src/TrialFluidTake.sol:77), so a lost attempt costs gas only. Gas cap per send in bot.py:75-87 (constants) and attempt() bot.py:274-331: gasLimit = eth_estimateGas x 1.30 (never a constant; refused above 3,000,000), maxFeePerGas <= 0.95 USD / (WETH/USDC pool price x 1.15, or 4,000 USD before the first read) / gasLimit; the bot does not send unless gasLimit x maxFeePerGas is < 1 USD and the simulated profit is above it, and passes that cap as minProfit. Priority-fee bid: at most 40% of simulated gross (BID_SHARE), never above the fee cap."
expected_value: "trial, win rate to be measured live. 7 d competition (attempts:1967, scratch/pythcensus-e7c8/fluid-arbitrum.json and scratch/trial-fluid-arb/probe.out; blocks 522,808,642-525,208,642): 477 Fluid vault liquidations on Arbitrum by 12+ liquidators, 429 on these six vaults, all up to 2026-11-15. In a sample of 36, 13 became takeable in the block they were taken, 18 one block (0.25 s) earlier, 5 were open for 4-40 blocks (ARB/USDC, under 1 USDC of debt). Winners paid 0.02-0.14 gwei effective (median 0.038), tx index median 6. Fork gross on three of the mainnet takes: 0.68 USD on 21.91 USDC, 0.16 USD on 21.57 USDC, 18.66 USD on 618.88 USDT, against about 0.04 USD gas per attempt. With a 40 s timer the bot aims only at what the fast takers leave; a late attempt is normally not sent at all (the simulation already reverts)."
executor: scratch/trial-fluid-arb/contracts/out/TrialFluidTake.sol/TrialFluidTake.json
executor_args: "{bot}"
executor_note: "constructor(address bot) only. take(Take) takes the vault, debt token, collateral token, native-collateral flag, WETH, the flash pool (WETH/debt), the sale pool (collateral/WETH, zero for ETH vaults), the debt amount and minProfit as call arguments; nothing is baked in. No principal: the debt token comes from an exact-output UniV3 swap whose WETH leg is paid inside the swap callback after the liquidation. The callback accepts only the pool set for that step (pool1, then pool2 during the collateral sale) and the peer is cleared at the end; the debt-token approval to the vault is the exact amount and reset to 0; swap direction is read from pool.token0(). Profit is unwrapped and sent to the bot wallet as native ETH; debt-token dust (1 unit in the proofs) goes to the wallet too. receive() for native collateral and the WETH unwrap. Owner-only sweep(token) for recovery."
fork_evidence: "scratch/trial-fluid-arb/proof.py (lease; per case reset arbitrum to the parent block of a mainnet take, deploy, fund, guards, success, repeat; release); result in scratch/trial-fluid-arb/proof-result.json and proof.out. Success WBTC/USDC (reset 524328069, fork block 524328074) 0x42cdd469a7e2e5a859cd29da06f2acda4f9c7d7b9f9de1eba6c8192340534093: 21.914706 USDC repaid, owner native +374465502179464 wei after gas (profit 379665722906518 wei, gas 506,934). Success ETH/USDC (reset 524326791) 0x22bad7266259244bcba6da33ac77ea208d05d9b18f381bcdf0751b0d0d0d72c1: owner +84190079287525 wei (profit 90629103997692, gas 411,899). Success WBTC/USDT (reset 524323016) 0x73bf762998e8de1de26935b86068354d6844a63b26fdcac1fbadecdf15b08ced: owner +10351689280088997 wei (profit 10360010539580614, gas 517,453). Executor left with 0 WETH / 0 debt token / 0 collateral / 0 native / 0 allowance in all three. Reverts: nothing to take (vault 0xbec491fe with FluidLiquidateResult(0,0)) 0x0e2f0fee31f83b557399cc3bdea8b791188dfd4704e1e5109050977893938acb (FluidVaultError(31029) 0x60121cca...7935, gas 288,406); the same take repeated after the success 0x759f5f66b61f530f074d9713f54cf4b079f7b1b302bb0e2e7f871f96b3ca9961 (same error); minProfit above the gain 0x2513202bbc94d5a2b15d545a19e3a9c5d6af4f242bc7759b04f731e49c7af934 (NoProfit 0xe39aafee, gas 558,502); non-owner 0xd3b6fea4a1977a9b7bbe133ef5073e352161d90434fa64c7e086b82e0721a4af (NotOwner 0x30cd7471). Paper override = eth_getCode of that deployment (executor-runtime.hex). scratch/trial-fluid-arb/selftest.py runs the bot's own read/attempt paper path on the fork at 524328069: opportunity + paper_sim success with the same 379665722906518 wei, gas limit 798,440 from eth_estimateGas; at the relay head all six vaults read (0,0) (selftest.out)."
awaited_events: "No event subscription: a 40 s timer. A take needs a price drop that pushes vault positions over the liquidation threshold, and a pool price that leaves a margin over the vault's oracle price. Last takes on these vaults: block 524,328,209 (2026-11-15); 429 in the last 7 days, all on the falling-price days 2026-11-11 to 11-15. At placement all six vaults report nothing to liquidate; the next takes need the next BTC / ETH / ARB drop."
good_signs: "logs/bot.jsonl: a scan heartbeat row every 10 min with eth_usd near the market price; scan rows with takeable debt on falling-price days, followed by opportunity + paper_sim success; live: send_result rows with result won."
bad_signs: "loop_error on every poll; read_budget rows (the 90,000 CU cap is reached); scan rows with takeable debt that always end in simulate_revert (route or oracle margin problem, or always late); live send_result lost with blocks_after_winner >= 1 on every send (the expected failure of a timer bot: close as blocked_infra); opportunity_skip estimate_gas_failed in live."
rpc_reads_per_min: "1.5: one Multicall eth_call every 40 s; about 4 more reads per opportunity"
alchemy_cu_per_day: "about 56,200 (0.030 USD): 2,160 polls x 26 CU; opportunities add about 100 CU each; hard cap 90,000 in code; no feed filter"
legal_note: "Fluid's liquidation penalty is a public payout to any caller of liquidate(); no mempool watching, the bot reads mined state on a timer; it bids a priority fee for a public reward."
expedite: false
