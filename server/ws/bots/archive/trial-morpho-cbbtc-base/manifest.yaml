id: trial-morpho-cbbtc-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: Morpho Blue cbBTC/USDC (market 0x9103c3b4...) liquidations on Base; wake on the BTC/USD aggregator's update events via the feed, liquidate with repaidShares and sell the seized cbBTC on the UniV3 0.05% pool inside Morpho's liquidate callback, one tx, USDC gain or revert."
copied_from: "takers of ledger morpho_blue.liquidate in this market, e.g. tx 0x7f3e5b9ba0... (caller 0xfd516d09..., block 57583736, repaid 27.86 USDC, two blocks after the oracle print in 57583734) and the small-ticket callers 0xc3cb8636..., 0x3185dba6..., 0x5ac9bc14... (lead 21 / attempts:1472)"
capital_usd: 18
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialMorphoTake.take reverts NoProfit() unless its USDC balance grows by minProfit (contracts/src/TrialMorphoTake.sol:79), so a lost attempt costs gas only. Gas cap per send in bot.py:57-61 and 282-291: GAS_LIMIT 450,000 x maxFeePerGas <= 0.5 gwei = 2.25e-4 ETH (0.41 USD at ETH 1,818; valued at a deliberately high 4,000 USD/ETH plus 0.02 USD L1 data fee it must stay < 1 USD or the bot does not send). The bot sends only when simulated gross > that gas cap and passes the cap as minProfit. Priority-fee bid: at most 25% of simulated gross (BID_SHARE, bot.py:61)."
expected_value: "trial, win rate to be measured live. 7 d competition in this market (attempts:1472, lead 170): 4,222 Liquidate events, 84 distinct takers; Atlas-routed bundles (0x9cbb82b9..., 0xd12810b1...) take the large positions in the oracle-update tx itself at about 15 gwei tips; small positions are taken by strangers at 0.02-3 gwei tips in the same block or up to 2 blocks later (57583736 case). The bot aims at that small-ticket remainder: gross = 4.38% of repaid minus 0.05% pool fee (fork: +1.2149 USDC on 27.86 repaid), one attempt about 300k gas = 0.003 USD at base fee."
executor: scratch/trial-morpho-cbbtc/contracts/out/TrialMorphoTake.sol/TrialMorphoTake.json
executor_args: "{bot}"
executor_note: "No principal and no flash loan are needed: Morpho hands over the seized collateral before its onMorphoLiquidate callback and pulls the repayment after it, so the repayment is the sale proceeds (the manifest-check warning about principal_usdc does not apply). constructor(address bot) only; market params, borrower, size, pool and minProfit are call arguments. Morpho Blue and USDC on Base are constants. onMorphoLiquidate accepts only Morpho while a take() is running; the swap callback accepts only the pool set for that swap; both peers are cleared; USDC approval to Morpho is the exact repaid amount and reset to 0. Profit is paid to the bot wallet as USDC. Owner-only sweep(token) for recovery."
fork_evidence: "scratch/trial-morpho-cbbtc/proof.py (lease, reset base 57583734, deploy, fund, 3 guards, success, release); result in scratch/trial-morpho-cbbtc/proof-result.json. Success 0x17ea0a046f2cad04f8837f881699441238eb811c640a14d10a5857999f1245fe (fork block 57583739, gas 296,704): owner USDC +1.214862, executor left with 0 USDC / 0 cbBTC / 0 allowances. Reverts: healthy borrower 0xc1d36c82a9e9c8f2b32ac036ff90cd07c996680f31942155edbd874fcdc06b3c ('position is healthy'), minProfit above gain 0xdaf784a3413a8935eea362267f4578e53bc7abac3788af4628b446a2b6d29b0f (NoProfit 0xe39aafee, gas 343,072), non-owner 0x11e7b12d9075e6879e9946e79eb0651cf2fbe9803a8cb2d1be35779a7aa56669 (NotOwner 0x30cd7471). Paper override = eth_getCode of that deployment (executor-runtime.hex); scratch/trial-morpho-cbbtc/selftest.py re-simulates the bot's own calldata at block 57583735 through the relay: gain 1.219249 USDC; scratch/trial-morpho-cbbtc/selftest2.py runs the bot's own scan/attempt paper path at that block: one opportunity row (gross 1.219249, gas cap 0.346) and paper_sim success."
awaited_events: "AnswerUpdated (0x0559884f...) and the Atlas-bundled update event (0x8d530b9d...) on the BTC/USD aggregator 0xe5ec87a39445b8d5b751b116802a53c5ae7e9df1 (about 290 AnswerUpdated/day, last at block 58374151, 2026-11-16 about 21:55Z); a liquidation needs a BTC drop that pushes a borrower over lltv 0.86. At placement the nearest borrower is at debt/maxBorrow 0.950, so the next one needs about a 5% drop from 65,290 USD; last batches 2026-11-14 (blocks 57582234, 57583734) and single takes to 2026-11-16 (58292957)."
good_signs: "logs/bot.jsonl: scan rows every oracle update with top_ratio moving with BTC; opportunity + paper_sim success rows when top_ratio crosses 1; live: send_result rows with result won."
bad_signs: "scan_error or loop_error on every cycle; simulate_revert 'position is healthy' on every candidate with ratio > 1.001 (ratio formula drift); live send_result lost with blocks_after_winner >= 1 on every send (always late); read_budget rows."
rpc_reads_per_min: "about 1: two Multicall eth_calls per oracle update or per 300 s when quiet, 175 calls per full scan (every 6 h, or after a 1% oracle move, at most every 30 min)"
alchemy_cu_per_day: "about 60,000-77,000 (0.03-0.04 USD): relay 40-57k (near checks about 400 x 52 = 21k, full scans 4-8 x 175 x 26 = 18-36k) + feed about 20k; relay reads hard-capped at 80,000 in code"
legal_note: "Morpho Blue's liquidation incentive is a public payout to any caller of liquidate(); no mempool watching, the bot reacts to mined oracle-update logs only; it bids a priority fee for a public reward."
expedite: false
