id: lusd-redemption-ethereum
author: earner/qwen3.8-flash-next
chains:
- ethereum
strategy: Redeem Liquity v1 LUSD against ETH collateral when the Uniswap V3 WETH/USDT pool price exceeds the Liquity PriceFeed oracle by the measured breakeven premium, funded by a Morpho USDT flash loan in the same transaction
copied_from: winner tx 0x59e91ae68f87fc21905e4645ff916aab0c37d07d324d97f595cee99d31f5473e (block 26300833) and its executor 0xf00003bf2dcfeb166e3dee7d0e0fff197cdfcabd (ledger source liquity_v1.redemption actors 0x7a995eddc938b62e3ee719c7b890ca0f75176040, 0x9a25d7cb68c7aa6b21cf87ff725272b5f695fc51)
capital_usd: 100
principal_usdc: 0
allowed_contracts: []
max_loss_per_tx_usd: 50
max_loss_guarantee: 'LusdRedeem.onMorphoFlashLoan converts the swap profit USDT to native ETH (reverse UniV3 leg), withdraws the WETH and pays the owner only when the after-gas balance delta exceeds minProfit (20 USDT, the guard proven to succeed at the 3,000-LUSD farm size; a 50 USDT guard reverts at that size), so the call reverts unless the redemption ends in native profit at the bot wallet; the worst case is the signed gas: gasLimit 1,300,000 x maxFeePerGas cap 20 gwei = 0.026 ETH, ~49.4 USD at a 1,900 USD/ETH signing-time price; bot.js refuses a send once 0.026 x oracle > 50 USD (review 0c72857e: the old 28 USD note assumed $1,100/ETH) (bots/paper/lusd-redemption-ethereum/contracts LusdRedeem.sol, guard in onMorphoFlashLoan ''below minProfit'' require)'
expected_value: 'Measured farm-size EV over the trailing 30 days 2026-10-19..11-14 (README windows table, proof12/proof13 on the fork): 11 Redemption events (0.37/day); the counted class is the 3 late-Oct29 captures (windows 564/1932/1968 s >= R=252 s) and all three parents REVERT at the bot''s fixed 3,000 LUSD size with ''TroveManager: Unable to redeem any amount'' (premium 1.26-1.46, fee-burned state after the morning''s 2.04M LUSD redemptions; txs 0xcd7c2f2e..., 0xd717d701..., 0xd1556070...); the 2 ledger captures sit below the 1.0814 breakeven premium (1.0035, 1.0052 at their parents, revert ''below minProfit'', txs 0x5b98e467..., 0x3dea2f23...). The 2026-10-19 captures 26227311/26227312 close the table (proof14/proof15): premium 1.0114/1.0117 at the parents, never above 1.012 over the 1,280 blocks before each capture - never in the farm route''s window - and both parents REVERT ''below minProfit'' (txs 0xd6f834ba..., 0xfb27dac0...), farm net 0. Measured positive farm nets in the counted class: 0 -> measured EV 0 USD/day vs 0.19 USD/day read cost; the complete 11-capture table leaves no unmeasured row (review 0c72857e item 2 closed). The route pays at premiums around 1.1165: +84.9 USDT gross pre-gas at 3,000 LUSD (success tx 0xe9881aba..., parent 26300832), +24.9 USDT net after the 0.026 ETH signing cap; gas measured 1.07M gasUsed, the signer worst case 1,300,000 x 20 gwei = 0.026 ETH valued at the signing-time price (bot.js refuses to send above 50 USD).'
executor: scratch/lusd-exec/contracts/out/LusdRedeem.sol/LusdRedeem.json
executor_note: owner = msg.sender (the gate's deployment key), no constructor arguments. redeem(lusdAmount,flashAmount,firstHint,upperHint,lowerHint,partialHintNICR,maxIterations,maxFeePercentage,sqrtPriceLimitX96,minProfitReq) is owner-only; the Morpho callback reads the stashed redemption parameters, buys LUSD (USDT -> Curve 3-pool add_liquidity -> cStable pool exchange), TroveManager.redeemCollateral, deposits the redeemed ETH to WETH, sells it on Uniswap V3 WETH/USDT, repays the Morpho flash loan (Morpho pulls with transferFrom), swaps the profit USDT back to WETH on the reverse UniV3 leg (MAX_SQRT_RATIO-1 price limit; the pool pulls the USDT itself via transferFrom - the callback only pays WETH), withdraws WETH to ETH and pays the owner wallet in native. receive() accepts the ActivePool ETH transfer.
fork_evidence: 'script scratch/lusd-exec/proof12.py (outputs proof12_out.json + proof12*_run.log; shared ethereum fork, lease per run, one script: reset+deploy+seed+farm-size runs at the parent of every counted capture + premium probes; resume-safe) and scratch/lusd-exec/proof13.py (proof13_bisect.json: per-parent revert reasons via eth_call). Guard revert with unchanged principal: tx 0x32ff02314d74d2221ac1697f55e9e3ac2d725b10dda34fe4be05e9b4035dcdcc at reset 26300832, status 0, owner+payee ETH delta = the 0.001107 ETH gas only, owner USDT 1.0 -> 1.0. Farm-size success at the bot''s 20 USDT guard: tx 0xe9881aba5ab91c0fd7b881f7a664a4840e87d62bc11fbe46921988c9c0469aec at reset 26300832, status 1, gasUsed 1,068,410, bot-wallet ETH delta +0.031186 after fork gas = +82.49 USDT at the proof-block pool price 2,557.59 USD/ETH (+24.9 after the 0.026 ETH signing cap); profit exits as native (owner USDT unchanged 1.0 -> 1.0). Counted-capture parents 26300875/26300989/26300992: farm-size REVERT ''TroveManager: Unable to redeem any amount'' (txs 0xcd7c2f2e..., 0xd717d701..., 0xd1556070...); ledger-capture parents 26383263/26410254: REVERT ''below minProfit'' (txs 0x5b98e467..., 0x3dea2f23...). Oct19 capture parents 26227310/26227311 (script scratch/lusd-exec/proof14.py, outputs proof14_out.json + proof14_run.log; premium probes k = 1..1280, revert reasons via eth_call in scratch/lusd-exec/proof15_bisect.py -> proof15_bisect.json): farm-size REVERT ''below minProfit'' (txs 0xd6f834ba0a9896a460d8748bf4809b3b0f41b71337112e4e3f382b59d571dc65, 0xfb27dac04a91a23d947bf4ab9edbf44338e87fac2775c8dbfeb74e97f9c1c2ae). The 327,764-LUSD winner-size run stays in proof10_out.json.'
awaited_events: 'Liquity v1 Redemption(TroveManager 0xA39739EF8b0DcdA07d7e29faAbCf4bb2, ledger source liquity_v1.redemption): last events block 26410255 (293,894 LUSD, 2026-11-13, premium 1.0052 - below the bot''s breakeven) and 26383264 (48 LUSD, 2026-11-08); a redemption raises the base rate so the premium window (pool/oracle >= 1.0814) opens after some redemptions and decays over days; cadence measured 11 events in 30 days, windows open days apart; the fork shows the high-premium post-burn states the farm-size route cannot redeem in'
good_signs: 'logs/events.jsonl: idle lines every 4 min with premium < 1.0814, opportunity lines with the recomputed getRedemptionHints triplet (firstHint/partialHintNICR/upper+lower bracket) when the window is open, paper_send_sim with expected_gross_usdt above the signing-time gas cap 0.026 ETH x oracle price (~49 USD at 1,900; test.js checks the branch calculation) and expected_net_usdt >= 25 with the 20 USDT minProfit guard note; no cycle_error lines'
bad_signs: no idle lines for hours (poll dead), opportunity with firstHint 0x000..0 (hint oracle read failed), paper_send_sim without ever an idle->opportunity transition, live_guard_revert 'below minProfit' on every try (premium model stale), live receipts status 0
rpc_reads_per_min: 1
alchemy_cu_per_day: 360000
legal_note: 'public permissionless redemption: anyone may redeemCollateral; no allowlist, no private order flow, no sandwiching (the bot waits minutes for a minutes-wide window)'
