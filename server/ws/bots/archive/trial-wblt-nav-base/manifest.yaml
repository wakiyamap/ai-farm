id: trial-wblt-nav-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: BMX wBLT (wrapped staked BLT, the liquidity token of BMX's GMX-style vault on Base) round trips between its public mint / redeem at the vault price and the BNKR / wBLT Uniswap v4 hook pool. When the pool price leaves the vault price, flash-borrow USDC from Morpho, go USDC -> WETH -> BNKR -> wBLT, wBLT.withdraw, unstakeAndRedeemGlp to USDC (or the reverse through mintAndStakeGlp and wBLT.deposit), keep the USDC difference"
copied_from: "operator A (payout 0xc0ffeefeed8b9d271445cf5d1d24d74d2ca4235e, rotating 0xc0ffee... sender keys; executors 0x162e2b4806e4f6d648f85b0314cbc3d045f3af82 and 0xbfc4e8700d4095e364da35605aeb97c047f95f02 and 0x3c47df9272abe80e61e03e531671d2f89a7101db redeem, 0x84296b84e5aed2449b1af84391ea75a9223206fe mint): redeem take tx 0xda5e6715ded333e14f6cfc2d9f0665034b92ee1af66b3844a4224047dacda178 (block 59994578: Morpho flash 30.17 USDC -> WETH -> BNKR -> 71.66 wBLT, redeemed for 30.374 USDC, 0.000123 ETH paid out); mint take tx 0x13d958ca88a4369ef7171eaa829a1eb02cfd1d29a4e280e149649d367fcb528d (block 60389128: 41.83 USDC -> 103.7 wBLT -> BNKR -> WETH, 0.000187 ETH paid out). Operator B: EOA 0xf62b10b2 through 0x071a60da92b399660f4961cd76b57b91043064e5 (5 takes in 7 days). Same route; the farm executor calls the RewardRouter and the wBLT vault directly where the incumbents go through a helper 0x35e37d0b that wraps the same two public calls."
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "Gas only. NavVaultArb.run reverts NoProfit unless its USDC balance grew by at least minProfit (and Morpho's own repayment pull fails first when the round trip lost), and the bot sets minProfit = the send's gas cap in USDC at a 2,500 USD/ETH reference (bot.py check(): cap = gas_limit * max_fee + L1_FEE_ALLOW_WEI, cap_usdc passed as min_profit to run_calldata), so an included send either pays more than its own gas cap or reverts and costs gas. A send happens only when the quoted gross > 1.3 x that cap (SEND_MULT). Caps in bot.py: MAX_FEE_CAP_WEI 0.11 gwei, GAS_LIMIT_MAX 3,200,000, so at most 0.000352 ETH + L1 fee = 0.88 USD a send at the 2,500 USD reference (0.60 USD at 1,710), and MAX_TX_USD 0.95. Typical attempt: 2.0-2.2M gas at 0.006-0.02 gwei = 0.02-0.08 USD including the L1 data fee. Priority fee bid: at most 1/10 of the quoted gross, never above 0.08 gwei (TIP_SHARE_DEN, TIP_MAX_WEI). No principal: Morpho flash loan. quote() always reverts and moves nothing."
expected_value: "Trial: measures the win rate by sending. Competition in 7 days, blocks 57,889,534-60,913,534 (scratch/r8b26/takes.py -> takes.json, every wBLT mint and burn): 40 atomic takes; operator A 23 (16 redeem, 7 mint), always about 30 USDC a take, 0.00384 ETH = 6.6 USD paid out in 7 days (0.0001-0.0012 ETH a take), gas price 0.006-0.12 gwei, tx index 2-240; operator B 5 takes; the rest users through aggregators. Takes come in runs and a gap can stand for minutes (two takes 281 s apart at blocks 59,994,578 and 59,995,983). The bot looks every 30 s and sizes the take itself (10-90 USDC); it aims at the part of a gap the fixed 30 USDC takes leave and at gaps that outlast its look: about 0.1-0.5 USD a day at this pace. On the fork at the parents of the two incumbent takes above the bot's own sizing paid 0.191 USDC (redeem, 30 USDC) and 0.333 USDC (mint, 45 USDC)."
executor: scratch/trial-wblt-nav-base/contracts/out/NavVaultArb.sol/NavVaultArb.json
executor_args: "{bot}"
executor_note: "NavVaultArb(address bot), Solidity 0.8.24 via_ir, 6,839 runtime bytes, deploy 1,533,196 gas on the fork (limit 3,000,000). run(P) is owner-only; P is one static struct: morpho, pool manager, reward router, liquidity manager (approval target on a mint), staked liquidity token, wrapper vault, base token (USDC), mid token (BNKR), V3-style pool A (base / x), V3-style pool B (x / mid, or zero), the v4 pool's fee, tick spacing and hook, direction, amount, minProfit. It flash-borrows the base token from Morpho; inside the callback, redeem direction: exact-input swaps through pool A and pool B, one v4 unlock with one exact-input swap mid -> wrapped, wrapped.withdraw of everything held, router.unstakeAndRedeemGlp of the staked balance to the base token; mint direction: approve the manager for exactly the loan, mintAndStakeGlp, approval back to 0, approve the wrapper for exactly the staked balance, deposit, approval back to 0, v4 swap wrapped -> mid, pool B, pool A. Then approve Morpho for the loan, and after the loan: approval to 0, NoProfit unless the base balance grew by minProfit, all base token to the owner, any wrapped or mid dust to the owner. quote(P) runs the same round trip and ALWAYS reverts with Quote(gain): it is the bot's screen through Multicall3, callable by anyone, and can change no state. Nothing is stored or baked in, no setup tx; the three callbacks (onMorphoFlashLoan, unlockCallback, uniswapV3SwapCallback) answer only the counterparty set for the running step and cleared after it. Constructor arg = the bot wallet only."
fork_evidence: "scratch/trial-wblt-nav-base/proof.py (one lease, two resets, about 90 s; result proof-result.json; hashes repeat on a re-run). REDEEM: Base fork reset to 59994577 = parent of operator A's take 0xda5e6715... (block 59994578); no fixture. Controls: router.glpManager() and wBLT.token() name the addresses, cooldownDuration() = 0. Deploy 0xd4e499f7... (1,533,196 gas, fork block 59994578); the bot's own screen (quotes through Multicall3) shows redeem 20 USDC +169197, 50 USDC +106841, mint 0; sizing picks 30 USDC, quote 190299. Non-owner 0x67e42064... reverts NotOwner; quote() sent as a transaction 0x039adb2b... reverts Quote(191020); guard 0x07345e0c... (minProfit 380598 = twice the quote) reverts NoProfit(191020, 380598), owner USDC delta 0; success 0x188c9d5c... fork block 59994582 (the state is block 59994577 plus the proof's own txs), 2,225,445 gas: owner USDC +0.191020 (the quote was 0.190299: the gain drifts by a fraction of a percent with block time, which is why the guard and the success use 2 x and 0.9 x the quote); nothing to take: the mint direction at the same state 0x9a3c8b98... reverts, owner delta 0; executor and owner leftovers 0 wBLT, 0 staked BLT, 0 BNKR, 0 WETH. MINT: reset to 60389127 = parent of operator A's take 0x13d958ca... (block 60389128): screen mint 20 USDC +253116, 50 USDC +310692, redeem 0; sizing picks 45 USDC, quote 327681; non-owner 0xb7277bf9... NotOwner; guard 0x38db09d5... NoProfit(332582, 655362); success 0xca2fc3e7... fork block 60389132, 2,032,232 gas: owner USDC +0.332945; the redeem direction 0xdbd65e67... reverts; leftovers 0. selftest.py: the bot's paper path (code override = eth_getCode of this deployment) through the relay returns redeem 30 USDC +190089 at block 59994577 and mint 45 USDC +327681 at block 60389127, and three looks at head cost 1 eth_call each (78 CU)."
awaited_events: "A move of BNKR (pool 0xaec085e5), of the BNKR / wBLT hook pool or of the vault price that leaves a round trip above the fees (0.8 pct hook pool + 1 pct BNKR pool + the vault's mint or redeem fee). Last incumbent takes (block timestamps): block 60805794 = 2026-11-22 12:45:34Z (operator B, mint), 60389128 = 2026-11-21 13:36:41Z (operator A, mint), 59995983 = 2026-11-20 15:46:12Z (operator A, redeem); 40 atomic takes in the 7 days 2026-11-15 18:44:42Z to 2026-11-22 18:44:42Z, in runs. Next: unknown, expected several a week."
good_signs: "paper_sim success lines; live send_result won with gross_usdc well above cap_usdc; opportunity lines with a best size above 30 USDC (more than the incumbents' fixed size)"
bad_signs: "send_result lost several times in a row (an incumbent takes within one look: the 30 s timer is too slow); loop_error on every look (the hook, the router or the wrapper changed, or Multicall3 override refused); opportunity_skip fee_gas_or_usd_cap (gas estimate above 3.2M: the vault's token list grew); cooldownDuration set above 0 (the round trip no longer fits one transaction: every quote 0)"
rpc_reads_per_min: 2.1
alchemy_cu_per_day: 76000
legal_note: "Public mint and redeem of the protocol's own liquidity token at the vault's price with the vault's mint / redeem fees paid in full, the wrapper vault's public deposit / withdraw, public pools and a public flash loan. No mempool watching, no reaction to pending transactions: confirmed state on a timer. No holding: every token is back in USDC inside the transaction. The v4 hook's source could not be read (explorer down on 2026-11-22); the bot only swaps through it as the incumbents and ordinary users do."
expedite: false
