id: trial-tel-migrate-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: buy old TEL in its Uniswap v4 ETH pool, migrate it 1 to 1 into new TEL (TelcoinV3) through Telcoin's public TokenMigration, sell new TEL in its v4 ETH pool, all inside one PoolManager unlock (no principal)"
copied_from: "Executor 0x041b537387b319093b180a1c74239c9b8892ccdd of the operator that pays out to 0xc0ffeefeed8b9d271445cf5d1d24d74d2ca4235e (rotating 0xc0ffee... sender EOAs): take 0x72df13d1a0676ad22f5284d3031798e0dea8fb2c5f175d21196050dfedc4f983 (block 58734314, 0.0884 ETH in, kept 0.002431 ETH) and its last take 0xb52e50ead326ba4a3db917e4b68a276f21b9e66ebd8af4d088b7f3740fc5bd81 (block 60062099); 36 takes in 7 days"
capital_usd: 0.75
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Base charges the L1 data fee and the operator fee at inclusion and no signed field bounds them, so the worst case of one send is the bot wallet's native balance, kept under 1 USD: capital_usd 0.75, all native, no top-up, and the live branch of check() refuses to send while balance x Chainlink ETH/USD is 0.95 USD or more (bot.py:271, wallet_usd() bot.py:159, WALLET_MAX_USD bot.py:74). Inside that bound a lost attempt costs gas only: V4MigrateArb.sol take() is owner-only (line 72) and _take() reverts NoProfit unless the executor ends the PoolManager unlock holding at least minProfit of native ETH (V4MigrateArb.sol:105; minProfit 0 refused, line 99; nativeOut <= nativeIn reverts inside the callback, line 147), then pays the whole amount to the bot wallet. The bot sets minProfit = this send's cost cap (bot.py:251 cap = gasLimit x maxFeePerGas + L1 allowance; bot.py:261 the exact call is simulated with minProfit = cap) and sends only when gross is above 1.3 x that cap (bot.py:258); it refuses when maxFeePerGas is above 0.2 gwei, the gas limit above 2.5m or the cap 0.95 USD or more at a 4,000 USD/ETH reference (bot.py:255). Priority fee bid: at most 1/10 of the simulated gross, between 0.001 and 0.1 gwei (TIP_SHARE_DEN bot.py:67, TIP_MAX_WEI bot.py:68)."
expected_value: "Trial: send-measured win rate, no counted EV. Competition, 7 days to 2026-11-22T11:46Z (Base blocks 57,762,844-60,786,844; README table; scratch/trial-tel-migrate-base/windows.json): 38 arbitrage takes by 3 operators (0x041b5373 36, 0x63d62548 1, 0xfdc4464f 1), gross at the parent block 0.012938 ETH (22.1 USD), median 0.000035 ETH, of which 0.0088 ETH in three takes that paid 0.13-0.61 gwei priority fee and were taken within 1 s. A gain of 0.00001 ETH or more was still there 3 s before the take for 20 of 38 (0.000922 ETH in total, 1.57 USD in 7 days) and 10 s before for 9 (0.000160 ETH); incumbent priority fee median 0.0044 gwei, tx index median 12. Aim: the roughly half of the takes that stand 3 s or longer, about 3 a day at 0.00001-0.00015 ETH against a cost of about 0.000003 ETH: about 0.2 USD a day gross if all won. The result that matters is the win rate at a feed-triggered 3 s reaction."
executor: scratch/trial-tel-migrate-base/contracts/out/V4MigrateArb.sol/V4MigrateArb.json
executor_args: "{bot}"
executor_note: "V4MigrateArb.sol, constructor (owner) only. take((manager, migrator, oldKey, newKey, amountIn, minProfit)): the PoolManager, the migrator, both v4 pool keys (so both tokens and the hook) and the size are call arguments; both keys must have native ETH as currency0. Inside one unlock: swap ETH -> old token (exact input), take the old token, approve the migrator for exactly that balance, migrate(), approval reset to 0, swap the whole minted balance -> ETH, sync / transfer / settle the new token, take the net ETH. unlockCallback checks msg.sender against the manager set for this call and cleared after it. Reverts Leftover when any old or new token stays in the executor, NoProfit when the ETH received is under minProfit; everything is paid to the bot wallet as native ETH (receive() present). probe() is for eth_call only (owner-only, every trial reverts). No setup tx, no baked address. Runtime 5,042 bytes. Live code reads EXECUTOR_ADDR_BASE or EXECUTOR_ADDR only; paper mode uses a code override taken with eth_getCode from the Base fork deployment (executor-runtime.hex)."
fork_evidence: "scratch/trial-tel-migrate-base/proof.py [parent] [result file] (one Base fork lease: reset, deploy the artifact with --args, fund, probe with the bot's own calldata, non-owner, guard, success, repeat, leftovers, allowances, runtime code, release; it also checks every selector and topic against cast and the bot's hand ABI encoding of take() and probe() against cast calldata). Run at reset 58,734,313 = parent of the incumbent take 0x72df13d1 (block 58,734,314, kept 0.002431 ETH), result proof-result-58734313.json, fork deployment 0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352: non-owner revert NotOwner 0xa45d26e6e05d392a69c3971a2eaacdcc679ab8cc7033baa05437e44be6039fbd; guard revert NoProfit (minProfit 1e24) 0xba0291f4380020e5d7d2b606cf10c44815c647a71c7c1d96a68bd375596cd5fa, 278,054 gas, owner -5,563,777,653,099 wei (gas only, at the fork's 0.02 gwei); success at 0.0859 ETH 0xe391369307978b4355667d8389de80eacf3ffd0504ebdc740be5fee6bd5a18cc, fork block 58,734,317, 227,972 gas, paid 0.002434659 ETH, owner native +2,430,099,491,392,278 wei net of gas (probe said 0.002434662); the same take repeated 0x174c261a566c504af9b33c40c1303f975200586addd4e29952d914046f6239df reverts NoProfit and probe() after it is 0 at all 13 sizes; executor balances (native, old TEL, new TEL) and allowances (old TEL to the migrator, new TEL to the PoolManager) all 0. selftest.py 58734313 60062098 60788846: the bot's own check() in paper mode logs opportunity + paper_sim success at the first two (gross 0.002435 and 0.000149 ETH, caps 0.000038 and 0.000018 ETH) and nothing at the quiet third (selftest-58734313.jsonl, selftest-60062098.jsonl)."
awaited_events: "Feed /logs/base: Transfer(address,address,uint256) (topic0 0xddf252ad...) on old TEL 0x09be1692ca16e06f536f0038ff11d1da8524adb1 and new TEL 0x7e13b43065380acdec1c2d138c579cbbbafa0731 (18 + 557 logs in the 24 h to 2026-11-22T11:49Z), plus a 300 s safety poll. A gap opens when someone sells old TEL or buys new TEL on Base; 38 takes in 7 days (5 to 6 a day, in clusters), the last on 2026-11-20T19:26:35Z (block 60,062,099); none since, and no gap at 2026-11-22T11:49:04Z. Next: with the next larger TEL trade on Base, expected within one to three days; the migration stays open until 2027-09-24."
good_signs: "opportunity and paper_sim rows with gross_wei above cap_wei; live send_result won with positive net_wei."
bad_signs: "No opportunity row in four days (the old-TEL pool drained as holders migrate, or the incumbent leaves nothing for 3 s); every send lost with the winner 10 or more blocks earlier; opportunity_skip wallet_at_or_above_usd_bound (a win lifted the wallet over the 0.95 USD send bound: sweep needed, report it); repeated simulate_revert, fee_gas_or_usd_cap, feed_error, read_budget or loop_error rows; migrator paused (probe 0 while the pools show a gap)."
rpc_reads_per_min: "About 0.45: one probe() eth_call per look; looks = feed events (at most one per 3 s, about 300 a day) + a 300 s safety poll (288 a day) + up to 3 follow-ups after a gain. An open gap adds 1 eth_getBlockByNumber, 1 eth_estimateGas, 1 guarded eth_call and (live) 1 eth_getBalance, 1 price eth_call, receipt polls."
alchemy_cu_per_day: "About 20,000 relay CU (650 looks x 26 CU + gaps), 0.011 USD at 0.53 USD per million CU; code cap 95,000. Feed CU for about 575 logs a day is metered by the feed."
legal_note: "migrate() is the public entry Telcoin gives every old-TEL holder, at the project's fixed 1:1 rate; the two swaps are ordinary Uniswap v4 trades that pay the pool fee. The same transaction three unrelated operators send. The bot reads confirmed state only, watches no pending transactions, reacts to no one's unconfirmed order, and bids a priority fee only for its own public arbitrage. Not a liquidation."
expedite: false
