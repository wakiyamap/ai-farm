id: trial-nerite-redeem-arbitrum
author: builder/claude-mythos-5-2
chains: [arbitrum]
strategy: "trial: flash-swap USND out of its Uniswap V3 pool, redeem it on Nerite (Liquity V2 fork) for WETH and LSTs at the protocol price, sell them for USDC, pay the pool, keep the USDC difference, all in one executor call"
copied_from: "Arbitrum EOA 0x855fb44db86bb50ee8180496a080b45dbb9ba2c7 through executor 0x22ee214ba643c637401f62af49583eb2283040c7 (6 takes in 7 days, the only redeemer); takes 0x0b1ac32bde6d8f24e1d9563fb5fee1fe2875c485f64ce8d7d44f2ab8fdfef345 (block 525,353,396, +0.142068 USDC) and 0x833ee249db63b186f8f5b28397a2b7dba0fa3473d1b19c121bdfc0cd637a1501 (block 524,416,251, +0.158304 USDC)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "NeriteRedeemTake.sol take() (lines 56-70) is owner-only and reverts NoProfit unless the executor's USDC balance grew by minProfit inside the same transaction (the USND is flash-swapped and paid for in it); the gain is transferred to the bot wallet as USDC. bot.py check(): gas limit = eth_estimateGas x 1.10 (refused above 4,500,000), maxFeePerGas = latest base fee x 1.05 + 1 wei (refused above 0.1 gwei), signed cap = gasLimit x maxFee in USD at the WETH/USDC pool price, refused at 0.90 USD or more; it sends only when the simulated gross exceeds that cap, with minProfit = cap + 1 micro-USDC, after simulating the exact guarded call at the signed gas limit. Typical cap 0.12 USD (3.15m gas x 0.021 gwei at ETH 1775). Priority fee: 1 wei per gas, 0% of gross (Arbitrum orders first come first served; the incumbent pays none). No principal: the bot wallet holds native gas only."
expected_value: "Trial: send-measured win rate, no counted EV. Competition, 7 days (blocks 523,077,310-525,496,510; scratch/nerite/scan.py -> red-logs.json, txs.py): 6 redemption transactions = 0.86 per day, all by one EOA with 40 or 56 USND, gross 0.142-0.224 USDC, gas 2.79m-2.90m at 0.020-0.022 gwei = 0.10-0.11 USD, no priority fee, tx index 2-61. Whole pot about 0.14 USD/day gross. The gain opens when ETH on the DEXes runs ahead of Nerite's redemption price and the incumbent takes it 5-15 s later at about 0.14 USDC (windows.py -> windows.json: no gain 60 s before 5 of 6 takes, 0.039-0.138 USDC 10 s before, 0.140-0.161 1 s before). This bot's threshold is its signed cap (0.118-0.121 USDC at those blocks), so it aims to send a few seconds before the incumbent when its 2 s fast timer is running (with a 30 s base timer that is about half of the openings); expected net per win 0.02-0.05 USD, a lost send costs about 0.10 USD."
executor: scratch/trial-nerite-redeem-arbitrum/contracts/out/NeriteRedeemTake.sol/NeriteRedeemTake.json
executor_args: "{bot}"
executor_note: "Constructor takes the bot owner only. take(Route,minProfit): every target (flash pool, USND, USDC, amount, CollateralRegistry, iterations, max fee, WETH, WETH/USDC pool, and the list of collateral / V3 pool legs) is a call argument. The V3 swap callbacks (uniswapV3SwapCallback, plus the Algebra and Pancake V3 names for the same shape) accept only the one pool set for the swap in progress; the slot is cleared at the end of take(). No approvals at all: the registry burns USND from the caller and the pools are paid by transfer inside their callbacks. A collateral with a zero balance is skipped. Live code reads EXECUTOR_ADDR_ARBITRUM or EXECUTOR_ADDR only; paper mode uses an eth_call / eth_estimateGas code override taken from the fork deployment (executor-runtime.hex)."
fork_evidence: "scratch/trial-nerite-redeem-arbitrum/proof.py (one arbitrum fork lease: reset to 525,353,395, the parent of the incumbent's take 0x0b1ac32b...; deploy the artifact with --args; fund; result proof-result.json). Size sweep by eth_call: 20 / 40 / 60 / 80 USND -> 102,875 / 139,799 / 110,674 / 15,408 micro-USDC. Success 0x16e7f58c231135ef352e66a023393bc5216c3aac5536348d488775ec87e7b741 block 525,353,399: 40 USND, owner +139,911 micro-USDC (the incumbent got +142,068 in block 525,353,396), 2,641,685 gas, executor left with 0 native / USDC / USND / WETH / wstETH / rsETH / weETH / tBTC. Guard revert NoProfit(139911, 1e12) 0x4211738ed2156bf611b4aeb3cc4412c329c19debf6e287233aba99030346e322, owner USDC delta 0, 2,776,020 gas (the cost of a lost attempt). Non-owner revert NotOwner 0x699552121d0bf3539c399d4a4685a83b0ee192037d7a80c000844090df4e9f05. Nothing left to take: the same call repeated right after the success reverts (the USDC from the sales no longer covers the pool payment), 0x6fffdf114574bee9b18f1d32a869d0e660c334844fabe256c8a52cdb772917f4, owner USDC delta 0. The bot's own check() replayed through the relay (selftest.py, which first checks the bot's calldata against cast calldata): paper_sim success at 525,353,395 (40 USND, gross 139,799, cap 0.1177 USD, guarded call at gas limit 3,153,405) and at 525,350,041; nothing_to_take at 525,353,400; gain_below_gas at 524,218,639 (gain 85,626, 4 s before a take)."
awaited_events: "A 30 s timer (one executor simulation), a 2 s timer for up to 40 s after any simulated gain of 0.01 USDC or more, and Swap(address,address,int256,int256,uint160,uint128,int24) on the USND/USDC pool 0x319b7186c838509ebf41f44ea348b2b5345254c2 through the feed (15 in the last 18 h). The opening itself has no event: it is a fast ETH move on the DEXes before Nerite's redemption price follows (the WETH branch reads push feed 0x4df393fa84e4a0cfdf14ce52f2a4e0c3d1ab0668, 1,076 s old and 0.88% below WETH/USDC at the last take; oracle.py). Last incumbent takes 2026-11-18 block 525,350,042 and 525,353,396 (15 minutes apart); 6 in 7 days, so the next is expected within 1-2 days, sooner when ETH moves more than about 0.7% in a minute."
good_signs: "check rows with a probe_gain, fast_mode on, opportunity rows with gross_usdc above min_profit_usdc, paper_sim success; live send_result won with a positive USDC delta."
bad_signs: "Only nothing_to_take checks for a week (USND at par or the redemption fee above the gap), every send lost to the incumbent (blocks_after_winner small and positive), simulate_revert rows, or read_budget rows."
rpc_reads_per_min: "2 in base mode (one eth_call every 30 s); 30 per minute while fast mode is on (bounded to 15,000 CU per day); an opportunity adds 2 eth_call sizes, one slot0 eth_call, one eth_getBlockByNumber, one eth_estimateGas and one final eth_call."
alchemy_cu_per_day: "Base 2,880 probes x 26 CU = 75k; fast mode at most 15k; opportunities about 250 CU each. Code cap 93,000 relay CU/day (0.05 USD/day at 0.53 USD per million CU). Feed: one /logs filter (USND/USDC pool Swap), about 20 events a day."
legal_note: "redeemCollateral is the protocol's public redemption, open to any USND holder at the protocol's own price with its redemption fee; the flash swap and the collateral sales are ordinary swaps. The gain comes from the redemption price trailing the DEX price, the case the redemption fee exists for; the bot moves no price beyond its own 30-50 USND trade, reads confirmed state only and watches no pending transactions."
expedite: false
