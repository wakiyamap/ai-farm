id: trial-peapods-arb-arbitrum
author: builder/claude-mythos-5-2
chains: [arbitrum]
strategy: "trial: Peapods pod bond/debond round trips on Arbitrum (flash WETH, trade into a pod's underlying, bond or debond, cross the pod's pair, unwind to WETH) over eight routes copied from three incumbent executors"
copied_from: "Three executors on Arbitrum, each a Balancer flash recipient: 0x9934b3b1f35b6e18fcdb8b2ba2295a0a972d3317 (EOA 0xe6ec466b, e.g. tx 0x0aae3583e699fb2c6ca555c4c3f8285eb23db1939467d550b738f8a8ccb47193), 0xda77151be590d790533a3b6b63a0f10278a325e8 (EOA 0xaba3b0cf, tx 0x50e15fbe507e47c945b69af1803b7683cf6eedc9fdce133dc3a8e8d96de90c82), 0x429e114b9aa92c975bf74de0b68663239bb43235 (EOA 0x57ba1e40, tx 0x25390d745835b9ac6bd19d69cbf3970155d44544dc6ea141f9144096471b9f80, +0.0374 WETH)"
capital_usd: 15
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "PodArbTake.sol:71-79 run() is owner-only and reverts NoProfit unless the executor's WETH balance grew by minProfit after the Balancer flash loan was repaid (line 74; minProfit 0 is refused), then unwraps the gain and pays the bot wallet native ETH; no principal leaves the bot wallet, so a lost attempt costs gas only. bot.py:282-326 take(): gas limit = eth_estimateGas x 1.20 + 600,000 (line 300, refused above 3.2m), maxFeePerGas = latest base fee x 1.05 + 1 wei (refused above 0.1 gwei), cap = gasLimit x maxFeePerGas, sent only if the simulated gain is above the cap (line 311) with minProfit = cap + 1 (line 303) and the exact guarded call simulated at the signed gas limit (line 318). The cap in USD is taken at a 4,000 USD/ETH reference (ETH is about 1,800) and refused at 0.90 USD (line 307); typical cap 3e13-5e13 wei = 0.05-0.10 USD. Priority fee bid: 1 wei per gas (Arbitrum orders first come first served), 0 pct of gross."
expected_value: "Trial: send-measured win rate. Competition, 7 days to block 525,545,222 (scratch/trial-peapods-arb-arbitrum/census7d.json): 418 takes by three executors (0x9934b3b1 196, 0xda77151b 203, 0x429e114b 19), bursty: 304 in the last 24 h, 9-47 per day before. Sampled takes replayed at earlier blocks (scratch/flashcensus/windows-arbitrum-*.json): 0x9934b3b1 and 0xda77151b, 40 takes: mean gain 0.00035 and 0.00042 WETH against 0.000016-0.000018 ETH gas, 40 of 40 already takeable 4 blocks (1 s) before, 21 of 40 takeable 12 blocks (3 s) before, 8 of 40 takeable 40 blocks (10 s) before. 0x429e114b, 13 takes: 13 of 13 takeable 40 blocks before, 5 takeable 400 blocks before, 4 takeable 4,000 blocks (17 min) before; its take 0x25390d74 paid +0.0374 WETH and the same route showed a gain at every sampled block for about 5.9 h before it (series-525390726.json, series-525400000.json, pairswaps json: the pair had no trade between blocks 525,344,093 and 525,429,591). The bot aims at the takes that stand 3 s or longer: about half of the fast routes and all of the slow route."
executor: scratch/trial-peapods-arb-arbitrum/contracts/out/PodArbTake.sol/PodArbTake.json
executor_args: "{bot}"
executor_note: "Constructor takes only the bot owner. run(vault, weth, amount, steps, minProfit): the flash lender, the flash token, every pool, pair, pod and vault are call arguments (a step list: UniV3 swap, V2 swap, pod bond, pod debond, ERC4626 deposit / redeem), each step spends the executor's whole balance of its input token. After the profit check run() calls _clear(): for every step it sends whatever is left of the step's input token (and of the pod / vault share token for bond, debond, deposit and redeem steps) to the owner and reverts Leftover(token) when a balance cannot be read, the transfer fails or returns false, a balance is still held afterwards, or an allowance given to a pod or vault is not back to 0; so a successful run leaves the executor with no token and no approval (rounding dust such as 1 wei OHM goes to the bot wallet; it is not counted as profit). probe(vault, weth, amount, routes) is for eth_call only: owner-only, it tries each route through trial(), which always reverts (Trial(gain) or the underlying error), so nothing changes and nothing is paid even if it were sent. The Balancer callback and the Uniswap V3 swap callback check msg.sender against the lender / pool set for this call and cleared after it. Approvals are for the exact amount and reset to 0. No setup tx. A V2 step reads reserves after its transfer, because a pod's transfer hook may sell the pod's pending fees into the same pair. Live code reads EXECUTOR_ADDR_ARBITRUM or EXECUTOR_ADDR only; paper mode uses an eth_call / eth_estimateGas code override taken with eth_getCode from the fork deployment (executor-runtime.hex, re-taken 2026-11-19 by run 7b88063f after the _clear() change)."
fork_evidence: "scratch/trial-peapods-arb-arbitrum/proof.py <parent block> <result file> (one Arbitrum fork lease per run: reset, fork deploy of the artifact with --args, fund the owner, non-owner, guard, success per paying route, repeat; after EACH success it reads the executor's native balance and its balance of all 14 route tokens, and its allowance of each of them to all 6 bond / deposit targets and the Balancer vault, and fails unless all are zero). Re-run 2026-11-19 17:4x UTC by run 7b88063f with the executor that clears leftovers (source sha256 835323403217bcbf32c7c97d5c846aba854cea45edfbcdb726e09d3972d04245, fork deployment 0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352). RUN 1, reset 525,390,726 (parent of incumbent takes 0x0d378940 and 0x32610b87), proof-fix-525390726.json: probe() from the owner answers gains for 4 of 8 routes, from a stranger it reverts. Non-owner run revert NotOwner 0xb9ac678a7ed5b93d16b8c980a3bb54e8a81b95a32d89f779435649fc98d1f4f2. Guard revert NoProfit (minProfit 1 ETH) 0x3c9917a4944ea778af3329b1a0088ba65939c0ab149d889a28609837e2d9cb5b, 1,095,426 gas, owner -0.0001095 ETH at the fork's 0.1 gwei. Successes, owner native delta net of gas: appeasusdc 0x8d6b372f653753c893be7611a70594f25236423007e9509ff8511234e20011a2 block 525,390,730 +0.000171474 ETH (927,382 gas); apohm 0x08f7d9f4da64cb07bea885865ab5410a96e783e169282fa7687445a168d5d8c9 block 525,390,732 +0.009191829 ETH (1,341,850 gas); apump 0x44948d1f970acb1cf508b5372d753659d561075492b9330a0b5db704ba578964 block 525,390,734 +0.002906110 ETH (684,426 gas); ppeas_usdc_rev 0x232a00c27302ab56de46ca8a761e4fbd2be426c592d4bc680d1e04adc2bef291 block 525,390,736 +0.000859795 ETH (844,554 gas). After every one of the four: executor leftovers {} and allowances {}; the 1 wei of OHM that the old executor kept after apump is now in the owner wallet (owner OHM balance 1 after apump). The same call repeated right after each success reverts. (The fork tx hashes equal those of the earlier proof because sender, nonce and calldata are the same; the gas and the deltas are the new executor's.) RUN 2, reset 525,372,868, proof-fix-525372868.json: non-owner 0x52263036619ed5b8b172b6a239ca28662b3f8538eef5283fd2402d4f276c630a, guard NoProfit 0xcf46f805f0d05f8ff789fbb2bcde9c0eda2b9bdcadfed48c23eadeefd1f11e35; successes parb 0x4529bdc0e017fcb0fe3dab3418d9793fc42eb4ac071994f777dd702e5e61a1b4 block 525,372,872 +0.000150286 ETH net (1,105,531 gas), appeasusdc 0x66737f3dcbe25fe9a1d407a867436c6a0575f2c6c40f5e88595e01d92f9e636c +0.000054450 ETH, apohm 0x3f297c46c93fb9ba02c98da1716cdc7c0ac0380dfb318b9a467fb85cb733accd +0.010516937 ETH; leftovers {} and allowances {} after each. RUN 3, reset 525,387,186, proof-fix-525387186.json: non-owner 0x1ff0f344185146a5d925a352f1e7657d77c513ffb36a0a224e0ba153d948f1fe, guard NoProfit 0xbf47de278d64ffe5572967f6ec4d71364ef028de8af10d4afb1c2225ffe5c101; successes parb_rev 0xae15c02c6148b1d9a860b0bed1dc86ea23a888264e586df08d06b07bbb2adcf0 block 525,387,190, status 1, gross gain 0.000075982 ETH but owner -0.000016234 ETH net at the fork's 0.1 gwei gas price (922,160 gas; at the live 0.02 gwei the gas is 0.000018 ETH, and the bot only sends when the gain is above its signed gas cap), appeasusdc 0xc4dbeb40729dd989853f506d87c830895f8a1712838dcede990d2911004107de +0.000242892 ETH, apohm 0x706d7b5eeff472d240ec5b0f02858cc5156a7782b3efc34a6dc93b52bc1da5e3 +0.015197553 ETH; leftovers {} and allowances {} after each. Six of the eight routes therefore have a fork success with a clean executor. apump_rev has no fork transaction (it shows a gain in probe() at resets 525,372,868 and 525,387,186, but the earlier takes of the same script run remove it); appmax has neither a fork success nor a simulated gain yet. Both use only step kinds proven by the other routes, and _clear() runs on every route. The bot's own check() replayed through the relay with the new runtime (selftest.py, which also checks both hand ABI encodings against cast): selftest-525390726.jsonl."
awaited_events: "Swap on the Uniswap V3 PEAS/WETH pool 0x23d17764f41aea93fdbb5beffa83571f0bf3f8b2 through the feed (all eight routes trade there, and so do the incumbents' takes), plus a 60 s timer. Last incumbent takes: blocks 525,495,217 to 525,511,983 (2026-11-19 about 03:40-04:50 UTC). Next: any time; 9-47 takes per day on quiet days, 304 on 2026-11-18/19."
good_signs: "opportunity and paper_sim rows with gross_wei above gas_cap_wei; live send_result won with positive net_wei; wins on route apohm, where the incumbent is minutes to hours late."
bad_signs: "No opportunity row in three days, repeated simulate_revert or estimate_revert, every send lost with blocks_after_winner of 1-4, read_budget rows, loop_error rows from probe, or the pods' pairs losing their liquidity."
rpc_reads_per_min: "1 on the timer (one probe() eth_call every 60 s covers all eight routes) plus 1 eth_call per feed-triggered check (at most one check per 5 s); a route that shows a gain adds 1 eth_getBlockByNumber, up to 4 eth_call, 1 eth_estimateGas and 1 guarded eth_call."
alchemy_cu_per_day: "Timer 1,440 x 26 = 37,440 CU; feed-triggered checks at 300 pool swaps per day x 26 = 7,800 CU; sweeps about 200 CU each; code cap 93,000 relay CU per day (0.05 USD at 0.53 USD per million CU). Feed filter PEAS/WETH pool Swap: its own CU is metered by the feed."
legal_note: "bond() and debond() are the public mint and redeem entries of Peapods pods and the swaps are ordinary pool trades: arbitrage the protocol relies on to keep pod prices in line. The bot reads confirmed state only, watches no pending transactions and moves no price for others to trade against."
expedite: false
