id: trial-podvault-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: Peapods pods on Base whose Uniswap V2 pair is against a lending-vault share (pPEAS / pfWETH-12, pTibbeas / pfpPEAS-186, pBTC.pLeasE / pfpPEAS-145): flash WETH, round trip through the vault's deposit or redeem, the pair, bond or debond and the PEAS/USDC and WETH/USDC pools (six routes, one executor call)"
copied_from: "The per-route executors of the operator that pays out to 0xc0ffeefeed8b9d271445cf5d1d24d74d2ca4235e (rotating 0xc0ffee... sender EOAs): pfw_fwd 0x0b725e3828f9664c3c649a933629f1bb8a8f3f9c (tx 0x5c0f474cb399ee0b9f5d3331b59e1eef2c8fb4d5078542129d3bb36dd1e860d6, kept 0.0032 ETH) and 0x5817c0e2bdddcdb3ca24f60fe05efd74bda0a0e6 (tx 0xfb0376b5697c33057cdccf2714b7fb4f2dbbc4a5680515eda141c0dfa0c53a52); pfw_rev 0x26532d44c942d5f051421adbc575b3560fdc95ee (tx 0xdacf2f5c4ad523fae52082a04488d1462085dd290b616aab529130a1a461afd9); tib_fwd 0x96b2f4fc0be373c1f164fff5b9ea43a363514d8d (tx 0x7cc59e7ec5fbe62c1f0237b3c2291ba2e0c137302904dd652357449eebebcc11); tib_rev 0x85f251b01e1a6fc030bde9cce84d56c540f16ea2 (tx 0x4a11cbdab3af789857774d5e12548ee227e1f13a63c523996a2b225bb7918d24); btc_fwd 0x5b855858f2fdb940eb4cd7aacf82d313bab7f54a (tx 0xfd3c481bed63ac29a961178943e8af0ca389283710b98966d5046b4c06f7e7f6)"
capital_usd: 0.75
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Same mechanism as the live siblings trial-peapods-arb-base and trial-podcycle-base. Base charges the L1 data fee and the operator fee at inclusion and no signed field bounds them, so the worst case of one send is the bot wallet's native balance, kept under 1 USD: capital_usd 0.75, all native, no top-up, and bot.py:367 (live branch of take(), wallet_bound() at bot.py:253, WALLET_MAX_USD bot.py:103) refuses to sign while balance x ETH/USD is 0.95 USD or more. Inside that bound a lost attempt costs gas only: PodArbTake.sol:71-79 run() is owner-only and reverts NoProfit unless the executor's WETH balance grew by minProfit after the Balancer flash loan was repaid (minProfit 0 refused), then unwraps the gain and pays the bot wallet native ETH. A send needs simulated gain above the signed cap (bot.py:337 cap = gasLimit x maxFeePerGas + L1 allowance, bot.py:347 skip when gross is not above it, bot.py:339 minProfit = cap + 1), refused when the cap is 0.90 USD or more at a 4,000 USD/ETH reference (MAX_TX_USD bot.py:107) or the gas limit is above 3.2m (bot.py:343). Priority fee bid: at most 20 pct of the simulated gross (TIP_SHARE_PCT bot.py:116), between 0.0001 and 0.05 gwei."
expected_value: "Trial: send-measured win rate. Competition, 7 days to 2026-11-22 10:47Z (README tables; scratch/r1805/routes.json, scratch/trial-podvault-base/series-windows.json): one operator (payout 0xc0ffeefeed8b9d27..., 11 per-route executors) made 756 takes on these three pods and kept 0.623 ETH, of which 0.528 ETH in three takes; the other 753 kept 0.095 ETH, about 22 USD a day, median 0.00002-0.0001 ETH a take. Of 43 sampled takes a gain was visible to the bot's probe 1 block before for 38, 3 s before for 18 and 10 s before for 10; with a gain above a typical gas cap (0.00002 ETH): 8 at 3 s, 4 at 10 s, 2 at 30 s. Priority fee 0.003-0.25 gwei, tx index 2-37. Aim: the roughly 1 in 10 takes that stand 10 s or longer, about 10 a day at 0.00002-0.0001 ETH, 0.3-0.8 USD a day gross if won; the result that matters is the win rate at a 3 s reaction on a feed trigger and a 60 s timer."
executor: scratch/trial-podvault-base/contracts/out/PodArbTake.sol/PodArbTake.json
executor_args: "{bot}"
executor_note: "PodArbTake.sol, byte-identical source to the executor of the live trial-peapods-arb-base and trial-podcycle-base (sha256 835323403217bcbf32c7c97d5c846aba854cea45edfbcdb726e09d3972d04245), compiled in this bot's own scratch directory. Constructor takes only the bot owner. run(vault, weth, amount, steps, minProfit): the flash lender, the flash token, every pool, pair, pod and vault are call arguments (step list: UniV3-style swap, V2-style swap, pod bond, pod debond, ERC4626 deposit, ERC4626 redeem); each step spends the executor's whole balance of its input token. This bot is the first to use the ERC4626 deposit and redeem steps; both are fork-proven. probe() is for eth_call only (owner-only, every trial reverts). The Balancer callback and uniswapV3SwapCallback (called by the Uniswap V3 and the Aerodrome Slipstream pools) check msg.sender against the lender / pool set for this call and cleared after it. Approvals are exact and reset to 0; no setup tx; run() reverts Leftover when any step token stays in the executor. A V2 step reads reserves after its transfer and prices what actually arrived, so the pod's transfer fee is paid, not bypassed (no Router02 recipient route; human decision 2026-11-21). Live code reads EXECUTOR_ADDR_BASE or EXECUTOR_ADDR only; paper mode uses a code override taken with eth_getCode from the Base fork deployment (executor-runtime.hex)."
fork_evidence: "scratch/trial-podvault-base/proof.py <parent> <result file> (one Base fork lease: reset, deploy the artifact with --args, fund, non-owner, guard, success per route, leftovers, repeat, release). Run 1, reset 60,679,613 = parent of the incumbent pfw_fwd takes 0x5c0f474c (block 60,679,614) and 0xfb0376b5 (60,679,615), proof-result-60679613.json: non-owner revert NotOwner 0xaf58365343885374a62052bbd3a1c1e256767fc0e99979b0a69ffa070bf090d0; guard revert NoProfit (minProfit 1 ETH) 0x2a647df438fc799dbe8308fa67cc12c3bf2bcbbd66df4f210dea57ca747ace56, 1,025,137 gas, owner -0.0001025 ETH at the fork's 0.1 gwei; success pfw_fwd at 0.005 WETH 0xc737cb507463284fbfee90ee3554e645f2690bbca483d5bba69de70914232616, fork block 60,679,617, 847,055 gas, gross +0.001525241 ETH, owner +0.001440536 ETH net of gas; success tib_fwd at 0.001 WETH 0xd42a6a40012f28294966766cb75d8b37d29247a704cdee937c28d805b3c0ad1a gross +0.000160993 ETH, owner +0.000053485 ETH net; success btc_fwd at 0.0005 WETH 0x513d775a7e72c6c48c3db2a69159306b9ec76d3d26c22f8dd310c8e7b7be2d3b gross +0.000032448 ETH (net negative at the fork's 0.1 gwei gas price; live base fee is 0.005 gwei); the repeated call reverts each time. Run 2, reset 59,104,692 = parent of the incumbent pfw_rev take 0xdacf2f5c (block 59,104,693, kept 0.2258 ETH), proof-result-59104692.json: non-owner revert 0xc6677af182d22848ce97da4f4a8c2e7e5e43e74939c25efe7f75c3823f9ed8ab; guard NoProfit 0x7443033f66bc57a0842bd542d6532fe0601a27aad870e5e143e6fffd14ad7270; success pfw_rev at 0.005 WETH 0xe040b6e1a107c4f0c6af171a2445ed1a278ced634774b464ca4764d2e35f1af2 gross +0.234709 ETH; success tib_rev 0x40f31251fe54df7f4df2040e441d3ad3f7573b1fa39a4dcb81282bd0d57406c8 gross +0.248567 ETH; success btc_rev 0x330611a5cc69c85c17e86f257ca09930a1d87e334ab2a5ef90bf01c712babbc9 gross +0.202326 ETH (the gap at that block is wide enough that the repeated calls still pay; the three share the PEAS leg). Executor balances (native and 11 tokens) and allowances (14 spenders) read right after each of the six successes: all zero. selftest.py 60679613: the bot's hand ABI encoding of run() for all six routes and of probe() equals cast, and its own check() at that block logs paper_sim success (pfw_fwd at 0.008 WETH, gross 0.001962 ETH, cap 0.000103 ETH; selftest-60679613.jsonl)."
awaited_events: "Feed /logs/base: Swap (topic 0xc42079f9...) of the Uniswap V3 PEAS/USDC pool 0x8f8184bb6d3817910bc2ef91a393d2fe3ca8d774, plus a 60 s timer. A gap opens when PEAS, TIBBIR or one of the three pairs moves; the incumbent took 756 of them in 7 days (about 108 a day), the last pfw_fwd ones in blocks 60,679,614-60,679,615 (2026-11-22 05:46:02Z). About 1 in 10 stands 10 s or longer before it is taken. Next: within hours; a larger one with every sharp PEAS move."
good_signs: "opportunity and paper_sim rows with gross_wei above gas_cap_wei; live send_result won with positive net_wei."
bad_signs: "No opportunity row in two days (the incumbent leaves nothing above the cap, or the pairs lost their liquidity: each holds only 0.1-0.2 WETH of value a side); every send lost with blocks_after_winner of 10 or more; opportunity_skip wallet_at_or_above_usd_bound (one win above about 0.2 USD lifts the wallet over the 0.95 USD send bound: sweep needed, report it) or wallet_below_gas_cap; repeated simulate_revert, estimate_revert, fee_gas_or_usd_cap, feed_error, read_budget or loop_error rows."
rpc_reads_per_min: "1 on the timer (one probe() eth_call every 60 s covers all six routes) plus one probe per feed trigger (at most one per 3 s, about 400 a day); a route that shows a gain adds 1 eth_getBlockByNumber, up to 4 eth_call, 1 eth_estimateGas, 1 guarded eth_call, 1 slot0 eth_call and (live) 1 eth_getBalance."
alchemy_cu_per_day: "Timer 1,440 x 26 = 37,440 CU; feed-triggered probes about 400 x 26 = 10,400 CU; sweeps about 250 CU each; about 50,000 relay CU per day (0.03 USD at 0.53 USD per million CU), code cap 90,000. Feed CU for about 400 logs a day is metered by the feed (the filter is the one trial-podcycle-base already holds)."
legal_note: "bond(), debond() and the vaults' deposit() and redeem() are the public entries of Peapods pods and lending vaults, and the swaps are ordinary pool trades that pay every fee, the pod's transfer fee included (no fee-bypass route; human decision 2026-11-21): arbitrage that brings a pod pair back in line with its underlying. The bot reads confirmed state only, watches no pending transactions, reacts to no one's unconfirmed order, and bids a priority fee only for its own public arbitrage."
expedite: false
