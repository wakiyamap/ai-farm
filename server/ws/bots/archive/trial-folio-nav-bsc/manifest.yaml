max_loss_guarantee: "A lost attempt costs gas only, and the gas of one send is bounded by the signed fields (BSC has no base fee and no L1 fee). Executor: FolioNavFlash.sol:70-81 run() is owner-only (line 74) and reverts NoProfit (line 76) unless the executor's WBNB balance grew by at least minProfit after the outer pool was paid inside its swap callback (minProfit 0 is refused); when the round trip cannot pay the pool, the pool's own swap reverts; no principal leaves the wallet (the CMC20 is handed out by the pool's flash swap). Bot: bot.py:308-362 take(): gas limit = eth_estimateGas x 1.20 + 100,000 (line 325, refused above 3.7m, bot.py:108), gas price = eth_gasPrice + bid, where the bid is at most 20 pct of the simulated gross spread over the gas limit (BID_SHARE_PCT, line 331), never above 1 gwei (bot.py:107) and never above the price at which gasLimit x gasPrice reaches 0.90 USD at the pool's BNB/USD x 1.15 (lines 332-333; bnb_usd() bot.py:244 reads slot0 of the PancakeSwap V3 USDT/WBNB pool and refuses a price outside 100-5,000); cap = gasLimit x gasPrice; sent only if the simulated gain is above the cap (line 344) with minProfit = cap + 1 (line 336) and after the exact guarded call was simulated at the signed gas limit. Typical cap 0.00015-0.0008 BNB = 0.09-0.45 USD. Priority bid: at most 20 pct of gross (maxFeePerGas = maxPriorityFeePerGas = that gas price, passed explicitly to the signer, bot.py:272)."
expected_value: "Trial: send-measured win rate; expected to be close to zero, stated plainly. Competition, 25.0 h to block 134,641,131 (scratch/trial-folio-nav-bsc/scan.py, stats.py, takes.json): 102 public mint / redeem round trips on CMC20 (81 mints, 21 redeems) by 4 operators; this bot does the redeem direction only. The 21 redeems: 0x742414b7 15, 0x0000000000be 3, 0x3ee0a37f 2, 0x1836532f 1; gross (WBNB kept by the executor) median 0.000284 BNB = 0.16 USD, max 0.00337 = 1.9 USD, 7 of 21 above 0.0005 BNB; gas 1.74m-3.9m at a flat 0.05 gwei = about 0.0001 BNB = 0.055 USD (nobody bids: max 0.0501 gwei); tx index 1-67, median 4. The whole redeem side paid about 5.6 USD net in the day. Blocks to take (series.py, series-windows.json: this bot's own probe() with a code override at blocks before each of the 21 takes; BSC blocks are 0.45 s): a gain above 0.00015 BNB (one gas cap) was visible at the parent block for 11 of 21, two blocks before for 3, four blocks (1.8 s) before for 0; smaller gains (0.00005-0.0001 BNB, below the bot's and the incumbent's line) stood 3-30 s on 9. So a takeable gap stands 0.45-0.9 s and the incumbent takes it in the next block at the floor gas price; with a 40 s timer (5 s for 60 s after any gain shows) the bot sees such a state rarely and then lands several blocks late. Expected: a few sends a week, nearly all lost at about 0.06 USD each; a win pays 0.1-1.5 USD. Paid entries in the last 7 days whose gross exceeds one attempt's gas: all 21 redeems above (e.g. 0x39a048d7..., 0.000719 WBNB against 0.0000966 BNB gas)."
executor: scratch/trial-folio-nav-bsc/contracts/out/FolioNavFlash.sol/FolioNavFlash.json
executor_args: "{bot}"
executor_note: "New contract in this bot's own scratch directory, same shape as the reviewed FolioNavTake of trial-folio-nav-base (probe / trial, profit check, strict cleanup) with a flash swap in place of the Balancer flash loan (BSC has no Balancer V2 Vault) and V2 pairs added. Constructor takes only the bot owner. run(outerPool, payToken, wnative, amountIn, steps, minProfit): the outer pool, the token it is paid in, the wrapped native token, every pool and the Folio are call arguments. The executor calls swap() on the outer V3-style pool for an exact input of payToken; the pool sends the CMC20 first and calls back; inside that callback the steps run (0 = V3-style swap of the whole balance of tokenIn, 1 = Folio redeem of the whole share balance with the basket read from Folio.totalAssets() and zero minimums, 2 = V2 pair swap of the whole balance with the fee numerator as an argument and the amount the pair really received, 3 = V3-style exact-output buy of what is still owed to the outer pool), then the pool is paid. All V3-style swap callbacks (uniswapV3SwapCallback, pancakeV3SwapCallback, forks) arrive in fallback(), which accepts only the inner pool set for that one swap (_pool) or the outer pool of this run once (_outer, _inside), both cleared afterwards; anything else reverts BadCaller. No approvals are given at all (pools and pairs are paid by transfer). No setup tx. probe(wnative, routes) is for eth_call only: owner-only, each route goes through trial(), which always reverts, so nothing changes and nothing is paid even if it were sent. After the profit check run() clears the executor: _clear() sends any leftover of the pay token, of each step's input token, of the Folio share and of every basket token to the owner and reverts Leftover / TransferFailed when a balance cannot be read, a transfer fails or anything is still held. The gain is unwrapped and paid to the owner as native BNB. Deploy gas about 1.6m (7,057 bytes of runtime; under the gate's 3m). Live code reads EXECUTOR_ADDR_BSC or EXECUTOR_ADDR only; paper mode uses an eth_call / eth_estimateGas code override taken with eth_getCode from the BSC fork deployment (executor-runtime.hex)."
fork_evidence: "scratch/trial-folio-nav-bsc/proof.py (one BSC fork lease per run: reset, deploy the artifact with --args, fund the owner, probe, sweep by eth_call, non-owner, guard, success, repeat; run 2026-11-20 about 05:48Z; route table scratch/trial-folio-nav-bsc/routes.py, checked equal to the bot's by selftest.py). (A) proof.py 134625964 proof-result.json, parent of incumbent take 0x39a048d7...: probe() answers for the owner and reverts for a stranger; WBNB-pool route sweep 0.3 / 0.7 / 1.5 / 3 WBNB = +0.000258 / +0.000513 / +0.000724 / +0.000039 BNB; non-owner run revert NotOwner 0xd3f89baeeb2658d7ecff0f6189a1264fed00bc5cc2ee212f772b83d7303fc2aa (block 134,625,966); guard revert NoProfit (minProfit 1 BNB, the revert data carries the gain 7.24e14) 0xfa70145269e2f93508008f86007ece1ddee34a2ce602c4e24b68f700b0005120 (block 134,625,967, 2,391,821 gas, owner -0.000239 BNB = gas only at the fork's 0.1 gwei); success at 1.5 WBNB 0xecf2d1ae079bd8252d187d12dc72e534eee4b3b4855be395a84b31399c2ffff1 (block 134,625,968, 2,032,662 gas): gross +0.000724304 BNB paid to the owner as native, owner balance +0.000521038 BNB net of gas at the fork's 0.1 gwei (the incumbent kept 0.000719 WBNB on the same case); right after it the executor's native balance and its balances of all 18 route tokens are zero and the owner holds none of them; the same call repeated reverts 0xcd791c41ecce6dcb57b0df724f92fc50d2324a01d5f4fd60906cb8e6fc265204 (TransferFailed(WBNB): the pool cannot be paid, nothing to take) and every size reverts in the sweep after it. The USDT-pool route correctly shows no gain at this block. (B) proof.py 134585927 proof-result-134585927.json, parent of incumbent take 0xdab7c737... (USDT pool): WBNB-pool route success 0xe11533d598658862f6bd5a0c5843cb6fee1b181b6696314fa7ed6587995d8300 (block 134,585,931, +0.000695934 BNB gross, 2,049,606 gas); USDT-pool route sweep 170 / 400 / 850 / 1700 / 3400 USDT = +0.00052 / +0.00114 / +0.00207 / +0.00280 / +0.00023 BNB, success at 1700 USDT 0x2230e7e94aff7a439ad4a126ed6c0c49516fbf21889824c43dc26118a00ead65 (block 134,585,933, 2,199,177 gas): gross +0.002804803 BNB, owner +0.002584886 BNB net of gas (the incumbent kept 0.00337 WBNB); no leftovers; repeats revert 0xa031afacd78327450a47b399f11bafa6270b32cf9671458b7763869805cf0700 and 0x7357099b041f76d6af12e09175a1fff9e525b72d8ef4fb218de7ec17f1120dff. The bot's own check() replayed through the relay (scratch/trial-folio-nav-bsc/selftest.py, which first checks both hand ABI encodings against cast): paper_sim success at 134,625,964 (WBNB route, 1.5 WBNB, gross 7.24e14 wei, cap 2.97e14) and at 134,585,927 (USDT route, 1700 USDT, gross 3.01e15, cap 7.65e14); nothing_to_take at 134,620,000 (control) (selftest-*.jsonl)."
awaited_events: "A 40 s timer (one probe() eth_call covering both routes); after a probe shows any gain, every 5 s for 60 s, at most once per 20 min. No feed filter: the two CMC20 pools emit about 1,600 and 3,500 Swap logs a day (busy by the feed rules) and basket-side price moves have no event. Last incumbent redeem take: block 134,625,965 (2026-11-20 about 03:40Z); 21 redeem takes in the last 25 h. Next: any time."
good_signs: "opportunity and paper_sim rows with gross_wei above gas_cap_wei; live send_result won with positive net_wei."
bad_signs: "only check rows with nothing_to_take or gain_below_gas for days (the incumbents leave nothing standing for a 40 s timer); every send lost with blocks_after_winner of 3 or more; repeated simulate_revert or estimate_revert; opportunity_skip wallet_below_gas_cap (the 3 USD is spent: the trial is over); read_budget rows; loop_error rows from probe or every sweep reverting Leftover / TransferFailed (a basket change: Folio.totalAssets() gained a token the route does not sell, or a pool moved: re-read the basket and the pools and update the route table)."
rpc_reads_per_min: "1.5 on the timer (one probe() eth_call every 40 s), 12 a minute during a 60 s burst (at most 3 bursts an hour); a gain adds 1 eth_gasPrice, up to 3 eth_call, 1 eth_estimateGas, 1 slot0 eth_call, 1 guarded eth_call and (live) 1 eth_getBalance; a send adds receipt polls and 1 eth_getLogs."
alchemy_cu_per_day: "Timer 2,160 x 26 = 56,160 CU; bursts at most 72 x 12 x 26 = 22,464 CU; sweeps about 200 CU each; about 60,000-80,000 CU per day (0.03-0.04 USD at 0.53 USD per million CU), code cap 95,000 relay CU per day, then the bot sleeps to 00:00 UTC. No feed use."
legal_note: "Folio.redeem is the public redemption entry of a Reserve index token and the swaps are ordinary pool trades: the arbitrage the protocol relies on to keep the share price at its basket value. The bot reads confirmed state only, watches no pending transactions, and bids a gas price only for its own public arbitrage; it moves no price for others to trade against."
