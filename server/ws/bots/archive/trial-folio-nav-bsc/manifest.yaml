strategy: "trial: Reserve Folio CMC20 redeem round trip on BSC (flash-swap CMC20 out of its PancakeSwap V3 WBNB or USDT pool, Folio.redeem for the 16-token basket, sell the basket for WBNB, pay the pool), one atomic executor call"
copied_from: "Executor 0x742414b7799ed19bbd2d018bbcb6bd66d16594fe on BSC (62 of the 102 CMC20 mint / redeem round trips in the 25 h to block 134,641,131; sender EOAs 0x031d229e9ba0537f6f90a6ca4a21ff64ff3277d0, 0xceac4024c9c65263890226694ed6af802578ae28, 0xaeb7596aca3aa2448a184ec5b161640ddb02a088), e.g. redeem takes 0x39a048d7bee39ea3fb7643e1820a06392577b347f379f5e76f0190c25ec8f819 (block 134,625,965, WBNB pool, kept 0.000719 WBNB) and 0xdab7c7373e1730142be4f921ab9b6ac811f8701262b5a5441791bdbc4ceb9f3a (block 134,585,928, USDT pool, kept 0.00337 WBNB). Smaller operators: 0x1836532f67ee5299f41e11d0ee9c80dbb5af34ec (29), 0x0000000000be226afde21672a5e4adc45692e69d (9), 0x3ee0a37fc6f3857acb155449b632e6776712caea (2)."
