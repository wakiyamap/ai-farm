id: aave-watcher2-ethereum
author: earner/qwen3.8-flash-next
chains: [ethereum]
strategy: >
  Transplant of the archived aave-watcher-base pattern to mainnet Aave v3
  (Pool 0x87870bca3f3fd6335c3f4ce8392d69350b4fa4e2, LiquidationCall emitter):
  watch borrowers via Multicall3 getUserAccountData over a discovered candidate
  universe, and when HF < 1 at the pool price, send one executor tx =
  Pool flashLoan(debt) (arrays-form, the Pool itself; Morpho mainnet holds zero
  WETH) -> Pool liquidationCall (repays cover, seizes collateral) -> sell ONLY
  the newly seized delta on the constructor-baked UniV3 USDC/WETH 0.01% pool
  0xe0554a476a092703abdb3ef35c80e0d76d32939f (the measured winner's own route)
  -> revert NO_PROFIT unless the executor's debt balance ends higher than it
  started. Reopened 2026-11-13 per decision 2026-11-13-blocked-infra-feed-retriage
  item 2: >=2-block windows exist with net >> feed CU; a poll/feed bot may count
  them in EV.
copied_from: >
  Ledger aave_v3.liquidation winners on ethereum (0x29452e8332912533130fb708984722d92184284f,
  0x0ab2e0b0aef4bb6291abbd0e24760cba12b8aec3, 0xf28307728ad7b7449e9b020a5c24292ce5f871ca
  and 0x789e3f3cad898948759402b347d1d1e007f93f79; per-occurrence receipts in
  scratch/aave-eth-revive-receipts.json; the route was built and reviewed as the
  archived bots/archive/aave-watcher-ethereum with the same executor source).
capital_usd: 400
allowed_contracts: []   # executor bot (decision 2026-11-11-executor-bots-funds; review 1091 blocker 1): the bot WALLET only sends to the gate-deployed executor (signer-allowed). The Pool, Multicall3, oracle, protocol tokens and the UniV3 pool below are EXECUTOR-internal / read-side addresses — documentation only, measured: Pool 0x87870bca..., Multicall3 0xca11bde0..., provider 0x2f39d218..., oracle 0x54586be6..., USDC 0xa0b86991..., WETH 0xc02aaa39..., USDT 0xdac17f95..., aUSDC 0x98c23e9d..., aWETH 0x4d5f47fa..., aUSDT 0x23878914..., varDebtUSDC 0x72e95b89..., varDebtWETH 0xea51d785..., varDebtUSDT 0x6df1c1e3..., UniV3 USDC/WETH 0.01% pool 0xe0554a47...
max_loss_per_tx_usd: 20
max_loss_guarantee: >
  One transaction through the bot-deployed AaveEthLiquidator: its OWNER-ONLY
  liquidate() ends with require(balAfter >= balBefore + minProfit + 1, "NO_PROFIT")
  on the executor's debt-asset balance (scratch/aave-watcher-ethereum/contracts/src/AaveEthLiquidator.sol:116),
  so any shortfall rolls the tx back and the worst case is gas only; the same
  tx then transfers exactly balAfter - balBefore of the debt asset to the OWNER
  wallet (same file :124 — review 1091 blocker 2: the profit arrives in the
  watched bot wallet in the liquidation transaction itself, sweep() is only a
  leftover fallback and the executor keeps no profit inventory). Gas is
  bounded by the send itself: gas = MAX_GAS_LIMIT 900000 with maxFeePerGas = the
  derived cap (baseFee*9/8 + tip, hard cap 17.5 gwei; 900k x 17.5 gwei = 0.01855 ETH
  ~= 45 USD at 2400 USD/ETH) — and liveLiquidate REFUSES the send when the fresh
  USD valuation of gas x cap exceeds MAX_LOSS_PER_TX_USD 20 (bot.js fail closed),
  with 2 x APPROVE_GAS 80k added at the same cap, and refuses it unless the
  expected GROSS clears that fresh bound too (review 1091 blocker 4, bot.js
  liveLiquidate 'expected gross ... <= fresh gas bound'). Cover is capital-sized
  (<= MAX_COVER_USD 250).
expected_value: >
  Fresh 30 d per-capture recount (decision 2026-11-13-aave-watcher2-recount
  item 1; scratch/aave-eth-revive/recount2.py -> recount2_out.json, padded
  getUserAccountData calldata — the 11-13 'relay incident' was our own unpadded
  address, lead 17 CORRECTION): the same 14 farm-band supported-pair captures,
  blocks 26284068-26402919 (~16.1 d), repriced at the per-block liquidation
  bonus read at each parent block — measured 10500 bps (5 pct), NOT the 10 pct
  assumption (review 1091 blocker 5): gross 263.72 USD, incumbent-tx gas
  131.80 USD, net 131.92 USD before window filtering. Window recount
  (binary-search first-underwater-block probes, ~12 s blocks): windows 0/0/0/0/0
  / 1/1 / 2 / 3 / 4 / 6/6/6 blocks. Countable EV per decision 2026-11-13
  (>=2-block windows only, net <= 0 excluded): 4 captures, 54.66 USD over
  16.1 d = 3.4 USD/day (blocks 26372987 x2 cascade 49.96 + 0.64 at window 6,
  26384827 at 2 blocks 1.83, 26399074 at 3 blocks 2.23). Two 1-block-window
  captures (net +1.39, +28.96) are feed-only tries and excluded from EV; five
  same-block crossings (window 0; 26300887, 26351313, 26384825, 26385472 x2)
  are same-block races. SVR/auction check (decision item 2): every capture is a
  direct public Pool.liquidationCall (LiquidationCall event = ledger source);
  at head 26403749 an arbitrary-sender eth_call liquidationCall(WETH,USDC,
  healthy user) runs the whole liquidation pre-check and reverts only with the
  healthy-account error 0x979b5ce8 inside the LiquidationStrategy library
  (debug_traceCall callTracer, delegatecall 0x87870bca->0x4295fe69->0x96d56868)
  — no auction/claim gate: the target-asset price-triggered class is NOT sold
  through a Chainlink-SVR-style auction, nothing excluded on that basis. EV/day
  3.4 >> read cost (<= 0.9M CU/day ~= 0.47 USD); our own send gas <= 20 USD is
  enforced at a fresh price (below the incumbent gas column, no priority race
  needed at >=2-block windows).
executor: scratch/aave-watcher-ethereum/contracts/out/AaveEthLiquidator.sol/AaveEthLiquidator.json
executor_args: "0x00000000000000000000000087870bca3f3fd6335c3f4ce8392d69350b4fa4e200000000000000000000000087870bca3f3fd6335c3f4ce8392d69350b4fa4e2000000000000000000000000e0554a476a092703abdb3ef35c80e0d76d32939f"
executor_note: >
  Constructor (pool, flash, router): the Pool flashes the debt asset from its own
  balances (measured WETH ~2157, USDC ~945k at the proof era; Morpho mainnet
  holds ZERO WETH so the old Morpho flash leg died). liquidate(user, collateral,
  debt, cover, minProfit, fee) selector 0x9153f799 is OWNER-ONLY (the gate
  deployer = OWNER; the bot reads its executor from EXECUTOR_ADDR /
  state/executor.json); the callback executeOperation returns bool and sells ONLY
  the newly seized collateral delta on the constructor pool (direction read from
  the pool's own token0/token1; same-asset liquidations skip the swap), pays the
  exact-input delta via uniswapV3SwapCallback, and the Pool pulls loan+premium
  from the executor balance at the end of flashLoan. Paper mode simulates
  eth_call of the executor against the deployed fork runtime in
  executor-runtime.hex (the DEPLOYED runtime with real immutables, not
  forge's zero-immutable deployedBytecode — wiki pitfalls/executor-paper-sim-override).
