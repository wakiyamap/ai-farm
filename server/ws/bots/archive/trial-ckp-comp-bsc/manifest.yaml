id: trial-ckp-comp-bsc
author: builder/claude-mythos-5-2
chains: [bsc]
strategy: "trial: buy CKP on the PancakeSwap V3 WBNB / CKP pool when it trades below the fixed 0.5199 USDT per CKP that the public Cakepie compensation contract 0x7ae3f267 pays (compensate + claim), funded by a flash swap on the PancakeSwap V3 USDT / WBNB pool, repaid from the claim, the rest paid to the wallet in BNB, all in one transaction"
copied_from: "executors 0xf38c67a72476b23e60700dc0bbad07d7be02ea14 (9 takes in 7 days, e.g. 0xacb524e56f3eb18441163786e11f9363a9685131d365d06b469a53ed37101f10, block 134815627, 114.89 CKP for 59.73 USDT) and 0x3ee0a37fc6f3857acb155449b632e6776712caea (17 takes, e.g. 0x400f236dcdf6 in block 134717641). Adapted, they borrow the USDT from Lista Moolah and tip a block builder; this bot uses a flash swap on the USDT / WBNB pool and bids gas price only"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "Executor run() reverts NoProfit unless the BNB left after repaying the flash swap and selling the USDT gain is at least minProfit (contracts/src/CompensationArb.sol run(), the NoProfit line), and the bot sets minProfit = gasLimit x gas price of that send (bot.py check(), cap, gain_of(amount, cap, gas_limit)); the executor never receives funds from the bot wallet, so a lost send costs only gas, capped under 0.95 USD at a BNB price of 1500 USD (bot.py MAX_TX_USD, BNB_REF_USD, GAS_PRICE_MAX_WEI 0.6 gwei, GAS_LIMIT_MAX 1500000; a lost send at the 0.05 gwei floor costs about 0.00003 BNB = 0.02 USD). Trial, it bids at most 1/3 of gross as gas price, never above 0.6 gwei (TIP_SHARE_DEN, GAS_PRICE_MAX_WEI)."
expected_value: "Trial, no counted EV. Last 7 days at the entry (every log of the compensation contract in bsc blocks 133,771,296-135,115,296, 2026-11-15T16:55:51Z onward, scratch/trial-ckp-comp-bsc/census.py 1344000, census-7d.txt, stats.py), 37 takes through 6 executor contracts, 10,781 CKP for 5,605 USDT at 0.5199, net to the senders 0.148 BNB (83 USD, 0.1155 BNB of it in one take one block after a 2,099 CKP dump), median positive take 0.000128 BNB (0.07 USD) for 0.00004 BNB (0.022 USD) of gas, all at the 0.05 gwei floor. Against the newest CKP sell on the pool (windows.py, 32 takes of 11-20 and 11-21), 3 takes same block, 11 within 3 s, 21 later, median 63 s. On the fork at the parent of an incumbent take the executor was paid 0.000302 BNB (0.17 USD) where the incumbent kept 0.000175. The bot aims at the takes that stand for seconds to minutes (about 20 of the 37), 0.05-0.15 USD each. The trial measures how many of those it reaches before the three faster operators, and whether another episode comes at all (none in the 37 h before placement, the pool sat 0.56 pct above the rate)."
executor: scratch/trial-ckp-comp-bsc/contracts/out/CompensationArb.sol/CompensationArb.json
executor_args: "{bot}"
executor_note: "CompensationArb, constructor (owner) only. The compensation contract, burnt token, paid token, flash pool, middle token, second pool, exit pool, wrapped native, the size and minProfit are call arguments. Callbacks pancakeV3SwapCallback / uniswapV3SwapCallback check msg.sender against the pool set for the swap in progress (cleared at the end of every run). The one approval (CKP to the compensation contract) is the exact amount and reset to 0 in the same call. Profit is paid to the bot wallet as BNB. probe() and sim() are eth_call helpers (owner only / self only, every sim reverts). Runtime 4,550 bytes."
fork_evidence: "scratch/trial-ckp-comp-bsc/proof.py (one script, one lease; result proof-result.json). Reset bsc 134815626 = parent of the incumbent take in block 134815627, deploy, fund, getters, probe, guards, success, repeat. Success 0x1c6c6b204cc6ef56089816e90ed9f82d2944e4b72172765e8f3fba8c88528c03 (fork block 134815630, 449,973 gas, 52.43 USDT flash swap, 101.148 CKP compensated), owner native +257,497,021,649,366 wei after gas at 0.1 gwei, paid 0.000302494 BNB (the eth_call just before said the same). Correct reverts, guard 0xe66c142b04e7bb48cd0bd215eb1a5c10bc3e769edb2b2212e2dbe36aabd2575d (minProfit 1e24, NoProfit 0xd4989a94, 555,540 gas), non-owner 0xf2f014e4cfffbb18a4c85bada703538f374c737aa7d0fa91d6c30a5dbb02c3d4 (NotOwner 0x30cd7471), repeat with the same size and minProfit after the take 0x35b962ee55a9f812c5b02d0a5d925d7c5139e43b1a35b355b951392333cb0726 (reverts TokenCallFailed 0x3f409f9a, the claim no longer covers the flash swap). Executor leftovers 0 (CKP, USDT, WBNB, native), allowance 0. Paper path, selftest.py at 2026-11-22T16:58:12Z, relay eth_call with the code override, the same 7 gains as the fork at block 134815626 (best 0.000302494 BNB at 52.43 USDT) and 0 for all 13 sizes at head 135115065."
awaited_events: "Swap on the PancakeSwap V3 CKP pool 0x8b626acf (130 CKP sells in the last 50 h) or a BNB price move that puts the pool price below 0.5199 USDT per CKP less fees. Last takes by others 2026-11-20T15:16:29Z to 2026-11-21T04:07:27Z (32 takes); at placement the pool is 0.56 pct above the rate, so the next gap needs a CKP seller or a BNB drop of about 1 pct with CKP / WBNB unchanged. May be hours or days; the compensation contract still holds 162,144 USDT."
good_signs: "opportunity and paper_sim success lines in logs/bot.jsonl within seconds of a feed line; live: send_result won"
bad_signs: "no opportunity line for 3 days (no seller, or the gaps close inside the block that opens them); live: send_result lost with winner_block equal to or one below our send block; a paused() compensation contract or a changed usdtCmpPerCkp (every probe 0 while the pool is far below the rate)"
rpc_reads_per_min: 0.7
alchemy_cu_per_day: 28000
legal_note: "A public fixed-rate compensation of a token, open to any holder with no allowlist or snapshot (a fresh contract was paid on the fork), bought on a public pool with a flash swap in one transaction. No mempool watching, no reaction to pending transactions; the trigger is a confirmed Swap log, a timer and the confirmed state."
expedite: false
