id: trial-hyperlend-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: flash-funded HyperLend (Aave v3 fork) liquidation on HyperEVM (USDC debt; WHYPE, kHYPE or USDC collateral), after a confirmed LiquidationCall on the feed or a 55 s near-HF scan"
copied_from: "Public HyperLend takers that call the pool as anyone can: liquidator contract 0xdd8692bc25972dba5906201960e2dbe783d460fa in tx 0x899ee4fecee9e7aa7d7ba7916237653e81cc4b7156bd05bc9d16fc6e566e9b05 (block 51273263, borrower 0x959b954f, 2,894.6 USDC repaid) and tx 0x8e6aa0b1249579587d0cf6faa1fc32b8308f48d2266bdfce5e9a368665001248 (block 51274702); 0x5ac9bc14376bf2727c6211960cf3cec1e2f295bd (24 of 112 takes in 7 d); 0x372f85418ef5afeb82918a56ed5627c21df3c244 and 0x86885a82046122aa8a7c43f579c3d64d559ee9a3 (the dust takers)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialHyperLendLiquidator.sol:66 reverts NoProfit unless the USDC balance grew by at least minProfit, and :68 pays the whole gain to the bot as USDC in the same tx, so a lost attempt costs gas only. bot.py:362 sets the fee ceiling so maxFeePerGas x gasLimit < 0.90 USD at the pool oracle's HYPE price (never above 100 gwei; gas limit never above 1,900,000, bot.py:71), :367 requires simulated gross > that signed gas cap, and :372 sets the on-chain minProfit to the gas cap. Priority fee bid is at most 50% of the simulated gross (BID_SHARE, bot.py:72 and :363). No principal: the cover is a Morpho flash loan repaid in the tx; the bot wallet holds HYPE for gas only (10 USD)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7 d to 2026-11-17 (attempts row of run ab638f11, scratch/trial-hyperlend/competition.json): 112 LiquidationCall on the HyperLend pool by 20 liquidator contracts (0x5ac9bc14 24, 0x86885a82 20, 0xdd8692bc 17, 0x372f8541 11); 56 in scope (USDC debt with WHYPE, kHYPE or USDC collateral). Under water before the take: 35 one block earlier, 17 three blocks earlier, 9 sixty blocks earlier (those 9 are dust, 0.1-2 USD of debt). With debt over 50 USD: 23 / 7 / 0. The 7 burst takes that waited 3 blocks paid priority fees of 110-15,139 gwei on a 10-262 gwei base fee, about half their gross; at the trial cap of 1 USD per tx this bot can pay about 16 gwei, so it aims at dust and small positions in quiet times and at burst cases while the base fee is still low, and logs the rest as opportunity_skip. Archive simulations of the executor 3 blocks before the public taker: +38.41, +141.02, +147.33 and +1,925.14 USDC (selftest-result.json)."
executor: scratch/trial-hyperlend/contracts/out/TrialHyperLendLiquidator.sol/TrialHyperLendLiquidator.json
executor_args: "{bot}"
executor_note: "Owner-only liquidate(morpho, job, cover, minProfit). Flash lender, pool, borrower, collateral, debt token and the swap route (0-3 UniV3-style pools) are all call arguments; constructor takes the bot address only; no setup transaction. The flash callback accepts only the lender set for the running call and the swap callback only the pool being swapped on (both cleared afterwards). Approvals are exact and reset to zero (pool, Morpho). The bot always passes debt = USDC 0xb88339cb, so profit leaves as USDC. Deploy gas on the fork is under the 2,000,000 HyperEVM limit (proof-head-result.json deploy_gas). Live address from EXECUTOR_ADDR_HYPEREVM or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-hyperlend/proof_head.py (lease, reset hyperevm to head, deploy by creation tx, fund, a fork-made borrower supplies 100 WHYPE, borrows the maximum USDC and withdraws down to HF 1.00003, healthy guard, 12 h clock move puts HF at 0.99997, non-owner, NoProfit guard, success, nothing-left, release; output proof-head-result.json). Success 0x507ccc77a5947ed6b2cdee03bc5a3270c1f22a14935d3c09b2f7003b6bb27f67 fork block 51537029, gas 526700, owner +196.049242 USDC, borrower debt 4,403.83 -> 2,201.92 USD and HF 0.99997 -> 1.10377, executor USDC / WHYPE / native and pool / Morpho allowances all 0. Correct reverts: healthy borrower 0x136ffd59bae481b0b83730ebdca9420b1e9e8f2b4e5eb756a7dd187ee21a312c (0x930bb771 HealthFactorNotBelowThreshold, before the clock move); non-owner 0x9be48558a1da2e668ccbba8969e3f3ef0aaeba789783bacfe63010092ab2eb1d (NotOwner 0x30cd7471); NoProfit guard 0x1f222a81bccac161ad485cf8127aea9fa2822cbb575b6655a629f3babe825b27 (0xe39aafee, owner USDC delta 0); nothing left to take 0xc3604466f55a7bdf0c7793fad954f48fbf9a981c7d5fcbe9a4e5ff07b621d2b6 (second call after success, 0x930bb771, owner USDC delta 0). Past captures: scratch/trial-hyperlend/selftest.py (archive eth_call on the paper lane with the executor as a code override, selftest-result.json): 3 blocks before the public taker the same call gains 147.325794 USDC on borrower 0x959b954f (block 51273260, 25% cover; 103% and 50% revert MustNotLeaveDust 0xb629b0e4), 38.408925 on 0xdd91c296 (51274521), 141.023115 on 0x60d12ab4 (51274699) and 1,925.138728 on 0x62016b34 through the kHYPE route (51274517); 5 blocks after each capture it reverts 0x930bb771. scratch/trial-hyperlend/selftest_bot.py: bot calldata equals cast calldata for the three routes and the bot's bytes return 141.023115 USDC at block 51274699. scratch/trial-hyperlend/proof.py is the same fork proof at the past block 51273260; on 2026-11-17 it failed at the first read because the research lane had no Alchemy budget and the fork's public nodes returned inconsistent past state (getUserAccountData panics 0x11 on the fork only); it runs as-is once the lane has budget."
awaited_events: "HyperLend Pool 0x00a89d7a5a02160f20150ebea7a2b5e4879a1a8b LiquidationCall on the feed (112 in 7 d, about 16 per day, in bursts; last one at block 51510135 on 2026-11-17); every such event triggers 9 scans of the 200 nearest-to-1 health factors over 16 s. Safety scan of the near list about every 55 s, full universe hourly, new borrowers from Borrow/Withdraw logs every 10 min. Next occurrence is not predictable (HYPE price moves)."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is); opportunity_skip rows with gross_usd of tens of USD in a burst (the size a higher per-tx cap would reach)."
bad_signs: "No opportunity row in 7 days; every send lost by many blocks; simulate_revert on every underwater user (routes or dust rule); read_budget rows (75k CU cap hit); every burst case skipped for the gas cap and no dust win either."
rpc_reads_per_min: "about 1.5: one Multicall eth_call per ~55 s (near scan), 6 per hour (full scan of ~1,100 users in batches of 200), one eth_getLogs + eth_blockNumber per 10 min, 8 extra scans per feed batch, plus about 8-14 calls per detected opportunity"
alchemy_cu_per_day: "about 58,000 relay CU/day (near scan 1,570 x 26 = 40,800; full scan 144 x 26 = 3,700; discovery 144 x 70 = 10,100; burst rescans about 3,300) plus feed about 7,000 = about 65,000 CU/day = 0.034 USD/day at 0.53 USD per 1M CU. The code stops relay reads at 75,000 CU per UTC day."
legal_note: "Public Aave-style liquidation bonus for repaying unhealthy debt on HyperLend, open to any caller (the permissioned RedStone auctioneer wrapper is not used). Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions. Bidding a priority fee for a public reward is in scope of the trial decision."
expedite: false
