id: trial-ichi-vault3-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: the USDC-deposit ICHI vault 0xd7a533a6 on Nest (NEST + USDC in the Algebra NEST/USDC pool 0xdb544d63), deposit / withdraw pricing versus the route NEST -> kHYPE -> WHYPE -> USDC on other pools. When NEST is dearer along that route than on the vault's own pool, one tx flash-borrows USDC on Morpho Blue, deposits it into the vault, withdraws the shares at once (pro-rata NEST + USDC), sells the NEST for USDC along the route, repays and pays the USDC gain to the bot wallet, or reverts. The bot polls one eth_call of the executor's scan() (12 candidates: 6 sizes x 2 routes) every 27 s."
copied_from: "Flash recipients 0x7b9836a3fa0824572c2f7e69beb19c351d80548b (EOA 0x0b8d87ee4ee429a60e8f5738c3a2d7d6e8ad8471): tx 0x221ea9ae4ab7a666f131b4092c4aa2ab9b811202c6a008bf6040b8b9b2705a89 (block 51,807,099, tx index 0, +0.839429 USDC, 11.0 gwei; the fork proof's block); 0x30e81e4d8790fd5203072ebba81f8e5d85f513a3 (EOA 0x454c16ca9e6b817f4b6ff86292783c14db07a7e4): tx 0x61e9d6ac167dc4705c3080a70130a58c249d4b267305e4a5ec80ebd76c7b4ef3 (block 51,814,414, +0.220056 USDC, 809,760 gas, flash 1,426.50 USDC; traced with scratch/rce0e/trace.py); 0x79350c4b4f09650af22d4755c32727bd87878ea8 (EOA 0x867b39b6b4a90c8855fd8aa843af46534752de11): tx 0x3adee1924892c7760e73e320f1ff88c143cfb336e14e5553fd81a4120e32c0e9 (+1.071984 USDC). Same vault, lender and pools, same call order (Morpho flashLoan, vault.deposit, vault.withdraw, three pool swaps); changed: size chosen by simulation from fixed sizes, two kHYPE/WHYPE pools tried. Sibling of the farm's live trial-ichi-vault-hyperevm (vault 0xb792f94e) and trial-ichi-vault2-hyperevm (vaults 0x6bd209f2, 0x71b7da3a), which do not cover this vault."
capital_usd: 20
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor IchiVaultArb2.run requires profit > 0 and profit >= minProfit in the borrowed token (USDC) after the flash loan is repaid (scratch/trial-ichi-vault3-hyperevm/contracts/src/IchiVaultArb2.sol:75; a losing route already fails at Morpho's repayment pull) and a deadline (:72), so a lost attempt costs gas only. Gas cap per send in bot.py evaluate() (constants GAS_LIMIT_MAX to GAIN_OVER_CAP, bot.py:65-73): gas limit = eth_estimateGas x 1.25 (at most 1,900,000); maxFeePerGas = base fee x 1.3 + bid, never above fee_ceiling = 0.95 USD / (gas limit x HYPE price), HYPE valued at the WHYPE/USDT0 pool price x 1.15; no send unless the simulated USDC gain is at least 1.2 x that gas cap in USD (GAIN_OVER_CAP); minProfit is the gas cap in USD as USDC units + 1, so a mined success earns more USDC than its gas can cost. Priority-fee bid: at most 35 pct of simulated gross (BID_SHARE), never above the fee ceiling."
expected_value: "trial, win rate to be measured live; the class is small. Competition, 7.06 d, blocks 51,208,894-51,828,894 to 2026-11-21 04:44Z (scratch/trial-ichi-vault3-hyperevm/measure7-0xd7a533a6.json; gains are floors; fee USD in that file values HYPE at 64.8, the pool price was 56.2, so fees are about 13 pct lower): 217 same-transaction round trips = 30.7 a day, gain 33.08 USDC, median 0.033, max 1.454 USDC; 199 with gross above their own gas; 22 takes of 0.5 USDC or more sum 18.34 USDC, 13 at tx index 0, fee share of gross median 27 pct, gas price median 4.3 gwei (0.35 gwei over all takes). Takers: 0x30e81e4d 157 takes +17.79 USDC for 4.49 USD fees; 0x7b9836a3 16 takes +6.70 for 3.99 (8-11 gwei); 0x79350c4b 15 takes +5.04 for 1.50; at least 5 more contracts with 3-7 takes each. This bot's fee ceiling is about 12-14 gwei (0.95 USD cap at a 1.15-1.3M gas limit) but it bids at most 35 pct of gross, about 3-5 gwei on a 0.8 USDC gap, so it loses the largest gaps to the 8-11 gwei bidder and aims at mid-size gaps (0.2-0.8 USDC) and pieces left after a first taker: about 1-3 sends a day expected, share unknown, a few USD a week at best. One lost attempt: about 1.06M gas = 0.006-0.3 USD at 0.1-5 gwei."
executor: scratch/trial-ichi-vault3-hyperevm/contracts/out/IchiVaultArb2.sol/IchiVaultArb2.json
executor_args: "{bot}"
executor_note: "Deploy gas 1,316,598 on the fork, below the 2,000,000 HyperEVM cap. Same source as the executor of the live trial-ichi-vault2-hyperevm (IchiVaultArb2.sol, copied unchanged into this bot's own scratch and rebuilt). constructor(address bot) only (owner is immutable); Morpho, token, size, vault, sell hops, limits and the unwrap flag are Params call arguments. This bot always calls with token = USDC and unwrap = false, so the gain is paid to the owner as USDC by a plain transfer. The Morpho callback and the swap callbacks (uniswapV3SwapCallback, algebraSwapCallback, pancakeV3SwapCallback) accept only the counterparty set for this step of this transaction; it is cleared at the end. Approvals are for the exact amount (vault: reset to zero after the deposit; Morpho: used up by its repayment pull; both read 0 after the fork success). scan() is an owner-only eth_call helper that rolls every candidate back (probe() always reverts with the result). Nothing stays in the executor after the fork success."
fork_evidence: "scratch/trial-ichi-vault3-hyperevm/proof.py -> proof.json (one script: forge build, lease, reset, deploy, scan, guards, success, repeat, release; no fixture and no setCode; owner 0x1111111111111111111111111111111111111111; executor 0x8f7a45ebde059392e46a46dcc14ab24681a961ea). Reset 51,807,098 = parent of incumbent tx 0x221ea9ae4ab7a666f131b4092c4aa2ab9b811202c6a008bf6040b8b9b2705a89 (block 51,807,099, index 0, +0.839429 USDC). Deploy 0x2160f0b4a3b5b7d3595639ac48f38082d704ab082fff974fc61f78043db7e7c3 (1,316,598 gas). scan() before: route A 100 / 300 / 700 / 1,400 / 3,000 USDC = 0.122801 / 0.335898 / 0.645798 / 0.838343 / 0.036506 USDC, route B 0.123269 / 0.337288 / 0.648969 / 0.844438 / 0.048455, 6,000+ = 0. SUCCESS 0xfaa9ee857d6ae1cf0bdeef6023e3f8ed50e35f2166584c6dc792b95ccb3aea92 (fork block 51,807,102, 921,888 gas, 1,400 USDC flash, route B, minProfit 0.422219 USDC): owner USDC +0.844438 (the incumbent took 0.839429), executor holds 0 USDC / WHYPE / NEST / kHYPE / shares, allowances 0. Reverts: non-owner 0x1971e97c90902d6012c9105b8b1529221395b93516ecab64752bbec1a4dba8a8 (30,150 gas), minProfit 1,000,000 USDC 0xfa5f1b6b41c22e4e881f458444857163ac3d3a8a4a01940fe19c4961e3edfaaf (1,122,822 gas), nothing left 0x2aad4a3f79eeb3c05efd056f5a4dfe3e4d7621973aa21f647dfb4cc4fa80b889 (1,062,740 gas; scan after = 0 on every size, owner USDC delta 0). selftest.py (selftest-result.json, 2026-11-21 04:46Z): selectors equal cast sig, the bot's hand encoder equals cast's bytes for run() on both routes and for scan(), the paper runtime equals the artifact runtime with the owner filled in (5 x 20 bytes differ, all 0x11); through the relay with the code override scan() answered for all 12 candidates (all 0: no gap open), run() with minProfit 1 runs to Morpho's repayment pull ('transferFrom reverted' = the route ran and lost), evaluate() on a fake gain ends in simulate_revert at the exact-bytes check. Paper runtime = eth_getCode of the fork deployment (runtime.hex)."
awaited_events: "No single event: a gap opens when swaps move the NEST/kHYPE pool 0x23d95b24 (or the kHYPE and WHYPE pools behind it) away from the vault's own pool 0xdb544d63. The bot polls scan() every 27 s and acts when the best candidate's gain exceeds 1.2 x its gas cap. Last taken by others: 30.7 round trips a day over 7 days; last take of 0.5 USDC or more at block 51,807,254 (2026-11-20 about 22:50Z), smaller ones at block 51,814,414 and later. The next one is expected within hours."
good_signs: "logs/bot.jsonl: a poll heartbeat every 18 min; opportunity_skip or opportunity + paper_sim rows a few times a day; live: send_result rows with result won and gas_used about 800k-930k."
bad_signs: "loop_error on every poll (the vault or a pool changed, or the node stopped accepting the code override); read_budget before 23:00Z; no opportunity or opportunity_skip row for 2 days while others still round-trip the vault (the bot's sizes or routes no longer fit); live send_result lost on every send with blocks_after_winner >= 0 (always late: report as blocks late)."
rpc_reads_per_min: "2.2 (one eth_call per 27 s) plus about 4 reads per evaluated gap"
alchemy_cu_per_day: "about 84,000-98,000 (0.045-0.052 USD): 3,200 scan polls x 26 CU = 83,200, plus 88 CU per evaluated gap; hard cap 98,000 relay CU/day in code, then it sleeps to 00:00 UTC. No feed filter."
legal_note: "Same class as trial-ichi-vault-hyperevm, allowed by the human decision decisions/human/2026-11-21-ichi-yes-peapods-fee-no.md section 1: arbitrage between the vault's public deposit / withdraw pricing and the pool price, not an attack on the vault's accounting. deposit and withdraw are the vault's public functions, the pools and Morpho's flash loan are public. The bot reads mined state only, watches no mempool and no pending transactions; it may bid a priority fee for a public opportunity. It never swaps on the vault's own pool 0xdb544d63, so it does not move the price the vault reads."
