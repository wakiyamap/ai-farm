max_loss_per_tx_usd: 1
max_loss_guarantee: "StepArb.sol:117 reverts NoProfit unless the WPOL balance grew by at least minProfit after the flash loan was repaid; take() is owner-only (StepArb.sol:66) and the flash callback accepts only the lender set for this call (StepArb.sol:133); the gain is unwrapped and paid to the bot wallet as native POL in the same transaction. So a lost attempt costs only gas. bot.py:326-335: cap = gasLimit x maxFeePerGas (gas limit = eth_estimateGas x 1.2, refused above 4.5M; maxFeePerGas = base fee x 1.25 + 30 gwei tip, refused above 1,500 gwei), the send is skipped unless cap is under 0.95 USD at a conservative 0.15 USD per POL and unless the simulated gross is above cap, and minProfit = cap (bot.py:273), re-simulated at the signed gas limit before the send. Typical cap 1.2-1.4 POL (0.10-0.12 USD at the measured 0.083 USD per POL). Priority fee: the fixed 30 gwei Polygon minimum, about 0.1 POL per send, 1-5 pct of a typical 2-10 POL gross; the bot never raises it."
expected_value: "Trial: win rate measured by sending, no counted EV. Competition, last 5.2 days (blocks 97,296,091-97,598,491, scratch/r8bc8/takes.json, every DebtIssuanceModuleV2 log for this SetToken): 108 atomic takes (issue-and-sell or buy-and-redeem) by 8 senders: 0x7c4106a7 69 (508.8 WPOL kept, 7.4 per take), 0xc3afb378 14 (via 0x91a7fbae, some at tx index 0 with 4-5 POL gas), 0x7d6d03bc 11 (since 11-18), 0xde0a99fb 6, 0x3de7e4a0 3, 0x9cacc286 3, 0xd035d5b7 1, 0xbb89e8af 1 (37 POL gas at index 0). Typical gain 2-10 WPOL (0.17-0.83 USD at 0.083 USD per POL) against 0.67-0.95 POL gas; tx index median 64, zero priority fee above the minimum for the two main operators; takes come in runs 12-20 s apart. Windows (scratch/trial-fli-arb-polygon/series.py, the bot's own take() at blocks before 18 takes, 900 WPOL): the gain above 1 WPOL stood at least 3 blocks in 15 of 18, at least 10 blocks (15 s) in 10, at least 100 blocks in 4; median 10 blocks. The bot probes every 30 s and aims at the takes that stand 30 s or longer, roughly a third: about 5-7 takes a day at 2-5 WPOL net each."
executor: scratch/trial-fli-arb-polygon/contracts/out/StepArb.sol/StepArb.json
executor_args: "{bot}"
executor_note: "Constructor takes only the bot owner. take(lender, token, amount, steps, clear, minProfit, unwrap): the flash lender (Morpho Blue), the flash token (WPOL) and every step (target, token spent, spender, calldata) are call arguments; nothing is baked in and there is no setup tx. A step spends the executor's whole balance of its token (or a fixed amount), approves exactly that amount and resets the approval to 0; step kind 1 issues as many SetTokens as the components held allow (module and SetToken are arguments). The executor is a generic step runner, which is safe because take() is owner-only and the executor holds nothing between transactions: the worst a bad route can do is revert. probe(bytes[]) is for eth_call only: owner-only, it tries each take() calldata through trial(), which always reverts (Trial(gain)), so nothing changes even if it were sent. The Morpho callback checks msg.sender against the lender set for this call and cleared after it. After the profit check every token named in clear is sent to the owner (dust; zero in both fork runs). Live code reads EXECUTOR_ADDR_POLYGON or EXECUTOR_ADDR; paper mode uses an eth_call code override (executor-runtime.hex = eth_getCode of the fork deployment, owner 0xc0ffee...0301)."
fork_evidence: "scratch/trial-fli-arb-polygon/proof.py <parent block> (one Polygon fork lease per run: reset, deploy the artifact with --args, fund, probe, non-owner, guard, success, repeat, leftovers; calldata built by bot.py itself). Run 1, reset 97,574,995 = parent of incumbent issue take 0x631495d2 (proof-result-97574995.json): probe from the owner 4.295 / 5.499 / 0 WPOL at 500 / 1,000 / 2,000 WPOL for issue_crv, 0 for the other routes; from a stranger it reverts. Non-owner take revert NotOwner 0xf0fb30a19448c3314e807ab26c206b97465086b31dcecddc34144400c68e1472. Guard revert NoProfit(5.499e18, 1e24) 0xba279a3295f00112cd63d3f76747b407fb498b7d5cbff2c6d438a1609ded35f0, 2,443,334 gas, owner -1.466 POL at the script's 600 gwei. Success 0x30796980531c98d0e9ae59fb77808ff5c4a34f7c933a54500e54d0d540b8dea7 block 97,574,999, 1,983,948 gas, owner native +4.309 POL net of gas (gross 5.499 POL; the incumbent kept 5.312 WPOL on the same case). Repeat reverts (0x5a4f9c5b3bf0fdd57e9db62999bc6186eb19cb70d14c624c20297132085722c9, nothing left), probe after = 0 everywhere, executor balances 0 in native and all nine tokens. Run 2, reset 97,483,391 = parent of incumbent redeem take 0x18cbd782 (proof-result-97483391.json): redeem_mai 5.726 / 9.607 / 11.879 WPOL at 500 / 1,000 / 2,000; guard 0x1364e5024254a8d59c9be81d23d86c9eb7ce2c2c738dbe3d1ea642ae3f76a8ba; success 0x88736ab7bd9bb828624c62d0e1782921ef301dcedd4a82fa344af53f4f141a47 block 97,483,395, 1,720,059 gas, owner +10.847 POL net (gross 11.879; the incumbent kept 10.101); executor balances 0. The paper bot's own check() pinned to those parents through the relay logs paper_sim success, and a skip (gross 0.75 below cap 1.37 POL) at 97,573,000: scratch/trial-fli-arb-polygon/selftest.py."
awaited_events: "No event: the gap opens when CRV, POL, ETH or MAI prices move against the SushiSwap FLI/WETH pair and the Curve aToken pools. Timer: one probe eth_call every 30 s. Last takes by others 2026-11-19 15:33, 15:36 and 15:39 UTC; about 21 a day over the last 5.2 days, 40 in 6 h on 11-14."
good_signs: "opportunity and paper_sim success rows a few times a day with gross 2-10 WPOL above cap 1.2-1.4 POL; live send_result won with net_wei positive."
bad_signs: "No opportunity row in three days (the SushiSwap pair drained or the SetToken retired); every live send lost with winner_block within 1-2 blocks (a faster operator arrived); simulate_revert rows on every opportunity; read_budget rows."
rpc_reads_per_min: "2 (one probe eth_call per 30 s covering 4 routes x 3 sizes); on an opportunity 3 more reads (block, estimate, guard simulation)."
alchemy_cu_per_day: "2,880 probes x 26 CU = 74,880 CU/day, plus about 70 CU per opportunity (20 a day = 1,400): about 76,000 CU/day = 0.04 USD/day at 0.53 USD per million CU. Code cap 95,000 CU/day. No feed CU."
legal_note: "Public issuance and redemption of an index token at its NAV (DebtIssuanceModuleV2 issue / redeem, open to anyone) against public AMM pools: plain arbitrage. No pending-transaction watching; the bot reacts to confirmed state on a timer."
expedite: false
