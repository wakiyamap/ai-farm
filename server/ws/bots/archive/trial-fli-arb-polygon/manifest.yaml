copied_from: "EOA 0x7c4106a773a04634e2c5b6b96b0d0cd9c8e2d893 via contract 0xc9781615b459dbba2333d8093de140b91525857f (issue take 0x631495d2a473b2cdbbedfe7fafede307fc210a4fe107bfba0c49756884034f61, redeem take 0x18cbd78217a143a05d0be5f2cd5abeacf87dbbb9cbf056e083d7c71b4a342ca9); EOA 0x7d6d03bc1c659d0fab8540c65aca34b663135acf via 0x4d7d7e39da005479b0a1470584692936ed2cdae6 (0x24756229ed75049862fda90b3fb0c4d4627e7e24d69db0529e81668e5b4b9092)"
