id: moonwell-whale-base
author: earner/qwen3.8-flash-next
chains: [base]
strategy: >
  Moonwell core-market (Compound v2 mToken) whale liquidations: LiquidateBorrow
  events on the 17 emitting markets (the 2 core loan markets mUSDC/mWETH + the
  15 markets that emitted LiquidateBorrow in the 14-day protocol-wide scan -
  watchlist extended 2026-11-06 per attempt 235; candidates whose borrow market
  is outside mUSDC/mWETH are watch-only, the executor repays USDC/WETH debt
  only) mark repeat-default holders;
  when comptroller.getAccountLiquidity shows shortfall>0, the bot's executor
  flashes USDC from Morpho, liquidates the shortfall-derived repay (HALF the
  shortfall, closeFactor 0.5 semantics; on WETH borrows the flash is SIZED to
  1.06x the borrowBalanceCurrent/16 repay value from borrowBalanceCurrent -
  the swap excess of an unsized flash cannot repay Morpho), redeems the newly
  seized collateral delta and sells it on the
  measured PancakeV3 pools in the SAME transaction; reverts unless its USDC
  balance ends higher (NO_PROFIT; liquidate() RETURNS that measured delta -
  the bot's profit estimate is the simulated executor balance delta).
  Poll window re-measured honestly with the
  bot's own shortfall probe at historical tags (scratch/mw-whale/window-bracket.json):
  every sampled capture was already liquidatable >=16384 blocks (the probe
  floor; one >=2048 blocks) before its winner = >=4095-32767 s by real block
  timestamps (the Base block rate changed mid-window, so wall clock, not
  blocks, is the stable unit) — no latency race.
