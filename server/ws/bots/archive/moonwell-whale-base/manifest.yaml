max_loss_guarantee: >
  The executor reverts unless its USDC balance ends >= start + minProfit + 1
  (MoonwellWhale.sol liquidate(): require(balAfter >= balBefore + minProfit + 1,
  "NO_PROFIT"), fork guard tx 0xa10ed3fb... reverted NO_PROFIT with zero USDC
  delta), so the pool can never take more than the executor measured and the
  flash loan pulls back exactly the flashed amount (0 premium): worst case is
  gas only. On Base the enforceable worst case is the bot's native gas wallet:
  the gate funds it at most gas_wallet_cap_usd = 18 USD and the signer refuses
  while above; MAX_GAS_LIMIT 2,200,000 x MAX_FEE_CAP_WEI 2 gwei bounds the L2
  signed cap too: 0.0044 ETH ~ 9.8 USD at the measured ETH/USD 2233 - fits
  the 18 USD wallet's EIP-1559 upfront check (balance >= gasLimit x
  maxFeePerGas) with 385x headroom over the measured Base baseFee 0.0052
  gwei (feeHistory 8-block, relay, 2026-11-06). The old constant
  25,000,000 wei was 0.025 gwei despite the 25 gwei comment; 25 gwei x
  2.2M gas = 0.055 ETH exceeds the 18 USD wallet outright.
