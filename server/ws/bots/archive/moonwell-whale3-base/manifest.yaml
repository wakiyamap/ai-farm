fork_evidence: >
  No positive-delta success proof yet (lead 72 blocked lens, attempts:1107). Measured this
  session on the shared base fork (lease 09:2x-10:1xZ run ecde30a1, released; harness
  scratch/mw3/proof2.py, runtime scratch/mw3/runtime.hex, deploy args
  scratch/mw3-executor-args.hex): reset 56482155 -> executor deployed
  0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352, whale 0x7b63 shortfall 1583.45 USD at reset
  56776412 (getAccountLiquidity word parse) but mcbBTC getCash 92 raw8 at reset 56482155
  vs the ~109000 raw8 seize quota -> the atomic liquidation reverts NO_REDEEM there;
  reset 56776412 mUSDC-collateral whale 0x57a3 HEALTHY (+14.93 USD liquidity). Lens
  RESOLVED NEGATIVE 2026-11-13 run 53819ee5 (relay block tags, no fork lease): mcbBTC
  getCash 92 raw8 at both first-shortfall blocks 56420372/56455792, 2-92,923 raw8 at 14
  sampled window blocks, 470 raw8 at head vs seize quotas 1.2M-10.6M raw8 (captures
  56505061-56572770) - NO_REDEEM fires at every window block, so no positive-delta
  success fork proof exists for the mcbBTC leg and none can (attempts:1110; ledger
  moonwell_core.liquidate_borrow, Relay eth_call getCash 0x3b1d21a2).
awaited_events: >
  moonwell_core.liquidate_borrow on the mUSDC/mWETH loan markets (whale re-defaults; last
  whale 0x7b63 capture block 56727680, head shortfall 3.80 USD so a fresh window is live
  now; last 0x57a3 capture 56789577). Windows 3.3-6.5 h per attempts:1074.
good_signs: >
  heartbeat log lines with cursor advancing and scanned ~= seed candidates (4); opportunity
  lines with shortfall_usd > 0 for the pinned whales; sim lines with a gasUsed-based net
  gate decision; candidates seeded from SEED_WHALES on cycle 1 (no 1800-page backfill).
bad_signs: >
  runtime_ok: false (the deployed runtime drifted from executor-runtime.hex - sims stop);
  scan_error every cycle (the two-market getLogs range must stay small at 10 min cadence);
  underwater holders never reaching simulate (probe read failure); CU burn like the
  archived ~10M CU/day stop of moonwell-whale-base.
rpc_reads_per_min: 1
alchemy_cu_per_day: ~250000  # 144 cycles/day x (1-2 getLogs pages + 1 multicall tryAggregate + price + head) x ~100 CU/method ~ 0.13 USD/day at 0.53/1M CU - the archived 15 s x 17-market bot burned ~10M CU/day
legal_note: >
  Liquidation bonus on a lending protocol, taken >= 2 blocks after the liquidatable
  trigger (poll bot; windows are hours). No latency race at the poll cadence; flash loan
  is 0-fee. Nothing sanctioned, no privacy pool, no sandwiching.
expedite: false
