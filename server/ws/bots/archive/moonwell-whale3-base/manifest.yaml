id: moonwell-whale3-base
author: earner/qwen3.8-flash-next
chains: [base]
strategy: >
  Moonwell (Base) covered-combo liquidation, lean 10-min poll: watch the repeat-default
  whale borrowers (mUSDC borrow + mcbBTC/mUSDC/mWETH collateral) with getAccountLiquidity
  via one Multicall3 tryAggregate per cycle; on shortfall, flash-loan 300 USDC from Morpho
  (0 fee), liquidateBorrow, redeem seized collateral, swap to USDC on PancakeV3, revert
  unless the executor ends with more USDC than it started (NO_PROFIT guard).
copied_from: >
  bots/archive/moonwell-whale-base (its executor MoonwellWhale.sol + incumbent captures
  ledger moonwell_core.liquidate_borrow: whale 0x7b6300131a4f4002545ff420ba5100d4a8779223
  captures 56505061-56727680, repay 16.5-140.8 USDC, windows 3.3-6.5 h per attempts:1074).
capital_usd: 120
principal_usdc: 0
allowed_contracts: []
max_loss_per_tx_usd: 18
max_loss_guarantee: >
  One tx through the executor (MoonwellWhale.sol): repay+seize+redeem+swap are atomic and
  the contract reverts unless balAfter >= balBefore + minProfit + 1 (USDC 6-dec balance
  comparison, scratch/moonwell-whale3-base/contracts/src/MoonwellWhale.sol NO_PROFIT guard);
  worst case is gas: MAX_GAS_LIMIT 2,200,000 x MAX_FEE_CAP_WEI 2 gwei = 0.0044 ETH at
  signing time, well under 18 USD at any plausible ETH price.
expected_value: >
  Whale 0x7b63: 5 captures in 17 h windows over ~1.5 days (blocks 56505061-56727680),
  repay 16.5-140.8 USDC, gross ~10% bonus ~39 USD/30d (attempts:1074/1107); mUSDC-collateral
  whale 0x57a3e737: 5 captures 56758447-56789577, repay 18-2226 USDC (2851.8 USDC sum,
  short-window candidate - not counted in EV until a >=2-block window is measured). Base
  gas cents. MEASURED DEAD lens 2026-11-13 run 53819ee5 (attempts:1110): mcbBTC market cash
  measured 2-92,923 raw8 at every sampled block of the five measured windows (92 raw8 at
  both first-shortfall blocks 56420372/56455792) and 470 raw8 at head, >=10x below the
  whale seize quotas 1.2M-10.6M raw8 - no send can succeed on the mcbBTC leg, the paper
  sim logs NO_REDEEM reverts; the ~repay/11 whale gross is locked in held mToken by the
  cash cap (incumbent Redeem cap 40,188 raw8 ~ 0.56 USD per capture), not paid in cash.
