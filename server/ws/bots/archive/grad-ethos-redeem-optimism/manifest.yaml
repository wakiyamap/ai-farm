id: grad-ethos-redeem-optimism
author: builder/claude-mythos-5-2
chains: [optimism]
strategy: "grad of trial-ethos-redeem-optimism: buy ERN below par on the Velodrome ERN/USDC pool with a flash loan, redeem it at par for WETH on Ethos Reserve, sell the WETH, keep the USDC difference, all in one executor call; larger flash sizes when they pay and follow-up takes after a win"
copied_from: "Our live trial trial-ethos-redeem-optimism (executor 0x21bf6eeff15497616cc776e0cb18fe7cc584a1bc, 46 won of 58 sends from 2026-11-19 18:20Z to 2026-11-24 03:39Z), itself copied from OP Mainnet EOA 0x6ce08b79f97a96cd843035b3d909f1b0853ee5fc (router 0x9873df52c288673ffbed7d45a39e2c6622798e30; 13 takes in the trial window, e.g. 0x0b6984550c... in block 159938191) and 0x67f51077ed4923ece0c1d461afbe19146ae03870"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "EthosRedeemTake.sol take() (line 77-94) is owner-only and reverts NoProfit (line 89-91) unless the executor's USDC balance grew by minProfit inside the same transaction (flash loan repaid in it); the gain is transferred to the bot wallet as USDC. bot.py check() (line 271-341): gas limit = eth_estimateGas x 1.25 (max 2,000,000), maxFeePerGas = 2 x latest base fee + tip (refused above 0.1 gwei, line 310), signed cap = gasLimit x maxFee + 1e11 wei L1 allowance, refused at 0.90 USD or more (line 65, 310); it sends only when the simulated gross exceeds that cap (line 313), with minProfit = cap + 1 micro-USDC (line 306), after simulating the exact guarded call at the signed gas limit. Typical cap 0.004 USD. Fee: unchanged from the trial (OP Stack, no fee increase): at most 2,000,000 wei per gas and never more than 15% of the simulated gross (TIP_WEI, BID_SHARE, line 69-70, 302); README section 2 has the winners' fee share of the USDC received (rival median 1.6%, ours median 9.8%). Native funding 5 USD, below the 18 USD OP Stack cap; no principal (Balancer V2 flash loan, 0 fee, sizes 5-400 USDC)."
expected_value: "Trial realized record from receipts (README section 1; scratch/grad-ethos-redeem-optimism/realized.json): 58 sends, 46 won, 2.298649 USDC received by the wallet (the log's pre-send simulation said 3.05 and is not used), gas 0.0502 USD, realized net +2.248 USD in 106.0 h (0.51 USD/day; gate basis +2.25). 89% of it is one take (2.043943 USDC received, block 159938192, 2026-11-23 23:06:01Z, 40 USDC = the trial's size ceiling), made 2 s after the farm's earliest block for that event, so not counted. Counted: the other 45 wins, 0.254706 USDC, minus all 58 sends' gas = +0.2045 USD = 0.046 USD/day, against 0.021 USD/day of reads (39.5k CU/day, cost.json): about +0.025 USD/day. Conditional, separate: on the fork at the state of the big win 120 USDC takes 3.438 against 2.044 at 40 (+1.39 USDC per deep-discount event, tried not counted; one event in 106 h), and after such a 120 USDC take three 5 USDC follow-ups are worth 0.036003 USDC in total (fork only, reviewer replay review-followup-dc5b.py; 0.008 USD/day)."
executor: scratch/trial-ethos-redeem-optimism/contracts/out/EthosRedeemTake.sol/EthosRedeemTake.json
executor_args: "{bot}"
executor_note: "Unchanged bytecode: the trial's artifact (live as 0x21bf6eeff15497616cc776e0cb18fe7cc584a1bc; never clean scratch/trial-ethos-redeem-optimism). Constructor takes the bot owner only. take(Route,minProfit): every target (flash vault, USDC, buy pool, ERN, TroveManager, price feed, collateral, trove, sell router, fee tier) is a call argument. receiveFlashLoan accepts only the vault set for the duration of take() and cleared after it. Approvals are for the exact amount and reset to 0 in the transaction. The partial-redemption NICR hint is computed on-chain from getEntireDebtAndColl and fetchPrice. Live code reads EXECUTOR_ADDR_OPTIMISM or EXECUTOR_ADDR only; paper mode uses an eth_call code override (executor-runtime.hex = eth_getCode of the fork deployment, byte-identical to the trial's; no source change in the 2026-11-24 revision)."
fork_evidence: "scratch/grad-ethos-redeem-optimism/size.py -> size-result.json (one optimism fork lease; reset to 159,938,191, the parent of the trial's 40 USDC win; deploy the artifact with --args; fund; then four more parent blocks, sweep only). Fork receipts are in blocks 159,938,193-159,938,196 on top of that parent state. Takes, each from the same snapshot, owner USDC delta: 40 USDC 0x23759e5a11a5d98f3806d34f65bc079afd0b90dc12419d5323f451e6a8935782 +2,043,943 micro-USDC (equal to what the trial's wallet received in the real block 159,938,192); 80 USDC (2x) 0xa38e1b17055d5b5fc7d346abffe26297d31f0bdfbdbda91cfee01f0f76ceee6f +3,160,746; 200 USDC (5x) 0x097b7ee88bb96613f1b3351fa330ca3b6ed7002d5d95bf587c19016062347673 +1,783,846; 120 USDC (best) 0x7763db302cf6d740e02bf14a3b1d54f8fae09f3f1812e37f9ebd07a4272e4b61 +3,438,282, 809,761 gas, executor left with 0 USDC / ERN / WETH. Guard revert NoProfit(3438282, 1e13) 0x5de573f05362542977e12b5b0918fb1181db3ffb2baadd83bda00b2570ce33a5, owner USDC delta 0. Non-owner revert NotOwner 0xe03531b5beac9b675a3962e489eb2af9d2f09e9ba5d083ec93b3176e9d680a09. Nothing left at that size: the same 120 USDC call repeated right after the take reverts, 0x9747dc29426c10c06610e5b367ac76551bd3f1c7ad6481d643c891bfa30b567a, owner USDC delta 0 (a 5 USDC follow-up still simulates +22,057). Other parents: 159,902,622 best 30-40 USDC 0.085-0.088; 159,830,992 best 20 USDC 0.048; 159,822,219 and 159,800,946 best 10 USDC; 80 USDC and above revert there. Reproduced by the reviewer (review-size-dc5b4d5c.json). After the 2026-11-24 bot.py changes (no executor change): the bot's own check_loop() through the relay (selftest.py, 03:44Z): 159,938,191 -> 120 USDC, gross 3,438,282, paper_sim success; 159,902,622 -> 30 USDC; 159,938,400 -> nothing_to_take. Feed recovery: feedtest.py -> feedtest-result.json PASS (no fork needed). The trial's original proof (proof.py, success 0x9a5fcdae... and reverts) still applies to the same bytecode."
awaited_events: "Sync(uint256,uint256) on the Velodrome ERN/USDC pool 0x605cce502dee6bd201b493782e351e645d44abbb through the feed (397 a day on average, 1,743 in the trial's 105.4 h) plus a 600 s safety poll through the relay, since the redemption fee decays and the WETH price moves without a pool event. The trial's last win: 2026-11-24 02:55:59Z (block 159,945,091); 46 wins in 106 h (14 of them on 11-24 00:00-03:39Z), so the next small one is expected within hours; a deep-discount event like 2026-11-23 23:05:55Z happened once in 106 h."
good_signs: "opportunity rows whose sweep reaches the extra sizes with a growing gain; paper_sim success; live send_result won with realized_usdc > 0 and close to sim_gross_usdc; after_win checks that find and take more."
bad_signs: "Only nothing_to_take checks for several days (ERN back at par or the redemption fee above the discount), several lost sends in a row after a win (the follow-up reads a stale head), realized_usdc far below sim_gross_usdc on most wins, feed_error rows in a row, or read_budget rows. In paper while the trial is live: estimate_revert / simulate_revert right after the trial's send are the trial taking the same opportunity."
rpc_reads_per_min: "About 0.5 on average: on a pool Sync (at most one check per 10 s; 248 checks a day in the trial) and every 600 s without a check, two eth_call (getLast, 5 USDC probe); an opportunity (20 a day) adds one or more eth_call sizes (only while the gain grows), one fetchPrice eth_call, one eth_getBlockByNumber, one eth_estimateGas and one final eth_call; a live send adds receipt polls, one eth_getLogs and a few eth_blockNumber. A feed gap or error adds one check at once."
alchemy_cu_per_day: "39.5k measured-model total (scratch/grad-ethos-redeem-optimism/cost.json, 2026-11-24 03:45Z) = 0.021 USD/day at 0.53 USD per million CU: relay 25.4k (248 Sync checks x 52 CU + at most 144 safety polls x 52 + 19.8 opportunities x 118 + 13 sends x 207) + feed 14.1k (3.5 CU/min + 22.9 CU per Sync x 397 Sync/day, measured from /health cu_today 5,043 against 186 Sync logs). At a 3x event rate (the night of 11-24) 93k = 0.049 USD/day. Code cap 60,000 relay CU/day. One /logs filter (pool Sync), shared with the trial while both run."
legal_note: "redeemCollateral is the protocol's public par redemption, open to any ERN holder; the pool purchase and the WETH sale are ordinary swaps that move ERN toward par. The bot reads confirmed state only, watches no pending transactions and moves no price beyond its own 5-400 USDC trade."
