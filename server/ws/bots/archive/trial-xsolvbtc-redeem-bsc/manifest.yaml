id: trial-xsolvbtc-redeem-bsc
author: builder/claude-mythos-5-2
chains: [bsc]
strategy: "trial: buy xSolvBTC on the PancakeSwap V3 xSolvBTC / SolvBTC pool 0x5a5ca751 when it trades below what Solv's public XSolvBTCPool 0xf5086053 pays for it (withdraw, share value less 0.05 pct, paid in the same call), funded by a flash swap on that pool, repaid from the withdrawal, the rest sold to BTCB and WBNB and paid to the wallet in BNB, all in one transaction"
copied_from: "executor 0x3ee0a37fc6f3857acb155449b632e6776712caea (12 takes in 7 days, e.g. 0x52f238202d17609bb6fd828047a9c77671aa4213c1846d92d891a8c6e045ce3a, block 134820261, and 0x2cd7b02da34caa2bec20698189d2aa59f32d2eafeb6c6e444d98d144c5932c51, block 135137431). Adapted, it borrows BTCB from Lista Moolah, buys SolvBTC with it, takes fixed 0.0016 BTC lots and tips a block builder; this bot flash-swaps on the xSolvBTC pool itself, sizes the take from a grid and bids gas price only"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "Executor run() reverts NoProfit unless the BNB left after repaying the flash swap and selling the SolvBTC gain is at least minProfit (contracts/src/ShareRedeemArb.sol run(), the NoProfit line), and the bot sets minProfit = gasLimit x gas price of that send (bot.py check(), cap, gain_of(amount, cap, gas_limit)); the executor never receives funds from the bot wallet, so a lost send costs only gas, capped under 0.95 USD at a BNB price of 1500 USD (bot.py MAX_TX_USD, BNB_REF_USD, GAS_PRICE_MAX_WEI 0.6 gwei, GAS_LIMIT_MAX 1500000; a lost send at the 0.05 gwei floor costs about 0.00003 BNB = 0.02 USD). Trial, it bids at most 1/3 of gross as gas price, never above 0.6 gwei (TIP_SHARE_DEN, GAS_PRICE_MAX_WEI)."
expected_value: "Trial, no counted EV. Last 7 days at the entry (every Withdraw log of XSolvBTCPool in bsc blocks 133,803,033-135,147,033, scratch/ref08/evscan.py, and every Swap of the pool, scratch/trial-xsolvbtc-redeem-bsc/poolstats.py), 17 withdrawals, 12 of them atomic buy-and-withdraw takes, all by one executor 0x3ee0a37f, sender net 0.00436 BNB (2.4 USD at 556 USD per BNB) after a builder tip of about 18 pct. Two episodes, a 0.009787 xSolvBTC sell at block 134,820,249 (2026-11-21T04:06:13Z, first take 12 blocks = 5.4 s later, 11 takes over 140 s) and a 0.00198 xSolvBTC sell at block 135,137,424 (2026-11-22T19:46Z, one take 7 blocks = 3.2 s later). On the fork at the parent of the incumbent's first take this executor was paid 0.007789 BNB (4.33 USD) in one transaction where the incumbent's first lot kept 0.0013 BNB; the bot's own probe at later blocks of that episode (series.py) still shows 0.0033 BNB 9 s after the incumbent's first take and 0.0022 BNB 68 s after it. A gain of 0.00022-0.00038 BNB (0.12-0.21 USD, gas 0.00003 BNB) has stood at every one of 17 sampled blocks of the last 7 days and stands at head 135,147,763 (0.0002995 BNB), below the incumbent's line. The bot aims at that standing gain once and then at each new seller episode (about 2 a week, 0.5-4 USD each); the trial measures whether it reaches them before or after the incumbent's first lot."
executor: scratch/trial-xsolvbtc-redeem-bsc/contracts/out/ShareRedeemArb.sol/ShareRedeemArb.json
executor_args: "{bot}"
executor_note: "ShareRedeemArb, constructor (owner) only. The redeemer, share token, paid token, flash pool, two exit pools, middle token, wrapped native, the size and minProfit are call arguments. Callbacks pancakeV3SwapCallback / uniswapV3SwapCallback check msg.sender against the pool set for the swap in progress (cleared at the end of every run). No approval is needed or given (the redeemer burns the caller's shares directly). Profit is paid to the bot wallet as BNB. probe() and sim() are eth_call helpers (owner only / self only, every sim reverts). Runtime 3,948 bytes."
fork_evidence: "scratch/trial-xsolvbtc-redeem-bsc/proof.py (one script, one lease; result proof-result.json). Reset bsc 134820260 = parent of the incumbent take in block 134820261, deploy, fund, getters, probe, guards, success, repeat. Success 0xbf34c74ada97b4728a3bd70c097f5a315bfab3c94e36f94a25b9d46e21383f59 (fork block 134820264, 653,642 gas, 0.012244 SolvBTC flash swap, 0.012322 xSolvBTC withdrawn), owner native +7,723,616,812,920,661 wei after gas at 0.1 gwei, paid 0.007788981 BNB (the eth_call just before said the same). Correct reverts, guard 0xe0fcea06e909074e5130b63363ab45b07860c415f0b077c91c3d4ea4ceef208b (minProfit 1e24, NoProfit 0xd4989a94, 765,804 gas), non-owner 0x61d5281f9c8c04875dacfdbd60bfc130ae349834d28bdd09dd05f5da274785b4 (NotOwner 0x30cd7471), repeat with the same size and minProfit after the take 0x28299daa4adb96180bd80a9919dba2ab3e680d8a752635ad665f0d9dbb842b2c (reverts TokenCallFailed 0x3f409f9a, the withdrawal no longer covers the flash swap). Executor leftovers 0 (xSolvBTC, SolvBTC, BTCB, WBNB, native), allowance 0. Paper path, series.py, relay eth_call with the code override, the same best gain as the fork at block 134820260 (0.007789 BNB at 0.012244 SolvBTC)."
awaited_events: "Swap on the PancakeSwap V3 xSolvBTC / SolvBTC pool 0x5a5ca751 that sells xSolvBTC (12 sells in the last 7 days, 2 of them large enough for the incumbent, the last at 2026-11-22T19:46Z). A gain of about 0.0003 BNB stands at placement, so the first paper_sim (and the first live send) is expected at start; the next seller may be hours or days away."
good_signs: "opportunity and paper_sim success lines in logs/bot.jsonl at start and within seconds of a feed line; live: send_result won"
bad_signs: "live: send_result lost with winner_block equal to or one below our send block; every probe 0 while the pool is below the share value (withdraw paused, fee raised or made allowlisted); no feed line for 3 days"
rpc_reads_per_min: 0.6
alchemy_cu_per_day: 20000
legal_note: "A public redemption of a share token at its own value, open to any holder with no allowlist (a fresh contract was paid on the fork), bought on a public pool with a flash swap in one transaction. No mempool watching, no reaction to pending transactions; the trigger is a confirmed Swap log, a timer and the confirmed state."
expedite: false
