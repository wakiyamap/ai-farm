id: trial-euler-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: flash-funded Euler EVK liquidation on Base (USDC debt vaults eUSDC-1, eUSDC-102, eUSDC-91; WETH or cbBTC collateral), woken by the Chainlink WETH/USD AnswerUpdated log on the feed and a 110 s near-health scan"
copied_from: "Euler EVK liquidators on Base: 0x5ac9bc14376bf2727c6211960cf3cec1e2f295bd in tx 0xc874feef7e8cee747386d40759b82c36ac92a61fd2b125c67930e44a9885bf77 (block 57496613, the fork-proof case) and tx 0x53b82f7f95fbdf6bc0b95fc1f5667897e4f213a2401ed96501cf007a53ee2810; 0xecf4e632eb62fd051ef9fc14925bab77d3f597cb in tx 0xacabec31f36a0c5f8507efcd8e07f8d0f10a1902c5a0a80c57660276434b6246 (block 57577280, cbBTC collateral)"
capital_usd: 15
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor EulerLiqExec.sol:85 reverts NoProfit unless the USDC balance grew by at least minProfit (and by more than zero), and :87 pays the whole balance to the bot in the same tx, so a lost attempt costs gas only. bot.py:359-364 sets the fee ceiling so maxFeePerGas x gasLimit + 0.02 USD L1 allowance < 0.90 USD (never above 0.5 gwei) and requires simulated gross > that signed gas cap, and :369 sets on-chain minProfit to the gas cap. Priority fee bid is at most 50% of the simulated gross (BID_SHARE, bot.py:77 and :360). No principal: the repayment is a Morpho flash loan repaid in the tx; the bot wallet holds gas only (15 USD, under the 18 USD Base cap)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7 d to 2026-11-17 (attempts:1846, scratch/trial-euler-base/events7d.json): 18 Liquidate events on the 41 largest Base EVK vaults by 5 liquidator contracts; 8 with USDC debt (14-1,300 USDC repaid), 6 in this bot's scope (5 WETH, 1 cbBTC collateral), taken by 0x5ac9bc14 (5) and 0xecf4e632 (1) two to four blocks (0.4-0.8 s) after the price step, at 0.006-1.12 gwei. On those six cases the bot's own path at the parent block finds +23.17, +0.48, +0.39, +0.40, +0.33 USDC and one skip (harness.out). The bot is expected to arrive after the incumbents (feed delay about 1 s); it aims at what they leave: small positions and accounts left under water after a cascade."
executor: scratch/trial-euler-base/contracts/out/EulerLiqExec.sol/EulerLiqExec.json
executor_args: "{bot}"
executor_note: "Owner-only run(Params). Flash lender, debt vault, collateral vault, violator, repay amount, swap pool and minProfit are all call arguments; constructor takes the bot address only; no setup transaction. The flash callback accepts only the lender set for the running call and the swap callback only the pool set for the running swap (both cleared afterwards). The flash loan is repayAssets + 0.1% + 10 units (the debt taken over can round up and accrues until repaid; the loan is free). The USDC approval to the debt vault equals the flash amount and is reset to zero; Morpho pulls exactly the approved repayment. Controller and collateral are disabled again inside the tx. Profit leaves as USDC. Live address from EXECUTOR_ADDR_BASE or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-euler-base/proof.py (lease, reset base 57496612 = parent of the historical take 0xc874feef..., deploy artifact, fund owner, guards, success, nothing-left, release; output proof.out; fork generation 1179). Success 0x32f3f68322d07670b26dcf547539752da2522a0e7f585e11664423a9aa4ad6d2 block 57496616, gas 745326, owner +23.170932 USDC; executor USDC, WETH, native, collateral shares and debt all 0 afterwards. Correct reverts: NoProfit guard 0x5356d634e62eccdec35dd14a2bc6e2433764ed1f4b49dc476b4e1b67fa7bc8fc (0x31708d59, owner USDC delta 0); non-owner 0x716527a04bf5609f31158ac4d26d0a7a0add080bf67d8c1a0e0395666a7ebc22; nothing left to take 0x627f97d63a79fce3fc4519f82eb6f94368f0b4537087d81e7c291ff08d3823b4 (second call after success, 0x3b77f101, owner USDC delta 0). The success lands at parent+4 because deploy and the two guards consume fork blocks. Deploy 0xd5de12b0b8561673fa43c24db0f2a226b8be032a6b684704818095fb7d5533b0, 1,160,415 gas. Second case, cbBTC collateral: `python3 proof.py cbbtc` (reset 57577279 = parent of take 0xacabec31..., eUSDC-91 / ecbBTC-20, output proof_cbbtc.out, generation 1178): success 0x49164d380dbf61c89de52da3324d31dc2c9079d1efcd1935aac4ef8a68288ae9 block 57577283, gas 757547, owner +0.329664 USDC, leftovers 0; guard 0xe614cfa6edfcd9df80764230859bcfd274bae545633410312bbd604e5a1035d5 (NoProfit); nothing-left 0x60a8a105d2ad804444f02c7bd6ee57c8b6567d68dd36214dff7c0097f62b4230 (NoProfit). This second case failed on the first executor version (E_TransferFromFailed 0x9773bb71: flash amount equal to the debt taken over, one unit short after rounding); the executor now borrows repayAssets + 0.1% + 10 units and both cases were re-run on the final bytecode (both runs give the same 5,122-byte runtime). scratch/trial-euler-base/harness.py: bot calldata equals cast calldata; the bot's scan and attempt path with the paper code override at the parent block of six historical takes (harness.out). The fork's upstream was the public node (research lane spent): archive reads fail now and then and proof.py retries them."
awaited_events: "AnswerUpdated on the Chainlink WETH/USD aggregator 0x05c84a58fe042275b37db038baacd15f410c7bb0 on the feed (41 in the 2.8 h before 2026-11-17 19:50Z, about 350 per day); each one triggers a scan of the near-health list. An in-scope liquidation last happened at block 57577280 (about 2.8 days before 2026-11-17 19:50Z); 6 in 7 days, all inside one 4.5-hour stretch (blocks 57496613-57577280). Next occurrence is not predictable (ETH or BTC price moves)."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is)."
bad_signs: "No opportunity row in 7 days; every send lost by many blocks; simulate_revert on every underwater account (collateral out of scope); read_budget rows (75k CU cap hit); scan rows with debtors=0 (borrower list empty)."
rpc_reads_per_min: "about 1.2: one Multicall eth_call per 110 s plus one per price event (about 350 per day), 1-2 per hour for the full scan, eth_blockNumber + eth_getLogs every 10 min, 6 more eth_getLogs per 10 min during the first ~11 hours (backfill), plus up to ~12 calls per detected opportunity"
alchemy_cu_per_day: "about 41,000 relay CU/day (near scan 1,135 x 26 = 29,500; discovery 144 x 70 = 10,080; full scan about 1,000) plus feed about 18,000 = about 59,000 CU/day = 0.03 USD/day at 0.53 USD per 1M CU; about 82,000 on the first day (one-time 45-day Borrow backfill, 23,400). The code stops relay reads at 75,000 CU per UTC day."
legal_note: "Public Euler EVK liquidation discount for taking over unhealthy debt, open to any caller. Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions. Bidding a priority fee for a public reward is in scope of the trial decision."
expedite: false
