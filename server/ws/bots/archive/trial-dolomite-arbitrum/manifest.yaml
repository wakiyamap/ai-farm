id: trial-dolomite-arbitrum
author: builder/claude-mythos-5-2
chains: [arbitrum]
strategy: "trial: Dolomite liquidation of native-USDC debt on Arbitrum One through Dolomite's own LiquidatorProxyV2WithExternalLiquidity (liquidate + sell the seized collateral via Augustus V5 directUniV3Swap inside one DolomiteMargin.operate, zero capital), found by a 45 s Multicall scan of the accounts nearest to the margin threshold"
copied_from: "Dolomite liquidators on Arbitrum: EOA 0xd9fffdf0c4b18fb7e225da15b2af9f88e55676c3 calling the proxy 0xcc24caa605375c011a4f7e6be7f6c2a3e377f368 in tx 0x8e7af72be14ceea99bbdc1a47bdc2a2f097be970c2cc582e16cd14bdec3c530b (block 524190593, the fork-proof case, WBTC collateral / USDC debt) and tx 0x83022eac290007653ecccca5888c8dceba203fdf9ad145ab5bf797636faa3be8 (block 524255465); EOA 0x1ff6b8e1192eb0369006bbad76da9068b68961b2 in tx 0xf1bb2c69cd0363c459871613682eda7d306041f9e7a8c7e5aa5075f223f24596 (block 524190585)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor DoloTake.sol:127 reverts 'no profit' unless the bot wallet's USDC balance grew by at least minProfit (and by more than zero); the surplus is withdrawn from the executor's Dolomite account to the bot wallet in the same tx (DoloTake.sol:117-124), so a lost attempt costs gas only. bot.py:421-424 sets maxFeePerGas so maxFeePerGas x gasLimit < 0.90 USD (never above 1 gwei) and at most 50% of the simulated gross (BID_SHARE, bot.py:70), skips when the gross is not above that signed gas cap, and bot.py:430 sets the on-chain minProfit to the gas cap. gasLimit is eth_estimateGas x 1.2. No priority fee is bid (bot.py:321,Arbitrum is first come, first served), so the most it bids as a share of gross is the 50% cap on the signed gas bound. No principal, no flash loan: the bot wallet holds gas only (10 USD of ETH)."
expected_value: "Trial: win rate measured by sends, no counted EV. 8.24 d to 2026-11-18 (lead 276, scratch/dolo-arb-0e51/census.json): 30 LogLiquidate on DolomiteMargin, 17 with native USDC debt, 65,454 USD of debt taken over (spread about 5%), takers 0xd9fffdf0 19, 0x1ff6b8e1 10, 0x54cc312d 1; accounts were liquidatable 2-10 s before the take in the clean cases and at least an hour in three; no priority fee (0.020002 gwei effective at base 0.02, tx index 3). The bot's own path at the parent block of the past USDC-debt takes is in scratch/trial-dolomite-arbitrum/harness.out: an opportunity on 10 of the 19 census rows with owed market 17 (1.63, 3.68, 4.11, 8.36, 77.83, 374.05, 443.69, 520.79, 601.97 and 1,703.43 USDC; gas cap 0.13-0.16 USD), nothing on 5 dust cases under 20 USD of debt, on one with collateral market 30 (no route) and on the 3 pieces of one bad-debt account (0xd28e7c36, ratio 0.76, gross under a cent). The aim is the takes that survive one 45 s poll and one piece of a multi-piece unwind: from under 1 USD to several hundred USD per take (fork proof: +601.97 USDC on the 12.8k USD piece)."
executor: scratch/trial-dolomite-arbitrum/contracts/out/DoloTake.sol/DoloTake.json
executor_args: "{bot}"
executor_note: "Owner-only take(TakeParams). Proxy, DolomiteMargin, the Uniswap V3 router, liquid account, owed and held market, held and owed token, sell amount, UniV3 path and minProfit are all call arguments; constructor takes the bot address only; no setup transaction, no approvals (the executor never holds tokens: the proxy liquidates into the executor's Dolomite account 0 and the Withdraw action pays the bot wallet directly), no callbacks. The Augustus V5 directUniV3Swap calldata (selector 0xa6886da9) is built in the contract with beneficiary = the proxy, toAmount 1 and deadline = block.timestamp; the proxy itself enforces output >= the debt taken over. Profit leaves as native USDC. Live address from EXECUTOR_ADDR_ARBITRUM or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode. Deploy 684,182 gas, runtime 2,915 bytes."
fork_evidence: "scratch/trial-dolomite-arbitrum/proof.py (lease, reset arbitrum 524190592 = parent of the historical take 0x8e7af72b..., deploy artifact, fund owner, sizing, guards, success, leftovers, repeat, release; output proof.out; fork generation 62). Sizing by eth_call bisect: largest pullable sell amount 20,508,083 sats = exactly what the incumbent sold at 524190593. Success 0x849d1c73cddbf9867ea58706acee16b0adca4455a37fad0e5b19df1e13095692 block 524190597, gas 1,631,478 (estimateGas 1,856,045), owner +601.966104 USDC (simulated 601.966103); executor USDC, WBTC, WETH, native and Dolomite balances in markets 17 and 4 all 0 afterwards; 20,509 sats (the 0.1% haircut) stay in the proxy. Correct reverts: non-owner 0xe958e04f6ea7863e7546f1bad80ffaf77d62081b99ca420dbec43c2bfb5aad55; 'no profit' guard 0x7e0592a4ccfcdd89c50a7b5834a225ab0dcd0a67697902872b30dc8271118afc (minProfit 1e30, owner USDC delta 0, gas 1,854,213); nothing to take 0x3098f44af9e2d288db03cab965eec1e4765fb039fb024c9de670019c67487bf3 (an account with no USDC debt: 'LiquidatorProxyBase: owed market cannot be positive <17>', delta 0, gas 82,710); the same call repeated after the success reverts 'held market cannot be negative <4>' (eth_call). The success lands at parent+5 because deploy and the three revert txs use fork blocks. Deploy 0x5ea794ef8d390eefc814abfe6adbbb2fa4ba34a155ff16f91f9a55ea6bedd468, 684,182 gas, runtime = executor-runtime.hex. scratch/trial-dolomite-arbitrum/harness.py (output harness.out): bot calldata equals cast calldata; the bot's scan and attempt path with the paper code override at the parent block of the 19 past USDC-debt takes, and its full scan at the head (154 seed accounts, 140 USDC debtors over 20 USD, 2 marked Liquid: one dust, one with collateral it cannot sell)."
awaited_events: "No log: the trigger is an oracle price move that puts a USDC-owing Dolomite account under the margin threshold (adjusted supply < adjusted borrow x 1.15), or an account DolomiteMargin already marked Liquid after an earlier piece was taken, found by the 45 s Multicall scan of the 150 accounts nearest to it (full scan hourly, new borrowers from DolomiteMargin balance events every 10 min). Last in-scope liquidations: 17 USDC-debt LogLiquidate between blocks 523,388,683 and 524,328,093 (2026-11-12 to 2026-11-15); the next one is not predictable, it follows a price drop of WETH, WBTC, ARB, LINK or GMX."
good_signs: "scan rows with a debtor count in the hundreds and min_ratio just above the threshold; opportunity rows with gross above the gas cap; in live a send_result won with a positive USDC delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is)."
bad_signs: "No opportunity row in 7 days while LogLiquidate with owed market 17 keeps appearing on DolomiteMargin (the scan misses accounts or is too slow); every send lost by many blocks; simulate_revert 'Asset not whitelisted' or 'insufficient output amount' on every under-water account; opportunity_skip no_route_for_collateral on most; read_budget rows (90k CU cap hit); scan rows with debtors=0."
rpc_reads_per_min: "about 1.5: one Multicall eth_call per 45 s (near scan), 2 per hour for the full scan, eth_blockNumber + eth_getLogs every 10 min, plus about 15-25 eth_call per under-water account per 60 s (balances, prices, sizing bisect, simulations, estimate, gas price)"
alchemy_cu_per_day: "about 66,000 relay CU/day (near scan 1,920 x 26 = 49,920; discovery 144 x 85 = 12,240; full scan 24 x 2 x 26 = 1,248; margin ratio 624; re-checks of dust accounts left marked Liquid about 2,000) = about 0.035 USD/day at 0.53 USD per 1M CU; no feed filter. The code stops relay reads at 90,000 CU per UTC day."
legal_note: "Public Dolomite liquidation spread for taking over the debt of an under-collateralized account, through the protocol's own verified liquidator proxy, open to any caller. Reacts only to on-chain state read on a timer; no mempool watching, no reaction to pending transactions, no priority-fee bidding."
expedite: false
