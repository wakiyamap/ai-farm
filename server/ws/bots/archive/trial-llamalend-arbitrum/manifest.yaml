id: trial-llamalend-arbitrum
author: builder/claude-mythos-5-2
chains: [arbitrum]
strategy: "trial: Curve LlamaLend liquidation on the WBTC / crvUSD controller on Arbitrum One, flash-funded (Balancer V2 WETH -> crvUSD, controller.liquidate, seized WBTC back to WETH, profit unwrapped to the bot wallet as ETH) in one executor transaction, found by a Multicall3 health read of every loan on a 75 s timer that drops to 3 s while a borrower is within 0.05% of zero health"
copied_from: "LlamaLend liquidators on Arbitrum: contract 0x5ac9bc14376bf2727c6211960cf3cec1e2f295bd in tx 0x33b7fc9e63d46bcfef8e232c06d0ff39d83bbbf435022960a51361d0d9da750e (block 524327722, the fork-proof case: controller 0xb9adddcf4e01c2f64f8f2cd9a050dc35585ea053, user 0x10a865480236c40eb9683038d9c072d88b51b758, seized WBTC sold through WETH and ARB into crvUSD, kept 0.861 crvUSD); 0x8ab5db84d241f4cca7de44d9f84d393f78b099f1 in tx 0x9a4113c2efb52155abbf4e3a332c41d5730a20deae26aa8c47b6241b4744dd29 (block 523741610). Bot and executor started by builder/gpt-6-sol in run a28ea6d9 and finished (fork proof, near-liquidation fast poll, manifest, README) by builder/claude-mythos-5-2 in run 1d8f277d."
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor LlamaTake.sol:81 reverts NoProfit() unless the executor's WETH balance after repaying the flash loan grew by at least minProfit (and by more than zero); the gain is unwrapped and sent to the bot wallet in the same tx (LlamaTake.sol:83-85), so a lost attempt costs gas only. bot.py:261-263 sets maxFeePerGas to the lowest of gas price x 1.1, 0.80 USD / gasLimit (priced at a deliberately high 4,000 USD per ETH, so the real bound is lower) and 50% of the simulated gross / gasLimit; bot.py:265 skips when the gross is not above that signed gas cap; bot.py:269 sets the on-chain minProfit to the gas cap + 1 wei. gasLimit is eth_estimateGas x 1.2. No priority fee is bid (Arbitrum is first come, first served): the most it bids as a share of gross is the 50% cap on the signed gas bound. The flash loan is at most 0.05 WETH (LlamaTake.sol:71) and is repaid inside the tx; the bot wallet holds gas only (10 USD of ETH)."
expected_value: "Trial: win rate measured by sends, no counted EV, and the honest expectation is close to zero wins. 7 d to 2026-11-18 (blocks 523,330,166-525,374,422, attempts:2195 and 2204): 2 Liquidate events on all 25 LlamaLend controllers on Arbitrum. Tx 0x33b7fc9e (block 524327722, taker 0x5ac9bc14, this controller): the user went under zero health at block 524327720 and was taken 2 blocks later, inside the same second (scratch/trial-llamalend-arbitrum/window.json); gross 0.86 USD, gas 0.053 USD, no priority fee (0.02027 gwei). Tx 0x9a4113c2 (block 523741610, taker 0x8ab5db84, tx index 2): became takeable inside its own block, about 4.8 USD out, gas 0.027 USD. The bot aims at what those two takers skip or are late for: a position they consider too small, or one they miss while the bot is in its 3 s fast poll. Fork proof on the first case: +0.000495 ETH (0.86 USD) against a gas cap of 0.000054 ETH (0.09 USD)."
executor: scratch/trial-llamalend-arbitrum/contracts/out/LlamaTake.sol/LlamaTake.json
executor_args: "{bot}"
executor_note: "Owner-only take(Job). Balancer vault, controller, user, collateral, borrowed token, ARB, WETH, Curve pool, Uniswap router, the three UniV3 paths, the loan amount and minProfit are all call arguments; constructor takes the bot address only; no setup transaction. receiveFlashLoan checks msg.sender against the lender stored for this tx and cleared at the end (LlamaTake.sol:94, 78-80). Every approval is for the amount used and reset to 0 inside the tx (proof: all allowances 0 afterwards). Swap minimums are 0 because the final WETH-gain check covers the whole route. One limitation kept on purpose: the Curve leg uses coin indices 1 -> 0 (ARB -> crvUSD in tricrypto 0x845c8bc9..., checked by coins(0), coins(1) in proof.py), so the executor serves controllers whose borrowed token is reachable through that pool shape. Profit leaves as native ETH (WETH.withdraw then a call to the owner; receive() present). Live address from EXECUTOR_ADDR_ARBITRUM or EXECUTOR_ADDR only; the paper address is used with a code override (executor-runtime.hex = eth_getCode of the proof.py fork deployment, owner 0xc0ffee...01) and never in live mode. Runtime 5,073 bytes, creation 5,218 bytes."
fork_evidence: "scratch/trial-llamalend-arbitrum/proof.py (lease, reset arbitrum 524327721 = parent of the historical take 0x33b7fc9e..., address getters, deploy artifact with --args owner, fund, size sims, non-owner, guard, success, leftovers, repeat, release; output proof-result.json; fork generation 67; calldata built by bot.py calldata() and compared with cast calldata). Success 0x5b6594eb233e7e15de4a63eb9ba5f2c7d1b34632c67cb7651587d4660afe00d0 block 524327725, gas 1,625,593 (estimateGas 2,029,699), owner native delta +476,406,668,997,118 wei after 19,057,858,990,555 wei of gas at the fork's 1 gwei-scale price = gross +495,464,527,987,673 wei (simulated 495,464,324,849,203); executor native, WETH, WBTC, crvUSD and ARB all 0 afterwards. Correct reverts: non-owner 0x923a6a643e5d318689c7ab64f0775f0e17d47ffc5f4ff9b7567eb4e7cb1743bf NotOwner(); guard 0x1e0e07e9e2e7dde7592b742b2557d436a3f140615aec34587b40fa2f2a4eb5b7 NoProfit() with minProfit 1e18 (owner delta + gas = 0, gas 1,976,810); nothing to take 0xaf95200a8c284a149d08822ad405f43e8e471eb1497080083dbc003ac5d18d17 (the same call after the success: controller reverts 'Loan doesn't exist', owner delta + gas = 0, gas 554,294). The success lands at parent+4 because deploy and the two revert txs use fork blocks; the fork does not replay the incumbent. scratch/trial-llamalend-arbitrum/harness.py (output harness.out): the bot's own borrowers / healths / check_user path with the paper code override at the parent block logs opportunity and paper_sim (gross 495,463,939,922,902 wei, gas limit 2,435,639, max fee 0.022 gwei, cap 53,584,058,000,000 wei); at head its Multicall negatives equal users_to_liquidate() and its aggregate3 calldata equals cast calldata."
awaited_events: "No log: the trigger is the controller's health(user, true) of a borrower going under zero (the test liquidate() itself applies), which follows the AMM price oracle for WBTC. Read on a timer: every 75 s, every 3 s while any borrower is within 0.05% of zero (at most 1,400 fast polls per UTC day). Last liquidation on this controller: block 524327722 (2026-11-15); the other 7-day one on LlamaLend Arbitrum: block 523741610 (2026-11-13). Next: not predictable, it follows a WBTC drop; at 2026-11-18 18:45Z the nearest healthy borrower is 6.3% above zero."
good_signs: "scan rows with loans about 25 and a falling min_positive_health; near=true rows before a liquidation; an opportunity row with gross above the gas cap; in live a send_result won with a positive net_wei; send_result lost rows with blocks_after_winner (shows how late the farm is)."
bad_signs: "A Liquidate event on the controller with no opportunity row before it (expected for takes inside 1-2 blocks: that is the measured competition); scan_error on every poll (Multicall or relay); read_budget rows (90k CU cap hit); near=true for hours every day (fast budget wasted on a position that hovers); simulate_revert for a borrower other than the known bad-debt one 0x2b7dd66f."
rpc_reads_per_min: "0.8 idle (one Multicall eth_call per 75 s, 2 calls per 30 min for the loan list); up to 20 while a borrower is within 0.05% of zero (3 s poll, at most 1,400 per day); 4-7 eth_call per under-zero borrower per attempt, backed off from 5 min to 1 h"
alchemy_cu_per_day: "about 35,000 relay CU/day idle (75 s scan 1,152 x 26 = 29,952; loan list 48 x 52 = 2,496; the bad-debt borrower re-check 24 x 104 = 2,496), at most about 71,400 on a day that uses all 1,400 fast polls (+36,400) = 0.019 to 0.038 USD/day at 0.53 USD per 1M CU; no feed filter. The code stops relay reads at 90,000 CU per UTC day."
legal_note: "Public LlamaLend liquidation: controller.liquidate(user, min_x) is open to any caller and pays the caller the position's collateral for repaying its debt. Reacts only to on-chain state read on a timer; no mempool watching, no reaction to pending transactions, no priority-fee bidding."
expedite: false
