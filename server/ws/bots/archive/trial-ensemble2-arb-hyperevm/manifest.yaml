id: trial-ensemble2-arb-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: Ensemble (hyper_tokens) leveraged vault shares BEAR, iBULL, iBEAR, iVOL and VOL, NAV versus their HyperSwap V3 pool (0.3 pct tier for BEAR, iBULL, iBEAR; 1 pct tier for iVOL, VOL). Sibling of trial-ensemble-arb-hyperevm, which covers BULL only. The vaults are ERC-4626 with instant deposit and redeem at a NAV read from HyperCore. When the NAV has moved away from the pool by more than the fees, one tx flash-borrows USDC on Morpho Blue and either deposits and sells the shares on the pool, or buys shares on the pool and redeems them, repays, and pays the USDC gain to the bot wallet, or reverts. The NAV has no event, so the bot polls one eth_call of the executor's probe() every 27 s."
copied_from: "inventory contract 0x4c1e071696dc95e38033c7ffc404e38ffeb2ba83 (driver EOA 0x85be4c4558846b51ce163a45a46991295a20d83b, actors:281): tx 0x02c14257f6e1084ae23a686d8e7dd30c9d6a8a2e81606f7ae6baa9daffca4ec2 (iBULL, +0.078388 USDC, 402,427 gas), 0x543614f0330bced01ca7ebe1dda4d9a2aa0fffe2334a313c0557d1d72259a8d0 (BEAR + iBEAR, +0.092947 USDC), 0x532a0eb9d2b96cbc66a26710b95c94355f990e3482fee8011886ffb464bd04fd (VOL + iVOL, +0.102753 USDC); and flash executor 0xb54e8debf06c26ca906d7d98eb4e01dabd9aed19 of EOA 0x5d03a3f8151d98a1bf9de604e7552caf49034ec3 (actors:278): tx 0x81b91af4fa517f5d2e398bb89477e89c90f331c743a58fe63c2b7d42a1fb0bd9 (iVOL deposit and sell, +0.026446 USDC). Same vaults, pools and router; changed: one vault per transaction, Morpho flash instead of inventory, size chosen by simulation (40 / 120 / 320 USDC)."
capital_usd: 20
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialVaultArb.run reverts NoProfit() unless its USDC balance grew by minProfit > 0 after the flash loan is repaid (scratch/trial-ensemble2-arb-hyperevm/contracts/src/TrialVaultArb.sol:101 and :110; a losing route already fails at Morpho's repayment pull), also tx.gasprice <= maxGasPrice and a deadline (:99-100), so a lost attempt costs gas only. Gas cap per send in bot.py (constants GAS_LIMIT_MAX to GAIN_OVER_CAP) and evaluate(): gas limit = eth_estimateGas x 1.2 (at most 1,900,000), maxFeePerGas = base fee x 1.3 + bid, never above 2 gwei (1.9M x 2 gwei = 0.0038 HYPE = 0.28 USD at HYPE 72); no send unless that cap valued at the WHYPE/USDT0 pool price x 1.15 is under 0.95 USD and the simulated USDC gain is at least twice it (GAIN_OVER_CAP); minProfit is set to the cap in USDC. Priority-fee bid: at most 20 pct of simulated gross (BID_SHARE), never above the fee cap."
expected_value: "trial, win rate to be measured live. Competition, 7 d to 2026-11-20 13:45Z (mint / burn census of the two incumbents, scratch/r7f51/navcensus.py; counts are a floor, the inventory contract's list was cut at 1,000 rows per direction): BEAR 334 mints + 138 burns, iBULL 38 + 211, iBEAR 194 + 111, iVOL 70 + 85, VOL 85 + 210, almost all by inventory contract 0x4c1e0716 (driver 0x85be4c45), which often pairs two vaults in one tx; flash executor 0xb54e8deb is the second taker. Sampled paid takes (scratch/r7f51/takes.json): gain 0.078 / 0.093 / 0.103 / 0.194 / 0.318 / 0.474 USDC for a fee of 0.00016-0.0019 HYPE (0.012-0.13 USD), tx index 0-5, gas price 0.4-1.8 gwei (0.4 = floor in 2 of 9: little fee bidding). Gaps seen during this session's 4 min of live watching: BEAR mint 40 = 0.0116 / 0.0107 / 0.0088 / 0.0043 USDC, VOL mint 40 = 0.0220 / 0.0135 / 0.0199 / 0.0187 USDC: thin, mostly under the bot's 2 x gas cap rule (about 0.03-0.07 USD); the sends will come from the larger moves. Historical windows cannot be measured (HyperCore reads are not archived). One lost attempt is about 500k-620k gas = 0.02-0.04 USD at 0.4-0.83 gwei."
executor: scratch/trial-ensemble2-arb-hyperevm/contracts/out/TrialVaultArb.sol/TrialVaultArb.json
executor_args: "{bot}"
executor_note: "Same Solidity source as the live sibling's executor (own copy and own build; creation bytecode byte-identical). Deploy gas 1,169,335 on the fork, below the 2,000,000 HyperEVM cap. constructor(address bot) only (owner is immutable); Morpho, USDC, vault, router, fee tier, direction, size and limits are Route call arguments. The Morpho callback accepts only this transaction's lender and exact data; both are cleared after the loan. Approvals are for the exact amounts and reset to zero. probe() is an eth_call helper that rolls every candidate back. Profit is paid in HyperEVM USDC 0xb88339cb7199b77e23db6e890353e22632ba630f (the token the reviewer of the sibling bot matched to the gate's hyperevm USDC)."
fork_evidence: "Script scratch/trial-ensemble2-arb-hyperevm/proof.py (`python3 proof.py 600 10000 BEAR,VOL`; output proof-fork-success.json). The vaults read HyperCore precompiles (0x080f, 0x0801), which the anvil fork lacks; the script places a fork-only replay fixture (mock/src/PrecompileReplay.sol, anvil_setCode at the precompile addresses only) that answers each input with the bytes the real precompile returned through the relay about one second earlier. Executor artifact, vaults, pools, router, Morpho and USDC are untouched. Run 2026-11-20 13:50Z, fork reset at head 51,774,422, owner 0x1111111111111111111111111111111111111111: deploy 0x2ba4417357303ce11c94fb754c8131a15037eb311c7c2970bdf9614cc305dcbe (executor 0x8f7a45ebde059392e46a46dcc14ab24681a961ea, 1,169,335 gas). Controls in the same round: probe() on the fork returned 19937 for VOL deposit-and-sell 40 USDC and the relay eth_call at latest (code override) returned 19937; the vaults' previewRedeem on the fork equals the live one (VOL 7875452 on both). SUCCESS 0x1cc39f9cacccab844d6509579262df03fb15440c50a4aefa40668c7f27c382f2 (fork block 51,774,443, status 1, 494,956 gas, run(VOL, fee 10000, deposit and sell, 40 USDC, minProfit 18940)): owner USDC 0 -> 19938 = +0.019938 USDC; after it the executor holds 0 USDC and 0 shares and its four allowances are 0. Reverts on the same fork state, real transactions: nothing to take (BEAR mint 120, probe 0) 0x5de43dc61dd9e9d307417f855b096ff1b177dc62914ed303bc4c754bf8d353b8 reverts at Morpho's repayment pull; the open route with minProfit 39874 (2 x the gain) 0xbedf07a490c64311bdefe725354d0bae49eb4ca5f39ffe53ab454b760e5815c2 reverts NoProfit 0xe39aafee; non-owner 0xf39bccdecca0b9fbf0eb78c6262bb3b8f5a817942abbe3f916f5df44e9923ee4 reverts NotOwner 0x30cd7471. FIRST RUN, kept and NOT counted as a gain (proof-run1-stale-pool.json, all five vaults, 13:48Z): BEAR mint 320 succeeded on the fork with +0.724106 USDC (0x3b64304138c33f0a3d0f1a4343667482b88523f893001cd5a2e27bd53e3fefcb), but the fork's pool state was 107 blocks older than the NAV values it was fed and the live probe of the same candidate was 0, so that gain never existed on mainnet; it only shows the executor path works on a 0.3 pct sibling vault (BEAR). The script now refuses a success unless the live probe of the same candidate is open too. Limits: a re-run waits for the next gap (seconds to minutes) and gives other hashes; the 0.3 pct vaults have no fork success with a matching live probe (in the second run BEAR mint 40 probed 4254 on the fork against 4286 live, not sent because VOL was the better candidate). selftest.py: the bot's hand encoder equals cast's bytes for run() and probe(); one live probe answered for all 30 candidates. Paper runtime = eth_getCode of a fork deployment of this artifact (take_runtime.py, deploy 0x60339b3f4b8ed628663bab7a40bd4b520c4ada59f3a7333ea864adc9d037d658 at block 51,774,468; equal to the artifact runtime with the owner filled in)."
awaited_events: "No event: the NAV moves with the perp price. The bot polls probe() every 27 s and acts when a candidate's gain exceeds twice its gas cap. Last seen open: 2026-11-20 13:50Z (VOL mint 40, +0.0199 USDC, too thin to send). The incumbents fill these five vaults well over 200 times a day together, so a gap of some size opens every few minutes."
good_signs: "logs/bot.jsonl: a poll heartbeat every 18 min; opportunity_skip rows many times an hour and opportunity + paper_sim rows a few times a day; live: send_result rows with result won and gas_used about 450k-650k."
bad_signs: "loop_error on every poll (vault upgraded, CircuitBreaker policy now refuses the executor, or the node stopped accepting the override); read_budget before 23:00Z; opportunity_skip gross_under_2x_gas_cap on every gap for days (base fee too high for these sizes); live send_result lost on every send with blocks_after_winner >= 0 (always late: report as blocks late)."
rpc_reads_per_min: "2.2 (one eth_call per 27 s) plus about 4 reads per evaluated gap"
alchemy_cu_per_day: "about 86,000-98,000 (0.046-0.052 USD): 3,200 probe polls x 26 CU = 83,200, plus 88 CU per evaluated gap; hard cap 98,000 relay CU/day in code, then it sleeps to 00:00 UTC. No feed filter."
legal_note: "Deposit and redeem are the vaults' public ERC-4626 functions at their own NAV (maxDeposit for a fresh address is 25,000 USDC on each) and the pools are public DEX pools; minting or redeeming against the pool price is plain arbitrage that pulls the share price back to NAV. The bot reads mined state only, watches no mempool and no pending transactions; it may bid a priority fee for a public opportunity. The vaults' keeper functions are not used."
expedite: false
