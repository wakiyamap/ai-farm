strategy: poll Morpho Blue farm-band markets on Chainlink price drops, liquidate the seeded farm-loop borrower via the flash-loan executor (one tx, min-profit revert guard)
copied_from: "the incumbent cbXRP/cbZEC liquidator pattern; ledger source morpho_blue.liquidate (221 incumbent caller wallets, base); fork-proof capture tx 0x49956387bc518cd90f8811f65e22e3f430cf86f244735b1e626f02af24a3de75"
capital_usd: 120
allowed_contracts: []
max_loss_per_tx_usd: 5
max_loss_guarantee: "executor reverts unless its loan-asset balance ended higher by minProfit AND sweeps the full gain to the owner wallet in the same tx (bots/paper/morpho-farmband-base/../../../scratch/morpho-farmband-base/contracts/src/MorphoFarmLiquidator.sol:157 require balAfter >= balBefore + minProfit, :163 require transfer(owner, profit)); worst case is the 1.3M-gas tx at the 1 gwei maxFeePerGas cap in bot.js (~4 USD at signing-time ETH/USD), gas-only because any failure reverts the whole tx"
expected_value: "measured 2026-11-12 (run 0ee85e97, fix round 3): per capture the executor take is 12.6 pct of repaid (fork proof repaid 172.14 USD -> wallet +21.67) minus gas 0.01-0.10 USD, so occurrences are worth 4.5-237 USD; the band regime is burst days (2026-11-04 crash burst; 2026-11-12 burst measured in the ledger blocks 56463494-56477050: pinned cbBTC market captured 7 borrowers (repaid 3.92-1883.39 USD), WETH-USD 3 dust captures (0.32-29.60 USD); drought between the bursts). BUT every publish->capture window measured on a currently-viable monitored market is 3-81 blocks (~1-16 s, under the 15 s poll + send-to-inclusion = incumbent-sniped per decision 2026-11-12): cbBTC feed drop 56470013 -> captures 56470016/56470018 (windows 3-5); WETH feed drops -> captures (77/81/542). The only poll-catchable occurrence measured is the 542-block dust capture worth 0.04 USD. After-gas EV at our poll rate: cents/day; the route is an archive candidate for the reviewer, not a 1-2 USD/day bot."
executor: scratch/morpho-farmband-base/contracts/out/MorphoFarmLiquidator.sol/MorphoFarmLiquidator.json
executor_args: ""
executor_note: "8-arg ctor: morpho + collateral whitelist cbZEC/cbBTC/cbXRP/WETH + swap pools cbZEC-USDC (dead token, kept for the fork proof) / WETH-USDC UniV3 0x6c561b446416e1a00e8e93e221854d6ea4171372 (the live pinned market leg AND the cbXRP dual-hop leg 2 - now whitelisted in the ctor) / cbXRP-WETH leg 1. The cbBTC market pool fbb6eed8e7aa03b138556eedaf5d271a5e1e43ef is not in the ctor: the owner must call setPoolAllowed(fbb6) before a first cbBTC liquidation (dormant zero-capture watch market)"
fork_evidence: "scratch/morpho-farmband-base/proof.py under a base fork lease (lease base 15, release on exit; run f2c9dff7 2026-11-12): reset 55986766 (capture 55986767 minus 1), deploy MorphoFarmLiquidator with the EXACT manifest ctor args (ctor_args in the evidence json), fund owner 1 ETH, send1 success tx 0x753719e782b3e1c64a66f9fc65a745cb5b2024d15f6891f0d7456d1d8e978cf gasUsed 819231: BOT-WALLET (owner) USDC delta +21.674726 USD swept in the same tx, executor leftover 0 (zero value left in the executor); send2 (same calldata, position now healthy) reverted, tx 0x850f0398473bc789f4ad1c6b89ab5081fc5737b47e39e33d98c18266648a2adb; evidence scratch/mb157-proof.json"
awaited_events: "Chainlink AnswerUpdated price drop on the pinned feeds (cbBTC -> 0xeb3ad4395924b76eb64b3d6ababa0b62875b1a1f, WETH-USD -> 0x83f3425a5b32655dc645f7f4e422dd60e9741794; both verified against measured captures); a seeded borrower then liquidatable. Pinned-market captures: cbBTC 56470016/56470018 (7 borrowers, max 1883.39 repaid, window 3-5 blocks after the 56470013 feed drop), WETH-USD 56374332/56377187/56381105 (dust 0.32-29.60 repaid, windows 77/81/542 after the feed drops); last capture of any size block 56477050 (2026-11-12, market outside our pin set, repaid 38 USD). The band flow is burst days (2026-11-04, 2026-11-12, 8 days apart) with multi-day drought between - paper logging price-drop checks is the expected steady state"
good_signs: "startup logs aggregators discovered non-empty (64-block topic-only window) and paper fork executor at a real address; market(bytes32) totals + position(bytes32,address) getter checks with sane debt/maxDebt/price/lastAccrual; a LIQUIDATABLE record with executorCalldata, sim ok + simWalletDeltaUSD (paper sim calls the deployed executor from its owner wallet on the fork) and simGuard no-profit-revert if a seeded borrower is underwater"
bad_signs: "aggregators discovered {} after a restart (topic-only discovery broken); every market check market-reverted or position-reverted (selector/decode misalignment); LIQUIDATABLE with debt/maxDebt ratio > 10; sim ok with simWalletDeltaUSD <= 0 (the sweep-to-owner broken); simGuard no-profit-revert-MISSING (the loss guard not enforced)"
rpc_reads_per_min: 3
alchemy_cu_per_day: "~0.8M CU at the 15 s poll: 5700 eth_blockNumber ~230K + 2700 AnswerUpdated eth_getLogs over the 3 pinned feeds ~270K + 170 safety full scans/day x 20 reads (2 market + 2 oracle price + 16 position getters) ~306K + rare drop scans; the paper fork simulation costs no relay CU; ~0.42 USD at 1M CU = 0.53 USD"
legal_note: "public liquidation bonus on a lending protocol (Morpho seizes at the oracle price with the protocol-intended bonus); no fees to anyone, no role gate (liquidate() is permissionless); window measurement per decision 2026-11-12 (re-measured run 0ee85e97): the windows on the currently-viable pinned markets are 3-81 blocks (~1-16 s) under the 15 s poll + send-to-inclusion - incumbent-sniped and excluded from EV; the only counted poll-catchable window is 542 blocks on a 0.32 USD dust capture"
