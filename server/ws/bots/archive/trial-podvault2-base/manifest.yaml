id: trial-podvault2-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: three more Peapods pods on Base whose Uniswap V2 pair is against a lending-vault share (pCircle / pfUSDC-89, peaPEAS / pfpOHMo-27, pETHY / pfUSDC-135): flash WETH, round trip through the vault's deposit or redeem, the pair, bond or debond and the pools back to WETH (six routes, one executor call)"
copied_from: "The per-route executors of the operator that pays out to 0xc0ffeefeed8b9d271445cf5d1d24d74d2ca4235e (rotating 0xc0ffee... sender EOAs): cir_fwd 0x663561b9804beb7e3341dcca68afb132e2d31031 (tx 0x0375e70e44b2315c5530b8565e4427af34a681cdcff171555e73b9a6d4614484, kept 0.0215 ETH) and 0x043854d8784c038440a612c0a43101d63564be17 (tx 0x94fc1b561083524ae5b16d34ab0c4630c34749832d7357fa42ea87aefc2a441f); ohm_fwd 0x67b45727964df17f770bd403a5f5266d10fca96a (tx 0x4a2def4d67e92d3952a46a92cc98a42e29722c239bce2568aa62123e37778953, kept 0.00736 ETH); ethy_fwd 0xdf0ffea59f4efea9664c1f109f1f9c23461a6457 (tx 0xb750cc17d9e931a4752e55a03c317516d53cdecb99e4e2164823156d68652380, kept 0.00268 ETH)"
capital_usd: 0.75
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Same mechanism as the live siblings trial-peapods-arb-base, trial-podcycle-base and trial-podvault-base. Base charges the L1 data fee and the operator fee at inclusion and no signed field bounds them, so the worst case of one send is the bot wallet's native balance, kept under 1 USD: capital_usd 0.75, all native, no top-up, and bot.py:375 (live branch of take(), wallet_bound() at bot.py:261, WALLET_MAX_USD bot.py:111) refuses to sign while balance x ETH/USD is 0.95 USD or more. Inside that bound a lost attempt costs gas only: PodArbTake.sol:71-79 run() is owner-only and reverts NoProfit unless the executor's WETH balance grew by minProfit after the Balancer flash loan was repaid (minProfit 0 refused), then unwraps the gain and pays the bot wallet native ETH. A send needs simulated gain above the signed cap (bot.py:345 cap = gasLimit x maxFeePerGas + L1 allowance, bot.py:355 skip when gross is not above it, bot.py:347 minProfit = cap + 1), refused when the cap is 0.90 USD or more at a 4,000 USD/ETH reference (MAX_TX_USD bot.py:115) or the gas limit is above 3.2m (bot.py:351). Priority fee bid: at most 20 pct of the simulated gross (TIP_SHARE_PCT bot.py:124), between 0.0001 and 0.05 gwei."
expected_value: "Trial: send-measured win rate. Competition, 7 days to 2026-11-22 10:47Z (README tables; scratch/r1805/routes.json, scratch/trial-podvault2-base/series-windows.json): one operator (payout 0xc0ffeefeed8b9d27..., 4 per-route executors) made 49 takes on these three pods and kept 0.0781 ETH (about 133 USD): pCircle 32 takes 0.0654 ETH, all on 2026-11-20; peaPEAS / pOHMo 15 takes 0.0081 ETH; pETHY 2 takes 0.0046 ETH. Of 20 sampled takes a gain was visible to the bot's probe 1 block before for 18, 3 s before for 9 and 90 s before for 9; with a gain above a typical gas cap (0.00002 ETH): 17 at 1 block, 4 at 3 s, 10 s, 30 s and 90 s, all four on the OHM route (0.00006-0.00021 ETH each, taken by the incumbent at tx index 4-30 for 0.0007-0.0105 gwei). Aim: the OHM-route gaps that stand for tens of seconds (about 2 a day in the window, 0.1-0.35 USD each if won) and any pCircle or pETHY gap that outlives the incumbent; the result that matters is the win rate at a 40 s timer and a 3 s feed reaction."
executor: scratch/trial-podvault2-base/contracts/out/PodArbTake.sol/PodArbTake.json
executor_args: "{bot}"
executor_note: "PodArbTake.sol, byte-identical source to the executor of the live trial-peapods-arb-base, trial-podcycle-base and trial-podvault-base (sha256 835323403217bcbf32c7c97d5c846aba854cea45edfbcdb726e09d3972d04245), compiled in this bot's own scratch directory. Constructor takes only the bot owner. run(vault, weth, amount, steps, minProfit): the flash lender, the flash token, every pool, pair, pod and vault are call arguments (step list: UniV3-style swap, V2-style swap, pod bond, pod debond, ERC4626 deposit, ERC4626 redeem); each step spends the executor's whole balance of its input token. probe() is for eth_call only (owner-only, every trial reverts). The Balancer callback and uniswapV3SwapCallback (called by the Uniswap V3 and the Aerodrome Slipstream pools) check msg.sender against the lender / pool set for this call and cleared after it. Approvals are exact and reset to 0; no setup tx; run() reverts Leftover when any step token stays in the executor. A V2 step reads reserves after its transfer and prices what actually arrived, so the pod's transfer fee is paid, not bypassed (no Router02 recipient route; human decision 2026-11-21). Live code reads EXECUTOR_ADDR_BASE or EXECUTOR_ADDR only; paper mode uses a code override taken with eth_getCode from the Base fork deployment (executor-runtime.hex)."
fork_evidence: "scratch/trial-podvault2-base/proof.py <parent> <result file> (one Base fork lease: reset, deploy the artifact with --args, fund, non-owner, guard, success per route that pays, leftovers, repeat, release). Run 1, reset 59,104,694 = parent of the incumbent ohm_fwd take 0x4a2def4d (block 59,104,695), proof-result-59104694.json: non-owner revert NotOwner 0x432c84a3ed1b38b33f727da15492d6d5ee72062815de436e05cb19ae6ac735c4; guard revert NoProfit (minProfit 1 ETH) 0xb25d9ec5ebca301faa833d6b48f0c1fc153fe94fadf4e091bf984fcdfdce78c9, 1,405,110 gas, owner -0.000140517 ETH at the fork's 0.1 gwei; success ohm_fwd at 0.005 WETH 0xc66d81f4d6eb10c4de4063ba51129b30ef6b10c513c7b0b195158986f993c7a3, fork block 59,104,698, 1,157,308 gas, gross +0.006270799 ETH, owner +0.006155069 ETH net of gas; the repeated call reverts NoProfit 0x1fc16ca33a759807e2e35005651a735b88a7c4af97f07028b825224b47252e27. Run 2, reset 60,068,179 = parent of the incumbent cir_fwd take 0x0375e70e (block 60,068,180), proof-result-60068179.json: non-owner revert 0x327379d7204945a6d53c7a65d07683004f08358c416362f43b4dbe2b7f0108c1; guard NoProfit 0x4cb0a5191ec3ab28b939d93bb29b4d22bd01a14d37a31a0c98c339c6f78b3be9; success cir_fwd at 0.005 WETH 0x2ebe0c983b099dc0aba3a2d38ed9d4b8942dd2ca5c3fdd046bf5966d036882d1, fork block 60,068,183, 768,723 gas, gross +0.004471932 ETH, owner +0.004395060 ETH net. Run 3, reset 59,812,105 = parent of the incumbent ethy_fwd take 0xb750cc17 (block 59,812,106), proof-result-59812105.json: non-owner revert 0x99d95039cdcb4b1441cdada0b94938616f96145f0ab31ae4eee60a0e69cb1acf; guard NoProfit 0x637fcea3bc3279d27c600dc598aac87030b4b73c0cb3b54df1a236f1fbecd018; success ethy_fwd at 0.005 WETH 0xbf25bcae9428012eb732d8f6926a15546938c1304968255e92d90edb3fa8a0c3, fork block 59,812,111, 767,754 gas, gross +0.001318770 ETH, owner +0.001241995 ETH net; success ohm_rev at 0.0005 WETH 0x34dc3d52a85c97b92f1c806fa27c4ac200156e1c4fe743bb445b918690e53fbf gross +0.000013836 ETH (net negative at the fork's 0.1 gwei; mechanics of the mirror route only), its repeat reverts. Executor balances (native and 14 tokens) and allowances (17 spenders) read right after each of the four successes: all zero. cir_rev and ethy_rev have NO success proof (no paying block found in 7 days): diag.py ran both as transactions on the fork, every step executed and only the final WETH repayment failed (diag-trace-cir_rev.json, diag-trace-ethy_rev.json). selftest.py 60068179: the bot's hand ABI encoding of run() for all six routes and of probe() equals cast, and its own check() at that block logs paper_sim success (cir_fwd at 0.016 WETH, gross 0.012384 ETH, cap 0.000084 ETH; selftest-60068179.jsonl)."
awaited_events: "A 40 s timer plus the feed /logs/base Swap (topic 0xc42079f9...) of the Uniswap V3 PEAS/USDC pool 0x8f8184bb6d3817910bc2ef91a393d2fe3ca8d774 (the filter two siblings already hold). A gap opens when CIRCLE, OHM, PEAS, ETHY or one of the three pairs moves. Last incumbent takes: ohm_fwd block 60,156,449 (2026-11-21 00:41:05Z), cir_fwd block 60,069,706 (2026-11-20 19:51:56Z), ethy_fwd block 59,812,108 (2026-11-20 05:33:17Z). Next: the OHM route about twice a day in the window; pCircle and pETHY in bursts when the underlying moves sharply, possibly not within the trial."
good_signs: "opportunity and paper_sim rows with gross_wei above gas_cap_wei; live send_result won with positive net_wei."
bad_signs: "No opportunity row in three days (the incumbent leaves nothing above the cap, or the pairs lost their liquidity: the pCircle pair holds about 34 USD a side); every send lost with blocks_after_winner of 10 or more; opportunity_skip wallet_at_or_above_usd_bound (one win above about 0.2 USD lifts the wallet over the 0.95 USD send bound: sweep needed, report it) or wallet_below_gas_cap; repeated simulate_revert, estimate_revert, fee_gas_or_usd_cap, feed_error, read_budget or loop_error rows."
rpc_reads_per_min: "1.5 on the timer (one probe() eth_call every 40 s covers all six routes) plus one probe per feed trigger (at most one per 3 s, about 400 a day); a route that shows a gain adds 1 eth_getBlockByNumber, up to 4 eth_call, 1 eth_estimateGas, 1 guarded eth_call, 1 slot0 eth_call and (live) 1 eth_getBalance."
alchemy_cu_per_day: "Timer 2,160 x 26 = 56,160 CU; feed-triggered probes about 400 x 26 = 10,400 CU; sweeps about 250 CU each; about 68,000 relay CU per day (0.036 USD at 0.53 USD per million CU), code cap 90,000. Feed CU for about 400 logs a day is metered by the feed (the filter is the one trial-podcycle-base and trial-podvault-base already hold)."
legal_note: "bond(), debond() and the vaults' deposit() and redeem() are the public entries of Peapods pods and lending vaults, and the swaps are ordinary pool trades that pay every fee, the pod's transfer fee included (no fee-bypass route; human decision 2026-11-21): arbitrage that brings a pod pair back in line with its underlying. The bot reads confirmed state only, watches no pending transactions, reacts to no one's unconfirmed order, and bids a priority fee only for its own public arbitrage."
expedite: false
