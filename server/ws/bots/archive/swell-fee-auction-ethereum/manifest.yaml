id: swell-fee-auction-ethereum
author: builder/claude-mythos-5-2
chains: [ethereum]
strategy: "Buy the Swell fee auction (Fee Flow fork 0xf17b5814: swETH + rswETH fees for SWELL) in one flash-funded transaction when a large fee mint makes the pot worth more than the price"
copied_from: "buyers of the lump events: tx 0x27fbe89aea3cfdbb685254a80f64a1864bd2db43afb3d8a1ecaf2c489ee7e26b (EOA 0x0423b17b0dbf8d07014ad368b4f190927889ae3a, +1.170 WETH), tx 0xfdc10be1f3f31f1006c27171360345a961a42468f63db36349682a993c63ddfc (EOA 0x814532014ff844e6c976367eb23bc61c78e820f0, +323.66 USDT)"
capital_usd: 30
allowed_contracts: []
send_route: private
max_loss_per_tx_usd: 20
max_loss_guarantee: "Executor run() reverts unless the WETH left after repaying the flash loan is >= minProfit (contracts/src/FeeAuctionBuy.sol:118, NoProfit); the bot sets minProfit = gasLimit x maxFeePerGas + 0.002 ETH (bot.py:41-45), so an included transaction ends with more native than it started, and a reverted one costs at most gasLimit 1,200,000 x maxFeePerGas 5 gwei = 0.006 ETH (private route: a reverting attempt is normally not included at all). Owner-only entry (NotOwner), deadline block (Late), flash callback accepted only from the lender set for this call."
expected_value: "Counted EV 0: every paying occurrence was taken in the farm's earliest block (N+1, ethereum R = 12 s), so by decision 2026-11-14-race-rule-seconds it may be tried but is not counted. Uncounted: 3 lump buys in 60 days kept 1.170 WETH, 323.66 USDT and about 12-22 USD (about 2,250 USD, 37 USD a day if all were won); the bot's own code takes the first two (1.170 and 0.134 WETH in the archive simulation) and passes on the third (0.0074 WETH, under its minProfit); two of the three winners sat at tx index 100 and 27 with under 1 gwei. The 4 decay buys in the same 60 days kept about gas and are not targeted. Evidence: attempts 3267, wiki mechanisms/swell-fee-auction.md, README table."
executor: scratch/swell-auction-ethereum/contracts/out/FeeAuctionBuy.sol/FeeAuctionBuy.json
executor_args: "{bot}"
executor_note: "FeeAuctionBuy(owner). No baked targets: lender, WETH, auction, assets, router, Permit2, both router calldatas, Curve legs, Uniswap V3 legs, minProfit and deadline block are arguments of run(). Approvals are given for the amount used and reset to 0 inside the transaction. Runtime 7,064 bytes (deploy well under 3,000,000 gas); executor-runtime.hex is eth_getCode of the fork deployment 0x8f7a45ebde059392e46a46dcc14ab24681a961ea (owner 0x1111...1111), used only as the paper code override."
fork_evidence: "scratch/swell-auction-ethereum/proof.py -> proof-result.json (one script: lease, reset, deploy, fund, guards, success, release). B) reset 26081572 (block of the 2.447 rswETH mint; the incumbent bought in 26081573): success tx 0x7681c9aa69276773737ec2a274a774a609c07bc813feb671dc30f80ebcea82c0 (fork block 26081577, gas 784,790, v4 swETH route), owner native delta +1.169631 ETH after gas. Guards on the same state: NotOwner 0x30cd7471 (tx 0xbd2e54ee7fa1a35872f96735ca4114907f6dc91cd99d809b4e0bd7a037ee4d2a), Late 0x86ceaa08 (tx 0xbf0c908e3f0f247804ad6280f8e178e03fe451115c8ffe040939bb557e600069), NoProfit(1.170085 WETH) with minProfit 50 WETH (tx 0xf184d3f3ec32ca5205ef8f3e097baad691bcd39c234265f6fd91ca8a5e11df06). A) nothing to take: reset 26081571 (before the mint), run() reverts 'transferFrom reverted' (the loan cannot be repaid), tx 0x44740722008f26d7bc6f62287acb15dec0be09dd96350871561e64c46176de23, owner delta = gas only. C) reset 26224357 (0.67064 swETH mint; the incumbent bought in 26224358): the v4 swETH route reverts RouterFailed(2), the Uniswap V3 route succeeds, tx 0xe2b6864dc08f1cc030f325596c685479706a0de1f8fc4e905dfc987dac0a888f (fork block 26224359, gas 507,054), owner +0.133871 ETH. Bot code path: scratch/swell-auction-ethereum/paper_path_test.py (bot.py's own calldata + code override through the relay: 26081572 1.170080 / 1.170131 WETH on the two routes, 26081571 revert, 26224357 v4 revert and v3 0.133901 WETH, 26376821 NoProfit 0.0074 WETH below minProfit 0.008)."
awaited_events: "Transfer(from 0x0) of swETH 0xf951e335afb289353dc249e82926178eac7ded78 or rswETH 0xfae103dc9cf190ed75350761e95403b7b8afa6c0 to the auction 0xf17b581496bc2669ce0931facaa1ade35029e85d, large enough to exceed the current SWELL price (3.88M SWELL, about 2,030 USD on 2026-11-21, falling about 149 USD a day). Last inflows 2026-11-09 and 11-13 (Safe transactions); last lump buy 2026-11-09; Swell's 6-hourly bot has not minted to the auction since 2026-10-21. Next: unknown, irregular; a first mint after a long pause is the lump case."
good_signs: "state rows every 300 s; mint_to_auction followed by opportunity_check with result profitable and a paper_sim row; opportunity_check revert rows while a small pot sits below the price are normal"
bad_signs: "no state row for 15 minutes; feed_err on every cycle (ethereum feed filter slots full: the bot then only polls every 300 s and would see a lump late); loop_err repeating; cu_cap"
rpc_reads_per_min: 1
alchemy_cu_per_day: 45000
legal_note: "Public Dutch auction of protocol fees, bought at the auction's own price by anyone; the trigger is a confirmed log, no pending transactions are watched; private send only hides the bot's own transaction."
