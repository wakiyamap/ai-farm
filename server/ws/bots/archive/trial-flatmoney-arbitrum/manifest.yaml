id: trial-flatmoney-arbitrum
author: builder/claude-mythos-5-2
chains: [arbitrum]
strategy: "trial: Flat Money (Arbitrum, WBTC collateral) delayed-order keeper; wake on OrderAnnounced via the feed, wait the 5 s executability delay, attach a Pyth WBTC/USD update from the local Hermes proxy, executeOrder + sell the WBTC keeper fee to native ETH in one executor tx, native gain or revert."
copied_from: "EOA 0x45d83e658e2f70ba83e4e519f792f065c4a01d7d, which took all 45 executeOrder calls of the last 7 days on OrderExecutionModule 0x7e50ad6e467d9fafc3b4bfd003247ceaa2f17e5b, e.g. tx 0xd5e1af2d9a6be6ff7d95fb77daeeae373a3ef274bc8399a142d5503a2cfd87f2 (block 525070834, keeper fee 231 sat WBTC); attempts:1829, 1835, 1897."
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor FlatOrderKeeper.run reverts NoProfit unless the native balance grows by minProfit (scratch/trial-flatmoney/contracts/src/FlatOrderKeeper.sol:92-94), so a lost attempt costs gas only; msg.value is 0. Gas cap per send in bot.py:57-66 and 292-305: gasLimit = eth_estimateGas x 1.30 (never a constant; refused above 3,000,000), maxFeePerGas = min(0.95 USD / (Hermes ETH/USD x 1.15, or 4,000 USD when unreadable) / gasLimit, 90% of the simulated gain / gasLimit); no send unless gasLimit x maxFeePerGas is < 1 USD and below the simulated gain, and that cap is passed as minProfit. Priority-fee bid: at most 20% of simulated gross (BID_SHARE, bot.py:66), never above the fee cap."
expected_value: "trial, win rate to be measured live. 7 d competition (attempts:1835, scratch/trial-flatmoney/timing.json, blocks 522693627-525113627): 45 executions, 1 taker (EOA 0x45d83e65...), landing 2-6 s after the order becomes executable (median 11 blocks), priority fee 0, tx index 1-13. Gross per take 199-262 sat WBTC (median 0.138 USD), about 6.4 takes/day = 0.89 USD/day for the whole class; one send costs about 0.032 USD (877k gas at 0.02 gwei, fork). The bot aims at whatever share its 1-2.5 s send beats the incumbent's 2-6 s; at a 30% share that is about 0.2 USD/day net. A late attempt is normally not sent (the simulation already reverts OrderInvalid)."
executor: scratch/trial-flatmoney/contracts/out/FlatOrderKeeper.sol/FlatOrderKeeper.json
executor_args: "{bot}"
executor_note: "constructor(address owner) only. run(module, account, bytes[] update, feeToken, pool, weth, minProfit) is owner-only: module, fee token, UniV3 pool and WETH are call arguments, nothing is stored between calls. The pool must hold exactly {feeToken, weth} (BadPool otherwise); the swap callback accepts only the pool set for this call and is cleared after it; no approvals are given (the callback transfers the exact amount owed). The whole fee received in this call is sold, the WETH unwrapped and the full native balance paid to the bot wallet. No principal, no flash loan. Owner-only sweep(token) for strays."
fork_evidence: "scratch/trial-flatmoney/proof.py (lease; reset arbitrum 525070833 = parent of the incumbent take 0xd5e1af2d..., clock set to its timestamp 1794928829; deploy, non-owner, guard, success, nothing-left; release), output scratch/trial-flatmoney/proof.out. Deploy 0xc33b1b70fecb16d0af617fc534b4e93b189acd87969f04726b24843bf231fc98 (836,089 gas). Success 0x24d245c1933d37e8639dbdc42498313ae5f563db6923373dfd98c2d087fe278e (fork block 525070837, gas 876,668): 231 sat WBTC fee received and sold, owner native +82,602,606,487,086 wei before gas (= the eth_call simulation), executor left with 0 WBTC / 0 WETH / 0 native. Reverts: nothing to take (order already executed) 0x7ca92f6ce719516d76a413a14ec9c4f1fa897a2078e4889264c392b0e233407a OrderInvalid 0x1bed8430 (gas 400,077); minProfit above gain 0x2a357efa79237ef3703020d9881ed127734656c7d7c3ee34ce97145b9e33b3b2 NoProfit 0x31708d59 (owner delta + gas = 0); non-owner 0x2c0fe9ad8dfbbcf456b156b32e32e80ec83bc0f52d7b56400e1770e810e8d52a. The Pyth blob in the proof is the incumbent's real signed update. Paper override = eth_getCode of that deployment (executor-runtime.hex). scratch/trial-flatmoney/selftest.py runs the bot's own handle() paper path on the same fork state: opportunity + paper_sim success, gain 82,602,606,487,086 wei, gas limit 1,315,603 from eth_estimateGas x 1.30; then a real Hermes read (publish lag 1.2 s, 631-byte update) and a reread at the relay head (selftest.out)."
awaited_events: "OrderAnnounced (0x0aaed4f1864bd4663319a4a0ceb0b5f0766e7e58ee27cf50c48232258d5f582c) on OrderAnnouncementModule 0x2326bb21b769d81e134c9b305ca156f989249fe7: 50 in the last 7 days (about 7/day, 3 accounts make most of them), each executable 5 s later for 60 s. Next: within hours."
good_signs: "logs/bot.jsonl: hermes_ok at start; order rows about 7/day with seen_s_after_announce near 1; opportunity + paper_sim success with sim_s_after_executable under 2.5; order_result rows where winner_s_after_executable is larger than sim_s_after_executable (the simulated send would have been first); live: send_result won."
bad_signs: "hermes: errors (401 = the trial key ended, about 2026-12-02); order_result taken_before_sim or last_error OrderInvalid on every order (always late: close as blocked_infra with the seconds short); pyth update older than executableAt for many seconds (Hermes lag); opportunity_skip gross_not_above_gas_cap on every order (gas price above about 0.06 gwei); read_budget rows; live send_result lost on every send."
rpc_reads_per_min: "about 0.2: eth_blockNumber + eth_getLogs every 600 s, and about 6-10 reads per announced order (7/day)"
alchemy_cu_per_day: "about 20,000 (0.011 USD): feed about 6,000 (7 logs x 35 CU + 4 CU/min) + relay about 14,000 (safety poll 144 x 85 = 12.2k, orders 7 x 250 = 1.8k); relay reads hard-capped at 60,000 in code"
legal_note: "The keeper fee is a public payout of the protocol to any caller of executeOrder (no role gate; stranger eth_call succeeds, scratch/trial-flatmoney/open_check.json). No mempool watching: the bot reacts to mined OrderAnnounced logs and the protocol's own 5 s delay. Pyth data comes through the farm's Hermes proxy."
expedite: false
