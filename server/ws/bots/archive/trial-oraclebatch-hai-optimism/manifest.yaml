max_loss_per_tx_usd: 0.5
max_loss_guarantee: "act() reverts unless the ETH gained >= minProfit (scratch/trial-oraclebatch-hai/contracts/src/HaiOracleBatchTrial.sol:94), unless every listed item paid (minItems, :74), and at a view probe when the first item is already taken (:61, 35,940 gas), so a lost race costs only gas; signed cap = gas limit (300k + 130k per item with a 700k floor: 950,000 for 5 items, 700,000 for the 2-item window, which needed 563,705 gas at the parent of block 159639348, scratch/trial-oraclebatch-hai/gas2.py) x maxFeePerGas (ceiling 0.11 gwei) = at most 1.045e-4 ETH ~ 0.19 USD at ETH 1826, plus the OP L1 data fee (4.4e-9 ETH on the fork; on OP the native wallet balance, 3 USD here, is the enforceable worst case). Priority bid: fixed 0.10 gwei = 46% of the expected gross at the gas used, never more than 50% of gross (for windows under 4 items the bid is sized at 600k gas, above the heaviest measured use, about 0.056 gwei) (bot.py fees(), PRIO_MAX_SHARE). The bot sends only when the quoted gross > signed gas cap + L1 estimate (bot.py main(), the go flag) and passes minProfit = that amount + 1 to the executor, so the chain enforces the same condition; one send per window; a signer rejection is final"
expected_value: "trial bot: the EV rule is waived, the win rate is measured live. Competition in the 12 h before placement (scratch/trial-oraclebatch-hai/census.json, attempts:1497): the 5-item window was taken 12 of 12 times in the due block at index 1 by 3 keeper executors; 10 winners bid 0.188-0.191 gwei (74% of gross on 660k gas), 2 windows went at 0.022 and 0.08 gwei. The farm cannot sign more than ~0.177 gwei under gross > gas cap (950k limit), so this bot aims only at the cheap windows: a win nets ~9.1e-5 ETH (0.167 USD, fork), a lost attempt costs 3.3e-6 ETH (0.006 USD), break-even win rate ~3.5%; if 2 of 12 held, ~0.56 USD/day"
executor: scratch/trial-oraclebatch-hai/contracts/out/HaiOracleBatchTrial.sol/HaiOracleBatchTrial.json
executor_args: "{bot}"
executor_note: "Review fix 2026-11-17 (run e2920999, review 2026-11-16 23:41Z): the sale pool is no longer a constant. act(cTypes, probe, pool, minItems, minProfit), selector 0x3b796add: constructor arg is {bot} only; the item list, the probe oracle, the sale pool, minItems and minProfit are call arguments (no baked targets, no setup tx). Remaining constants are the HAI protocol's own contracts, the same for every item (OracleJob, CoinJoin, SAFEEngine, the HAI system coin), and the OP Stack WETH predeploy. The pool passed in must have token0/token1 = HAI/WETH in either order (else BadPool 0xb2c02722); the swap direction follows the token order. Callback counterparty: the pool is written to the private storage slot activePool right before pool.swap (:108) and cleared right after it (:115); uniswapV3SwapCallback reverts NotActivePool (0xbf94dd61) unless msg.sender is that pool (:139), so it is closed outside act() for everyone, the bot wallet included, and pays only the HAI owed to msg.sender. No ERC-20 approve is given anywhere. Other steps unchanged: optional staticcall probe.shouldUpdate() reverts NotDue (0x47a2375f) before any job; each workUpdateCollateralPrice is a low-level call so one failed item does not undo the others, and the loop stops once minItems is out of reach; the internal-coin credit (done x rewardAmount()) leaves through CoinJoin.exit, for which the executor gives SAFEEngine.approveSAFEModification(CoinJoin) and takes it back with denySAFEModification in the same transaction, requiring safeRights(executor, CoinJoin) == 0; WETH is unwrapped and all ETH goes to the bot wallet. Runtime 3,398 bytes. Paper sims use eth_call at relay latest with from = the proof's bot address and a code override = eth_getCode of the fork deployment (executor-runtime.hex sha256 5defe544f5d999f469b5dd8f9d3f6589ec2d97565a21bddc50fc74b02471f872; source sha256 cdee5f21c0aa96f0da734cfab2d0923dd3934f47b64200b1d589227fd14df1a8)"
