07491 wei (fee only; the jobs roll back); uniswapV3SwapCallback called directly reverts NotActivePool from a stranger (tx 0x55c7e3f430f654a27ef2293cef352e793b540c37a7d4c6361da35eb1f33a42f6 status 0 gas 24521) and from the bot wallet (eth_call); act from a non-owner reverts NotBot (tx 0x57feb9e0f700a1df355aedfb27a24e058dae47ce92a117d458138c492d5c273e status 0); then SUCCESS 5 items again at block 159623942 (same hash as the phase-1 success: same sender, nonce and calldata on a fresh reset), wallet delta +90853488040503 wei. After every case the executor holds 0 HAI / 0 WETH / 0 ETH / 0 SAFEEngine coinBalance, safeRights(executor, CoinJoin) = 0 and storage slot 0 (activePool) = 0. Relay check at head 2026-11-17 00:45Z (scratch/trial-oraclebatch-hai/enc_test.py): bot calldata equals cast calldata; sim at latest reverts NotDue (0x47a2375f); sim with block time = due 1794879055 returns profit 169272719246973 wei"
awaited_events: "the hourly due second of a multi-item window: lastUpdateTime() + updateDelay() (3600 s) of the DelayedOracles. 5-item window (OP, RETH, TBTC, VELO, WETH) last taken 2026-11-16 22:30:55Z (block 159634739, tx 0x0146b0f8c8ed14c827d7b40d88488faff12db91f0c90d499afc849b943b60ed3), next 23:30:55Z and every hour after; HAIAERO + MSETH share another hourly second. Timer only, no polling, no feed filter"
good_signs: "oracle_resolved for the items, then per window: next_window with 2+ items, window (send true, gas_limit 950000 for 5 items), sim_ok at latest+time_override with profit_wei ~1.68e14 for 5 items, window_result with taker_tx / taker_block / taker_prio_gwei and would_outbid_taker true on the cheap windows; live: sent + receipt per window, window_result outcome win (status 1, gasUsed ~778k) on some windows and lose at ~36k gas on the others, landed_minus_due_s settling at 0"
