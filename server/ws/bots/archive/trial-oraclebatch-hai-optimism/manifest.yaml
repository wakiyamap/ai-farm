chains: [optimism]
strategy: "trial: HAI OracleJob on optimism pays 0.05 HAI per collateral item per hour to anyone; this bot takes the windows where several items are due in the same second (OP, RETH, TBTC, VELO, WETH; HAIAERO + MSETH) in one transaction: all jobs, CoinJoin exit, HAI sold for WETH on the UniV3 fee-3000 pool, unwrapped to ETH, reverting unless the ETH gained is at least minProfit. It bids a fixed 0.10 gwei and aims at the windows the top bidders leave cheap (2 of 12 in the 12 h sample); win rate measured live (decision 2026-11-17-cheap-chain-trials)"
