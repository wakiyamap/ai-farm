id: trial-feusd-redeem-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: feUSD discount -> Felix redemption round trip on HyperEVM. When feUSD trades below its redemption value in the HyperSwap V3 feUSD/USDT0 pool (0x44a59f78), one tx flash-borrows USDT0 on Morpho Blue, buys feUSD, redeems it at Felix CollateralRegistry (permissionless redeemCollateral) for WHYPE + kHYPE, sells kHYPE -> WHYPE and just enough WHYPE -> USDT0 to repay, unwraps the rest and pays it to the bot wallet as native HYPE, or reverts. The bot waits on the feed for the pool's Swap event and simulates before every send."
copied_from: "actor EOA 0x0da1f154 through its owner-gated executor 0x1438e66b049ab1df862b56126969911afd4e97c1: tx 0x30ba123ac9bbee2a970571688eb0805777455b5e23f528aec3241c91a8eb9613 (block 51431192, 160 USDT0, +0.059494 USDT0, 1,667,457 gas; trace scratch/feusd-30ba-trace.json). Same legs and pools; changed: profit leaves as native HYPE (exact-output repay swap + WHYPE unwrap) instead of USDT0, and the size is chosen by simulation (40-640 USDT0) instead of a fixed 160."
capital_usd: 20
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor FeusdRedeemTake.take reverts NoProfit() unless the owner's native balance grows by minProfitWei (scratch/trial-feusd-redeem-hyperevm/contracts/src/FeusdRedeemTake.sol:103 and :106; also tx.gasprice <= maxGasPrice and deadline, :83), so a lost attempt costs gas only. Gas cap per send in bot.py:61-65 and 250-264: gas limit 1,950,000 x maxFeePerGas, maxFeePerGas <= 2 gwei hard (0.0039 HYPE), and no send unless that cap valued at the on-chain WHYPE/USDT0 pool price x 1.15 is under 0.95 USD, the base fee is under it, and the simulated gain is above it; minProfitWei is set to the cap. Priority-fee bid: at most 30% of simulated gross (BID_SHARE, bot.py:65), never above the fee cap."
expected_value: "trial, win rate to be measured live. 7 d competition to 2026-11-17 05:40Z (attempts:1591, 1595, 1605; scratch/feusd-pnl.json, 123 receipts): 2 takers on this spread. Felix-redemption route (this bot's): EOA 0x0da1f154, 96 calls / 83 paid, gross per win median 0.066 USD, max 0.87, gas per attempt 0.018 USD, priority 0.03-0.05 gwei, net about +2.3 USD / 7 d. Pool-only route: EOA 0x6b78f490, 27 calls / 3 paid, net -0.74 USD. No fee auction. The bot's evaluate() at the block before four incumbent wins simulates +0.93, +0.90, +0.23 and +0.094 USD (selftest), larger than the incumbent's take on the two big windows because 640 or 320 USDT0 beats its fixed 160. The bot aims at windows the incumbent leaves open for 3 blocks or more, and at the part of a window above 160 USDT0; one lost attempt is about 1.86M gas = 0.014 USD at the 0.1 gwei base fee."
executor: scratch/trial-feusd-redeem-hyperevm/contracts/out/FeusdRedeemTake.sol/FeusdRedeemTake.json
executor_args: "{bot}"
executor_note: "Deploy gas 1,160,496 on the rerun, below the 2,000,000 HyperEVM cap. constructor(address bot) only; all protocol targets and limits are Route call arguments. The Morpho callback accepts only this transaction lender and exact data, and both guards clear after the loan. Approvals are for the exact amounts and clear to zero. The feUSD redemption rounding remainder is transferred to the owner inside take() before the native HYPE payout. Fork success left executor USDT0, feUSD, WHYPE, kHYPE, native and four checked allowances all zero. Owner-only sweep(token) remains for unexpected dust."
fork_evidence: "Fix rerun 2026-11-17: scratch/trial-feusd-redeem-hyperevm/proof.py leases, resets HyperEVM fork at head 51490215, deploys, funds owner and stranger, checks no-window and nonowner reverts, creates a discounted feUSD window by stranger swaps, calls take, checks balances and approvals, checks an exhausted-window revert, and releases. Full result: scratch/trial-feusd-redeem-hyperevm/proof-result.json; deployment 0x6891519e680db78ac84b5d2656bf8853528bb9bd3a938ddcbf72119e12485045 (1,160,496 gas); success 0xb6e4c176b4f82356e947ff80a85e4b82e680020689a38bb8ed50723a70553998 (1,738,449 gas, 640 USDT0; owner +0.664414141646606964 HYPE net of gas); no-window revert 0x6ef9623ec57af6bdaf9acff5e027a3ad42dca761fd85a56834d8b65b45b614ba; nonowner revert 0x55836fe455d9a7d7e609534702ae3c461361d91daaabb25c687587934f847a34; exhausted-window revert 0x5accf974167e1b02402538dd5d3de569fc9f2958de0e19e6f2477c833768062b. All executor route token balances, native balance and four checked allowances are zero. Paper runtime refreshed from eth_getCode of this deployment at 0x8f7a45ebde059392e46a46dcc14ab24681a961ea. Earlier historical simulation evidence remains in scratch/trial-feusd-redeem-hyperevm/selftest-result.json."
awaited_events: "Swap on the HyperSwap V3 feUSD/USDT0 pool 0x44a59f7859f199768e585133e0a5ab2da1350600 that leaves the price at or under 0.999 with the redemption route profitable. Incumbent wins: 83 in the last 7 d (about 12/day), the last one known at block 51431192 (2026-11-17 about 01:45Z). At placement the pool price is 1.00326 (no window); the next one comes with the next feUSD sale into the pool, typically within hours."
good_signs: "logs/bot.jsonl: swap rows as the pool trades and a poll row every 10 min; opportunity + paper_sim success rows when the price dips under about 0.998; live: send_result rows with result won and gas_used about 1.6-1.8M."
bad_signs: "feed_error or relay_error on every cycle; read_budget rows; simulate_revert on every dip under 0.995 (route, pool or Felix changed); opportunity_skip gas_cap_over_usd_limit (HYPE above about 210 USD: lower MAX_FEE_WEI); live send_result lost with blocks_after_winner >= 0 on every send (always late: report as blocks late)."
rpc_reads_per_min: "about 0.1 when quiet (one slot0 eth_call per 10 min) plus one feed long-poll per 55 s; up to 8 relay reads per evaluation while the pool price is at or under 0.999 (re-evaluated only after a further 0.05% drop or 10 min)"
alchemy_cu_per_day: "about 30,000-45,000 (0.016-0.024 USD): feed filter about 17k (460 Swap logs/day x ~900 bytes x 0.04) + ~5k upkeep, safety poll 3.7k, evaluations up to about 19k worst case; hard cap 90,000 relay CU/day in code."
legal_note: "Felix redemption (redeemCollateral) is a public protocol function that pays collateral at face value to any feUSD holder; buying discounted feUSD and redeeming it is plain arbitrage that restores the peg. The bot reads mined state (feed logs, relay), watches no mempool and no pending transactions; it bids a priority fee for a public opportunity."
expedite: false
