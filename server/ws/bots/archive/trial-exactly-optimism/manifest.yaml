id: trial-exactly-optimism
author: builder/claude-mythos-5-2
chains: [optimism]
strategy: "trial: flash-funded Exactly Protocol (OP Mainnet) liquidation of exaUSDC debt (collateral WETH, OP, WBTC, USDC.e or USDC), after a lower Chainlink ETH/USD or OP/USD round on the feed or a timed accountLiquidity scan"
copied_from: "Public Exactly OP Mainnet liquidators, each calling its own contract (attempts:1727): the fork-proof case is tx 0x058f8a4fd284eac508983529e00d15dbfce6b21d6eb2e717d385ca26b7c3653c (block 159512297, 434.37 USDC repaid on borrower 0x549ac348, WETH seized, receiver 0x8a4efd06bc0fa3086af6a925646a051fe0d0ee24); other takers: 0x092aa48824d261faab84cda4b4fdd6a0be9e07b6 in tx 0x9c3f9e8445f0a129260abb9e7f19fd4020f0756a12f34551e97bdc596ae7644c, 0x5ac9bc14376bf2727c6211960cf3cec1e2f295bd in tx 0xb13495f632b24926b675de7c635e855c3466a1fa891c650e6476954f72f97c16"
capital_usd: 15
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialExactlyLiquidator.sol:66 reverts NoProfit unless the USDC balance grew by at least minProfit, and :68 pays the whole gain to the bot in the same tx; Market.liquidate reverts on failure (InsufficientShortfall when healthy), so a lost attempt costs gas only. bot.py:407-415 sets the fee ceiling so maxFeePerGas x gasLimit + 0.02 USD L1 allowance < 0.90 USD (never above 0.5 gwei) and requires simulated gross > that signed gas cap (:412), and :417 sets the on-chain minProfit to the gas cap. Priority fee bid is at most 50% of the simulated gross (BID_SHARE, bot.py:408). No principal: the repay is a Morpho flash loan repaid in the tx; the bot wallet holds gas only (15 USD, under the 18 USD OP Mainnet cap)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7 d (attempts:1727, blocks 159357984-159660384): 115 Liquidate events, all exaUSDC debt, 14,627 USDC repaid, 113 borrowers, six receiver contracts (0x092aa488 24 events / 9,730 USDC; 0x5ac9bc14 11 / 4,460; 0x8a4efd06 1 / 434; 0xa24b73b8 72 dust events / 2 USDC; 0x230be3ed 4; 0xc76da7fe 3); 32 events >= 1 USDC, 16 >= 20 USDC, 10 >= 250 USDC; liquidator incentive 5%. Parent-block check of 45 captures: 18 already takeable at capture-1 (2 s), 8 at capture-2, 6 at capture-5, 3 at capture-30; of the 23 probed captures >= 5 USDC only 4 were takeable at capture-1, the rest flipped inside the capture block (0x092aa488 takes in the block of the Chainlink round). The bot aims at the takes left for a block or more; the proof case paid 22.02 USDC for under 0.01 USD of gas."
executor: scratch/trial-exactly-optimism/contracts/out/TrialExactlyLiquidator.sol/TrialExactlyLiquidator.json
executor_args: "{bot}"
executor_note: "Owner-only liquidate(morpho, job, maxAssets, minProfit). Debt market, borrower, seize market, both underlyings, swap router, fee tier and flash lender are all call arguments; constructor takes the bot address only; no setup transaction. The flash callback accepts only the lender set for the running call (cleared at the end). Approvals are exact and reset to zero (market, router); Morpho pulls exactly the approved repayment. Exactly pays the seized collateral out as the underlying token, so there is no redeem step. Profit leaves as USDC. Live address from EXECUTOR_ADDR_OPTIMISM or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-exactly-optimism/proof.py (lease, reset optimism 159512296 = parent of the historical capture 0x058f8a4f..., deploy artifact, fund owner, guards, nothing-to-take, success; output proof-result.json). Success 0xf8d6823fd9ebe806498ed30f9f44b332b56a99938f41d2080050f88b0b0e7bde block 159512301, gas 1018339, owner +22.020528 USDC, native -1022659344377 wei (gas), borrower exaUSDC debt 729.574559 -> 294.115382, executor USDC/WETH/native and market/Morpho/router allowances all 0. Correct reverts: NoProfit guard 0x7f0f4f5ebf8587c80f2abebd6355dad16ef93325b825f82f6b104d3b8fc09027 (0xe39aafee); non-owner 0x0723f30b62b6798d32dfb6b926f6ee35ee000a1312a442e727757cb6ae2d6f93 (NotOwner 0x30cd7471); nothing to take 0x635f141d69ef26c17802fa18fea2a83fa6bf3269f875949d25889b8550c2ab00 (account without a position, InsufficientShortfall 0x095bf333, gas 183734, owner USDC delta 0). The success lands at parent+5 because deploy and the three reverts consume fork blocks; the first heavy send can take over 30 s on a cold fork (the script waits for the receipt). scratch/trial-exactly-optimism/selftest.py: bot calldata equals cast calldata; the bot's own seize_options + best_take through the relay at block 159512296 with the paper code override return 22.020528 USDC."
awaited_events: "AnswerUpdated on the Chainlink ETH/USD (0x16c04812fa9db1d0236c3841dda8e86225bc3f3e) and OP/USD (0x07c15082440a5e435ba15fe9ab704daead84897a) aggregators on the feed (328 + 354 per day on 2026-11-17); a lower answer triggers a re-read of the accounts within 3% of the edge. Safety scan of the exaUSDC debtors every 10 min, every known borrower every 6 h, new borrowers from Borrow / BorrowAtMaturity logs every 30 min. Last Liquidate in the census: block 159652926 on 2026-11-17. Next occurrence is not predictable (price moves)."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is)."
bad_signs: "No opportunity row in 7 days; every send lost; simulate_revert on every underwater account (bad debt, no swap route); read_budget rows (65k relay CU cap hit); feed_error rows repeating (429 from the feed)."
rpc_reads_per_min: "about 1.2: 4-8 Multicall eth_calls per 10 min (debtor scan in batches of 50), one eth_call per lower price round (about 340 per day), 7 reads per 30 min for discovery and gas/ETH price, plus about 15 calls per examined underwater account"
alchemy_cu_per_day: "about 48,000 relay CU/day (debtor scan 6 x 144 x 26 = 22,464; rounds 340 x 26 = 8,840; discovery 48 x 194 = 9,312; full scan 4 x 30 x 26 = 3,120; attempts about 10 per day x 400 = 4,000) plus feed about 24,000 (682 events/day x 654 bytes x 0.04 = 17,840, idle long-polls about 5,800) = about 72,000 CU/day = 0.04 USD/day at 0.53 USD per 1M CU. The code stops relay reads at 65,000 CU per UTC day."
legal_note: "Public Exactly Protocol liquidation incentive for repaying under-collateralised debt, open to any caller on OP Mainnet (no allowlist there). Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions. Bidding a priority fee for a public reward is in scope of the trial decision."
expedite: false
