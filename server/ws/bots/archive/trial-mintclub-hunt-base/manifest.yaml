legal_note: "The Bond's public mint and burn (the bonding curve the protocol runs for anyone, royalty paid in full), public Uniswap v4 pools and a public flash loan. Plain two-venue arbitrage on confirmed state, read on a timer: no mempool watching, no reaction to pending transactions, no holding (everything is back in ETH inside the transaction)."
