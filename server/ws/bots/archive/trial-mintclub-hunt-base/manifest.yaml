id: trial-mintclub-hunt-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: the Mint Club V2 bonding-curve tokens whose reserve is HUNT (MT, DR, HEPE, ONCHAT, SIGNET) have two prices on Base, the Bond's step price (public mint / burn against HUNT, royalty 0.1-1 pct each way) and a hookless Uniswap v4 native-ETH pool each; HUNT itself has a hookless v4 native-ETH pool. When they disagree by more than the fees, flash-borrow WETH from Morpho, buy the token on v4, Bond.burn it for HUNT, sell the HUNT for ETH on v4 (or the reverse through Bond.mint), keep the difference as native ETH"
copied_from: "0xf7c70a04d2c0bba340fffb1816d30a25dd3562f6 (sender EOA 0x3de7e4a06757a5fac43c78a2f3eef1ab74ea64ee; 18 takes on these five tokens in 7 days, e.g. tx 0xccb1b4fb4d6813ceea19a090de3336ade9f5809cffcd8399b94632e4fdb2c545, block 60062501: Morpho WETH flash 0.009309 ETH -> 9,652.6 ONCHAT on v4 pool 0x905a1742.., Bond.burn for 225.28 HUNT, sold on v4 pool 0xaa40332c.. for 0.009387 ETH, +0.0000781 ETH: the same route as this bot) and 0xb4008dc2ad60c9da12b2088e66fedd00a85ff135 (16 takes), 0x7b804b6c94c22cdc8327e51300ebcd76779be92b (5 MT burns through the HUNT / MT v4 pool, tx 0xe2ba49e85909889f38bde8b4c151393b49f3d1c9cc81edd828fb9f5ecfa58734, +0.000049 ETH), 0x48682a623b2a686e905c8e801a925d9885fb30a0 (3)."
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "Gas only. BondArbV4.run reverts NoProfit unless its WETH + ETH balance grew by at least minProfit (and Morpho's own repayment pull fails first when the round trip lost), and the bot sets minProfit = the send's gas cap in wei (bot.py:328 cap = gas_limit * max_fee + L1_FEE_ALLOW_WEI, passed as min_profit to run_calldata by send_live, bot.py:269), so an included send either pays more than its own gas cap or reverts and costs gas. A send happens only when the simulated gross > 1.3 x that cap (bot.py:336, SEND_MULT). Caps in bot.py:60-64: MAX_FEE_CAP_WEI 0.15 gwei, GAS_LIMIT_MAX 2,400,000, so at most 0.00036 ETH + L1 fee = 0.90 USD a send at the 2,500 USD/ETH reference, and MAX_TX_USD 0.95. Typical attempt: 0.75-1.9M gas at 0.005-0.013 gwei = 0.000004-0.000025 ETH (under 0.05 USD) including the L1 data fee. Priority fee bid: at most 1/10 of the simulated gross, never above 0.1 gwei (TIP_SHARE_DEN, TIP_MAX_WEI). No principal: Morpho flash loan."
expected_value: "Trial: measures the win rate by sending. 7 days, blocks 57476167-60500167 (scratch/rc3f9/bondhist.py scan, scratch/rd313/mkroutes.py, family-events.json): 61 Bond mint / burn events on the five tokens, about 50 by arbitrage contracts (0xf7c70a04 18, 0xb4008dc2 16, 0x7b804b6c 5, 0x48682a62 3, 0x4d6823b0 5, 0x00000000..be226afd / ..93c08781 4), in 5 bursts that follow a move of HUNT / ETH or of one token pool. scratch/trial-mintclub-hunt-base/windows.py ran the bot's own screen, size and exact run() at the parent block of each event (relay eth_call with the paper code override, windows.json): this route was profitable at 39 of 61 parents, 36 of them above 0.00002 ETH; typical 0.00003-0.0004 ETH (0.05-0.7 USD at about 1,670 USD/ETH, the price noted in the hDRB bot's README today, not re-measured), the DR launch burst of blocks 57774585-57781494 much larger (0.0018-0.016 ETH a parent; those values overlap, each take shrinks the next). Incumbents pay no priority fee (tx index 2-201) and a burst lasts 91-256 s (first to last take), so a 30 s look meets the later takes of a burst; the first takes come within seconds of the trigger and are theirs. Aim: 1-3 wins on a burst day, 0.05-0.5 USD each. At placement (2026-11-21 21:01:42Z) a look at the head already found a HEPE burn worth 0.0000128 ETH against a 0.0000089 ETH gas cap (selftest.py, paper_sim success)."
executor: scratch/trial-mintclub-hunt-base/contracts/out/BondArbV4.sol/BondArbV4.json
executor_args: "{bot}"
executor_note: "BondArbV4(address bot), Solidity 0.8.24, 5,798 runtime bytes, deploy 1,308,133 gas on the fork (limit 3,000,000). It is the reviewed BondArb of trial-mintclub-bond-base with the reserve leg moved from a V3 pool to a second hookless v4 native-ETH pool (the HUNT / WETH V3 pool holds 0.002 WETH; the V3 code and its callback are removed). run(P) is owner-only; P is one static struct: morpho, pool manager, bond, WETH, reserve token, bonding-curve token, the token pool's fee and tick spacing, the reserve pool's fee and tick spacing, direction, WETH amount, tokensToMint (mint direction), minProfit. It flash-borrows WETH from Morpho and unwraps it; burn direction: v4 unlock (exact-input native ETH -> token, settle with value, take the token), approve the Bond for exactly the tokens held, Bond.burn, approval back to 0, v4 unlock reserve -> ETH; mint direction: v4 ETH -> reserve, approve the Bond for the reserve held, Bond.mint(tokensToMint), approval to 0, any reserve left -> ETH, token -> ETH. Then wrap, approve Morpho for the loan, and after the loan: approval to 0, NoProfit unless WETH + ETH grew by minProfit, unwrap everything and pay the owner in native ETH (receive() present). Nothing is stored or baked in, no setup tx; the two callbacks (onMorphoFlashLoan, unlockCallback) answer only the counterparty set for the running step and cleared after it. Constructor arg = the bot wallet only."
fork_evidence: "scratch/trial-mintclub-hunt-base/proof.py (one lease, two resets; result proof-result.json; no fixture, owner funded with gas only; the bot's own read_state / candidates / best_size / run_calldata against the fork). BURN: Base fork reset to 60062500 = parent of the incumbent's take 0xccb1b4fb... (block 60062501). Deploy 0xeb40e694508a86c070666ae43be530e2bf23032ed8fd40482d57fe718a1a356c (1,308,133 gas); the bot chose ONCHAT burn, 0.01 ETH, eth_call gain 77786197664234 wei (the incumbent took 78077159949589 wei at 0.0093 ETH). Non-owner 0x171bc57a7c0132e10f9840299d3783abcd8defc996d0cf665dc3366614e1d1d4 reverts NotOwner; guard 0x8eab7872ca8ad3d0d365c05b02f37207b9c662027c8ed2d295b9b82ea6390baa (minProfit = gain + 1) reverts NoProfit(77786197664234, 77786197664235), owner out only gas; success 0xa9719957bc96e7d8c8ce212ac4d1130bb6f6840dbb3011223a54f740f2501426 fork block 60062504 (state = block 60062500 plus the proof's own txs), 1,588,969 gas: owner native delta + gas = +77696704925362 wei (the eth_call value less the 8.9e10 wei L1 fee the fork receipt does not itemise); the same call again 0xbd987d066742dab103a8516f118c7cacbd1fbc9ed0c822bda20911246e6bb550 reverts (gap closed, loan cannot be repaid); nothing to take: the mint direction 0x6aa569ba7f0001c2f9afd6de2f4bbbccea935c2167b03faa8d3f7a3b2944e8a1 reverts. MINT: reset to 57774584 = parent of the incumbent's take 0x6f1f44d2... (block 57774585): the bot chose DR mint, 0.01 ETH, eth_call gain 2784146425442347 wei; non-owner 0x049046c6c243e1f1c76abee9a1a0a9bba3241824e24424feae51977b033ef080 NotOwner; guard 0xa031828ae1b564bdafe5d8d37461d608819a57aa4a7b2c25f0d12c62735ca7a6 NoProfit; success 0xb310d958261779a5cb5d5579071fde9a8c4b5c47708f9748ee8971cfcd0be2a4 fork block 57774588, 1,651,971 gas: owner native delta + gas = +2784143131671718 wei; repeat 0x36bb2f6b7a25631a8411af3009226eff666a03f20280db6fc92f085883c3c3c7 reverts; opposite direction 0x92e56a86ac5d5301af9ace3b53385a8547bf1fd9cbf7463cebff7bdbe1436fc6 reverts. Executor leftovers in both cases: 0 WETH, 0 HUNT, 0 token, 0 native. The paper code override executor-runtime.hex = eth_getCode of this deployment; windows.py and selftest.py run the paper path with it through the relay."
awaited_events: "A move of the HUNT / ETH v4 pool or a trade on one of the five token pools that leaves a round trip above the fees (2.3-3.2 pct: v4 1.1 twice plus the royalty). Last incumbent take: block 60063684 (2026-11-20 19:31:52Z, block timestamp); 5 bursts in the 7 days before block 60500167. A small HEPE burn gap was open at the head at 2026-11-21 21:01:42Z. Next burst: unknown, expected within one to three days while HUNT trades."
good_signs: "paper_sim success lines; live send_result won with gross_wei well above cap_wei; opportunity lines on several tokens in the same minutes (a HUNT move)"
bad_signs: "send_result lost several times in a row (an incumbent takes within one look: the 30 s timer is too slow); only opportunity_skip gross_below_send_line (gaps stay under 1.3 x the gas cap); loop_error lines (a getter failed: pool or Bond changed); no check or opportunity line for days (HUNT and the tokens stopped trading)"
