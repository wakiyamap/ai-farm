max_loss_per_tx_usd: 20
max_loss_guarantee: >
  One transaction through the bot-deployed AaveLiquidator (src
  scratch/aave-executor-base/contracts/src/AaveLiquidator.sol, forge build OK solc
  0.8.24, same artifact as aave-watcher-base). Its OWNER-ONLY liquidate()
  (selector 0x9153f799) ends with require(balAfter >= balBefore + minProfit + 1,
  "NO_PROFIT") on the executor's debt-asset balance measured BEFORE the flash
  loan, so any shortfall rolls the tx back: worst case is gas only. Mainnet gas
  is bounded by the tx itself (no OP-stack L1 data fee on ethereum — l1FeeBoundWei
  returns 0): the send carries gas = MAX_GAS_LIMIT 900,000 and maxFeePerGas =
  DERIVED cap min(baseFee*9/8 + 0.001 gwei, 17.5 gwei) refreshed every cycle and
  re-checked fresh at send (fail closed); plus 2 x APPROVE_GAS 80k at the same
  cap. Worst case at the 17.5 gwei hard cap: 900k x 17.5 + 160k x 17.5 = 1.855e16
  wei = 0.01855 ETH ~= 44.5 USD at 2400 USD/ETH — ABOVE the 20 USD bound, which
  is exactly why liveLiquidate() REFUSES the send whenever the fresh USD check of
  gas x selected cap exceeds 20 USD: the hard cap alone does not enforce L, the
  fresh guard does (fail closed, no send). At the measured current baseFee
  0.039667 gwei (relay header 26346513) the derived cap is ~0.0456 gwei and the
  1.06M-gas worst case is ~0.0000483 ETH ~= 0.12 USD at ~2400 USD/ETH; at the
  winner-era 4.17 gwei effective gas price (relay receipt of 0x8a8a9177...,
  gasUsed 511,037) 1.06M x 4.17 gwei = 0.00442 ETH ~= 10.6 USD. liveLiquidate()
  refuses above MAX_LOSS_PER_TX_USD=20. Cover is capital-capped
  in bot.js sizing (cover <= MAX_COVER_USD 250 of capital 400). The $1
  MIN_PROFIT_USD gate applies to the after-fee profit estimate; on-chain
  minProfit is the hard revert floor.
