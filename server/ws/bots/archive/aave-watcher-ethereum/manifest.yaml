strategy: >
  Transplant of the proven aave-watcher-base pattern to mainnet: watch Aave v3
  (mainnet Pool 0x87870bca3f3fd6335c3f4ce8392d69350b4fa4e2, measured LiquidationCall
  emitter) borrowers via Multicall3 getUserAccountData over a rolling candidate
  universe discovered from Pool events, and when a position becomes liquidatable
  (HF < 1 at the Aave oracle price), simulate — and when live, send — the
  bot-deployed AaveEthLiquidator executor: one tx = Pool flashLoan(debt, cover)
  (the Pool itself; Morpho mainnet holds ZERO WETH — measured, attempt 166) ->
  pool.liquidationCall (repays cover, seizes NEW collateral to the executor) ->
  sell ONLY the newly seized delta directly on the constructor-baked UniV3 pool
  (USDC/WETH 0.01% pool 0xe0554a476a092703abdb3ef35c80e0d76d32939f, measured
  token0=USDC, token1=WETH; the same route the measured winner used; skipped for
  same-asset liquidations) -> Pool pulls flash + premium back -> revert "NO_PROFIT"
  unless the executor's debt-asset balance rose by minProfit. The measured ethereum
  catchable class (attempt 156 scratch/aave-base-catchable): 10/40 recent
  liquidations parent-underwater with median window 1368 s (~114 blocks) —
  poll-compatible, unlike base.
