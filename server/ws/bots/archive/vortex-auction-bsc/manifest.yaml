id: vortex-auction-bsc
author: builder/claude-mythos-5-2
chains: [bsc]
strategy: "Scheduled Dutch-auction take: buy the native BNB lot that Bancor's CarbonVortex on BSC sells for Binance-Peg ETH once its 12 h half-life price is 3 pct under the PancakeSwap V3 pool price (flash swap of the ETH, Vortex.trade, repay in WBNB), one atomic executor call"
copied_from: "EOA 0xfefe5cb7929ef5a4c128ca2fda64c56fd4429b05 through contract 0xc7dd38e64822108446872c5c2105308058c5c55c (selector 0xd0c8ea36), the only taker of the BSC Vortex in 155 days: native lots 0x2ac4f932ccaf7d8b8476477284db5ceeb0199c7e9a9ee2290ee855fc102eb9c8 (block 105,285,057, margin 0.57 USD), 0x26a822b01516c2f15812ead6dcced72a9ab81b5392d915219ed8791a91a8845d (block 107,463,891, margin 11.68 USD = 10.4 pct), 0x9fd1a0140d36398d1d81a9bdd472a49f74bd0a5d615f7b4a28f4f8122d56e1cc (block 109,969,564, margin 477.77 USD = 19.9 pct)."
capital_usd: 3
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "A lost attempt costs gas only, and the gas of one send is bounded by the signed fields (BSC has no base fee and no L1 fee). Executor: VortexBuyer.sol:63-80 run() is owner-only (line 72) and reverts NoProfit (line 76) unless the executor's native balance grew by at least minProfit after the pool was repaid inside its swap callback (minProfit 0 is refused); the callback (lines 111-125) is accepted only from the pool of this call and the WBNB deposit that repays the pool reverts when the BNB bought does not cover it; no principal leaves the wallet (the ETH is handed out by the pool's flash swap). Bot: bot.py:235-285 take(): gas limit = eth_estimateGas x 1.2 + 50,000 (refused above 800,000, bot.py:71), gas price = 2 x eth_gasPrice, never above 1 gwei (bot.py:70) and never above the price at which gasLimit x gasPrice reaches 0.90 USD at the pool's BNB/USD x 1.15 (lines 251-252); sent only if the simulated gain is at least 5 x that cap (line 263) with minProfit = 90 pct of the simulated gain and at least cap + 1 (line 255), after the exact guarded call was simulated at the signed gas limit. Typical cap 0.00005 BNB = 0.03 USD."
expected_value: "One dated lot: 0.951886 BNB (about 514 USD) crosses the 3 pct line about 2026-12-02 12:07Z; the fork take at that line paid +0.028455 BNB (about 15.4 USD) after gas. Per past occurrence at the bot's 3 pct line (155 days, blocks 105,042,186-135,042,154, one taker, scratch/rsv390/vortex_hist.py + vortex_disc.py): lot 1 (226 USD) taken at 0.25 pct, before the line: not counted; lot 2 (112 USD) taken at 10.4 pct, about 4,900 s after the line: gross 3.4 USD, gas 0.03 USD; lot 3 (2,404 USD) taken at 19.9 pct, about 11,900 s after the line: gross 72 USD, gas 0.03 USD. 75.5 USD in 155 days = 0.49 USD/day on history (under the 1 USD/day floor, stated plainly); the dated lot is about 10 USD expected (2 of 3) in the next 10 days. Not a race: the time is computable days ahead and the past windows were hours."
executor: scratch/vortex-auction-bsc/contracts/out/VortexBuyer.sol/VortexBuyer.json
executor_args: "{bot}"
executor_note: "New contract in this bot's own scratch directory. Constructor takes only the bot owner. run(vortex, pool, finalToken, wnative, targetAmount, maxInput, minProfit): the Vortex, the pool, both tokens and the amounts are call arguments, nothing is baked in and there is no setup transaction. The executor reads the auction's ask (expectedTradeInput), reverts InputTooHigh above maxInput, and calls swap() on the V3-style pool for an exact output of the final target token; inside the callback (pancakeV3SwapCallback / uniswapV3SwapCallback, accepted only from the pool set for this call and cleared at its end) it approves exactly the ask to the Vortex, calls trade(native, targetAmount, ask), resets the approval to 0, wraps what the pool is owed and pays it. The remaining native balance goes to the owner; run() reverts NoProfit unless it is at least minProfit. receive() accepts the BNB from the Vortex. rescue(token) is an owner-only recovery of anything left behind (nothing is expected: the fork run left 0 native, 0 ETH, 0 WBNB, allowance 0). Runtime 3,750 bytes, deploy about 0.9m gas. Live code reads EXECUTOR_ADDR_BSC or EXECUTOR_ADDR only; paper mode uses an eth_call / eth_estimateGas code override taken with eth_getCode from the BSC fork deployment (executor-runtime.hex)."
fork_evidence: "scratch/vortex-auction-bsc/proof.py (one BSC fork lease: reset at head, deploy the artifact with --args, fund the owner, three guards at the real clock, clock warp, guard, success, repeat; run 2026-11-22 about 07:55Z, result scratch/vortex-auction-bsc/proof-result.json). Nothing is takeable at the real clock today, so the success case advances the fork's time (evm_increaseTime 879,094 s = 10.17 days) until the ask is 3 pct under the pool price; the pool and the Vortex balance stay as at the reset block 135,042,772. Guards at the real clock: no input limit 0xf815e71bea53ca5c4cd95491301b31747d37db4a4d538f40a6a363eaa184016b (block 135,042,774, status 0: the pool cannot lend 400,178 ETH); input capped at the market value 0x7b1d11b59c2645ca4d11ce33db52cbddd4a2edb9c8bdb0330b6c82842f3c096f (block 135,042,775, InputTooHigh 0x0ee8070e); non-owner 0xccec75515dedcb9c90eb08e10ef262d3ef2faf148db3bfe999ebd728bda1dc48 (NotOwner 0x30cd7471). After the warp (block 135,042,777, ask 0.299438 ETH = 0.9696 of the market): guard minProfit twice the gain 0xa6184276d0b2f7d198b670f1abb97cb888c10414ae495f35b83de43e9f789177 (block 135,042,778, NoProfit 0x31708d59 carrying the gain 2.845e16); success 0xfe6d8ed246b96b3bac084b2105645516788feeaa991714597fc7327c77cd1813 (block 135,042,779, 277,552 gas): owner native 0.999813412200000000 -> 1.028268087599836417 BNB = +0.028454675 BNB after gas (0.1 gwei on the fork), Vortex native -0.951885754735183613; executor left with 0 native, 0 ETH, 0 WBNB, ETH allowance to the Vortex 0; the same call repeated reverts 0x52aa11865089614e3e11f32b315eeea00d9c9a0f8a492c11dd1007fd020e6094 (the Vortex's InsufficientAmountForTrading 0x8e26ecdf: the lot is gone). The bot's own check() on the fork (scratch/vortex-auction-bsc/selftest.py, selftest.json; selectors and the run() encoding checked against cast first): at head ask_above_line with eta_utc 2026-12-02T12:07:22Z and a 6 h sleep; after a warp to 3.5 pct under: ask_under_line, opportunity (both pools simulated, 0.01 pct pool best, gross 0.033136 BNB = 17.9 USD) and paper_sim success."
awaited_events: "The Vortex ask falling to 0.97 x the PancakeSwap V3 ETH/WBNB price for the 0.951886 BNB lot: expected about 2026-12-02 12:07Z (computed from the on-chain ask at block 135,043,220; 12 h half-life; moves 10 min per 1 pct of BNB/ETH). Last native take: block 109,969,564 (2026-07, by the incumbent). After this lot: only when Bancor's BSC arbitrage fees fill the Vortex again (unknown)."
good_signs: "check rows ask_above_line whose eta_utc stays near 2026-12-02; then ask_under_line, opportunity, paper_sim success (paper) or send_result won with positive net_wei (live)."
bad_signs: "eta_utc jumping about 45 days out (an execute() reset the auction); check no_lot before the date (the lot was withdrawn or taken early: read the Vortex TokenTraded logs); ask_under_line followed by every_pool_reverts or simulate_revert (somebody took it first or the pool moved); loop_error or read_budget rows; signer_reject."
rpc_reads_per_min: "0.01 far from the date (3 eth_call every 6 h); the look interval halves with the remaining time down to 20 s near the line; under the line about 10 calls a minute until the lot is gone."
alchemy_cu_per_day: "Typical 300-1,500 CU per day (under 0.001 USD at 0.53 USD per million CU); code cap 20,000 relay CU per day, then the bot sleeps to 00:00 UTC. No feed use."
legal_note: "CarbonVortex.trade is the public entry of Bancor's fee auction: the protocol sells its fees to whoever pays the falling price, by design. The bot reads confirmed state only, watches no pending transactions, bids no priority fee beyond twice the chain's gas price, and moves no price for others to trade against. The flash swap is an ordinary pool trade."
