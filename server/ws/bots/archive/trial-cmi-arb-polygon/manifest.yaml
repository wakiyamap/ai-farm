id: trial-cmi-arb-polygon
author: builder/claude-mythos-5-2
chains: [polygon]
strategy: "trial: CMI SetToken issue / redeem at component value (Set Protocol BasicIssuanceModule) versus the QuickSwap V2 CMI/USDC.e pair on Polygon, one Morpho-flash-funded transaction"
copied_from: "EOA 0xc3afb378b3e50a5134b6c0b597dcf31c20c50bbd via contract 0x91a7fbaec1d8f0a4d2dcdde5e3319349ef209428: 5 atomic issue takes in 7 days at blocks 97,304,761 / 97,325,446 / 97,654,787 / 97,663,571 / 97,685,669 (traced take 0xb844cfd5c8640ce08f5b468d3d3a67788ee8848949cf2fe12790d8d82fa359d7, block 97,663,571, +0.15898 USDC.e on 0.088396 CMI)"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "StepArb.sol:108 reverts NoProfit unless the WPOL balance grew by at least minProfit after the Morpho flash loan was repaid; take() is owner-only (StepArb.sol:57) and the flash callback accepts only the lender set for this call (StepArb.sol:124); the gain is unwrapped and paid to the bot wallet as native POL in the same transaction. So a lost attempt costs only gas. bot.py check(): cap = gasLimit x maxFeePerGas (gas limit = eth_estimateGas x 1.2, refused above 2,400,000; maxFeePerGas = base fee x 1.25 + 30 gwei tip, refused above 1,500 gwei); the send is skipped unless cap is under 0.95 USD at a conservative 0.15 USD per POL (the hard maximum 2.4M x 1,500 gwei = 3.6 POL = 0.54 USD at that price) and unless the simulated gross is above 2 x cap (SEND_MULT); minProfit = cap in the signed call (send_live), re-simulated at the signed gas limit before the send. Typical cap 0.50-0.55 POL = 0.04 USD at the measured 0.0736 USD per POL. Priority fee: the fixed 30 gwei Polygon minimum, about 0.03 POL per send = under 3 pct of any gross the bot sends for (gross must exceed about 1.0 POL); the bot never raises it."
expected_value: "Trial: win rate measured by sending, no counted EV. Competition, last 7 days (scout scratch/s349/takes.json, blocks 97,287,152-97,690,351; table in README): 5 atomic issue takes by one operator (0xc3afb378 via 0x91a7fbae), kept 0.1386-0.1590 USDC.e each (0.737 USDC.e in total), gas 1.15-1.24M = 0.34-0.47 POL, priority fee 25-161 gwei, tx index 3-203. The operator takes only when the gain reaches about 1.5-2.0 WPOL; the bot's own probe at blocks before each take (scratch/trial-cmi-arb-polygon/series-windows.json) shows the gain stood above the bot's send line of about 1.0-1.1 POL for at least 1,000 / 1,000 / 1,000 / 3,000 / 100 blocks (2 s each) before those takes. The bot aims at all of them by sending earlier at a lower line: about 5-10 takes a week of 1.0-1.5 POL gross, 0.7-1.2 POL net each = about 0.4-0.8 USD a week if it wins most. Small; the trial measures whether a lower threshold wins against this operator."
executor: scratch/trial-cmi-arb-polygon/contracts/out/StepArb.sol/StepArb.json
executor_args: "{bot}"
executor_note: "Same StepArb source as the reviewed live trial-xspace-arb-polygon, copied into this bot's own contracts directory (no shared code). Constructor takes only the bot owner. take(lender, token, amount, steps, clear, minProfit, unwrap): the flash lender (Morpho Blue), the flash token (WPOL) and every step (target, token spent, spender, calldata) are call arguments; nothing is baked in and there is no setup tx. A swap step approves exactly the amount it may spend and resets the approval to 0; the three component approvals for issue() are steps that approve exactly the amounts the module pulls in the next step, so they end at 0 (checked in the proof: all ten executor allowances 0). The executor is a generic step runner, which is safe because take() is owner-only and the executor holds nothing between transactions: the worst a bad route can do is revert. probe(bytes[]) is for eth_call only: owner-only, it tries each take() calldata through trial(), which always reverts (Trial(gain)). After the profit check every token named in clear (USDC.e, WETH, WBTC, CMI) is sent to the owner (dust; zero in both fork runs). Live code reads EXECUTOR_ADDR_POLYGON or EXECUTOR_ADDR; paper mode uses an eth_call code override (executor-runtime.hex = eth_getCode of the fork deployment, owner 0xc0ffee...0311). Runtime 5,138 bytes, deployment about 1.2M gas, under the 3,000,000 limit."
fork_evidence: "scratch/trial-cmi-arb-polygon/proof.py <parent block> (one Polygon fork lease per run: reset, deploy the artifact with --args, fund, probe, non-owner, guard, success, repeat, leftovers, allowances; calldata built by bot.py itself). Run 1 (issue), reset 97,663,570 = parent of the incumbent's take in block 97,663,571 (proof-result-97663570.json), deployed 0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352: probe from the owner issue 1.125 / 1.785 / 1.964 / 0.741 / 0 WPOL at 0.03 / 0.06 / 0.10 / 0.16 / 0.25 CMI and 1.994 at the incumbent's 0.088396 CMI, redeem 0; from a stranger it reverts. Non-owner take revert NotOwner 0xbec35db2f446a50625646e032f847580564f06f03d3ba3638ffc46940624b0bb. Guard revert NoProfit(1.994e18, 1e24) 0x35c42d8077b97852c09e4c72c33491f9fb47079eff2a04354aa993ab53386644, 1,067,085 gas, owner -0.640 POL at the script's 600 gwei. Success 0xcd41c96db561c3781d8bf79e538bf7a30695332e4a312ad4f94a30376fca6585 block 97,663,574, 871,731 gas, owner native +1.471 POL net of 0.523 POL gas at 600 gwei (gross 1.994 POL = 0.147 USD; the incumbent kept 0.159 USDC.e on the same case). The same call again reverts 0x7f7465006bde9cf7e230593615e0f9b9c8979909cfef8d58baa2a6bb502eb035 (gap closed); executor balances 0 in native, WPOL, USDC.e, WETH, WBTC, CMI; all ten executor allowances 0. Run 2 (redeem direction, mechanics only), reset 97,692,104 = head at 2026-11-21 06:47Z (proof-result-97692104.json): probe redeem 0.219 / 0.334 / 0.339 / 0.239 WPOL at 0.015 / 0.03 / 0.045 / 0.06 CMI, issue 0; non-owner 0xc9595c9ab76db1431ab665a739c2a387fc4c639b69c795bcfac0a30a40efddbc; guard NoProfit 0xe4fdcfa7f37a4c0e7b4ebb88caf4d4b94afaf2e2198dc586b1f1445305eadd63; success 0xeb8b4b5e764798fbc1b09e6d90268a3cbc6dd2a5505055aeb5b02debb12bcacd block 97,692,108, 799,691 gas, gross +0.339 POL paid to the owner (owner native -0.141 POL after 0.480 POL gas at the script's 600 gwei: below the bot's send line, the bot would not have sent it); repeat reverts 0x3897f804da0293d1e8c4f0acc3e986ace15b7c07ef99181aaa4bad8a0a18026b; balances and allowances 0. The paper bot's own check() through the relay (scratch/trial-cmi-arb-polygon/selftest.py check <block>): paper_sim success at 97,663,570 (issue 0.10 CMI, gross 1.964 WPOL against a cap of 0.549 POL), skip at 97,685,569 (gross 1.017 below the line 1.102) and at head (redeem 0.690 below the line 1.002)."
awaited_events: "No single event: the pair price stays put while the component value moves with ETH and BTC, so the bot looks on a 120 s timer. A take-sized gap (incumbent's line) was reached 5 times in the last 7 days, last at block 97,685,669 (2026-11-21, about 03:40 UTC); at head 06:48 UTC a redeem-direction gain of 0.69 WPOL was building below the send line. Next: whenever ETH / BTC drift about 1.5 pct against the pair, about once a day."
good_signs: "check rows every 120 s; an opportunity row and a paper_sim success about once a day with gross 1.0-2.0 WPOL above a cap near 0.5 POL; live send_result won with net_wei positive."
bad_signs: "Every live send lost with winner_block at or just below send_block (the incumbent lowered its line or is faster); loop_error rows saying the CMI components changed (the manager rebalanced: units are re-read, a new component needs a new route); the pair drained (probe 0 for days); read_budget rows."
rpc_reads_per_min: "0.5 on average: one probe eth_call per 120 s look; four sizing reads every 30 min; when a gain is near the send line three more reads (block, estimate, guard simulation), at most once per 30 min while it stays below 80 pct of the line."
alchemy_cu_per_day: "About 26,000 CU/day: 720 probes x 26 = 18,700; sizing 48 x 4 x 26 = 5,000; opportunity reads about 2,500. 0.014 USD/day at 0.53 USD per million CU. No feed filter. Code cap 95,000 CU/day."
legal_note: "Public issue and redeem of a SetToken at its component amounts (BasicIssuanceModule, open to anyone, the intended use, no issuance hook) against a public AMM pair: plain arbitrage. No pending-transaction watching; the bot reads confirmed state on a timer."
expedite: false
