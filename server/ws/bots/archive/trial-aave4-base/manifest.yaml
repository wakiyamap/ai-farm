id: trial-aave4-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: Aave V4 Base spoke (0x17905db0...) liquidations of tokenized-equity collateral against USDC debt; wake on the equity price aggregators' AnswerUpdated events via the feed, then one tx through the executor - Morpho zero-fee USDC flash loan, liquidationCall, sell the seized collateral on a UniV3 pool, repay, USDC gain or revert."
copied_from: "takers of the spoke's LiquidationCall, e.g. tx 0x0cabf2ed2ebc979e4ef2c65c4f2fcf69084f2d541e398162982004304c3105cf (executor 0xf000042d..., block 55675737, 248.31 USDC restored, same flash-loan + direct pool swap route, callTracer in scratch/a4t-trace1.json) and 0x5ac9bc14... (5 of the 8 captures in the last 7 d); lead 42, attempts:1534"
capital_usd: 18
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialAave4Take.take reverts NoProfit() unless its USDC balance grows by minProfit (scratch/trial-aave4-base/contracts/src/TrialAave4Take.sol:83), so a lost attempt costs gas only. Gas cap per send in bot.py:75-79 and 319-327: GAS_LIMIT 800,000 x maxFeePerGas <= 0.25 gwei = 2.0e-4 ETH (0.36 USD at ETH 1,820; valued at a deliberately high 4,000 USD/ETH plus 0.02 USD L1 data fee it must stay < 1 USD or the bot does not send). The bot sends only when simulated gross > that gas cap and passes the cap as minProfit. Priority-fee bid: at most 25% of simulated gross (BID_SHARE, bot.py:79), and never above the 0.25 gwei fee cap."
expected_value: "trial, win rate to be measured live. 7 d competition at this entry (lead 42 scout, blocks to 58362485): 8 LiquidationCall, 4 distinct takers (0x5ac9bc14... 5, 0x03a6793b, 0xf000042d, 0x8407699e 1 each), gross per capture median 1.46 USD, max 14.28, sum 42.38; 2/8 taken in the first liquidatable block, 5/8 within 1-7 blocks (0.2-1.4 s), 1/8 dust left 128+ blocks; winners' priority fee median 0.054 gwei, max 0.50. The bot aims at the 1-7 block and dust classes; one attempt is about 530k gas = 0.005 USD at the 0.005 gwei base fee. Fork: +10.77 USDC on a 248 USDC position."
executor: scratch/trial-aave4-base/contracts/out/TrialAave4Take.sol/TrialAave4Take.json
executor_args: "{bot}"
executor_note: "No principal: the repayment comes from a Morpho Blue flash loan (zero fee) taken and repaid inside take(), so the manifest-check note about principal_usdc does not apply. constructor(address bot) only; spoke, reserve ids, collateral token, user, flash size, pool and minProfit are call arguments. Morpho Blue and USDC on Base are constants (flash source and profit unit). onMorphoFlashLoan accepts only Morpho while a take() is running; the swap callback accepts only the pool set for that swap; both peers are cleared; USDC approvals (spoke, Morpho) are the exact amount and reset to 0. Only the collateral received in this call is sold. Profit is paid to the bot wallet as USDC. Owner-only sweep(token) for recovery."
fork_evidence: "scratch/trial-aave4-base/proof.py (lease, reset base 55675736, deploy, fund, 3 guards, success, release); result in scratch/trial-aave4-base/proof-result.json. Success 0x4bd7733edb6198d40c7bc97b60630db76a125fd970d5a95fb815c06a99d302fa (fork block 55675741, gas 530,156): owner USDC +10.769180, user health factor 0.99953 before, executor left with 0 USDC / 0 NVDAc / 0 allowances. Reverts: healthy user 0xd6971319322da9e41f3600702ff4a51379e74dc4ec3e8a6aa0890df216d7eb0e (HealthFactorNotBelowThreshold 0x930bb771, gas 264,293), minProfit above gain 0x8fc347eef6a35009514aa13a8c18e3d6a63cc863226e16582701d976c433f1fe (NoProfit 0xe39aafee, gas 629,354), non-owner 0x7688c68f2c220bb77812bc9f75899d6623806cdeee81a0d4156d16f7c6b250fe (NotOwner 0x30cd7471). Paper override = eth_getCode of that deployment (executor-runtime.hex). scratch/trial-aave4-base/selftest.py runs the bot's own scan/attempt paper path through the relay at block 55675736: one opportunity row (gross 10.76918, gas cap 0.82) and paper_sim success, then a full scan at head: 329 debtors, 0 candidates, min health factor 1.0123."
awaited_events: "AnswerUpdated (0x0559884f...) on the 8 'Coinbase <stock>' price aggregators (about 55 per aggregator per day; NVDA aggregator 0xf72b1eb5... last at block 58446183, 2026-11-17 about 01:40Z). A liquidation needs a stock drop that pushes a borrower's health factor under 1; at placement the lowest is 1.0123 (31 borrowers under 1.15), so about a 1.2% drop in that borrower's collateral. Last captures 2026-11-09 to 11-11 (blocks 55652844-56512315); equities move most at the US open (14:30Z) and close."
good_signs: "logs/bot.jsonl: feed + scan rows on every aggregator update with min_hf moving; opportunity + paper_sim success rows when min_hf crosses 1; live: send_result rows with result won."
bad_signs: "scan_error or loop_error on every cycle; simulate_revert 930bb771 on every candidate (health read drift); simulate_revert on every pool of a collateral (pool liquidity moved: update RESERVES); live send_result lost with blocks_after_winner >= 1 on every send (always late); read_budget rows."
rpc_reads_per_min: "about 0.5: one Multicall eth_call per aggregator update or per 300 s when quiet; 6 Multicalls + 1 getLogs per full scan every 6 h"
alchemy_cu_per_day: "about 41,000 (0.022 USD): relay about 20k (updates <= 440 x 26 = 11.4k, safety polls <= 288 x 26 = 7.5k, full scans 4 x 241 = 1k) + feed about 21k (440 logs x 35 CU + 4 CU/min subscription); relay reads hard-capped at 80,000 in code"
legal_note: "The Aave V4 liquidation bonus is a public payout to any caller of liquidationCall(); no mempool watching, the bot reacts to mined oracle-update logs only; it bids a priority fee for a public reward."
expedite: false
