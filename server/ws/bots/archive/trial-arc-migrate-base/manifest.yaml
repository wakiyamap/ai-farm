id: trial-arc-migrate-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: buy old ARC on its Uniswap V2 VIRTUAL pair, migrate it 40 to 1 into new ARC through the public migrator, sell new ARC on its V2 WETH pair, all in one Morpho flash-loan transaction"
copied_from: "operator EOA 0x9fa50f47613c853f6fd91d94ff7688c7d448f636 through executor 0xd3460855317364fd617e63cde683dcf0b1112374, takes 0x8e5762f2f1293648084a55d7e2c2bc1f01f6a49ec06142a10c69c29920119450 (block 60393655) and block 60576184 (28 migrate calls, kept 0.000615 WETH)"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "Executor take() reverts NoProfit unless the WETH left after repaying the flash loan is at least minProfit (contracts/src/TokenMigrateArb.sol take(), the NoProfit line), and the bot sets minProfit = gasLimit x maxFeePerGas + L1 allowance of that send (bot.py check(): cap, gain_of(borrow, cap, gas_limit)); a lost send costs only gas, capped under 0.95 USD at an ETH price of 4000 USD (bot.py MAX_TX_USD, ETH_REF_USD, MAX_FEE_CAP_WEI 0.2 gwei). Trial: it bids at most 1/10 of gross as priority fee, never above 0.1 gwei (TIP_SHARE_DEN, TIP_MAX_WEI)."
expected_value: "Trial, no counted EV. Last 7 days at the migrator (blocks 57,600,690-60,624,690, scratch/r0891/takes7d.txt): 18 arbitrage transactions, 197 migrate calls, 0.002395 WETH kept in total (about 4.4 USD), by 3 operators (0x9fa50f47 13 takes, the 0xc0ffee.. EOA family 4, 0xcb741eba 1); 6 takes above 0.00018 WETH, 12 between 0.00001 and 0.00005 WETH; winners at tx index 4-272 with effective gas price 5.1e6-3.9e7 wei (no priority auction). The bot aims at any take whose gross is above 1.3 x its own gas cap (about 0.00001 ETH at today's fees). Windows (scratch/trial-arc-migrate-base/windows.py, windows.json, the executor's probe() as a code override before each take): all 18 gaps stood 10 s or more before the incumbent took them, 13 of 18 stood 30 s and 60 s or more, 12 of 18 stood 5 min or more; the feed-driven bot looks about 1 s after the Sync that opens a gap."
executor: scratch/trial-arc-migrate-base/contracts/out/TokenMigrateArb.sol/TokenMigrateArb.json
executor_args: "{bot}"
executor_note: "TokenMigrateArb, constructor (owner) only. Lender, wrapped native, pairs, tokens, migrator, unit, chunk, fee and loan size are call arguments. Callback onMorphoFlashLoan checks msg.sender against the lender set for this transaction and cleared at its end. Exact approvals (old ARC to the migrator, WETH to Morpho), reset or fully used. Profit is unwrapped and paid to the bot wallet as ETH; token dust goes to the owner. Deploy gas about 1.5M."
fork_evidence: "scratch/trial-arc-migrate-base/proof.py (one script: lease, reset base 60576183 = parent of the incumbent take in block 60576184, deploy, fund, probe, guards, success, repeat, release; result proof-result-60576183.json). Success 0xd0b4410f02693922eb2f0a0bbf7009d219725c225ad986a71aae8ab6ae4b2f7d (fork block 60576187, 1,067,457 gas, 28 migrate calls): owner native +593,688,123,974,850 wei after gas, paid 0.000615037 ETH (the incumbent kept 0.000615251 WETH in the real block). Correct reverts: guard 0x3dba481736bb53b457dda1f1ccf2c11b2f6a9da8b59560d22195c2b1740cd4fb (minProfit 1e24: NoProfit 0x31708d59), non-owner 0xd2ca8f3a09499023e83fb721bbaa52ba670220c638033b2bd8ad4f7d1c740a39 (NotOwner), repeat with the same minProfit after the take 0xce06732d86c6eaaaf416f5fd71ad1c7d0ac8febb24f0bc782b36c05afd18c928 (reverts, probe after = 0 for every size). Executor leftovers 0 (WETH, old, new, VIRTUAL, native), allowances 0."
awaited_events: "Feed /logs/base, Sync(uint112,uint112) on pairs 0xb68f6d542bee0e2a3a0df0de4a2d7d76ffff924a and 0x2814a97ec973e523e8207e48227bcdc07ca10027 (24 logs a day), plus a 300 s safety poll: a gap between old ARC on the VIRTUAL pair and new ARC on the WETH pair wider than fees (2 x 0.3 pct V2 + 1 pct old-ARC transfer tax + 0.3 pct). Last taken 2026-11-22 (blocks 60576184 and 60576265, timestamp word 1795305612); 18 takes in the last 7 days, so the next is expected within a day."
good_signs: "opportunity and paper_sim lines in logs/bot.jsonl a few times a day; live: send_result won"
bad_signs: "no opportunity line for 3 days (the migrator closed, or the old pool drained); live: send_result lost every time with winner_block equal to the first block of the gap"
rpc_reads_per_min: 0.3
alchemy_cu_per_day: 16000
legal_note: "Public migration at the project's fixed rate plus swaps on public pools; the same transaction three unrelated operators send. No mempool watching, no reaction to pending transactions."
expedite: false
