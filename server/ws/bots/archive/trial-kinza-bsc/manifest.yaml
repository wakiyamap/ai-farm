id: trial-kinza-bsc
author: builder/claude-mythos-5-2
chains: [bsc]
strategy: "trial: Aave-flash-funded liquidation on Kinza Finance (Aave-v3 fork in wind-down, BNB Smart Chain; USDC, USDT, FDUSD or WBNB debt; WBNB, USDC, USDT, ETH or BTCB collateral), after a confirmed LiquidationCall on the feed or a 60 s near-HF scan"
copied_from: "Public Kinza takers: 0x006bb185a248fea23305561e17d412cfa12fae68 in tx 0x24ae9f0b490b9519df3f9d82893964e854ff945fd27756887a6585ddf89fbafc (block 133299630, the fork-proof case), 0x5ac9bc14376bf2727c6211960cf3cec1e2f295bd in tx 0x36e77704d05de4c02a99efc9c424624f10a9a4c15268f8f31e25fc729ebfcfca (block 134346535, 43.365 USDT repaid for 46.446 USDC), 0xf000042d2b48921c234f15d167e7874f594f303e in tx 0xa2498976450d1c193009ac95067027742aed2482f70038c052693f7124f7eb80"
capital_usd: 12
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialKinzaLiquidator.sol:85 reverts NoProfit unless the pay-token balance (USDC, or WBNB for WBNB debt) grew by at least minProfit, and :87-96 pays the whole gain to the bot (USDC, or native BNB) in the same tx, so a lost attempt costs gas only. bot.py:346-350 sets the gas price so gasPrice x gasLimit < 0.90 USD (never above 3 gwei, gas limit never above 3,000,000) and requires simulated gross > that signed gas cap, and :355 sets on-chain minProfit to the gas cap. The gas price bid is at most 50% of the simulated gross (BID_SHARE, bot.py:347), or the network gas price (0.05 gwei floor) when that is higher, and the send still needs gross > gas cap. No principal: the cover is an Aave v3 BSC flashLoanSimple repaid with its premium in the tx; the bot wallet holds gas only (12 USD of BNB)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7 d to 2026-11-18 23:40Z (blocks 133056979-134400979, scratch/trial-kinza-bsc/liq-rows.json): 589 LiquidationCall events in 228 txs; 43 with a cover above 5 USD (up to 478.96 USDT, bonus about 7.1%), taken by 11 liquidator contracts (0x5ac9bc14 19, 0xe65f1199 5, 0x697f6e97 5, 0xf000042d 3, 0xd1fa4cef 3, six others 1-2). 35 of the 43 flipped inside the capture block; 8 were under water at the parent block and 2 blocks before (parent-hf.json). Winner gas price (tips.json): median 0.1 gwei, p90 0.3, max 1.0; 28 of 43 at tx index <= 5 near the floor (ordering bought outside the gas price), 10 at index >= 20. The bot aims at the users left under water for a block or more (8 of 43); the proof case would have paid 2.48 USDC for about 0.03 USD of gas. The protocol is winding down (0 Borrow / 0 Supply logs in 7 d), so the flow can only shrink."
executor: scratch/trial-kinza-bsc/contracts/out/TrialKinzaLiquidator.sol/TrialKinzaLiquidator.json
executor_args: "{bot}"
executor_note: "Owner-only liquidate(flashPool, job, cover, minProfit, unwrap). Flash lender (Aave v3 BSC Pool), liquidated pool (Kinza Pool), borrower, collateral, debt token, swap router, fee tiers and pay token are all call arguments; constructor takes the bot address only; no setup transaction. The flash callback executeOperation accepts only the lender set for the running call (cleared at the end) with initiator = the executor. Approvals are exact and reset to zero (Kinza pool, router, flash repayment). Profit leaves as USDC or native BNB; a USDT or FDUSD gain is swapped to USDC inside the tx. Same source as the reviewed trial-aave-bsc executor under a new contract name (own copy; only the name and one comment differ). Live address from EXECUTOR_ADDR_BSC or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-kinza-bsc/proof.py (lease, reset bsc 133299629 = parent of block 133299630 where 0x006bb185 took user 0x5b278c6c already under water, deploy artifact, fund owner, cover and fee sweep by eth_call, guards, success, exhausted, release; output proof-result.json). Success (USDT debt, WBNB collateral, gain swapped to USDC) 0x6ff73370463bb82e4925fb3690c5e9225df11afd1a752839d389fb5fceb923f1 block 133299633, gas 880675, owner +2.481794841868447486 USDC, native -880675000000000 wei (gas at the fork's 1 gwei), borrower HF 0.99456 -> 1.09456. Executor USDC/USDT/WBNB/native and Kinza/Aave/router allowances all 0 after. Correct reverts: NoProfit guard 0x08e7d172744da5ada5e68537fc6a968642c932322f670cb2303f7a4b46b4aead (0xe39aafee, owner USDC delta 0); non-owner 0xeb002751ba79ab8a841bd58d573858e37c558a552271e0139381778f4814eb33 (NotOwner 0x30cd7471); nothing left to take 0x54e2dfa03dec8fb6dd37376fee87e6f7cead0d198805267820eed6a6c2bac3db (second call, Aave error 45, owner USDC delta 0). The success lands at parent+4 because deploy and the two guards consume fork blocks. FDUSD debt: scratch/trial-kinza-bsc/proof_fdusd.py (reset 133621097 = parent of the real take 0x1acfeda70292ed34d561e95b18a3a675d9f0d4df94a27f7ea2c2d2a6a8eaacc9 of user 0xb451c775, HF 0.99968; output proof-fdusd-result.json): success 0x7fa490f591d21b2cdd956f2965e057ff15dce092bc17482ba79ad90b83f3efe7 block 133621100, gas 1564977, owner +1.236186390259348159 USDC (WBNB -> FDUSD fee 500, FDUSD -> USDC fee 100), HF -> 1.09572, executor balances and allowances 0; NoProfit guard 0xcd7d60d7eda09c064848b97f277f53831dc5eb5f08107d035c1fffa01af851fe (owner USDC delta 0); second call reverts 0x4d6a0ab56063fad6ccd65a1d46d548731c1ec719fd44965b44fde4a3b10bc88c. The bsc fork upstream sometimes answers missing trie node for old state: a failed run is repeated after fork reset (the FDUSD script retries each simulation once). scratch/trial-kinza-bsc/selftest.py: bot calldata equals cast calldata for USDC, USDT, FDUSD and WBNB debt; the bot's own attempt() pinned through the relay with the paper code override logs one opportunity at 133299629 (USDC debt of the first user, 0.999 USD gross, gas cap 0.50 USD) and one at 133621097 (USDC debt of the FDUSD user, 0.653 USD gross, gas cap 0.33 USD); 8 blocks before each (HF 1.0052 / 1.0029) it logs nothing."
awaited_events: "Kinza Pool 0xcb0620b181140e57d1c0d8b724cde623ca963c8c LiquidationCall on the feed (589 in 7 days in 228 txs, last in the census at block 134373093 on 2026-11-18); every such event triggers a scan of the 200 nearest-to-1 health factors. Safety scan of the near list about every 60 s, full universe hourly, Withdraw logs every 10 min. Next occurrence is not predictable (BNB price moves; bursts of 200 events on drop days)."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is)."
bad_signs: "No opportunity row in 7 days; every send lost by many blocks; simulate_revert for every underwater user (routes); read_budget rows (75k CU cap hit); feed_error rows every 30 s; debtors count in scan rows falling toward 0 (wind-down finished)."
rpc_reads_per_min: "about 1.3: one Multicall eth_call per minute (near scan), 5 per hour (full scan of ~970 users in batches of 200), one eth_getLogs + eth_blockNumber per 10 min, plus 5-45 calls per detected underwater user"
alchemy_cu_per_day: "about 53,000 relay CU/day (near scan 1440 x 26 = 37,440; full scan 5 x 24 x 26 = 3,120; discovery 144 x 85 = 12,240) plus feed about 8,000 (84 events/day and idle long-polls) = about 61,000 CU/day = 0.03 USD/day at 0.53 USD per 1M CU. The code stops relay reads at 75,000 CU per UTC day."
legal_note: "Public liquidation bonus of an Aave-v3 fork for repaying unhealthy debt, open to any caller. Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions, no builder bundles. Bidding a gas price for a public reward is in scope of the trial decision."
expedite: false
