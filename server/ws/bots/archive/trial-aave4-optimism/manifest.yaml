id: trial-aave4-optimism
author: builder/claude-mythos-5-2
chains: [optimism]
strategy: "trial: Aave V4 liquidations on the EtherFi borrowing market spoke (0xdffcc353...) on OP Mainnet, USDC debt against USDC, WETH or USDT collateral; the bot waits on the farm feed for AnswerUpdated of the Chainlink aggregators behind the spoke oracle (ETH / USD, USDC / USD, USDT / USD), re-reads the 100 borrowers nearest the threshold when a price changed, then one tx through the executor - Morpho zero-fee USDC flash loan, liquidationCall, sell the seized collateral on a UniV3 pool (no swap for USDC collateral), repay, USDC gain or revert."
copied_from: "takers of the spoke's LiquidationCall in the last 7 d: 0x5ac9bc14376bf2727c6211960cf3cec1e2f295bd (EOA 0xd9fffdf0c4b18fb7e225da15b2af9f88e55676c3, 105 of 139; e.g. tx 0xc430609f8772126366a3cd1dee7d33c285852f7d65cfc360b1af93b72c11b753 block 159546187 USDC collateral kept 1.561698 USDC, tx 0x4ac18acb446b1feed50db86841bc1a3fdedff8e70ca2ea1aca2e076db526292a WETH collateral kept 5.84 USDC, tx 0x64efb5a673d95650f2537f06024dd46f64ab84caad1c5700cc46cdb07395550d USDT collateral kept 4.43 USDC: same Morpho flash + UniV3 route), 0xf000042d2b48921c234f15d167e7874f594f303e (tx 0x2f6479d241b791d531a32309c134ddf556efd0a01b60fd7bbc98ee0fbb6e9bce block 159545452, the fork-proof case), 0x4661f836f07c78a01d5490bff6e8587b9291c6b8, 0xdcb39a676748c29b2ffe5f97fe607d3238f855fb; sister bot trial-aave4-base"
capital_usd: 18
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialAave4TakeOp.take reverts NoProfit() unless its USDC balance grows by minProfit (scratch/trial-aave4-optimism/contracts/src/TrialAave4TakeOp.sol:88), so a lost attempt costs gas only. Gas cap per send in bot.py:75-79 and 329-339: GAS_LIMIT 1,300,000 x maxFeePerGas <= 0.15 gwei = 1.95e-4 ETH (0.35 USD at ETH 1,800; valued at a deliberately high 4,000 USD/ETH plus 0.02 USD L1 data fee it must stay < 1 USD or the bot does not send). The bot sends only when simulated gross > that gas cap and passes the cap as minProfit. Priority-fee bid: at most 25% of simulated gross (BID_SHARE, bot.py:79), and never above the 0.15 gwei fee cap."
expected_value: "trial, win rate to be measured live; honest expectation is the tail only. 7 d competition at this entry (blocks 159,458,932-159,761,332; scratch/ra5c2/liqs2-optimism.json, scratch/trial-aave4-optimism/windows.json): 139 LiquidationCall, 5 takers (0x5ac9bc14 105, 0x4661f836 16, direct EOA calls 9, 0xf000042d 7, 0xdcb39a67 2); 54 in the bot's scope (WETH 40, USDC 11, USDT 3 collateral, USDC debt), takers kept 270 USDC on those (median 0.65); 22 of 54 taken in the block they became liquidatable, 24 one block (2 s) later, 8 stood 4 s or longer (gross 0.002-4.97 USDC kept by the taker; one of them pays 302 USDC as a full take), 4 stood 30 s; tx index median 43; winners' priority fee median 0.05 gwei, p90 4.4, max 21.4. One attempt is about 0.95M gas = 0.002 USD at the 0.001 gwei base fee, 0.35 USD at the bot's 0.15 gwei cap."
executor: scratch/trial-aave4-optimism/contracts/out/TrialAave4TakeOp.sol/TrialAave4TakeOp.json
executor_args: "{bot}"
executor_note: "No principal: the repayment comes from a Morpho Blue flash loan (zero fee) taken and repaid inside take(), so no principal_usdc. constructor(address bot) only; flash lender, debt token, spoke, reserve ids, collateral token, user, flash size, pool path and minProfit are call arguments, nothing is baked in and there is no setup tx. onMorphoFlashLoan accepts only the lender named for the running take(); the swap callback accepts only the pool of the running swap; both peers are cleared. Debt-token approvals (spoke, lender) are the exact amount and reset to 0. Only the collateral received in this call is sold and all of it must be sold (Leftover revert on a partial fill); an empty path is required exactly when the collateral is the debt token (BadPath otherwise). Profit is paid to the bot wallet in the debt token; the bot always passes native USDC 0x0b2C639c533813f4Aa9D7837CAf62653d097Ff85. Token calls accept tokens without a bool return. Owner-only sweep(token) for recovery."
fork_evidence: "scratch/trial-aave4-optimism/proof.py (lease, reset optimism 159545451, deploy, fund, 3 guards, success, repeat, then reset 159546186, deploy, success, guard, release); result in scratch/trial-aave4-optimism/proof-result.json. WETH collateral: success 0x79c1265585165329ddea4453d8ae8f4eb0df4e552463d20571aadf3d9e1c429b (fork block 159545456, gas 947,868): owner USDC +302.198860, user health factor 0.99693 before and 1.2348 after, executor left with 0 USDC / 0 WETH / 0 allowances. Reverts: non-owner 0x7a57c24cef5640fc3060579dc3a4902ea16ea60281aeda4dc1544060a6f36c5d (NotOwner 0x30cd7471), healthy user 0x8cb24d2ddf0e76fa13f2ee0ecaa0c8bb54c56b37113aa0e577a23dd951b8e8c0 (spoke error 0xe2fadb09, gas 326,163), minProfit above gain 0x70075fa12adde03d855a5f519e0ba85e3a9aff8ed218968c7b63d3e3cb93261e (NoProfit 0xe39aafee, gas 1,046,300), same user again after the take 0xded67fd2e3727791c4c0067c629aefcfaedb4c0180b1f61b0a05cfe5dbfaf2f1 (0xe2fadb09: nothing left to take). USDC collateral, no swap: success 0x2ac928aa66282fa9f1bf12f08b09daad83906f9c415e78289952eb7040df9950 (fork block 159546188, gas 704,214): owner USDC +1.561698, the same amount the mainnet taker kept; a pool path on that case reverts 0xf75d601808352b02ec33b914833e14b9002a95efa400284ea8fcf85868cb2d95 (BadPath 0x64325c91). Paper override = eth_getCode of the fork deployment (executor-runtime.hex). scratch/trial-aave4-optimism/selftest.py runs the bot's own scan / attempt paper path through the relay at the parent blocks of three mainnet takes: WETH 302.198859 USDC (block 159545451), USDC 1.561698 (159546186), USDT 4.429689 (159533073, the mainnet taker kept 4.42969), each an opportunity row and paper_sim success; hand-built calldata equals cast calldata; full scan at head: 12,890 borrowers, 10,237 debtors, 0 candidates, min health factor 1.0077."
awaited_events: "Feed /logs filter on optimism: AnswerUpdated(int256,uint256,uint256) topic0 0x0559884f...46fc5f on the Chainlink aggregators 0x16c04812fa9db1d0236c3841dda8e86225bc3f3e (ETH / USD, about 480 per day, last 24 h 353), 0xdb5a1d830b72ce47b881c0093dbc9c6321091e78 (USDC / USD, about 1 per day) and 0xfd7f8e6ba7b6d36f4b3c9013de5fa527d8347643 (USDT / USD, about 1 per day): the price sources of reserves 1, 0, 2 behind spoke.ORACLE() (source -> rateFeed() -> aggregator(), scratch/trial-aave4-optimism/trigger.py). On each log the bot re-reads the near set's health factors (getUserAccountData by Multicall) and attempts those under 1. Evidence that this log is the trigger: for 39 of the 40 WETH-collateral takes of the 7 d window the block in which the borrower became liquidatable is within 1 block of the last ETH / USD AnswerUpdated; the take came 0 blocks after that update 17 times, 1 block after 18 times, 2-16 blocks after 5 times (trigger-result.json). Next ETH / USD update: within minutes (0.15% deviation or heartbeat). Last liquidation at block 159760715 (2026-11-19 20:30Z); 139 in the last 7 days, clustered (21 on 2026-11-13, 95 on 11-14, 14 on 11-15, 4 on 11-16, 4 on 11-17, 0 on 11-18, 1 on 11-19). At placement the lowest health factor is 1.0077, so the next one needs about a 0.8% fall of that borrower's collateral."
good_signs: "logs/bot.jsonl: feed rows (events, blocks, delay_s about 1-2 s) each followed by a scan row labelled oracle_update with min_hf moving, safety_poll scans only when the feed was silent for 5 minutes; opportunity + paper_sim success rows when a health factor crosses 1; live: send_result rows with result won."
bad_signs: "feed_error on every cycle (feed down or the chain's 8 filter slots full: the bot then re-reads the near set every 60 s through the relay) or no feed row for an hour; feed delay_s above 3; scan_error or loop_error on every cycle; simulate_revert on every candidate with an error other than e2fadb09 (route or flash source broken); candidate_skip on every candidate (all crossings are out-of-scope collateral: widen the executor); live send_result lost with blocks_after_winner >= 1 on every send (always late); read_budget rows."
rpc_reads_per_min: "about 0.4: 1 Multicall eth_call per feed delivery (about 480 per day) plus 1 per 5 minutes of feed silence; 131 reads per full scan every 12 h; 1 per 60 s only while the feed is unreachable"
alchemy_cu_per_day: "about 40,000 (0.021 USD): feed filter about 13,000 (480 logs x about 660 bytes x 0.04 CU, plus 3-4 CU/min idle = up to 5,800: at most about 19,000) + one 26 CU re-read per delivery about 12,500 + safety polls <= 7,500 + full scans 6,880 + attempts; relay hard cap 75,000 in code (CU_CAP), feed on top, total under 100,000"
legal_note: "The Aave V4 liquidation bonus is a public payout to any caller of liquidationCall(); no mempool watching, the bot reacts to confirmed Chainlink AnswerUpdated logs and reads confirmed state; it bids a priority fee for a public reward."
expedite: false
