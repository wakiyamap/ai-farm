copied_from: "EOA 0xf3f7364c818f996bcfcb83802523d972054d8b2f via contract 0x5f81f56a7faaff242a1074cc1ffe0a6de7c69456 (wrap take 0xf76c3405ecda8f145a9b1a025ca6e618e54833d90738c109fcbeea8c23f363b2, block 97,678,169; 7 takes in 7 days at blocks 97,455,986 / 97,483,547 / 97,657,033 / 97,660,003 / 97,660,033 / 97,678,142 / 97,678,169); EOA 0x1f96ec881d642476975c88fc8eb76c5d243791be via 0x0b3a59ee683e6d32e762839c5b2232d3f49c88fb (block 97,426,942)"
capital_usd: 5
