send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "StepArb.sol:108 reverts NoProfit unless the WPOL balance grew by at least minProfit after the flash loan was repaid; take() is owner-only (StepArb.sol:57) and the flash callback accepts only the lender set for this call (StepArb.sol:124); the gain is unwrapped and paid to the bot wallet as native POL in the same transaction. So a lost attempt costs only gas. bot.py:298-308 and bot.py:249: cap = gasLimit x maxFeePerGas (gas limit = eth_estimateGas x 1.2, refused above 900,000; maxFeePerGas = base fee x 1.25 + 30 gwei tip, refused above 1,500 gwei), the send is skipped unless cap is under 0.95 USD at a conservative 0.15 USD per POL and unless the simulated gross is above cap, and minProfit = cap (send_live), re-simulated at the signed gas limit before the send. Typical cap 0.24 POL = 0.018 USD at the measured 0.0756 USD per POL. Priority fee: the fixed 30 gwei Polygon minimum, about 0.012 POL per send, under 5 pct of any gross the bot sends for (gross must exceed the 0.24 POL cap); the bot never raises it."
expected_value: "Trial: win rate measured by sending, no counted EV. Competition, last 7 days (blocks 97,377,559-97,680,063, lockbox Deposit / Withdraw events, scratch/rcdd0/takes.py; table in README): 8 atomic takes by 2 operators (0xf3f7364c 7, 0x1f96ec88 1), kept 41.7 WPOL = 3.15 USD at 0.0756 USD per POL, gas about 0.12 POL a take, tx index 15-75, minimum priority fee. Windows (scratch/trial-xspace-arb-polygon/series-windows.json, the bot's own probe at blocks before each take): the gain stood 2 / 10 / 100 / 3 / 3 / 10 / 3 / 10 blocks (about 2 s each) before the take, and the incumbent's fixed size left most of the large gaps (46.8 WPOL available where it kept 33.3; 6.0 where it kept 0.47). The feed-driven bot aims at all of them: about 1 take a day, 40-60 WPOL (3-4.5 USD) a week if it wins most."
executor: scratch/trial-xspace-arb-polygon/contracts/out/StepArb.sol/StepArb.json
executor_args: "{bot}"
executor_note: "Constructor takes only the bot owner. take(lender, token, amount, steps, clear, minProfit, unwrap): the flash lender (Morpho Blue), the flash token (WPOL) and every step (target, token spent, spender, calldata) are call arguments; nothing is baked in and there is no setup tx. A step spends the executor's whole balance of its token (or a fixed amount), approves exactly that amount and resets the approval to 0. The executor is a generic step runner, which is safe because take() is owner-only and the executor holds nothing between transactions: the worst a bad route can do is revert. probe(bytes[]) is for eth_call only: owner-only, it tries each take() calldata through trial(), which always reverts (Trial(gain)), so nothing changes even if it were sent. The Morpho callback checks msg.sender against the lender set for this call and cleared after it. After the profit check every token named in clear (SPACE, xSPACE) is sent to the owner (dust; zero in both fork runs). Live code reads EXECUTOR_ADDR_POLYGON or EXECUTOR_ADDR; paper mode uses an eth_call code override (executor-runtime.hex = eth_getCode of the fork deployment, owner 0xc0ffee...0311). The runtime is 5,138 bytes, so the deployment costs about 1.2M gas, under the 3,000,000 limit."
fork_evidence: "scratch/trial-xspace-arb-polygon/proof.py <parent block> (one Polygon fork lease per run: reset, deploy the artifact with --args, fund, probe, non-owner, guard, success, repeat, leftovers, allowances; calldata built by bot.py itself). Run 1, reset 97,657,032 = parent of the incumbent's wrap take in block 97,657,033 (proof-result-97657032.json): probe from the owner wrap 3.886 / 11.140 / 25.002 / 46.797 / 36.584 WPOL at 20 / 60 / 150 / 400 / 800 WPOL, unwrap 0; from a stranger it reverts. Non-owner take revert NotOwner 0x5a8fc30db01546bd1aed375816761b2f551466987d2588494f371386603329f7. Guard revert NoProfit(46.797e18, 1e24) 0x653b9393a66bba3d097ffbf4552627a12c218a1648e3fa2fdb9b0ba5c148cd4a, 482,099 gas, owner -0.289 POL at the script's 600 gwei. Success 0x2b74a5d06c9a7cc0ef9f45c68c94a7f9b71e162cfee98dff0795c9632a6f9564 block 97,657,036, 400,820 gas, owner native +46.556 POL net of gas (gross 46.797 POL; the incumbent kept 33.284 WPOL on the same case). The same call again with minProfit = the first gain reverts (0x31082bc05dacb8fb60ad30b34cc8fa975bd59068da0b23de8c893fd10a416b1d: the gap is closed, the loan cannot be repaid); executor balances 0 in native, WPOL, SPACE, xSPACE; all seven executor allowances 0. Run 2, reset 97,660,002 = parent of the incumbent's unwrap take in block 97,660,003 (proof-result-97660002.json): unwrap 1.371 / 3.637 / 6.472 / 0 / 0 WPOL, wrap 0; non-owner 0x2571f006a083f41eab806d51a6b60265e85e1527d327231921ee88e5373b9dfd; guard NoProfit 0xa88af4a5b8f1e4f4256f2d00ea9cfd225e653ceb3d27abfa351144df59c2d5f2; success 0xce9ff7144da4be4e758e6090c3c511321b57ded76c61db273fe12b3f329c0910 block 97,660,006, 400,503 gas, owner +6.231 POL net (gross 6.472; the incumbent kept 4.807); repeat reverts 0x771502a993bd07fd025ee4661e66dbb5e4793c9a45423b6e626ecdd3a3ac48e1; executor balances and allowances 0. The paper bot's own check() pinned to those parents through the relay logs paper_sim success (46.797 and 6.472 WPOL against caps of 0.238 and 0.232 POL), paper_sim success at 97,483,546 (0.409 against 0.237) and a skip at 97,670,000 (gross 0.214 below cap 0.245 POL): scratch/trial-xspace-arb-polygon/selftest.py; its main loop on the live feed: selftest.py loop 50 (looptest.jsonl)."
awaited_events: "Swap on the Uniswap V3 xSPACE/WPOL pool 0xdf6d2471... (topic0 0xc42079f9..., 63 a day) or on the QuickSwap V2 SPACE/WPOL pair 0xd6ab3f53... (topic0 0xd78ad95f..., 9.5 a day), one feed filter. A take-sized gap opened 8 times in the last 7 days; last two on 2026-11-21 about 00:50 UTC (blocks 97,678,142 and 97,678,169); next: after any larger trade on either pool, about once a day."
good_signs: "feed rows about 70 a day, an opportunity and paper_sim success row about once a day with gross 0.4-50 WPOL above a cap near 0.24 POL; live send_result won with net_wei positive."
bad_signs: "No opportunity row in four days (the QuickSwap pair drained or liquidity moved); every live send lost with winner_block equal to or one below send_block (the incumbent or a new operator is faster); feed_error rows all day; read_budget rows."
rpc_reads_per_min: "0.25 on average: one probe eth_call per 5 min safety poll and one per feed event (about 72 a day); after a look that saw a gain up to 3 follow-up probes and 3 more reads (block, estimate, guard simulation)."
alchemy_cu_per_day: "About 11,400 relay CU (288 safety probes x 26 + 72 event probes x 26 + about 2,000 for follow-ups and opportunities) plus about 8,400 feed CU (72 logs x 900 bytes x 0.04 + 4 CU/min subscription): about 20,000 CU/day = 0.011 USD/day at 0.53 USD per million CU. Code cap 95,000 CU/day."
legal_note: "Public 1:1 wrapping of a token into its xERC20 form and back (XERC20Lockbox deposit / withdraw, open to anyone, the intended use) against public AMM pools: plain arbitrage between two pools of the same asset. No pending-transaction watching; the bot reacts to confirmed Swap logs and confirmed state."
