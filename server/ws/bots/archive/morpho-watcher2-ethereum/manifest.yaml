id: morpho-watcher2-ethereum
author: earner/qwen3.8-flash-next
chains: [ethereum]
strategy: >
  Fixed variant of the live morpho-watcher-ethereum (decisions/human/2026-11-12 item 2):
  poll the two measured collateral-sellable Morpho Blue markets on ethereum (WETH/USDC
  0x94b823e6.., WBTC/USDC 0x3a85e619..) every 60 s via Multicall3 (accrue + market +
  position + oracle price) and send the proven bot-deployed MorphoLiquidator executor
  (flashLoan -> liquidate capped seize -> UniV3 sell -> revert unless executor USDC rose
  by minProfit -> PAY the profit to the bot wallet in the same tx) — with the (c) profit floor lowered 2 -> 0.5 USD post-fee so captures
  grossing 1.01-1.34 USD (attempt 926 class (c)) are sendable, and with the (d) fix
  restamping every scanned in-debt candidate each cycle so the PIN_CAND_CAP trim evicts
  only debt-free candidates (the eviction of dormant debtor 0x5e1b7fff cost the live bot
  capture 26349648, repaid 525.62 USD).
copied_from: >
  morpho-watcher-ethereum (live bot, same protocol path, same executor contract of
  record): its 7-day pinned-market ledger census (17 Liquidate events, morpho_blue.liquidate
  source; the attempt-926 classification (a)=1/(b)=7/(c)=9/(d)=1) and the fork proofs
  recorded in bots/live/morpho-watcher-ethereum/manifest.yaml. The fix items are the
  decision's (c) floor and (d) eviction causes.
capital_usd: 16
principal_usdc: 0
allowed_contracts: [] # executor bot (review 4058f2ea blocker 1): every live send targets the gate-deployed executor; the signer allows it automatically (decisions/human/2026-11-11-executor-bots-funds.md)
max_loss_per_tx_usd: 20
max_loss_guarantee: >
  Same mechanism as the live bot of record (bots/live/morpho-watcher-ethereum/manifest.yaml):
  the whole action runs in ONE transaction through the bot-deployed MorphoLiquidator, which
  ends liquidate() with require(balAfter >= balBefore + minProfit) on its own USDC balance
  and reverts otherwise, so the worst case is gas only; maxFeePerGas is derived per cycle
  from the latest header (basefee x 9/8 + 0.001 gwei tip, capped 17.5 gwei) x gasLimit
  460000 <= 0.00805 ETH <= 20 USD at any plausible signing-time ETH/USD. The floor change
  lowers WHICH captures are attempted, not the gas bound: a NO_PROFIT revert costs gas only.
  PAYOUT variant (review 4058f2ea blocker 2): after the guard, liquidate() transfers its
  whole loan-asset balance (the proven profit) to the bot wallet (the owner) in the SAME
  transaction — a failed transfer reverts the whole tx, so the worst case stays gas only
  and no profit is left sitting in the executor for the watchdog/gate sweep to miss.
expected_value: >
  Measured on the pinned markets (attempt 926 ledger census + the live bot's accepted fork
  evidence): the poll-catchable class is 1 capture/7d at our capital cap (block 26384831,
  capital_limited branch repaid 398 USDC, oracle proceeds 415.45, gross +17.45 USD before
  the expected fee ~0.03-0.10 USD — proven positive fork delta +71.73 realized on the same
  case 0xede2f12f8793e4f41120d855de4051b025a6cf827fc6acf781903cc309ce689c); the (c)-fix
  floor adds 2 sendable captures/7d at 1.01/1.34 USD gross (blocks 26372995/26372996,
  dust-case fork delta +0.158935 USDC proves the executor's positive floor at dust size).
  Sum ~1.8 USD/day after gas at the measured pinned rate; sub-0.6-USD gross dust keeps
  skipping without RPC. Cadence measured this round (live bot sim log vs ledger capture
  ts): the two sendable (c)-fix captures stayed liquidatable 100 s and 112 s before the
  competitor captured them and the long-window captures >=47 min — every measured
  competitor arrived >=100 s after the position turned liquidatable, so the 60 s poll
  cycle still scans every sendable capture before it can act; only the 12 s-window
  (a)-class big capture (26384831) becomes ~20 % catchable at 60 s (the 20 s live bot
  measured 0/1 on exactly that capture, so the measured loss is 0).
executor: "scratch/morpho-executor-eth/contracts/out/MorphoLiquidator.sol/MorphoLiquidator.json"
executor_args: ""
executor_note: >
  PAYOUT variant (review 4058f2ea blocker 2): same constructor [MORPHO, WETH, WBTC, 0, 0,
  UniV3 WETH/USDC pool]; the WBTC route is armed by the one owner init tx
  setPoolAllowed(0x9a772018fbd77fcd2d25657e5c547baff3fd7d16, true) exactly as the live bot
  does — the bot verifies isPoolAllowed on the DEPLOYED executor and sends the init tx
  itself before arming the WBTC route. The minProfit floor is a per-call argument; the
  only contract change vs the live bot of record is the owner payout at the end of
  liquidate() (require(transfer(owner, balance)) + Swept event), fork-proven below.
fork_evidence: >
  PAYOUT executor proven on the shared ethereum fork (run ef61ac40, rerun script for the
  reviewer: scratch/morpho-eth2-proof.js + scratch/morpho-eth2-proof-log.txt, lease
  convention `fork lease ethereum 15` -> reset -> deploy -> run -> `fork release`): reset
  26328589, deployed 0xdac3acd3058c2d141df6f86e3855dd3feddaff52 (constructor args as
  executor_args), oracle update then SUCCESS 0x00656cf9580b65491033cec05ac9205b1967de1278979c35af9f111b41f19bff
  (liquidate WETH/USDC borrower 0x20f45e54..., gasUsed 332595, BOT-WALLET (owner) USDC
  balance 0 -> 3711168: delta +3.711168 USDC POSITIVE — the profit is PAID to the bot
  wallet in the same tx, executor left at ~0) and REVERT on the now-healthy position
  0xbca1059fac62913c57e3e43915c7888a90124ec872ed6d530737e40e4752d30c status 0. Proofs of
  the byte-identical-except-payout predecessor (same protocol, executor-retained profit):
  success 0x1d2da75de6512b99a92b255a08d7927a322761a204fe7467153064311d8bf8cb / revert
  0x4572a9c85e8a741032d84b5ae2e8122ad1af325e54017f15d68199a1dd108ace; dust-size success
  0x45ff8d9f9686b7a1bbab994b7b78a71f7cd268232e67448d28e42af045e9998b (+0.158935 USDC, the
  case the 0.5 USD floor admits); natural big case 0xede2f12f8793e4f41120d855de4051b025a6cf827fc6acf781903cc309ce689c
  (+71.731107 USDC at the capture block's own era fee) with healthy revert 0xe56b5b2865cef171c7b73d00b1b66e12fe5cc16c57cd8872caae7afdc87665bd.
awaited_events: >
  Liquidate on either pinned market (newest pinned captures: 26391772 (2026-11-11),
  26386155, 26385478/26385468/26384831/26384826 (2026-11-11, wave incl. the (a)-class
  92,326-USDC repayment), 26373743/26372996/26372995/26372986/26372984 (2026-11-08/09),
  ledger morpho_blue.liquidate). Measured pinned rate post-cliff ~0.49 events/day; the
  poll-catchable share is 1/7d. Next is an UNSCHEDULED event; the bot polls.
good_signs: >
  Paper logs: start row with runtime_ok true, candidates_refreshed growing from the deep
  backfill (deepCursor advancing from tip-450000), heartbeats every ~60 s with scanned > 0,
  restamped counting the pinned in-debt candidates, opportunities at hf < 1.05, and for any
  capture: opportunity -> simulate with sim_ok true, positive balance delta and min_profit_onchain
  at the 0.5 USD + expected-fee floor; dust rows log simulate_skip with NO eth_call.
bad_signs: >
  market_state_missing rows (multicall chunks failing), sims disabled by the fail-closed
  runtime check, a simulate that succeeds on a healthy position, restamped stuck at 0 while
  debtors > 0 (the fix would not be holding), POOL_NOT_ALLOWED on a WBTC sim, or gasUsed far
  above the fork-measured 307k-419k range.
rpc_reads_per_min: 10
alchemy_cu_per_day: 990000
legal_note: >
  Morpho Blue liquidations: the protocol pays the liquidator a liquidation bonus (measured
  seize factor 1.0438 = 4.38% of repaid debt at the 86% LLTV coverage cap) through public
  liquidate() anyone may call — an intended keeper mechanism under S; selling seized
  collateral on Uniswap V3 at the pool spot is an AMM sale, no sandwiches or wash trades.
expedite: false
