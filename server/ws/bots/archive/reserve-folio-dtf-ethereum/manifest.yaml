max_loss_guarantee: "the whole action (Folio.bid withCallback, the two Fusion venue legs, pay-the-Folio last, owner payout) is one tx through the bot's deployed executor: src/FolioBidV3.sol require(msg.sender == owner) + require(allowedFolio[folio]) + require(venue == swapper) (hardened entry, review 2026-11-08T17:33Z blocker 1: the callback approves EXACTLY this round's sellAmount to the pinned swapper, never the whole inventory, and resets the allowance after the legs), require(fundedOut >= bidAmount) (v5: the payment inventory is only ever paid from THIS round's mandatory funding-leg output, src/FolioBidV3.sol:236 — a payment drawing on pre-existing inventory reverts 'payment not funded', so pre-existing buyToken inventory is preserved and the loss bound holds in the common asset USDC), the venue legs revert on failure, the Folio-computed bidAmount is transferred LAST, require(delta >= minProfit) reverts unless the executor's buyToken balance ends >= start (the measured incumbent fill settled delta 0: venue output == payment in buyToken units, attempts 563/564), then the positive delta transfers to the immutable owner in the SAME tx; the principal stays in-contract on any revert (owner sweepToken) and only gas is lost. Worst case = signed gas cap GAS_LIVE 900000 x maxFeePerGas (v5: covers the funded mock success gasUsed 820946 measured in proof7 below; the previous 600000 sat BELOW the measured funded-route gas, review 2026-11-08T23:42Z blocker 3) (bot.py live_fee_bound, derived from the live base fee + tip) valued at the fresh Chainlink ETH/USD price; bot.py fails closed (no send) if gas x maxFee exceeds max_loss_per_tx_usd (measured 1.40 USD at basefee 0.039 gwei, feed 2233.74 USD/ETH, 2026-11-08). After-gas gate (review 17:33Z blocker 4): the live send requires the quote margin dstAmount - maxBuyAmount > 0 valued at the quote's implied USD price to exceed the signed gas cost, and sends with minProfit = that margin, so an accepted bid's realized owner payout is at least gas-valued (no zero-payout bid burns gas). Funding tx (review 2026-11-08T19:05Z blocker): fundSwap is guarded the same way - require(ok) on the venue leg and require(buyToken balance delta >= minOutput, the quoted dstAmount) revert a failed or under-delivering USDC->buyToken swap before the principal is spent: the USDC stays in the wallet on any revert and only gas is lost (fork txs in fork_evidence; the swap's own slippage bound is the quote's dstRate, the stated tiny loss is the quote-to-fill delta the executor guard already reverts). Atomic route (review 2026-11-08T20:45Z blocker 2): the live path sends ONE fundSwapAndBid transaction (selector 0x7cda801a, cast sig 2026-11-08T21:0xZ run af9209c6): it runs the funding leg (when usdcIn > 0) then the bid and the owner payout in the same call, the delta guard is measured against the balance AFTER the funding leg, and a failed bid therefore rolls the funding leg back: the USDC principal never leaves the owner wallet unless the complete route succeeded, so the whole-route worst case is the signed gas plus the minOutput-bounded funding slippage - a reverted bid can no longer leave the bot holding unsold inventory bought with its principal. V4 (run 558143e7, review 2026-11-08T22:09Z blocker 1): the loss bound is now enforced IN USDC UNITS - the bid leg's venue leg is quoted to pay the venue output in USDC to the taker (the winner's own fill chain ran exactly this leg first: CSCO -> USDC, then its separate USDC -> buyToken hop), the Folio payment is paid LAST from the executor's buyToken inventory (replenished by the funding leg), and fundSwapAndBid ends with require(executor USDC balance delta >= usdcIn + minProfit, USDC profit guard) (src/FolioBidV3.sol:208) followed by transferring the WHOLE delta to the immutable owner in the same tx: the wallet's USDC ends higher than it spent (net payout >= minProfit > 0: the live calldata sends the quote margin in USDC raw units, a zero-payout bid can no longer pass while burning gas), no price oracle; a failed bid or under-paying leg reverts the whole route with the principal still in the wallet, worst case gas. V6 (review 2026-11-09T01:15Z blocker 1): fundSwapAndBid additionally compares the FINAL balances of the two tokens the opaque legs can draw to their PRE-transaction balances: require(final buyToken >= preBuy) 'inventory guard' at src/FolioBidV3.sol:255 (the callback's vault/router/swapper buyToken allowances let the venue legs settle the payment on PRE-EXISTING inventory unvalued while fundedOut >= bidAmount, the bal check and the USDC guard all pass - v5 succeeded there with the inventory lower) and require(final sellToken >= preSell) 'sell inventory guard' at src/FolioBidV3.sol:256 (venue-side fee draws settle as transferFrom from the taker; preSell measured before the Folio transfer at src/FolioBidV3.sol:238): every asset the legs can spend ends no lower than it started and USDC ends strictly higher, so the loss bound holds in the common asset and the worst case is gas."
expected_value: "per-bid margin median 3-25 USD, tail 150-2900 USD (measured auction fills, attempts 549-550); pool 70-130 USD/day shared by 4 incumbents; auction fills at 83% of window show non-zero-sum competition but permissionless bids need no speed (precomputable decay: k = ln(corridor)/1800 s); cadence + window timing measured from the 30 d census scratch/dtf-census-30d.json (run 38ad2623): 25 AuctionOpened + 13 RebalanceStarted over 2026-10-19..11-06 (19 d, ~1.3 opens/day in bursts, each auction 1800 s), 68 real-pair incumbent bids land at window frac 0.53-0.94 (median 0.66, dust bids at 0.0-0.19) -> a 15 s poll is inside every measured winning window"
