id: trial-openoracle-settle-optimism
author: builder/claude-mythos-5-2
chains: [optimism]
strategy: "trial: settle due OpenOracle reports on OP Mainnet for the settler reward (5e-7 ETH each, settleable 10 s or 4 blocks after the report), one executor call per report, timed for the first eligible block"
copied_from: "EOA 0x609c873861fe5db54ec982d476d6535c1561f94c calling OpenOracle 0xf3cce3274c32f1f344ba48336d5eff34dc6e145f settle(uint256) directly (e.g. report 68595, tx 0xc165f9843de3..., block 159883182, landed in the first eligible block at priority 1,000 wei); the report creator 0xb0481ca173d230e17372cc9ed099151ff4c8375e settles what is left 18-90 s later (report 68636, block 159886772)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.01
max_loss_guarantee: "Executor OoSettler.settle reverts NoProfit unless its ETH balance grew by minProfitWei (contracts/src/OoSettler.sol:36), and the bot sets minProfitWei = the signed gas cap + 1 (bot.py plan(), min_profit_wei); so a lost attempt costs gas only. Signed gas cap per send = gasLimit x maxFeePerGas + L1 allowance <= MAX_CAP_WEI 3e-7 ETH (bot.py plan(), fee_cap), under 0.01 USD. Trial bid: the priority fee x gasLimit is at most 25 pct of the reward (BID_SHARE), at most 300,000 wei per gas (TIP_WEI)."
expected_value: "7 days to block 159,894,376: 3,228 settles = 461 a day, each paying 5e-7 ETH (about 0.0009 USD) for about 5e-9 ETH of gas; the whole class is about 0.42 USD a day. Sample of 80 settles over the week (scratch/ra2a6/oo_timeline.py): in the first 3 days the report creator settled all 35 itself, 18-90 s late; EOA 0x609c8738 arrived near block 159,740,000 and has since taken 32 of 45 (19 of the last 23) in the first eligible block at a 1,000 wei priority fee, tx index about 18; the creator still settles the rest late. So today about 80 pct is a same-block contest decided by the priority fee and about 20 pct stands for 18 s or more. The bot aims at both: it bids up to 300,000 wei per gas (25 pct of the reward at most) for the first eligible block. All won = 0.4 USD a day; a lost attempt costs about 2e-8 ETH, so it pays above a 5 pct win rate. (attempts:3887 and its correction row)"
executor: scratch/trial-openoracle-settle-optimism/contracts/out/OoSettler.sol/OoSettler.json
executor_args: "{bot}"
executor_note: "OoSettler(address bot): owner-only settle(address oracle, uint256[] ids, uint256 minProfitWei) calls oracle.settle(id) for each id (try / catch), reverts NoProfit(gained) unless its native balance grew by at least minProfitWei and by more than 0, then sends its whole native balance to the owner. receive() accepts ETH only from the oracle of the running call (set at the start, cleared at the end). No baked targets, no setup transaction, no token approvals. Deploy gas about 250,000."
fork_evidence: "scratch/trial-openoracle-settle-optimism/proof.py (one script: lease, reset optimism 159886762, deploy, fund, checks, release; result proof-result-68636.json). Report 68636 was due at block 159886759 and settled on mainnet at 159886772. Success 0x4ac0825ba5d0630c709b4b89f8660ed34da74902c923654f2e8f79fe31056ac7 (fork block 159886767, gas 128,094): owner native +370,209,578,925 wei after gas at 1e6 wei per gas (gross 5e11 wei = the settlerReward, minus the fork's unreported L1 fee 1.7e9 wei), executor balance 0 after. Correct reverts: guard with minProfit 1e18 0x6defd229c69f105c371bd42beaa3b33c83369dc6d6ba78e4cef5c0dda117852f NoProfit(5e11), gas only; the same report again right after the take 0x458ce9ad4b45ea82b168bb05905d8865229134397935880e42130a5b0f67805a NoProfit(0) (64,770 gas); an unknown report id 0x5671f870f368e6c6b8fed9c92c507c3c818d0121dc5868e146c7031220f34171 NoProfit(0); non-owner 0x613499e3e515a40c0ddae98ce4b16bbf6fd9581bc67243dcb25087e9a4cf4588 NotOwner. The script also checks the bot's calldata against cast and the bot's event parser against the report's real log (due block = first block with timestamp >= reportTimestamp + settlementTime)."
awaited_events: "InitialReportSubmitted on OpenOracle 0xf3cce3274c32f1f344ba48336d5eff34dc6e145f (feed /logs); about 461 a day (one every 3 minutes on average, in bursts), last seen in the paper log within minutes of the start; each becomes settleable 10 s (time type) or 4 blocks (block type) later"
good_signs: "paper_sim result=success rows (the reward still stood 2 s after the due block); live: send_result result=won with blocks_after_due 0"
bad_signs: "no opportunity rows for an hour (the creator stopped posting reports); every paper_sim a revert (a first-block settler takes them all); live: result=lost reason=early (sent too soon, SEND_LEAD_S) or a run of reason=taken"
rpc_reads_per_min: 1.5
alchemy_cu_per_day: 75000
legal_note: "Public keeper reward: settle() has no access control and pays the settler reward the report creator deposited for exactly this call. No mempool watching, no reaction to pending transactions; the send time is computed from a confirmed event. Posting or disputing reports (which needs funds locked across transactions) is not done."
expedite: false
