id: trial-aave-avalanche
author: builder/claude-mythos-5-2
chains: [avalanche]
strategy: "trial: flash-funded Aave v3 Avalanche liquidation (native-USDC debt; BTC.b, WETH.e, WAVAX or USDC collateral), after a confirmed LiquidationCall on the feed or a 60 s near-HF scan"
copied_from: "Public Aave v3 Avalanche takers (census scratch/trial-aave-avalanche/liq-rows.json, blocks 100,212,506-100,612,000): liquidator contract 0x2c08916e42e48644091a3a37b68df3de2e2a74c6 (32 of 71 events, e.g. tx 0xad213e2da33b76dc6e926f2a996a949c2efa2e0bffd85ce737068e1ce5a64f1e), 0x777e0fc6d730cc42b853dc66e9fa1d8700000000 (21, e.g. tx 0x3e23803a51ba528e62c334faa86e03393eca932ddf3eccc137c211df3413a02b), and the fork-proof case tx 0x91255809bb6e7882633434cb1a7f5aa87c5708b89c3a079cb42f8fcdb40bd06d (block 100333136, index 4)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialAaveAvalancheLiquidator.sol:69 reverts NoProfit unless the USDC balance grew by at least minProfit, and :79 pays the whole gain to the bot as USDC in the same tx, so a lost attempt costs gas only. bot.py:347 sets the fee ceiling so maxFeePerGas x gasLimit < 0.90 USD at the Aave oracle AVAX price (never above 2,000 gwei), :356 requires simulated gross > that signed gas cap, and :361 sets the on-chain minProfit to the gas cap. Priority fee bid is at most 50% of the simulated gross (BID_SHARE, bot.py:348). No principal: the cover is an Aave flashLoanSimple repaid with its premium in the tx; the bot wallet holds AVAX for gas only (10 USD)."
expected_value: "Trial: win rate measured by sends, no counted EV. 4.41 d to 2026-11-18 (blocks 100,212,506-100,612,000, scratch/trial-aave-avalanche/scan.py, analyze.py): 71 LiquidationCall events by 13 liquidator addresses (0x2c08916e 32, 0x777e0fc6 21, 0x2d9a3ba2 4, 0x988a2540 3); winner tx indexes spread from 0 to 98 (median 8), so no slot-1 incumbent. 24 events are in scope (native-USDC debt with WAVAX 19, BTC.b 4, WETH.e 1; covers 51 to 225,800 USDC, 14 above 1,000 USDC). parent_hf.py: 3 of the 24 were under water at the parent block (covers 608.12 and 566.51 USDC in block 100333136, and one dust position); 21 flipped inside the capture block (1 s blocks). The bot aims at the parent-underwater share and at users left under water after a cascade; the proof case paid 47.732183 USDC for 0.0089 AVAX = 0.06 USD of gas. A send today costs about 636k gas x 7.5 gwei = 0.0048 AVAX = 0.034 USD (AVAX 7.05 USD, Aave oracle)."
executor: scratch/trial-aave-avalanche/contracts/out/TrialAaveAvalancheLiquidator.sol/TrialAaveAvalancheLiquidator.json
executor_args: "{bot}"
executor_note: "Owner-only liquidate(flashPool, job, cover, minProfit, unwrap). Pool, borrower, collateral, debt token, swap router, fee tier and flash lender are all call arguments; constructor takes the bot address only; no setup transaction. The flash source is Aave flashLoanSimple (Morpho Blue on Avalanche holds about 500 USD): the executeOperation callback accepts only the lender set for the running call (cleared at the end), with initiator = the executor and asset = the job debt token. Approvals are exact and reset to zero (pool for the liquidation, router, pool for the repayment). The bot always passes debt = native USDC 0xB97EF9Ef and unwrap = false, so profit leaves as USDC. Same body as trial-aave-polygon's executor with the flash leg changed; own copy. Live address from EXECUTOR_ADDR_AVALANCHE or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-aave-avalanche/proof.py (lease, reset avalanche 100333135 = parent of the historical capture 0x91255809..., deploy artifact, fund owner, non-owner, guard, success, exhausted, release; output proof-result.json). Success 0x2be38a64647622392756469efa48c16715e4a5bce86a0658e1e2c7040f2fd463 block 100333139, gas 635616, owner +47.732183 USDC, native -8928283057857792 wei (gas), borrower HF 0.99869 -> no debt (607.97 USD -> 0), executor USDC/WAVAX/native and pool/router allowances all 0. Correct reverts: NoProfit guard 0xffcbf512b366b9d5aecfac65c88b6968d7f08381066e03759cc84698b672435e (0xe39aafee, owner USDC delta 0); non-owner 0x4e196f9042ac3de3c7c1fdd5606ee964fc4de5974dd0b4a893034a0fd6764dd2 (NotOwner 0x30cd7471); nothing left to take 0x9a7704593fcfba3dbf962a77bdb48d71653aad0cf5cc42542403312a684add9f (second call after success, 0x930bb771, owner USDC delta 0). The success lands at parent+4 because deploy and the two guard sends consume fork blocks. Only the 500 fee tier has a route for WAVAX/USDC (the 3000 tier simulation fails). scratch/trial-aave-avalanche/selftest.py: bot calldata equals cast calldata; result in the README."
awaited_events: "Aave v3 Pool 0x794a61358D6845594F94dc1DB02A252b5b4814aD LiquidationCall on the feed (about 16 per day in the census; last one at block 100575775 on 2026-11-17); every such event triggers a scan of the 200 nearest-to-1 health factors. Safety scan of the near list about every 60 s, full universe hourly, new borrowers from Borrow/Withdraw logs every 10 min. Next occurrence is not predictable (AVAX, BTC or ETH price moves)."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is)."
bad_signs: "No opportunity row in 7 days; every send lost by many blocks; simulate_revert on every underwater user (routes or dust rule); read_budget rows (75k CU cap hit); feed_error on every wait (no avalanche feed)."
rpc_reads_per_min: "about 1.2: one Multicall eth_call per minute (near scan), 2 per hour (full scan of the universe in batches of 200), one eth_getLogs + eth_blockNumber per 10 min, plus up to ~14 calls per detected opportunity (debt of 2,000 USD or more: up to 6 simulations per route and fee tier, about 20-40 calls)"
alchemy_cu_per_day: "about 49,000 relay CU/day (near scan 1440 x 26 = 37,440; full scan 2 x 24 x 26 = 1,248; discovery 144 x 70 = 10,080) plus feed about 5,000 (16 events/day and idle long-polls) = about 54,000 CU/day = 0.03 USD/day at 0.53 USD per 1M CU. The code stops relay reads at 75,000 CU per UTC day."
legal_note: "Public Aave v3 liquidation bonus for repaying unhealthy debt, open to any caller. Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions. Bidding a priority fee for a public reward is in scope of the trial decision."
expedite: false
