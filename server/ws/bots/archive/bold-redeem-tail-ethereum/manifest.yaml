id: bold-redeem-tail-ethereum
author: earner/qwen3.8-flash-next
chains: [ethereum]
strategy: "On a Liquity V2 redemption burst, redeem BOLD in the tail block: Morpho WETH flash -> WETH->USDC (UniV3 f500) -> USDC->BOLD (Curve-ng BOLD/USDC) -> CollateralRegistry.redeemCollateral -> sell wstETH/weETH back (UniV3 f100) -> repay; one tx that reverts unless the executor's WETH rose by minProfit, returns gross profit to the caller, and pays the bot wallet in native ETH."
copied_from: "tx 0x059d1b774bc8ed821c4a0510c59032bd0d582ea2d22195984e9a2e6eead15a2e (block 26417353, tail-block redeemer 47,375 BOLD, same pools; attempts:1298)"
capital_usd: 30
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 35
max_loss_guarantee: "BoldRedeemTail.sol redeem() reverts unless WETH_end >= WETH_start + minProfit, then withdraws all WETH and pushes all ETH to owner (contracts/src/BoldRedeemTail.sol:75-90); flash repaid inside the tx, so worst case = gas, bounded by gasLimit 1,500,000 x maxFeePerGas 7 gwei = 0.0105 ETH ~ 34.7 USD at the signing-time price; bot.py additionally sends only when the eth_call returns gross > that gas cap"
expected_value: "Counted EV = 1 occurrence per 30 d = gross +0.088917 ETH - gas 0.001357 ETH = net +0.087560 ETH = +289 USD = ~9.63 USD/day at 3,300 USD/ETH (above the ~0.34 USD/day live read cost), n = 1 independent event-day (the 2026-10-29 rush day); quiet days ~0. Full per-occurrence economics table (gross, gas, net, close timing and race class for every candidate): README 'Per-occurrence table', mirrored in windows30d.md v5 supplement; source scratch/bold-redeem-tail/sweep30d_v3.py -> table30d_v3.json + close_probe.py -> close_probe.json, reviewer d814f7a3 independently reproduced the same four gross/gas/net rows. Basis: of 228 bursts in 30 d, 224 have route <= 0 at the first block after the burst (absorbed in-burst, taken before our earliest block -> race, not counted); 4 stayed open past our landing block, actual closes measured at first-revert blocks T+60/36/48/36 s (close-L = 36/12/24/12 s); only burst 26300839 is simultaneously counted-class under 2026-11-14-race-rule-seconds.md (close 36 s after L >= bot R 18.06 s and >= farm R_eth 12 s per decision 2026-11-16-reaction-time.md), fee-feasible under the 7 gwei signed cap (landing base fee 0.76 gwei vs 62-163 gwei for the other three) and net-positive; the other three are net-negative at their crash-day landing base fees (-0.0076, -0.0879, -0.1031 ETH)."
executor: scratch/bold-redeem-tail/contracts/out/BoldRedeemTail.sol/BoldRedeemTail.json
executor_note: "no constructor args (owner = msg.sender = the bot wallet, immutable so the paper code-override carries it); redeem(wethIn,minProfit,buyLegs,sellLegs) returns gross profit uint256; markets/route are call arguments (no baked targets); uniswapV3SwapCallback pushes the input token to the pool; V3 exact-input = positive amountSpecified; limits MIN+1/MAX-1 for strict SPL pools; paper sims eth_call at relay latest with from=owner + code override eth_getCode of the fork deployment (executor-runtime.hex)"
fork_evidence: "scratch/bold-redeem-tail/proofE.sh (review 2026-11-15 18:12Z round: wallet payout + profit return + live-shaped from=owner sim); success tx 0x4e613e92191e6eddc320bf1c18f462d1e8a5e2d3b72a485864ca665582b38480 (status 1, gas 1,080,253, OWNER WALLET +0.00589231 ETH, all executor token balances and allowances 0 after, eth_call return 0.00589232 ETH matches) and guard-revert tx 0x39462d35183b187c6c39c22b356b9c8730d5f2a1c97b11320b35f3777f080d9f (minProfit 50 ETH, status 0, wallet delta 0 = gas only) at reset 26417352; live-shape case C: from=owner eth_call at head passes the owner guard (reverts only at minProfit-with-string); runtime hex = eth_getCode of that deployment (sha256 93223618334912f2...)"
awaited_events: "Redemption(uint256,uint256,uint256,uint256,uint256,uint256) at the 6 TroveManagers (topic0 0x84ec8e1674d62e3a8ff294b1a7f53527d2d10291765fadf94e0ce431b2334334); ~20 tx/day, bursts of 1-5 blocks, 56% multi-block (attempts:1298); last redemption block 26421613, none since"
good_signs: "burst lines in logs/bot.jsonl with bold >= 5k followed by sim_ok with gross_eth printed; sim_revert lines with the minProfit string are healthy (flat discount); skip_below_gas_cap and skip_fee_gate lines show the send gates working (fee gate added 2026-11-15 review round: sends only while latest baseFee + 1 gwei < the 7 gwei signed cap)"
bad_signs: "zero burst lines over 2+ days of ledger-active bursts (cursor/detector bug); sim_revert with non-guard errors (route breakage); sim_ok gross_eth > gas cap with no signer_reply (live path broken)"
rpc_reads_per_min: 6
alchemy_cu_per_day: "poll 2 calls/10 s (eth_blockNumber 10 CU + 6-address eth_getLogs ~60 CU) = 8,640 quiet cycles x ~70 CU ~ 604,800 CU + sims ~ 30k = ~635k CU/day = ~0.34 USD at 0.53/1M CU"
legal_note: "redemption arbitrage: buy BOLD at a discount, redeem at face with the protocol fee, sell collateral on public pools; no bug exploitation"
