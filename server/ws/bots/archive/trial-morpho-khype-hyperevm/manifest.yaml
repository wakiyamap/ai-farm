id: trial-morpho-khype-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: Morpho Blue kHYPE/USDC liquidations on HyperEVM (markets 0x96c47d37 lltv 0.77, 0xe7aa0468 lltv 0.625) by the direct permissionless Morpho liquidate (no auctioneer wrapper); a timer reads the positions nearest the line (60 s, 2 s while a sizable one is within 0.7%), the seized kHYPE is sold kHYPE -> WHYPE (pool 0xbe352daf) -> USDC (pool 0x6c9a33e3) inside Morpho's liquidate callback, one tx, USDC gain or revert."
copied_from: "actor 0x57d5ea52d617b0dc972703f327a60b2802dbc085 (executor 0x7250f80367c82452e843d292778b3dab346ad387): tx 0xfa43d53d55af3e2d0c36c9680bbeda10dce7e0a916e96d2284f84e77e7108eda (block 51274507, khype62, 928.95 USDC repaid, same two pools, 1,748 gwei); actor 0xd594df22325a6d84b75aaea719c4c8590b8cdf39: tx 0x4da0c91c07cf38143e70736e5d6620e004b0152714bfdde1c3c41f3f0a44f2fb (block 51257133, khype77, 2,012 USDC repaid, 2,271 gwei). Executor source is the author's TrialMorphoHyperTake (trial-morpho-whype-hyperevm) under a new name."
capital_usd: 20
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialMorphoKhypeTake.take reverts NoProfit() unless its USDC balance grows by minProfit (scratch/trial-morpho-khype-hyperevm/contracts/src/TrialMorphoKhypeTake.sol:86), so a lost attempt costs gas only. Gas cap per send in bot.py:70-79 and 353-361: gas limit x maxFeePerGas, with maxFeePerGas <= 0.95 USD / (on-chain kHYPE/USD from the Morpho oracle x 1.15, or 200 USD before the first read) / gas limit; gas limit 700,000 for positions and parts up to 5k USDC (about 16.4 gwei) and 1,900,000 for 25k and 100k parts (about 6.0 gwei), at most 0.83 USD either way at kHYPE 72.2; the bot does not send unless that cap is < 1 USD, the base fee is under it and the simulated gross is above it, and passes the cap as minProfit. Priority-fee bid: at most 40% of simulated gross (BID_SHARE, bot.py:79), never above the fee cap."
expected_value: "trial, win rate to be measured live; expect mostly lost sends. 7 d competition on these two markets (scratch/trial-morpho-khype-hyperevm/competition-7d.json): 18 Liquidate events >= 1 USDC, 8 sender EOAs, 11 caller contracts. 9 (keeper 0x6c246928, auctioneer-wrapper route) were taken while the direct route still said 'position is healthy' one block earlier: out of reach. 5 direct-route takes were takeable through this bot's executor one block before the winner (relay eth_call at that block, code override; gains 219.59, 149.18, 104.95, 71.54, 58.78 USDC) and healthy three blocks before, so the window is 1-2 blocks; winners paid 278-3,393 gwei. 4 large ones (85k-300k USDC repaid, winners 346-28,187 gwei) were over the line one block before; a 100k part runs out of gas at 700k, so the bot takes large positions in 100k / 25k parts at 1.9M gas and a 5k part at 700k (large-cases.json); its own attempt() pinned to the block before the winner simulates +6,706.22, +11,555.43 and +1,811.22 USDC on three of them (ladder_test.py, ladder-test.json). With the 1 USD send cap (about 16 gwei, 6 gwei on the 1.9M tier) the bot loses any same-block contest and wins only when its 2 s timer lands a block ahead of the incumbents; gross = (LIF - 1) x repaid minus pool fees (LIF 1.074 / 1.127), one attempt 438k-520k gas = 0.004 USD at the 0.1 gwei head gas price (up to 1.9M gas = 0.014 USD on the big tier)."
executor: scratch/trial-morpho-khype-hyperevm/contracts/out/TrialMorphoKhypeTake.sol/TrialMorphoKhypeTake.json
executor_args: "{bot}"
executor_note: "Deploy gas 1,025,463 (fork), under the 2,000,000 HyperEVM cap. No principal and no flash loan: Morpho hands over the seized collateral before its onMorphoLiquidate callback and pulls the repayment after it, so the repayment is the sale proceeds. constructor(address bot) only; market params, borrower, seizedAssets or repaidShares, the pool route (1-3 UniV3-style pools, collateral to USDC) and minProfit are call arguments. Morpho Blue on HyperEVM (0x68e37dE8...) and USDC (0xb88339CB...) are constants (counterparty and profit unit). onMorphoLiquidate accepts only Morpho while a take() is running; the swap callback accepts only the pool set for that hop; both peers are cleared; the USDC approval to Morpho is the exact repaid amount and reset to 0; a route that does not end in USDC reverts BadRoute. Profit is paid to the bot wallet as USDC. Owner-only sweep(token) for recovery. Source identical to TrialMorphoHyperTake except the contract name."
fork_evidence: "scratch/trial-morpho-khype-hyperevm/proof.py (lease, reset hyperevm to head 51477567, deploy by creation tx, fund, a stranger gets 50 kHYPE from the off-route pool 0x705d5dda and opens a max-LTV khype77 position (2,778.01 USDC borrowed), 10 min clock move, 4 guards, success, release); result in scratch/trial-morpho-khype-hyperevm/proof-result.json. Success 0xa92aa55f4e4e8b50c94408693de5041df3f8e6f3f66a76c3f6eb0d013b3080f5 (fork block 51477578, gas 438,212): owner USDC +203.362713, borrower's debt shares 2588150936560304 -> 0, executor left with 0 USDC / 0 WHYPE / 0 kHYPE / 0 allowance. Reverts: nothing to take (real healthy borrower 0x6adbdaae...) 0xf3391b3af60d10ec44439840d380080c043a1f72055dc200e06b963fe3af3b9c ('position is healthy', gas 146,383), minProfit above gain 0x738e9c8bad23f2ecaa3ff55e4acb0bc5d969f9f80152db978dee3542ade5a4d0 (NoProfit 0xe39aafee, gas 519,965), empty route 0x6f3215ccd169d860ee7bccc2bacb5d27de9fb5136eaa8ae14c5e985279a38b2a (BadRoute 0xc4c321d1), non-owner 0x79d42a0f70661282d6b31105b4eb2f1bb44a94df50c5b690e7a89056ac8a8e5d (NotOwner 0x30cd7471). The position is made on the fork because the hyperevm fork serves head storage at any reset block. Natural historical case in scratch/trial-morpho-khype-hyperevm/selftest.py (result selftest-result.json): the bot's own read/ratio/sim path through the relay at block 51257132, the block before actor tx 0x4da0c91c..., with the fork deployment's runtime as code override: ratio 1.00243, debt 2,028.10 USDC, simulated gain +149.180011 USDC ('position is healthy' at 51257131); a healthy borrower at head reverts 'position is healthy'; full scan at head: 685 debtors, one dust candidate skipped as gross_not_above_gas_cap. Size/gas ladder: scratch/trial-morpho-khype-hyperevm/ladder_test.py runs the bot's attempt() with every latest read pinned to the block before five winners (ladder-test.json): paper_sim success +6,706.22 (1.9M tier), +11,555.43 (1.9M), +1,811.22 (1.9M, after two reverted larger tries), +149.18 and +104.95 USDC (700k tier). Paper override = eth_getCode of the fork deployment 0x93e03707... (executor-runtime.hex)."
awaited_events: "A kHYPE/USDC borrower crossing its lltv on the stored oracle price (a HYPE drop). Last direct-route takes: blocks 51273083 and 51274507 (2026-11-14, the last HYPE drop); nothing above dust since. At placement kHYPE is 72.2 USD and 8 positions are at ratio >= 0.85; next occurrence = the next HYPE drop of a few percent, not predictable."
good_signs: "logs/bot.jsonl: scan rows every 60 s with top_ratio moving with HYPE; timer rows switching to the 2 s poll when a position nears the line; opportunity + paper_sim success rows when one crosses; live: send_result rows with result won."
bad_signs: "scan_error, relay_error or loop_error on every cycle; read_budget rows (the 90,000 CU cap was hit: the fast timer ran too long); simulate_revert other than healthy on every candidate (pool or market changed); opportunity_skip base_fee_above_fee_cap on every crossing (report as 'fee short'); live send_result lost with blocks_after_winner >= 0 on every send (always late or outbid)."
rpc_reads_per_min: "about 1.3 on the slow timer (one Multicall eth_call per 60 s, 5 per full scan every 30 min, eth_blockNumber + eth_getLogs every 30 min); up to 30 per min on the 2 s timer"
alchemy_cu_per_day: "about 51,000 on a quiet day (0.027 USD): polls 1,440 x 26 = 37.4k, full scans 48 x 5 x 26 = 6.2k, borrower discovery 48 x 85 = 4.1k, dust and borderline re-simulations about 3.6k; the 2 s timer adds 46.8k CU per hour and is allowed only while the day's total stays within the hard cap of 90,000 in code (0.048 USD). No feed filter."
legal_note: "Morpho Blue's liquidation incentive is a public payout to any caller of liquidate(); the bot reads mined state on a timer, watches no mempool and no pending transactions; it bids a priority fee for a public reward."
