max_loss_guarantee: "Executor take() reverts NoProfit unless the wrapped POL left after repaying the flash swap and selling the QUICK is at least minProfit (contracts/src/LairPairArb.sol _take(), the NoProfit line), and the bot sets minProfit = gasLimit x maxFeePerGas of that send (bot.py check(), cap, gain_of(leave_dir, amount, cap, gas_limit)); a lost send costs only gas, capped under 0.95 USD at a POL price of 0.25 USD (bot.py MAX_TX_USD, POL_REF_USD, MAX_FEE_CAP_WEI 3000 gwei, GAS_LIMIT_MAX 900000). Trial, it bids at most 1/10 of gross as priority fee, between 30 and 300 gwei (TIP_SHARE_DEN, TIP_MIN_WEI, TIP_MAX_WEI)."
expected_value: "Trial, no counted EV. Last 5.2 days at the entry (polygon blocks 97,442,387-97,742,387, scratch/trial-quick-convert-polygon/windows.json, attempts:3579), 5 takes by 3 operators (0xd1fe7c6c 2, 0x3124c160 2, 0x9db68eba 1), 0.2348 QUICK kept in total = 2.18 USD = 0.42 USD/day; per take 0.03-1.43 USD against 0.005-0.009 USD gas; tx index 10-89, effective gas price 272-354 gwei at a 245-250 gwei base fee (no priority auction). Every take came 510 s or more after the pair trade that opened the gap (median 4,675 s); the feed-driven bot looks about 1 s after the pair's Sync, so it aims at all of them above 1.3 x its gas cap (about 0.17 POL = 0.013 USD at today's fees)."
executor: scratch/trial-dquick-lair-polygon/contracts/out/LairPairArb.sol/LairPairArb.json
executor_args: "{bot}"
executor_note: "LairPairArb, constructor (owner) only. Pair, vault, base token, sale pair, wrapped native, direction, size, pair fee and minProfit are call arguments. Callback uniswapV2Call checks msg.sender against the pair set for this transaction (cleared at its end) and sender == the executor. The one approval (QUICK to the vault, enter direction) is the exact amount and reset to 0 in the same call. Profit is unwrapped and paid to the bot wallet as POL. probe() and sim() are eth_call helpers (owner only / self only). Runtime 5,154 bytes, deploy about 1.2M gas."
fork_evidence: "scratch/trial-dquick-lair-polygon/proof.py (one script, lease, reset polygon 97541572 = parent of the incumbent take in block 97541573, deploy, fund, probe, guards, success, repeat, staged enter direction, release; result proof-result-97541572.json). Success 0xd6c578ca077fd1a3aef15837f87c252cc72178da1a3ac234feb7b66cecfee05a (fork block 97541576, 234,909 gas, leave direction, 1.1246 dQUICK), owner native +17,914,698,854,884,474,417 wei after gas, paid 18.0087 POL = the probe value (the incumbent kept 0.1533 QUICK, about 18.6 POL). Correct reverts, guard 0x9944b63dab13fa8f3332cf647dc76d83f9f7aae007ba2842308426d709b3aae4 (minProfit 1e24, NoProfit 0x31708d59), non-owner 0x861bc07863ab807aacb869bebc3a12bb0d3f586f2d0414664a016f77b93538d6 (NotOwner), repeat with the same minProfit after the take 0xfb66910a674214d91bd542adb07764c497f07c71be901bf08e64fbfba7277c9d (reverts, probe after = 0 for every size). Enter direction staged on the same fork (a stranger buys dQUICK with 4 QUICK), success 0x9db4ed417cfc9891a1c8f91bf2f38bc8dbe3223c2564a2b976cc51b878126f5f (+70.899 POL after gas), repeat 0x0c52b0057123f33eaa852d5c80673112e107b7b91b83141dfa6481ae377a4e5a reverts. Executor leftovers 0 (WPOL, QUICK, dQUICK, native), allowance 0. Paper path, selftest.py, relay eth_call with the code override at the parents of three takes shows 18.009 / 5.114 / 0.446 POL."
awaited_events: "Feed /logs/polygon, Sync(uint112,uint112) on pair 0xb187ad7bb9933bc4152f3da30e18600352d65792 (about 8 logs a day), plus a 300 s safety poll: a dQUICK sale into the pair that leaves its price more than about 0.4 pct under the vault rate (or a purchase that leaves it above). Last taken 2026-11-21 in block 97728161 (block timestamp 1795297711); 5 takes in the last 5.2 days, so the next is expected within about a day."
