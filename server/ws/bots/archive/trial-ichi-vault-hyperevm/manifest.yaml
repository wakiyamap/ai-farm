id: trial-ichi-vault-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: ICHI vault IV-NEST-16 (USDC deposit, Nest Algebra WHYPE/USDC pool) deposit / withdraw pricing versus the HyperCore-priced WHYPE/USDC pool 0x586304. When the HyperCore HYPE price is above the Nest pool's price, one tx flash-borrows USDC on Morpho Blue, deposits it into the vault, withdraws the shares at once (pro-rata USDC + WHYPE), sells the WHYPE on the HyperCore-priced pool, repays, and pays the USDC gain to the bot wallet, or reverts. No event marks the gap, so the bot polls one eth_call of the executor's scan() (6 flash sizes) every 27 s."
copied_from: "flash recipients 0x7b9836a3fa0824572c2f7e69beb19c351d80548b (EOA 0x0b8d87ee4ee429a60e8f5738c3a2d7d6e8ad8471): tx 0xcd7b75eb3282676f5fdc0da9c57c6e8e1ab7d9f6b5f3b8465565748c106dad61 (block 51,781,939, +8.172130 USDC, 653,480 gas), 0xbd90dc482eea3c3376c76f3eab4fa16682a3be7fe76bd06f332af9335b9057f3 (+3.724771 USDC); 0x30e81e4d8790fd5203072ebba81f8e5d85f513a3 (EOA 0x454c16ca9e6b817f4b6ff86292783c14db07a7e4): tx 0x8fd4d0e2b9f065e59a9d100ea25918434aa5c3b2dcbb22a60b1a9cb059749f89; 0x79350c4b4f09650af22d4755c32727bd87878ea8 (EOA 0x867b39b6b4a90c8855fd8aa843af46534752de11): tx 0x740f54155460cfaf28a83f798d7eb04dc7b91897a206dddac7892054ba877408 (+0.872902 USDC). Same vault, lender and sell pool, same call order (Morpho flashLoan, vault.deposit, vault.withdraw, pool.swap); changed: this one vault only, size chosen by simulation from 6 fixed sizes."
capital_usd: 20
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor IchiVaultArb.run requires profit > 0 and profit >= minProfit in the borrowed token after the flash loan is repaid (scratch/trial-ichi-vault-hyperevm/contracts/src/IchiVaultArb.sol:65; a losing route already fails at Morpho's repayment pull) and a deadline (:62), so a lost attempt costs gas only. Gas cap per send in bot.py evaluate() (constants GAS_LIMIT_MAX to GAIN_OVER_CAP): gas limit = eth_estimateGas x 1.25 (at most 1,900,000); maxFeePerGas = base fee x 1.3 + bid, never above fee_ceiling = 0.95 USD / (gas limit x HYPE price), HYPE valued at the WHYPE/USDT0 pool price x 1.15; no send unless the simulated USDC gain is at least 1.2 x that cap (GAIN_OVER_CAP); minProfit is set to the cap in USDC. Priority-fee bid: at most 35 pct of simulated gross (BID_SHARE), never above the fee ceiling."
expected_value: "trial, win rate to be measured live. Competition, 7 d to 2026-11-20 18:47Z, blocks 51,172,538-51,792,538 (scratch/trial-ichi-vault-hyperevm/measure7.json): 248 same-transaction round trips on this vault = 35 a day, measured gain 112.96 USDC (a floor), median 0.0215, max 13.52; 46 takes of 0.5 USDC or more sum 100.01 USDC, 13 at tx index 0 and 33 later in their block; fee share of gross on those, median 17 pct, gas price median 5.98 gwei. Takers: 0x30e81e4d 109 takes +48.98 USDC, 0x7b9836a3 30 takes +37.52, 0x79350c4b 16 takes +13.04, about 19 more contracts. The largest takes are bid at 23-75 gwei, above this bot's ceiling of about 13-17 gwei (0.95 USD cap), so the bot aims at the pieces left after the first taker (takes come in runs of 2-4 over seconds) and at mid-size gaps: a few sends a day expected, share unknown. One lost attempt: about 880k gas = 0.005-0.08 USD at 0.1-1.5 gwei."
executor: scratch/trial-ichi-vault-hyperevm/contracts/out/IchiVaultArb.sol/IchiVaultArb.json
executor_args: "{bot}"
executor_note: "Deploy gas 1,188,466 on the fork, below the 2,000,000 HyperEVM cap. constructor(address bot) only (owner is immutable); Morpho, token, size, vault, sell hops and limits are Params call arguments. The Morpho callback and the swap callbacks (uniswapV3SwapCallback, algebraSwapCallback, pancakeV3SwapCallback) accept only the counterparty set for this step of this transaction; it is cleared at the end. Approvals are for the exact amount (vault: reset to zero after the deposit; Morpho: used up by its repayment pull; both read 0 after the fork success). scan() is an owner-only eth_call helper that rolls every candidate back (probe() always reverts with the result). Profit is paid in HyperEVM USDC 0xb88339cb7199b77e23db6e890353e22632ba630f (the token the sibling hyperevm trial bots pay in). No native is handled."
fork_evidence: "Script scratch/trial-ichi-vault-hyperevm/proof.py (python3 proof.py; output proof.json; one script: lease, reset 51,781,938, deploy, fixture, guards, success, release). The sell pool reads HyperCore precompiles 0x0808 and 0x080e, which the anvil fork lacks; the script places a fork-only replay fixture (mock/src/PrecompileReplay.sol, anvil_setCode at those two addresses only) that answers with the bytes the real precompiles returned inside incumbent tx 0xcd7b75eb3282676f5fdc0da9c57c6e8e1ab7d9f6b5f3b8465565748c106dad61 (block 51,781,939, tx index 0; trace-cd7b.json). Executor artifact, vault, pools, Morpho and USDC are untouched. Owner 0x1111111111111111111111111111111111111111. Deploy 0xfacaba50feebfaa59154a50aa28875752f4ef8ae8d7a6b6469ddfd85987fcad5 (executor 0x8f7a45ebde059392e46a46dcc14ab24681a961ea, 1,188,466 gas). SUCCESS 0xda0b33c001147ebf933355ade33b7381ef3f13ca3417d2204bc9d5af27b6fcb2 (fork block 51,781,944, status 1, 734,418 gas, run(USDC, 496,911.534201 USDC, vault, [sell pool], minProfit 1 USDC)): owner USDC 0 -> 8172130 = +8.172130 USDC, equal to the incumbent's gain to the unit; after it the executor holds 0 USDC, 0 WHYPE, 0 shares and both allowances are 0. Reverts, real fork transactions: nothing left to take (the same call after the success) 0xcf06dc41ea737e6a91671273b4e48f0797002fd8cd015856a553e4905ea4e8a6 reverts at Morpho's repayment pull; minProfit 100 USDC on the open gap 0x60da9b3bd8a0fe2121fc30314f8ee42d616b874964a884f82f46ba5c2ae8926f reverts 'no profit'; non-owner 0x01ef9cc07efdb093d5d61af7345a9732c4aa7aebe25797d3c09beb2072badd10 reverts 'owner'. scan() on the fork: before 49.7k / 165.6k / 496.9k / 1.49M USDC = 2.547815 / 5.600383 / 8.172130 / 0, after the take all 0. Limit: without the fixture the sell pool falls back to a worse price on the fork and the same call loses 9 USDC (this session's first run, before the fixture was added; its swap paid 9,223.02 USDC against the incumbent's 9,240.25). selftest.py: the bot's hand encoder equals cast's bytes for run() and scan(); one live scan answered for all 6 sizes. control.py: at latest through the relay the run() path executes fully and fails only at the repayment pull. Paper runtime = eth_getCode of the fork deployment above (runtime.hex; equal to the artifact runtime with the owner filled in)."
awaited_events: "No event: the gap opens when the HyperCore HYPE price moves above the Nest pool's price. The bot polls scan() every 27 s and acts when the best size's gain exceeds 1.2 x its gas cap. Last taken by others: 2026-11-20, 50 round trips on this vault in the 24 h to 18:40Z (e.g. block 51,787,416); 35 a day over 7 days, so the next one is expected within the hour."
good_signs: "logs/bot.jsonl: a poll heartbeat every 18 min; opportunity_skip or opportunity + paper_sim rows several times a day; live: send_result rows with result won and gas_used about 650k-750k."
bad_signs: "loop_error on every poll (vault or sell pool changed, or the node stopped accepting the code override); read_budget before 23:00Z; no opportunity or opportunity_skip row for 2 days while others still round-trip the vault (the bot's sizes or sell pool no longer fit); live send_result lost on every send with blocks_after_winner >= 0 (always late: report as blocks late)."
rpc_reads_per_min: "2.2 (one eth_call per 27 s) plus about 4 reads per evaluated gap"
alchemy_cu_per_day: "about 84,000-98,000 (0.045-0.052 USD): 3,200 scan polls x 26 CU = 83,200, plus 88 CU per evaluated gap; hard cap 98,000 relay CU/day in code, then it sleeps to 00:00 UTC. No feed filter."
legal_note: "Allowed by the human decision decisions/human/2026-11-21-ichi-yes-peapods-fee-no.md section 1: this is arbitrage between the vault's public deposit / withdraw pricing and the pool price, not an attack on the vault's accounting. deposit and withdraw are the vault's public functions (verified source), the sell pool and Morpho's flash loan are public. The bot reads mined state only, watches no mempool and no pending transactions; it may bid a priority fee for a public opportunity. It does not move the Nest pool's price (no swap on the vault's own pool), so it does not manipulate the price the vault reads."
expedite: false
