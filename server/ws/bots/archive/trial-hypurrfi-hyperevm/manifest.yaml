id: trial-hypurrfi-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: flash-funded HypurrFi pooled-market (Aave v3 fork) liquidation on HyperEVM (WHYPE, USDT0 or USDC debt; kHYPE, wstHYPE, WHYPE, USDT0 or USDC collateral; gain swapped to USDC in the same tx), after a confirmed LiquidationCall on the feed or a 55 s near-HF scan"
copied_from: "Public takers on HypurrFi Pool 0xcecce0eb9dd2ef7996e01e25dd70e461f918a14b, which call liquidationCall as anyone can: liquidator contract 0x372f85418ef5afeb82918a56ed5627c21df3c244 (24 of 67 takes in 7 d; e.g. tx 0xa39ace68ea5e53ae5884b61931f9d8efc35685237592a283dff5f55b2009ab72, block 51293282, UETH collateral / USDT0 debt, flash swap on pool 0xaeae6978), 0x86885a82046122aa8a7c43f579c3d64d559ee9a3 (15; e.g. tx 0x531116a495bd66b482f15bd106495b1c90494d87cdadc7dd2a59005dd393b5e4, block 51302821, Morpho flash loan of USDH then pool swaps, the same shape as this executor), 0x5ac9bc14376bf2727c6211960cf3cec1e2f295bd (12), 0x31401a479269af3a42ec351cfebb3368944b335a (5)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialAaveForkLiquidator.sol:76 reverts NoProfit unless the USDC balance grew by at least minProfit (the gain left in the debt token after the flash loan is repaid is swapped to USDC first, :67-74), and :78 pays the whole gain to the bot as USDC in the same tx, so a lost attempt costs gas only. bot.py:399 sets the fee ceiling so maxFeePerGas x gasLimit < 0.90 USD at the pool oracle's HYPE price (never above 100 gwei; gas limit never above 1,900,000, bot.py:97), :404 requires simulated gross > that signed gas cap, and :410 sets the on-chain minProfit to the gas cap. Priority fee bid is at most 50% of the simulated gross (BID_SHARE, bot.py:98 and :400). No principal: the cover is a Morpho flash loan repaid in the tx; the bot wallet holds HYPE for gas only (10 USD)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7 d to 2026-11-17 (attempts:1916, scratch/trial-hypurrfi/takes7d.json, blocks 50,931,683-51,536,483): 67 LiquidationCall on the pool by 9 liquidator contracts (0x372f8541 24, 0x86885a82 15, 0x5ac9bc14 12, 0x31401a47 5, others 1-3). Past takes were small: the 49 with stable debt covered 315 USD in total (largest 191.45 USDC and 71.31 USDH; 13 of at least 1 USD), against about 0.005-0.01 USD of gas per attempt. In scope of this executor (WHYPE, USDT0 or USDC debt with a supported collateral): 8 of the 67 (among them the two largest but one, 191.45 USDC and 13.11 USDT0, both on wstHYPE collateral). What the trial aims at is the standing book: the pool is in wind-down (16 of 19 reserves frozen) but still holds 2.21M USD of debt, 86% of it WHYPE, and 493 debtors with 1.05M USD of debt sit at HF 1.00-1.05 (head-scan.json at block 51,547,364), e.g. 142k USD on kHYPE collateral at HF 1.009. Fork gains for a 50% take of a 2.7k and a 1.5k USD e-mode position (bonus 3%): +20.16 and +10.64 USDC. With the trial cap of 1 USD per tx the bot can pay about 20 gwei at 600k gas, so it aims at small and medium positions in quiet times and logs burst cases it cannot afford as opportunity_skip."
executor: scratch/trial-hypurrfi/contracts/out/TrialAaveForkLiquidator.sol/TrialAaveForkLiquidator.json
executor_args: "{bot}"
executor_note: "Owner-only liquidate(morpho, job, cover, profitToken, minProfit). Flash lender, pool, borrower, collateral, debt token, the swap route (0-3 UniV3-style pools, collateral to debt) and the exit route (0-2 pools, debt to profitToken) are all call arguments; constructor takes the bot address only; no setup transaction. The flash callback accepts only the lender set for the running call and the swap callback only the pool being swapped on (both cleared afterwards). Approvals are exact and reset to zero (pool, Morpho). The bot always passes profitToken = USDC 0xb88339cb, so profit leaves as USDC whatever the debt token. Deploy gas on the fork 1,096,283, under the 2,000,000 HyperEVM limit. Live address from EXECUTOR_ADDR_HYPEREVM or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-hypurrfi/proof_head.py (lease, reset hyperevm to head 51,547,619, deploy by creation tx 0xf37244b4ecd0966ced9e0143e7bc8a3768108fe10317f1bd503abac34b4748b0, fund; for two existing borrowers, impersonated: withdraw collateral down to HF 1.00003, healthy guard, 12 h clock steps until interest puts HF under 1, non-owner, NoProfit guard, success, nothing-left; release; output proof-head-result.json). The pool is in wind-down, so a new position cannot be opened on the fork (USDT0 borrow reverts '50', USDH '28'). Case A, borrower 0x0577b58a28681386e4f09d24267df3879564dd57 (WHYPE collateral, WHYPE debt 2,702 USD, HF 0.99999 after 48 h): success 0xb02ac64fdcc12a0afa40797329f8bfe3f7b13e652e266a03a52771c263c640b6 fork block 51547631, gas 473545, owner +20.161193 USDC, HF after 1.0215; reverts: healthy 0xecedd48113dc9db05056aa13aef7cbd167c968969aa226c360192d83ba1bf260 (Aave error '45'), non-owner 0x0ef88e322cb0182947f0fc1a9c4ff1c98830a91057ed4d0502a587c90ebb6919 (NotOwner 0x30cd7471), NoProfit guard 0xb31e20ed336d370af7db62dbce29ffeafc1320dfecb2047da3a6aba02740eaf4 (0xe39aafee, owner USDC delta 0), nothing left 0x3304acccb187df3080b8415279276e9b9089b75d689786b6f57a7b78ff4454ed ('45', delta 0). Case B, borrower 0xb1c41450cb8a11a7e605e8be5ca30a4c9c9231c9 (kHYPE collateral sold on pool 0xbe352daf, WHYPE debt 1,515 USD, HF 0.99999 after 24 h): success 0xa6c82c6e29dc339a088ecbff9d13d3a62596a90bef3c07133fb321fcc06de66a fork block 51547641, gas 649862, owner +10.641796 USDC; reverts: healthy 0x18a6c26bc4d87908a94b8769a18cc417bf88891295a217da864db28aa420bf52, non-owner 0x8b8b0379758d985025a2719f0b607b5143ec2c535efbf3c944df2c2c5e128722, NoProfit guard 0x6587e97a0eb067ab1f507e37bbe827dd1947229796e5f6caa8f2b42e08b358ff, nothing left 0x8dfa8687ac834411f289f79378f3c91c03d4c20c364f889a7e5927fdebcba523. Executor USDC / WHYPE / kHYPE / native and pool / Morpho allowances all 0 after each case. scratch/trial-hypurrfi/selftest_bot.py (selftest-bot-result.json): bot calldata equals cast calldata for all 15 (collateral, debt) pairs, and the bot's bytes with the executor as a code override reach the pool at latest and revert '45' for the two (healthy) borrowers. Second script scratch/trial-hypurrfi/proof_routes.py (same steps, reset to head 51,548,001, deploy tx 0x8d1c34c02f1d577d4d6d13dbdc62f0dcc9855619bad6c0cf04a46d5e7b58d40d, output proof-routes-result.json), four more existing borrowers, each with healthy revert ('45'), NoProfit guard (owner USDC delta 0), success and a reverting second call: C wstHYPE collateral / WHYPE debt (0x17460637, 20 USD, pool 0xff0a1d68) success 0x273f8f19029bdb61936ffb960cad469812865ec20157248e378aaf62bf6d7c92 block 51548012 gas 777110 owner +0.399095 USDC; D WHYPE collateral / USDT0 debt (0x0b8710c2, 42 USD, pool 0xbd19e19e, exit 0x94291bea) success 0xea5432ce8092c939e2cbc104743cf1f7924e68834c9b7d74a4cb4f202088dcb2 block 51548020 gas 644408 owner +1.164919 USDC; E USDC collateral / WHYPE debt (0x490d205f, 214 USD) success 0xcbd80a2495a4382d6d64f1af8a851f50b88ecd0e74848e7f1ed34e37f3c5352b block 51548029 gas 592884 owner +4.606903 USDC; F wstHYPE collateral / USDT0 debt through two pools (0xbfe927d0, 127 USD) success 0xfa5980ad8b2f584d58f630fea710a02169c66cb7e0c586a92e82fa4a43a468f9 block 51548037 gas 864515 owner +2.231692 USDC. Not fork-proven: USDC debt (no single-collateral USDC borrower found; it is the path without an exit swap) and the kHYPE two-pool routes to USDT0 / USDC; the bot simulates the exact bytes before every send."
awaited_events: "HypurrFi Pool 0xcecce0eb9dd2ef7996e01e25dd70e461f918a14b LiquidationCall on the feed (67 in 7 d, about 10 per day, in bursts; last one at block 51479916, about 19 h before placement); every such event triggers 9 scans of the 200 nearest-to-1 health factors over 16 s. Safety scan of the near list about every 55 s, full universe hourly, new borrowers from Borrow/Withdraw logs every 10 min. Next occurrence is not predictable (HYPE price and kHYPE / wstHYPE ratio moves); the WHYPE-against-WHYPE loops decay on a schedule but the nearest reaches HF 1 only in about 124 days."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is); opportunity_skip rows with gross_usd of tens of USD in a burst (the size a higher per-tx cap would reach)."
bad_signs: "No opportunity row in 7 days; every send lost by many blocks; simulate_revert on every underwater user (routes); opportunity_skip unsupported_assets on most underwater users (USDXL / USDH debt dominating); read_budget rows (75k CU cap hit)."
rpc_reads_per_min: "about 1.6: one Multicall eth_call per ~55 s (near scan), 11 per hour (full scan of 2,172 users in batches of 200), one eth_getLogs + eth_blockNumber per 10 min, 8 extra scans per feed batch, plus about 8-30 calls per detected opportunity"
alchemy_cu_per_day: "about 60,000 relay CU/day (near scan 1,570 x 26 = 40,800; full scan 264 x 26 = 6,900; discovery 144 x 70 = 10,100; burst rescans about 2,100) plus feed about 5,000 = about 65,000 CU/day = 0.034 USD/day at 0.53 USD per 1M CU. The code stops relay reads at 75,000 CU per UTC day."
legal_note: "Public Aave-style liquidation bonus for repaying unhealthy debt on HypurrFi, open to any caller. Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions. Bidding a priority fee for a public reward is in scope of the trial decision."
