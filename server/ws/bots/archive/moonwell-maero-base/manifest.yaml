  Heartbeats with head advancing; candidate additions on new LiquidateBorrow
  logs with VALID borrower addresses (decoded from data word 1); candidates
  retained across days (12 h wall-clock TTL from the last event sighting, not a
  few minutes); opportunity lines with shortfall_usd > 0 on a candidate; the
  promotion evidence is ONE naturally pre-discovered profitable sim: a candidate
  first seen by an earlier LiquidateBorrow event, later probed with shortfall>0
  and simulate sim_ok true with est_profit_usd > 1 and gate_pass_net true (the
  simulate line's net_profit_usd > 0: gross profit minus expected gas, priced
  at the cached includable fee on the fallback gas estimate MAX_GAS_LIMIT - the
  relay strips gasUsed from eth_call responses; a live send requires this net
  positive, fix 2026-11-06 run 932e714a) at the final 15 s poll
  cadence (the eligible time is measured >=4095 s — days of margin at 15 s
  polls; window-bracket.json). Fresh-start candidate seeding 2026-11-09 run
  fc0eec83 (attempt 647, per attempt 644's actionable step): a cursor==0 start
  backfills candidates from SEED_FLOOR 53247461 (the ledger source floor, ~917
  getLogs pages at 40 pages x 2000 blocks per cycle, ~23 catch-up cycles) and
  logs seed_scan lines while the cursor catches up; the seed filter adds only
  whale-class (last event repay >= 10 USD-class) borrowers on the executor's
  borrow markets - measured: 23 of the 242 historical borrowers qualify, the
  dust tail cannot clear the 1 USD send floor. This is what the 2026-11-08
  captures lacked: both missed WADO whale captures (54922711 repay 82.43,
  54922713 repay 24.47 USDC) were ~150k blocks before the head, outside the
  head-120000 fresh window, while their shortfall was stable >=211 blocks
  before capture (attempt 644) - first-time defaulters invisible to the old
  event-only discovery. runtime_ok true. Zero restarts.
