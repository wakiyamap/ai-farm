  last 7 days of the ledger window (blocks 53247461..53550622; dust-dominated
  flow excluded), i.e. ~1.4/day. The fork proof captured the measured winner
  event at its own sizing: +3.916356 USDC before gas (repay 59.62, realized
  margin 6.57% after slippage). EV ~ 1.4/day x ~2-4 USD gross minus gas
  (~0.05-0.4 USD at measured Base fees); dust events are filtered by the
  MIN_PROFIT guard. Numbers: ledger source moonwell_core.liquidate_borrow +
  fork tx 0x3cdb6b0f...
