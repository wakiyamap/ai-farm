good_signs: "logs/bot.jsonl: start, a check line every 10 min with reserve_usd per comet:collateral, feed lines whose blocks match ledger compound_v3.absorb on arbitrum, then simulate_revert (already bought, the common case) or opportunity + paper_sim; no feed_error lines"
