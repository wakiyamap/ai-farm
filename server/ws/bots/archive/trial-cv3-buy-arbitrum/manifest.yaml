strategy: "trial: Compound v3 cUSDCv3 and cUSDTv3 Arbitrum buyCollateral of reserve residue left after anyone's absorb, flash-swapped on UniV3 in one tx (no principal, USDT surplus sold to USDC); feed-triggered, sends only when simulated surplus > that send's gas cap"
copied_from: "residue buys 0x8dd4d06d552c9fb85d850b909e0584665f6aedeeef923cacf46ecdddc82806ec (block 524328185, executor 0x44d8fa1e0e2e9b907cfed44b38c5f3838288b5b0, 49.34 USDT for 0.03 WETH, gross 2.06 USDT, 1 block after absorb 0x89fcb7f9..), 0x2e7b1c220d78222f7aec8482fc48335efabe67bfe9b6d1bf1f91e19da8bbf91d (same executor, gross 9.44 USDT) and 0x7c2b444229c937498a8ed741d3c44a84deb547964d102b2cd76cd2ef1c36fced (executor 0x48daab9f7ed6e3184c26d9ddaccc356d52d6237f); bot structure copied from live trial-cv3-buy-base"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Cv3FlashBuyOut.sol buy(): reverts NoProfit unless the executor's payout-token (USDC) balance ends above its start by minProfit+1, then sends it all to the owner (scratch/trial-cv3-buy-arbitrum/contracts/src/Cv3FlashBuyOut.sol:98); bot.py attempt() sets minProfit = the send's gas cap and sends only if simulated gross > gas cap = gasLimit (eth_estimateGas x 1.25, refused above 1,200,000) x min(0.2 gwei, 2 x base fee + priority) x 4000 USD/ETH, which is below 0.96 USD by construction (bot.py loss-guard block and the send rule in attempt()). Priority bid is at most 25% of simulated gross (BID_SHARE). Worst case per send = gas"
expected_value: "trial, no EV floor (decision 2026-11-17-cheap-chain-trials). 7 d on the two comets: 8 AbsorbCollateral events in 6 txs, 10 BuyCollateral; 6 buys atomic with the absorb, 4 residue buys by 2 executors (0x44d8fa1e: gross 2.06 and 9.44 USDT, 1 block = 0.25 s after the absorb, priority 1.5-1.9 gwei; 0x48daab9f: 2.71 USDC lot 2 blocks after, priority 0, and one dust lot). The bot aims at residue the incumbents are late for; the expected share is small and is what the trial measures"
executor: scratch/trial-cv3-buy-arbitrum/contracts/out/Cv3FlashBuyOut.sol/Cv3FlashBuyOut.json
executor_args: "{bot}"
executor_note: "Cv3FlashBuyOut: owner-only buy(comet, collateral, pool, payBase, minProfit, outPool); comet, collateral and both pools are call arguments, constructor arg is the bot wallet only. UniV3 callback accepts only the pool set for the running swap (cleared at the end); approves the comet for exactly payBase and resets to 0. outPool = 0 pays out the comet base (USDC comet); for the USDT comet outPool is the UniV3 USDC/USDT 0.01% pool and the whole USDT surplus is sold to USDC before the profit check. Holds nothing between transactions; owner-only sweep(token) for strays. Fork deploy gas 950,161"
