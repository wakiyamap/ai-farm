executor_note: "OvltDeposit: constructor(address usdc_, address wrap_, address ovault_) = the fixed mainnet addresses (Circle USDC 0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48, OverlayerCircle 18-dec C+ wrap 0xB17EE7D061e076ff1aD6bd2141888CFb39C0Ccdc, OVault-C+ 0x8aC6AD5D76D07B202832f323888B64286E944A9e); owner = msg.sender (the bot wallet) is an immutable with no constructor arg (gate deploys from the bot key, {bot} not needed); deposit(assets,minShares) pulls 6-dec USDC from the owner (one MAX_APPROVAL), mints the 1:1 C+ wrap (assets x 1e12 units), approves and deposit()s into OVault-C+ crediting shares to the owner, reverts NoProfit below minShares; exit(shares,minUsdcOut) approves the executor on the owner's shares, redeem()s them to the executor, burns the wrap 1:1 back as USDC to the owner, reverts NoProfit below minUsdcOut (the bot passes the principal exactly); wrap dust below 1e12 units stays in the executor (<= 1e-6 USD)"
