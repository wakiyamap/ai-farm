id: trial-levtoken-arb-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: Bounce.Tech leveraged tokens (HYPE5L, HYPE3L, NVDA5L, BTC5L) public mint and redeem at NAV versus their Hyperswap V2 pairs on HyperEVM. Each token has a public mint (no fee) and a public redeem (fee 0.3 pct x leverage) at a NAV read from HyperCore; the tokens also trade on Hyperswap V2 pairs (HYPE5L against ALT, the others against USDC). When the NAV has moved away from the pair price by more than the fees, one tx flash-borrows USDC on Morpho Blue and either mints straight into the pair and takes the other side (ALT is sold on the ALT/USDC 1 pct V3 pool), or buys the token on the pair and redeems it, repays, and pays the USDC gain to the bot wallet, or reverts. The NAV has no event, so the bot polls one eth_call of the executor's probe() every 27 s."
copied_from: "inventory executor 0xcc029db0386cd36cae20d4b7373d4bc669588f54 (EOA 0xc875f2277a5112364cc1e5ee9d9247a5d37dcefb): tx 0xc4c0d30ba5498bccecf2bbf2e62629c587d4ad2834bfcf364d8a2edc9a45a095 (HYPE5L mint into the ALT pair, ALT sold on the V3 pool, +0.027182 USDC, 288,196 gas), 0x1d65b4839dd1c78195c345233a617465079986e9e5da1e54ffbf53cbb141f52d (+0.040058 USDC), 0x5a3815d97faa127da49c2a77c5204707d3156f60a01fbb74b2af2623ec7a30ae (HYPE3L mint into the USDC pair, +0.063688 USDC); second operator executor 0xbf724fd409cbb2cb77cea0b1a840c7dc67bfcca1 (EOA 0x454c16ca9e6b817f4b6ff86292783c14db07a7e4). Same tokens, pairs and V3 pool; changed: Morpho flash loan instead of inventory, size chosen by simulation (10 / 15 / 20 USDC), the redeem direction added."
capital_usd: 20
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor LtArb.run reverts NoProfit() unless its USDC balance grew by minProfit > 0 after the flash loan is repaid (scratch/trial-levtoken-arb-hyperevm/contracts/src/LtArb.sol:105 and :115; a losing route already fails at Morpho's repayment pull), also tx.gasprice <= maxGasPrice and a deadline (:103-104), so a lost attempt costs gas only. Gas cap per send in bot.py (constants at :65-72) and evaluate() (:223): gas limit = eth_estimateGas x 1.2 (at most 1,900,000), maxFeePerGas = base fee x 1.3 + bid, never above 2 gwei (1.9M x 2 gwei = 0.0038 HYPE = 0.23 USD at HYPE 60.7); no send unless that cap valued at the WHYPE/USDT0 pool price x 1.15 is under 0.95 USD and the simulated USDC gain is at least 1.5 x it (GAIN_OVER_CAP); minProfit is set to the cap in USDC (:261). Priority-fee bid: at most 40 pct of simulated gross (BID_SHARE), never above the fee cap."
expected_value: "trial, win rate to be measured live. Competition, 7 d to 2026-11-21 00:45Z (blocks 51,209,568-51,814,368; scratch/r403a/measure.py, lt-measure.json; attempts:3120): HYPE5L 3,166 mints (112,502 USDC) and 2,473 redeems; HYPE3L 23 mints, NVDA5L 29, BTC5L 14. Two inventory executors hold the mint side: 0xcc029db0 1,595 mints (sample of 37 takes: gain sum 1.3755 USDC, median 0.0109, max 0.3833; fee sum 0.018458 HYPE = 1.12 USD; median 291,090 gas at 0.718 gwei; tx index median 5) and 0xbf724fd4 1,213 mints (sample of 26: gain sum 0.6498, median 0.0162, max 0.0851; fee sum 0.0066 HYPE = 0.40 USD; median 0.487 gwei). Both bid most of the gain as fee (base fee 0.1 gwei). The median take is about as large as its fee, so the bot (which needs gross >= 1.5 x its gas cap; for the fork-proven take of 0.032 USDC: 569k gas limit x 0.45 gwei = 0.018 USD cap, so it would have sent) will send on the larger moves only: roughly the top fifth of the incumbents' takes, tens a day in bursts. It aims at winning some of those; historical windows cannot be measured (HyperCore reads are not archived). One lost attempt is about 450k-600k gas = 0.003-0.03 USD at 0.1-0.8 gwei."
executor: scratch/trial-levtoken-arb-hyperevm/contracts/out/LtArb.sol/LtArb.json
executor_args: "{bot}"
executor_note: "Solidity 0.8.26, deploy gas 1,413,719 on the fork (below the 2,000,000 HyperEVM cap), runtime 6,289 bytes. constructor(address bot) only (owner is immutable); Morpho, USDC, leveraged token, V2 pair, pair fee, mid token, V3 pool, direction, size and limits are Route call arguments. The Morpho callback accepts only this transaction's lender and exact data; the V3 swap callback accepts only the pool set around that swap; all three are cleared afterwards. The only approvals are USDC to the token (exact amount, reset to zero) and USDC to Morpho (exact repayment, used up). The mint goes straight into the pair; V2 output is computed from the pair's reserves and its real balance. probe() is an eth_call helper that rolls every candidate back. Profit is paid in HyperEVM USDC 0xb88339cb7199b77e23db6e890353e22632ba630f. sweep(token) is owner-only dust recovery."
fork_evidence: "Scripts scratch/trial-levtoken-arb-hyperevm/proof_old.py (main) and proof.py. The tokens read HyperCore precompiles (0x0801, 0x080f), which the anvil fork lacks; the script places a fork-only replay fixture (mock/src/PrecompileReplay.sol, anvil_setCode at the precompile addresses only) that answers each input with the bytes the real precompile returned through the relay seconds earlier (same method as the live trial-ensemble2-arb-hyperevm). Executor artifact, tokens, pairs, V3 pool, Morpho and USDC are untouched. MAIN PROOF, natural gap at a fixed block, repeatable: `python3 proof_old.py` (output proof-old.json), 2026-11-21 00:59Z. The fixture is fed the precompile answers taken from the relay's debug_traceTransaction of the incumbent's take 0xc4c0d30ba5498bccecf2bbf2e62629c587d4ad2834bfcf364d8a2edc9a45a095 (block 51,812,906, tx index 9, HYPE5L mint of 10.000047 USDC, gain 27182 units = 0.027182 USDC; reads 0x0801(token, 0) and 0x080f(0, token)); fork reset 51,812,905 = its parent block (controls: the pair's reserves, the token's totalSupply and its USDC balance on the fork equal the relay's values at 51,812,905 and differ from head); next block timestamp = the real block's. probe() on the fork: mint 10 USDC = 32129 units, mint 15 and 20 = 0, redeem 10 = 0. SUCCESS 0x4e90eb33cda79f19fc9c9c8d418e6f3e43315f7fe81e7103b0134cf84af504e9 (status 1, 474,400 gas, fork block 51,812,913 = parent state plus this script's own deploy, fixture and revert transactions; run(HYPE5L-ALT, mint, 10 USDC, minProfit 28916)): owner USDC 0 -> 32130 = +0.032130 USDC (the incumbent, nine transactions into the next block, got 0.027182); the executor holds 0 USDC, 0 HYPE5L, 0 ALT after it. Reverts on the same fork state, real transactions: nothing to take (mint 15 USDC, probe 0) 0x64beace8319b41dcbd961fea7273da9a619663fb888d443e5a72fda2afcc024a reverts at Morpho's repayment pull; minProfit 64258 (2 x the gain) 0x3ced063158cd0bf9d20650135b1caa6e704983eed4dae9dedcf95ec4e3d43218 reverts NoProfit 0xe39aafee; non-owner 0x1eaaeb94148064e6586b802ab3e5d3e9c1f2330c84312dda3f97ecb145efbbaa reverts NotOwner 0x30cd7471. Deploy in that run: see proof-old.json (1,413,719 gas). SECOND RUN, head state with live precompile values (control: exchangeRate() on the fork equals the live value for HYPE5L 50780162392070308 and HYPE3L 2863699334720702858), `python3 proof.py 300 3000 induce` (output proof-induced.json), 2026-11-21 00:56Z, fork reset at head 51,814,985, owner 0x1111111111111111111111111111111111111111: no natural gap was open (the incumbents had been idle for 30 min), so a fork-only third party (existing ALT holder 0x6ad75b91391fc7779bf873f37d207eb7b5651fd4, impersonated) bought HYPE5L on the pair with 1,200,000 ALT (swap 0xed6a35bcd9ec5c4369ef7ce099d970c3af0157c8e01dcf001a741f2b9a09c68c), as any trader could; this is a made gap, NOT a mainnet gain, and the live probe of the same candidate was 0. Deploy 0x873b4bf931b822f923f0cc61caec864458078d12da7409053b70cd7ec7aa66ea (executor 0x8f7a45ebde059392e46a46dcc14ab24681a961ea, 1,413,719 gas). SUCCESS 0x2285595daad5ab4160279252372ae76612cc199813e7c7a6149eec4c09e246fe (fork block 51,815,008, status 1, 474,428 gas, run(HYPE5L-ALT, mint, 10 USDC, minProfit 169128)): owner USDC 0 -> 187920 = +0.187920 USDC, equal to the probe; after it the executor holds 0 USDC, 0 HYPE5L, 0 ALT and its allowances to the token and to Morpho are 0. Reverts on the same fork state, real transactions: nothing to take (HYPE5L-ALT mint 40, probe 0) 0x0f51c69d7dc0937af3a2c0047186491c2b0c4407589d0cf2d4674b44214aec64 reverts at Morpho's repayment pull; the open route with minProfit 375840 (2 x the gain) 0x4649ed2ddbc87cc5f06c6d504958d580b4183eb628cfb29b0e2891face3ae2b8 reverts NoProfit 0xe39aafee; non-owner 0x853d4857a9aa6009065c86ce9a8cbc8844c6e9dccba9ca20965d77543ca402c8 reverts NotOwner 0x30cd7471. Mainnet side, no gap (relay eth_call, runtime as a code override, diag3.py and selftest.py): run() of each route executes to the end and reverts only at Morpho's repayment pull ('transferFrom reverted'). `python3 proof.py 1700 3000` (no induce) is the head variant that waits for a live gap (output proof.json); it watched about 12 min in this session and no gap opened (the incumbents were idle from 00:17Z), so there is no proof.json. Limits: the fixed-block proof knows only the precompile inputs the incumbent's transaction read (HYPE5L), so the other tokens cannot be replayed that way; the head variants give other hashes on a re-run; the redeem direction and the USDC-pair routes have no fork success, only the no-gap revert at the repayment pull. selftest.py: the bot's hand encoder equals cast's bytes for run() and probe(); the paper runtime (executor-runtime.hex = eth_getCode of the fork deployment) equals the artifact runtime with the owner filled in; one live probe answered for all 14 candidates."
awaited_events: "No event: the NAV moves with the perp price. The bot polls probe() every 27 s and acts when a candidate's gain exceeds 1.5 x its gas cap. Last incumbent takes: HYPE5L mints at blocks 51,812,906 (2026-11-21 00:17Z) and 9 more inside 120 blocks around 00:13Z; they come in bursts when HYPE moves, about 400 a day over the last 7 days."
good_signs: "logs/bot.jsonl: a poll heartbeat every 18 min; opportunity_skip rows in every burst and opportunity + paper_sim rows a few times a day; live: send_result rows with result won and gas_used about 450k-600k."
bad_signs: "loop_error on every poll (token implementation upgraded, mint paused, or the node stopped accepting the override); read_budget before 23:00Z; opportunity_skip gross_under_1.5x_gas_cap on every gap for days (the incumbents leave nothing above the fee); live send_result lost on every send with blocks_after_winner >= 0 (always late: report as blocks late)."
rpc_reads_per_min: "2.2 (one eth_call per 27 s) plus about 4 reads per evaluated gap"
alchemy_cu_per_day: "about 86,000-98,000 (0.046-0.052 USD): 3,200 probe polls x 26 CU = 83,200, plus 88 CU per evaluated gap; hard cap 98,000 relay CU/day in code, then it sleeps to 00:00 UTC. No feed filter."
legal_note: "mint and redeem are the tokens' public functions at their own NAV and the pairs are public DEX pools; minting or redeeming against the pair price is plain arbitrage that pulls the pair back to NAV (two unrelated operators already do it about 400 times a day). The bot reads mined state only, watches no mempool and no pending transactions; it may bid a priority fee for a public opportunity. The protocol's role-gated functions (checkpoint, bridge, executeRedemptions) are not used. Same class as the Ensemble vault trials the human allowed (2026-11-21-ichi-yes-peapods-fee-no.md, item 1: vault price versus pool price is arbitrage)."
