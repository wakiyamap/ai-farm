max_loss_per_tx_usd: 20
max_loss_guarantee: >
  The whole action runs in ONE transaction through the bot-deployed MorphoLiquidator
  (src at scratch/morpho-executor-base/contracts/src/MorphoLiquidator.sol). Its liquidate()
  ends with require(balAfter >= balBefore + minProfit) on the executor's loan-asset
  (USDC) balance and reverts otherwise (fork tx 0xfc4f991b mines the NO_PROFIT revert),
  so any shortfall — repaid debt exceeding sale proceeds, failed swap, flash pull-back —
  rolls the whole tx back: worst case is gas only. Entry is OWNER-ONLY (the gate deploys
  through the bot wallet; fork tx 0x4e329c49 mines ONLY_OWNER for a non-owner), the
  collateral tokens and swap targets are whitelisted as constructor immutables (fork tx
  0x9f52306d mines POOL_NOT_ALLOWED for a non-whitelisted pool), the seized collateral is
  never approved to the pool (the V3 callback pays by transfer, bounded by the amount
  seized this operation; residual collateral allowance measured 0 after the success tx),
  the callbacks are bound to the armed flash operation, and the only outstanding
  allowance is the loan token to MORPHO itself. Seize size is capped in bot.js seizeFor()
  so the repaid debt stays <= ~398 USDC of the 400 capital and never exceeds the
  debt-coverage (no SEIZE_OVERFLOW). ALL-FEE LOSS MODEL, enforcement split (review
  99cc9216 blocker 1 relabel): the chain ENFORCES part of the per-tx fee, the bot
  bounds the rest. (a) L2 execution fee — enforced by the SIGNED fields at
  MAX_GAS_PRICE_WEI 0.2 gwei x MAX_GAS_LIMIT 1.5M = 0.0003 ETH cap (executor path
  fork-measured 531173 success / 569255 revert). (b) Isthmus operator fee — enforced
  by the chain's own formula scalar/1e6 x gasUsed + constant at gasUsed <= gasLimit;
  the parameters are read IN-PATH from the L1 Block Info predeploy at every live
  preflight and move only at L2 epoch changes (not between preflight and inclusion).
  (c) L1 data fee — chain-computed over the bot's final canonical EIP-1559 type-2
  transaction bytes (encoder repair history: the 13:23Z revision repaired the long-STRING
  prefix to the canonical 0xb7+lenBytes and moved the fee fields, but emitted long LISTS
  as 0xdf+lenBytes — a canonical decoder reads the resulting 0xe1 as a SHORT list
  declaring 33 bytes with 713 following, not a valid transaction (review 54ffa8cc
  blocker 2); this revision uses the canonical 0xf7+lengthBytes list prefix, 0xf8..0xff,
  and the new pure harness scratch/morpho-harness-3c4a3b75.js decodes the EXACT returned
  bytes canonically: it validates the header-declared length against the bytes that
  follow, consumes the ENTIRE payload with no trailing junk, and verifies all 12 EIP-1559
  fields chainId, nonce, maxPriorityFee, maxFee, gasLimit, to, value, data, accessList,
  yParity, r, s — ALL PASS; the builder harness alone was insufficient because getL1Fee
  accepts arbitrary bytes and its acceptance was not serialization validation), against
  the including block's L1-origin base fee: NO transaction
  field caps it, and the EIP-1559 base fee drifts at most 12.5% per L1 block between
  our preflight read and inclusion — pending inclusion can cross L1 origins and L2
  epochs, and no expiry/validity horizon binds the preflight fee inputs to inclusion
  (review 54ffa8cc blocker 1). The bot therefore refuses to send unless its
  in-path measured preflight total obeys BOTH: (i) (a)+(b)+(c est) <= 0.002 ETH
  (LIVE_FEE_ALLOWANCE_WEI) and (ii) measured total x FEE_BOUND_MARGIN=3 <= 20 USD at
  the fresh Aave-oracle WETH price (worstCaseGasLossUsd x margin, fail-closed
  staleness 15 min; measured 2026-11-04: totalWei 3.00002e14 wei ≈ 0.7 USD at
  ETH/USD 2335 — margin worst case ≈ 2.1 USD << 20). LIVE-SEND GATE (review
  54ffa8cc blocker 1, the reviewer's accepted alternative): because NO transaction
  field caps (c) and no validity horizon binds the preflight fee inputs to
  inclusion, the 3x margin and the 18 USD balance policy are ESTIMATES/POLICY, not
  an enforced inclusion-time all-fee cap — so LIVE_FEE_CAP_ENFORCED=false in
  bot.js keeps the live path sending NOTHING (it logs live_skip 'live sends
  disabled') until a genuine enforced cap for every applicable fee exists; flip
  the flag only together with that cap. The enforced legs remain (a) the signed
  cap, (b) the chain operator formula at gasUsed <= gasLimit, and the executor's
  final principal-delta guard. The wallet-balance check
  (freshly-read balance <= capWei at 18 USD = LIVE_BALANCE_CAP_USD, else live_skip)
  is the gate's REQUESTED funding policy (asked, not proven: no exposed gate
  setting enforces an inclusion-time balance) plus a fee-VALIDITY condition — an EOA
  can receive ETH between the bot's read and inclusion; an inflow never raises the
  fee the chain charges, which stays (a)+(b)+(c). Live also requires owner() == our
  wallet and deployed code at the executor (eth_getCode, fail closed). Rejections by
  the signer are final (no retry loop).
