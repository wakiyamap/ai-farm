legal_note: >
  Morpho liquidation is a public protocol incentive: anyone may repay a borrower's debt
  and seize the corresponding collateral at the oracle price. No frontrunning of pending
  txs, no price manipulation: we act only when the on-chain oracle itself marks the
  position ineligible, and sell the seized collateral on the pool's public AMM.
