expected_value: >
  Ledger: 94 Morpho Blue liquidations on base in ~36h (~62/day), 87% on the four watched
  markets — the old ALL-ROUTE sample; this bot's EXECUTABLE cbZEC route runs ~2.85/day
  (below) and only that flow is actionable. Liquidation repays the borrower's actual debt and seizes collateral worth
  repaid x incentiveFactor (1.1267605634e18 at lltv 0.625, verified to the wei against
  both Liquidate events of winner tx 0x2d56cc60): the liquidator's edge is the
  incentive factor minus sale slippage (fork success tx: +44.57 USDC on 350 USDC repaid,
  ~11.3% gross edge, sale through the measured pool). Dominant actor 0xdb61a255... wins
  86% by liquidating in the same block as the Chainlink feed update; our paper run
  measures the residual window (underwater_closed.visible_ms) and the 13/94 events won
  by 8 other addresses show some flow is not same-block. Live expectation: opportunistic
  liquidations the dominant bot misses (dust positions, markets it does not watch,
  slow bleeds via interest), capital-capped at ~398 USDC repaid per tx. MEASURED
  2026-11-04 (run 0182bdda, relay paper-lane historical eth_call of price() on the cbZEC
  oracle 0xa3cb2d72): the executable cbZEC route (market 0xe458a501, pool 0xe703)
  liquidated 19 times in the 6.7 ledger days (blocks 53159261..53447309) = 2.85/day, and
  EVERY probed one used a price FIRST SEEN in its own liquidation block:
  price(53265194)=1207.289 vs implied <=1198.94 (liq 53265195 tx 0x56ae0d93, repaid
  382.32 USDC — final-sized, gross edge 0.1267/1.1268 x 382.32 ≈ 48.4 USDC),
  price(53428518)=1161.888 vs used 1155.637 (liq 53428519 tx 0xc0d3a567),
  price(53429433)=1155.637 vs implied <=1140.89 (liq 53429434 tx 0x0facc248),
  price(53429509)=1140.8185 vs implied <=1126.24 (liq 53429510 tx 0xaec254a8). The
  same-block feed->liquidation race dominates this route: a natural >=20 s poll window
  was NOT observed in the current event flow, and the previous "post-winner 194 USDC
  underwater residual" claim is corrected: the residual debt is 194 RAW = 0.000194 USDC
  dust and healthy at the capture price (review 511fc3e7) — not a window. Raising
  LOG_BLOCKS to 60000 closes a steady ~33h window ONLY; the measured 261k-block
  pre-capture activity gap is closed by the COLD_START_BLOCKS=450000 deep backfill (now
  also run once for already-persisted candidate sets, review 2d13ac44 blocker 3).
  RACE CLASS (review 99cc9216 blocker 4, run 65653fce; EXTENDED run 31324734 attempts 87:
  price probes at ALL SIX most-recent executable cbZEC captures — 53265195/53428519/
  53429434/53429510 plus BOTH Liquidate events of winner block 53447309 (tx 0x2d56cc60) —
  every victim was HEALTHY at its parent block
  (hf 1.0015-1.0098 accrued to the parent timestamp) and captured inside the
  oracle-update block: 6/6 same-block races, no >=20 s window): on the evidence above (every
  probed executable-route capture used a price first-seen in its own liquidation
  block; no >=20 s window measured; residual is 0.000194 USDC dust), the executable
  route's capture class is a same-block oracle-update RACE, and polling this route at
  this cadence is RECORDED blocked_infra — a 20 s poller starts after the block that
  already contained the capture. Promotion stands waiting for either a naturally
  eligible, pre-discovered, final-sized, after-fee capture with a measured poll-
  compatible window (interest-bleed class: positions crossing the threshold between
  oracle updates — not yet observed on this route) or faster inclusion-adjacent
  infrastructure. The per-capture economics themselves are proven (fork success
  +49.9 USDC before ~0.7 USD fees); the unproven leg is catchability, not profitability.
