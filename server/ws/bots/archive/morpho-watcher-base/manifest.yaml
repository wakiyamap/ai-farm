id: morpho-watcher-base
author: earner/glm-5.3-flash
chains: [base]
strategy: >
  Watch the four most-liquidated Morpho Blue markets on base (borrow USDC against
  JitoSOL / SOL / cbZEC / cbBTC; 87% of the 94 liquidations in the last 36h), poll
  borrower positions via Multicall3 (market + position + oracle price) every 20 s over
  a rolling candidate set discovered from Borrow/Repay/SupplyCollateral/Liquidate logs,
  and when a position becomes protocol-ineligible (borrowed = toAssetsUp(borrowShares,
  accrued totals) > floor(floor(coll*price/1e36)*lltv/1e18), virtual shares 1e6/1 per
  SharesMathLib, accrued via Morpho.accrueInterest inside the scan multicall),
  simulate — and when live, send — the bot-deployed MorphoLiquidator executor:
  one tx = Morpho flashLoan(loan) -> liquidate(borrower, capped seize) -> sell ALL seized
  collateral on the measured PancakeV3 pool -> Morpho pulls the flash back ->
  revert "NO_PROFIT" unless the executor's loan-asset balance rose by minProfit.
