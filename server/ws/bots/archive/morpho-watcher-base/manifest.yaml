  [0xbbbbbbbbbb9cc5e90e3b3af64bdaf62c37eeffcb (MORPHO),
  0x97be14dd8f994a5364573bc035d85309e7cb34de (JitoSOL),
  0x311935cd80b76769bf2ecc9d8ab7635b2139cf82 (SOL),
  0xb2000000000000000000008501b13360000cb2ec (cbZEC),
  0xcbb7c0000ab88b473b1f5afd9ef808440eed33bf (cbBTC),
  0xe7030be388b8e247abe0c9fa876673e83fbcbd3c (cbZEC/USDC pool)] — baked in as
  IMMUTABLES so the whitelist travels with the runtime code and a code-only
  simulation sees the exact whitelist the deployed contract enforces; owner =
  msg.sender = the gate's deployer (the bot wallet)). One tx: flashLoan(loan) ->
  liquidate(params, borrower, capped seize, 0) -> sell ALL seized collateral via
  pool.swap -> Morpho pulls the flash -> require(balance >= before + minProfit).
  Live sends go to the executor the gate deploys, never directly to Morpho.
