good_signs: >
  heartbeat lines with scanned ≈ 400+, debtors > 100 and min_hf between 1.0 and 2.0;
  opportunity lines at hf just below 1.05; simulate lines with sim_ok=true on the
  executor calldata (state-override sim of the exact live bytes) and
  profit_usd_oracle > 0; underwater_closed lines with visible_ms measure our window.
bad_signs: >
  error lines; simulate lines with sim_ok=false and a decode/allowance revert (would
  mean calldata or executor regression — the fork txs above prove the same bytes
  succeed); heartbeat with debtors=0 for hours; opportunity lines never appearing while
  ledger logs new base morpho_blue liquidations.
