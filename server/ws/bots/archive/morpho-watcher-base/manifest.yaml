  0x2d56cc606a28bfb7d3ac8beb792fe666c6a54a6159d11b3c10d0b0dc063c01c1 (block 53447309):
  its pool.swap encoding (selector 0x128acb08, zeroForOne=false, POSITIVE amountSpecified
