id: trial-moonwell-optimism
author: builder/claude-mythos-5-2
chains: [optimism]
strategy: "trial: flash-funded Moonwell (OP Mainnet) liquidation of mUSDC debt through the OP/USD feed's ChainlinkOEVWrapper (updatePriceEarlyAndLiquidate, the 10 s early window after each Chainlink round), woken by the aggregator's AnswerUpdated on the feed; visibly under-water accounts are taken on the plain liquidateBorrow path by a 5 min scan"
copied_from: "Operator EOA 0xd9fffdf0c4b18fb7e225da15b2af9f88e55676c3 calling its wallet 0x5ac9bc14376bf2727c6211960cf3cec1e2f295bd: all 14 wrapper-path liquidations of the last 7 days (scratch/trial-moonwell-optimism/windows.json), e.g. tx 0x9f141689d5fac72d0011cf950662174da5d7cef5850a1e5ca5db0167f320e8cc (block 159444707: Morpho flash 25.896718 USDC, OP wrapper 0xcf6b619f updatePriceEarlyAndLiquidate, mOP redeem, 280.22 OP sold for 26.401 USDC, +0.505 USDC) and 0x6d54bc7398667b299c3bc5d47b1d13c7eac99f6af60b0f1e399f9bdc204ad4d0 (18.41 USDC repaid)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialMoonwellOevLiquidator.sol:84 reverts NoProfit unless the USDC balance grew by at least minProfit, and :85-95 pays the whole gain to the bot in the same tx; the wrapper call reverts by itself when the borrower is not liquidatable, and the Compound-style error codes of liquidateBorrow and redeem are checked, so a lost attempt costs gas only. bot.py:430-435 sets the fee ceiling so maxFeePerGas x gasLimit + 0.02 USD L1 allowance < 0.90 USD (never above 0.5 gwei; ETH valued at 1.15 x the Moonwell oracle price) and requires simulated gross > that signed gas cap; bot.py:440 sets the on-chain minProfit to the gas cap. Priority fee bid is at most 50% of the simulated gross (BID_SHARE, bot.py:91 and :431). No principal: the repay is a Morpho flash loan repaid in the tx; the bot wallet holds gas only (10 USD, under the 18 USD OP Mainnet cap)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7 d (attempts:1702 and the correction row after it, blocks 159356037-159658437): 238 LiquidateBorrow in 95 txs on the 13 Moonwell OP markets, 476 USD repaid, 395 USD of it mUSDC debt (383 USD against OP collateral). Wrapper path: 14 takes, all by one operator, 12 in the block after the Chainlink round, 1 after 2 blocks, 1 after 4; priority fee 0.0001-0.05 gwei; the liquidator keeps about 2% of the repay (0.505 USDC on 25.90, about 0.37 on 18.4-18.6), so the whole class paid about 1.5 USD in the week at 0.12 USD of gas for the largest. The bot aims at rounds the incumbent takes 2 or more blocks late (2 of 14) and bids up to half the gross to share the next-block ones; the trial measures how many blocks late the farm is. The direct path after the 10 s pays the full 7% but its only sizeable case (308.5 USDC, tx 0x6ade5d65...) went in the first open block for 3.8 gwei: the 5 min scan only picks up what is left standing."
executor: scratch/trial-moonwell-optimism/contracts/out/TrialMoonwellOevLiquidator.sol/TrialMoonwellOevLiquidator.json
executor_args: "{bot}"
executor_note: "Owner-only liquidate(morpho, job, repay, minProfit, unwrap). Debt market, borrower, collateral market, both underlyings, swap router, fee tier, wrapped-native token, OEV wrapper (zero = plain liquidateBorrow) and flash lender are all call arguments; constructor takes the bot address only; no setup transaction. The flash callback accepts only the lender set for the running call (cleared at the end). Approvals are exact and reset to zero (wrapper or mToken, router); Morpho pulls exactly the approved repayment. Native received on an mWETH redeem is wrapped before the swap. Profit leaves as USDC (the bot always passes unwrap=false with USDC debt). Live address from EXECUTOR_ADDR_OPTIMISM or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-moonwell-optimism/proof.py (lease, reset optimism 159444706 = the block where the Chainlink OP/USD round 0.09424862 landed, one block before the incumbent's wrapper take 0x9f141689...; every fork block timestamp pinned 1 s apart so all txs run inside the wrapper's 10 s window; output proof-result.json). Success 0xbb982bf87a6858afb63c2183bdcc4641c16db03e1ce418304957820d9549798a block 159444713 (timestamp 1794488196 = round updatedAt + 7 s), gas 1232161, owner +0.500683 USDC, native -1706732487937 wei (gas), borrower mUSDC debt 51.792751 -> 25.896720, executor USDC/OP/mOP/WETH/native and wrapper/mToken/Morpho/router allowances all 0. Correct reverts: NoProfit guard 0xa588cbc07917aa4d2341f956d51b2f589fa9dcff675f494c23e072e55839c157 (0xe39aafee); non-owner 0x800d0d2707f41128c80e937f2ed8427459bdb895033cd2a50dd4b3aff769486f (NotOwner 0x30cd7471); nothing to take through the wrapper 0x4ae046eefc39aff1701b3ede9f62d03df3c29c38523b068c98b4dae2c53991d6 (debt-free account, wrapper 'liquidation failed', gas 403831) and directly 0x75560ad9631e4c593732ff029a80b00ef9dab67e0c529b564e4da277a70731cf (LiquidateFailed(3)); same borrower on the direct path inside the window 0x010bec3116c49cc432483efd6ef5896e4c18c29792ca40f7ce05049fadd9f800 reverts LiquidateFailed(3) (delayed price still shows +0.145 USD liquidity); repeat after the take 0x74505eb142db5ee983ece252b893b9c44b01bc325d2fa7f6ddce5c916b2f676e reverts. The success lands at reset+7 blocks because deploy and the five reverts consume fork blocks. scratch/trial-moonwell-optimism/selftest.py (selftest-result.json): bot calldata, selectors and topics equal cast; the bot's own on_round() pinned to mainnet block 159444706 through the relay with the paper code override logs an opportunity (gross 0.500182 USDC, gas cap 0.279 USD) and pinned to 159444705 logs none."
awaited_events: "AnswerUpdated(int256,uint256,uint256) of the Chainlink OP/USD aggregator 0x07c15082440a5e435ba15fe9ab704daead84897a (read from the proxy 0x0d276fc1 aggregator() every 10 min) on the feed: 361 rounds in the last 24 h, about half of them lower; a lower round triggers one re-read of the mUSDC borrowers and a simulation of those within 1.5 x the price drop of the edge. Last wrapper liquidation on OP collateral: block 159546155 (2026-11-14); next one is not predictable (needs a falling OP price next to an account at the edge; 10 mUSDC borrowers above 5 USDC today). Full scan of all known mUSDC borrowers every 5 min, new borrowers from Borrow logs every 10 min."
good_signs: "round rows with action=down and tried>0; opportunity rows on path=wrapper with gross above the gas cap; in live a send_result won with a positive USDC delta; send_result lost rows with blocks_after_winner 0-1 (shows how late the farm is and what fee won)."
bad_signs: "No opportunity row in 7 days; every send lost; feed_error or read_budget rows (65k relay CU cap hit); aggregator rows (Chainlink moved the proxy to a new aggregator: the filter follows, check that rounds keep arriving); round rows with feed_lag_s above 3."
rpc_reads_per_min: "about 0.8: one Multicall eth_call per 5 min scan, four reads per 10 min discovery (eth_blockNumber, eth_getLogs, aggregator(), plus gas price and ETH price), one Multicall per lower price round (about 180 per day) and 2 more reads (simulate, estimate) per account close enough to the edge"
alchemy_cu_per_day: "about 61,000 CU/day = 0.03 USD/day at 0.53 USD per 1M CU: relay about 36,000 (scan 288 x 26 = 7,488; discovery 144 x 96 = 13,824; gas and ETH price 144 x 46 = 6,624; lower rounds 180 x 26 = 4,680; candidate simulations and attempts about 3,500) plus feed about 25,000 (361 AnswerUpdated logs/day x about 55 CU and about 5,000 for the idle subscription). The code stops relay reads at 65,000 CU per UTC day."
legal_note: "Public Moonwell liquidation incentive for repaying under-collateralised debt, open to any caller, through the protocol's own OEV wrapper, which is built to let any liquidator use a new oracle round early in exchange for 70% of the bonus. Reacts only to confirmed on-chain logs (a mined Chainlink round) and timed scans; no mempool watching, no reaction to pending transactions. Bidding a priority fee for a public reward is in scope of the trial decision."
expedite: false
