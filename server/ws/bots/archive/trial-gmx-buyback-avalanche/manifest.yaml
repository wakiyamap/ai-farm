id: trial-gmx-buyback-avalanche
author: builder/claude-mythos-5-2
chains: [avalanche]
strategy: "trial: take a GMX v2 FeeHandler fee-buyback batch on Avalanche (150 WAVAX in, USDC out at the oracle price plus 0.6 pct) with a flash loan when the pot pays, using signed price reports copied from confirmed keeper transactions"
copied_from: "Avalanche executors 0xd3693064437fa6bbe9f4c5b32a295b68c409885a (EOA 0x360de77e94249aaf8444176f81cf36983edb95cd, take 0x2c36270a86469ba9059527542a6ad9f4262aa957f26d5e1e060a83a315f2045b) and 0x72448e59fcc2441fa8bc795ed6e878d1de8e6f94 (EOA 0xa35854d1df04d5fad7d46e276d357bbebfa7cca5, takes 0x8ee409b1..., 0x5054aaee..., 0x3b50ef04...)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "GmxBuybackTake.sol take() is owner-only, repays the flash loan inside the callback and reverts NoProfit unless its wrapped-native balance grew by minProfit, then unwraps and pays the bot wallet native AVAX; a lost attempt costs gas only. bot.py attempt(): gas limit = eth_estimateGas x 1.25 (refused above 4,000,000), maxFeePerGas = base fee x 1.3 + 2 nAVAX tip (refused above 60 nAVAX), the send is refused when gasLimit x maxFeePerGas is worth more than 0.90 USD at the pool price (MAX_CAP_USD) and when the simulated gain is not above gasLimit x maxFeePerGas; minProfit = that cap + 1 wei. Priority fee bid: a fixed 2 nAVAX per gas (the takers of 11-11..18 paid 1 nAVAX), about 0.004 AVAX per send = 0.5 pct of a full-premium gross (0.83 AVAX) and never more than the gross because minProfit covers the whole gas cap."
expected_value: "Trial: send-measured win rate, no counted EV. Competition, 600,000 blocks to 100,739,657 (about 8 days): 4 buybacks, all 150 WAVAX for USDC, by two flash executors (0x72448e59 x3, 0xd3693064 x1), tx index 1-9, priority fee 1 nAVAX. The traced take paid +0.897 WAVAX (6.3 USD) for 2,133,988 gas x 8.57 nAVAX = 0.018 AVAX (0.13 USD). The taken amount had been in the pot for at least 37 s, 153 s, 2,692 s and 61 s before each take (scratch/gmxfee/avax2.py, windows-avalanche.json; the two cap-bound takes sat at the full 0.6 pct premium for 61 s and 153 s). The bot needs a keeper tx with WAVAX and USDC reports no older than 20 s: 192 such txs in 49,699 s (median gap 105 s, p90 658 s), so it aims at the takes whose window outlasts the next keeper tx. At most about 0.5 takes a day x 3-6 USD."
executor: scratch/trial-gmx-buyback-avalanche/contracts/out/GmxBuybackTake.sol/GmxBuybackTake.json
executor_args: "{bot}"
executor_note: "Constructor takes the owner only. take(Plan, minProfit): every target (flash vault, FeeHandler, wrapped native, batch, fee token, markets, oracle reports, swap pool) is a call argument. Balancer-V2-style flash of one batch, claimFees per market (try/catch), approve exactly the batch to the FeeHandler, buyback, approval reset to 0, sell the fee token on a Uniswap-V3-style pool (callback checks msg.sender against the pool set for this call and cleared after), repay, NoProfit unless the balance grew by minProfit, unwrap, pay the owner native. receiveFlashLoan checks msg.sender against the vault set for this call. No setup tx. Live code reads EXECUTOR_ADDR_AVALANCHE or EXECUTOR_ADDR only; paper mode uses an eth_call / eth_estimateGas code override taken from the fork deployment (executor-runtime.hex)."
fork_evidence: "scratch/trial-gmx-buyback-avalanche/proof.py (one avalanche fork lease; reset to 100,672,140, the parent of take 0x2c36270a...; deploy the artifact with --args; fund; the capture's markets and reports; block timestamps pinned to the capture's; result proof-result.json). Non-owner 0x3468094a257a64b5bab510999e998b8823ddb1b58b944d28d9ada977838a6d97 reverts NotOwner. Guard (minProfit 100 AVAX) 0xaa2ae20f30c10315099b09663f2170c13e3aa8ee37f35f749ee68727a8f1a5bd reverts NoProfit(897320294204638664), owner -0.02347 AVAX gas. Success 0xd026b0c3b7496f3b36d58b602464a9fab251d72aec6e8ad6dd7530ceadc895d2 block 100,672,144, 1,603,050 gas, owner +0.878083694 AVAX net of gas (gain 0.897320294 WAVAX, the capture's own number); executor native, WAVAX, USDC and the WAVAX allowance to the FeeHandler all 0 afterwards. The same call right after, 0xb8c54e380052fc544062aa4cf56d525a1e7caf458658b0b09511c848bdbbb262, reverts NoProfit(0): nothing left to take. Reports copied from a keeper tx are accepted: scratch/trial-gmx-buyback-avalanche/lifttest.py (eth_call at the keeper tx's block returns the executor's NoProfit(0) with provider 0x236913db..., and an oracle provider error with the keeper's own provider). Encoder and parsers: selftest.py (bot calldata equals cast calldata; eth_call at the parent block returns 897320294204638664)."
awaited_events: "The pot (available USDC plus the WNT share of claimable USDC fees on 8 markets) growing past the value of 150 WAVAX plus costs, or AVAX falling so that the same pot is worth more than a batch; then the next confirmed GMX keeper tx carrying WAVAX and USDC price reports. Last takes: blocks 100,168,006, 100,316,166, 100,449,225 and 100,672,141 (2026-11-18 about 14:36 UTC). The pot was 461 USDC of about 1,065 needed at 2026-11-19 06:04 UTC, so the next one is expected within about 1 to 3 days."
good_signs: "check rows with ratio rising toward 1; state armed followed by opportunity and paper_sim success (live: send_result won with the wallet's AVAX up)."
bad_signs: "armed for minutes with only no_reports or reports_stale rows (keeper txs too sparse); simulate_revert with an oracle error (provider or report format changed); a BuybackFees event by someone else while the bot was armed; read_budget rows."
rpc_reads_per_min: "0.4 while idle (one getOutputAmount eth_call and one slot0 eth_call every 300 s; every 60 s within 10 pct of paying). While the pot pays: every 6 s the same two calls plus eth_blockNumber and one eth_getLogs, and one eth_getTransactionByHash per new keeper tx."
alchemy_cu_per_day: "Idle 288 x 52 = 15,000 CU/day; near 1,440 x 52 = 75,000 CU/day at most if the pot sat within 10 pct all day (typically a few hours: under 20,000); armed about 165 CU per 6 s = 1,650 CU/min. Code cap 90,000 CU/day (0.048 USD at 0.53 USD per million CU). No feed."
legal_note: "FeeHandler.buyback and claimFees are public functions that GMX built so that anyone converts accrued fees at the oracle price plus a fixed premium. The price reports are Chainlink-signed data that GMX keepers have already published in confirmed transactions; the bot reads confirmed blocks only, never pending transactions, and the FeeHandler itself bounds their age to 30 s. No price is moved: the USDC is sold once on a public pool inside the same transaction."
expedite: false
