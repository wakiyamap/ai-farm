id: trial-mdb-nav-bsc
author: builder/claude-mythos-5-2
chains: [bsc]
strategy: "trial: MDB+ (0x9f8bb16f, a BSC token that anyone can mint and redeem at its BUSD backing per token) against its only pool, PancakeSwap V2 ESHARE / MDB+. When the pool is below the backing value, buy MDB+ through WBNB -> ESHARE -> MDB+ and sell() it to the token contract for BUSD; when it is above, mintWithBacking() with BUSD and sell the MDB+ into the pool. Funded by a free WBNB flash loan from Lista Moolah, the rest paid to the wallet in BNB, all in one transaction"
copied_from: "redeem direction, 9 takes in 7 days by 6 entry addresses, e.g. 0x94ea967a2b9f62c4413e08ab35388337fc97256cbeec30a477a1428ec2e2f381 (block 134819197, 0.009037 WBNB in, 3.8976 MDB+ redeemed for 4.929 BUSD, 0.000483 BNB kept) and 0x69655c38c264b65ef95a2c7d9d7358655d75b23cebd2aa9a40639353031d4412 (0x0799d396, Moolah flash, the shape this bot uses). Adapted, the mint direction is the same door the other way and nobody took it in the 7 days (it stood at 0.000106 BNB at placement)"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "StepArb.take() reverts NoProfit unless the WBNB left after the flash loan is repaid is at least minProfit (contracts/src/StepArb.sol _take(), the NoProfit line), and the bot signs with minProfit = gasLimit x gas price of that send (bot.py check(), cap, gain_of(direction, amount, cap, gas_limit)). The executor never receives funds from the bot wallet, so a lost send costs only gas, capped under 0.95 USD at a BNB price of 1500 USD (bot.py MAX_TX_USD, BNB_REF_USD, GAS_PRICE_MAX_WEI 0.6 gwei, GAS_LIMIT_MAX 1500000; a lost send at the 0.05 gwei floor costs about 0.00003 BNB = 0.02 USD). After a lost send it waits 5 min in that direction (LOST_QUIET_S). Trial, it bids at most 1/3 of gross as gas price, never above 0.6 gwei (TIP_SHARE_DEN, GAS_PRICE_MAX_WEI)."
expected_value: "Trial, no counted EV. Last 7 days at the entry (every Redeemed and Minted log of MDB+ in bsc blocks 133,817,402-135,217,402, scratch/r63f9/takes.py, takes.json), 9 atomic buy-and-redeem takes in two episodes (2026-11-20T18:47:49Z x3, 2026-11-21T03:57:17Z to 04:03:09Z x6) by 6 entry addresses, gross 0.000036-0.000587 BNB each (0.02-0.33 USD at 560 BUSD per BNB), 0.00313 BNB in total, gas 0.000021-0.000037 BNB a take, all at the 0.05 gwei floor. No mint-direction take. The bot's own probe at past blocks (relay eth_call with the code override, scratch/trial-mdb-nav-bsc/selftest.py), the redeem gain already stood at 0.000286 BNB 10,000 blocks (75 min) before the first take of 11-21 and at 0.000543 BNB 10,000 blocks before the first take of 11-20, so the takers wait for about 0.0006 BNB and the bot, which sends above 1.3 x its gas cap (about 0.00005 BNB), is hours earlier. On the fork at the parent of an incumbent take it was paid 0.000481 BNB (incumbent 0.000483). At placement the mint direction pays 0.000106 BNB gross (0.06 USD) for about 0.00003 BNB of gas and has grown from 0.00001 over 25 h. Aim, each refill of either gap, about 0.0001-0.0006 BNB a take, a few takes a week, well under 1 USD a week."
executor: scratch/trial-mdb-nav-bsc/contracts/out/StepArb.sol/StepArb.json
executor_args: "{bot}"
executor_note: "StepArb, the reviewed source of trial-dfm-pegkeeper-arbitrum plus one function, onMoolahFlashLoan(uint256,bytes), the name Lista Moolah calls (selector 0x13a1a562, read from the trace of take 0x69655c38). Both callbacks run the same private _onFlash, which checks msg.sender against the lender set for the take in progress (cleared at the end). Constructor (owner) only. Lender, flash token, size, every step (target, token spent, spender, calldata), the tokens to clear, minProfit and unwrap are call arguments. Each approval is for the exact amount spent and reset to 0 after the step. With unwrap = true the WBNB is withdrawn and paid to the owner as BNB. probe() and trial() are eth_call helpers (owner only / self only, every trial reverts). Runtime 5,165 bytes."
fork_evidence: "scratch/trial-mdb-nav-bsc/proof.py (one script, one lease per run; results proof-result.json and proof-result-mint.json). Redeem, reset bsc 134819196 = parent of the incumbent take in block 134819197, deploy, fund, getters, cast-equal calldata, probe, guards, success, repeat. Success 0x9b027c5d2938f3dcdaeef7538f4277389c94e82a0f33062ca763c0b9b3a66f26 (fork block 134819200 after the setup transactions, 474,288 gas, 0.008519 WBNB flash), owner native +433,711,169,880,210 wei after gas at 0.1 gwei, paid 0.000481140 BNB (the eth_call just before said the same). Correct reverts, guard 0x276ef5d60a2b8139d6af44ea6a3af50129a1037cbc4338d2ec2149cd5903bf7e (minProfit 1e24, NoProfit 0x31708d59, 570,847 gas), non-owner 0x6c1480214edf64a05398dd17ba3373977352380965854dd6b1488a7aa4e6456b (NotOwner 0x30cd7471), repeat of the same take with minProfit = the first gain 0x7375d2f1106b655eeccfa5cf61d70938645c788446765c121abf0878ee2d614e (reverts, the gap is smaller). Mint, python3 scratch/trial-mdb-nav-bsc/proof.py proof-result-mint.json 135218219, success 0x60c9c5c65b9e4665e8559083911129eeda082e06896ef1027bb60081ac76d8bc (fork block 135218223, 509,601 gas, 0.005011 WBNB flash), owner native +55,284,443,850,894 wei after gas, paid 0.000106245 BNB; guard 0x7ebd5114904ffbd1898a28249ecdce3f701b73501b92752e106bc2c8594bcd92 (NoProfit), non-owner 0x7c775a142c46affc9523254df90fd1aa357f925d840a5492a2baea519d220d9b, repeat 0xbb8fbb69304fbcc13463c311fb460be9750dc297c3e4059bc3c3a2415aebc805 (reverts). Executor leftovers 0 (ESHARE, MDB+, BUSD, WBNB, native), all five allowances 0. Paper path, selftest.py at 2026-11-23T05:53:57Z, relay eth_call with the code override, the same gain as the fork at block 134819196 (0.000481140 BNB) and 0.000106245 BNB (mint) at head 135218478."
awaited_events: "No event, a price drift. The pool prices MDB+ in ESHARE and ESHARE in WBNB, the backing is BUSD, so the gap moves with BNB / BUSD (no swap on either ESHARE pair in the 24 h before placement). Redeem direction last taken by others 2026-11-21T04:03:09Z; mint direction open at placement (0.000106 BNB gross at head 135218478) and takeable at once after promotion. After a take the next one needs BNB to move a few pct against BUSD, hours to days."
good_signs: "paper_sim success lines in logs/bot.jsonl (one per 10 min while a gain stands); live: send_result won shortly after start (the standing mint gain), later wins hours before the incumbents' redeem takes"
bad_signs: "live: send_result lost with winner_block just below our send block (someone else now takes at our line); probe 0 in both directions for 3 days; MDB+ fees switched on (sellFee / mintFee / transferFee below 100000 shrink every gain); the ESHARE / MDB+ pair drained (74.8 MDB+ at placement)"
rpc_reads_per_min: 1.1
alchemy_cu_per_day: 46000
legal_note: "Mint and redeem at the backing value are the token's own public functions (verified source, no allowlist, a fresh contract did both on the fork), used against a public pool with a flash loan in one transaction. No surplus above a pool's reserves is taken (not a skim), no mempool watching, no reaction to pending transactions; the trigger is a timer and the confirmed state. The transaction of 2026-11-17 (block 134095800) that created a FAKE token pair around MDB+ is not understood and not copied."
expedite: false
