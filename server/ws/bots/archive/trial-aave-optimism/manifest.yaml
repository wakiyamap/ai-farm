id: trial-aave-optimism
author: builder/claude-mythos-5-2
chains: [optimism]
strategy: "trial: flash-funded Aave v3 OP Mainnet liquidation (native-USDC or WETH debt; WETH, WBTC or USDC collateral), after a confirmed LiquidationCall on the feed or a 60 s near-HF scan"
copied_from: "Public Aave v3 OP Mainnet takers: 0x8e0ff45d2d5a5414620538b863c676463c4fba8b in tx 0xa9f4277c71807310f5aaf449acddf9ce5be95a9f39bb8758a92828ec75083801 (block 159471568, the fork-proof case), 0xf000042d2b48921c234f15d167e7874f594f303e in tx 0x974c2bc5a4d673813d0a2b6e15b7573ae8ae49ceedb6df81c590c8de309a4914, 0xa4523d140a9552e66df4b03accef62835a78e002 in tx 0xe05b522a35379f64725f62dc9f8e470cf29be040c595bbab133992deef8d36dc"
capital_usd: 15
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialAaveOptimismLiquidator.sol:70 reverts NoProfit unless the debt-token balance grew by at least minProfit, and :71-81 pays the whole gain to the bot (USDC, or ETH for WETH debt) in the same tx, so a lost attempt costs gas only. bot.py:337-342 sets the fee ceiling so maxFeePerGas x gasLimit + 0.02 USD L1 allowance < 0.90 USD (never above 0.5 gwei) and requires simulated gross > that signed gas cap, and :348 sets on-chain minProfit to the gas cap. Priority fee bid is at most 50% of the simulated gross (BID_SHARE, bot.py:339). No principal: the cover is a Morpho flash loan repaid in the tx; the bot wallet holds gas only (15 USD, under the 18 USD OP Mainnet cap)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7 d to 2026-11-17 (blocks 159359639-159662039, scratch/trial-aave-op/logs-op-rows.json): 59 LiquidationCall events, 10 liquidator contracts (0x5ac9bc14 15, 0xa4523d14 12, 0x8b3ada08 9, 0xa24b73b8 6, 0x8e0ff45d 6, 0x27ead500 4, 0xf000042d 3, three others 1-2). 23 events have native-USDC debt (covers 0.11-31,364 USDC, 17 of them above 100 USDC); 18 of the 23 flipped inside the capture block, 5 were under water at the parent block (2 s) and none 2 blocks before (scratch/trial-aave-optimism/parent-hf.json). Winner tips (tips.json): the large takes by 0x8e0ff45d and 0x5ac9bc14 paid 33-386 gwei (36-660 USD of gas), but 4 takes of 763-3,286 USDC went for 0.0001-0.001 gwei (0xf000042d twice, 0xb475e5da, 0x2c170622) and the dust takes for 0.002-0.006 gwei. The bot bids at most 0.33 gwei (0.90 USD cap), so it aims at the low-tip class and at users left under water after a cascade; the proof case would have paid 199 USDC for 0.002 USD of gas."
executor: scratch/trial-aave-optimism/contracts/out/TrialAaveOptimismLiquidator.sol/TrialAaveOptimismLiquidator.json
executor_args: "{bot}"
executor_note: "Owner-only liquidate(morpho, job, cover, minProfit, unwrap). Pool, borrower, collateral, debt token, swap router, fee tier and flash lender are all call arguments; constructor takes the bot address only; no setup transaction. The flash callback accepts only the lender set for the running call (cleared at the end). Approvals are exact and reset to zero (pool, router); Morpho pulls exactly the approved repayment. Profit leaves as USDC or native ETH. Same logic as trial-aave-base's executor, own copy. Live address from EXECUTOR_ADDR_OPTIMISM or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-aave-optimism/proof.py (lease, reset optimism 159471567 = parent of the historical capture 0xa9f4277c..., deploy artifact, fund owner, cover sweep by eth_call, guards, success, exhausted, release; output proof-result.json). Success 0x35e993025638c90888fbb157607c903186f0d4412c7669722a68db98090d3ebc block 159471571, gas 983115, owner +199.218889 USDC, native -991685081892 wei (gas), borrower HF 0.99952 -> 1.03493, debt 31,029.00 -> 25,435.07 USD, executor USDC/WBTC/native and pool/Morpho/router allowances all 0. Correct reverts: NoProfit guard 0x4765cf5cfb849199c843e2c1dc99bad2577c6c65366f2460a6ee53af4f80108a (0xe39aafee, owner USDC delta 0); non-owner 0x9ff9fc609299a297a6e754cc6635a4c96778c42a767ad5a262eecdcf1b739295 (NotOwner 0x30cd7471); nothing left to take 0x1b9cc0f80e66ac1e95acd5e91d4a2ca74bb30d29f33f9988aeeaf6bde78205cd (second call after success, 0x930bb771, owner USDC delta 0). The success lands at parent+4 because deploy and the two guards consume fork blocks. scratch/trial-aave-optimism/selftest.py: bot calldata equals cast calldata; the bot's own attempt() pinned to block 159471567 through the relay with the paper code override logs an opportunity (cover 4,654.35 USDC, fee 500, gain 201.544865 USDC, gas cap 0.90 USD, minProfit 0.90 USDC); pinned 30 blocks earlier (HF 1.0050) it logs nothing."
awaited_events: "Aave v3 Pool 0x794a61358d6845594f94dc1db02a252b5b4814ad LiquidationCall on the feed (59 in 7 days, about 8 per day, last in the census at block 159636217 on 2026-11-16); every such event triggers a scan of the 200 nearest-to-1 health factors. Safety scan of the near list about every 60 s, full universe hourly, new borrowers from Borrow/Withdraw logs every 10 min. Next occurrence is not predictable (ETH or BTC price moves)."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is)."
bad_signs: "No opportunity row in 7 days; every send lost by many blocks; simulate_revert on every cover of an underwater user (routes or dust rule); read_budget rows (75k CU cap hit)."
rpc_reads_per_min: "about 1.3: one Multicall eth_call per minute (near scan), 2 per hour (full scan of ~300 users in batches of 200), one eth_getLogs + eth_blockNumber per 10 min, plus up to ~30 calls per detected opportunity (cover sweep)"
alchemy_cu_per_day: "about 49,000 relay CU/day (near scan 1440 x 26 = 37,440; full scan 2 x 24 x 26 = 1,248; discovery 144 x 70 = 10,080) plus feed about 5,000 (8 events/day and idle long-polls) = about 54,000 CU/day = 0.03 USD/day at 0.53 USD per 1M CU. The code stops relay reads at 75,000 CU per UTC day."
legal_note: "Public Aave v3 liquidation bonus for repaying unhealthy debt, open to any caller. Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions. Bidding a priority fee for a public reward is in scope of the trial decision."
expedite: false
