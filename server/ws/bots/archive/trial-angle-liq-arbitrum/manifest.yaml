id: trial-angle-liq-arbitrum
author: builder/claude-mythos-5-2
chains: [arbitrum]
strategy: "trial: Angle Borrow (EURA-debt vaults) VaultManager.liquidate on Arbitrum, the EURA bought as stEUR on the Camelot stEUR/USDC pool and redeemed, the seized WBTC / WETH / USDC.e sold to USDC on Uniswap V3; one Morpho-flash-funded transaction"
copied_from: "EOA 0x753c056b26f64a2e18738e94088e7a4586f4b265 via contract 0x3c6917f818861e11fb2d84ad719d2bf5bc4ef147 (take 0xa7c899f63e264b7ca6e6b971e650d34f2c89093ddcb9eba32c5d5109bd920e4b, block 526,137,643, WBTC vault 92, 107.78 USDC Morpho flash, 4.56 USDC kept; the same route as the bot's); EOA 0xf49ca3d914324c17b0cd0f22e4e6831448b050e8 via contract 0x7cc97d1cab858d59ed6f2d2ca9d3ca5ae561b9f1 (take 0xb0bd703b19a8b6cadfea4dcb3f25ad5421b441a976fee0f2c8d84e5eb58c6ff3, block 526,052,183, WETH vault 941, 880 USDC Aave flash, 42.74 USDC kept)"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "StepArb.sol:108 reverts NoProfit unless the USDC balance grew by at least minProfit after the flash loan was repaid (and Morpho itself reverts when the loan cannot be repaid); take() is owner-only (StepArb.sol:57) and the flash callback accepts only the lender set for this call (StepArb.sol:124); the gain is paid to the bot wallet as USDC in the same transaction. So a lost attempt costs only gas. bot.py try_vault() and send_live(): cap = gasLimit x maxFeePerGas (gas limit = eth_estimateGas x 1.2, refused above 3,000,000; maxFeePerGas = base fee x 1.25, refused above 0.5 gwei), the send is skipped unless cap is under 0.95 USD at a conservative 4,000 USD per ETH and unless the simulated gross in USDC is above that cap in USD, and minProfit = the cap in USDC units, re-simulated at the signed gas limit before the send. Typical cap 0.0000345 ETH = 0.14 USD at the 4,000 USD reference (1,379,517 gas x 0.025 gwei, selftest at head). Priority fee: none (0); Arbitrum orders by arrival and the bot never bids."
expected_value: "Trial: win rate measured by sending, no counted EV. Competition, last 7 days (blocks 523,759,167-526,178,367, every log of the WBTC and WETH VaultManagers, scratch/r6b90/pool.py): 2 liquidations, both in the last 10 hours, by 2 unrelated operators, 42.74 and 4.56 USDC kept, gas 0.00005-0.00007 ETH a take, tx index 5 and 15, no priority fee. Windows (checkLiquidation at past blocks, scratch/r6b90/window.py, window-92.json, window-941.json, window-21.json): vault 92 was liquidatable for more than 95,300 s (26 h) before its take, vault 941 for at least 10,564 s (2.9 h); WBTC vault 21 (26.78 EURA to repay, discount 5.7 pct) has been liquidatable for more than 94,911 s and nobody has taken it: the bot's own check at head 526,180,392 (2026-11-21 07:53 UTC) simulates +1.774 USDC for it against a 0.14 USD gas cap. Not a speed contest: the bot scans every 300 s and aims at every liquidatable vault whose gain is above its gas cap; the two takes of the week were worth 47.3 USDC."
executor: scratch/trial-angle-liq-arbitrum/contracts/out/StepArb.sol/StepArb.json
executor_args: "{bot}"
executor_note: "Same source as the executor of trial-ryeth-arb-arbitrum and trial-xspace-arb-polygon (StepArb.sol, byte-identical copy). Constructor takes only the bot owner. take(lender, token, amount, steps, clear, minProfit, unwrap): the flash lender (Morpho Blue 0x6c247b1F..., 286,722 USDC at head, no fee), the flash token (USDC) and every step (target, token spent, spender, calldata) are call arguments; nothing is baked in and there is no setup tx. Steps here: Camelot (Algebra) router exactInputSingle USDC -> stEUR; stEUR redeem(whole balance) -> EURA; VaultManager liquidate([vault], [whole EURA balance], executor, executor), which the manager caps at the vault's maximum repay; SwapRouter02 exactInputSingle collateral -> USDC (WBTC and WETH 0.05 pct pools, USDC.e 0.01 pct); stEUR deposit of any EURA left; Camelot stEUR -> USDC of that remainder. A step spends the executor's whole balance of its token (and is skipped at 0), approves exactly that amount and resets the approval to 0. take() is owner-only and the executor holds nothing between transactions: the worst a bad route can do is revert. probe(bytes[]) is for eth_call only: owner-only, it tries each take() calldata through trial(), which always reverts (Trial(gain)). The Morpho callback checks msg.sender against the lender set for this call and cleared after it. After the profit check every token named in clear (EURA, stEUR, WBTC, WETH, USDC.e) is sent to the owner (dust; zero in the fork run). unwrap = false: the gain reaches the bot wallet as USDC. Live code reads EXECUTOR_ADDR_ARBITRUM or EXECUTOR_ADDR; paper mode uses an eth_call code override (executor-runtime.hex = eth_getCode of the fork deployment, owner 0xc0ffee...0321). Runtime 5,138 bytes, deployment about 1.2M gas, under the 3,000,000 limit."
fork_evidence: "scratch/trial-angle-liq-arbitrum/proof.py <parent block> <vm key> <vault id> (one Arbitrum fork lease per run: reset, deploy the artifact with --args, fund, checkLiquidation, probe, non-owner, guard, success, repeat, leftovers, allowances; calldata built by bot.py itself). Run 1, reset 526,137,642 = parent of the incumbent take of WBTC vault 92 in block 526,137,643 (proof-result-526137642.json): checkLiquidation = 97.78 EURA to repay for 199,890 sat, discount 0.9574; probe from the owner 0 / 4.889770 / 4.886867 / 4.883964 / 4.880093 / 4.874287 / 4.866547 USDC at 105.6 / 108.5 / 111.5 / 114.4 / 118.3 / 124.2 / 132.0 USDC of flash; from a stranger it reverts. Non-owner take revert NotOwner 0xbdbe45cd5b842e553212c71ee057eee1eb435cf7b385dab1b605c70f5b1d6f41. Guard revert NoProfit(4889767, 1e15) 0x9331675fc8a0fc2a9ba6e30c629856cd4844e1546a8b9e6cf3690f08f2fced8f, 1,211,353 gas, owner USDC delta 0. Success 0x6082c500c5660fbffebfbb11335c3ed89a8ec851f795df1347185ca15fa1794c fork block 526,137,646 (the reset block plus the deploy and the two reverts), 1,017,004 gas, owner +4.889767 USDC (the incumbent kept 4.563585 on the same vault). The same call again reverts StepFailed(2, ...) (0xa5ba4bfc030f3eab202a489910157934c21a9eb4bfd1b5b0a5b493992ddb0be2: the vault is healthy, the liquidate step fails) and checkLiquidation reverts HealthyVault; executor balances 0 in USDC, EURA, stEUR, WBTC, WETH, USDC.e; all seven executor allowances 0. The paper bot's own scan and check at head through the relay (scratch/trial-angle-liq-arbitrum/selftest.py, selftest.jsonl): 516 vaults with debt, one liquidatable above 1 EURA (WBTC vault 21), opportunity and paper_sim success, gross 1.774224 USDC against a cap of 0.137952 USDC, gas estimate 1,149,598."
awaited_events: "No event: a 300 s timer. The bot waits for a vault of the WBTC, WETH or USDC.e VaultManager to be priced by checkLiquidation (health factor under 1) with at least 1 EURA to repay. Last taken 2026-11-21 01:17 UTC (vault 92) and 2026-11-20 18:19 UTC (vault 941); WBTC vault 21 is liquidatable now and has been for more than 26 hours (still standing at 2026-11-21 08:37 UTC: the paper service logs opportunity + paper_sim success every 300 s, gross 1.80-1.85 USDC against a 0.138 USDC cap). More vaults open when BTC or ETH falls against the euro (174 WETH and 8 WBTC vaults carry debt)."
good_signs: "active row at start (about 516 vaults); check rows every 300 s; opportunity and paper_sim success rows with gross 0.2-50 USDC above a cap near 0.14 USDC (in paper the same standing vault is logged every poll, because nobody takes it there); live send_result won."
bad_signs: "simulate_revert rows at the estimate step on every look (the stEUR pool has no liquidity left or the manager is paused); every live send lost with a winner_block just before send_block; check rows with best_usdc 0 for a vault that stays liquidatable for days (EURA costs more than the discount pays); read_budget rows."
rpc_reads_per_min: "0.8: four Multicall3 eth_calls per 300 s scan; a liquidatable vault adds a probe and, when its gain is above 0.05 USDC, 3 reads (block, estimate, guard simulation); live only, 2 follow-up scans after such a look; every 6 h 14 calls to rebuild the list of vaults with debt."
alchemy_cu_per_day: "About 31,400 relay CU with nothing liquidatable (288 scans x 104 CU + 4 rebuilds x 364 CU); about 57,900 CU when one vault stands at every poll, as in paper now (288 x 196 CU): 0.017-0.031 USD/day at 0.53 USD per million CU. No feed filter. Code cap 95,000 CU/day."
legal_note: "A public liquidation: VaultManager.liquidate is the protocol's documented way to close unhealthy vaults and its discount is the payment it intends for whoever does it; two unrelated operators took the same vaults this week. stEUR is bought on a public pool and redeemed with its public ERC-4626 redeem. Liquidations off ethereum are in scope for a trial (decision 2026-11-17-cheap-chain-trials); this one is not even a speed contest. No pending-transaction watching; the bot reads confirmed state on a timer."
expedite: true
