id: trial-hefe-wrap-avalanche
author: builder/claude-mythos-5-2
chains: [avalanche]
strategy: "trial: two pools of one asset on Avalanche, the BIFKN314 pool token aHEFE and HEFE on the Trader Joe V1 HEFE / WAVAX pair, joined by the public 1:1 BIFKN314Wrapper; flash swap on the pair, buy or sell on the 314 pool, wrap or unwrap, repay the pair, all in one transaction, paid in AVAX"
copied_from: "operator EOA 0x8777ff73cd780895a1e3b199a738766bc4306ec1 through 0x60b4401b7f303e0ae1ff14b366bf685e8e08ce1a, takes 0xa5912ce2c8cdf35b68962d8e4cb62dc87120d94d2506a85fcf0a0aa3e00bea2f (block 101021599, unwrap direction, paid 0.030693 AVAX) and 0xe1e8fbbf59ff29b18d5378f9615253e94cd184c9d40045333747b53940dc8ea9 (block 100938276, wrap direction, paid 0.020300 AVAX); also EOA 0x1375b76a through 0x7e4111c5 (98 takes on 2026-11-20, e.g. 0x6d3108275377dafa78503abb788d9e2b14a528119c2e5a79bf932320ede0639e)"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "Executor take() reverts NoProfit unless the native left after repaying the flash swap is at least minProfit (contracts/src/WrapPairArb.sol _take(), the NoProfit line), and the bot sets minProfit = gasLimit x maxFeePerGas of that send (bot.py check(), cap, gain_of(unwrap_dir, amount, cap, gas_limit)); the executor never receives funds from the bot wallet, so a lost send costs only gas, capped under 0.95 USD at an AVAX price of 20 USD (bot.py MAX_TX_USD, AVAX_REF_USD, MAX_FEE_CAP_WEI 200 gwei, GAS_LIMIT_MAX 900000). Trial, it bids at most 1/10 of gross as priority fee, between 1 and 50 gwei (TIP_SHARE_DEN, TIP_MIN_WEI, TIP_MAX_WEI)."
expected_value: "Trial, no counted EV. Last 7 days at the entry (every log of the wrapper in avalanche blocks 100,454,105-101,054,105, scratch/rdf0b/hefe-hist.json, attempts:3655), 101 takes by 3 operators since the token launched on 2026-11-20 05:13Z (0x1375b76a 98, all on 11-20; 0x58d15e7f 1; 0x8777ff73 2 = the only takes since 11-20 19:51Z, 0.0203 and 0.0307 AVAX = 0.13 and 0.20 USD against 0.0038 and 0.0054 AVAX gas, tx index 1 and 0, gas price 10.4 and 12.6 gwei). About one take a day now, 0.1-0.2 USD each; the bot aims at every one above 1.3 x its gas cap (about 0.011 AVAX = 0.07 USD at today's fees). The trial measures whether a feed-driven look about 1 s after the pool trade wins against the one operator still active."
executor: scratch/trial-hefe-wrap-avalanche/contracts/out/WrapPairArb.sol/WrapPairArb.json
executor_args: "{bot}"
executor_note: "WrapPairArb, constructor (owner) only. The 314 token, wrapper, original token, pair, wrapped native, direction, size, pair fee, transfer tax and minProfit are call arguments. Callbacks joeCall / uniswapV2Call / pangolinCall check msg.sender against the pair set for this transaction (cleared at its end) and sender == the executor. The one approval per direction (to the wrapper) is the exact amount and reset to 0 in the same call. Profit is paid to the bot wallet as AVAX. probe() and sim() are eth_call helpers (owner only / self only). Runtime 6,030 bytes, deploy about 1.4M gas."
fork_evidence: "scratch/trial-hefe-wrap-avalanche/proof.py (one script, one lease; result proof-result.json, log proof-run.log). Part 1, reset avalanche 101021598 = parent of the incumbent take in block 101021599, deploy, fund, probe, guards, success, repeat. Success 0x8f76d31ca670e0524cfb96c89be20ba685977f176ea3b7faffdf4ace70823c72 (fork block 101021602, 348,226 gas, unwrap direction, 1.4463 WAVAX borrowed), owner native +19,698,618,152,370,074 wei after gas at 30 gwei, paid 0.030145 AVAX = the probe value (the incumbent was paid 0.030693). Correct reverts, guard 0x370c4937ca3d10c593366b6341220072e3fcdb9dd596910d686cfb67e26bc915 (minProfit 1e24, NoProfit 0x31708d59), non-owner 0xe3942e32c868426fc3233b2cdbc1676cf5ee23b329cca240c679534ea124fcdc (NotOwner 0x30cd7471), repeat with the same minProfit after the take 0xf995656aa214eb16c8628076319c5326d29dbf1426934fcb6530f904ef5a910c (reverts, probe after = 0 for every size). Part 2, reset 100938275 = parent of the incumbent wrap-direction take in block 100938276, success 0xf7c09c5879c633bc7f8b4ce731c2014a8ead9ea019394999df4e3303196ee79a (fork block 100938277, 298,868 gas, 14,757.9 HEFE borrowed), owner native +11,571,426,826,549,409 wei after gas, paid 0.020537 AVAX = the probe value (incumbent 0.020300), repeat 0x29288efe141115b833246f0a90c08f0b768ec5ebe25c80743ab772bf2aaf5f1c reverts. Executor leftovers 0 (WAVAX, HEFE, aHEFE, native), allowances 0, same runtime code in both parts. Paper path, selftest.py, relay eth_call with the code override shows 0.030145 / 0.020537 AVAX at the two parents and 0 at head."
awaited_events: "Feed /logs/avalanche, one filter, Sync(uint112,uint112) on pair 0xe11e871d312cc9bae9eb24c7bdc2031f8453bf44 (about 32 logs a day) or Swap(address,uint256,uint256,uint256,uint256,bool) on the 314 pool 0x4c726f6159a883e94b87984d827453f6f5955098 (about 1.5 a day), plus a 600 s safety poll: a trade that leaves the two prices more than about 2.6 pct apart (314 fee 1.3 pct, pair 0.3 pct, HEFE tax 1 pct). Last taken 2026-11-21 23:59:12Z in block 101021599; at 2026-11-22 08:50Z the gap was 2.4 pct (aHEFE cheaper), just inside the band, so the next purchase of HEFE on the pair opens it; expected about once a day."
good_signs: "opportunity and paper_sim lines in logs/bot.jsonl about once a day; live: send_result won"
bad_signs: "no opportunity line for 3 days (trading in the token stopped, or the wrapper was paused or emptied); live: send_result lost with winner_block equal to the block of the trade that opened the gap"
rpc_reads_per_min: 0.15
alchemy_cu_per_day: 6000
legal_note: "Swaps on two public pools and a public 1:1 wrapper, in one transaction; the same transaction three unrelated operators send. No mempool watching, no reaction to pending transactions; the trigger is a confirmed log."
expedite: false
