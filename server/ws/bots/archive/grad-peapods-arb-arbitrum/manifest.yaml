strategy: "Graduated from trial-peapods-arb-arbitrum (decision 2026-11-24-graduate-and-builder-focus.md): Peapods pod bond/debond round trips on Arbitrum (flash WETH, trade into a pod's underlying, bond or debond, cross the pod's pair, unwind to WETH) over the same eight routes and the same executor, with the look-to-sign path cut from 8 relay round trips in series to 1"
