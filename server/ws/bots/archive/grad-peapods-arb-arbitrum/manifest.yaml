max_loss_guarantee: "PodArbTake.sol:71-79 run() is owner-only and reverts NoProfit unless the executor's WETH balance grew by minProfit after the Balancer flash loan was repaid (minProfit 0 is refused), then unwraps the gain and pays the bot wallet native ETH; no principal leaves the bot wallet, so a lost attempt costs gas only. bot.py take(): gas limit = eth_estimateGas x 1.20 + 600,000 (refused above 3.2m), maxFeePerGas = latest base fee x 1.05 + 1 wei (refused above 0.1 gwei), cap = gasLimit x maxFeePerGas, signed only if the probed gain is above the cap, with minProfit = cap + 1. The cap in USD is taken at a 4,000 USD/ETH reference and refused at 0.90 USD; live caps of the trial were 2.8e13-5.1e13 wei (0.05-0.10 USD), lost sends cost 1.1e13-2.9e13 wei. Fee bid: none (priority 1 wei, 0 pct of gross): Arbitrum orders first come first served, so the decision's fee ceiling (50 pct of gross) is not used; the winners' priority fee was 0.021-0.023 gwei x under 1m gas = under 2.3e13 wei, 5-10 pct of a typical 2e14-5e14 wei gain, and bought no ordering. Differences from the trial's guard: the second, guarded eth_call before signing is dropped (the gas estimate already ran the call; a stale one reverts NoProfit and costs gas inside the cap), and the estimate is made at 0.004 WETH while the send may be 0.006 or 0.010 WETH (the 20 pct + 600k margin covers it; running out of gas would be a revert inside the cap)."
expected_value: "Evidence is the trial's live record (scratch/grad-peapods-arb-arbitrum/analyze.py over bots/live/trial-peapods-arb-arbitrum/logs/bot.jsonl, live-sends.json): 2026-11-19 19:25Z to 2026-11-23 07:40Z (84 h): 29 gains seen, 19 gone before the gas estimate, 10 sent, 5 won (gross 0.00154, 0.00054, 0.00020, 0.00006, 0.00045 ETH; net +0.002719 ETH), 5 lost (-0.000093 ETH gas): net +0.002626 ETH, about 0.00075 ETH a day (about 1.3 USD a day at 1,800 USD/ETH); gate status shows the wallet at 16.32 USD against 15 funded. All five wins fell in the first 21 h; the five sends of 11-21 and 11-22 lost. The lost sends landed 0, 0, 1, 1 and 3 blocks (0-0.75 s) after the winner (origins.json: an outside PEAS/WETH swap, the first incumbent take 1-2 blocks later, the take that beat us 3-4 blocks later in four of five, ours 3-5 blocks later). The grad's look takes 0.36 s at head for everything (selftest.py latest) where the trial ran 7 calls in series before its 0.56-1.06 s guarded call plus signing, so it should land 2-4 blocks earlier: enough for the 0-1 block losses and part of the 19 gone-before-estimate cases, not a promise against a take 1 block after the origin. Counted expectation: the trial's 0.00075 ETH a day as the floor, up to about 2x if half of the late cases flip; no claim beyond that. Size does not scale (fork sweep at block 525,710,104: parb_rev 0.000257 / 0.000412 / 0.000471 / 0.000330 ETH at 2 / 4 / 6 / 10 x 0.001 WETH and a revert from 15 up; apump 0.000277 / 0.000428 / 0.000462 / 0.000208, revert from 15 up), so capital stays at the trial's 15 USD of gas and no principal is asked."
executor: scratch/trial-peapods-arb-arbitrum/contracts/out/PodArbTake.sol/PodArbTake.json
executor_args: "{bot}"
executor_note: "The trial's artifact, unchanged (source sha256 835323403217bcbf32c7c97d5c846aba854cea45edfbcdb726e09d3972d04245, live for the trial at 0x9061db805d9bd27d66e4034b95bfe0b425355757; the gate deploys a new copy owned by this bot). Constructor takes only the bot owner. run(vault, weth, amount, steps, minProfit): the flash lender, the flash token, every pool, pair, pod and vault are call arguments (a step list: UniV3 swap, V2 swap, pod bond, pod debond, ERC4626 deposit / redeem). After the profit check run() sends whatever is left of every step token to the owner and reverts Leftover(token) otherwise, so a successful run leaves the executor with no token and no approval. probe() is for eth_call only (owner-only, every trial reverts). The Balancer callback and the Uniswap V3 swap callback check msg.sender against the lender / pool set for this call. Approvals are exact and reset to 0. No setup tx. Live code reads EXECUTOR_ADDR_ARBITRUM or EXECUTOR_ADDR only; paper mode uses an eth_call / eth_estimateGas code override (executor-runtime.hex = eth_getCode of this run's fork deployment 0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352, compared in selftest.py)."
fork_evidence: "python3 scratch/grad-peapods-arb-arbitrum/proof.py 525710104 proof-525710104.json (runs the trial's proof script on the same artifact with this directory as output: one Arbitrum fork lease, reset, fork deploy with --args, fund, non-owner, guard, success per paying route, leftovers and allowances after each, repeat, release). Run 2026-11-23 07:4xZ at the parent of the trial's first live win (block 525,710,105): non-owner run reverts NotOwner 0x21a089082b1e81da6cea0ae6e0885de8578b73a0395aee7566aba5fa121f7e68; guard (minProfit 1 ETH) reverts NoProfit 0x74d1d875fd4b88531cb54b519dcf28fa0f40854c75aef1ed7bfbe06be83618b1, 1,160,969 gas, owner -0.000116097 ETH at the fork's 0.1 gwei; success parb_rev 0xe11c9a5cea5bdcea03cd8c412497b8f0e513d6af779d8f953195f91d63d9c978 block 525,710,108, 965,652 gas, owner native +0.000374766 ETH net (gross 0.000471331); success apump 0x12e4bcce0dcc20b885b5a750af7f10cf7a22f2e6bcf7264826a286d1b257f9f9 block 525,710,110, 489,195 gas, owner native +0.000412707 ETH net (gross 0.000461627); executor leftovers {} and allowances {} after each; the same call repeated right after each success reverts (0xd39afa776f2aaf1b6161d1e24747d15f91b2b9d00d72935381a3cb4830f092b1, 0x3f8a727c1746bad690436862b16efe81f6f9edaeb71b5c3407fa7c5e20b505b4). The six-route proofs of the trial (its manifest) hold for the same bytecode. The grad's own code path: python3 scratch/grad-peapods-arb-arbitrum/selftest.py 525710104 replays bot.check() at that block through the relay (selftest-525710104.jsonl: apump 0.000866 ETH at 0.006, parb_rev 0.000471 at 0.006, ppeas_usdc_rev 0.000179 at 0.004, each paper_sim success above its gas cap)."
awaited_events: "Feed /logs/arbitrum, two filters: Swap (0xc42079f9...) on the Uniswap V3 PEAS/WETH pool 0x23d17764f41aea93fdbb5beffa83571f0bf3f8b2, and V2 Swap (0xd78ad95f...) on the eight pod pairs of the routes; plus a 120 s safety timer. Last gains seen by the trial: 4 on 2026-11-22 (last send 08:11Z); 1-4 a day since 11-19. Next: any time."
good_signs: "paper_sim success rows with timing.probe_s under 0.5; live send_result won; blocks_after_event of 2-3 where the trial had 4-6; wins after 2026-11-21, when the trial stopped winning."
bad_signs: "Every send lost with blocks_after_winner 0-1 again (then the gap is the feed and the sequencer, not the bot: close as blocked_infra); opportunity_skip estimate_revert on every gain; read_budget rows; feed_error rows on the pair filter; no opportunity row in three days."
rpc_reads_per_min: "0.5 on the timer (one probe() eth_call every 120 s); each swap event (at most one look per 0.3 s) costs 3 probe eth_calls, 1 eth_getBlockByNumber and 8 eth_estimateGas started together; a send adds receipt polls and 1 eth_getLogs."
alchemy_cu_per_day: "Timer 720 x 26 = 18,720 CU; event looks 258 CU each (3 x 26 + 20 + 8 x 20), at about 300-500 PEAS/WETH and pair swaps a day = 77,000-129,000 CU; code cap 250,000 relay CU per day (0.13 USD at 0.53 USD per million CU); the bot sleeps to 00:00 UTC at the cap. Two feed filters, metered by the feed."
legal_note: "bond() and debond() are the public mint and redeem entries of Peapods pods and the swaps are ordinary pool trades: arbitrage the protocol relies on to keep pod prices in line. The bot reads confirmed state only (feed logs of mined swaps), watches no pending transactions, bids no fee and moves no price for others to trade against. Not a skim type: nothing is taken from a pair's unbooked balance."
