id: trial-msynth-swap-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: Metronome Synth on Base swaps one synth for another at its oracle price (Pool.swap, anyone, 10 pct swap fee). msUSD and msETH both trade far under their pegs on Aerodrome; when the pool ratio msETH / msUSD drifts above the oracle rate plus the fee, flash-borrow USDC from Morpho, buy msUSD on an Aerodrome pool, swap it to msETH in the Pool, sell the msETH for WETH on an Aerodrome pool and the WETH for USDC on Uniswap V3, keep the USDC difference"
copied_from: "contract 0x117a6196964d096194b4991bf7040a84c2fee552 (EOA 0x61c658e4398fd39ec94ffc28f6be5e5ada491e84), 27 takes in 7 days, e.g. tx 0xfebbbdc33fc5b6025850969872249156ad8b18508bf183716118f8e37ae82a01 (block 59998291: flash swap 0.5 WETH worth of USDC, USDC -> 1,052 msUSD on 0xcefc8b79, Pool.swap -> 0.5714 msETH, msETH -> WETH on 0xde4fb30c, +0.00102 WETH) and tx 0xea534230fee233099bce2348a1dabbbb5966d75a68ff704c6466e13a27e67913 (block 60257632, +0.0000867 WETH); contract 0x281f65f56f57c0b94011d3ff6610ded4651a8714, 11 takes, e.g. tx 0x47e614ff4d873ec69ef5a59eb19848d00a4f7812af941fd27022bd516a062177. Same route shape; this bot borrows from Morpho and also tries the Slipstream pools."
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "Gas only. SynthLoop.run reverts NoProfit unless its USDC balance grew by at least minProfit (and Morpho's own repayment pull fails first when the round trip lost), and the bot sets minProfit = the send's gas cap in USDC at a 2,500 USD/ETH reference (bot.py check(): cap = gas_limit * max_fee + L1_FEE_ALLOW_WEI, cap_usdc passed as min_profit to run_calldata), so an included send either pays more than its own gas cap or reverts and costs gas. A send happens only when the simulated gross > 1.3 x that cap (SEND_MULT). Caps in bot.py: MAX_FEE_CAP_WEI 0.15 gwei, GAS_LIMIT_MAX 2,400,000, so at most 0.00036 ETH + L1 fee = 0.90 USD a send at the 2,500 USD reference (0.62 USD at 1,714), and MAX_TX_USD 0.95. Typical attempt: about 860,000-1,060,000 gas at 0.006-0.03 gwei = 0.01-0.05 USD including the L1 data fee. Priority fee bid: at most 1/10 of the simulated gross, never above 0.1 gwei (TIP_SHARE_DEN, TIP_MAX_WEI). No principal: Morpho flash loan."
expected_value: "Trial: measures the win rate by sending. 7 days to block 61,039,601 (scratch/ra0c6/profits.py -> profits.json, every SyntheticTokenSwapped tx at the Pool): 42 txs by 4 contracts. 0x117a6196: 27 takes, 0.0000138-0.00102 WETH each (sum about 0.0062 WETH = 10.6 USD) for about 0.0001 ETH gas each (4.3M gas), so it nets about 6 USD; 0x281f65f5: 11 takes (profit leaves in another form, not sized), 1.0M gas, priority 0.02 gwei; 0x2a79a563: 1 take +0.00056 WETH; 0xb263c370: 3 dust txs. 38 of the 42 sit in one burst 2026-11-20 15:48:21-16:36:57Z (blocks 59,996,628-60,011,209). The incumbents leave most of the gap: this bot's own eth_call (scratch/trial-msynth-swap-base/selftest.py, relay, historical blocks) pays per 400 USDC take 0.91-1.20 USDC 10 s before the first incumbent take, 2.13-2.38 USDC 332 s into the burst and 0.58-2.41 USDC at its end 2,916 s later; an earlier gap of 0.26-0.31 USDC 300 s before the burst was taken by nobody. With a 60 s look and a 10 s re-look after a win the bot aims at one take per look while a burst lasts: a 49-minute burst is about 50 looks, a few USD to a few tens of USD a burst if the takes repeat; bursts came once in the 7 days."
executor: scratch/trial-msynth-swap-base/contracts/out/SynthLoop.sol/SynthLoop.json
executor_args: "{bot}"
executor_note: "SynthLoop(address bot), Solidity 0.8.24 via_ir, 3,838 runtime bytes, deploy 884,293 gas on the fork (limit 3,000,000). run(P) is owner-only; P is one static struct: morpho, synth pool, base token (USDC), synthIn (msUSD), synthOut (msETH), mid token (WETH), the three pools, a flag per pool (Solidly-style getAmountOut + swap, or Uniswap-V3-style swap with callback), amount, minProfit. It flash-borrows the base token from Morpho; inside the callback: base -> synthIn on pool1, synthPool.swap(synthIn, synthOut, all of it) (the Pool burns and mints, no approval), synthOut -> mid on pool3, mid -> base on pool4, approve Morpho for the loan; after the loan: approval to 0, NoProfit unless the base balance grew by minProfit, all base token to the owner. Nothing is stored or baked in, no setup tx; the two callbacks (onMorphoFlashLoan, uniswapV3SwapCallback) answer only the counterparty set for the running step and cleared after it. Constructor arg = the bot wallet only."
fork_evidence: "scratch/trial-msynth-swap-base/proof.py 59998290 (one lease, about 60 s; result proof-result.json). Base fork reset to 59998290 = parent of the incumbent take 0xfebbbdc3... (block 59998291); block time kept at +1 s a block (anvil_setBlockTimestampInterval, removed at the end). Pool token controls pass. Deploy 884,293 gas. eth_call gains at 400 USDC: v2v2 2.126487, clcl 0.991755, v2cl 2.379070, clv2 0.741161 USDC; the bot's own choice (best_take): v2cl, 800 USDC, gain 2.833638. Non-owner 0x49dce438... reverts NotOwner; guard 0x114e592e... (minProfit 2,833,639) reverts NoProfit(2833638, 2833639), owner USDC delta 0; success 0x90fc67c0... fork block 59998294, 855,116 gas, minProfit 2,833,638: owner USDC +4.531623 (one block and one second later the Pool's quote is higher: eth_call on the pending block gave 4,531,623 just before the send, on latest 2,833,638; the protocol's price read depends on block time, the guard holds either way). Leftovers 0 USDC / msUSD / msETH / WETH, allowance to Morpho 0. Nothing to take: fork reset to head 61,041,725, fresh deploy, the same run() 0x61d16d14... reverts (transferFrom reverted: the round trip loses, Morpho cannot pull the loan), owner delta 0. selftest.py: the bot's paper path (code override = eth_getCode of this deployment) returns the same 2,126,487 / 2,379,070 at block 59998290 through the relay, and check() at head costs 2 eth_calls."
awaited_events: "The Aerodrome msETH / msUSD price ratio rising more than about 11 pct above the Pool's oracle rate (ETH moves, or selling of msUSD / buying of msETH on the pools). Last: burst of 38 takes 2026-11-20 15:48:21-16:36:57Z (block timestamps), then single takes 2026-11-20 18:48:43Z and 2026-11-21 06:18:22Z (block 60257632). At 2026-11-23 01:52Z (date -u) there is no gap (the round trip loses about 2 pct). Next: unknown; once in the last 7 days."
good_signs: "paper_sim success lines; live send_result won with gross_usdc well above cap_usdc; several wins in a row during one burst"
bad_signs: "send_result lost several times in a row (an incumbent takes within one look); only heartbeat lines for more than 7 days (no burst); loop_error lines (the Pool paused swaps: isSwapActive false, or a pool was drained); the Pool's swap fee raised above 10 pct (bursts need a wider gap)"
rpc_reads_per_min: 2.1
alchemy_cu_per_day: 76000
legal_note: "A public swap function of the protocol, open to anyone, paid at the protocol's own oracle price with its full 10 pct swap fee, plus public pools and a public flash loan: plain arbitrage that moves the pool price toward the protocol's price. No mempool watching, no reaction to pending transactions: confirmed state on a timer. No holding: everything is back in USDC inside the transaction. Not a liquidation."
expedite: false
