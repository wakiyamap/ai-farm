id: trial-mayan-redeem-arbitrum
author: builder/claude-mythos-5-2
chains: [arbitrum]
strategy: "trial: deliver Mayan CCTP bridge messages that come from Base or Ethereum on Arbitrum (MayanCircle.redeemWithFee) for the sender's redeem fee in USDC; the message is public on the source chain 15-20 minutes before Circle attests it, so the call is prepared in advance and sent when the attestation and the Wormhole VAA exist (one executor call)"
copied_from: "Mayan's relayer contract 0x2cad2c5f23c9a6137fd7642b45314b033aaafc14 (sender EOA 0x640edda4584cd45c7da77bfefd226335706e1f94): tx 0x1a208d033652d93ea5126535ecf17d1f13a48fa62e6367ce3eff6ca58df944ce (Base message seq 85598, 0.101166 USDC fee), 0x29d3e9b2e439f77d4e77ebd1a531887d090913c010f42ccb96b58c5f58e2c617 (Ethereum message, 0.424484 USDC); and the stranger 0xee1a58eafe1977a3d2ae59e2897bb815054f6d58 who delivered a message left for 2.5 days (0x83e07ba27f9f1ce2bc52e573fdab95abcb22d9c0f8f3857c9173c205b674c519, 0.070677 USDC)"
capital_usd: 3
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "A lost attempt costs gas only: MayanRedeemTake.sol:45-67 run() is owner-only and reverts NoProfit (line 66) unless the owner's USDC balance grew by minProfit (minProfit 0 refused, line 56); the bot sets minProfit to the message's whole redeemFee (bot.py:367). The gas of one send is bounded by the signed fields: gas limit = eth_estimateGas x 1.20 (refused above 1,500,000), maxFeePerGas = base fee x 1.30 + 0.001 gwei (refused above 0.5 gwei), and the send is refused when gasLimit x maxFeePerGas is 0.90 USD or more at a 4,000 USD/ETH reference (MAX_TX_USD bot.py:63, check bot.py:408-409) or when the fee in USD is not above gasLimit x maxFeePerGas at the pool price (bot.py:411-412, reason gross_not_above_gas_cap). Typical cap 0.02-0.03 USD; a lost race reverts 'Nonce already used' after about 272,000 gas (about 0.01 USD). Priority fee bid: fixed 0.001 gwei, under 1 pct of the gross (arbitrum orders first come first served; nobody bids)."
expected_value: "Trial: send-measured win rate. Competition, blocks 524,153,466 (2026-11-14 12:32Z) to 526,489,166 (2026-11-22 10:20Z) (README; scratch/trial-mayan-redeem-arbitrum/probe.json): 85 Base- or Ethereum-sourced redeems paid 6.93 USDC (Base 78 / 5.09, Ethereum 7 / 1.84; median fee 0.065, max 1.125), every one above its gas (median 0.018 USD); Mayan's relayer 0x2cad2c5f took 81, its driver 0x04d9634d 3, a stranger 1. They landed 999-1,854 s after a Base source block and 886-1,155 s after an Ethereum one, i.e. when Circle's attestation appears; the trial measures how many seconds the incumbent needs after the attestation is public (paper rows paper_outcome.seconds_winner_after_ready, live rows send_result). Aim: any share of the 0.88 USD/day, plus messages the relayer leaves behind (one in the window sat 2.5 days)."
executor: scratch/trial-mayan-redeem-arbitrum/contracts/out/MayanRedeemTake.sol/MayanRedeemTake.json
executor_args: "{bot}"
executor_note: "MayanRedeemTake.sol. Constructor takes only the bot owner. run(circle, feeManager, token, cctpMsg, cctpSigs, encodedVm, params, minProfit): the bridge contract, its fee manager and the fee token are call arguments; it calls redeemWithFee, withdraws the fee credited to the executor (getRelayerFee, withdrawFee), sends the executor's whole token balance to the owner and reverts NoProfit unless the owner's balance of the token grew by minProfit. No callbacks, no approvals, no setup tx, nothing held between calls. The fee arrives as USDC (0xaf88d065e77c8cc2239327c5edb3a432268e5831, the configured USDC on arbitrum) in the bot wallet; gas is paid in native ETH. Live code reads EXECUTOR_ADDR_ARBITRUM or EXECUTOR_ADDR only; paper mode uses a code override taken with eth_getCode from the arbitrum fork deployment (executor-runtime.hex)."
fork_evidence: "scratch/trial-mayan-redeem-arbitrum/proof.py (one arbitrum fork lease: reset, deploy the artifact with --args, fund, non-owner, guard, success, leftovers, repeat, release; result proof-result.json). Reset 525,423,855 = parent of the incumbent redeem 0x1a208d033652d93ea5126535ecf17d1f13a48fa62e6367ce3eff6ca58df944ce (block 525,423,856), the incumbent's own message, attestation and VAA passed through run(): non-owner revert NotOwner 0xd64384adeb9bced5939f0bc7a73359bdb687d7237953b7f6b236209f9eabc690; guard revert NoProfit(101166) with minProfit 101,167 0x345ffef526ff26b528818ce50faaee9b7b36843255a170c35c9e66ae04d5c1df, 475,116 gas, owner USDC delta 0, native -0.0000475116 ETH at the fork's 0.1 gwei; success 0x89b1acae4f8eade750697b329c490af06387250615e75d4d2553b54b82f2b68b, fork block 525,423,859, 426,937 gas, owner +0.101166 USDC, native -0.0000426937 ETH (at mainnet's 0.028 gwei the gas is 0.000012 ETH = 0.02 USD); executor USDC, native and fee-manager credit all 0 after it; the repeated call reverts 'Nonce already used' 0xd28de3d0ee87cdd6fb7d52e849884313253e4a7649baf7cfdb5588a25dd428a7 (271,837 gas). selftest.py (selftest.json): the bot's hand ABI encoding of run() equals cast calldata; its decode of the Base source transaction equals the incumbent's params; its fetches from Circle iris and Wormholescan return byte-identical attestation and VAA; its own simulated call at block 525,423,855 with the code override returns 101166; at latest the same message logs lost_before_send (already delivered). wintest.py: the winner lookup returns the right transaction for the latest redeem."
awaited_events: "LogMessagePublished(sender = MayanCircle 0x875d6d37ec55c8cf220b9e5080717549d8aa8eca) on the Wormhole core of Base (0xbebdb6c8ddc678ffa9f8748f85c815c556dd8ac6) and Ethereum (0x98f3c9e6e3face36baad05fe09d375ef1464288b), read by eth_getLogs every 300 s, whose CCTP message is bound for arbitrum (domain 3); then Circle's attestation and the guardian VAA, polled every 3 s from 780 s (Base) or 720 s (Ethereum) after the source block. Last EVM-sourced redeem on arbitrum: block 526,489,166, 2026-11-22 10:20:50Z (0x7a3c221f48c2615d5852c4582ba20e23fa0448b18f9127323a42ac09f20174e3). Next: about 11 a day in the window."
good_signs: "opportunity rows followed by ready and paper_sim success; paper_outcome with seconds_winner_after_ready of 3 or more (the incumbent leaves time); live send_result won with positive net_usd."
bad_signs: "http_check with iris_ok or wormholescan_ok false, or repeated http_error rows (the bot user cannot reach the two public attestation APIs: the bot can never be ready); every message ending in lost_before_send with seconds_winner_before_ready above 0 (the incumbent delivers before the public APIs show the attestation); source_skip no_bridgeWithFee_in_input on most messages; repeated simulate_revert, read_budget or loop_error rows."
rpc_reads_per_min: "0.4 on the timer (eth_blockNumber + eth_getLogs on base and on ethereum every 300 s); per message bound for arbitrum about 3 source reads and 6-8 arbitrum reads (eth_call, slot0, block, estimate, balance, winner lookup); per other MayanCircle message on the sources 1 receipt read."
alchemy_cu_per_day: "Timer 288 x 2 x (10 + 75) = 48,960 CU; source receipts for about 150 MayanCircle messages a day x 20 = 3,000 CU; about 12 arbitrum-bound messages x about 400 CU = 4,800 CU; about 57,000 relay CU per day (0.03 USD at 0.53 USD per million CU), code cap 95,000. The attestation polls go to Circle iris and Wormholescan (keyless public HTTPS, about 370 GETs each per message at 3 s for up to 18 minutes, about 9,000 a day), not to the relay."
legal_note: "redeemWithFee is MayanCircle's public delivery entry: the bridging user sets redeemFee as the payment for whoever delivers the message, and the executor delivers exactly that message to the user's own destination address. The bot reads confirmed logs on the source chains and two public attestation APIs (Circle iris, Wormholescan) at a few requests per second at most; it watches no pending transactions and reacts to no one's unconfirmed order. Messages with a gas drop or a custom payload are not taken."
expedite: false
