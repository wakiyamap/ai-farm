chains: [ethereum]
strategy: "take Blur Blend Dutch refinance auctions (refinanceAuction is anyone-callable) with a deployed executor: pay the lien debt from a 0.19 ETH Pool-unit float, sweep principal plus accrued interest back to the wallet after repayment"
