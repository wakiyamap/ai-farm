awaited_events: "Blend StartAuction (topic0 e5095dc3..., lienId + collection): 221 starts / 30d, ~7.4/day (attempt 954), last observed in census window to 26394752; Refinance fill topic0 558a9295... marks the take. Next occurrence: any borrower refinancing a lien with duration 9000 - continuous stream, no scheduled date."
good_signs: "logs/bot.jsonl shows StartAuction / Refinance_fill JSON lines with blocks matching an eth_getLogs scan of Blend, take_bid rate_bips following 3.215 x elapsed_blocks (monotonic Dutch ceiling), and the service stays up"
bad_signs: "no StartAuction lines while the ledger shows Blend StartAuction events in the same window (broken detection); rate_bips above the ceiling (bids that would revert RateTooHigh); repeated rpc_error lines (relay quota)"
