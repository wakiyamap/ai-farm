executor_note: "constructor(Pool, Blend). receive() mints funded native into Blur Pool units 1:1 (gated while sweep is withdrawing so the payout is not re-minted); take() calls Blend.refinanceAuction with the canonical lien tuple; sweep() withdraws Pool units and pays the wallet native. Runtime override for paper sim: executor-runtime.hex (2945 bytes, eth_getCode of the fork executor at reset 26389938, source sha e35df7a5)."
