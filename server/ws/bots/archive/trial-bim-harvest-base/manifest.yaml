id: trial-bim-harvest-base
author: builder/gpt-6-sol
chains: [base]
strategy: "trial: collect BIM Yield's public Aero strategy harvest caller fee during its measured daily window"
copied_from: "Base EOA 0x558079b5f12b9c8d6119bfa5e7b7a58ba05dc579, e.g. harvest tx 0xd27e51f51eeea587facbdba7ae558fd0561ff176bc62adf3b31ec78f34495247"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "BimHarvestTake.sol:27-36 is owner-only and reverts NoProfit unless the same transaction earned minProfit WETH, unwraps the gain, and pays the bot wallet native ETH. bot.py:166-213: gas limit = eth_estimateGas x 1.10 at send time (refused above 2.4m), maxFeePerGas = latest base fee x 1.03 + 100,000 wei tip (refused above 10m wei), cap = gasLimit x maxFeePerGas + 100e9 wei L1 allowance, minProfit = cap + 1, and the exact guarded call is simulated at that gas limit before the send. Hard ceiling 2.4m gas x 10m wei + allowance = 2.41e13 wei = 0.096 USD at a conservative 4000 USD/ETH; typical cap 9.4e12 wei (0.04 USD). Priority fee: a fixed 100,000 wei per gas passed explicitly to the signer (bot.py:133), about 1.8e11 wei per send = at most 2% of gross. Base wallet funding is 5 USD, below the 18 USD OP Stack native cap."
expected_value: "Trial: send-measured win rate, no counted EV requirement. Competition, prior 8 days: eight daily StratHarvest events on this strategy (blocks 56,094,147-59,118,154), all by EOA 0x558079b5, 86,400 seconds apart at 15:00:05 UTC, tx indexes 12-145, priority fee 0.001 gwei. Margin with the corrected limit (review 2026-11-18 problem 2), scratch/bimfix/est.py -> corrected-cap-harvests.json, relay reads at each harvest's parent block with the executor as a code override: estimate 1.49m-1.70m gas, limit 1.64m-1.88m, base fee 5.00e6-5.08e6 wei, cap 8.79e12-9.96e12 wei, gross 9.48e12-11.06e12 wei; gross > cap at 7 of 8 harvests (margin 0.65e12-1.76e12 wei), a skip at 1 (56,958,147: estimate 1,704,719, gross 0.13e12 below the cap). At 59,100,000, one hour before the 11-18 harvest, the fixed bot's check() already passes (gross 1.052e13 vs cap 0.967e13; scratch/bimfix/check-at-block.json), so the bot aims to send at the start of its 14:15 UTC window, ahead of the 15:00:05 incumbent. At 2026-11-19 14:15:01 UTC the supervised paper bot logged a current-head simulation success: gross 10.793e12 wei vs cap 8.851e12 wei, gas estimate 1,515,397, limit 1,666,936 (logs/bot.jsonl). Expected net per win about 3.7e12 wei, or 0.0067 USD at 1,811 USD/ETH; the 4,000 USD/ETH reference is only for a conservative loss cap. Earlier evidence: scratch/trial-bim-harvest-base/competition.json, harvest-7d.json."
executor: scratch/trial-bim-harvest-base/contracts/out/BimHarvestTake.sol/BimHarvestTake.json
executor_args: "{bot}"
executor_note: "Unchanged by the 2026-11-18 fix (bot.py, manifest and README only; fix by builder-claude run 70e6eb4f on a builder/gpt-6-sol bot). Constructor only takes bot owner. take(strategy,weth,minProfit) takes targets as call arguments, calls public harvest(address(this)), requires WETH balance growth, unwraps only the gain and pays it as native ETH to the bot in the same tx. No approvals, callbacks, principal or setup tx. Executor WETH was zero after the fork take. Live code reads EXECUTOR_ADDR_BASE or EXECUTOR_ADDR only; paper mode uses an eth_call / eth_estimateGas code override from the real fork deployment."
fork_evidence: "Fix proof scratch/bimfix/proof_fix.py (one Base fork lease; reset to parent block 59,118,153 of the 2026-11-18 harvest; deploy the artifact with --args; fund the owner; result in scratch/bimfix/proof-fix-result.json): eth_estimateGas 1,615,441 -> limit 1,776,985, base fee 5,003,968 -> maxFee 5,254,087 wei, cap 9,436,433,787,695 wei, gross 10,992,119,556,175 wei. Guard revert (minProfit = 2 x gross) 0x1f2205eeeb348ab3720536f4dd9c2d078956559b1c9116f0b0c84b482bf771d2 status 0, 1,559,770 gas, owner -7,937,035,381,081 wei (the cost of a lost attempt). Success with the bot's minProfit = cap + 1: 0xb767e579cb734bc313f55ca3604ea4ac9658e7f2aaf119a2ed9e9b2c4ecd0c90 block 59,118,156, 1,444,790 gas, owner +3,665,180,331,209 wei net of gas; executor WETH and ETH 0 afterwards. A third call with minProfit 1 right after succeeds on dust and loses gas (0x70a2adf9ef3cc0a95780bcd59f9cf2a6f96b2e2e13cd89338ac742eb8d00b274), which is why the bot never signs with minProfit below cap + 1. The fixed bot's own check() replayed at parent blocks through the relay: scratch/bimfix/check_at_block.py (paper_sim success at 59,118,153 and 59,100,000; skip at 56,958,146). Original proof (2,000,000 gas limit): scratch/trial-bim-harvest-base/proof.py, success 0x62f25080cdffe5c3dda7d6403187c9280e369f7be88579456ed43b663bab9e46. Reviewer evidence that a fixed 1.6m limit reverts InsufficientGasForCall: scratch/review-51c3/bim-gas.json."
awaited_events: "A 14:15-15:10 UTC timer window around the incumbent's eight consecutive daily 15:00:05 UTC harvests; 2-minute checks only in that window, one check on startup. Last observed harvest 2026-11-18 15:00:06 UTC (block 59,118,154, tx 0xa8567e8a...), next expected 2026-11-19 15:00:05 UTC. No feed filter needed: callReward accrues continuously and the historical caller followed a fixed daily schedule."
good_signs: "opportunity and paper_sim rows with gas_limit about 1.10 x gas_estimate and gross above cap_wei; live send_result won with native net_wei positive; sends before the 15:00 incumbent."
bad_signs: "No opportunity in seven days, repeated simulate_revert, all sends lost to the daily keeper, native price/base fee rise enough to remove the tiny margin, or read_budget rows."
rpc_reads_per_min: "0.05 average: one callReward eth_call and one eth_getBlockByNumber (base fee) every two minutes only from 14:15 to 15:10 UTC (28 checks/day); once the quote passes the pre-filter each check adds one eth_estimateGas and up to two eth_call simulations. One check on startup. No per-block polling."
alchemy_cu_per_day: "28 x (26 eth_call + 20 eth_getBlockByNumber) = 1,288 CU/day; worst case every window check also estimates and simulates twice (20 + 2 x 26 = 72 CU): 28 x 118 = 3,304 relay CU/day, 0.0018 USD/day at 0.53 USD per million CU. Code cap 20,000 CU/day. No feed CU."
legal_note: "BIM's verified StrategyAeroGaugeV2.harvest(address) expressly pays the caller-selected address a call fee. The trial invokes only that public reward, uses confirmed state/timer reads, and neither observes pending transactions nor manipulates price."
expedite: false
