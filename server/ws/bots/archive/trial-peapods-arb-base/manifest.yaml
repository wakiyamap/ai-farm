id: trial-peapods-arb-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: Peapods pod bond/debond round trips on Base (flash WETH, WETH to USDC to PEAS, buy the pod in its Aerodrome V2 pair, debond, sell the underlying for WETH, and the mirror route with bond) over four routes on the pPWIF and pMIGGLES pods"
copied_from: "Balancer flash recipients on Base driven by rotating vanity 0xc0ffee... EOAs, payout 0xc0ffeefeed8b9d271445cf5d1d24d74d2ca4235e: 0x2b38d0eea57f5a9908b5a1c5faa558c92ad221db (e.g. tx 0x8a698d44fa719b1ba22cded669f1ddda729a3cde92ce2397d5e72ef34540289c, +0.000259 WETH, sent by 0xc0ffee648f2b70238b827cdd9c3f2c91170ee3b1) and 0x91cb0fcb8e6b216a66a16e5037dee185b3491c51 (tx 0x492f300356aecf3a7720f07cd77fc9ef31dcc82faab9a81f63f57a8cf58e0610, +0.000412 WETH, sent by 0xc0ffee1d2edbe6dad64af3d05c0421cbecdcb83a)"
capital_usd: 0.75
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Enforceable bound per send (fix for review 57f67367): Base charges the L1 data fee and the operator fee at inclusion and no signed field bounds them, so the worst case of one send is the bot wallet's native balance, and that balance is kept under 1 USD. (1) Funding: capital_usd 0.75, all native, no top-up, so the wallet starts at 0.75 USD and only shrinks except for wins (about 0.07 USD each, paid as native). (2) Code: bot.py:342-357, live branch of take(): right before the signer call it reads ETH/USD (eth_usd(), bot.py:227, slot0 of the Uniswap V3 WETH/USDC 0.01 pct pool, refused outside 300-20,000) and the wallet's eth_getBalance, and wallet_bound() (bot.py:237) refuses the send while balance x price is 0.95 USD or more (WALLET_MAX_USD, bot.py:87); it logs opportunity_skip wallet_at_or_above_usd_bound and never signs. ETH would have to rise 26.7 pct above the funding price before the funded wallet reaches that line; then the bot stops sending, it does not exceed the bound. Checked with explicit balances in scratch/trial-peapods-arb-base/guardtest.py (0.75 USD passes; 0.9501, 10 and 18 USD refused). Inside that bound a lost attempt costs gas only: PodArbTake.sol:69-76 run() is owner-only and reverts NoProfit unless the executor's WETH balance grew by minProfit after the Balancer flash loan was repaid (minProfit 0 is refused), then unwraps the gain and pays the bot wallet native ETH; no principal leaves the wallet. Expected cost, not the bound: bot.py:300-359 take(): gas limit = eth_estimateGas x 1.20 + 600,000 (refused above 3.2m), tip = min(0.05 gwei, 20 pct of the simulated gross / gas limit), at least 0.0001 gwei (line 319), maxFeePerGas = latest base fee x 1.05 + tip (refused above 0.1 gwei), cap = gasLimit x maxFeePerGas + 1e11 wei L1 allowance (line 321), sent only if the simulated gain is above the cap (line 331) with minProfit = cap + 1 (line 323) and the exact guarded call simulated at the signed gas limit; refused when the cap is 0.90 USD or more at a 4,000 USD/ETH reference (line 327); typical cap 1.8e13-6e13 wei = 0.03-0.11 USD. Priority fee bid: at most 20 pct of gross (tip x gas limit), passed explicitly to the signer (line 263)."
expected_value: "Trial: send-measured win rate. Competition, 12 h to block 59,402,248 (scratch/flashcensus/base.json): 96 takes by seven flash recipients of one 0xc0ffee... operator family (0xff9de8ad 21, 0x2b38d0ee 19, 0x91cb0fcb 16, 0x6a2fb93c 16, 0x3dc8b11f 14, 0x21c5ee97 6, 0x7bf53a7a 4), gains 0.000007-0.00074 WETH against 0.000006-0.00009 ETH gas, priority fee 0.0012-0.106 gwei growing with the gain, tx index 2-37. Windows for 18 takes of 0x2b38d0ee and 0x91cb0fcb, the farm executor's probe() at 0.002 WETH as a code override at earlier blocks (scratch/trial-peapods-arb-base/series.py, series-windows-2.json, series-windows-2-fine.json): a gain was visible at the parent block for 17, 1 block before it for 17, 2 blocks for 12, 3 blocks for 9, 5 blocks (1 s) for 4, 15 blocks (3 s) for 2, 50 blocks (10 s) for 2, 150 blocks for 0. The big gaps are gone in 0.2-0.6 s and are out of reach; the bot aims at the small ones that stand 10 s or longer (2 of 18 sampled, each open between 10 and 30 s, about 0.00004 WETH = 0.07 USD gross against a signed cap of 1.8e13 wei = 0.03 USD); with a 30 s timer it sees about half of those, so roughly 5 pct of the takes, about 10 chances a day over the seven recipients. Paid entries in the last 7 days whose gross exceeds one attempt's gas: all 18 sampled takes but one."
executor: scratch/trial-peapods-arb-base/contracts/out/PodArbTake.sol/PodArbTake.json
executor_args: "{bot}"
executor_note: "Same source as the executor of trial-peapods-arb-arbitrum, compiled in this bot's own scratch directory. Constructor takes only the bot owner. run(vault, weth, amount, steps, minProfit): the flash lender, the flash token, every pool, pair and pod are call arguments (a step list: UniV3-style swap, V2-style swap, pod bond, pod debond, ERC4626 deposit / redeem), each step spends the executor's whole balance of its input token. probe(vault, weth, amount, routes) is for eth_call only: owner-only, it tries each route through trial(), which always reverts (Trial(gain) or the underlying error), so nothing changes and nothing is paid even if it were sent. The Balancer callback and the swap callback (uniswapV3SwapCallback, which the Uniswap V3 and the Aerodrome Slipstream pool both call) check msg.sender against the lender / pool set for this call and cleared after it. Approvals are for the exact amount and reset to 0. No setup tx. After the profit check run() clears the executor: _clear() sends any leftover of each step's token (a bond can leave 1 wei of the underlying) to the owner, so no token balance stays in the executor after a success, and this is enforced: run() reverts Leftover(token) when a balance cannot be read, when the dust transfer fails or returns false, when anything is still held after it, or when a bond / deposit allowance is not 0 (added 2026-11-19 for review b0031010, made strict for review 9566836b). A V2 step reads reserves after its transfer, because a pod's transfer hook may sell the pod's pending fees into the same pair; the Aerodrome V2 volatile pairs take the same swap call with their 30 bps fee (factory getFee read at head). Live code reads EXECUTOR_ADDR_BASE or EXECUTOR_ADDR only; paper mode uses an eth_call / eth_estimateGas code override taken with eth_getCode from the Base fork deployment (executor-runtime.hex)."
fork_evidence: "scratch/trial-peapods-arb-base/proof.py <parent block> <result file> (one Base fork lease per run: reset, deploy the artifact with --args, fund the owner, non-owner, guard, success per route, repeat). Run 1, reset 59,389,298 = parent of incumbent take 0x8a698d44 (proof-result-59389298.json): probe() from the owner answers gains for pwif and miggles, from a stranger it reverts. Non-owner run revert NotOwner 0x577352d89104bb149ecf8e2f61323259eb936a1a21e38787a4714eea58f7c17c. Guard revert NoProfit (minProfit 1 ETH) 0xee04e75b3ee9707a08ac2b7c72a7d56e4627b6080edd1eab42ec4253be84ff43, 1,041,164 gas, owner -0.000104119 ETH at the fork's 0.1 gwei. Success pwif at 0.003 WETH 0x2a3aa5e17f8b5211dd5bb413547171808814f04edb2ab0689223b8728a425d13 block 59,389,302, 846,052 gas, gross +0.000257658 ETH, owner +0.000173053 ETH net of gas. Success miggles at 0.001 WETH 0xdd027f75b9d26034a6b8f0bac5e0647fe056c0c1faa72dba1e8616283a5a476c block 59,389,304, 653,702 gas, gross +0.000040365 ETH, owner -0.000025005 ETH net at the fork's 0.1 gwei gas price (at the live 0.005 gwei base fee the gas is about 0.000004 ETH; the bot only sends when the gain is above its signed cap). The same call repeated right after each success reverts; no executor leftovers. Run 2, reset 59,285,647 (proof-result-59285647.json), the mirror routes: guard revert NoProfit 0xff13dae9bdefc9da56401ccd19d2103a90859fb7c0aa3aab477a638f6adf5e7c; success pwif_rev at 0.006 WETH 0x23f85665b7b8f5b6831755bdc87fc2b5a86eacde5c0ea087a9775e00c54c3436 block 59,285,651, 806,208 gas, owner +0.000721869 ETH net; success miggles_rev at 0.003 WETH 0xc257f7f840469cfe33ad7d845035813bad2a57caaa8e08e77c9276884d372130 block 59,285,653, 807,823 gas, owner +0.000086683 ETH net; repeats revert; executor leftovers 1 wei PWIF and 1 wei MIGGLES. The bot's own check() replayed through the relay (selftest.py, which also checks both hand ABI encodings against cast): paper_sim success at 59,389,298 and at 59,291,400 (34 blocks before the incumbent took a 0.00004 WETH gap), nothing_to_take at 59,380,000 (selftest-*.jsonl). Fix 2026-11-19 (run 489a0913, bot.py and manifest only, executor unchanged): selftest.py re-run on the fixed bot at 59,389,298 and 59,291,400, paper_sim success at both with the new eth_usd read (1,803.10 and 1,779.77 USD, cap 0.111 and 0.032 USD); guardtest.py -> guardtest-result.json for the wallet bound. Fix 2026-11-19 14:50Z (run cb0420ed, executor changed for review b0031010: run() now calls _clear() after the profit check, which sends whatever is left of each step's token to the owner, so the executor holds no token after a success; new source sha256 f5fd200a7b70176172cf14b9b723b0518efd59aead29efd7931fdb16c690fa74, new executor-runtime.hex taken with eth_getCode from the fork deployment). proof.py re-run with the new artifact, both resets; the fork transactions are byte-identical to the earlier ones (same sender, nonce and calldata), so the hashes repeat and only the gas used differs. Reset 59,285,647 (proof-fix-59285647.json): non-owner revert NotOwner 0x80f83081fe6ed628057907873400803312644f3a541de6f7b9eaea88c3629183; guard revert NoProfit 0xff13dae9bdefc9da56401ccd19d2103a90859fb7c0aa3aab477a638f6adf5e7c, 991,161 gas; success pwif_rev at 0.006 WETH 0x23f85665b7b8f5b6831755bdc87fc2b5a86eacde5c0ea087a9775e00c54c3436 block 59,285,651, 837,169 gas, gross +0.000802490 ETH, owner +0.000718773 ETH net; success miggles_rev at 0.003 WETH 0xc257f7f840469cfe33ad7d845035813bad2a57caaa8e08e77c9276884d372130 block 59,285,653, 837,939 gas, gross +0.000167465 ETH, owner +0.000083672 ETH net; repeats revert; executor leftovers {} (before the fix: 1 wei PWIF and 1 wei MIGGLES). Reset 59,389,298 (proof-fix-59389298.json): non-owner revert 0x577352d89104bb149ecf8e2f61323259eb936a1a21e38787a4714eea58f7c17c; guard revert NoProfit 0xee04e75b3ee9707a08ac2b7c72a7d56e4627b6080edd1eab42ec4253be84ff43, 1,040,978 gas; success pwif at 0.003 WETH 0x2a3aa5e17f8b5211dd5bb413547171808814f04edb2ab0689223b8728a425d13 block 59,389,302, 854,129 gas, gross +0.000257658 ETH, owner +0.000172245 ETH net; success miggles at 0.001 WETH 0xdd027f75b9d26034a6b8f0bac5e0647fe056c0c1faa72dba1e8616283a5a476c block 59,389,304, 661,728 gas, gross +0.000040365 ETH (owner -0.000025808 ETH net at the fork's 0.1 gwei); repeats revert; executor leftovers {}. selftest.py re-run on the new runtime at 14:52Z: encodings match cast, paper_sim success at 59,389,298 (pwif, gross 2.58e14 wei, cap 6.15e13) and at 59,291,400 (pwif, gross 4.09e13 wei, cap 1.77e13) (selftest-59389298.jsonl, selftest-59291400.jsonl). Fix 2026-11-19 16:45Z (run 00681878, executor changed for review 9566836b: cleanup is now strict. _clearToken reverts Leftover(token) when balanceOf cannot be read, when the dust transfer fails or returns false, or when a balance is still held after it, and _clear reverts when a bond / deposit allowance is not back to 0, so run() cannot succeed with a token left in the executor; new source sha256 835323403217bcbf32c7c97d5c846aba854cea45edfbcdb726e09d3972d04245; executor-runtime.hex re-taken with eth_getCode from the fork deployment). proof.py now reads native, WETH, USDC, PEAS, pPWIF, PWIF, pMIGGLES and MIGGLES balances of the executor and its allowances to every step target and the vault right after EACH success, with no skipped read (a failed read fails the proof), and asserts all are zero. Reset 59,285,647 (proof-fix2-59285647.json): non-owner revert NotOwner 0x80f83081fe6ed628057907873400803312644f3a541de6f7b9eaea88c3629183; guard revert NoProfit 0xff13dae9bdefc9da56401ccd19d2103a90859fb7c0aa3aab477a638f6adf5e7c, 991,161 gas, owner -0.000099120 ETH; success pwif_rev at 0.006 WETH 0x23f85665b7b8f5b6831755bdc87fc2b5a86eacde5c0ea087a9775e00c54c3436 block 59,285,651, 841,950 gas, gross +0.000802490 ETH, owner +0.000718295 ETH net at the fork's 0.1 gwei, executor balances (native and 7 tokens) and allowances (7 tokens x 9 spenders) read right after this success: all zero; the repeated call reverts (0x8f497dd45dd03e5d54646d55e55b02bdee3904c8a642bdf3ec77a0ea3f589f73); success miggles_rev at 0.003 WETH 0xc257f7f840469cfe33ad7d845035813bad2a57caaa8e08e77c9276884d372130 block 59,285,653, 842,631 gas, gross +0.000167465 ETH, owner +0.000083202 ETH net at the fork's 0.1 gwei, executor balances (native and 7 tokens) and allowances (7 tokens x 9 spenders) read right after this success: all zero; the repeated call reverts (0xdf7561c231d9412e115f01809e729aa335eabc107ab924316909267d801812d8). Reset 59,389,298 (proof-fix2-59389298.json): non-owner revert NotOwner 0x577352d89104bb149ecf8e2f61323259eb936a1a21e38787a4714eea58f7c17c; guard revert NoProfit 0xee04e75b3ee9707a08ac2b7c72a7d56e4627b6080edd1eab42ec4253be84ff43, 1,040,978 gas, owner -0.000104100 ETH; success pwif at 0.003 WETH 0x2a3aa5e17f8b5211dd5bb413547171808814f04edb2ab0689223b8728a425d13 block 59,389,302, 856,188 gas, gross +0.000257658 ETH, owner +0.000172039 ETH net at the fork's 0.1 gwei, executor balances (native and 7 tokens) and allowances (7 tokens x 9 spenders) read right after this success: all zero; the repeated call reverts (0x1952d890bac3f5ea52cae43b314018a2c0315389f67a6590091d1baedafb102a); success miggles at 0.001 WETH 0xdd027f75b9d26034a6b8f0bac5e0647fe056c0c1faa72dba1e8616283a5a476c block 59,389,304, 663,788 gas, gross +0.000040365 ETH, owner -0.000026014 ETH net at the fork's 0.1 gwei, executor balances (native and 7 tokens) and allowances (7 tokens x 9 spenders) read right after this success: all zero; the repeated call reverts (0xbf76a57b8a0a9ce86dcdd0ff49731eaf4705c4372d531e3e1300bc49acd0cb19). The fork transactions repeat the earlier hashes (same sender, nonce and calldata); the gas used differs. After the _rev successes the owner holds the swept 1 wei PWIF and 1 wei MIGGLES (cast call balanceOf on the fork), so the strict path ran. Revert paths of the cleanup, which no real route reaches: scratch/trial-peapods-arb-base/leftover-test/run.py (forge unit test with mock tokens against the current source; result.txt): dust swept and run paid (control), and Leftover(token) reverts for a transfer that returns false, a transfer that reverts, a transfer that returns true but moves nothing, and an unreadable balanceOf: 5 passed, 0 failed."
awaited_events: "A 30 s timer: one probe() eth_call over all four routes. No feed (Base already has its 8 feed log filters, HTTP 429 on 2026-11-19, and the PEAS/USDC pool Swap filter would cost about 100k feed CU per day); the feed code stays behind FEED_ENABLED = False. A gap that stands t seconds is seen with probability about t / 30. Last sampled incumbent takes: blocks 59,205,270 to 59,389,299 (2026-11-18/19); 96 takes in 12 h. Next: any time."
good_signs: "opportunity and paper_sim rows with gross_wei above gas_cap_wei; live send_result won with positive net_wei; wins on small gaps that stood for seconds."
bad_signs: "opportunity_skip wallet_at_or_above_usd_bound (the wallet is worth 0.95 USD or more: ETH rose 27 pct or someone sent it ETH; the bot will not send until that changes), wallet_below_gas_cap (the 0.75 USD is spent: the trial is over), eth_usd_unreadable; no opportunity row in three days, repeated simulate_revert or estimate_revert, every send lost with blocks_after_winner of 10 or more (the gap was gone before the farm's block), read_budget rows, loop_error rows from probe, or the pods' pairs losing their liquidity."
rpc_reads_per_min: "2 on the timer (one probe() eth_call every 30 s covers all four routes); a route that shows a gain adds 1 eth_getBlockByNumber, up to 4 eth_call, 1 eth_estimateGas, 1 guarded eth_call, 1 slot0 eth_call and (live) 1 eth_getBalance."
alchemy_cu_per_day: "Timer 2,880 x 26 = 74,880 CU; sweeps about 200 CU each; about 80,000 CU per day (0.04 USD at 0.53 USD per million CU), code cap 93,000 relay CU per day. No feed CU."
legal_note: "bond() and debond() are the public mint and redeem entries of Peapods pods and the swaps are ordinary pool trades: arbitrage the protocol relies on to keep pod prices in line. The bot reads confirmed state only, watches no pending transactions, and bids a priority fee only for its own public arbitrage; it moves no price for others to trade against."
