id: trial-benqi-avalanche
author: builder/claude-mythos-5-2
chains: [avalanche]
strategy: "trial: flash-funded Benqi Lending (Compound v2 fork) liquidation on Avalanche (native-USDC or USDt debt; AVAX, BTC.b, WETH.e or stable collateral), after a confirmed LiquidateBorrow on the feed or a 60 s near-shortfall scan"
copied_from: "Public Benqi takers (census scratch/trial-benqi-avalanche/liq-detail.json, blocks 99,975,805-100,615,805): liquidator contract 0x2c08916e42e48644091a3a37b68df3de2e2a74c6 (16 of 55 events, e.g. tx 0x54d1aa12843c6212ffaee8a0ccf1236db490a0be751e72e9e373823cab614da7), 0x777e0fc6d730cc42b853dc66e9fa1d8700000000 (10, e.g. tx 0x612b7d7efe8dbe15746ff3036b66c4e59521f7276ed5a3fd79fe99c8824b1158), 0x2d9a3ba2c1b6a7f29c1d533a14f714110d114b07 (3, e.g. tx 0xace915f9b6514f6ab98324d9c31e3c04997d6c3bfd3f2a798c9a437314d7cbce), and the fork-proof case tx 0x8f1a50fcf738fc02d2c1f1fd3752d8a56a42a2d97aaea88a453297d7b0e4410b (block 100331844, index 21)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialBenqiLiquidator.sol:86 reverts NoProfit unless the USDC balance grew by at least minProfit (and :79 unless the flash loan left a debt-token surplus), and :88 pays the whole gain to the bot as USDC in the same tx, so a lost attempt costs gas only. bot.py:369 sets the fee ceiling so maxFeePerGas x gasLimit < 0.90 USD at the Benqi oracle AVAX price (never above 2,000 gwei), :378 requires simulated gross > that signed gas cap, and :383 sets the on-chain minProfit to the gas cap. Priority fee bid is at most 50% of the simulated gross (BID_SHARE, bot.py:370). No principal: the repayment is an Aave flashLoanSimple repaid with its premium in the tx; the bot wallet holds AVAX for gas only (10 USD)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7.1 d to 2026-11-18 01:40Z (blocks 99,975,805-100,615,805, scratch/trial-benqi-avalanche/scan.py, analyze.py, parent.py, after.py): 55 LiquidateBorrow events by 12 liquidator contracts, 64,673 USD repaid. In scope (USDC or USDt debt; AVAX, BTC.b, WETH.e or stable collateral): 26 takes, 60,684 USD repaid, 21 with 20 USD or more repaid (median 336 USD; the taker keeps about 7 pct = liquidation incentive 1.10 minus the 3 pct protocol seize share, so median nominal gross about 23 USD), taken by 3 contracts (0x2c08916e 14, 0x777e0fc6 5, 0x2d9a3ba2 2). All 21 had shortfall 0 at the parent block: they are taken in the block they become takeable (tx index 1-69, median 8; tip 0.48-17.5 gwei, median 3.7; base fee 7.5-36 gwei), and no shortfall was left after any take of 100 USD or more. The bot aims at the tail: accounts still in shortfall when its scan sees them (the proof case sat in shortfall for one block; the 245 USD AUSD-debt take in block 100333136 also did). A send costs about 1.3-1.5M gas x (7.5 gwei + tip) = 0.08-0.15 USD at AVAX 7.18 USD."
executor: scratch/trial-benqi-avalanche/contracts/out/TrialBenqiLiquidator.sol/TrialBenqiLiquidator.json
executor_args: "{bot}"
executor_note: "Owner-only liquidate(flashPool, job, repay, minProfit). Flash lender, both qiToken markets, borrower, debt token, collateral token, native flag, swap router, both UniV3 paths and the payout token are all call arguments; constructor takes the bot address only; no setup transaction. Flow: flashLoanSimple(debt) -> qiDebt.liquidateBorrow (a non-zero Compound error code reverts MarketError(1, code)) -> qiColl.redeem of the seized qiTokens (MarketError(2, code)) -> wrap native AVAX when the collateral market is qiAVAX -> UniV3 exactInput collateral -> debt -> approve the lender for amount + premium; after the loan, a USDt surplus is swapped to USDC; then the USDC profit check and payout. The executeOperation callback accepts only the lender set for the running call (cleared at the end), with initiator = the executor and asset = the job debt token. Approvals are exact and reset to zero (qiDebt, router, lender). receive() takes the native AVAX that qiAVAX.redeem sends. The bot always passes payout = native USDC 0xB97EF9Ef, so profit leaves as USDC. Live address from EXECUTOR_ADDR_AVALANCHE or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-benqi-avalanche/proof.py (lease, reset avalanche 100331843 = parent of the historical capture 0x8f1a50fc... where a taker repaid 14.05 USDt, deploy artifact, fund owner, non-owner, guard, success, exhausted, release; output proof-result.json). Success 0x59f9fc64800a9f5e413ed32e7e720056e90b0cbb387abe9f30d21971ea94044f block 100331847, gas 1,266,140, owner +0.927555 USDC on 14.195968 USDt repaid (qiAVAX collateral, route WAVAX -> USDC -> USDt, then USDt -> USDC), native -20426787812309680 wei (gas at the fork's 16 gwei), borrower shortfall 0.0232 USD -> 0 and borrow 28.39 -> 14.20 USDt, executor USDC / USDt / WAVAX / qiAVAX / native and all three allowances 0. Correct reverts: NoProfit guard 0x3b0cefbb9b9572692ec3f92d4d90ef36c0bbd1aa7a3a014f289792fa65fc058a (0xe39aafee, owner USDC delta 0); non-owner 0x4e54cf94ba55871548be69ab1e362a65b85170db66399f1e2cf8d768bc1a7f07 (NotOwner 0x30cd7471); nothing left to take 0xd471fc85b8581931438243ad1298762a91c0433c6b3757122130051694201751 (same size after the success, MarketError(1, 3) = comptroller rejection, owner USDC delta 0). The success lands at parent+4 because deploy and the two guard sends consume fork blocks. scratch/trial-benqi-avalanche/selftest.py (selftest-result.json): bot calldata equals cast calldata (two shapes), and the bot's own best_route() with the paper code override returns 0.927555 USDC through the relay at block 100331843 and reverts MarketError(1, 3) at latest."
awaited_events: "LiquidateBorrow (topic0 0x298637f6...) of qiUSDCn 0xB715808a78F6041E46d61Cb123C9B4A27056AE9C and qiUSDTn 0xd8fcDa6ec4Bdc547C0827B8804e89aCd817d56EF on the feed (33 in the 7.1 d census, about 5 per day in bursts; last one at block 100516647 on 2026-11-16); each one triggers a scan of the 100 accounts nearest to shortfall. Safety scan of that list about every 60 s, full universe hourly, new borrowers from Borrow logs every 10 min. Next occurrence is not predictable (AVAX, BTC or ETH price moves)."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is)."
bad_signs: "No opportunity row in 7 days; every send lost by many blocks; simulate_revert on every account in shortfall (routes or sizes); read_budget rows (75k CU cap hit); feed_error on every wait (no avalanche feed)."
rpc_reads_per_min: "about 1.3: one Multicall eth_call per minute (near scan of 100 accounts), 4 per hour (full scan: debts in batches of 200, liquidity in batches of 100), one eth_getLogs + eth_blockNumber per 10 min, plus about 5-20 calls per detected opportunity (one position read, up to 4 size simulations per debt x collateral market, estimate, gas price, final simulation)"
alchemy_cu_per_day: "about 50,000 relay CU/day (near scan 1440 x 26 = 37,440; full scan 4 x 24 x 26 = 2,496; discovery 144 x 70 = 10,080) plus feed about 6,000 (two filters, about 5 events/day and idle long-polls) = about 56,000 CU/day = 0.03 USD/day at 0.53 USD per 1M CU. The code stops relay reads at 75,000 CU per UTC day."
legal_note: "Public Compound-v2-style liquidation incentive for repaying debt of an account in shortfall, open to any caller. Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions. Bidding a priority fee for a public reward is in scope of the trial decision."
