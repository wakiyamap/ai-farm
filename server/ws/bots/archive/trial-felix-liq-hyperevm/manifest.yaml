id: trial-felix-liq-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: Felix (Liquity V2 fork) trove liquidation keeper on HyperEVM, WHYPE and kHYPE branches; batchLiquidateTroves pays the caller 0.5 % of the liquidated collateral, no principal; timed Multicall poll of every trove's ICR"
copied_from: "The three takers of 2026-11-14, all calling the public batchLiquidateTroves: EOA 0xd9fffdf0c4b18fb7e225da15b2af9f88e55676c3 in tx 0xb804f1fde6acea1ea28e4e6fd39c5287418a31a87c16701cd1b18cf654f3658e (block 51274476, WHYPE branch, 2 troves, 12.238861 WHYPE to the caller); EOA 0x3e8a805dbbb0a981d83106965def36d5c2fa29a1 in tx 0x7ebec39eac5b73c71241dd6f2fe33a1ffe836d961e92a90533e966f274517fb3 (block 51274511, 0.2435 WHYPE); EOA 0xd81217f8e3426b045531e351215716b4e53dcf16 through contract 0x8b363fcb41f16be532d4d17d52cabbed5adc76d6 in tx 0x441676e4245b8573a1fd3657c75f00ee8e444caccbf9cfb65cdd7ff1062aebfc (block 51273226, kHYPE branch, 31.813292 kHYPE)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor FelixLiqTake.sol:89 reverts NoProfit unless the contract's native balance (after selling non-WHYPE collateral and unwrapping) grew by at least minProfit, and :92 pays the whole balance to the bot as native HYPE in the same tx, so a lost attempt costs gas only. No principal and no approval: the debt is absorbed by Felix's Stability Pool. bot.py:326 sets the fee ceiling so maxFeePerGas x gasLimit < 0.90 USD at Felix's own HYPE/USD price (never above 100 gwei; gas limit never above 1,900,000, bot.py:67), :332 requires the simulated reward to exceed that signed gas cap, and :337 sets the on-chain minProfit to the gas cap. Priority fee bid is at most 50 % of the simulated gross (BID_SHARE, bot.py:68 and :327), and always inside the 0.90 USD cap. At most 15 sends per UTC day (bot.py:71)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7 d to block 51,609,477 (scratch/trial-felix-liq/scan.py + windows.py): 3 Liquidation events, 4 troves, all on 2026-11-14, three different takers. Rewards to the caller: 31.81 kHYPE (2,059 USD), 12.24 WHYPE (757 USD), 0.2435 WHYPE (15 USD). Takeable before the take: 1 block, 2 blocks and 5-9 blocks (about 1 s blocks). Winners paid priority fees of 3,459, 4,319 and 230 gwei (2.39, 2.91 and 0.149 HYPE of gas) at a base fee of 2.9, 2.8 and 49 gwei. With the trial cap of 1 USD per tx this bot can pay about 12-17 gwei, so it cannot outbid them inside the same block: it wins only when it lands a block before the others (its poll is every 4 s while a trove is within 1.5 % of MCR; on 2026-11-14 that was the case minutes ahead) and when the base fee is under its ceiling (the 15 USD lot at a 49 gwei base fee would have been skipped). One win pays 15-2,000 USD against a 10 USD budget; the realistic share is small and is what the trial measures."
executor: scratch/trial-felix-liq/contracts/out/FelixLiqTake.sol/FelixLiqTake.json
executor_args: "{bot}"
executor_note: "Owner-only take(troveManager, troveIds, collateral, wnative, pool, minProfit). TroveManager, trove ids, collateral token, wrapped native and the swap pool are all call arguments; constructor takes the bot address only; no setup transaction, nothing stored between transactions. For a non-WHYPE collateral the reward is sold on the UniV3-style pool given as argument (direct pool swap; the callback is the fallback and accepts only the pool set for the running call, cleared afterwards, and pays by transfer, so no approval exists). receive() accepts the WHYPE unwrap. Deploy gas on the fork 610,581 (HyperEVM limit 2,000,000). Live address from EXECUTOR_ADDR_HYPEREVM or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-felix-liq/proof.py (one script: lease, reset hyperevm to head 51,609,8xx, deploy by creation tx, fund, guards, a fork-made stranger opens a WHYPE trove of 1,000 feUSD at 0.002 % above the lowest accepted collateral and the maximum interest rate, healthy guard, 1 h clock move puts its ICR under MCR, non-owner, NoProfit guard, success, repeat, release; output proof-result.json). Deploy 0x546ecf4fb7af33dfae7c3c25b76386587c2dde80748b3332831ee6f55d46ce06 gas 610,581, executor 0x7986a41cf80d6d20f7b96c11f600b7882ab29e2c. Success 0x0490fef78c504e59ef66263f6eea0abdfc604265e30ea4a95531aeca9ae77ebf fork block 51,609,847, gas 556,251, list = one healthy trove + the fork-made one: owner native +0.101673409 HYPE after gas (gross 0.102247970 HYPE = collateral / 200 exactly), executor native and WHYPE 0 afterwards. Correct reverts: nothing to take at head 0x989d5224f3efead2e49bca65d8c06a39cc43db145826ea804a4be029b6d5c299 (NothingToLiquidate 0x8c20998d); fresh trove still healthy 0x99f2cc264a9d544525cd13731fb5accdeb755c0d554ab852377cd556dcf48a52; non-owner 0x7a9e6f198238d892a1d384b72e85eb0d28c59312d5e4eb9bfc69c0497035ca2c (NotOwner); minProfit above the reward 0x2a3b2dc67d74989b1e92d8e5147124d57dbdc38b1cd2f0f0b10b2a92447ad644 (NoProfit, owner delta = gas only); same call after success 0xaf9880fd103bc8f4bae5bfc5b2d30b71bb653bd4106bb5d410ceeb1103266a27 (NothingToLiquidate). Past cases (the hyperevm fork cannot serve past state, pitfalls/hyperevm-fork-head-state.md): scratch/trial-felix-liq/hist.py = relay eth_call with the fork runtime as a code override at the blocks before the three real takes: gain 32.669041 HYPE at 51,273,225 (kHYPE reward sold through pool 0xbe352daf), 12.238861 HYPE at 51,274,475 and 51,274,474, 0.2435 HYPE at 51,274,510 / 509 / 506, NothingToLiquidate before each window (hist.json). scratch/trial-felix-liq/selftest.py runs this bot's own check at those blocks: it finds the same troves and logs opportunity rows with the same gains (selftest.out)."
awaited_events: "A trove on the Felix WHYPE or kHYPE branch falling under MCR 135 % (a HYPE price drop). Last: 2026-11-14, blocks 51,273,226-51,274,511 (4 troves in 3 takes). Not predictable; at head 51,609,900 the nearest trove is 21 % above MCR, so the next one needs a HYPE drop of about 18 %. The bot polls on a timer: 60 s, 12 s when the nearest trove is within 4 % of MCR, 4 s within 1.5 %."
good_signs: "check rows every ~20 polls with a falling min_margin on a red day; an opportunity row with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of 0-2 (shows how late the farm is)."
bad_signs: "loop_error rows (Multicall or price feed read failing); read_budget rows (90k CU cap hit by long fast-poll periods); opportunity_skip with reason base fee above cap on every lot; every send lost; no trove under MCR in 7 days (then the result is: class too rare)."
rpc_reads_per_min: "1 in the normal state (one Multicall eth_call per 60 s), 5 within 4 % of MCR, 15 within 1.5 %; 2 calls per 30 min for the trove list; about 5 calls per detected opportunity"
alchemy_cu_per_day: "about 40,000 relay CU/day in the normal state (1,440 polls x 26 CU + 96 list calls x 26) = 0.021 USD/day at 0.53 USD per 1M CU; a full day of 12 s polling would be 187k, so the code stops relay reads at 90,000 CU per UTC day (bot.py:72). No feed subscription."
legal_note: "Public Liquity-style liquidation: the protocol pays the 0.5 % collateral gas compensation to whoever calls batchLiquidateTroves on an under-collateralised trove (verified source, no role). Timed polls of confirmed state only; no mempool watching, no reaction to pending transactions. Bidding a priority fee for a public reward is in scope of the trial decision."
expedite: false
