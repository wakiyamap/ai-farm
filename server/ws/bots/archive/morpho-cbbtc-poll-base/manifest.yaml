executor_note: "same atomic pattern as the morpho-farmband2-base executor (flash-loan -> Morpho.liquidate -> UniV3 swap legs -> NO_PROFIT guard -> same-tx sweep); the ctor whitelists the cbBTC collateral and the fbb6 cbBTC/USDC pool (measured USDC reserve 2.1-2.2M USD at the cascade window), so no owner setup txs are needed; IMorpho.liquidate argument order (marketParams, borrower, seizedAssets, repaidShares, data) is taken from the incumbent batcher's own calls (selector 0xd8eabcb8 in the fork trace of tx 0x4812fa9f..., 19 calls in the cascade block)."
fork_evidence: "script: scratch/morpho-cbbtc-poll/proof.sh (lease->reset->deploy->scan->liquidate->guard->release, rerunnable). Status at placement: deploy + funding proven (e.g. deploy tx 0x0c3be7566952fe9557f7f755f9b48247e3d4789f1fe050916f741aab54fed7c7 at reset 56676372), the liquidate call reverts with Morpho's 'position is healthy' string for the tested borrowers at every tested reset (56676372..56677287): the pond's counted bleed captures all crossed the liquidation threshold by ~1.3e-5 (about 0.01 USD of debt) inside the 916-block window (retriage hf_B1 0.9999866, out-morpho-cbbtc.json), so the proof reset must land on the crossing block exactly; the next proof round must binary-search the crossing block per borrower (probe: node scratch/morpho-cbbtc-poll/probe.js <block> after fork reset)."
awaited_events: "cbBTC/USD Chainlink AnswerUpdated on aggregators 0xeb3ad4395924b76eb6b3d6ababa0b62875b1a1f / 0x137233996b6586a110bb7a753248e26cc0307b1b (last cascade: block 56677288, tx 0x4812fa9f...); interest-accrual eligibility crossings between updates (the 30 s safety scan is the primary trigger, the feed update is secondary - lead 21 next_steps caveat)."
good_signs: "logs/detections.jsonl shows LIQUIDATABLE records with debt>maxDebt at blocks between the price cascades, sim 'ok' with positive simWalletDeltaUSD on the fork executor, and feed-gap relay re-reads after 429/503."
bad_signs: "no-position / market-reverted records every cycle (wrong getter/selector), sim revert-fork on every candidate (swap-leg encoding or seizedAssets argument), or feed logs arriving >2 s late after the measured 1.27 s floor."
rpc_reads_per_min: "safety scan 2/min: 1 head + 1 market(bytes32) + 7 x position(bytes32,address) = 9 reads/scan (feed long-poll adds no reads); ~13k reads/day, ~0 CU each on the relay research lane, far below 1M CU/day."
alchemy_cu_per_day: "~0.05 USD at 1M CU = 0.53 USD; safety poll 2/min x 9 reads x 0.04 CU ~= 0.43 CU/day x 40k scans - dominated by relay quota, not Alchemy."
legal_note: "Morpho Blue liquidation penalty (seize margin 1/lltv - 1 = 0.1628 at lltv 0.860, deployed 0x0BEF55718AD60000) paid to anyone calling liquidate(); no oracle-dependence abuse (we repay at the Morpho oracle price and sell at the UniV3 pool spot)."
