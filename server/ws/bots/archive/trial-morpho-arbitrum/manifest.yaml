id: trial-morpho-arbitrum
author: builder/claude-mythos-5-2
chains: [arbitrum]
strategy: "trial: Morpho Blue WBTC/USDC (0xe6392ff1...) and WETH/USDC (0xca83d02b...) liquidations on Arbitrum; wake on the BTC/USD, WBTC/BTC and ETH/USD aggregators' AnswerUpdated events via the feed, liquidate with repaidShares and sell the seized collateral to USDC on a UniV3 pool inside Morpho's liquidate callback, one tx, USDC gain or revert."
copied_from: "takers of Morpho Liquidate (topic0 0xa4946ede...) on MorphoBlue 0x6c247b1F6182318877311737BaC0844bAa518F5e in these two markets, e.g. tx 0xed0116fc3be5f2a7fa887916df951aa0b1cc06daf12ebaa20a9c034e22aff932 (sender 0x04f57ab7..., block 524202074, 159.30 USDC repaid, WETH sold on UniV3 0xc6962004) and tx 0x1b2d063bc16032604771b4f44cbdf3a6ee9fb7993a78c2d02e9dd2b1c71496b8 (block 523779865, 9,975 USDC repaid, WBTC sold on UniV3 0x0e483131); attempts:1885. Bot and executor adapted from the live trial-morpho-eth-base."
capital_usd: 18
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialMorphoArbTake.take reverts NoProfit() unless its USDC balance grows by minProfit (scratch/trial-morpho-arb/contracts/src/TrialMorphoArbTake.sol:84), so a lost attempt costs gas only. Gas cap per send in bot.py:82-88 and 355-385: gasLimit = eth_estimateGas x 1.30 (never a constant; refused above 3,000,000), maxFeePerGas <= 0.95 USD / (on-chain ETH/USD x 1.15, or 4,000 USD before the first read) / gasLimit; the bot does not send unless gasLimit x maxFeePerGas is < 1 USD and the simulated gross is above it, and passes that cap as minProfit. Priority-fee bid: at most 40% of simulated gross (BID_SHARE, bot.py:88), never above the fee cap."
expected_value: "trial, win rate to be measured live. 7 d competition (attempts:1885, scratch/trial-morpho-arb/rows.json and windows.json; blocks 522728582-525148582): 18 Morpho liquidations on Arbitrum by 12 senders; 7 in these two markets (WBTC/USDC 5: 749 to 38,695 USDC repaid; WETH/USDC 2: 8.73 and 159.30), 6 senders, all 7 taken in the same block as the Chainlink update that made them takeable (tx index update+1 or +2), priority fee 0.027-0.038 gwei, gas 0.02-0.05 USD. So the sample shows no later take; the bot lands 4-12 blocks (1-3 s) after the update and aims at whatever the same-block takers leave (on Base 4 of 20 in the same class were later). Gross at stake = 4.38% of repaid minus the 0.05% pool fee: about 3,170 USD in the 7 d on 72,309 USDC repaid (fork: +7.10 USDC on 159.30, +458.16 on 9,975). A late attempt is normally not sent at all (the simulation already reverts)."
executor: scratch/trial-morpho-arb/contracts/out/TrialMorphoArbTake.sol/TrialMorphoArbTake.json
executor_args: "{bot}"
executor_note: "Same code as the reviewed TrialMorphoRouteTake of trial-morpho-eth-base with two constants changed: Morpho Blue on Arbitrum 0x6c247b1F6182318877311737BaC0844bAa518F5e (counterparty) and native USDC 0xaf88d065e77c8cC2239327C5EDb3A432268e5831 (profit unit). No principal and no flash loan: Morpho hands over the seized collateral before its onMorphoLiquidate callback and pulls the repayment after it, so the repayment is the sale proceeds. constructor(address bot) only; market params, borrower, size, the pool route (1-3 UniV3-style pools, collateral to USDC) and minProfit are call arguments. onMorphoLiquidate accepts only Morpho while a take() is running; the swap callback accepts only the pool set for that hop; both peers are cleared; the USDC approval to Morpho is the exact repaid amount and reset to 0; a route that does not end in USDC reverts BadRoute. Profit is paid to the bot wallet as USDC. Owner-only sweep(token) for recovery."
fork_evidence: "scratch/trial-morpho-arb/proof.py (lease; reset arbitrum 524202073, deploy, fund, healthy guard; fork replay of the oracle transmit tx, deploy, fund, 4 guards, success; second replay + success; release); result in scratch/trial-morpho-arb/proof-result.json. The captures sit in the same block as the oracle update, so the takeable state is made by `fork replay` of the transmit tx (0xda11c28ac1a20a73449c7fa8b27a9caba09108183efcd1b02c1317be60bd2fd8 for WETH, 0x836995015ec5afddf86cf82fb659849aa4cc2319aef3e3fdc22fcb3ff8b5d83f for WBTC). Success WETH 0xb9a2224e1f09ff30c114ba41b2fb963bd0dadf59908ec2e9e068be92a124aaa2 (fork block 524202080, gas 290,606): owner USDC +7.098974, borrower debt shares 149965249418041 -> 0. Success WBTC 0x9827c9c29cb6e6885d2cc0da90142448011093d231476e30afc49532fa0b78ad (fork block 523779867, gas 355,074): owner USDC +458.155645, shares 9442097254171833 -> 0. Executor left with 0 USDC / 0 collateral / 0 allowance in both. Reverts: nothing to take before the update 0x91960701470933d62a9687874c1348f1aa5a9ca8b4c3d91c87864ca503dc8194 ('position is healthy', gas 125,562), minProfit above gain 0xc3605dcfb1ab3e46a8aa5c3b74e47e168df2ed8a6f3784900b2f70df27aa22f8 (NoProfit 0xe39aafee, gas 335,447), route not ending in USDC 0x0ef857a7dd0be1db188293f7be5eea335fac5cd23b365babc059af65cd5c1b28 (BadRoute 0xc4c321d1), non-owner 0x30d686cf973f70bf14d7e0ad4611b75d374493fd2a9b4e3a99ae8ec556e7cee7 (NotOwner 0x30cd7471). Paper override = eth_getCode of that deployment (executor-runtime.hex). scratch/trial-morpho-arb/selftest.py runs the bot's own scan/attempt paper path: on the fork after the replayed update it logs 1 opportunity + paper_sim success (gain 7.098974 USDC, gas limit 472,889 from eth_estimateGas); at the relay head a full scan reads 267 + 95 debtors, top ratio 0.939 (WBTC), two WETH dust positions skipped as dust (output in selftest.out)."
awaited_events: "AnswerUpdated (0x0559884f...) on aggregators 0xa8c2ad8f... (BTC/USD, about 810/day), 0x97aae9da... (WBTC/BTC, about 2/day) and 0xd827123d... (ETH/USD, about 1,070/day). A liquidation needs a BTC or ETH drop that pushes a borrower over lltv 0.86. Last takes: WBTC market block 524318530 (2026-11-15), WETH market block 524202074 (2026-11-14); 7 in the last 7 days, all on falling-price days. At placement the nearest WBTC borrower is at debt/maxBorrow 0.939, so the next takes need about a 6% BTC drop or new borrowers nearer the line."
good_signs: "logs/bot.jsonl: feed rows on aggregator updates, scan rows (oracle_update on new lows, safety_poll every 10 min) with top_ratio moving with BTC and ETH; opportunity + paper_sim success rows when top_ratio crosses 1; live: send_result rows with result won."
bad_signs: "scan_error or loop_error on every cycle; read_budget rows (the 26,000 CU relay cap is reached: fewer new-low reads are needed); simulate_revert 'position is healthy' on every candidate with ratio > 1.001 (ratio formula drift); candidates that are already gone at every oracle_update scan and live send_result lost with blocks_after_winner >= 1 on every send (always late: the expected failure, close as blocked_infra); opportunity_skip estimate_gas_failed in live."
rpc_reads_per_min: "about 0.6: one Multicall eth_call per new-low aggregator update (about 560/day), two per 600 s timer read, three per full scan (every 6 h, or after a 1% oracle move, at most every 30 min)"
alchemy_cu_per_day: "about 94,000 (0.050 USD): feed about 71,500 (1,880 logs x 35 CU + 4 CU/min) + relay about 22,500 (new-low reads 560 x 26 = 14.6k, timer reads 144 x 2 x 26 = 7.5k, full scans 4-8 x 3 x 26 = 0.3-0.6k); relay reads hard-capped at 26,000 in code, so the total stays under 100,000"
legal_note: "Morpho Blue's liquidation incentive is a public payout to any caller of liquidate(); no mempool watching, the bot reacts to mined oracle-update logs only; it bids a priority fee for a public reward."
expedite: false
