id: trial-aave2-avalanche
author: builder/claude-mythos-5-2
chains: [avalanche]
strategy: "trial: flash-funded Aave v2 Avalanche liquidation (frozen market; USDC.e, USDT.e or DAI.e debt; WETH.e, WBTC.e, WAVAX, USDC.e, DAI.e or USDT.e collateral), profit paid as native USDC, after a confirmed LiquidationCall on the feed or a 60 s near-HF scan"
copied_from: "Public Aave v2 Avalanche takers (lead 309): 0x9db94915aae31eabb97bff926384a0af8886363d in tx 0x5d1c777ef1f323c9b9df76c224a39ee25076f273ba32e35932be9f00a55061a4 (block 100348490, fork-proof case A); 0x5ac9bc14376bf2727c6211960cf3cec1e2f295bd in tx 0x24b763f07788e086b18aeaa619ebc464a8a18eebb4c497d0e30050ff1d112951 (block 100315726, case B) and tx 0x37d6d639cfe42e211141373d477c0cd19ea1807ceec4c2246c8ffc250a65dc33 (flash loan from the v2 pool itself, the funding copied here); 0x988a2540c30b9ab860ee397e13ccb1976b2eb91e in tx 0x12fb44b18a54f8c64cf1ebc66b1594a515b61e618050c0aff55935e282bd0682. Bot shape copied from the farm's own live trial-aave2-polygon."
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialAave2AvaxLiquidator.sol:76 reverts NoProfit unless the native-USDC balance grew by at least minProfit (and :72 when the debt-token surplus is not positive), and :78 pays the whole gain to the bot as USDC in the same tx, so a lost attempt costs gas only. bot.py:412 sets the fee ceiling so maxFeePerGas x gasLimit < 0.90 USD at the Aave oracle AVAX price (never above 500 gwei), :422 requires simulated gross > that signed gas cap, and :428 sets the on-chain minProfit to the gas cap. Priority fee bid is at most 50% of the simulated gross (BID_SHARE, bot.py:413); a bid under 1 gwei is not sent (:415). No principal: the cover is a flash loan from the Aave v2 pool repaid in the tx; the bot wallet holds AVAX for gas only (10 USD)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7.1 d to 2026-11-19 (attempts:2650, blocks 100,135,744-100,809,089): 19 LiquidationCall events in 19 txs by 5 liquidator addresses (0x988a2540 8, 0x5ac9bc14 6, 0x9db94915 2, 0x759bb40c 2, 0x6ebfb347 1); liquidator gross median 2.56 USD, max 46.77, total 126.6 USD; winners' effective gas price 9.8-33 gwei for 12 of 17, up to 2,904 gwei on index-0 takes. Parent-block check (attempts:2668, scratch/trial-aave2-avalanche/parents.json): 6 of 19 were under water at the parent block (73 USD of cover, about 3.7 USD of bonus per week), 13 flipped inside the capture block. The bot aims at that parent-underwater share; the two proof cases paid 3.289875 and 0.832292 USDC for about 0.005-0.007 AVAX of gas each. Expect cents per day at best; the point is the measured win rate on a frozen market."
executor: scratch/trial-aave2-avalanche/contracts/out/TrialAave2AvaxLiquidator.sol/TrialAave2AvaxLiquidator.json
executor_args: "{bot}"
executor_note: "Owner-only liquidate(job, cover, minProfit). Pool (also the flash lender), borrower, collateral, debt token, both UniV2-style pair chains, the pair fee numerator and the payout token are all call arguments; constructor takes the bot address only; no setup transaction. The Aave v2 callback executeOperation accepts only the pool set for the running call (cleared at the end), initiator == the executor itself, and a single-asset loan of the job's debt token. Approvals are exact and reset to zero (pool: liquidation amount, then loan + premium, then 0 after the pool pulled it); swaps send tokens straight to the pairs, no router approval. The bot always passes payToken = native USDC 0xb97ef9ef, so profit leaves as USDC. Live address from EXECUTOR_ADDR_AVALANCHE or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-aave2-avalanche/proof.py (lease, then per case: reset, deploy artifact, fund owner, non-owner, guard, nothing-to-take, success; release; output proof-result.json, PROOF OK). Case A, reset avalanche 100348489 = parent of the historical capture 0x5d1c777e... (borrower 0x67f94ea0..., WAVAX collateral, USDC.e debt, HF 0.99969): success 0x3147be2d5133f5f23a565675a48782ec3b3734c17b26f852b026628de64178c2 block 100348494, gas 811345, owner +3.289875 USDC, native -4870828511337780 wei (gas), borrower HF 0.99969 -> 1.3009, executor balances and pool allowances all 0. Correct reverts: NoProfit guard 0xa501889341d8786a58e6d091594a65d1201c8402c1dfbc466dbd79db742f7e5c (0xe39aafee, owner USDC delta 0); non-owner 0xf0f41a846e30b3355a450204af300452a5b35b6e7ec55b539100dbcccf1f7c0e (NotOwner 0x30cd7471); nothing to take 0xe7d29cb3522251739defd4743b1251c67c2d1c1ab7d683661e9a03e49e3657da (target address without a position, Aave error string 42, owner USDC delta 0). The success lands at parent+5 because deploy and the three guard sends consume fork blocks. Case B, reset 100315725 = parent of 0x24b763f0... (borrower 0x3bf542dd..., USDC.e collateral and debt, HF 0.99978): success 0xf95e5dcef5514290c70a551622554e33ab4e4e2d8f3325dfa42496732d5336c8 block 100315727, gas 714304, owner +0.832292 USDC. scratch/trial-aave2-avalanche/selftest.py (selftest-result.json): bot calldata equals cast calldata for both cases; relay eth_call at the two parent blocks with the paper code override returns 3.289875 and 0.832292 USDC; the bot's own attempt() pinned to those blocks logs an opportunity and paper_sim for each; at head it skips the 12 uncollectable under-water users."
awaited_events: "Aave v2 LendingPool 0x4F01AeD16D97E3aB5ab2B501154DC9bb0F1A5A2C LiquidationCall on the feed (about 2.7 per day over the last 7 days; last one in the census at block 100709152 on 2026-11-18); every such event triggers a scan of the near-HF list. Safety scan of the near list about every 60 s, full universe hourly, new users from the pool's logs every 10 min. Next occurrence is not predictable for price-driven positions; same-asset positions cross HF 1 by interest alone."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is)."
bad_signs: "No opportunity row in 7 days; every send lost by many blocks; simulate_revert on every underwater user other than the 12 known uncollectable ones (routes); read_budget rows (75k CU cap hit); bid_under_min_tip or gross_not_above_gas_cap on every case (only dust is left)."
rpc_reads_per_min: "about 1.3: one Multicall eth_call per minute (near scan), 5 per hour (full scan of 850 users in batches of 200), one eth_getLogs + eth_blockNumber per 10 min, plus up to about 12 calls per detected opportunity (routes x two cover sizes; debts of 2,000 USD or more: up to 6 sizes per route)"
alchemy_cu_per_day: "about 56,000 relay CU/day (near scan 1440 x 26 = 37,440; full scan 5 x 24 x 26 = 3,120; discovery 144 x 70 = 10,080; retries of stuck users about 5,000) plus feed about 2,000 = about 58,000 CU/day = 0.03 USD/day at 0.53 USD per 1M CU. The code stops relay reads at 75,000 CU per UTC day and sleeps to 00:00 UTC."
legal_note: "Public Aave v2 liquidation bonus for repaying unhealthy debt, open to any caller. Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions. Bidding a priority fee for a public reward is in scope of the trial decision."
expedite: false
