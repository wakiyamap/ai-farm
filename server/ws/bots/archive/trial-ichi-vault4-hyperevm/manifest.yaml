id: trial-ichi-vault4-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: the WHYPE-deposit ICHI vault IV-NEST-8 0xcde75a12 on Nest (WHYPE + UBTC in the Algebra pool 0xcd238eaf), deposit / withdraw pricing versus WOOFi's oracle-priced pool WooPPV2 0x5520385b (and two V3-style UBTC/USDC pools). When UBTC is dearer there than on the vault's own pool, one tx flash-borrows WHYPE on Morpho Blue, deposits it into the vault, withdraws the shares at once (pro-rata WHYPE + UBTC), sells the UBTC back to WHYPE, repays, unwraps and pays the gain to the bot wallet as native HYPE, or reverts. The bot polls one eth_call of the executor's scan() (27 candidates: 9 sizes x 3 routes) every 27 s."
copied_from: "One operator, EOA 0x0b8d87ee4ee429a60e8f5738c3a2d7d6e8ad8471, through flash recipients 0x7484eb5f11142e9ab49869aadda524c37e29e0e7 (tx 0xc6d3183ef5c40772c9b1ddaa2a9795113bb3962831cbac34cca908cb8ff9969b, block 51,497,766, tx index 0, +0.4620 WHYPE, 692,558 gas, 9.975 gwei, flash 437,799 WHYPE; the fork proof's block; traced with scratch/r6811/trace.py), 0x7b9836a3fa0824572c2f7e69beb19c351d80548b (tx 0x95df854781859389f31a3ecc51a9bdfee8b67d83845dd2512d4c845547fda4ab, +0.3469 WHYPE) and 0x3ad8bef9e0de9baebc57ae19b4ac82566e281432 (tx 0x05f3815531b7914f4ce31e0ea54442420a6d3509916e3aece64b3c7539356ed0, +0.1116 WHYPE). Same vault, lender and sell venue, same call order (Morpho flashLoan, vault.deposit, vault.withdraw, UBTC transfer to the WooPP, WooPP.swap(UBTC, WHYPE, amount, 0, self, 0)); changed: size chosen by simulation from fixed sizes, two V3 routes also tried, gain unwrapped to native. Sibling of the farm's live trial-ichi-vault-hyperevm, -vault2- and -vault3-, which do not cover this vault or this venue."
capital_usd: 20
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor IchiVaultArb3.run requires profit > 0 and profit >= minProfit in the borrowed token (WHYPE) after the flash loan is repaid (scratch/trial-ichi-vault4-hyperevm/contracts/src/IchiVaultArb3.sol:85; a losing route already fails at Morpho's repayment pull) and a deadline (:82), so a lost attempt costs gas only. Gas cap per send in bot.py evaluate() (constants GAS_LIMIT_MAX to GAIN_OVER_CAP, bot.py:71-77): gas limit = eth_estimateGas x 1.25 (at most 1,900,000); maxFeePerGas = base fee x 1.3 + bid, never above fee_ceiling = 0.95 USD / (gas limit x HYPE price), HYPE valued at the WHYPE/USDT0 pool price x 1.15; no send unless the simulated native gain is at least 1.2 x that gas cap (GAIN_OVER_CAP); minProfit is the gas cap in wei + 1, so a mined success earns more HYPE than its gas can cost. Priority-fee bid: at most 35 pct of simulated gross (BID_SHARE), never above the fee ceiling."
expected_value: "trial, win rate to be measured live; expect few wins. Competition, 7.06 d to head 51,829,283 (scratch/trial-ichi-vault4-hyperevm/measure7-0xcde75a12.json; gains are floors): 281 same-transaction round trips = 39.8 a day, gain 1.6448 WHYPE = 92 USD at 56.2 USD/HYPE, median 0.00026, max 0.462 WHYPE; 92 of them sell on the WooPP and earn 1.51 WHYPE; 18 takes of 0.01 WHYPE or more sum 1.42 WHYPE, 9 at tx index 0, gas price median 9.95 gwei, all 18 by EOA 0x0b8d87ee (0.2-0.42 USD fee each). backscan3.py -> backscan3.json: this bot's scan() at the parent block of each of those 18 takes finds 11 of them (route E, sum 1.246 WHYPE = 70 USD against the incumbent's 1.42), but two blocks before the take only 3 (0.131 WHYPE = 7.4 USD) and eleven blocks before 1 (0.008 WHYPE): the incumbent takes in the first block (1 s) after the gap opens. trigger.py -> trigger.json: the gap opens on a Wooracle price post (5 of 11), a liquidity change of the vault's pool (3 of 11) or neither (3 of 11), so there is no single event to wait on. A 27 s poll therefore sees only gaps that outlive the first block and what is left after a first take (after the fork success the scan still shows 0.0069 WHYPE): about 0.5-1 USD a week if it wins those, and the measured answer to how often a gap survives 27 s. This bot's fee ceiling is about 15 gwei at a 950k gas limit (above the incumbent's 10 gwei) and it bids at most 35 pct of gross. One lost attempt: about 913k gas = 0.005-0.5 USD at 0.1-10 gwei."
executor: scratch/trial-ichi-vault4-hyperevm/contracts/out/IchiVaultArb3.sol/IchiVaultArb3.json
executor_args: "{bot}"
executor_note: "Deploy gas 1,414,772 on the fork, below the 2,000,000 HyperEVM cap. IchiVaultArb3 = the executor of the live trial-ichi-vault2 / vault3 bots (IchiVaultArb2) with one more hop kind: a hop with tokenIn set transfers the executor's whole tokenIn balance to the given WOOFi WooPPV2 and calls its public swap(fromToken, toToken, amount, 0, self, 0) (selector 0x7dc20382, cast sig; no approval, no callback). constructor(address bot) only (owner is immutable); Morpho, token, size, vault, sell hops (pool, direction, tokenIn, tokenOut), limits and the unwrap flag are Params call arguments. This bot always calls with token = WHYPE and unwrap = true: the whole WHYPE balance is unwrapped and paid to the owner as native HYPE (receive() accepts native only from the token being unwrapped). The Morpho callback and the swap callbacks accept only the counterparty set for this step of this transaction; it is cleared at the end. Approvals are for the exact amount (vault: reset to zero after the deposit; Morpho: used up by its repayment pull; all read 0 after the fork success). scan() is an owner-only eth_call helper that rolls every candidate back (probe() always reverts with the result). Nothing stays in the executor after the fork success. The WooPP 0x5520385b is a TransparentUpgradeableProxy whose implementation 0x44a6d5c2 is not verified on the explorer; it was identified by behaviour (selector, Wooracle state() / postPrice calls in the trace, fork success), not by source."
fork_evidence: "scratch/trial-ichi-vault4-hyperevm/proof3.py -> proof3.json (one script: lease, reset, deploy, scan, guards, success, repeat, release; no fixture and no setCode; owner 0x1111111111111111111111111111111111111111; executor 0x8f7a45ebde059392e46a46dcc14ab24681a961ea; run forge build in contracts/ first). Reset 51,497,765 = parent of incumbent tx 0xc6d3183ef5c40772c9b1ddaa2a9795113bb3962831cbac34cca908cb8ff9969b (block 51,497,766, index 0, +0.462002 WHYPE). Deploy 0x7d71304cd86ef069aff1a7c4c7c7e541f57a938f2c3c44ca90ef31acfb3d87d1 (1,414,772 gas). scan() before, route E at 15 / 500 / 8,000 / 120,000 / 400,000 WHYPE = 0.001246 / 0.038449 / 0.275936 / 0.447184 / 0.461451 WHYPE; route C best 0.002899 at 150; route D 0. SUCCESS 0xc0673350ffad9c0311f308b2385c859af758eaf17211c9780104ebea41359960 (fork block 51,497,769, 760,048 gas, 400,000 WHYPE flash, route E, minProfit 0.230725 WHYPE): owner native +0.461451 HYPE before gas, +0.460630 after the fork's gas (the incumbent took 0.462002); executor holds 0 native / WHYPE / UBTC / USDC / shares, allowances 0. Reverts: non-owner 0x5617953fbe506d6d51aeb6aac740cf12393faac4a4d41ebc1503c67b59e5e807 (29,600 gas), minProfit 10 WHYPE 0xefe3d0e1f4405b50689437f99e3ff0c0f695054861ed0d966015cbda681f65b3 (912,503 gas), same call again after the take 0xf66a5a58315237af82ce87c67b4193f60e0a1519c2f3ec5aca05d4e4eef591b9 (913,386 gas; scan after = 0.0069 WHYPE at most, owner native delta 0 plus gas). selftest3.py (selftest3-result.json, 2026-11-21): selectors equal cast sig, the bot's hand encoder equals cast's bytes for run() on all three routes and for scan(), the paper runtime equals the artifact runtime with the owner filled in (5 x 20 bytes differ, all 0x11); through the relay with the code override scan() answered for all 27 candidates (all 0: no gap open), run() with minProfit 1 runs to Morpho's repayment pull ('transferFrom reverted' = the route ran and lost), evaluate() on a fake gain ends in simulate_revert at the exact-bytes check. Paper runtime = eth_getCode of the fork deployment (runtime3.hex)."
awaited_events: "No single event: a gap opens when WOOFi's Wooracle price for UBTC or WHYPE moves (posted by 0x33b12dd7, no log) or the vault's pool 0xcd238eaf changes while the other stands still. The bot polls scan() every 27 s and acts when the best candidate's gain exceeds 1.2 x its gas cap. Last taken by others: 39.8 round trips a day over 7 days; last take of 0.01 WHYPE or more on the WooPP at block 51,809,222 (2026-11-20 about 23:20Z). Takes of that size came 18 times in 7 days, so the next is expected within a day."
good_signs: "logs/bot.jsonl: a poll heartbeat every 18 min; opportunity_skip or opportunity + paper_sim rows from time to time; live: send_result rows with result won and gas_used about 700k-800k."
bad_signs: "loop_error on every poll (the vault, the WooPP or a pool changed, or the node stopped accepting the code override); read_budget before 23:00Z; no opportunity or opportunity_skip row for 3 days while others still round-trip the vault (gaps never outlive the poll interval: report as blocks late); live send_result lost on every send with blocks_after_winner >= 0."
rpc_reads_per_min: "2.2 (one eth_call per 27 s) plus about 4 reads per evaluated gap"
alchemy_cu_per_day: "about 84,000-98,000 (0.045-0.052 USD): 3,200 scan polls x 26 CU = 83,200, plus 88 CU per evaluated gap; hard cap 98,000 relay CU/day in code, then it sleeps to 00:00 UTC. No feed filter."
legal_note: "Same class as trial-ichi-vault-hyperevm, allowed by the human decision decisions/human/2026-11-21-ichi-yes-peapods-fee-no.md section 1: arbitrage between the vault's public deposit / withdraw pricing and another venue's price, not an attack on the vault's accounting. deposit and withdraw are the vault's public functions; the WooPP swap, the pools and Morpho's flash loan are public (the fork proof calls them from a fresh contract). The bot reads mined state only, watches no mempool and no pending transactions; it may bid a priority fee for a public opportunity. It never swaps on the vault's own pool 0xcd238eaf, so it does not move the price the vault reads."
