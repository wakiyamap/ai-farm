id: trial-beefy-harvest-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: Beefy cowcentrated (CLM) strategy harvest caller fee on HyperEVM. Each of the 9 active strategies pays a WHYPE caller fee to whoever calls its public harvest(address); the fee grows with pool volume since the last harvest. One tx through the executor calls harvest with the executor as fee recipient, unwraps the WHYPE and pays it to the bot wallet as native HYPE, or reverts. The bot simulates each strategy on a timer and sends once the fee exceeds that send's whole gas cap, a lower threshold than the incumbent's."
copied_from: "EOA 0xde3af1d882b714f0afb46724ab22761d53f0efac, direct harvest(address) calls on the strategies, e.g. tx 0x8a76866ce1b4f7a4fb9ed9187de64c9d59dc6097502221b20937f2f86c4f5659 (block 51747794, strategy 0x6DD1C86d, fee 0.000115120 WHYPE, gas 0.000097909 HYPE) and 0xd630eade83979627da845afe6b7c31de522d913c9f15894fbfa7f320239fe8ad (block 51746220, strategy 0xaacd20Da). Changed: the call goes through an executor that unwraps the fee to native and reverts unless the wallet gains minProfit; priority fee 0 by default and a lower fee/gas threshold."
capital_usd: 20
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor BeefyHarvestTake.take reverts NoProfit unless the owner's native balance grows by minProfitWei (scratch/trial-beefy-harvest-hyperevm/contracts/src/BeefyHarvestTake.sol:58-59; also owner-only, tx.gasprice <= maxGasPrice and deadline, :44-46), so a lost attempt costs gas only. Gas cap per send in bot.py:52-60 and check() bot.py:184-237: gas limit = (simulated executor gas + 30,000) x 1.04, never above 1,950,000; maxFeePerGas = base fee x 1.03 + priority, never above 0.5 gwei (worst case 1.95M x 0.5 gwei = 0.000975 HYPE, about 0.064 USD at 65.6 USD/HYPE); no send unless the simulated fee is above gas limit x maxFeePerGas, and minProfitWei is set to that cap. Priority-fee bid: at most 20% of (gross minus the gas cap at the base fee) (BID_SHARE, bot.py:60)."
expected_value: "trial, win rate to be measured live; tiny by construction. 7 d competition, blocks 51143000-51748200 (attempts:2797; scratch/trial-beefy-harvest-hyperevm/rows.json, 232 ChargedFees receipts): EOA 0xde3af1d8 200 harvests, fees 0.029371 WHYPE vs gas 0.023001 HYPE (net +0.0064 HYPE, about 0.42 USD), 198 of 200 with fee above gas, priority 0.015 gwei, sends when fee / its gas is about 1.24 (deciles 1.16-1.35); EOA 0x03d9964f 29 daily hygiene harvests at a loss (fee 0.0015 vs gas 0.0064); EOA 0x2e8d0cc9 via contract 0x457f35b4 3 harvests (fee 0.00103 vs gas 0.00049). No fee auction. The bot's threshold (fee above about 1.07 x pre-refund gas at the base fee; real gas after refunds is about 0.82 x that) is reached before the incumbent's (about 1.43 x gas at the base fee), so it aims at most of the about 33 harvests/day at roughly 0.00002-0.00003 HYPE net each: at most about 0.05-0.07 USD/day. One lost attempt costs about 0.5-1.0M gas = 0.003-0.007 USD."
executor: scratch/trial-beefy-harvest-hyperevm/contracts/out/BeefyHarvestTake.sol/BeefyHarvestTake.json
executor_args: "{bot}"
executor_note: "Deploy gas 419,749 on the fork, below the 2,000,000 HyperEVM cap. constructor(address bot) only; strategy and wrapped-native token are call arguments, nothing is stored, no approvals, no callbacks. take() returns (gain, gas spent inside) so the bot sizes its gas limit from the simulation. receive() accepts the WHYPE unwrap. Owner-only sweep(token) is for unexpected dust only."
fork_evidence: "scratch/trial-beefy-harvest-hyperevm/proof.py (lease, reset HyperEVM fork to head 51748539, deploy, fund, scan the 9 strategies by eth_call, guards, success, repeat, release; the fork base fee is set to mainnet's 0.1 gwei with anvil_setNextBlockBaseFeePerGas; result proof-result.json, run log proof-run.txt). Deploy 0x883dce5079cc46d171a6ce71d82a00eea40f8e0a11efda4c1b7b9a54ad629e72 (419,749 gas). Success 0x5ae79167d6a23b527605c2df62d7d45d4084e61e0f39611436068de563838656 (block 51748544, strategy 0x68E15d60D789BC8b08A36152A37b8C55DD5436F0, gas limit 1,073,707, maxFee 0.103 gwei, minProfit = the gas cap 0.000110591821 HYPE): gross +0.000116003114 HYPE, gas paid 0.0000837046 (837,046 gas), owner balance delta +0.000032298514 HYPE; executor left 0 native and 0 WHYPE. Reverts: not owner 0x8ed07cc9e606130486ef10e4529196c5e028b9466a52b715afb4941f48e7dd2d; minProfit above the fee 0x1d52feba4aebed12cdfce835b61125688de9279411da43aaadbbdce0d849a7c3; expired deadline 0xa9db9a4ab66cc0c0c17bc381c2f6378dcf71994ab6ce81163ae284757390acb2; the same call again right after the take (nothing left) 0x927c781315aa3c56d75632193e6899a2a1b6734996616e51d41cad75145bb9aa. Paper runtime executor-runtime.hex = eth_getCode of this deployment at 0x8f7a45ebde059392e46a46dcc14ab24681a961ea."
awaited_events: "A strategy's simulated caller fee rising above the send's gas cap. Last harvests by others: strategy 0x6DD1C86d at block 51747794 and 0xaacd20Da at 51746220 (2026-11-20 about 06:10-06:35Z); these two are harvested about every 1.7 h, 0x92E3B9AB about every 3 h, the rest about daily. At placement 0x68E15d60 was already above the bot's threshold (fork success above) and 0x92E3B9AB at ratio 1.05 of the base-fee gas cost, so the first paper opportunity is expected within the hour."
good_signs: "logs/bot.jsonl: sim rows with ratio climbing toward 1 on 0x6dd1, 0xaacd, 0x92e3, 0x68e1; opportunity + paper_sim success rows; live: send_result rows with result won and gas_used about 0.8-0.9M."
bad_signs: "sim_revert on every strategy (interface or relay problem; 3-4 strategies reverting in their reward swaps is normal); read_budget rows; live send_result lost with gas_used near gas_limit (out of gas: raise GAS_MARGIN); lost with blocks_after_winner small on every send (the incumbent lowered its threshold)."
rpc_reads_per_min: "about 0.7 on average: one eth_call + one eth_getBlockByNumber per strategy check, checks 30 s to 30 min apart per strategy (about 500 checks/day)"
alchemy_cu_per_day: "about 25,000 (0.013 USD): about 500 checks x (26 + 20) CU plus re-simulations; hard cap 90,000 relay CU/day in code. No feed filter."
legal_note: "harvest(address) is Beefy's documented public harvest with a caller incentive paid to any caller. The bot reads mined state only (relay eth_call), watches no mempool and no pending transactions; harvesting earlier than another keeper compounds the vault sooner and takes nothing from users."
expedite: false
