id: trial-euler-bsc
author: builder/claude-mythos-5-2
chains: [bsc]
strategy: "trial: Euler EVK liquidation on BNB Smart Chain funded by a Pancake V3 flash swap (18 debt vaults with USDT, USDC or USD1 as the asset; any collateral with a Pancake V3 pool against the debt asset), woken by the Liquidate log of the eUSDT-6 vault on the feed and a 110 s near-health scan"
copied_from: "Euler EVK liquidators on BSC: contract 0xf000042d2b48921c234f15d167e7874f594f303e in tx 0xfef12e0e4319543a735c8d126ea7c27b5ed74852f66adf1620c1463c741ee172 (block 133611085, the fork-proof case) and tx 0x4605b30452f9125357238782008066efbde815a186628c931bf69d27113c104c (block 133602282); 0x0000000000be226afde21672a5e4adc45692e69d in tx 0x507cd571edaaf9bd4897e3948cf70a14cc49213f526e5f4716869bb91f2c5f6a (block 133609936)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor EulerLiqSwapExec.sol:111 reverts NoProfit unless the USDC balance grew by at least minProfit (and by more than zero), and :113 pays the whole balance to the bot in the same tx, so a lost attempt costs gas only. bot.py:394-402 sets the gas price so gasPrice x gasLimit < 0.90 USD (never above 3 gwei), skips when the simulated gross is not above that signed gas cap, and :407 sets the on-chain minProfit to the gas cap. The gas price bid is at most 50% of the simulated gross (BID_SHARE, bot.py:78 and :395-400; skipped when the chain's minimum gas price is above that bid). No principal: the debt asset comes from a V3 flash swap that the seized collateral pays inside the same tx; the bot wallet holds gas only (10 USD of BNB)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7 d to 2026-11-18 (attempts:2105, scratch/euler_bsc_liq_events.json): 10 Liquidate events on 2 of the 29 borrow vaults, 9 of them one unwind on eUSDT-6 / eASTER-2 in 64 min on 2026-11-16 (8 tranches of 1,476-6,355 USDT on violator 0xa402f52e plus 540 USDT on 0x824ae3bf), taken by contract 0xf000042d (8), 0x0000000000be226a (1) and EOA 0x7d507d56 (1, a 95 USDC stable/stable case with no gain). The bot's own path at the parent block of each take (scratch/trial-euler-bsc/harness.out): +28.57 USDC (540 take, full size), +1.40, +1.46, +1.81, +3.11, +2.93 on five of the eight tranches (sizes 409-1,082 USDT: the Pancake ASTER/USDT pools cannot carry the incumbents' 5k tranches at the 0.2-1.2% discount), nothing on three tranches (discount under the pool fee) and nothing on the stable case. So the aim is the first take of a small account and one small slice per tranche of a large unwind: about 1-30 USD per take, about one episode per week."
executor: scratch/trial-euler-bsc/contracts/out/EulerLiqSwapExec.sol/EulerLiqSwapExec.json
executor_args: "{bot}"
executor_note: "Owner-only run(Params). Debt vault, collateral vault, violator, repay amount, flash-swap pool, the out pools to USDC, the payout token and minProfit are all call arguments; constructor takes the bot address only; no setup transaction. No lender: an exact-output V3 swap on the collateral/debt pool hands over repayAssets + 0.1% + 10 units of the debt asset, the swap callback runs one EVC batch (liquidate, repay max, redeem max, disableController) and pays the pool in the collateral asset just redeemed; the rest of the collateral is sold on the same pool and the debt-asset proceeds walk outPools (USDT/USDC 0.01%, for USD1 first USD1/USDT 0.01%) to USDC. The callback (pancakeV3SwapCallback and uniswapV3SwapCallback) accepts only the pool set for the running swap, cleared afterwards. The debt-asset approval to the debt vault equals the amount held and is reset to zero; controller and collateral are disabled again inside the tx. Profit leaves as USDC (18 decimals on BSC). Live address from EXECUTOR_ADDR_BSC or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode. Deploy 1,344,219 gas."
fork_evidence: "scratch/trial-euler-bsc/proof.py (lease, reset bsc 133611084 = parent of the historical take 0xfef12e0e..., deploy artifact, fund owner, size table, guards, success, leftovers, repeat, release; output proof.out; fork generation 13). checkLiquidation at the reset block: maxRepay 46,048 USDT, maxYield 96,200 eASTER. Size table by eth_call: repay 5,526 / 2,763 / 1,381 USDT revert (collateral short of the pool price), 690.73 USDT +2.925 USDC, 276.29 +1.977, 92.10 +0.779 on the 0.25% pool; 0.05% pool only 92.10 +0.597. Success 0x7ae58d9c577d753b9f165184bee518f9350925e0d608f47107efeb335518cde6 block 133611088, gas 863,116 (estimateGas 1,076,311), owner +2.925291 USDC (simulated 2.925289); executor USDC, USDT, ASTER, native, collateral shares, debt, USDT allowance to the vault, EVC controllers and collaterals all 0 afterwards. Correct reverts: non-owner 0x50116548772e79909fa901b32765a1651b037c91912a37fd53b2a7fe97056cd8; NoProfit guard 0xdd062a616727f6bde604731064bb6b9bf382453904b886cbda7818378cf729ad (0x31708d59, minProfit 1e30, owner USDC delta 0, gas 1,049,236); nothing to take at that size 0x151d8c8f20cc56a38b609a05d9fefd59721e37043c87babf92ec34dda13ca376 (repay three times the maximum, 0x3b77f101, owner USDC delta 0). The success lands at parent+4 because deploy and the two revert txs use fork blocks. Deploy 0x03aaa0a66315db02478a8faf7563565c22c8cfd738843294fdffbb9c58da486d, 1,344,219 gas, runtime 5,973 bytes = executor-runtime.hex. scratch/trial-euler-bsc/harness.py (output harness.out): bot calldata equals cast calldata for 0, 1 and 2 out pools; the bot's scan and attempt path with the paper code override at the parent block of all ten takes of the last 7 days."
awaited_events: "Liquidate(address,address,address,uint256,uint256) on eUSDT-6 0x95c5fd8618c68d6156a739c1eab5aa7c807ff148 on the feed (9 in the last 7 days, all on 2026-11-16 between blocks 133602282 and 133611085; the next one is not predictable, it follows an ASTER price drop), and the timed scan (about every 110 s) of the near-health list across all 18 debt vaults. Last in-scope liquidation: block 133611085, about 1.9 days before 2026-11-18 11:50Z."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is); backfill rows growing the universe."
bad_signs: "No opportunity row in 7 days; every send lost by many blocks; simulate_revert on every underwater account (discount under the pool fee at every size); read_budget rows (90k CU cap hit); scan rows with debtors=0 (borrower list empty); feed_error on every wait."
rpc_reads_per_min: "about 0.8: one Multicall eth_call per 110 s (near scan), 1-3 per hour for the full scan, eth_blockNumber + eth_getLogs every 10 min, 3 more eth_getLogs per 10 min during the first ~4.5 days (backfill), plus about 10-25 calls per underwater account per 2 min (collaterals, pools, up to 9 size simulations per pool, estimate, gas price, final simulation)"
alchemy_cu_per_day: "about 34,000 relay CU/day (near scan 785 x 26 = 20,400; discovery 144 x 85 = 12,240; full scan about 1,000) plus feed about 5,000 (one quiet filter, idle long-polls) = about 39,000 CU/day = 0.02 USD/day at 0.53 USD per 1M CU; about 71,000 during the first ~4.5 days (one-time 90-day Borrow backfill, 432 pages x 75 = 32,400 per day). The code stops relay reads at 90,000 CU per UTC day."
legal_note: "Public Euler EVK liquidation discount for taking over unhealthy debt, open to any caller. Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions. Bidding a gas price for a public reward is in scope of the trial decision."
expedite: false
