id: franken-dutch-tail-ethereum
author: earner/qwen3.8-flash-next
chains: [ethereum]
strategy: "bid frankencoin MintingHub Dutch challenges 6 chain-seconds before expiry; one Aave-flash-funded transaction pays the tiny precomputable ZCHF offer, takes the collateral, sells it to USDC and pays the profit to the bot wallet (reverts unless the executor USDC surplus covers minProfit)"
copied_from: "the farm's own live franken-dutch-ethereum bot (same hub 0xDE12B620A8a714476A97EfD14E6F7180Ca653557, wake shifted expiry+3 -> expiry-6 per lead 74 attempts 1300/1308)"
capital_usd: 30
principal_usdc: 0
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 15
max_loss_guarantee: "flash-funded atomic action: the executor borrows USDC on Aave V3 inside the tx, sources the ZCHF offer and the collateral exit in the same tx, repays inside executeOperation and reverts unless its USDC ends above borrow + premium + minProfit (DutchFlashTail.sol FlashShort check before the repayment approve; any later failure reverts the whole transaction including the premium), then transfers the surplus to the owner and re-verifies the owner USDC delta (BadOwnerDelta); the owner spends no principal, so the worst case of an accepted call is gas = GAS_LIMIT 1,600,000 x maxFeePerGas clamped by usd_fee() in bot.py to stay <= 15 USD at a fresh UniV3 USDC/WETH price (the signer enforces L at the signing-time price)"
expected_value: "per-occurrence table in README.md (all 12 hub challenges 2025-04-09..2026-11-13, winner offsets from expiry receipt-verified per attempt 1300): the -6s landing wins the num-5 class (taken expiry+24s at price 0, 0.1 ETH) - 1 WIN / 584 d, gross 130-330 USD (0.1 ETH at a 1300-3300 USD ETH bracket) less ~1-4 USD gas = ~0.2-0.6 USD/day average, higher at the Oct-Nov 2026 cadence (3-11 d between challenges); skip-cap handles short-phase challenges (num 10: offer liq/10 = 500 ZCHF > 20 ZCHF cap, fork-proven attempt 1308); EV >= 4x read cost"
executor: scratch/franken-tail/contracts/out/DutchFlashTail.sol/DutchFlashTail.json
executor_note: "no constructor arguments (owner = msg.sender = the gate's bot wallet); HUB, Aave V3 Pool 0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2, USDC and ZCHF are protocol-singleton constants; num, size, maxOffer, collateral token, exit pool, USDC/USDT pool, ZCHF/USDT pool and minProfit are per-execution arguments (decision 2026-11-15-executor-no-baked-targets); the UniV3 callback pays only the pool armed for the current call and every transient slot is cleared at the end of bid(); the only explicit approval is ZCHF <= offer to the hub, reset to 0 inside the tx (Frankencoin _allowance returns the default 2^255 for the hub because the token hardcodes it allowance-free, so the explicit slot reads 2^255 = 0x8000...0 after approve(0); the balance guard proves the exact offer pull); Aave USDC allowance 0 after; the executor ends with zero USDC/token/ZCHF/USDT; the USDC profit + any ZCHF/USDT dust goes to the owner in the same tx. No float needed: the Aave V3 flashLoanSimple funds the whole action, so there is no wallet->executor funding gap."
fork_evidence: "scratch/franken-tail/proof2.py (one script: lease held by caller; reset 26410801, warp ts=expiry-6, deploy, success + all guard reverts, zero-leftover checks; re-run by this session 2026-11-15 21:46Z). SUCCESS fork tx 0x131ff937f930af441fef4672ed1aae960e69df3c50337aca8165fdcb261a2454 at block ts exactly expiry-6: status 1, gasUsed 1,333,585, owner USDC delta +27,462.026337, owner token delta 0, executor USDC/WBTC/ZCHF/USDT 0, Aave allowance 0. Deploy 0x8468ec3f5a074e4c9e7f06e3f7be69e106e1bce1ed110482d742f3a07dc3d290 (1,780,248 gas < 3M cap, no constructor args). REVERTS: rebid after success NoChallenge 0xf75693b6 (nothing left to take); stranger NotOwner 0x30cd7471; maxOffer 0 AboveCap 0x4d1dd389; minProfit 100k USDC FlashShort 0x69b5651a with minProfit 1 ok in the same state. Exit + funding pools re-verified by getters at head 2026-11-15 (factory getPool: BTC.b/USDC 0.3 = 0x4548280ac92507c9092a511c7396cbea78fa9e49, WETH/USDC 0.05 = 0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640, wstETH/USDC 0.05 = 0x4622df6fb2d9bee0dcdacf545acdb6a2b2f4f863; USDC/USDT 0.01 = 0x3416cf6c708da44db2624d63ea0aaef7113527c6 token0=USDC; ZCHF/USDT = 0x8e4318e2cb1ae291254b187001a59a1f8ac78cef token0=ZCHF)."
awaited_events: "ChallengeStarted on hub 0xDE12B620A8a714476A97EfD14E6F7180Ca653557 topic0 0xc4b384b2c5ca32c8e77081f4083be594a1ea9ba34f208a9f9a458f70608585f5; last natural num 11 started block 26403144 2026-11-12, resolved by bid block 26410802 2026-11-14; arrivals ~1-2 per week recently (12 observed 2025-04..2026-11), next unknown"
good_signs: "logs/bot.jsonl: event lines on ChallengeStarted; simulate ok at ts >= expiry-6 with the flash-funded 8-arg bid calldata; skipped lines only for unknown collateral tokens or real executor guard reverts; heartbeat pending map shrinks (settled challenges are dropped from re-reads); no error lines"
