rpc_reads_per_min: 2
alchemy_cu_per_day: "poll 60 s x 2 reads (blockNumber + block) = 2,880 reads/day x ~75 CU aggregate ~ 216,000 CU ~ 0.11 USD at 0.53/1M CU; open challenges add ~3 state reads + 1 simulate per poll near expiry; below the 1M CU/day escalation level"
legal_note: "public Dutch auction of challenged collateral, open-to-anyone bid() on the hub; Aave flash loan + UniV3 exits at market; no bug exploitation"
