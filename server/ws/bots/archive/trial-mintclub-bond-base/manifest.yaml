id: trial-mintclub-bond-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: Mint Club V2 bonding-curve token hDRB has two prices on Base, the Bond's step price (public mint / burn against DRB, 1 pct royalty each way) and its Uniswap v4 native-ETH pool. When they disagree by more than the fees, flash-borrow WETH from Morpho, buy hDRB on v4, Bond.burn it for DRB, sell the DRB for WETH on the V3 pool (or the reverse through Bond.mint), keep the difference as native ETH"
copied_from: "operator 0xc0ffee.. (rotating sender EOAs, payout 0xc0ffeefeed8b9d271445cf5d1d24d74d2ca4235e) through burn executor 0x13ff21410256405ea9e5c60b27ceb3f8d8b6d652 (37 takes in 7 days, e.g. tx 0x550d375153651dcd9ad1d9178f1122d46f6d233e16c60cd2c5d68963054a2422, block 60479958: Morpho WETH flash, 0.004998 ETH -> 38,349 hDRB on v4, burn for 93,795 DRB, sold for 0.005015 WETH, +0.0000169 ETH) and mint executor 0x818e056fc1fe1dcf5de131633c5a45ff018e0ad4 (26 takes, e.g. tx 0xda63f5f7492b81badd27589a31312061f2dc314e70cce6e79051f7e7226f10b7, block 60052080, +0.000041 ETH); also 0xf7c70a04d2c0bba340fffb1816d30a25dd3562f6 (15 burns) and 0x4d98dbc5bb8c4c830384b9e0a64938f6ee0cc481 (4 burns). Same route."
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "Gas only. BondArb.run reverts NoProfit unless its WETH + ETH balance grew by at least minProfit (and Morpho's own repayment pull fails first when the round trip lost), and the bot sets minProfit = the send's gas cap in wei (bot.py check(): cap = gas_limit * max_fee + L1_FEE_ALLOW_WEI, passed as min_profit to run_calldata by send_live), so an included send either pays more than its own gas cap or reverts and costs gas. A send happens only when the simulated gross > 1.3 x that cap (SEND_MULT). Caps in bot.py: MAX_FEE_CAP_WEI 0.15 gwei, GAS_LIMIT_MAX 2,400,000, so at most 0.00036 ETH + L1 fee = 0.90 USD a send at the 2,500 USD/ETH reference, and MAX_TX_USD 0.95. Typical attempt: 1.5M gas at 0.006-0.013 gwei = 0.000009-0.00002 ETH (0.015-0.035 USD) including the L1 data fee. Priority fee bid: at most 1/10 of the simulated gross, never above 0.1 gwei (TIP_SHARE_DEN, TIP_MAX_WEI). No principal: Morpho flash loan."
expected_value: "Trial: measures the win rate by sending. 7 days to block 60500167 (scratch/rc3f9/bondhist.py, scratch/trial-mintclub-bond-base/windows.py -> windows.json): 82 bot takes on hDRB by 3 operators (0xc0ffee.. 63, 0xf7c70a04 15, 0x4d98dbc5 4), in bursts (per day, oldest first: 23, 0, 29, 10, 0, 6, 14). Four 0xc0ffee takes sized from its payout address's native diff: +0.0000169, +0.0000410, +0.0000663, +0.0002196 ETH against 0.000009-0.000018 ETH of gas. Nobody bids a priority fee (tx index 3-157). Blocks from the newest other trade on the hDRB v4 pool to the take (41 of 82 with one within 3,000 blocks): median 651 blocks = 130 s, minimum 15 blocks = 3 s, 33 of 41 over 30 s. With a 30 s look the bot aims at those 80 pct, but only sends above 1.3 x its gas cap (about 0.000017 ETH at today's base fee), which the smallest incumbent takes do not reach: perhaps 3-6 sends a day on an active day, cents to a few tenths of a USD each (0.1-0.5 USD a day). On the fork at the parents of two incumbent takes the bot's own screen and size found +0.00001689 ETH (burn; the incumbent took 0.00001689) and +0.0000359 ETH (mint; the incumbent 0.0000410 at a larger size)."
executor: scratch/trial-mintclub-bond-base/contracts/out/BondArb.sol/BondArb.json
executor_args: "{bot}"
executor_note: "BondArb(address bot), Solidity 0.8.24, 5,996 runtime bytes, deploy 1,351,146 gas on the fork (limit 3,000,000). run(P) is owner-only; P is one static struct: morpho, pool manager, bond, V3 pool, WETH, reserve token, bonding-curve token, the v4 pool's fee and tick spacing, direction, WETH amount, tokensToMint (mint direction), minProfit. It flash-borrows WETH from Morpho; inside the callback, burn direction: unwrap, one v4 unlock (exact-input native ETH -> token, settle with value, take the token), approve the Bond for exactly the tokens held (burnByBond spends the caller's allowance), Bond.burn, approval back to 0, sell the reserve on the V3 pool; mint direction: buy the reserve on the V3 pool, approve the Bond for the reserve held, Bond.mint(tokensToMint), approval to 0, sell any reserve left back, token -> native ETH on v4, wrap. Then approve Morpho for the loan, and after the loan: approval to 0, NoProfit unless WETH + ETH grew by minProfit, unwrap everything and pay the owner in native ETH (receive() present). Nothing is stored or baked in, no setup tx; the three callbacks (onMorphoFlashLoan, unlockCallback, uniswapV3SwapCallback) answer only the counterparty set for the running step and cleared after it. Constructor arg = the bot wallet only."
fork_evidence: "scratch/trial-mintclub-bond-base/proof.py (one lease, two resets, about 60 s; result proof-result.json, console proof-out.txt; no fixture, owner funded with gas only). BURN: Base fork reset to 60479957 = parent of the incumbent's take 0x550d3751... (block 60479958). Deploy 0x205b688d17... (1,351,146 gas); the bot's own read_state / candidates / best_size chose hDRB burn, 0.005 ETH, eth_call gain 16889482631058 wei. Non-owner 0xb44d746963... reverts NotOwner; guard 0x513d148e55... (minProfit = gain + 1) reverts NoProfit(16889482631058, 16889482631059), owner out only gas; success 0x738f7e5a7fd8d36945c4a801bc4b75e53cad218fa68df22c027757485f1769eb fork block 60479961 (state = block 60479957 plus the proof's own txs), 1,502,192 gas: owner native delta + gas = +16887268056911 wei (the eth_call value less the 2.2e9 wei L1 fee the fork receipt does not itemise); the same call again 0xdc951d884c... reverts (gap closed, loan cannot be repaid); nothing to take: the mint direction 0x49892a049f... reverts. MINT: reset to 60052079 = parent of the incumbent's take 0xda63f5f7... (block 60052080): eth_call gain 35903549936772 wei at 0.005 ETH; non-owner 0x288f87c69b... NotOwner; guard 0x46c831badf... NoProfit; success 0x0620fcaa65aafc0bb482547e6c18f8725fc666ab941ce2835952bc7a7e971f0b fork block 60052083, 1,544,480 gas: owner native delta + gas = +35861588268476 wei; repeat 0xe6a26a418a... reverts; opposite direction 0xa17001c329... reverts. Executor leftovers in both cases: 0 WETH, 0 DRB, 0 hDRB, 0 native. windows.py: the bot's paper path (code override = eth_getCode of this deployment) returns the same 16889482631058 at block 60479957 through the relay, and a look at head is 1 eth_call."
awaited_events: "A trade on the hDRB v4 pool (or a move of the DRB / WETH pool) that leaves a round trip above the fees (about 3.1 pct: v4 1.1, royalty 1, V3 1). Last incumbent take: block 60479958 (2026-11-21 18:39:27Z, from block 60479923 = 18:39:20Z at 0.2 s a block); 82 bot takes in the 7 days before block 60500167 (19:46:49Z), in bursts on 5 of 7 days. Next: unknown, expected within a day or two while hDRB trades."
good_signs: "paper_sim success lines; live send_result won with gross_wei well above cap_wei; opportunity lines in both directions"
bad_signs: "send_result lost several times in a row (an incumbent takes within one look: the 30 s timer is too slow); only opportunity_skip gross_below_send_line (gaps stay under 1.3 x the gas cap: the class is too small for the farm's send rule); loop_error lines (a getter failed: pool or Bond changed); no check or opportunity line for days (hDRB stopped trading)"
rpc_reads_per_min: 2.1
alchemy_cu_per_day: 78000
legal_note: "The Bond's public mint and burn (the bonding curve the protocol runs for anyone, royalty paid in full), a public Uniswap v4 pool, a public V3 pool and a public flash loan. Plain two-venue arbitrage on confirmed state, read on a timer: no mempool watching, no reaction to pending transactions, no holding (everything is back in ETH inside the transaction)."
