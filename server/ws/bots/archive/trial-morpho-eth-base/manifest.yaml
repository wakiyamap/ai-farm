id: trial-morpho-eth-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: Morpho Blue cbETH/USDC (0x0ca10126...) and WETH/USDC (0x8793cf30...) liquidations on Base; wake on the CBETH/USD, ETH/USD and USDC/USD aggregators' update events via the feed, liquidate with repaidShares and sell the seized collateral to USDC along a UniV3 pool route inside Morpho's liquidate callback, one tx, USDC gain or revert."
copied_from: "takers of ledger morpho_blue.liquidate in these two markets, e.g. tx 0xf89904ba4645c33219f51cba63eee517b981c989fabfb9d1cba386fe5f67a370 (caller 0xcaf2bc10..., block 57519279, 7.00 USDC repaid, 2 blocks after the ETH/USD update, tip 0.1 gwei) and the cbETH batch 0xc0ed42ff10920936ead86e7880575f2e5449fb978adaaa1cf7aeda42488fdf07 (0x5451c4b4..., block 55636071); lead 220, attempts:1543 and 1549"
capital_usd: 18
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialMorphoRouteTake.take reverts NoProfit() unless its USDC balance grows by minProfit (scratch/trial-morpho-eth-base/contracts/src/TrialMorphoRouteTake.sol:83), so a lost attempt costs gas only. Gas cap per send in bot.py:78-84 and 330-341: GAS_LIMIT 550,000 x maxFeePerGas, with maxFeePerGas <= (0.95 - 0.03 USD L1 allowance) / (on-chain ETH/USD x 1.15, or 4,000 USD before the first read) / 550,000 (about 0.80 gwei = 0.80 USD at ETH 1,820); the bot does not send unless that cap plus the L1 allowance is < 1 USD and the simulated gross is above it, and passes the cap as minProfit. Priority-fee bid: at most 40% of simulated gross (BID_SHARE, bot.py:84), never above the fee cap."
expected_value: "trial, win rate to be measured live. 7 d competition (attempts:1549, scratch/trial-morpho-eth-base/competition-7d.json): cbETH/USDC 549 liquidations in 489 txs by 65 takers (447 under 1,000 USDC), WETH/USDC 744 in 157 txs by 39 takers (Atlas batchers take 504). In a 20-tx small-ticket sample 16 were taken in the oracle-update block at tips of 1.1-440 gwei, 4 later (+2, +2, +152, +522 blocks; tips 0.1-2.6 gwei). The bot aims at that later share: gross = 7.41% (cbETH) or 4.38% (WETH) of repaid minus pool fees (fork: +0.6048 USDC on 8.19 repaid), one attempt about 372k gas = 0.005 USD at the base fee."
executor: scratch/trial-morpho-eth-base/contracts/out/TrialMorphoRouteTake.sol/TrialMorphoRouteTake.json
executor_args: "{bot}"
executor_note: "No principal and no flash loan are needed: Morpho hands over the seized collateral before its onMorphoLiquidate callback and pulls the repayment after it, so the repayment is the sale proceeds (a manifest-check note about principal_usdc does not apply). constructor(address bot) only; market params, borrower, size, the pool route (1-3 UniV3-style pools, collateral to USDC) and minProfit are call arguments. Morpho Blue and USDC on Base are constants (counterparty and profit unit). onMorphoLiquidate accepts only Morpho while a take() is running; the swap callback accepts only the pool set for that hop; both peers are cleared; the USDC approval to Morpho is the exact repaid amount and reset to 0; a route that does not end in USDC reverts BadRoute. Profit is paid to the bot wallet as USDC. Owner-only sweep(token) for recovery."
fork_evidence: "scratch/trial-morpho-eth-base/proof.py (lease, reset base 55636069, deploy, fund, 4 guards, success, release); result in scratch/trial-morpho-eth-base/proof-result.json. Success 0x2d697ff02a2f8a4958bc9e9a29e8cc914c9c1ef4d18c0bc76cc64ceaa27da7a2 (fork block 55636075, gas 372,266, cbETH market, two-hop route): owner USDC +0.604823, borrower's debt shares 7817652371541 -> 0, executor left with 0 USDC / 0 WETH / 0 cbETH / 0 allowance. Reverts: nothing to take 0x3143d32edd9d5ca6758410fa963c4a67694468f5890d032579c97e907b6532f9 ('position is healthy', gas 126,296; that borrower had no position at the reset block), minProfit above gain 0xc7344fa6a7ada694665b4482e48f0d6f32ebd52913b432275b4de5056b7dff84 (NoProfit 0xe39aafee, gas 437,522), route not ending in USDC 0xba315abef664c926e44e9d08b5cb9b4a654531aaccd24a9c4a980ea662e6da32 (BadRoute 0xc4c321d1), non-owner 0x9760dd52015243ffe558188bd6c17d5991b9f543c95bb25c562b5b9de79fbeb6 (NotOwner 0x30cd7471). Paper override = eth_getCode of that deployment (executor-runtime.hex). scratch/trial-morpho-eth-base/selftest.py runs the bot's own scan/attempt paper path through the relay: cbETH at block 55636070 gives 3 opportunity rows + paper_sim success (gains 0.606589 / 0.531314 / 0.378641 USDC); WETH (one-hop route, eth_call only, not a fork tx) at block 57519278 gives 1 opportunity + paper_sim success (gain 0.270392 on 7.01 repaid); a healthy WETH debtor at 57997286 reverts 'position is healthy'; full scan at head: 3,759 + 7,168 debtors, 0 candidates, top ratios 0.945 / 0.944."
awaited_events: "AnswerUpdated (0x0559884f...) and the Atlas-bundled update event (0x8d530b9d...) on aggregators 0x71e021bc... (CBETH/USD, about 181/day, last at block 58463701, 2026-11-17 about 02:35Z), 0x05c84a58... (ETH/USD, about 199/day, last at 58464779) and 0x68be4c50... (USDC/USD, rare). A liquidation needs an ETH drop that pushes a borrower over lltv (0.77 cbETH, 0.86 WETH). At placement the nearest borrowers are at debt/maxBorrow 0.945 (cbETH) and 0.944 (WETH), so the next takes need about a 5.5% ETH drop from 1,818 USD or new borrowers nearer the line; last takes 2026-11-15/16 (cbETH block 57861487, WETH block 57997287), last bursts 2026-11-14."
good_signs: "logs/bot.jsonl: feed + scan rows on every aggregator update with top_ratio moving with ETH; opportunity + paper_sim success rows when top_ratio crosses 1; live: send_result rows with result won."
bad_signs: "scan_error or loop_error on every cycle; simulate_revert 'position is healthy' on every candidate with ratio > 1.001 (ratio formula drift); simulate_revert other than healthy on every cbETH candidate (the thin cbETH/WETH pool moved: change the route in MARKETS); live send_result lost with blocks_after_winner >= 1 on every send (always late); read_budget rows."
rpc_reads_per_min: "about 0.6: one Multicall eth_call per aggregator update (about 380/day), two per 420 s safety poll, 55 per full scan (every 6 h, or after a 1% oracle move, at most every 30 min)"
alchemy_cu_per_day: "about 46,000-51,000 (0.024-0.027 USD): relay 27-32k (updates 380 x 26 = 10k, safety polls 205 x 52 = 11k, full scans 4-8 x 55 x 26 = 6-11k) + feed about 19k (380 logs x 35 CU + 4 CU/min); relay reads hard-capped at 70,000 in code"
legal_note: "Morpho Blue's liquidation incentive is a public payout to any caller of liquidate(); no mempool watching, the bot reacts to mined oracle-update logs only; it bids a priority fee for a public reward."
expedite: false
