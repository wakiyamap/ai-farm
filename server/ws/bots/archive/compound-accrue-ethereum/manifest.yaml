max_loss_guarantee: "executor AccrueKeeper.accrue (scratch/compound-accrue-ethereum/contracts/contracts/AccrueKeeper.sol) records its own balance before the raw call to the measured selector 0xdb006a75 and reverts unless balance_after - balance_before >= minProfit (NoProfit); the payout arrives as a CALL-with-value from cETH, so every accepted call is net-positive in ETH and every revert costs only gas; after the profit guard the contract transfers its whole balance to the immutable owner in the same transaction (payable(owner).transfer, owner-only sweep() recovery for any prior balance), so the realized profit reaches the bot wallet inside the transaction (review 2026-11-08T06:32Z blocker 3); the live path first eth_calls the deployed executor on mainnet state and sends through the signer only when that simulation succeeded (a payout-below-minProfit state never burns a live tx), and the send caps maxFeePerGas at FEE_CAP_WEI 5 gwei (bot.py; review 2026-11-08T08:07Z gas clamp: the earlier fixed 15 gwei gave signed 0.003 ETH = $6.70 at the measured $2234/ETH, above the $5 bound), so the signed worst case is 200000 gas x 5 gwei = 0.001 ETH <= $5 at any signing price <= $5000/ETH (measured 2234 USD/ETH -> $2.23; the signer enforces the farm L at the signing-time price too); minProfit is 0.0012 ETH, above the 0.001 ETH signed gas exposure, so the wallet net after the worst-case gas is >= 0.0002 ETH (after-gas profit check, review 2026-11-08T17:33Z)"
expected_value: "class pool measured 27.4 USD/day for all callers (7d AccrueDistributed census, attempts 507), 95 pct of it cETH; big payments >= 0.5 USD are 3.1/day avg 8.6 USD, 12 gaps >= 1000 blocks/7d; our trigger threshold 0.002 ETH (~4.5 USD) fires ~1.7/day -> gross ~10-25 USD/day at partial capture, net after ~1-3 tx/day of gas (gas measured cents-$1/tx at 0.03-1 gwei); fork/paper capture rate pending review; FRESH-RATE recipe REFINED 2026-11-08 (attempt 582 + scratch/compound-boundary-out.txt): the caller-supplied mantissa is soft-VALIDATED against the supply rate the accrue path derives from the same-block state (a bad mantissa returns accrue code 9 BAD_NEW_SUPPLY_RATE, no revert, no accrue, no payout - a live tx then costs gas only and the executor guard reverts NoProfit), it is not a payout multiplier; the trigger now passes the derived supply mantissa = model.getBorrowRate(cash,borrows,reserves) x utilizationShare/1e16 = 8210735685 x 0.007004 = 57507718 at head 26372294 (borrows 1.512e20, cash 2.143e22, reserves 2.628e19 wei, utilization 0.7 pct) - protocol-valid by construction at each attempted state; the payout leg itself is additionally gated on cETH totalReserves() > 0 (measured 0 with stored supplyRatePerBlock() 0 at head 26371142, run 918ff617): while reserves are zero even a fresh mantissa accrue pays 0 and the mainnet-state sim reverts NoProfit; GATE RE-READ 2026-11-08T18:4xZ run a955115c (this session, after the relay state-read incident): at head ~26371950 cETH totalReserves() 0x16cb48c172ffcf4e3 = 1.326e18 > 0 (was 0 at head 26371142), supplyRatePerBlock() still 0, getCash() 4.895e22 wei, totalBorrows() 5.90e17 wei - the gate is half-open (reserves positive, stored rate zero; utilization ~590/48950 ETH ~ 1.2 pct); the bot now reads this gate every trigger and skips triggers with the gate closed instead of burning gas on dust-payout NoProfit reverts"
executor: "scratch/compound-accrue-ethereum/contracts/out/AccrueKeeper.sol/AccrueKeeper.json with constructor args cast abi-encode constructor(address,uint256) <bot key> 10000000000000000 (owner = the bot key the gate deploys with, minProfitCap 0.01 ETH); the gate deploys it at promotion and the bot calls accrue(address,uint256,uint256) = selector 0x037b1e29; the contract pays the whole balance to the owner in the same transaction after the profit guard and has an owner-only sweep() recovery; pinned runtime in state/executor-code.hex = eth_getCode of head-fork deployment 0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352 (deployed 2026-11-08 run c8307e49 on the shared ethereum fork, owner 0xf39f.. funded fork account)"
fork_evidence: "shared ethereum fork; lease only for the proof run and released as it exits (never held while reading). Rerun recipe: fork lease ethereum 10; fork reset ethereum 26349230 (block before the winner accrue tx 0x017b3d2e22b327463de410b4929290251180a02f8dbbacfa597a032c7f9030e0 at 26349231); deploy this artifact with args from cast abi-encode constructor(uint256) 10000000000000000; fork send from the funded fork account with input 0x037b1e29 + cETH padded + mantissa 0x37b4c6260 (the winner's own calldata mantissa) + minProfit 1e15, gas 0x30d90. Measured at the natural reset head (no timestamp advance): with the proven mantissa accrueInterest executes (cETH db006a75 and the comptroller delegatecall succeed, gasUsed 134642) but pays the executor 0 (native AND WETH balance delta both 0), so the guard reverts NoProfit - correct-revert leg tx 0xd105739735481dc0e3aab16ba17ebaf1948c2c09eee5b57ce50df2a5ca5ea5ac; the first call tx 0x0a118f567ac34a5aecf36c4be3cd82985816cfebf4308ee829c0cc89fe3d93db is the success leg (expected payout >= minProfit). Same result with the head timestamp advanced up to +86400 s (txs 0x5f230a20188d7177fdb1a2f65d1e2abab6b5373293ad5af30b6af699af251f86, 0x2bbba238..., 0x14734e57...); state/executor-code.hex = eth_getCode of the deployed 0x140e927a7711e5f4014f016cad6ea797f8dce673 after the deploy. OPEN FOR THE REVIEWER: the success leg did not reproduce on the shared fork - the identical calldata paid 0.0299 ETH to the winner recipient on mainnet at block 26349231 (debug_traceTransaction of that tx: CALL cETH -> recipient value 0x29b93611f05964b8), so the payout leg depends on mainnet state the fork reset does not reach (the interestScalar/utilization path). Run a3b6ab51 2026-11-08 mainnet measurements: cETH exposes accrualBlockNumber() (selector 6c540baf, returned 26367304 at head 26368299, = storage slot 10) - the accrual clock advances WITHOUT an AccrueDistributed event on zero-payout accrues (tx 0x92a8bceca4ea4563172f6c97de4c5af928f88f6a7766cc147386da50c0b9cfcb block 26365772: event word0=0, trace shows CALL cETH->recipient 0x60b0f191 value 0x4c810fff16348a = 0.00139 ETH, mantissa 45117721 accepted); the bot's gap now uses accrualBlockNumber, not the event cursor. The paper bot's mainnet trigger simulations (gap ~1066-1075 blocks on the accrual clock, mantissa 45117721, executor eth_call revert NoProfit = payout below minProfit 0.001 ETH at the current utilization drift) are part of the review evidence. 2026-11-08 run c8307e49 payout-contract proof (new contract with owner payout + sweep): head-fork deploy 0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352 with constructor(address,uint256) args (owner immutable verified by eth_call owner() -> 0xf39f..); revert legs on mainnet-head state: payout-below-minProfit tx 0x61eaa9a970962c7f2acf09fb4003aaf7753845a34f3499b2dd6c4a6c865f16f2 (status 0, gasUsed ~134570, owner delta = gas only) and minProfit-over-cap tx 0x6ff628409ba7c9433e1386401dfefb1063351f7326e11653563d5e787cca5ff8 (status 0, gasUsed 23080 = cap check before the accrue); payout at the head-fork bisected to ~0-1 wei (keepers had just consumed the accrual gap - mainnet head 26368649-53, accrual clock 26367304); mainnet payout measurements this session (debug_traceTransaction callTracer, CALL cETH->recipient value): tx 0x92a8bceca4ea4563172f6c97de4c5af928f88f6a7766cc147386da50c0b9cfcb block 26365772 paid 0.021534003934147722 ETH to 0x60b0f1919cf4ee46d1a8d63428276512814de570 and tx 0x6fcdf3e82e3b598c... block 26365190 paid 0.00907119364274966 ETH to 0x8f10b468b06c6fd214b65f87778827f7d113f996 (mantissa 45117721 both) - only 2 non-zero payouts in 20000 blocks (4 d): the payout is utilization-driven, zero-payout hygiene accrues dominate the current utilization; SUCCESS LEG STAYS OPEN: fork resets one block before a payout tx pay 0 because the utilization freshness that makes the payout positive is written in the same block before the payout tx (confirmed twice: resets 26349230 and 26365771 with the winner mantissa both paid 0); the paper/live trigger simulations at mainnet head are the natural success evidence once the drift crosses minProfit 0.0002 ETH. Run 602d1d01 2026-11-08 proof round (script scratch/compound-accrue-success-proof.py; rerun: fork lease ethereum 20 && python3 scratch/compound-accrue-success-proof.py && fork release ethereum — it resets 26365771, anvil_setTime-paces the fork clock, replays the 70 same-block predecessors of winner tx 0x92a8bce..., deploys this artifact with constructor(owner 0xf39f.., cap 1e16), funds 0xf39f, calls accrue(cETH, 45117721, 2e14), then replays the winner tx itself and reads its helper recipient's ETH delta; result json scratch/compound-accrue-success-proof.json): the fork prestate was verified identical to the mainnet payout tx's prestate (prestateTracer: 86/86 storage slots and the cETH balance equal; only one auxiliary swap-recipient balance differs by the two failed predecessor txs' ~0.0069 ETH) — the reset+replay fork does reproduce the same-block utilization freshness — yet the executor call still reverts NoProfit (paced-gap tx 0x1ef82b6454e1ff901c4a4b630dd46989fcb5462e893e9f5ba48da543045e9f33 at seconds gap 22521 vs the mainnet winner's 22416, and 0xddcc9774ed3013ffc3218999ba044218f17471a2f534f332f27f28091fca302d at gap 322490, gap_seconds in scratch/compound-accrue-success-proof.json); with minProfit 1 wei it still reverted (0x118796690a21410c35aebae0c5da6f36a589a4ec2a0e885ccdf485d3fdb78931), i.e. the executor's redeem(mantissa) entry (measured selector db006a75) pays the executor exactly 0 on the fork; the winner tx replayed on the same fork pays its helper recipient 3,339,483,120,000 wei (helper delta measured, tx 0x161f6bf128a2af390da35010b2db1d8f791572202e7c8ac15915c68e7a402f78) against 21,534,003,934,147,722 wei (0x4c810fff16348a) on mainnet — a 6448x collapse that is neither the seconds gap (paced +14x: the helper delta unchanged) nor the prestate; conclusion: the payout magnitude on an anvil fork of this migrated accrue path does not reproduce the mainnet payout at any reachable clock setting (measured this session); the success leg for promotion therefore rests on the paper/live mainnet-state simulations (a sim=ok with payout >= minProfit at mainnet head), and the positive-payout fork leg stays OPEN for the reviewer. Fresh-rate leg integrated 2026-11-08 run eeccd209 (this bot): bot.py now accrues with the fresh mantissa (observed mantissa x 184 = 8301660664, within 0.25 pct of the measured fresh 8322739013 at head 26371142; if keepers ever pass a mantissa >= 100x the stale 45117721 the multiplier drops to 1), executor unchanged (mantissa is calldata); startup fresh_probe logged at 17:24:50Z: base 45117721 param 8301660664 sim=revert NoProfit on mainnet head state - the expected correct revert while cETH totalReserves()==0 (lead 93 gate); the relay state-read empty incident 17:0x-17:2xZ (inbox/meta/2026-11-08-relay-state-reads-empty.md) blocked the reserves-gate re-read and any fork work this session. MANTISSA VALIDATION measured 2026-11-08T19:4x-19:5xZ (attempt 582, scratch/compound-mantissa-probe.py, scratch/compound-boundary-out.txt, scratch/compound-accrue-trace.json): accrueInterest(db006a75) soft-validates the caller mantissa against the supply rate derived from the accrue block's own state (bad mantissa returns code 9 without reverting: at head 26372294 mant 1000/57507717/57507718/57507719/1e8/2e9 all returned 9 while mant 0/1 returned 0 = accrued; the keeper mant 1e8 at block 26370275 validated only WITHIN its own block - at tag 26370274 the same 1e8 returns 9, the same-block utilization freshness is what makes a mantissa valid); the bot now passes supply_rate_mantissa() = model 15f24053(getCash(), totalBorrows(), totalReserves()) x utilizationShare/1e16, the exact quantities the accrue path itself reads (its STATICCALL input words and return 8322716640 in the keeper accrue trace), protocol-valid by construction for each attempted state (the review 19:05Z ask)