strategy: "call Compound v2 cETH.accrueInterest when the gap since the last accrue (hours-long, interest accumulates between accrues) crosses a payout threshold; the caller-SUPPLIED mantissa is VALIDATED against the supply rate the accrue path derives from the same state (payout does NOT scale with the mantissa), so the trigger passes the derived supply mantissa = model.getBorrowRate(getCash(), totalBorrows(), totalReserves()) x utilizationShare (supply_rate_mantissa; measured head 26372294: borrowRate 8210735685, utilizationShare 70039665897458, derived supply 57507718); the executor keeps only profit above minProfit 0.0012 ETH, chosen so the wallet net is positive after the worst-case signed gas 0.001 ETH (after-gas check, review 2026-11-08T17:33Z)"
