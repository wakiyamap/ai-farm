strategy: "trial: Torex (SuperBoring / Superfluid DCA) liquidity mover on Base - take the in super token at the TWAP minus the time-growing discount, swap it on Uniswap V3, return the out super token, keep the rest"
copied_from: "mover contracts 0x1e77916e3fed4a24dc4e37968587e2b71d3a9c06 (EOA 0x04a1f49b04489494e900596e8027a996f7ba2f5a through 0x1432960ca8007f57864582a43903f039483f0273, tx 0x0a733e7afe01077eeea6eef3a925375613c51d67677f5631b857c5a1a2071ac1) and 0x8b249337369f4190582c152c5b5910b97a4525bf (tx 0x9b34f566744070338fb0e63afa67c111ffcc5125caa31fbeabcf80186797d22d)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "TorexMover.sol run() (contracts/src/TorexMover.sol:63-78) reverts NoProfit unless the executor ends with at least minProfit (> 0) of the profit asset, which it pays to the owner as native ETH or USDC in the same transaction, so a lost attempt costs gas only. bot.py check() (bot.py:284-296) sends only when the simulated gross exceeds gasLimit x maxFee + 1.2 x L1 fee, sets minProfit to half the simulated gross, and bounds the send below 0.95 USD at 6000 USD per ETH (MAX_GAS 2.5M, MAX_FEE_WEI 0.06 gwei). Bids at most 10 pct of gross as priority fee (BID_SHARE, capped at 0.003 gwei)."
expected_value: "Trial. 24 h to block 60,336,669: 170 moves on 33 Torexes by two mover contracts; the five Torexes of this bot carry about 170 USD of volume a day and are taken at a median discount near 1.45 pct, about 0.02-0.045 USD gross a move, class gross about 3 USD a day (attempts:3281, README). Fork gas 1.93-2.06M = about 0.016-0.02 USD at 0.005 gwei, less than the incumbent's 2.65M through its automation contract, so the bot aims to take each round a little earlier: honest expectation 0.1-0.5 USD a day net, measured by sending."
executor: scratch/trial-torex-base/contracts/out/TorexMover.sol/TorexMover.json
executor_args: "{bot}"
executor_note: "Owner-only run(Route): Torex, SwapRouter02, WETH, profit token, token kinds, swap mode and V3 path are all call arguments; the callback accepts only the Torex set for the running call and cleared at its end; approvals are for the amount used and reset to 0; sweep(token) is owner-only dust recovery. Constructor arg = owner only."
fork_evidence: "scratch/trial-torex-base/proof.py (one lease: reset, deploy, fund, non-owner, guard, success per route, repeat). Reset base 60315659 (parent of incumbent move 0x9b34f566...), deployed 0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352: NotOwner 0xe622847b8032278a4dfd0bcd25a9669b5f8bbb0cd3f3c396cefbacd7c1979081; guard NoProfit 0x6872c06fc1b51c3cb7be9764efb0c3ff8f38effc2e6d4e9e05efae667b721725 (status 0, owner pays gas only); success USDCx-ETHx 0x0b755c1ad4beb3bfd66e34e7973ac77bc824b0c363d9dd07b8b0825b93a1a358 block 60315663 owner +0.0000187264 ETH before gas, 1,930,532 gas; SUP-ETHx 0x14d7e43ad60e4bfb2112778f0d529f0de201400971bee6a644c8f0a7d203faa9 +0.0000269556 ETH; ETHx-USDCx 0xb335493113376e412c1cc420ada56bbb4404e3ec2a4355e6932a9503394d17f1 owner +0.032844 USDC; SUP-USDCx 0x959890494fd6a52a21a40c496ed428e72c077c8b6ba158af387d7255a4c48b16 +0.009170 USDC; the same call again right after each success reverts (0x2e1e763a..., status 0). Reset 60313822 (second run, proof-result-60313822.json): USDCx-SUP exactOutput route 0x66c44e7a890cbdb8f6f496391f9dd7d0819b211c5538fb67dbc26266d92eb59e owner +0.024375 USDC, 1,958,711 gas. Results: scratch/trial-torex-base/proof-result-60315659.json, proof-result-60313822.json; head check of the bot's own paper path: scratch/trial-torex-base/selftest.py."
awaited_events: "Timer, no event: each Torex is looked at every 120 s (300 s for the two small ones) once 1500 s have passed since its last move; a Torex becomes takeable about 60-90 min after each move, around 16 times a day each. Last incumbent moves in the scan: block 60,315,660 and 60,315,788 (2026-11-21); at 10:50Z two routes simulated above the gas cap."
good_signs: "paper_sim success lines with gross above cap; live: send_result won, LiquidityMoved with the executor as mover, net positive after gas."
bad_signs: "Every send lost with winner_block before send_block (incumbents lowered their threshold); base fee above 0.01 gwei for long (gross never above cap); a Torex controller starts refusing movers."
rpc_reads_per_min: 2.5
alchemy_cu_per_day: 70000
legal_note: "Torex.moveLiquidity is the protocol's intended public mechanism: any liquidity mover may take the in-token at the benchmark price minus the discount (Torex whitepaper, verified source). No mempool watching, no reaction to pending transactions; a timer and a simulation against confirmed state."
