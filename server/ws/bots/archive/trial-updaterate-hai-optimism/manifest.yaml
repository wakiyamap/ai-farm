id: trial-updaterate-hai-optimism
author: earner/claude-mythos-5-2
chains: [optimism]
strategy: "trial: HAI OracleJob.workUpdateRate() on optimism pays 0.05 HAI (~0.062 USD) to anyone once per 3600 s PIDRateSetter cooldown; a timer send aimed at the first eligible block does the job, exits the internal-coin reward to HAI (CoinJoin), sells HAI->WETH on the UniV3 fee-3000 pool, unwraps and pays the wallet in ETH in one tx, reverting unless ETH out >= minProfit; cheap-chain trial per decision 2026-11-17-cheap-chain-trials (race rule and EV floor waived, win rate measured live); low fixed bid 0.01 gwei that wins the hours the high bidders skip"
copied_from: "direct EOA callers of OracleJob.workUpdateRate() 0x2d4fcc9d57d6e98b3c1e546a09bfdb9e5a3e1a57 (e.g. tx 0x62b47449c225250539921dc48029bc97fb3e492df8b1c81f715c5a5e825e3f45, block 159626748, priority 0.0001 gwei) and 0x9ab1daea841cb6c0c0ac716531f03d50a97b8497 (tx 0x138ca4d52906c2c4251034ba573a894dbd64d711b9c11f33ec62a87faf23e8eb, block 159624948, priority 0.0975 gwei)"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "executor act() bubbles the job revert when the rate was already updated or the cooldown has not passed (scratch/trial-updaterate-hai/contracts/src/HaiRateJobTrial.sol:49) and reverts NoProfit unless ETH out >= minProfit (HaiRateJobTrial.sol:77); the bot passes minProfit = signed gas cap + 1 (bot.py: min_profit = cap + 1), so a tx that is mined successfully always returns more than its own gas cap and a lost attempt costs gas only (fork: 37,383 gas = 4.2e-7 ETH ~ 0.0008 USD at the bid). Signed cap: gasLimit 600000 x maxFeePerGas <= 0.03 gwei (MAX_FEE_CEIL, bot.py) = 1.8e-5 ETH ~ 0.033 USD at ETH 1826, plus the OP L1 data fee (incumbent txs of the same call: 2.1e-9 to 1.6e-8 ETH, under 0.00003 USD; on OP the native wallet balance is the enforceable bound). Send condition in code (bot.py fees()/go): expected gross (reward x pool price x 0.997) > gas cap. Priority fee bid: 0.01 gwei fixed, never more than 15 percent of the expected gross (PRIO_MAX_SHARE; 440k gas x 0.01 gwei = 4.4e-6 ETH = 13 percent of 3.37e-5 ETH)"
expected_value: "trial bot: EV rule waived (decision 2026-11-17-cheap-chain-trials section 2), win rate measured live. Context, 7 d (scratch/hai-otherjobs-da0f/rate2-out.json): 168 rate updates, every one in the first eligible block (167/167 gaps = 3600 s), so 24 rewards/day x 0.05 HAI = 1.48 USD/day for the whole item. Last 24 windows: 7 won by 0x2d4fcc9d at priority 0.0001 gwei (the hours the two higher bidders 0x9ab1daea ~0.09-0.10 gwei and 0xd4a2f192 ~0.10-0.17 gwei did not send). A 0.01 gwei bid outbids only that low bidder: per win gross 3.37e-5 ETH (0.0615 USD) minus ~4.8e-6 ETH gas = ~0.052 USD net (fork: wallet +2.885e-5 ETH); per loss ~0.0008 USD. If the 7/24 pattern holds and our send lands in the first block: ~7 wins/day ~ +0.36 USD/day, 17 losses ~ -0.014 USD/day"
executor: scratch/trial-updaterate-hai/contracts/out/HaiRateJobTrial.sol/HaiRateJobTrial.json
executor_args: "{bot}"
executor_note: "constructor arg is {bot} only; job calldata, exit pool and minProfit are per-call arguments; OracleJob, CoinJoin, SAFEEngine, HAI and WETH are protocol-singleton constants pinned by eth_call in proof.py step 0 (job.stabilityFeeTreasury().coinJoin(), CoinJoin.systemCoin()/safeEngine()); the swap callback accepts only the pool that act() set for this tx and clears it at the end; SAFEEngine.approveSAFEModification(CoinJoin) is done inside act() the first time it is needed (no setup tx); nothing stays in the executor (fork: eth/HAI/WETH/internal coins all 0 after success). Paper sim: eth_call at relay latest with the block time overridden to the due time, from the fork-proof bot address, code override = eth_getCode of the fork deployment (executor-runtime.hex, sha256 6e7bc6fe68cebb9eebed79b6b812232bdf8de6fe73547ace6457b2e29737821b)"
fork_evidence: "scratch/trial-updaterate-hai/proof.py (one lease; reset optimism 159626745, 3 blocks before the mainnet take at 159626748; output scratch/trial-updaterate-hai/proof-out.json; executor 0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352, bot wallet = fresh code-less 0xda0fc135f62044819f3f6b47f54d7417000000b0). SUCCESS tx 0x49393e10119a030e0ffe929f470f77f21bb113f343301d6d225a0f1f7a043b56 status 1, gas 439,836, wallet delta +28,848,248,125,219 wei after gas (gross 33,686,444,125,219 wei = 0.0615 USD). Correct reverts, wallet delta = gas only: EARLY tx 0x648cded9590c65c4b65e1eb8ca1cc3a494294e3cc6b3012529941fa79db6c687 (block ts = due - 2, PIDRateSetter_RateSetterCooldown, 37,383 gas, -415,651,262,404 wei); GUARD tx 0x442778eb809ca686734a93ee0cdfaa9fc2a7228562d5bf01686352c3570dcef0 (due, minProfit 1 ETH, NoProfit after the full path, 512,530 gas); AGAIN tx 0x80f676771f52898a7ce7a04970509b3c482b3268183ccb307755f38d982e3c33 (already taken, cooldown revert); a stranger's call reverts NotBot (0xa03b20af)"
awaited_events: "no event: a timer. due = PIDRateSetter(0x1f76f20c9d9075dc160d0e47cd214df0b7434d2f).lastUpdateTime() + updateRateDelay (3600 s). Last taken 2026-11-16 18:04:33Z (block 159626748, tx 0x62b47449...); next 19:04:33Z and then every 3600 s (phase moves only if a window is taken late)"
good_signs: "every hour: next_window, window (send true, gross_est_wei ~3.4e13), sim_ok with profit_wei ~3.4e13, due_block_seen, then window_result naming the taker, taker_delay_s (0 = first block) and taker_prio_gwei; live: sent + receipt with landed_minus_due_s = 0 and window_result outcome win on hours where taker_prio would have been below 0.01 gwei"
bad_signs: "err lines; sim_revert at latest+time_override (path broken or reward/treasury changed); window with send false (gross fell under the gas cap); live: receipts with landed_minus_due_s < 0 repeatedly (timer too early, lead not adapting) or > 0 repeatedly (too late); signer rejections"
rpc_reads_per_min: 0.5
alchemy_cu_per_day: "per hourly window ~28 calls (2 state reads, <=5 safety re-reads, 3 quote reads, 1 sim, <=14 head polls in paper only, 1 getLogs, 3 taker tx/receipt/block) = ~670 calls/day x ~26 CU = ~18k CU/day = 0.010 USD at 0.53/1M CU; under the 100k CU/day trial cap"
legal_note: "public keeper reward that the protocol pays to any caller; competed for only by timing and a small priority fee; no mempool watching, no front-running of pending transactions, no bug use"
expedite: false
