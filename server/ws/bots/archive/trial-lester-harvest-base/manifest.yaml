id: trial-lester-harvest-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: call the public harvest(token) of the Lester Labs launchpad migrator on Base for its caller tip (a twentieth of the treasury's part of a graduated coin's pool-tax sale, paid in cbLTC), sell the tip to WETH on the Aerodrome CL pool, unwrap and pay the wallet in one transaction"
copied_from: "executor 0x3c93eb22fed586a83a9578bfa0246653d7258a36 (senders 0xc0ffee.., 41 takes in 7 days, e.g. tx 0xd533760a9a309d5023d5e7a727227edf473c1e03c6937fdec27d00f0aabcdf40) and the self-calling EOAs with selector 0x47b77d1a (81 takes, e.g. tx 0xcc8309d6ee5106eb02c425b0b8b46534e38000ef59b728efbb0a0d7953006890); paying contract UniV2Migrator 0x60070f76f885616d675305624497ed0797303434"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.9
max_loss_guarantee: "LesterHarvestTake.sol:56-93 is owner-only and reverts NoProfit unless at least minProfit native wei reach the wallet in the same transaction; bot.py:223 sets minProfit = gas cap + 1, so a send that lands either pays more than its gas cap or reverts and costs gas only. bot.py:202-216: gas limit = eth_estimateGas x 1.2 (refused above 900,000), maxFeePerGas = base fee x 1.25 + 2,500,000 wei (refused above 50,000,000 wei), cap = gasLimit x maxFeePerGas + 3e11 wei L1 allowance, refused at 0.90 USD at 4000 USD per ETH (the hard ceiling 900,000 x 5e7 + 3e11 wei is 0.18 USD at that price). Bid: a fixed priority fee of 0.0025 gwei, never raised; it sends only when the simulated gain is at least 1.5 x the cap (bot.py:220), so the bid is at most 25 pct of gross (2.25e12 wei of priority at the gas ceiling against a least gross of about 1.1e13 wei)."
expected_value: "Trial: send-measured win rate, no counted EV. Competition, 7 days to 2026-11-22 01:45Z (blocks 57,583,257-60,607,257, scratch/r2cb0/measure.py, harvests.json): 122 Harvested events on two coins (LESTER 72, NOTUS 50), tips 22,130,077 sat cbLTC = 8.75 USD = 1.25 USD a day for everyone, median tip 0.055 USD against 0.0061 USD median cost of one take. Two takers: the 0xc0ffee executor 0x3c93eb22 (41, almost only LESTER, tip median 83,849 sat) and one operator's single-use self-calling EOAs (81, almost only NOTUS, tip median 150,964 sat, priority fee always 0.002 gwei). The farm executor replayed before the last 24 takes had a gain above 0.020 USD 60 s earlier in 14, 5 minutes earlier in 13 and 30 minutes earlier in 11 (competition.json). The bot takes at 1.5 x its gas cap (about 0.018 USD at a 0.005 gwei base fee), below both rivals' usual level, and aims at most of the two coins' tips: 0.3-0.9 USD a day gross if the class keeps its volume (attempts:3550)."
executor: scratch/trial-lester-harvest-base/contracts/out/LesterHarvestTake.sol/LesterHarvestTake.json
executor_args: "{bot}"
executor_note: "Constructor takes only the bot owner. take(migrator, token, tipToken, pool, weth, minProfit): every target is a call argument. It calls the public harvest(token), sells the whole tip balance on the V3-style pool given (direction read from token0/token1, reverts BadPool if the pool is not tipToken/weth), unwraps the WETH gained, requires the native gain >= minProfit and pays everything to the owner. The swap callback accepts only the pool set for this call and cleared after it; no approvals at all (the callback pays by transfer). tipToken = 0 handles a native-quoted coin (tip arrives as ETH). No setup transaction."
fork_evidence: "scratch/trial-lester-harvest-base/proof.py (one Base fork lease, reset to 60,442,920 = parent of the NOTUS harvest tx 0xcc8309d6..., deploy the artifact with --args, fund the owner; proof-result.json, fork generation 1270, executor 0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352). Guard: take(NOTUS, minProfit 1 ether) reverts NoProfit 0xe39aafee, tx 0x5353e30d157ab5fb0eca46763d662bb31aff9599d710fa50b9761dfac68f30bc (block 60,442,922, 650,997 gas, wallet -3.24e12 wei). Nothing to take: take(LESTER, 1) reverts HarvestCooldown 0x2edd9b49, tx 0x199693c3325f3b337dd6ef88cc4f5a110845de44322f14f2ee6b11e8dc6c9b5e (44,310 gas). Success: take(NOTUS, 1) tx 0x40116ac824888116011c8356293e01c7cc108d95416663f2e57f105aeb7aaf46 (block 60,442,924, 527,728 gas): wallet +26,016,539,642,127 wei after 2,604,848,520,704 wei of gas (gross 28,621,388,162,831 wei; the real caller got 120,862 sat cbLTC in that block). Again inside the cooldown: revert 0x2edd9b49, tx 0x8659b4f00abcc48dfdd985f6a0f53a26ac78f700a66bba2c2a8132f2c94502a9. Executor balances after the success: native 0, WETH 0, cbLTC 0, NOTUS 0. Paper override = eth_getCode of that deployment (executor-runtime.hex); selftest.py runs the bot's check() pinned to the parent blocks of two past harvests (paper_sim success on NOTUS and LESTER)."
awaited_events: "No event: a 120 s timer simulates take() for each of the two coins and sends when the gain is at least 1.5 x the gas cap. Last harvests: NOTUS block 60,523,977 (2026-11-21 21:06:11Z), LESTER block 60,442,823 (2026-11-21 16:35:40Z; both from the timestamp of the block 64 before, plus 12.8 s). At 2026-11-22 01:46Z the NOTUS tip was about 2.4e12 wei (below the line) and the LESTER buckets were empty; the next take comes when pool trading has refilled a bucket: median 86 minutes between harvests of one coin over 7 days, 11-25 harvests a day."
good_signs: "paper_sim success lines a few times a day; in live, send_result won with paid_wei above gas_cost_wei; rivals' Harvested logs becoming rarer on the two coins."
bad_signs: "send_result lost with HarvestCooldown repeatedly (a rival taking at a lower tip in the same seconds); days with no opportunity line (the coins stopped trading); check_error or read_budget lines; the launchpad announcing a freeze (FreezeAnnounced) or replacing the migrator (setMigrator)."
rpc_reads_per_min: 1
alchemy_cu_per_day: 38000
legal_note: "A caller tip the verified contract documents for anyone ('a twentieth of the treasury's part to the caller'). No mempool watching, no reaction to pending transactions, no trade around the harvest: the bot only calls harvest and sells its own tip. A fixed small priority fee for a public reward."
expedite: false
