id: trial-ichi-vault-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: ICHI vaults on Base (Hydrex and Trebleswap pools; WETH, USDC, cbBTC), deposit / withdraw pricing versus another pool. Each vault takes single-sided deposits at its own pool's price (spot / TWAP) and pays withdrawals pro-rata in both tokens. When the vault's other token is dearer on a PancakeSwap V3 or Slipstream-style pool, one tx flash-borrows the deposit token on Morpho Blue, deposits, withdraws the shares at once, closes on that pool (exact-in sale of the other token, or exact-out purchase of the deposit-token shortfall), repays, and pays the gain to the bot wallet as native ETH (WETH unwrapped) or USDC, or reverts. The bot polls one eth_call of the executor's scan() (37 candidates: sizes x 10 routes on 8 vaults) every 27 s."
copied_from: "One operator: 87 EOAs with the vanity prefix 0xc0ffee sending through 38 contracts, payout to 0xc0ffeefeed8b9d271445cf5d1d24d74d2ca4235e. Traced takes (scratch/ichi-f22b/trace-*.json): 0x69da87f3e3a75ebee521dc271f585cda4ef5e1aaf31ab8f84061e4b78306c535 (block 57,504,774, contract 0x814a4d9df01d8bf608db743a4d382b1a070e4a4b, vault 0x558684fd, flash 0.9875 cbBTC, exact-out on 0x7c7420dd, +0.000474981 WETH, 735,044 gas); 0x8c8f4d76df187ca43a1a117ef888251028403bb6c0834e727b129ade4bb65185 (block 58,066,552, contract 0xe3a659821b229d66d1ce53892f653cec73152911, vault 0x07e72e46, flash 3,739.8 WETH, USDC sold on PancakeSwap V3 0x72ab388e, +0.000568193 WETH, 671,495 gas); 0x742263a5ee4cf1a26465554bb813e2be0fe4dfa370697ce5898a9146164af2c2 (vault 0x0c9be6df, flash 8.37M USDC, exact-out); 0x2b60bc8e4130da70b1c6c3c8da307c772588fc2f0105e2b5e90e4761dcc9be9e (vault 0x5febc3c9, cbBTC sold on PancakeSwap V3 0xb94b2233); 0xe9951d7e3f5d840b2e1c0984ca22bdd53c5bf6672c9deca4430d63e0ecf7d58c (vault 0xcf27dd90, cbBTC sold on PancakeSwap V3 0xc211e1f8). Same vaults, lender and pools, same call order (Morpho flashLoan, vault.deposit, vault.withdraw, one pool swap); changed: size chosen by simulation from fixed sizes, the USDC / cbBTC vaults keep the gain in USDC without a second swap, one contract for all vaults. Sibling of the farm's trial-ichi-vault-hyperevm and trial-ichi-vault2-hyperevm (Nest vaults on HyperEVM)."
capital_usd: 18
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor IchiVaultArb3.run requires profit > 0 and profit >= minProfit in the profit token after the flash loan is repaid (scratch/trial-ichi-vault-base/contracts/src/IchiVaultArb3.sol:76; a losing route already fails at Morpho's repayment pull) and a deadline (:73), so a lost attempt costs gas only. Gas cap per send in bot.py evaluate() (constants GAS_LIMIT_MAX to GAIN_OVER_CAP): gas limit = eth_estimateGas x 1.25 (at most 2,500,000); maxFeePerGas = base fee x 1.3 + bid, never above fee_ceiling = (0.95 USD - L1 fee bound) / (gas limit x ETH price), ETH valued at the PancakeSwap V3 WETH/USDC pool price x 1.15, L1 data fee from GasPriceOracle.getL1FeeUpperBound(500 bytes); no send unless the simulated gain is at least 1.2 x (gas limit x maxFeePerGas + L1 fee bound) (GAIN_OVER_CAP); minProfit is that gas cap (wei + 1 for a native payout, the same value in USDC units + 1 for a USDC payout), so a mined success always ends with more value than it spent. Priority-fee bid: at most 35 pct of simulated gross (BID_SHARE), never above the fee ceiling. On Base the wallet holds at most 18 USD of native (gas_wallet_cap_usd), principal is flash-loaned."
expected_value: "trial, win rate to be measured live. Competition, 7 days, blocks 57,060,715-60,084,715 to 2026-11-20 20:45Z (scratch/ichi-f22b/measure-base.json; gains are floors, ETH at 1,597 USD): on the 8 covered vaults 473 same-transaction round trips = 67 a day, gain 0.02608 WETH = 41.6 USD, median 0.0000127 WETH (0.02 USD); 161 takes of 0.00002 WETH or more sum 0.02365 WETH = 37.8 USD, fee share of gross median 11.6 pct, gas price median 0.0083 gwei (base fee about 0.006), 106 of 161 at tx index 10 or later; 20 takes of 0.0002 WETH or more sum 0.01474 WETH = 23.5 USD, gas price median 0.029 gwei, tx index 2 to 142. All takes are one operator (87 EOAs prefixed 0xc0ffee, 38 contracts, one payout address); it bids little (most takes at the base fee, far from the top of the block). The bot polls every 27 s, so it sees a gap on average 13 s after it opens; both fork-proven gaps were already open at the parent block of the incumbent's take, how long before is not measured. Aim: gaps of 0.00002 ETH or more that are still open at a poll, a few sends a day, share unknown. One lost attempt: 0.76-0.96M gas at 0.006-0.05 gwei = 0.007-0.08 USD."
executor: scratch/trial-ichi-vault-base/contracts/out/IchiVaultArb3.sol/IchiVaultArb3.json
executor_args: "{bot}"
executor_note: "Deploy gas 1,247,823 on the fork. constructor(address bot) only (owner is immutable); Morpho, deposit token, size, vault, closing pool, direction, exact-in / exact-out, profit token, limits and the unwrap flag are Params call arguments, so every vault goes through the one deployment. The Morpho callback and the swap callbacks (uniswapV3SwapCallback, algebraSwapCallback, pancakeV3SwapCallback) accept only the counterparty set for this step of this transaction; it is cleared at the end. receive() accepts native only from the wrapped token during the unwrap of this transaction. Approvals are for the exact amount (vault: reset to zero after the deposit; Morpho: used up by its repayment pull; both read 0 after the fork successes). scan() is an owner-only eth_call helper that rolls every candidate back (probe() always reverts with the result). Payout: a WETH gain is unwrapped (WETH.withdraw of the whole balance) and sent to the owner as native; a USDC gain is transferred to the owner; nothing stays in the executor after the fork successes. The bot only configures routes whose profit token is WETH or USDC. Same source as the trial-ichi-vault2-hyperevm executor with the hop list replaced by one pool plus the exact-out mode and a separate profit token."
fork_evidence: "scratch/trial-ichi-vault-base/proof.py (one script: lease, reset, deploy, pool token check, scan, guards, success, release; no fixture, no setCode; owner 0x1111111111111111111111111111111111111111, executor 0x8f7a45ebde059392e46a46dcc14ab24681a961ea). (1) exact-out, `proof.py 57504773` -> proof.json: reset 57,504,773 = parent of incumbent tx 0x69da87f3e3a75ebee521dc271f585cda4ef5e1aaf31ab8f84061e4b78306c535 (block 57,504,774, index 20, +0.000474981 WETH). Deploy 0x6b5a9f3a1d0aef3028e2391c5d35a8f7e5aa9e8c87b032d049ad7ec1a198476d (1,247,823 gas). scan() before: vault 0x558684fd closing on 0x7c7420dd at 0.1 / 0.5 / 0.9875 cbBTC = 0.0000916 / 0.000349 / 0.000475 WETH, closing on PancakeSwap V3 0xc211e1f8 = 0.0000377 / 0.0000445 / 0. SUCCESS 0x2067c213c152d333af8df213568c2711467f722581738d5c8df9fe6998a42fdb (fork block 57,504,777, 809,776 gas, 0.9875 cbBTC): owner native +0.000474923 ETH before gas (the fork charges 1 gwei, so after the fork's gas fee -0.000341; on mainnet at 0.006-0.05 gwei the gas is 0.000005-0.00004 ETH), executor holds 0 native / WETH / USDC / cbBTC / shares, allowances 0. Reverts: nothing left 0xd3ee7ef54f122dad41b09f2b50d9968b43a73c67d8d8693928257ff333846a95 (918,437 gas), minProfit x 1000 0x531704f82d0d2f75c62d7a8ecc0a06e3659548c813c1d7b601f1d3e99d53fc79 (974,671 gas), non-owner 0x958facd5ec69989bd12684bf894e555f47c236bba45c74b7fec3402e7bb030c7. (2) exact-in, `proof.py 58066551` -> kept as proof-exactin.json (run with 8 routes, before the two 0x7c7420dd routes were added): reset 58,066,551 = parent of incumbent tx 0x8c8f4d76df187ca43a1a117ef888251028403bb6c0834e727b129ade4bb65185 (block 58,066,552, index 2, +0.000568193 WETH). scan() before: vault 0x07e72e46 at 30 / 300 / 1,200 / 3,700 WETH = 0.000367 / 0.000541 / 0.000563 / 0.000568 WETH. SUCCESS 0xe9cce33fcaa7e80139d0a68a6c45d408e0af4a3cfd32f7f6ee93460abc70ea78 (fork block 58,066,555, 757,573 gas, 3,700 WETH): owner native +0.000568164 ETH before gas, executor empty, allowances 0. Reverts: nothing left 0x1f7d4a0938988f294dcefc05f3a087aaffa0bc037240d0f4fdf4cb8f3d1acc40 (858,995 gas), minProfit x 1000 0x249b915baa6bcab7b10dfea2aaa31b1c682e8fbc2786ca4bb83f3653bc2ac1a7, non-owner 0x3c4dd31a0c13bfbedac2d81ed09770c106f161d9e2ff031dc4aa2b9d62aa3145. (3) USDC payout, `proof.py 58428522` -> kept as proof-usdc.json: reset 58,428,522 = parent of incumbent tx 0x2b60bc8e4130da70b1c6c3c8da307c772588fc2f0105e2b5e90e4761dcc9be9e (block 58,428,523, index 5, +0.000348705 WETH after its second swap). SUCCESS 0xfd4b45958a69cbd5a5a858bbbd6c7d6044699e9345f263d6625c14818efa8b54 (fork block 58,428,526, 790,548 gas, vault 0x5febc3c9, 8,000,000 USDC flash, cbBTC sold on PancakeSwap V3 0xb94b2233): owner USDC +0.576641, owner native changes by the gas fee only, executor empty, allowances 0. Reverts: nothing left 0x951be7060bedb278f043d5343c12f59618e882b9afb8dd01239918d234d44aab, minProfit x 1000 0xc42876dcda975fec313636ffc35ffc1c2c52bff3df9bb73e0640575f22dd4bdf, non-owner 0x56123c1c2891f46bdd047db3193225f76c7e3cd7ffefa223a5ee56478018d265. The exact-out USDC route (vault 0x25154c35) has no fork success of its own; its two parts (exact-out, USDC payout) are each proven above.selftest.py (selftest-result.json, block 60,088,899): the bot's hand encoder equals cast's bytes for run() on all 37 candidates and for scan(), selectors equal cast sig, the paper runtime equals the artifact runtime with the owner filled in; through the relay with the code override scan() answered for all 37 candidates in 0.41 s (only dust open: 0.00035 USDC on 0x25154c35), owner() answers, evaluate() on fake gains ends in simulate_revert at the exact-bytes check ('transferFrom reverted' = the route ran and lost at Morpho's repayment) for a WETH and a USDC route. Paper runtime = eth_getCode of the fork deployment (runtime.hex)."
awaited_events: "No single event: a gap opens when swaps move the vault's own pool (Hydrex 0x82dbe183 WETH/USDC, 0x3f9b863e WETH/cbBTC, 0x0ba69825 USDC/cbBTC, Trebleswap 0x82e4c6da WETH/USDC) away from the closing pools (0x72ab388e, 0xc211e1f8, 0x7c7420dd, 0xb94b2233); all are busy pools, so no feed filter. The bot polls scan() every 27 s and acts when the best candidate's gain exceeds 1.2 x its gas cap. Last taken by others: 2026-11-20 about 19:30Z (block 60,062,847, vault 0x558684fd); 67 round trips a day on the covered vaults over 7 days. The next one is expected within the hour."
good_signs: "logs/bot.jsonl: a poll heartbeat every 18 min; opportunity_skip or opportunity + paper_sim rows several times a day; live: send_result rows with result won and gas_used about 750k-820k."
bad_signs: "loop_error on every poll (a vault or pool changed, or the node stopped accepting the code override); read_budget before 23:00Z; no opportunity or opportunity_skip row for 2 days while others still round-trip the vaults (the bot's sizes or routes no longer fit, or every gap closes inside 27 s); live send_result lost on every send with blocks_after_winner >= 0 (always late: report as blocks late)."
rpc_reads_per_min: "2.2 (one eth_call per 27 s) plus about 6 reads per evaluated gap"
alchemy_cu_per_day: "about 84,000-98,000 (0.045-0.052 USD): 3,200 scan polls x 26 CU = 83,200, 96 price reads x 26 = 2,500, plus about 140 CU per evaluated gap; hard cap 98,000 relay CU/day in code, then it sleeps to 00:00 UTC. No feed filter."
legal_note: "Same class as trial-ichi-vault-hyperevm, allowed by the human decision decisions/human/2026-11-21-ichi-yes-peapods-fee-no.md section 1: arbitrage between the vault's public deposit / withdraw pricing and the pool price, not an attack on the vault's accounting (that decision names the Nest vaults on HyperEVM; these are the same ICHIVault contract on Base, the reviewer may want to confirm the class carries over). deposit and withdraw are the vaults' public functions, the pools and Morpho's flash loan are public. The bot reads mined state only, watches no mempool and no pending transactions; it may bid a priority fee for a public opportunity. It never swaps on a vault's own pool, so it does not move the price the vault reads."
