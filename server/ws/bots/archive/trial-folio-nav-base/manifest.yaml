id: trial-folio-nav-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: Reserve Folio LCAP redeem round trip on Base (flash WETH, WETH to USDC to LCAP in its Slipstream pool, Folio.redeem for the basket, sell the six non-WETH basket tokens for WETH), one atomic executor call"
copied_from: "Executor 0xb52603cef75de7538e42ee764a775d5e707ce528 on Base (1,539 Folio mint / redeem arbitrage txs in 7 days, driven by EOAs 0x4cbf9040c1c74c741b490790bfa237bf85063580, 0x85bc7f301d88e4dd51c8d82b90def8afb54484b9, 0xf911032acf745e8cd09a837a07a89231d2130bdd and others), e.g. LCAP redeem takes 0x895704c4280abd35dfc6fe1f1e7a30d3a5821a4508f1695d0ebd71a82eb14ff8 (block 59,118,274, 0.109 USDC to the sender) and 0xe52a9a05c6ed7da4d92142b6b330de579a1d1078e77b4fd065f71b7678fd92ad (block 59,614,465, traced: scratch/ic-76eb/trace-0xe52a9a05.json)"
capital_usd: 0.75
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Enforceable bound per send: Base charges the L1 data fee and the operator fee at inclusion and no signed field bounds them, so the worst case of one send is the bot wallet's native balance, and that balance is kept under 1 USD. (1) Funding: capital_usd 0.75, all native, no top-up. (2) Code: bot.py:341-356, live branch of take(): right before the signer call it reads ETH/USD (eth_usd(), bot.py:226, slot0 of the Uniswap V3 WETH/USDC 0.01 pct pool, refused outside 300-20,000) and the wallet's eth_getBalance, and wallet_bound() (bot.py:236) refuses the send while balance x price is 0.95 USD or more (WALLET_MAX_USD, bot.py:84); it logs opportunity_skip and never signs. Inside that bound a lost attempt costs gas only: FolioNavTake.sol:60-68 run() is owner-only and reverts NoProfit (line 63) unless the executor's WETH balance grew by minProfit after the Balancer flash loan was repaid (minProfit 0 is refused), then unwraps the gain and pays the bot wallet native ETH; no principal leaves the wallet. Expected cost, not the bound: bot.py:299-361 take(): gas limit = eth_estimateGas x 1.20 + 100,000 (line 317, refused above 3.2m), tip = min(0.05 gwei, 20 pct of the simulated gross / gas limit), at least 0.0001 gwei (line 318), maxFeePerGas = latest base fee x 1.05 + tip (refused above 0.1 gwei), cap = gasLimit x maxFeePerGas + 1e11 wei L1 allowance (line 320), sent only if the simulated gain is above the cap (line 330) with minProfit = cap + 1 (line 322) and the exact guarded call simulated at the signed gas limit; refused when the cap is 0.90 USD or more at a 4,000 USD/ETH reference (line 326); typical cap 1.5e13-1.8e13 wei = 0.03 USD. Priority fee bid: at most 20 pct of gross (tip x gas limit), passed explicitly to the signer (line 262)."
expected_value: "Trial: send-measured win rate; expected to be low, stated plainly. Competition, 7 days to block 59,763,092 (scratch/ic-76eb/folio.py, folio-base.json): 1,806 Folio mint / redeem txs on Base, 1,035 on LCAP (461 redeems = about 66 a day); executor 0xb52603ce does 1,539 of all, three smaller operators (0x7b03b0fa, 0x90bfa62b, 0xf7c70a04) about 120. 154 sampled takes of 0xb52603ce (scratch/ic-76eb/folio_gain.py): gross median 0.043 USD, p90 0.115, max 3.69; gas median 0.031 USD; net median 0.012 USD. Priority fee on 42 sampled LCAP redeems 0.0054-0.0159 gwei (median 0.0061), tx index 4-195 (median 38). Blocks to take, this bot's route probed with a code override before each of those 42 takes (scratch/trial-folio-nav-base/series.py, series-windows.json): gain visible at the parent block for 16 (above 1e13 wei for 5), 1 s before for 11 (3), 3 s before for 5 (0), 10 s before for 4 (0), 30 s before for 2 (0). The bot aims at the roughly 1 in 10 redeem takes whose gap is above its gas cap and stands a second or more: a few sends a week, most of them expected lost; a win pays 0.005-0.02 USD net (rarely more). Paid entries in the last 7 days whose gross exceeds one attempt's gas: 0x895704c4... (0.109 USDC) and most of the sampled takes."
executor: scratch/trial-folio-nav-base/contracts/out/FolioNavTake.sol/FolioNavTake.json
executor_args: "{bot}"
executor_note: "Adapted from the reviewed PodArbTake executor of trial-peapods-arb-base (same flash, probe, profit check and strict cleanup), compiled in this bot's own scratch directory. Constructor takes only the bot owner. run(vault, weth, amount, steps, minProfit): the flash lender, the flash token, every pool and the Folio are call arguments (a step list: 0 = UniV3-style pool swap, 1 = Folio redeem), each step spends the executor's whole balance of its input token; a redeem reads the basket from Folio.totalAssets() and burns the whole share balance with zero minimums (the profit check at the end is the guard). probe(vault, weth, amount, routes) is for eth_call only: owner-only, it tries each route through trial(), which always reverts (Trial(gain) or the underlying error), so nothing changes and nothing is paid even if it were sent. The Balancer callback and the swap callbacks (uniswapV3SwapCallback for Uniswap V3 / Aerodrome Slipstream style pools, pancakeV3SwapCallback for PancakeSwap V3 pools) check msg.sender against the lender / pool set for this call and cleared after it. No approvals are given at all (pools are paid by transfer in the callback). No setup tx. After the profit check run() clears the executor: _clear() sends any leftover of each swap's input token, of the Folio share and of every basket token to the owner and reverts Leftover(token) when a balance cannot be read, when the transfer fails or returns false, or when anything is still held after it. Live code reads EXECUTOR_ADDR_BASE or EXECUTOR_ADDR only; paper mode uses an eth_call / eth_estimateGas code override taken with eth_getCode from the Base fork deployment (executor-runtime.hex)."
fork_evidence: "scratch/trial-folio-nav-base/proof.py 59118273 proof-result-59118273.json (one Base fork lease: reset to block 59,118,273 = parent of incumbent take 0x895704c4..., deploy the artifact with --args, fund the owner, non-owner, guard, success, repeat; run 2026-11-20 about 02:57Z). probe() from the owner answers, from a stranger it reverts. Sweep by eth_call: 0.02 WETH +1.370e13 wei, 0.05 WETH +2.093e13 wei, 0.1 WETH and more revert. Non-owner run revert NotOwner 0x2bacffa701fae2f65ee107b42730bd158c855ad72826bbc1df5ff38d8ec73156 (block 59,118,275). Guard revert NoProfit (minProfit 1 ETH, the revert data carries gain 2.10e13) 0x65a5ed00985a4627e030cf6562dffacd6b32c19692406f7313904290d917b9fc, block 59,118,276, 1,820,931 gas, owner -0.000182118 ETH (gas only, at the fork's 0.1 gwei). Success at 0.05 WETH 0xdaafdd1e82cb4d1186483cef0fe0f038bb87c67fee37ed422c059a92258caf9e, block 59,118,277, 1,518,197 gas, gross +0.00002099 ETH paid to the owner as native (owner -0.000130829 ETH net at the fork's 0.1 gwei gas price; at the live 0.0066 gwei the same gas costs about 0.00001 ETH, net about +0.00001 ETH; the bot only sends when the gain is above its signed cap). Right after the success the executor's native balance, its balances of WETH, USDC, LCAP, cbBTC, cbXRP, cbADA, SOL, cbDOGE, HYPE and its allowances of those 9 tokens to the 9 step targets and the vault were read with no skipped read: all zero; the owner holds none of those tokens (nothing was swept as dust). The same call repeated right after reverts (0x3198f7eeb1c4da3311f4a64c49b35c07216e32b643e15c0ca8e7b04c62070986) and every size reverts in the sweep after it. The bot's own check() replayed through the relay (scratch/trial-folio-nav-base/selftest.py, which first checks both hand ABI encodings against cast): paper_sim success at 59,118,273 (0.04 WETH, gross 2.05e13 wei, cap 1.74e13), nothing_to_take at 59,115,273 (control, 10 minutes earlier), opportunity_skip gross_below_gas_cap at 59,614,384 (gross 1.52e13, cap 1.53e13) (selftest-*.jsonl)."
awaited_events: "A 30 s timer plus feed /logs/base on the LCAP/USDC pool 0xc8c15670050541255f9b797c008047682524861f, topic0 Swap 0xc42079f94a6350d7e6235f29174924f928cc2ac818eb64fed8004e115fbcca67 (about 150-200 logs a day): each triggers one probe() eth_call. On gap, 429, 503 or timeout the timer keeps re-reading state. Basket-side price moves have no single event, hence the timer. Last incumbent LCAP redeem sampled: block 59,614,465 (2026-11-19); about 66 redeem takes a day. Next: any time."
good_signs: "opportunity and paper_sim rows with gross_wei above gas_cap_wei; live send_result won with positive net_wei."
bad_signs: "opportunity_skip wallet_at_or_above_usd_bound or wallet_below_gas_cap (the 0.75 USD is spent: the trial is over), eth_usd_unreadable; only check rows with nothing_to_take for a week (the incumbent leaves nothing standing); every send lost with blocks_after_winner of 5 or more; repeated simulate_revert or estimate_revert; read_budget rows; loop_error rows from probe (a basket change: Folio.totalAssets() gained a token the route does not sell, the take then reverts NoProfit or Leftover is swept to the owner, so re-read the basket and add its pool)."
rpc_reads_per_min: "2 on the timer (one probe() eth_call every 30 s), plus one per LCAP/USDC pool swap from the feed (about 0.15 a minute); a gain adds 1 eth_getBlockByNumber, up to 4 eth_call, 1 eth_estimateGas, 1 guarded eth_call, 1 slot0 eth_call and (live) 1 eth_getBalance."
alchemy_cu_per_day: "Timer 2,880 x 26 = 74,880 CU; feed-triggered probes about 200 x 26 = 5,200 CU; sweeps about 200 CU each; about 81,000 CU per day (0.043 USD at 0.53 USD per million CU), code cap 93,000 relay CU per day. Feed: one filter, under 2,000 CU per day."
legal_note: "Folio.redeem is the public redemption entry of a Reserve index token and the swaps are ordinary pool trades: the arbitrage the protocol relies on to keep the share price at its basket value. The bot reads confirmed state only, watches no pending transactions, and bids a priority fee only for its own public arbitrage; it moves no price for others to trade against."
