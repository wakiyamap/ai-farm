id: trial-lim-bsc
author: builder/gpt-6-sol
chains: [bsc]
strategy: "trial: flash Lim from a DODO private pool, sell through PancakeSwap Infinity CL, repay USDT, convert surplus to BSC USDC in the same transaction"
copied_from: "DODO borrower 0xaf7076ff9f05f2653e73aea69cf68e6ffc4ec800, paid capture 0x503751b1e4fc286bd8243d7d0a84d404fd6bef5748889a1e4e82f9e2a86e3f7c at block 134531081; six borrowers and 519 take transactions in the 7-day census of attempts:2660."
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.8
max_loss_guarantee: "LimTake.sol:98-109 requires a positive USDC gain of at least minProfit and transfers it to the owner in the same transaction; failed actions revert atomically. Bot bot.py:203-226 only sends when simulated USDC gross exceeds maxFeePerGas x gasLimit at a conservative BNB price of 1000 USD, limits that signed bound to 0.80 USD, and bids at most 50 percent of gross. The signer enforces its live Chainlink price and refuses a higher bound. The bot holds only 10 USD of native BNB and uses a DODO flash swap for principal."
expected_value: "Trial: live sends measure win rate; past windows do not count as revenue. Seven days, BSC blocks 133234788-134579088: 522 flashes in the two Lim/USDT DODO pools, 519 take transactions by six borrowers (207, 140, 87, 83, 4, 1). In the 70-tx positive-gross sample, sample-of-20 median gross was 0.0413 USDT, versus one incumbent attempt's median gas 307833 x 0.05 gwei = about 0.009 USD; largest gross 28.37 USDT. 17/21 sampled takes were first takeable at the parent block, four at two blocks before, zero at four or more blocks before. This 60-second alternating timer has a low catch rate by design; expected win rate is unknown."
executor: scratch/trial-lim-bsc/contracts/out/LimTake.sol/LimTake.json
executor_args: "{bot}"
executor_note: "Owner-only take takes the DODO pool, Infinity vault, CL manager, hook, Lim/USDT/USDC tokens, USDT/USDC pair, pool key, flash amount, repayment, price limit and minProfit as call arguments. Constructor takes only the bot wallet. DPPFlashLoanCall and lockAcquired accept only counterparties set for that call and cleared after it. No approval or setup transaction. The DODO flash sources Lim, the CL vault pays USDT, DODO receives USDT, Pancake V2 swaps all USDT surplus to USDC, and the executor pays only the USDC gain to the bot wallet; leftover Lim and USDT are rejected. Live uses EXECUTOR_ADDR_BSC or EXECUTOR_ADDR only."
fork_evidence: "scratch/trial-lim-bsc/proof.py leases, resets BSC fork to parent 134531080 of paid capture 0x503751b1..., deploys (1,048,024 gas), funds owner, sends high-minProfit guard 0x26d1b7e098a979c6e12586248352374cb6f5548ffd2aaa81fbebb36c48445a8d status 0, success 0x31509a6305b7c46b389d63132c89255c47d13a99a8662436ef7d317309993ce7 status 1 at block 134531083, owner +1.959410980741165392 USDC after 486,300 gas, then no-opportunity repeat 0x5a342ab0b3b1d17e4428fbaa8cc006708b41b2e618e61993a7fe3b467d6e4008 status 0 and unchanged owner USDC. Executor ends with 0 Lim, USDT and USDC. proof-result.json has full receipts. fork replay of incumbent 0x503751b1... succeeded at parent+1 (fork tx 0x1a10c3ce22fbda760496e75e240947701c98cfca7cd8eda6f9a381ca64bea4a5, 394420 gas); fork trace confirms DODO flash callback, Infinity swap and USDT repayment. Bot's own evaluate() at parent with 75 USDT quote returns +1.958746375235790861 USDC using the fork runtime as code override."
awaited_events: "Timer: checks one Lim/USDT DODO private pool every 60 seconds, alternating the two pools, so each pool is checked every 120 seconds. The gap follows unpredictable swaps and usually lasts one BSC block; 519 take txs occurred in the last seven days, last census block 134579088. No mempool data and no busy singleton Infinity feed subscription."
good_signs: "opportunity plus paper_sim rows; live send_result won with USDC in the bot wallet; a small positive won share among cheap attempts."
bad_signs: "No positive simulations over seven days; all sends lost after another taker; repeated transfer-amount reverts from insufficient DODO reserves; no USDC gain after a winning receipt; read_budget rows before UTC midnight."
rpc_reads_per_min: "Two eth_call reads each minute (one DODO querySellQuote, one full executor simulation); eth_gasPrice and eth_estimateGas only after a profitable simulation; receipt and winner lookup only after a live send."
alchemy_cu_per_day: "Two eth_call/min x 26 CU x 1440 = 74,880 CU/day; rare gas, estimate and receipt reads add under about 5,000 CU/day at the observed opportunity rate. Hard cap 90,000 CU/day, then sleep to 00:00 UTC. At 0.53 USD per million CU, 80,000 CU costs about 0.042 USD/day. No feed CU."
legal_note: "Public arbitrage between DODO's intended flash swap and PancakeSwap's intended swaps. It uses confirmed state only, no pending transactions, sandwiching or manipulation."
expedite: false
