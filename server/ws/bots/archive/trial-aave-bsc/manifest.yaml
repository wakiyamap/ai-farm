id: trial-aave-bsc
author: builder/claude-mythos-5-2
chains: [bsc]
strategy: "trial: Aave-flash-funded Aave v3 BNB Smart Chain liquidation (USDC, USDT or WBNB debt; BTCB, WBNB, ETH, USDT or USDC collateral), after a confirmed LiquidationCall on the feed or a 60 s near-HF scan"
copied_from: "Public Aave v3 BSC takers: 0xb53455e5e30419f220bbd89dd0058acf6b03901e in tx 0xc5fb2d24e4033f18dd8164c74c80a9f346782531e92fd68dc68afbd54c28a4e0 (block 133299656, fork-proof case A), 0xec5bcf2077ccb42074f5bf667acb211c9ccc60c0 in tx 0xe2faf7471ba0f83d746412c6520b88d1b3efbd87a8bf6b359ffd6cc436a31e60 (same block, case B), 0x5ac9bc14376bf2727c6211960cf3cec1e2f295bd in tx 0xda276a5def6cca11e4ac55709247a73b42baf0abe18caf06244fe16914a2a6e8"
capital_usd: 12
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialAaveBscLiquidator.sol:84 reverts NoProfit unless the pay-token balance (USDC, or WBNB for WBNB debt) grew by at least minProfit, and :86-95 pays the whole gain to the bot (USDC, or native BNB) in the same tx, so a lost attempt costs gas only. bot.py:344-348 sets the gas price so gasPrice x gasLimit < 0.90 USD (never above 3 gwei, gas limit never above 3,000,000) and requires simulated gross > that signed gas cap, and :353 sets on-chain minProfit to the gas cap. The gas price bid is at most 50% of the simulated gross (BID_SHARE, bot.py:345), or the network gas price (0.05 gwei floor) when that is higher, and the send still needs gross > gas cap. No principal: the cover is an Aave flashLoanSimple repaid with its premium in the tx; the bot wallet holds gas only (12 USD of BNB)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7 d to 2026-11-17 (blocks 132801220-134145220, scratch/trial-aave-bsc/liq-rows.json): 127 LiquidationCall events, 17 liquidator contracts (0x5ac9bc14 37, 0x0ff94b69 12, 0xb3c3f9b1 9, 0xf000042d 9, two dust-batch takers 20 and 11, others 1-6). 91 events have a cover above 5 USD (up to 96,426 USDT; debt USDT or USDC in all but 2). 84 of the 91 flipped inside the capture block; 7 were under water at the parent block (0.45 s) and 4 of those 2 blocks before (parent-hf.json). Winner gas price (tips.json): median 0.1 gwei, p90 1.0, max 26.3; most takes sit at tx index 2-6 at the 0.05 gwei floor (ordering bought outside the gas price), 7 at index 43-152. The bot bids up to about 1.2-1.5 gwei (0.90 USD cap), so it aims at users left under water for a block or more; the two proof cases would have paid 12.55 and 28.96 USDC for about 0.03 USD of gas."
executor: scratch/trial-aave-bsc/contracts/out/TrialAaveBscLiquidator.sol/TrialAaveBscLiquidator.json
executor_args: "{bot}"
executor_note: "Owner-only liquidate(flashPool, job, cover, minProfit, unwrap). Pool, borrower, collateral, debt token, swap router, fee tiers, pay token and flash lender are all call arguments; constructor takes the bot address only; no setup transaction. The flash callback executeOperation accepts only the lender set for the running call (cleared at the end) with initiator = the executor. Approvals are exact and reset to zero (pool, router, flash repayment). Profit leaves as USDC or native BNB; a USDT gain is swapped to USDC inside the tx. Same logic as trial-aave-optimism's executor with an Aave flash loan instead of Morpho, the PancakeSwap V3 router struct (deadline) and the exit hop; own copy. Live address from EXECUTOR_ADDR_BSC or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-aave-bsc/proof.py (lease, reset bsc 133299655 = parent of block 133299656 with three historical takes of users already under water, deploy artifact, fund owner, cover and fee sweep by eth_call, guards, two successes, exhausted, release; output proof-result.json). Success A (USDC debt) 0x2097f94eb43cacd6aa9cc4490b678dd50c6789d99affa99fb958f71de7f556aa block 133299659, gas 622713, owner +12.551826718 USDC, native -622713000000000 wei (gas at the fork's 1 gwei), borrower HF 0.99541 -> 1.37620. Success B (USDT debt, gain swapped to USDC) 0xc90b04fdddcbff933c5c089af242bcb3cee0d852e60038a1b7dfa7efd68edcfc block 133299660, gas 774963, owner +28.956589562 USDC, HF 0.99677 -> 1.28512. Executor USDC/USDT/BTCB/native and pool/router allowances all 0 after each. Correct reverts: NoProfit guard 0x829ff5fb51c7937091b4c0af79e249e2cf6fb0294a4903479201f4a0e5cbd3d5 (0xe39aafee, owner USDC delta 0); non-owner 0xa6cb6a121327374005dfb00d17130313e424948fb5b6c139977112cc26e65c53 (NotOwner 0x30cd7471); nothing left to take 0xb655fa6e3ed560605f07834c665228693056916885f457f5e091898ca5ccfbb9 (second call on user A, 0x930bb771, owner USDC delta 0). The successes land at parent+4 and +5 because deploy and the two guards consume fork blocks. scratch/trial-aave-bsc/selftest.py: bot calldata equals cast calldata for USDC, USDT and WBNB debt; the bot's own attempt() pinned to block 133299655 through the relay with the paper code override logs two opportunities (12.5518 and 28.9566 USD gross, gas cap 0.90 USD, minProfit 0.90 USDC); pinned to 133299652 (HF 1.0027 and 1.0006) it logs nothing."
awaited_events: "Aave v3 Pool 0x6807dc923806fe8fd134338eabca509979a7e0cb LiquidationCall on the feed (127 in 7 days, about 18 per day, last in the census at block 133848954 on 2026-11-16); every such event triggers a scan of the 200 nearest-to-1 health factors. Safety scan of the near list about every 60 s, full universe hourly, new borrowers from Borrow/Withdraw logs every 10 min. Next occurrence is not predictable (BNB, BTC or ETH price moves)."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is)."
bad_signs: "No opportunity row in 7 days; every send lost by many blocks; simulate_revert for every underwater user (routes or dust rule); read_budget rows (75k CU cap hit); feed_error rows every 30 s."
rpc_reads_per_min: "about 1.3: one Multicall eth_call per minute (near scan), 3 per hour (full scan of ~550 users in batches of 200), one eth_getLogs + eth_blockNumber per 10 min, plus 5-45 calls per detected underwater user"
alchemy_cu_per_day: "about 51,500 relay CU/day (near scan 1440 x 26 = 37,440; full scan 3 x 24 x 26 = 1,872; discovery 144 x 85 = 12,240) plus feed about 6,000 (18 events/day and idle long-polls) = about 58,000 CU/day = 0.03 USD/day at 0.53 USD per 1M CU. The code stops relay reads at 75,000 CU per UTC day."
legal_note: "Public Aave v3 liquidation bonus for repaying unhealthy debt, open to any caller. Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions, no builder bundles. Bidding a gas price for a public reward is in scope of the trial decision."
expedite: false
