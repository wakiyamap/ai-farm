id: trial-cv3-buy-optimism
author: builder/claude-mythos-5-2
chains: [optimism]
strategy: "trial: Compound v3 cUSDCv3 and cUSDTv3 OP Mainnet buyCollateral of reserve residue left after anyone's absorb, flash-swapped on UniV3 in one tx (no principal, USDT surplus sold to USDC); feed-triggered, sends only when simulated surplus > that send's gas cap"
copied_from: "residue buys 0x2ec8541520b41b8c6bdfcf28f75c884a86fb5cb1e66d1bf7270092bf1d663857 and 0x25d1a2675db296ef95358f94a6852f9ab7ad4ae1039b85e2757644f038dce754 (block 159470695, executor 0xf000042d2b48921c234f15d167e7874f594f303e, 2032.82 USDC for 0.03126 WBTC and 741.15 USDC for 0.3962 WETH, 1 block after absorb 0x3821a38e..) and 0x6ffb468a6fedbf1cdbfd929ce319a93a3a1ac54faec4e0b7c337cb35053f6f7c (executor 0xa499fac1afed5f0824c334025ca4f5f6aa8be77e, 234.12 USDC for 3402 OP); bot structure copied from paper trial-cv3-buy-arbitrum (same author)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Cv3FlashBuyOut.sol buy(): reverts NoProfit unless the executor's payout-token (USDC) balance ends above its start by minProfit+1, then sends it all to the owner (scratch/trial-cv3-buy-optimism/contracts/src/Cv3FlashBuyOut.sol:98); bot.py attempt() (bot.py:254) sets minProfit = the send's gas cap and sends only if simulated gross > gas cap = gasLimit (eth_estimateGas x 1.25, refused above 900,000) x maxFeePerGas x ETH price + 0.02 USD L1 allowance, where maxFeePerGas = min(fee cap, 2 x base fee + priority) and the fee cap (bot.py:297) keeps the whole expression at or below 0.95 USD; the ETH price used is max(2500, 1.15 x the price the comet itself quotes WETH at), re-read at every check. Priority bid is at most 25% of simulated gross (BID_SHARE, bot.py:88) and never above the fee cap. Worst case per send = gas; the native wallet is funded with 10 USD, below the 18 USD OP Stack cap"
expected_value: "trial, no EV floor (decision 2026-11-17-cheap-chain-trials). 7 d on the two comets (blocks 159,348,859-159,651,259): 9 absorb txs, 21 BuyCollateral, 9 inside the absorb tx, 12 residue buys by 6 buyers; the 5 non-dust ones were taken 0-1 blocks (0-2 s) after the absorb by 0xf000042d (kept 0.0574 and 0.0160 WETH, about 105 and 29 USD, priority 3.0 and 1.02 gwei) and 0xa499fac1 (kept 0.0170, 0.0010, 0.0003 WETH, priority 1.52, 0.11, 0.034 gwei); incumbents bid 3-5% of gross. The bot aims at residue the incumbents are late for or do not route; the expected share is small and is what the trial measures"
executor: scratch/trial-cv3-buy-optimism/contracts/out/Cv3FlashBuyOut.sol/Cv3FlashBuyOut.json
executor_args: "{bot}"
executor_note: "Cv3FlashBuyOut: owner-only buy(comet, collateral, pool, payBase, minProfit, outPool); comet, collateral and both pools are call arguments, constructor arg is the bot wallet only. UniV3 callback accepts only the pool set for the running swap (cleared at the end); approves the comet for exactly payBase and resets to 0. outPool = 0 pays out the comet base (USDC comet, native USDC 0x0b2c639c533813f4aa9d7837caf62653d097ff85); for the USDT comet outPool is the UniV3 USDT/USDC 0.01% pool 0xa73c628e and the whole USDT surplus is sold to USDC before the profit check. Holds nothing between transactions; owner-only sweep(token) for strays. Fork deploy gas 950,161. Same source as the arbitrum trial's executor, own copy"
fork_evidence: "scratch/trial-cv3-buy-optimism/proof.py (lease, reset, deploy, checks, release; optimism fork gen 28-29, output proof.out). Case A reset 159470694 (the absorb block, parent of the incumbent's buys), cUSDCv3: deploy 0x28f54608af091ef1d9a0f3ee6ecfa95e8635a30d58004ab82597bd9cc796e305; NON-OWNER 0x966b116ac3ad4b7b345ca66c65efab86075d4e9f3ced44c6df80f96f9e9ebd2b status 0; GUARD 0x6f6cd60c95562971099e3b08e4f75437e0214c57daa76b5aca5ac60aa629114c status 0 NoProfit delta 0; SUCCESS (WBTC, pool 0x394a9fcb) 0x6ddc4183e91783da57872c192a9d2c2aa1be219b2b33964506c16cd90bfb8b47 status 1 gas 317964 block 159470698 owner wallet +116.181202 USDC (executor left with 0 USDC / 0 WBTC / 0 native / 0 allowance); NOTHING-LEFT 0xc47be457414010898c814a745f3c3c05a0331816ea513bb985710528128eab76 status 0 delta 0; SUCCESS (WETH, pool 0x1fb3cf6e) 0x80ca553022ea26ed58ad7c6cd5524fdfbd686ad3bd08e88da296ce7a8e9cb08c gas 339581 owner +31.284237 USDC; NOTHING-LEFT 0x3cbda8bc54ca82a30981b1431e1de2b67480ee0e8406ef636ff68a3d16ca4b47 status 0. Case B reset 159533811, cUSDTv3: public absorb by a stranger 0xecec6d5920a0ad82089845d806a2bac149ee36080dc45a9e9770fc7713c48039, then OP via pool 0xb2ac2e5a + out pool 0xa73c628e: GUARD 0x18fa40ff58c5f884b5bab71b4aab56e75451344a68044f15aa56c6dd641d1729 status 0; SUCCESS 0xa223d7558d8bb48612f046e8a5e73b64c5f57f146409eb8f316635fce1e4d5b4 gas 422048 owner +3.022947 USDC; NOTHING-LEFT 0x2157711baaaf9d343e030e0f303bc5f2729a7106d8fdf1564c5db6931bcd1b86 status 0. Bot self-test scratch/trial-cv3-buy-optimism/paper_selftest.py (the bot's own check() on the fork at 159470694): two opportunities, gross 116.181202 and 31.284237, gas cap 0.95 USD each, paper_sim success (selftest.out)"
awaited_events: "AbsorbCollateral (topic0 0x9850ab1af75177e4a9201c65a2cf7976d5d28e40ef63494b44366f86b2f9412e) on cUSDCv3 0x2e44e174f7d53f0212823acc11c01a11d58c5bcb and cUSDTv3 0x995e394b8b2437ac8ce61ee0bc610d617962b214: 9 absorb txs in 7 d, last at block 159545444 (2026-11-14 20:53Z); the next comes whenever a borrower crosses the liquidation line"
good_signs: "logs/bot.jsonl: start, a check line every 10 min with reserve_usd per comet:collateral and eth_usd, feed lines when an absorb happens, then simulate_revert (already bought, the common case) or opportunity + paper_sim; no feed_error lines"
bad_signs: "repeated feed_error, check_error or loop_error lines; no feed line while eth_getLogs shows new optimism absorbs; read_budget lines; an opportunity with gross_usd below gas_cap_usd or gas_cap_usd at or above 1"
rpc_reads_per_min: 0.1
alchemy_cu_per_day: "~10k CU = 0.005 USD at 0.53 USD per 1M CU (safety poll 144 Multicall eth_calls = 3.7k, absorb wakes under 1k, feed subscription ~4 CU/min = 5.8k); hard stop at 60k relay CU/day in code"
legal_note: "public, anyone-callable buyCollateral at the protocol's own discount; a fee bid for a public sale, no mempool watching, no reaction to other users' pending transactions"
