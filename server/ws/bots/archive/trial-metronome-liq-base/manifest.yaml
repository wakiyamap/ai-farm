id: trial-metronome-liq-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: liquidate unhealthy Metronome Synth positions on Base (10% caller incentive) in one Morpho-flash-funded executor call, found by a 40 s health timer"
copied_from: "liquidator contract 0x27cda76c66107b8ebc094d622fcb149cb26da477 (EOA 0xc0ffeef6724ba7ac5eae38deb6c707564997c050), tx 0x95912733b86adfc2a17f7861dff72680a1cbbb760a85a962f716d8e003b7bf54 (msUSD debt, wstETH vault collateral); liquidator 0xc8f9cb4b3bd93a35fef3004c8f6b9a1e45ffcca3, tx 0x868a829fd2772dd6c744b10ca43bdff64bba90109a48a47804ec48d79bdc1399 (msETH debt)"
capital_usd: 15
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "MetroLiq.sol liquidate() (src/MetroLiq.sol:79-91) is owner-only and reverts NoProfit unless the WETH balance grew by at least minProfit inside the same transaction; the gain is unwrapped and paid to the bot wallet as native ETH, so a lost attempt costs gas only. bot.py try_account(): gas limit = eth_estimateGas x 1.15 (refused above 2.6m), maxFeePerGas = base fee x 1.05 + tip, cap = gasLimit x maxFeePerGas + 1e11 wei L1 allowance, refused when cap >= 0.90 USD at a deliberately high 4,000 USD/ETH (so at most 2.25e14 wei), sends only when the simulated gain > cap with minProfit = cap + 1, after an eth_call of the exact guarded call at the signed gas limit. Priority fee bid: at most 30% of the simulated gain (BID_SHARE_PCT), never below 1e6 wei per gas, cut by the 0.90 USD cap. Base wallet funding 15 USD is below the 18 USD OP Stack native cap."
expected_value: "Trial: send-measured win rate, no counted EV. 7-day competition (blocks 56,310,092-59,346,968): 3 liquidation txs / 12 events by 2 liquidator contracts (0x27cda76c: 5.018 msUSD repaid, paid 3.285e14 wei = 0.58 USD for 1.39m gas at tx index 68, 1 block after it became takeable, priority fee 2.36e6 wei; 0xc1a78047: 11 dust events, priority fee 1e5 wei). 10 days ago a 10.03 msUSD case stayed open 222 blocks (44 s). Book: 301k USD debt, 360 debtors, about 166k USD of it within 9% of the limit (0x55e90718 7,371 USD at 1.0010; 0x04261f3a 122,153 USD at 1.0153); 50 days ago liquidations of 1.2k-18.8k msUSD each were taken at tx index 39-2767. The bot aims at cases that stay open longer than its 10-40 s timer; the gain is about 12% of the repaid amount for msUSD debt and about 21% for msETH debt (fork: 3.29e14 wei on 5.0 msUSD, 4.04e14 wei on 0.00189 msETH), bounded by the depth of the WETH/msETH pool (89 msETH, 2.8 WETH). Evidence: scratch/trial-metronome-liq-base/windows.json, scratch/metro/debtors.json, liqs-rows.json."
executor: scratch/trial-metronome-liq-base/contracts/out/MetroLiq.sol/MetroLiq.json
executor_args: "{bot}"
executor_note: "Constructor takes only the owner (the bot wallet). liquidate(P) takes Morpho, WETH, the Metronome pool, synths, both swap pools, the account, the deposit token, the vault and minProfit as call arguments; nothing is baked in and there is no setup transaction. Callbacks (onMorphoFlashLoan, uniswapV3SwapCallback) accept only the counterparty set for the current step and it is cleared at the end. Approvals are for the amount used and reset to 0 (the WETH approval to Morpho is consumed by its transferFrom). It has receive() for the WETH unwrap. Fork: executor WETH, msETH, msUSD, collateral and ETH balances were 0 after the take. Deploy gas about 1.1m. Live code reads EXECUTOR_ADDR_BASE or EXECUTOR_ADDR only; paper mode uses an eth_call / eth_estimateGas code override (executor-runtime.hex = eth_getCode of the fork deployment, taken by proof.py after the last source change)."
fork_evidence: "scratch/trial-metronome-liq-base/proof.py msusd | mseth (one Base fork lease each: reset to the parent block of a real liquidation, deploy the artifact with --args, fund the owner; results proof-msusd.json, proof-mseth.json). msUSD debt / wstETH vault collateral at parent 56,748,806: guard (minProfit 1e20) 0x00cbdc49caa0f7832f50d8cf25d04fb93ce2996fd5e40757115c70f8ea13f827 status 0, owner -11,567,669,534,308 wei; non-owner 0x1d12110a158e63b610211c3525740119b7dde3e8c49a2fcfbc196c0584b26e41 status 0; success 0x532c86d74dc20b725fe6eaf4c1a6e499ffe4ad58545ce1ea3112c632d7be98a7 block 56,748,810 status 1, owner +319,082,850,899,575 wei net of gas (gain 0x12aca29aa126b = the winner's payout); repeat 0x3b500bb2adf882268415e5e4c63138da135b0a901984efbafe55fd787164d8cd status 0. msETH debt / vaETH collateral at parent 52,471,721: guard 0x8c8f1958cb69c97a006bc9f0e238156f01f0430f9fc1d6609cfe2fdf1618bdfa status 0, owner -7,078,847,104,463 wei; success 0x35aac19228f48d39a816171e007ec1888c1d142e1cd5c67fe0359359b91a0994 block 52,471,725 status 1, owner +397,834,238,588,626 wei; repeat 0x7070ab5f38dd015ac5e72c11ac8316ae8dced2ee6ec6b9a44b56b8ae1687e851 status 0. The bot's own detection and sizing on the fork at both parent blocks: scratch/trial-metronome-liq-base/selftest.py -> selftest.json (paper_sim success, gain 3.29e14 and 4.04e14 wei, calldata equals cast calldata)."
awaited_events: "A tracked position's Pool.debtPositionOf turning unhealthy with collateral left (timer, no feed). Last liquidation 2026-11-13 (block 56,748,807); last one above 1,000 msUSD about 47 days ago. Next: unknown time; 0x55e90718 (7,371 USD msETH debt) is 0.10% from its limit and 0x1afa4015 (1,127 msUSD) 0.54%, so interest or an ETH move of that size opens them."
good_signs: "check rows every 20 minutes with tracked about 110; opportunity and paper_sim rows when a position turns unhealthy; live send_result won with positive net_wei."
bad_signs: "check_error or read_budget rows; opportunity_skip no_profitable_route on a farm-size position (msETH pool too thin or a vault withdraw failing); every send lost with blocks_after_winner > 0; PositionLiquidated events on the pool with no opportunity row before them."
rpc_reads_per_min: "1.5 on the base timer (one Multicall3 eth_call every 40 s), 6 in fast mode (10 s) while a position is unhealthy or within 0.05% of its limit, at most 1,300 fast polls a day; one eth_getLogs census every 6 h; about 25 calls per opportunity."
alchemy_cu_per_day: "2,160 x 26 = 56k CU/day base; fast mode at most 1,300 x 26 = 34k; census 4 x about 300; code cap 95,000 CU/day = 0.05 USD/day at 0.53 USD per million CU. No feed CU."
legal_note: "Pool.liquidate is Metronome's public liquidation entry with a protocol-set 10% liquidator incentive; anyone may call it. The bot reads confirmed state on a timer, never pending transactions, and bids a priority fee only for that public reward. The flash loan and swaps are ordinary public functions; no price is moved to create the liquidation."
expedite: false
