id: trial-morpho-whype-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: Morpho Blue WHYPE/USDC liquidations on HyperEVM (markets 0xd7d38220 lltv 0.77, 0xd13b1bad lltv 0.625, 0xf1c3d487 lltv 0.86) by the direct permissionless Morpho liquidate (no auctioneer wrapper); a timer reads the positions nearest the line (60 s, 6 s while a sizable one is within 1.5%), the seized WHYPE is sold to USDC in the UniV3-style pool 0x6c9a33e3 inside Morpho's liquidate callback, one tx, USDC gain or revert."
copied_from: "actor 0x44f50d4aff3b942710dda8255f2fd08697a3b3f4 (executor 0x3d3092ef58632241b06b996b4712823c98b82435): tx 0x7bb3691a20c70e9f673afa3b5d898ac89b3b5e95ff78a2d0b8815c050db5f756 (block 51209684, whype62, +163.39 USDC, 124.7 gwei) and tx 0xc6def1e96966227164122ce645c0ad2a6c803895354b169d384a81bf8f58b381 (block 51274511, whype77, 141.26 USDC repaid, 251.9 gwei); lead 228, attempts:1559 and 1567"
capital_usd: 20
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialMorphoHyperTake.take reverts NoProfit() unless its USDC balance grows by minProfit (scratch/trial-morpho-whype-hyperevm/contracts/src/TrialMorphoHyperTake.sol:86), so a lost attempt costs gas only. Gas cap per send in bot.py:73-78 and 349-360: GAS_LIMIT 450,000 x maxFeePerGas, with maxFeePerGas <= 0.95 USD / (on-chain HYPE/USD from the Morpho oracle x 1.15, or 200 USD before the first read) / 450,000 (about 26 gwei = 0.83 USD at HYPE 69.9); the bot does not send unless that cap is < 1 USD, the base fee is under it and the simulated gross is above it, and passes the cap as minProfit. Priority-fee bid: at most 40% of simulated gross (BID_SHARE, bot.py:78), never above the fee cap."
expected_value: "trial, win rate to be measured live. 7 d competition on these three markets (scratch/trial-morpho-whype-hyperevm/competition-7d.json, attempts:1567): 16 Liquidate events, 6 sender EOAs, 10 caller contracts. 10 of them (keeper 0x6c246928, the auctioneer-wrapper route) were taken while the direct route still said 'position is healthy' one block earlier, so they are out of reach. The 5 direct-route takes sampled were takeable through this bot's executor (relay eth_call at the historical block, code override) 3 to 9 blocks before the winner (gains 212.90, 37.67, 8.53, 0.76 USDC; one 0.02 USDC dust case open 40+ blocks); winners paid 124.7, 893, 251.9, 5.5 and 0.7 gwei. With the 1 USD send cap (about 26 gwei) the bot can outbid only the last two classes; it aims at direct-route takes in quiet-fee blocks, gross = (LIF - 1) x repaid minus the 0.05% pool fee (LIF 1.075 / 1.127 / 1.044), one attempt 293k-338k gas = 0.002 USD at the 0.106 gwei head gas price."
executor: scratch/trial-morpho-whype-hyperevm/contracts/out/TrialMorphoHyperTake.sol/TrialMorphoHyperTake.json
executor_args: "{bot}"
executor_note: "Deploy gas 1,025,451 (fork), under the 2,000,000 HyperEVM cap. No principal and no flash loan: Morpho hands over the seized collateral before its onMorphoLiquidate callback and pulls the repayment after it, so the repayment is the sale proceeds (a manifest-check note about principal_usdc does not apply). constructor(address bot) only; market params, borrower, seizedAssets or repaidShares, the pool route (1-3 UniV3-style pools, collateral to USDC) and minProfit are call arguments. Morpho Blue on HyperEVM (0x68e37dE8...) and USDC (0xb88339CB...) are constants (counterparty and profit unit). onMorphoLiquidate accepts only Morpho while a take() is running; the swap callback accepts only the pool set for that hop; both peers are cleared; the USDC approval to Morpho is the exact repaid amount and reset to 0; a route that does not end in USDC reverts BadRoute. Profit is paid to the bot wallet as USDC. Owner-only sweep(token) for recovery."
fork_evidence: "scratch/trial-morpho-whype-hyperevm/proof.py (lease, reset hyperevm to head 51474100, deploy by creation tx, fund, a stranger opens a max-LTV position (50 WHYPE, 2,183.76 USDC borrowed), 10 min clock move, 4 guards, success, release); result in scratch/trial-morpho-whype-hyperevm/proof-result.json. Success 0x4522a3acd85c2f219e60c13e1c36e13c59257df3f734c023e05bb5843ec91507 (fork block 51474111, gas 292,981): owner USDC +274.647772, borrower's debt shares 1994144403699146 -> 0, executor left with 0 USDC / 0 WHYPE / 0 allowance. Reverts: nothing to take (real healthy borrower 0xc5ea2f34...) 0xfdf541d59ef1d4c6417424f185d701bc604272bdc43aabb31fbf337b342ccb41 ('position is healthy', gas 130,861), minProfit above gain 0x23425d4ff78e9d88e98d58b47607e0cf2076191fd0763f7e9ad9a3f8b0a5361c (NoProfit 0xe39aafee, gas 338,426), empty route 0xc4d0cf9e13975771313f5452b6908a667e97bae3592d1ebc9c39904826a3e0d1 (BadRoute 0xc4c321d1), non-owner 0x9ccd17b5d2427e194f04227ec0932b796d0cff78d62418c7cc356f2d3aa945ec (NotOwner 0x30cd7471). The position is made on the fork because the hyperevm fork serves head storage at any reset block (Morpho accrueInterest then underflows on a historical reset; see the proof.py header). The natural historical case is in scratch/trial-morpho-whype-hyperevm/selftest.py (result selftest-result.json): the bot's own read/ratio/sim path through the relay at block 51209683, the block before actor tx 0x7bb3691a..., with the fork deployment's runtime as code override: ratio 1.00174, debt 1,735.59 USDC, simulated gain +212.900614 USDC (also at block 51209682; 'position is healthy' at 51209673); a healthy borrower at head reverts 'position is healthy'; full scan at head: 325 debtors, top ratio 0.999998 (a 4 USDC position), Borrow-log discovery returns 2 logs. Paper override = eth_getCode of the fork deployment (executor-runtime.hex)."
awaited_events: "A WHYPE/USDC borrower crossing its lltv on the stored oracle price (a HYPE drop). Last direct-route takes: blocks 51273608, 51274511, 51274523 (2026-11-14, the last HYPE drop) and the dust take 51276670; nothing since. At placement HYPE is 69.9 USD and the nearest sizable positions need a drop of a few percent; next occurrence = the next HYPE drop of that size, not predictable."
good_signs: "logs/bot.jsonl: scan rows every 60 s with top_ratio moving with HYPE; timer rows switching to the 6 s poll when a position nears the line; opportunity + paper_sim success rows when one crosses; live: send_result rows with result won."
bad_signs: "scan_error, relay_error or loop_error on every cycle; read_budget rows (the 90,000 CU cap was hit: the fast timer ran too long); simulate_revert other than healthy on every candidate (pool or market changed); opportunity_skip base_fee_above_fee_cap on every crossing (fees in drops stay above the 1 USD cap: report as 'fee short'); live send_result lost with blocks_after_winner >= 1 on every send (always late)."
rpc_reads_per_min: "about 1.2 on the slow timer (one Multicall eth_call per 60 s, 3 per full scan every 30 min, eth_blockNumber + eth_getLogs every 30 min); up to 10 per min on the 6 s timer"
alchemy_cu_per_day: "about 49,000 on a quiet day (0.026 USD): polls 1,440 x 26 = 37.4k, full scans 48 x 3 x 26 = 3.7k, borrower discovery 48 x 85 = 4.1k, borderline re-simulations about 3.7k; the 6 s timer adds up to 15.6k CU per hour and is allowed only while the day's total stays within the hard cap of 90,000 in code (0.048 USD). No feed filter."
legal_note: "Morpho Blue's liquidation incentive is a public payout to any caller of liquidate(); the bot reads mined state on a timer, watches no mempool and no pending transactions; it bids a priority fee for a public reward."
