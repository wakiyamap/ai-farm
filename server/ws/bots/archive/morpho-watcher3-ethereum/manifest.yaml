chains: [ethereum]
strategy: >
  Shrunk-executor resubmission of morpho-watcher2-ethereum (gate deployment-gas refusal
  3,190,399 > 3,000,000, reviewer 390f0db2): poll the two measured collateral-sellable
  Morpho Blue markets on ethereum (WETH/USDC 0x94b823e6.., WBTC/USDC 0x3a85e619..) every
  60 s via Multicall3 (accrue + market + position + oracle price) and send the bot-deployed
  MorphoLiquidator executor (flashLoan -> liquidate capped seize -> UniV3 sell -> revert
  unless the executor USDC balance rose by minProfit -> the profit PAID to the bot wallet in
  the same tx) with the 0.5 USD post-fee profit floor and the dormant-debtor restamp fix,
  on a 10,273-byte deployment bytecode (13,057 in the rejected artifact) so the gate deploy
  fits the 3,000,000 gas farm-key limit.
copied_from: >
  morpho-watcher2-ethereum (bots/archive, review 390f0db2 accepted its code, proofs and
  cadence; only the executor deployment bytecode is shrunk): its fork proofs of record
  (success paying +3.711168 USDC to the bot wallet 0xdb57c173c4cfa3feeec069058c796372627910b103be7e1804fdaeaeb79b0082)
  and the morpho-watcher-ethereum lineage: the attempt-926 classification (a)=1/(b)=7/(c)=9/(d)=1
  of its 17 pinned-market 7d captures (ledger morpho_blue.liquidate source).
capital_usd: 16
principal_usdc: 0
allowed_contracts: [] # executor bot: every live send targets the gate-deployed executor; the signer allows it automatically (decisions/human/2026-11-11-executor-bots-funds.md)
max_loss_per_tx_usd: 20
max_loss_guarantee: >
  Same mechanism as the predecessor of record (bots/archive/morpho-watcher2-ethereum):
  the whole action runs in ONE transaction through the bot-deployed MorphoLiquidator, which
  ends liquidate() with require(balAfter >= balBefore + minProfit) on its own USDC balance
  and reverts otherwise, so the worst case is gas only; maxFeePerGas is derived per cycle
  from the latest header (basefee x 9/8 + 0.001 gwei tip, capped 17.5 gwei) x gasLimit
  460000 <= 0.00805 ETH <= 20 USD at any plausible signing-time ETH/USD. After the guard the
  contract transfers its whole loan-asset balance (the proven profit) to the bot wallet (the
  owner) in the SAME transaction (a failed transfer reverts the whole tx), so no profit is
  left sitting in the executor for the watchdog/gate sweep to miss. The shrunk artifact keeps
  the guard byte-compatible in behavior: only Error(string) reasons became custom errors and
  unused whitelist getters/setters were dropped (selectors unchanged).
expected_value: >
  Counted per decisions/human/2026-11-12 item 2 (only cases whose measured time-to-capture
  exceeds the 60 s poll interval + send): the two floor-admitted 1.01/1.34-USD-gross captures
  stayed liquidatable 100 s (~8 blocks) and 112 s (~9 blocks) before the competitor captured
  them (blocks 26372995/26372996), and the long-window captures ran ~2500 s (~208 blocks,
  26373743) to >=7193 s (~599 blocks, 26391772) — median of the counted windows ~222 blocks,
  minimum ~8 blocks (attempt 939 cadence measurements, run ef61ac40). The class-(a) big
  capture 26384831 (repaid 92,326.04 USDC, gross +17.45 USD at the 398 USDC capital cap,
  proven fork delta 0xede2f12f8793e4f41120d855de4051b025a6cf827fc6acf781903cc309ce689c
  +71.731107) had a 12 s = 1 block window and does NOT count. Sum ~1.8 USD/day after gas at
  the measured pinned rate; the dust-case fork delta +0.158935 USDC
  (0x45ff8d9f9686b7a1bbab994b7b78a71f7cd268232e67448d28e42af045e9998b) proves the executor
  floor admits the sub-1-USD gross captures. Read cost is ~0.17 USD/day, far below the EV.
executor: "scratch/morpho-exec3/contracts/out/MorphoLiquidator.sol/MorphoLiquidator.json"
executor_args: ""
executor_note: >
  Same constructor [MORPHO, WETH, WBTC, 0, 0, UniV3 WETH/USDC pool] and same external
  selectors as the morpho-watcher2 artifact (liquidate cf1f5981, isPoolAllowed d1e71c94,
  setPoolAllowed 1bfa59c3, owner 8da5cb5b, sweep 62c06767, MORPHO 3acb5624 — verified equal
  across old and new forge artifacts this session); the WBTC route is armed by the one owner
  init tx setPoolAllowed(0x9a772018fbd77fcd2d25657e5c547baff3fd7d16, true) exactly as the
  live bot does. The minProfit floor is a per-call argument. Shrink vs the rejected 13,057-byte
  artifact (deploymentBytecode 10,273 bytes): string requires became custom errors, the
  C0..C3/P0 whitelist getters became internal immutables, and the unused
  setCollateralAllowed/allowedCollateral/CollateralAllowed path was dropped (a new collateral
  token would need a redeploy; the pools stay runtime-settable). Fork deploy gas measured on
  the shared ethereum fork: this artifact 2,076,371 (tx
  0x93255389d2abf185d3b269dd7ddfeb62cd951997171d5364beb664965297a080) vs the rejected
  artifact 2,636,574 on the same fork / 3,190,399 in the gate's live measurement; this
  artifact lands under the 3,000,000 limit in both measurement styles.
