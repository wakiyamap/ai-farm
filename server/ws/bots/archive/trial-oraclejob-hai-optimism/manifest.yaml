max_loss_guarantee: "act() reverts unless the ETH received >= minProfit (scratch/trial-hai-oraclejob/contracts/src/HaiOracleJobTrial.sol:97) and the job call itself reverts when the item was already poked (OracleJob_InvalidPrice), so a lost race costs only gas; signed cap gasLimit 500000 x maxFeePerGas 0.06 gwei = 3e-5 ETH ~ 0.055 USD at ETH 1826 (plus L1 data fee, measured 4.4e-9 ETH ~ 0.008 cents at the fork; on OP the native wallet balance caps the enforceable worst case anyway); priority bid 0.03 gwei = 1.1e-5 ETH = 33% of the fork-measured 3.374e-5 ETH gross, never more than 40% (bot.py fees(), PRIO_MAX_SHARE; trial decision section 1); the bot sends only when the quoted gross exceeds the signed gas cap plus an L1 fee estimate (bot.py main(), the go flag) and passes minProfit = gas cap + L1 estimate + 1 to the executor, so the same condition is enforced on-chain; one send per window, a signer rejection is final"
expected_value: "trial bot: the EV rule is waived (decision 2026-11-17-cheap-chain-trials section 2); win rate is measured live. Class size for context: 15 items x 24 h = 360 rewards/day x 0.05 HAI ~ 18 HAI ~ 22.2 USD/day split across 5 keeper addresses (attempts:1439); per attempt gross = fork profit 0.000033741211169416 ETH = 0.0616 USD, realistic gas 0.012-0.023 USD (341,269 gas at 0.035-0.065 gwei effective), so a win nets ~0.04 USD and a lost race costs the same order"
