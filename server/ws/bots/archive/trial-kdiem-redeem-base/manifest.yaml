id: trial-kdiem-redeem-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: kDIEM (wrapped Venice DIEM, the quote token of about 28 launchpad agent tokens) round trips through the Buffer's two public doors on Base. When an agent token's Uniswap v4 pools disagree with the DIEM price, flash-borrow USDC from Morpho, go USDC -> agent token -> kDIEM, redeemDiem at par less the 1 pct door fee, sell the DIEM for USDC on a V3 pool (or the reverse through mintKdiem), keep the USDC difference"
copied_from: "operator A EOA 0xb15d7daa (executors 0xd9e28930ca5113ab003a6f013b8d2ceb140dd3df and 0xc4980e5370bde3c1503d5c282a93ee1feeb01e62): 17 paid takes in the door's first 47 hours, e.g. tx 0x9de08cb7eb7c869bd42b80d49744175bef49ed6aac1ef4a224dc535c6e744b41 (block 60479599: 100 USDC -> KAI -> kDIEM on v4, redeem, DIEM -> USDC on 0xbc323103, +0.363 USDC); operator B EOA 0x5d03a3f8151d98a1bf9de604e7552caf49034ec3 through 0xe6b032b48e5cfa19840f8033ca8369f2b9eecb62: tx 0xe5a7b31b6b5de9f2b433aecadd2eeed87cfa5cb72cc0c589c6d909eb4181fddb (block 60479756: Morpho flash 50 USDC -> RAWR -> kDIEM, redeem 0.026493 kDIEM for 0.026228 DIEM, sold on 0xf69cd40b, +0.167 USDC). Same route shape; this bot picks the better of the two DIEM pools."
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "Gas only. DoorArb.run reverts NoProfit unless its USDC balance grew by at least minProfit (and Morpho's own repayment pull fails first when the round trip lost), and the bot sets minProfit = the send's gas cap in USDC at a 2,500 USD/ETH reference (bot.py check(): cap = gas_limit * max_fee + L1_FEE_ALLOW_WEI, cap_usdc passed as min_profit to run_calldata), so an included send either pays more than its own gas cap or reverts and costs gas. A send happens only when the simulated gross > 1.3 x that cap (SEND_MULT). Caps in bot.py: MAX_FEE_CAP_WEI 0.3 gwei, GAS_LIMIT_MAX 1,200,000, so at most 0.00036 ETH + L1 fee = 0.90 USD a send at the 2,500 USD reference (0.60 USD at 1,670), and MAX_TX_USD 0.95. Typical attempt: about 600,000-800,000 gas at 0.006-0.02 gwei = 0.01-0.03 USD including the L1 data fee. Priority fee bid: at most 1/10 of the simulated gross, never above 0.2 gwei (TIP_SHARE_DEN, TIP_MAX_WEI). No principal: Morpho flash loan."
expected_value: "Trial: measures the win rate by sending. The door is 47 hours old (first DiemRedeemed at block 59635546). In that time (scratch/r0e1f/kdiem_hist.py -> kdiem-hist.json, 74 kDIEM burn txs): operator A 17 takes for 5.44 USDC (0.18-0.51 each on 100 USDC), operator B 2 takes for 0.29 USDC, both at 0.006-0.013 gwei with no fee bidding (tx index 6-195), gas 0.000004-0.000018 ETH a take; a third (0x53881155 through 0x8407699e, 35 txs) keeps its profit in its contract and was not sized; the first minutes after the door opened paid 0xb02ca8f1 249 USDC. Time from the trade that opened the gap to the take (scratch/trial-kdiem-redeem-base/windows.py -> windows.json, 17 of 19 takes with a prior trade on their pools): median 33.8 s, minimum 4.8 s, 8 of 17 over 60 s. With a 30 s look the bot aims at the takes that sat longer than its look, about half: 1-2 USD a day at the current pace, more if agent-token trading grows. On the fork at the parent of operator B's take the bot's own route choice paid 0.458856 USDC where B took 0.167433."
executor: scratch/trial-kdiem-redeem-base/contracts/out/DoorArb.sol/DoorArb.json
executor_args: "{bot}"
executor_note: "DoorArb(address bot), Solidity 0.8.24 via_ir, 5,461 runtime bytes, deploy 1,235,566 gas on the fork (limit 3,000,000). run(P) is owner-only; P is one static struct: morpho, pool manager, door (Buffer), V3 pool, base token (USDC), underlying (DIEM), wrapped (kDIEM), agent token, the two v4 pools' fee and tick spacing, direction, amount, minProfit. It flash-borrows the base token from Morpho; inside the callback, redeem direction: one v4 unlock with two exact-input hops (base -> agent -> wrapped; the agent token never leaves the pool manager), approve the door for exactly the kDIEM held, redeemDiem, approval back to 0, sell the DIEM on the V3 pool; mint direction: the mirror image through mintKdiem. Then approve Morpho for the loan, and after the loan: approval to 0, NoProfit unless the base balance grew by minProfit, all base token to the owner. feeU = tsU = 0 selects a direct base / wrapped v4 pool. Nothing is stored or baked in, no setup tx; the three callbacks (onMorphoFlashLoan, unlockCallback, uniswapV3SwapCallback) answer only the counterparty set for the running step and cleared after it. Constructor arg = the bot wallet only."
fork_evidence: "scratch/trial-kdiem-redeem-base/proof.py 60479755 (one lease, about 40 s; result proof-result.json; deterministic hashes). Base fork reset to 60479755 = parent of operator B's take 0xe5a7b31b... (block 60479756); no fixture for the success. Deploy 0x42c79a4c... (1,235,566 gas, fork block 60479756); the bot's own read_state / candidates / best_size chose RAWR, redeem direction, 50 USDC, DIEM pool 0xbc323103: eth_call gain 458856. Non-owner 0xc97b8ce0... reverts NotOwner; guard 0x8cd98e22... (minProfit 458857) reverts NoProfit(458856, 458857), owner USDC delta 0; success 0xc37c5184... fork block 60479759 (the state is block 60479755 plus the proof's own txs), 557,962 gas: owner USDC +0.458856 = the eth_call value exactly; the same call again 0x6e95d736... reverts (the gap is closed, the loan cannot be repaid); nothing to take: the mint direction of the same route 0x2a778574... reverts, owner delta 0; mint path run mechanically 0xc4cee14a... with a fork-only 5 USDC in the executor and minProfit 0: reaches NoProfit(0, 0), i.e. the V3 buy, mintKdiem, both v4 hops and the Morpho repayment all executed; executor leftovers 0 DIEM, 0 kDIEM, 0 agent token. selftest.py: the bot's paper path (code override = eth_getCode of this deployment) returns the same 458856 at block 60479755 through the relay, and 12 looks at head settle at 1 eth_call a look."
awaited_events: "A trade on an agent token's USDC pool or kDIEM pool (or a move of the DIEM / USDC pools) that leaves a round trip above the fees (about 5.3 pct of pool and door fees on the two-hop route). Last incumbent takes: blocks 60479475, 60479599 and 60479756 (2026-11-21 18:37:50Z, 18:38:15Z and 18:38:47Z, from the timestamp of block 60479923 = 18:39:20Z at 0.2 s a block; 19 paid takes since the door opened at block 59635546 = 2026-11-19 19:44:44Z, in bursts). Next: unknown, expected several a day while the launchpad trades."
good_signs: "paper_sim success lines; live send_result won with gross_usdc well above cap_usdc; opportunity lines on RAWR / KAI / WORM style tokens (two-sided pools)"
bad_signs: "send_result lost several times in a row (an incumbent takes within one look: the 30 s timer is too slow); only check below_interest lines with error 0x5212cba1 (CurrencyNotSettled: one-sided launch pools, never takeable); loop_error 'buffer getter failed' (the Buffer was upgraded or paused); door_bps changed from 100; buffer_diem near 0 (ExceedsBalance: the instant door is empty, redemptions queue)"
rpc_reads_per_min: 2.1
alchemy_cu_per_day: 78000
legal_note: "Two public doors of the protocol, open to anyone, whose verified source names arbitrage bots as the users the door fee is meant for (Buffer.sol setFeeExempt comment), plus public pools and a public flash loan. The 1 pct door fee is paid in full (the bot is not on the fee-exempt list and does not try to be). No mempool watching, no reaction to pending transactions: confirmed state on a timer. No holding: every token is back in USDC inside the transaction."
expedite: false
