review_note: "review d013d4cb blocker fixed 2026-11-06T04:45Z (run 87475e52) — bot.js window_blocks had head(BigInt) minus startedBlock(Number), a TypeError thrown in the simulate log line before the res==='ok' send branch, so every active trade only ever logged an error. Now Number(head) - t.startedBlock. Verified by seeding the last weETH->ETH+ trade 0x527dc250 (startedBlock 26348213) into state.json and restarting — simulate records were written with window_blocks 5294/5297 as plain numbers and sim_result revert 'bid already received' (a settled seeded trade — revert expected; the send gate received its decision). Those two simulate records in logs/bot.jsonl at 04:46-04:47Z are this readiness test, NOT a natural capture (state.json was restored to empty trades and the bot restarted 04:47:46Z); a natural capture still awaits (awaited_events, ~1/day)."
review_note2: "review d013d4cb inclusion-time gas-USD blocker fixed 2026-11-06T05:08Z (run b8ba2fe9) — the 1.1 oracle markup the review called an estimate is replaced by a MEASURED jump bound: staleness cap cut 7200 -> 2400 s (measured cadence 1236 s admits ~one missed round + grace), and the 90-day 1-minute-candle measurement (Binance ETHUSDT klines, cross-checked against this feed's own answers within 0.25 percent) gives a maximum 100 percent move of 9.05 percent over the exact staleness+poll+inclusion window (2469 s) and 10.30 percent over 78 minutes, both under the 1.12 markup now used. simulate records now also carry window_s (started block timestamp -> simulate clock) next to window_blocks for the polling-to-inclusion measurement. Readiness-verified by the same seeded-trade restart — simulate written with window_s 64951, window_blocks 5395, oracle_age_s 1797, worst_gas_usd_mic 10919655 — again a readiness test, not a natural capture."
review_note3: "review da3e4b7a gas-USD bound blocker fixed 2026-11-06T06:53Z (run 0f28c807) — the reviewer rejected converting the signed ceiling with a stale-able oracle answer times a measured margin (a margin is not a hard bound); the signed gas exposure is LOWERED instead — GAS_BUDGET_GAS 900000 (measured gasUsed 741303 and 741672 with a x1.21 margin) x MAX_FEE_WEI 2.2 gwei = 0.00198 ETH (was 875000 x 5 gwei = 0.004375 ETH), so the absolute worst-case gas USD needs no price oracle at all — the signed cap valued at the highest price ETH has ever traded (measured max daily high over all 3369 Binance ETHUSDT 1-day candles from 2017-08-17 to 2026-11-06, 4956.78 USD on 2025-08-24, scratch/binance-eth-1d-alltime.json) is 9.81 USD <= 20 USD; the Chainlink filter stays (4.93 USD at the readiness-test upper 2491.61; fails closed above an answer ~9018 USD, a gasPrice >= 2.2 gwei, or a worstGasMic > 20 USD — a spike above the cap is a missed trade, not a loss); maxFeePerGas now signs at 1.25 x measured gasPrice capped by MAX_FEE_WEI (measured relay gasPrice 0.547 gwei 2026-11-06, ~4x inclusion headroom over the 20 min auction window). Readiness-verified again by the seeded settled trade 0x527dc250 restart — simulate record with gas_budget_gas 900000, min_profit_wei 117091805400000, gas_price_wei 65051003, worst_gas_usd_mic 4933384, oracle_age_s 1168, window_blocks 5920, window_s 71270 at 06:5xZ — a readiness test, not a natural capture; state.json restored to empty trades and the bot restarted 06:52:46Z. The manifest's plain-scalar ': ' load failure (inbox/meta/manifest-plain-scalar-colons.md) is also fixed: every prose value is double-quoted."
review_note4: "review 7e653174/attempt 272 gas-USD basis blocker fixed 2026-11-06T08:2xZ (run 93b81c5a) — the reviewer rejected valuing the signed cap at the all-time high (an all-time high is not an inclusion-time bound: at their assumed 11000 USD/ETH, 0.00198 ETH cost 21.78 USD > 20). MAX_FEE_WEI lowered again 2.2 -> 2.0 gwei: the SIGNED cap is now 900000 x 2.0 = 0.0018 ETH, enforced in the transaction by maxFeePerGas x gasLimit. Absolute worst case: 0.0018 x 11000 = 19.80 USD <= 20 (the reviewer's own assumed price; at the measured all-time high 4956.78 itself: 8.92 USD). Measured inclusion-time path: the oracle filter sends only while answer <= 9920.6 USD (0.0018 x answer x 1.12 <= 20 USD), and with the measured max 9.05 percent move over the 2469 s staleness+poll+inclusion window the inclusion-time price at any send is <= 10818 USD -> worst gas 19.47 USD. Fee headroom: relay gasPrice measured 0.160 gwei on 2026-11-06T08:14Z (0.547 gwei at 06:5xZ) — ~12x headroom to the 2.0 gwei cap; gasPrice >= cap fails closed (missed trade, not loss). Readiness-verified by the seeded settled trade 0x527dc250 restart — see the simulate record with max_fee_wei 2000000000 and worst_gas_usd_mic ~4.46e6 micro (0.0018 ETH at the fresh upper price) in logs/bot.jsonl at 08:2xZ — a readiness test, not a natural capture; the drought continues (bot cursor covered 26348213-26354544 with zero new weETH/ETH+ starts; the last ledger start overall is block 26348622, ~21 h before head 26354997)."
review_note5: "review attempt 279 gas-USD-basis blocker fixed 2026-11-06T09:4xZ (run f3ba8324) — the reviewer rejected every decision-time conversion of the signed cap (at their assumed 12000 USD/ETH even 0.0018 ETH costs 21.60 USD > 20, and no observation bounds a FUTURE inclusion price). The USD bound now lives IN the transaction AT INCLUSION: ReserveDutch.bidDutch reads the Chainlink ETH/USD answer of its own execution block (freshness <= 2400 s enforced on-chain, ORACLE_STALE) and reverts GAS_USD unless (gasleft + 22000) x tx.gasprice x answer <= 20.00 USD — tx.gasprice is the effective price actually paid at inclusion and <= the signed maxFeePerGas, so a completed bid pays <= 20 USD gas at the inclusion-block oracle price whatever the assumed price is, and a GAS_USD/ORACLE_* early revert pays <= 60000 x 2 gwei = 0.00012 ETH (0.00012 x 12000 = 1.44 USD at the reviewer's assumed price). Fork proof rerun with a new guard tx at 40 gwei reverting GAS_USD with balance 0 (see fork_evidence). Readiness-verified by the seeded settled trade 0x527dc250 restart — simulate records at 09:42-09:45Z in logs/bot.jsonl with window_blocks 6780-6784, gas_usd_cap_micro 20000000, oracle_age_s 1756-1872, worst_gas_usd_mic ~4.5e6 micro (0.0018 ETH at the fresh upper price), sim_result revert 'bid already received' (the seeded trade is settled: the new in-contract check PASSED against mainnet latest and the revert came from the trade side; a readiness test, NOT a natural capture); state restored to empty trades at 09:45Z and the bot restarted (start-limit-hit from repeated restarts cleared by the 10 min window). Natural profitable weETH/ETH+ capture still awaits: last ledger start block 26348622, drought at head 26354997."
review_note7: "drought recheck 2026-11-08T03:4xZ (run f0e1b2f1) — no code change; the last full review 325468a3 decision fix stands with its only open blocker a natural profitable weETH/ETH+ capture. Paper service healthy (45 s heartbeats, active=0, head 26367528; the transient 'beyond current head' getLogs errors self-heal on the next poll because the cursor only advances after a completed cycle — 4 such records in the last 400, last 2026-11-07T23:37Z). Ledger reserve_revenue cursors verified through next_block 26366888: no TradeStarted since the 26348213/26348622 batches, so no new simulation evidence exists. awaited_events updated: the pair's measured cadence is 1 per 6.8 days (attempt 453), not ~1/day — the next natural capture is plausible around 2026-11-12."
review_note6: "attempt 281 staleness-cap blocker fixed 2026-11-06T10:2xZ (this run) — the bot sat fail-closed through the quiet stretch with 'oracle round NNNNs old (limit 2400s)' error spam (2974->3395 s and rising, logs 10:02-10:09Z): the 2400 s cap assumed the volatile-hours cadence 1236 s, but the feed's quiet-hour rounds are the hourly heartbeat apart — measured consecutive rounds updated 2026-11-06T09:13:11Z and 10:13:35Z = a 3624 s gap through this relay (the aggregator has no getHeartbeat(); cadence measured from latestRoundData transitions). Caps raised: on-chain MAX_ORACLE_AGE 2400 -> 3660 s (3624 gap + ~25 s answer-delivery slack + margin; the on-chain age is block.timestamp - updatedAt INSIDE the execution block, so no poll/head-lag term) and bot-side ORACLE_MAX_AGE_S 2400 -> 3960 s wall age (3624 + 25 delivery + head lag allowed 180 s over the measured 82 s at 10:14Z + poll 45 + margin; the bot reads 'latest' so a new round is hidden until it reaches the head). The 1.12 price margin stays: the worst bot-side decision-to-inclusion window 3960 + 45 + 24 < the 78-minute (4680 s) window over which the 90-day 1-minute-candle measurement caps the move at 10.30 percent (attempt 266 data, scratch/binance-eth-1m-90d.json). Human decision 2026-11-06-loss-usd-basis.md: L is 50 USD at the signer's signing-time price — the manifest keeps the stricter self-imposed 20 USD (in-transaction GAS_USD bound unchanged); signing-to-inclusion price moves are outside L per that decision. Fork proof rerun with the raised constant: success delta +5.278e13 wei, gasUsed 760270, GAS_USD guard at 40 gwei reverts (see fork_evidence); executor-runtime.hex re-taken from the fork instance after the change. Natural weETH/ETH+ capture still awaits (drought continues)."
review_note8: "review 4369da96 attempts 805 payout blocker fixed 2026-11-10T14:2xZ (run 65a18682) — bidDutch snapshot-checked the ETH+ gain but left the earned ETH+ in the executor: value outside the bot wallet counts as lost (decisions/human/2026-11-10-live-loss-stop-watchdog.md) and the gate sweep returns wallet balances only, so a successful bid had no realizable payout. The executor now transfers the full post-guard buy balance (balBuy1) to owner INSIDE the same bidDutch transaction (ReserveDutch.sol: require(IERC20(buy).transfer(owner, balBuy1), \"PAYOUT_FAIL\") directly after the NO_PROFIT check) — a failed transfer reverts the whole bid, so the guard semantics are unchanged and a NO_PROFIT/GAS_USD revert still keeps the executor balance 0. proof.py rerun (payout round, see fork_evidence): success tx credits +4.195e14 wei ETH+ to the owner wallet and leaves the executor at 0; the floor success at the bot 0.1 gwei signing floor credits 4.71e14 wei >= the 2.1e14 floor with an includable fork fee at gas cap 1050000; the NO_PROFIT guard reverts BEFORE settlement with balance 0. bot.js unchanged (live path sends the one bidDutch tx; the paper path only simulates its success). executor-runtime.hex re-taken from the deployed fork instance by proof.py (eth_getCode, 6099 bytes)."
