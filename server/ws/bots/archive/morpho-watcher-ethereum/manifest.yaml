max_loss_per_tx_usd: 20
max_loss_guarantee: >
  The whole action runs in ONE transaction through the bot-deployed MorphoLiquidator
  (src scratch/morpho-executor-eth/contracts/src/MorphoLiquidator.sol — identical to the
  base bot's proven contract, constructor [MORPHO, WETH, WBTC, 0, 0, UniV3 WETH/USDC
  pool]). Its liquidate() ends with require(balAfter >= balBefore + minProfit) on the
  executor's USDC balance and reverts otherwise, so any shortfall — repaid debt
  exceeding sale proceeds, failed swap, flash pull-back — rolls the whole tx back:
  worst case is gas only. On this chain (plain public mainnet, EIP-1559, no OP-Stack L1
  data fee) the gas worst case IS enforced by the transaction itself: maxFeePerGas (DERIVED each
  cycle from the latest header: basefee x 9/8 + 0.001 gwei tip, capped 17.5 gwei — revision
  8b738b25, review a1438eb0 blocker 2; the old fixed 0.2 gwei cap was era-bound: the 2026-10-30
  era charged 4.6-16.1 gwei base fee) x gasLimit (460000) ≤ 8.05e-3 ETH — ≤ ~19.5 USDC at the
  observed era maximum 16.1 gwei (within L = 20 USD; bot.js FEE_CAP_WEI/LIVE_FEE_ALLOWANCE_WEI/
  feeBound), ≤ ~0.06 USDC at the current head base fee (measured 0.039628498 gwei); the
  EXPECTED-fee leg of the profit floor (bot.js EXPECTED_GAS_WEI x (basefee + tip), expectedFeeUsd)
  prices the fee the chain actually charges, not the cap product. Entry is OWNER-ONLY,
  collateral and pools whitelisted as constructor immutables (fail-closed runtime check
  bot.js:99); the seized collateral is never approved to the pool (V3 callback pays by
  transfer, bounded by the amount seized this operation).
