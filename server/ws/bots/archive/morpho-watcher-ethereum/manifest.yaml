id: morpho-watcher-ethereum
author: earner/qwen3.8-flash-next
chains: [ethereum]
strategy: >
  Watch the two measured collateral-sellable Morpho Blue markets on ethereum (WETH/USDC
  and WBTC/USDC, 86% LLTV, USDC loan), poll borrower positions via Multicall3 (accrue +
  market + position + oracle price) every 20 s over a rolling candidate set discovered
  from position-changing logs, and when a position goes protocol-unhealthy, simulate —
  and when live, send — the bot-deployed MorphoLiquidator executor: ONE tx = Morpho
  flashLoan(USDC) -> liquidate(borrower, capped seize) -> sell ALL seized collateral on
  the measured UniV3 pool (exact-input swap, recipient = executor) -> Morpho pulls the
  flash back -> revert "NO_PROFIT" unless the executor's USDC balance rose by minProfit.
copied_from: >
  morpho-watcher-base (same protocol, same executor; port measured on the farm's
  ethereum ledger): 119 morpho_blue Liquidate events in 7d (ledger chain=ethereum
  protocol=morpho_blue; pinned-market sample 0x0969c9fde98d4c9ef51b82c7f3b5dde23fd11170befb55c052328f59edc7b94f
  block 26328590: repaid 85163224, seized 39438063296017904 WETH, debt_limited; WBTC
  samples 0x26338616-956072482/1310336).
  Scan math, sizing chain and executor are copied from morpho-watcher-base (protocol-
  identical); the swap leg was RE-measured for Uniswap V3 (POSITIVE = exact-input
  amountSpecified per IUniswapV3PoolActions — an earlier -seized encoding was exact
  OUTPUT and reverted every fork swap SWAP_FAILED, fixed and proven 2026-11-04;
  zeroForOne per pool orientation, MIN_SQRT_RATIO+1 lower limit).
capital_usd: 16
principal_usdc: 0
funding_note: "Fixed 2026-11-10 (review 247ca663 / attempts 757 and 760): the gate sends the non-principal part of capital as Ethereum NATIVE gas at promotion, so the old 400 funded the bot with 400 USD of ETH while bot.js refuses every send while the native wallet is above LIVE_BALANCE_CAP_USD = 18 USD (preflight compares the fixed wei balance against the cap re-valued at each cycle's fresh ETH/USD). Fund 16 USD native gas float instead: fits its own 18 USD preflight with ~12 pct headroom so a small ETH/USD rise after promotion does not idle the bot, and at the measured current-era fee (head base fee 0.0396 gwei; a 310k-gas send costs ~0.02 USD) the float covers hundreds of liquidation sends; high-fee eras fail closed on the expected-fee floor, not on the wallet. Attempt-760 fix (run 414adfd0): the trailing inline comments on the numeric capital_usd and principal_usdc scalars are REMOVED — the gate-ctl:348 capital float parser read the whole line and crashed promotion with a ValueError before funding (inbox/meta/2026-11-10-morpho-capital-inline-comment.md); this note carries their prose. principal_usdc 0: the flash loan sources the repay (fork proofs run from executor USDC 0 -> +3.711168 and 0 -> +0.158935), so no USDC principal is funded (decisions/human/2026-11-09-promote-criteria.md funds principal_usdc only where its guard is fork-proven)."
