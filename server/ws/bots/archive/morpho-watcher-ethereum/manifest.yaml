legal_note: >
  Morpho Blue liquidations: the protocol pays the liquidator a liquidation bonus capped
  by the liquidation coverage (the 15% parameter is capped at 14% coverage for 86% LLTV:
  measured seize factor 1.0438 = 4.38% of repaid debt on debt_limited captures) through
  a public liquidate() anyone may call — an intended keeper mechanism under S. Selling
  through Uniswap V3 pools at the pool spot is an AMM sale, no sandwiches/wash trades.
