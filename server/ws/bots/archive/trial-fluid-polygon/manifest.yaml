id: trial-fluid-polygon
author: builder/claude-mythos-5-2
chains: [polygon]
strategy: "trial: Fluid VaultT1 liquidations on Polygon, WBTC/USDT0 vault; a 40 s timer asks the vault what is liquidatable, then one tx flash-swaps USDT0 out of a UniV3 USDC/USDT0 pool, calls the vault's open liquidate(), sells the WBTC for USDC, pays the pool and keeps the rest as native USDC, or reverts."
copied_from: "takers of Fluid LogLiquidate (topic0 0x80fd9cc6...) on vault 0xdf16adaf80584b2723f3ba1eb7a601338ba18c4e, e.g. tx 0xd7b188d7e7871e0c8285a50d077350ae20176d32dcbcea63ea6de63bd9b678a7 (block 97322803, 455.148420 USDT0 for 745424 sat, taken one block after it became takeable at a 133 gwei priority fee) and tx 0x5c3cdd0a73eb726db9abb4239e0022701a4d20545940a777e7ac6fc0b9a4d2e1 (liquidator 0xf000042d2b48921c, 1630.83 USDT0, gross 80.91 USD); attempts:2246, attempts:2254."
capital_usd: 20
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialFluidTakeUsd.take reverts NoProfit() unless its USDC balance grows by at least minProfit after the pool is paid (scratch/trial-fluid-polygon/contracts/src/TrialFluidTakeUsd.sol:77), so a lost attempt costs gas only. Gas cap per send in bot.py:59-72 (constants) and attempt() bot.py:262-320: gasLimit = eth_estimateGas x 1.30 (refused above 3,000,000), maxFeePerGas <= 0.40 USD / (WPOL/USDC pool price x 1.15, or 1 USD per POL before the first read) / gasLimit; the bot does not send unless gasLimit x maxFeePerGas is < 1 USD and the simulated USDC profit is above it, and passes that cap (in USDC) as minProfit. Priority-fee bid: at most 40% of simulated gross (BID_SHARE), never above the fee cap, so in practice at most 0.40 USD per send."
expected_value: "trial, win rate to be measured live. 7 d competition (attempts:2246, 2133; scratch/trial-fluid-polygon/windows.json): 90 Fluid vault liquidations on Polygon by 8 liquidator contracts, 72 on this vault, all on 2026-11-12 to 11-15. Of 71 probed, 66 were taken in the block they became takeable and 5 one block later (4 of the 5 with 11,350-88,396 gwei priority bids, one at 133 gwei); none waited 2 blocks. Usual winner priority fee 73-177 gwei (median 121), take cost about 0.03 USD. Gross sample median 18.25 USD, max 80.91; fork gross on two of the mainnet takes 24.15 and 22.44 USDC against about 0.015 USD gas at the usual fee. With a 40 s timer the bot aims only at what the fast takers leave (the 1-in-71 class); a late attempt is normally not sent at all because the simulation already reverts. A lost send costs up to 0.40 USD, so 20 USD covers at least 50 lost sends."
executor: scratch/trial-fluid-polygon/contracts/out/TrialFluidTakeUsd.sol/TrialFluidTakeUsd.json
executor_args: "{bot}"
executor_note: "constructor(address bot) only. The reviewed TrialFluidTake of trial-fluid-arbitrum with the profit token made an argument. take(Take) takes the vault, debt token, collateral token, profit token (USDC here), an unwrap flag (false here), the flash pool (USDC/USDT0), the sale pool (WBTC/USDC), the debt amount and minProfit as call arguments; nothing is baked in. No principal: USDT0 comes from an exact-output UniV3 swap whose USDC leg is paid inside the swap callback after the liquidation. The callback accepts only the pool set for that step (pool1, then pool2 during the collateral sale) and the peer is cleared at the end; the USDT0 approval to the vault is the exact amount and reset to 0 (no-return-value tokens handled by a low-level call); swap direction is read from pool.token0(). Profit goes to the bot wallet as USDC; USDT0 dust (1 unit in the proofs) goes to the wallet too. receive() exists for the unwrap variant. Owner-only sweep(token) for recovery."
fork_evidence: "scratch/trial-fluid-polygon/proof.py (lease; per case reset polygon to the parent block of a mainnet take, deploy, fund, guards, success, repeat; release); result in scratch/trial-fluid-polygon/proof-result.json. Success 1 (reset 97322802, fork block 97322807) 0xc2832374ff4dffbac6746a32974ba4ca52ab637763d0ea6c96e68c7f8132882f: 455.148462 USDT0 repaid, owner +24.145912 USDC, native -0.111245 POL gas (gas 533,821). Success 2 (reset 97325777, fork block 97325779) 0xf263d027b399255d2170992b90d0283c2755030aaf7ce7be82cfb5993734261b: 414.827856 USDT0 repaid, owner +22.437459 USDC (gas 480,942). Executor left with 0 USDC / 0 USDT0 / 0 WBTC / 0 native / 0 allowance in both. Reverts: the same take repeated after the success (nothing to take) 0xd54055b1f4998990490f913c7d697b5d9aad69bdafc60ac14c127f60159ff194 (FluidVaultError 0xdcab82e2, gas 340,822) and 0x0b3b6e59c7dbde8d3ee26d2eb50a76d8524b0726d3c4838c4b64ecf638774992; minProfit above the gain 0x00fbef8093a26d38546fe981711126e4e9b6356a38236d36832e542c5842a7bc (NoProfit 0xe39aafee, gas 580,470); non-owner 0x0c84747fca72dbbd9d7a23953da9f3f02c802affe188bf1792486d051994401d (NotOwner 0x30cd7471); debt token equal to profit token 0x54192c34ee5005283fab623f8c94023654ea06985ef8acf699dee88edbfc9c31 (BadArgs 0x4e70768d). Paper override = eth_getCode of that deployment (executor-runtime.hex). scratch/trial-fluid-polygon/selftest.py runs the bot's own read/attempt paper path on the fork at 97322802: opportunity + paper_sim success with 24.145917 USDC, gas limit 831,074 from eth_estimateGas, fee cap 0.40 USD; at the relay head the vault reads (0,0)."
awaited_events: "No event subscription: a 40 s timer. A take needs a BTC price drop that pushes vault positions over the liquidation threshold, and a pool price that leaves a margin over the vault's oracle price. Last takes on this vault: block 97,334,454 (2026-11-15 01:45 UTC); 72 in the last 7 days, all on the falling-price days 2026-11-12 to 11-15. At placement the vault reports nothing to liquidate; the next takes need the next BTC drop."
good_signs: "logs/bot.jsonl: a scan heartbeat row every 10 min with pol_usd near the market price (0.08 at placement); scan rows with takeable debt on falling-price days, followed by opportunity + paper_sim success; live: send_result rows with result won."
bad_signs: "loop_error on every poll; read_budget rows (the 90,000 CU cap is reached); scan rows with takeable debt that always end in simulate_revert (always late, or route / oracle margin problem); live send_result lost with blocks_after_winner >= 1 on every send (the expected failure of a timer bot: close as blocked_infra); opportunity_skip estimate_gas_failed in live."
rpc_reads_per_min: "1.5: one Multicall eth_call every 40 s; about 4 more reads per opportunity"
alchemy_cu_per_day: "about 56,200 (0.030 USD): 2,160 polls x 26 CU; opportunities add about 100 CU each; hard cap 90,000 in code; no feed filter"
legal_note: "Fluid's liquidation penalty is a public payout to any caller of liquidate(); no mempool watching, the bot reads mined state on a timer; it bids a priority fee for a public reward."
expedite: false
