id: trial-jarvis-jeur-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: Jarvis jEUR / EURC fixed-rate wrapper round trips on Base (Morpho flash USDC, buy jEUR in the jEUR/USDC pool, unwrap 1:1 to EURC, sell EURC in the EURC/USDC pool, and the mirror route with wrap), sent when the gain beats the signed gas cap"
copied_from: "executor 0x1470dab4a3fb2951d1c2e3525628c0ca65352ac9 driven by EOA 0x62e88a85c3b9ca889448744234665c6e0e706f73: take 0xd3024e21d9ab15a7f20fabdef46de95c975189afe13e3aa13703c3f57a9fa526 (block 59,541,259, unwrap direction, +0.144132 USDC for 993,388 gas) and 0x45045e34f17b5ba7613daf11bd7b94d5a64b53d5fa4789a90b7e02c6cd860c4b (block 59,507,079, wrap direction)"
capital_usd: 0.75
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Enforceable bound per send: Base charges the L1 data fee and the operator fee at inclusion and no signed field bounds them, so the worst case of one send is the bot wallet's native balance, and that balance is kept under 1 USD. (1) Funding: capital_usd 0.75, all native, no top-up; wins are paid in USDC, so the native balance only shrinks. (2) Code: bot.py:337-344, live branch of take(): right before the signer call it reads the wallet's eth_getBalance and uses ETH/USD from eth_usd() (bot.py:212, slot0 of the Uniswap V3 WETH/USDC 0.01 pct pool, refused outside 300-20,000), and wallet_bound() (bot.py:226) refuses the send while balance x price is 0.95 USD or more (WALLET_MAX_USD, bot.py:74): it logs opportunity_skip wallet_at_or_above_usd_bound and never signs. ETH would have to rise 26.7 pct above the funding price before the funded wallet reaches that line; then the bot stops sending. Inside that bound a lost attempt costs gas only: JeurWrapArb.sol:56-63 take() is owner-only and reverts NoProfit unless the executor's USDC balance grew by minProfit after the Morpho flash loan was repaid (minProfit 0 is refused), then pays the USDC to the bot wallet; no principal leaves the wallet. Expected cost, not the bound: bot.py:291-352 take(): gas limit = eth_estimateGas x 1.20 + 200,000 (refused above 2.5m), maxFeePerGas = latest base fee x 1.05 + tip (refused above 0.1 gwei), cap = gasLimit x maxFeePerGas + 1e11 wei L1 allowance (line 314), converted to USDC at the pool price; sent only if the simulated gain is at least cap x 1.10 + 1 (lines 316, 325) with minProfit set to that (line 317) and the exact guarded call simulated at the signed gas limit (line 332); refused when the cap is 0.90 USD or more at a 4,000 USD/ETH reference (line 321); typical cap 1.1e13-2.6e13 wei = 0.02-0.05 USD. Priority fee bid: at most 20 pct of gross (tip x gas limit), never more than the gross can afford after the margin, between 0.0001 and 0.05 gwei (lines 311-312), passed explicitly to the signer (line 252)."
expected_value: "Trial: send-measured win rate, worth cents a day. Competition, 7 days to block 59,546,824 (scratch/flash2-cb04/jarvis7d.json): 552 Wrap / Unwrap events at the wrapper; one active arbitrage operator (executor 0x1470dab4, 119 events in 2.55 days = about 47 a day; its earlier executor 0x20c22ae5 31; a second executor 0xd9afda02, 195 events, silent for 3.8 days); sampled takes kept 0.010-0.144 USDC against about 0.013 USD gas, tx index 2-88, priority fee 0.002-0.03 gwei. Windows for its 24 newest takes, the farm executor's probe() as a code override at earlier blocks (scratch/trial-jarvis-jeur-base/series.py, series-windows.json): a gain of 0.019 USDC or more (about what one send costs to sign) was visible at the parent block for 19, 1 s before for 9, 3 s for 7, 10 s for 3, 30 s for 2, 90 s for 1; at 0.023 USDC or more: 18, 6, 4, 0, 0, 0. The incumbent sends once the gain passes about 0.03 USDC and lands within 0.2-0.6 s of the jump: out of reach. The bot aims at the small gains that stand below its threshold: 3 of 24 takes (about 6 a day) had about 0.023 USDC standing 10 s or more, real gas about 0.010 USD (1.1m gas at 0.005 gwei), so about 0.01 USD net per win. Paid entries in the last 7 days whose gross exceeds one attempt's gas: 0xd3024e21 (+0.144 USDC against 0.013 USD gas) and 0x7993d638 (+0.055 USDC against 0.013 USD gas); not every incumbent take clears its gas (0x59e64660 kept 0.036 USDC and paid 0.062 USD at a 0.029 gwei tip). Feed trigger (review fix 2026-11-20, scratch/trial-jarvis-jeur-base/feedtrigger.py and feedtrigger.json): over the 24 h to block 59,724,791 the jEUR/USDC pool emitted 113 Swap logs in 112 blocks; the bot's probe() as a code override 6 blocks (1.2 s; feed delivery is about 1.0 s) after each showed a gain of 0.019 USDC or more on 3 of them, 50 blocks (10 s) after on 4, 200 blocks (40 s) after on 5; at 0.023 USDC or more: 2, 2, 2 (e.g. event block 59,556,897: 0.022473 USDC at +1.2 s and still at +10 s; 59,555,917: 0.133818 at +1.2 s). So the event trigger with its two follow-ups shows the bot about 3-5 sendable gaps a day, about what the 30 s timer was expected to see."
executor: scratch/trial-jarvis-jeur-base/contracts/out/JeurWrapArb.sol/JeurWrapArb.json
executor_args: "{bot}"
executor_note: "Constructor takes only the bot owner. take(Route, amount, minProfit): the flash lender (Morpho Blue), the flash token, jEUR, EURC, the wrapper, both pools, the unwrap rounding unit and the direction are call arguments in the Route struct; nothing is baked in and there is no setup tx. probe(Route[], amounts[]) is for eth_call only: owner-only, it tries every (route, amount) through trial(), which always reverts (Trial(gain) or the underlying error), so nothing changes and nothing is paid even if it were sent. The Morpho callback (onMorphoFlashLoan) and the swap callback (uniswapV3SwapCallback) check msg.sender against the lender / pool set for this call and cleared after it. Approvals are for the exact amount: the wrapper approvals are reset to 0, and the repayment approval to Morpho is used up by Morpho's transferFrom in the same call (allowance 0 after, checked in the fork proof). After the profit check take() sends the jEUR left by the unwrap rounding (under 1e12 wei) and any EURC to the owner, then the whole USDC balance: the executor holds no token after a success (fork: all balances and allowances 0). Profit reaches the bot wallet as USDC. Live code reads EXECUTOR_ADDR_BASE or EXECUTOR_ADDR only; paper mode uses an eth_call / eth_estimateGas code override taken with eth_getCode from the Base fork deployment (executor-runtime.hex, sha256 beb79314...b90f; source sha256 0e313b18...26d4)."
fork_evidence: "scratch/trial-jarvis-jeur-base/proof.py <parent block> (one Base fork lease per run: reset, deploy the artifact with --args, fund the owner, probe, non-owner, guard, success, repeat, leftovers). Run 1, reset 59,541,258 = parent of incumbent take 0xd3024e21 (proof-result-59541258.json): probe() from the owner answers gains for the unwrap route (0.0387 / 0.0815 / 0.1369 / 0.1441 USDC at 300 / 700 / 1,500 / 2,715 USDC, 0 at 5,000 and 10,000, 0 for wrap), from a stranger it reverts. Non-owner take revert NotOwner 0xac169d0459a4eb729676fb0efa3eb4658b12de887b3255483d8d21f6956d10ee. Guard revert NoProfit(144127, 1e12) 0x0c425f49ef2fd78ebf70cd8857386c452c6c4f5fdf0be0c2d37e10fefc70c7af, 1,271,516 gas, owner USDC delta 0, owner -0.000127155 ETH at the fork's 0.1 gwei. Success unwrap at 2,715 USDC 0xa5b8c5d80164acdf03d94b714d1390026c65fc7ba22e95c869ed9e2bb4edeea6 block 59,541,262, 1,100,420 gas, owner +0.144127 USDC (the incumbent's take in block 59,541,259 kept 0.144132), gas 0.00011 ETH at the fork's 0.1 gwei (0.0000055 ETH at the live 0.005 gwei). The same call repeated reverts (0x5092c45f...); probe afterwards is 0 everywhere; executor USDC / jEUR / EURC / native 0 and the three allowances 0; the owner holds 670,146,313,207 wei jEUR of rounding dust. Run 2, reset 59,507,078 = parent of incumbent wrap-direction take 0x45045e34 (proof-result-59507078.json): non-owner revert 0x61744f7dd2c6c6b11dbd2164d10ef0569e68415da673ae21267f1a2fb66d0ad9; guard revert NoProfit 0xb501cf88027de762f1240893daf9264ff76f15fe9a5041c635cbe3f37b81833c, 1,340,176 gas; success wrap at 700 USDC 0x013081429b1c2c20d8bc131e3e3ccd9d953b083b0d61f965790d37a7f452c2d9 block 59,507,082, 1,123,603 gas, owner +0.032107 USDC; repeat reverts NoProfit(612, 16053) 0xb54e9dac7134d17a8ba1c658411646484a184b96376b75b8ad8ae3a4592625c2; executor balances and allowances 0. The bot's own check() replayed through the relay (selftest.py, which also checks both hand ABI encodings against cast): paper_sim success at 59,541,258 (unwrap, 2,000 USDC, gross 0.145120 USDC, cap 0.047 USD), at 59,507,078 (wrap, 1,200 USDC, gross 0.035759, cap 0.025 USD) and at 59,446,159, 51 blocks before the incumbent took a small gap (unwrap, 700 USDC, gross 0.022957, cap 0.0207 USD); nothing_to_take at 59,500,000 (selftest-*.jsonl). On 2026-11-19 the fork lane was over its daily budget: the first try of run 2 failed in fork deploy with the public node's archive 403 and passed on retry."
awaited_events: "Feed /logs on base: address 0x9a8f6327dd5a9fc87ee9be06cf7fd2e069efb62b (the jEUR/USDC pool), topic0 0xc42079f94a6350d7e6235f29174924f928cc2ac818eb64fed8004e115fbcca67 = Swap(address,address,int256,int256,uint160,uint128,int24); one filter, base had 8 of 16 at 2026-11-20 00:42Z. Every jEUR trade and every round trip (the incumbent's included) emits one: 113 logs in the 24 h to block 59,724,791 (scratch/trial-jarvis-jeur-base/feedtrigger.json), last at block 59,709,994. On an event the bot runs one probe() eth_call; on gap, a removed log, HTTP 429 / 503 or a connection error it re-reads state the same way (bot.py main(), then no feed call for 60 s after an error); a 300 s safety poll runs next to the feed; a look that leaves a gain standing below the send line is repeated 10 s and 40 s later (bounded: a follow-up arms nothing). The EURC/USDC pool Swap (about 4,100 a day) also moves the gap but is a busy event and is not subscribed: gaps opened only by it are seen by the safety poll or a follow-up. Next: any time someone trades jEUR, about 5 an hour."
good_signs: "opportunity and paper_sim rows with gross_usdc_units above min_profit_usdc_units; live send_result won with positive net_usd; wins on gains of 0.02-0.03 USDC that stood for seconds. feed rows followed by a check within a second; feed_subscribed after start."
bad_signs: "opportunity_skip wallet_at_or_above_usd_bound (the wallet is worth 0.95 USD or more: ETH rose 27 pct or someone sent it ETH; no send until that changes), wallet_below_gas_cap (the 0.75 USD is spent: the trial is over), eth_usd_unreadable; only gross_below_gas_cap rows for three days (the standing gains stay under the bot's cost line: close as blocked_infra, fee short), repeated simulate_revert or estimate_revert, every send lost with blocks_after_winner of 5 or more, read_budget rows, loop_error rows from probe, the wrapper's rate or lending module changing (probe turns to 0 for days), the jEUR/USDC pool losing its liquidity. feed_error rows that keep coming (429: the base filter slots are full or the feed is out of CU; the bot then re-reads once a minute), feed_gap every few minutes, no feed row for 12 h while the pool trades."
rpc_reads_per_min: "About 0.3: one probe() eth_call per feed event (113 a day), per 300 s safety poll (at most 288 a day) and per follow-up (at most 2 per look that leaves a gain standing); an opportunity adds 1 eth_getBlockByNumber, 1 slot0 eth_call, 1 eth_estimateGas, 1 guarded eth_call and (live) 1 eth_getBalance plus receipt polls."
alchemy_cu_per_day: "About 22,000 CU (0.012 USD at 0.53 USD per million CU). Relay: safety poll at most 288 x 26 = 7,488; feed looks 113 x 26 = 2,938; follow-ups about 60 x 26 = 1,560; opportunities about 150 each; about 12,000, code cap 60,000 relay CU per day. Feed: 113 logs x 924 bytes x 0.04 = 4,180 CU plus about 4 CU a minute for the idle subscription = about 10,000."
legal_note: "wrap() and unwrap() are the public mint and redeem entries of the Jarvis fixed-rate wrapper and the swaps are ordinary pool trades: the arbitrage that keeps jEUR at its EURC peg. The bot reads confirmed state only, watches no pending transactions, and bids a priority fee only for its own public arbitrage; it moves no price for others to trade against."
expedite: false
