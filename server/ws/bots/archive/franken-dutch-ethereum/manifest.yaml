max_loss_guarantee: "executor.sol DutchBidder.bid enforces the WHOLE action in one transaction: it reverts unless the challenge still exists (NoChallenge), the hub Dutch offer hub.price(num) * sz / 1e18 equals exactly 0 (NoProfit, the zero-payment strategy - the hub price is 0 only from start + 2 * phase, verified from the hub source _calculatePrice), the received collateral delta equals the bid size sz >= 1 exactly (BadCollateralDelta), the ERC-20 payout transfer to the immutable owner inside the same tx succeeds (BadTransfer) and the owner token balance delta equals the gained size exactly (BadOwnerDelta) - the acquired collateral therefore reaches the bot wallet in the bid transaction itself, no separate payout tx exists. Each live transaction is bounded by signed gas: bot.py usd_fee clamps maxFeePerGas to min(20 gwei, 15 USD / (gasLimit x fresh ETH/USD)), the fresh ETH/USD read comes from the UniV3 USDC/WETH mainnet pool slot0 sqrtPriceX96 (bot.py eth_usd_price; token mapping verified on every read, implausible or failed reads decline the send), gas limit 200000; measured success gasUsed 139290 (fork proof 4); a bot-side check refuses any send whose gasLimit x maxFeePerGas x price exceeds 15 USD (bot.py USD_MAX)"
expected_value: "pool about 10 USD/day gross in 2026 (7 challenges/yr, per-event collateral 0.01-2 WETH, lead 74 attempts 477); our slice 2-4 USD/day net of gas: bids land at the 2*phase expiry edge where the Dutch price is 0, the two 2026 free grabs were unclaimed; fork success delta +0.1 WETH (about 230 USD) for zero payment, paid out to the bot wallet inside the same bid transaction (fork proof 4 owner delta exactly +0.1 WETH), so the per-bid net is one 15 USD-bounded gas payment"
