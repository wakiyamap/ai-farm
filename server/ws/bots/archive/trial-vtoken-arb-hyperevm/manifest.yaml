id: trial-vtoken-arb-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: vTokens on HyperEVM (vANSEM, vJASPER, vFLOOD and 12 more; each backed by an ERC-4626 vault priced from HyperCore) are minted with USDC and redeemed for USDC by anyone through the protocol router 0x3de2ba37, and each also trades on a small vToken/USDC V3 pool. When the pool price is away from the NAV by more than the fees, one tx uses the pool's own flash swap: the pool pays vToken, the router redeems it for USDC and the pool is repaid in USDC (or the pool pays USDC, the router mints the owed vToken with part of it and the pool is repaid in vToken); the USDC left over goes to the bot wallet, or the tx reverts. The NAV has no event, so the bot polls one eth_call of the executor's probe() every 27 s."
copied_from: "taker contract 0x615340bc41c5bda250ee8103553b4953df3b4fc6 (fn arb(address,uint256,uint256), driven by EOA 0x61c5064704a579a4c1a5978c988afa50953b9f87, pays its gain to 0xf911e2bceb7e073629d471103acb1ca507c4b24d): redeem side tx 0xab5382f3086b74e7817feaf1863c3431b3d6e9459d558a9be1862a55893aff5a (block 51,823,605, vANSEM, +0.100029 USDC, 938,576 gas at 0.162 gwei), mint side tx 0xb272e99388cbabd832757db6221a36a0705576d3b1dacebb701a525143e7b572 (block 51,823,393, +0.016557 USDC). Same router, pools and pool flash swap; changed: the swap stops at a price band chosen by simulation (0.3 / 1 / 3 pct) instead of the taker's own NAV price limit, and the gain is paid to the bot wallet."
capital_usd: 20
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialVTokenArb.run reverts NoProfit() unless its USDC balance grew by minProfit > 0 after the pool's flash swap is settled (scratch/trial-vtoken-arb-hyperevm/contracts/src/TrialVTokenArb.sol:99 and :124; a losing route already fails earlier, at the router's pull or the pool's balance check), also tx.gasprice <= maxGasPrice and a deadline (:97-98), so a lost attempt costs gas only. Gas cap per send in bot.py (constants GAS_LIMIT_MAX to GAIN_OVER_CAP) and evaluate(): gas limit = eth_estimateGas x 1.15 (at most 1,900,000), maxFeePerGas = base fee x 1.2 + bid, never above 3 gwei (1.9M x 3 gwei = 0.0057 HYPE = 0.32 USD at HYPE 56.8); no send unless that cap valued at the WHYPE/USDT0 pool price x 1.15 is under 0.95 USD and the simulated USDC gain is above it (GAIN_OVER_CAP = 1.0); minProfit is set to the cap in USDC, so the transaction itself reverts unless the gain covers its whole gas cap. Priority-fee bid: at most 5 pct of simulated gross (BID_SHARE), never above the fee cap."
expected_value: "trial, win rate to be measured live. READ FIRST: attempts:3106 (run cdd0d3e7, 2026-11-20 night, same builder model) found this same class ('LiquidV vTokens') and closed it without building: 202 takes in 7 d by the one taker, gain 11.97 USDC against 0.1675 HYPE of gas = about 0.25 USD a day net for it, router unverified, reopen only if the vTokens grow or the source is published. Neither happened; this run found the class again through its own burn census and built the bot before seeing that row (it searched protocols, not attempts). What is new since: a fork-proven take (+0.098832 USDC for 587,818 gas, a third less gas than the taker), and the taker measured as slow and not bidding (below). The class is still small: at most about 1.7 USD a day gross for everyone, so this bot is a low-priority candidate for a live trial slot and the reviewer may well park it. Competition, 7 d of router logs to 2026-11-21 03:45Z (blocks 51,220,568-51,825,368, scratch/r3c67/setscan.py and scratch/trial-vtoken-arb-hyperevm/competition.py -> competition.json): 249 mint / redeem events over 17 vTokens; taker 0x615340bc (EOA 0x61c50647) made 202 of them = about 29 atomic takes a day (vANSEM 120, vJASPER 55, vFLOOD 9, vSMARTEST 12), the other addresses in the events (0xb9a031e3 25 mints, registry 0xe13ad79d 11 first mints, five more with 1-3 events) are not atomic takers as far as sampled. Its last 26 takes: gain 0.010-0.161 USDC, median 0.026 USDC; 815k-946k gas at the base fee (0.10-1.16 gwei in 24 of 26, no fee bidding; twice it paid 4.6-5.3 gwei = 0.21-0.27 USD for a 0.011-0.014 USDC gain, so it does not check its own gas), tx index 0-13. It is slow: the vANSEM redeem gap seen by this session's proof at 03:53:36Z (0.132 USDC) was still open 2.5 minutes later (0.058 USDC in selftest.py at 03:56:08Z), and the takes on vANSEM are a median 723 blocks apart. Whole class 11.97 USDC in 7 d = about 1.7 USD a day gross (attempts:3106, the taker's own event, gain median 0.022, max 1.40 USDC); the bot's own cost per take is 590k-740k gas = 0.004-0.04 USD at 0.1-1 gwei. The bot aims at the takes above about 0.02 USDC at low base fee: a few a day, 0.1-0.5 USD a day if it wins them. Historical windows cannot be measured (HyperCore reads are not archived)."
executor: scratch/trial-vtoken-arb-hyperevm/contracts/out/TrialVTokenArb.sol/TrialVTokenArb.json
executor_args: "{bot}"
executor_note: "Deploy gas 1,302,047 on the fork, below the 2,000,000 HyperEVM cap. constructor(address bot) only (owner is immutable); pool, USDC, vToken, router, vault, direction, amount cap, price band, mint margin and limits are Route call arguments. No flash lender: the pool's own swap pays first and calls uniswapV3SwapCallback, which accepts only this transaction's pool and exact data (both cleared after the swap). The price limit is computed in the transaction from the pool's slot0 and the band, so the swap crosses few ticks (several pools have empty ranges; without a limit the swap burns all gas). Router calls use the selectors seen in the incumbent's traces (redeem 0x18ffbeca, mint 0xda2550b5, quote 0x95b6d8ab; the router is unverified) and vault.sync() 0xfff6cae9 as the incumbent does. Approvals are for the exact amounts and reset to zero. probe() is an eth_call helper that rolls every candidate back. Profit is paid in HyperEVM USDC 0xb88339cb7199b77e23db6e890353e22632ba630f; on the mint side a vToken dust of at most 0.1 pct of the size goes to the bot wallet and is not counted."
fork_evidence: "Script scratch/trial-vtoken-arb-hyperevm/proof.py (`python3 proof.py 480 3000`; output proof-fork-success.json). The vaults read HyperCore precompiles (0x0801, 0x080f), which the anvil fork lacks; the script places a fork-only replay fixture (mock/src/PrecompileReplay.sol, anvil_setCode at the precompile addresses only) that answers each input with the bytes the real precompile returned through the relay about one second earlier. Executor artifact, vTokens, vaults, router, pools and USDC are untouched. Run 2026-11-21 03:53Z, fork reset at head 51,825,861, owner 0x1111111111111111111111111111111111111111: deploy 0x47cecc367ac96b8000fbb4d306be342d07f4a8def1ad85407b52b5d2379e149c (executor 0x8f7a45ebde059392e46a46dcc14ab24681a961ea, 1,302,047 gas). Controls in the same round: probe() on the fork and the relay eth_call at latest (code override) returned the same 24 gains (vANSEM redeem band 1 pct = 98832 on both); the router quote for 1 USDC on the fork equals the live one for all four vTokens. SUCCESS 0xca14180927495eecbec7ef130e18d7492d63bb0115dfc7efc1e7b94cc039b6fb (fork block 51,825,918, status 1, 587,818 gas, run(vANSEM, redeem, cap 40 USDC, band 10000 ppm, minProfit 88948)): owner USDC 0 -> 98832 = +0.098832 USDC; after it the executor holds 0 USDC and 0 vANSEM and its allowances to the router and the pool are 0. Reverts on the same fork state, real transactions: nothing to take (vANSEM mint band 3000, probe 0) 0x6db25dc314b3484d458ccf73ded94a84bce55a527b11744a418dbbe522eedd1d reverts CallFailed(0xda2550b5, 'ERC20: transfer amount exceeds balance') = minting costs more than the pool paid; the open route with minProfit 197664 (2 x the gain) 0x4e6d6d3d9ae188fdfcf4fdded5f2cca2c96ad5c204c24977549240b2eb2b01be reverts NoProfit 0xe39aafee; non-owner 0x0c39bc87ab95771e4a251825a39ecdb69b1e8d1cb365c939d3079f837dd3fdb7 reverts NotOwner 0x30cd7471. Limits: a re-run waits for the next gap and gives other hashes; the mint side has no fork success transaction, only probe gains equal on fork and live (vSMARTEST mint 297 / 933 / 2274 units on both) and a live eth_call of run() returning 2274 (dbg.py vSMARTEST 1 30000). selftest.py: the bot's hand encoder equals cast's bytes for run() and probe(); seven live probes covered all 15 tokens. Paper runtime = eth_getCode of that fork deployment (written by proof.py)."
awaited_events: "No event: the NAV moves with HyperCore. The bot polls probe() every 27 s (vANSEM and vJASPER every poll, the other 13 tokens two per poll in rotation) and acts when a candidate's gain exceeds its gas cap. Last seen open: 2026-11-21 03:56Z (vANSEM redeem, 0.058 USDC, open for 2.5+ minutes). The incumbent takes about 29 times a day, so several gaps a day."
good_signs: "logs/bot.jsonl: a poll heartbeat every 18 min; opportunity + paper_sim rows several times a day; live: send_result rows with result won and gas_used about 590k-750k."
bad_signs: "loop_error on every poll (router or vault upgraded, or the node stopped accepting the override); read_budget before 23:00Z; opportunity_skip gross_under_gas_cap on every gap for days (base fee too high for these sizes); live send_result lost on every send with blocks_after_winner >= 0 (always late: report as blocks late)."
rpc_reads_per_min: "2.2 (one eth_call per 27 s) plus about 4 reads per evaluated gap"
alchemy_cu_per_day: "about 84,000-98,000 (0.045-0.052 USD): 3,200 probe polls x 26 CU = 83,200, plus 88 CU per evaluated gap; hard cap 98,000 relay CU/day in code, then it sleeps to 00:00 UTC. No feed filter."
legal_note: "Mint and redeem are the router's public functions at the vault NAV (a fresh address succeeds in eth_call and on the fork; seven other callers used them in 7 d) and the pools are public DEX pools; minting or redeeming against the pool price is plain arbitrage that pulls the vToken price back to NAV, the same thing the protocol's own taker does. The router, registry and taker are unverified contracts, so the functions are known from traces only; nothing beyond mint, redeem, quote and the vault's public sync() is called. The bot reads mined state only, watches no mempool and no pending transactions; it may bid a priority fee for a public opportunity."
expedite: false
