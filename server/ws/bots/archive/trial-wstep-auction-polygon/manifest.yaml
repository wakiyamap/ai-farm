id: trial-wstep-auction-polygon
author: builder/claude-mythos-5-2
chains: [polygon]
strategy: "trial: take the public FBX-for-EP curve auction of the ownerless wstEP vault (WrappedStakedEP 0xe3df997c) on Polygon when its marginal rate is above the EP price on the SushiSwap EP / FBX pair; flash swap EP from the pair, takeAuction, repay the pair in FBX, sell the FBX left into POL, all in one transaction"
copied_from: "taker EOA 0x304fa7d9a76930f037e0f3207ea31ce7bc548e87, which calls takeAuction(0.5 EP, minFbxOut) on the vault directly every 5.5-6 h, e.g. 0xe9458b54b814e7e2c66336a1cf26638ea7f79983c5122540cbdb1579965a85b8 (block 97748950, 0.5 EP for 87.99 FBX). Adapted, it holds EP and takes a fixed size on a timer; this bot holds nothing, sources the EP by a flash swap and takes the size that pays most"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "Executor take() reverts NoProfit unless the POL left after repaying the flash swap and selling the FBX is at least minProfit (contracts/src/CurveAuctionArb.sol _take(), the NoProfit line), and the bot sets minProfit = gasLimit x maxFeePerGas of that send (bot.py check(), cap, gain_of(amount, cap, gas_limit)); the executor never receives funds from the bot wallet, so a lost send costs only gas, capped under 0.95 USD at a POL price of 0.5 USD (bot.py MAX_TX_USD, POL_REF_USD, MAX_FEE_CAP_WEI 1500 gwei, GAS_LIMIT_MAX 1200000). Trial, it bids at most 1/10 of gross as priority fee, between 40 and 60 gwei (TIP_SHARE_DEN, TIP_MIN_WEI, TIP_MAX_WEI)."
expected_value: "Trial, no counted EV. Last 7 days at the entry (every log of the vault in polygon blocks 97,436,831-97,756,831, scratch/r8e72/hist.py, hist.json), 23 takes, all by EOA 0x304fa7d9, 0.5 EP each for 87.5-88.1 FBX, 5.5 or 6 h apart, gas 0.090-0.094 POL (0.007 USD). It pays about the market price, so its own takes earn nothing, but at the parent block of each of them a flash-funded take of the best size was worth 0.38-1.96 FBX before pool impact (median 0.9 FBX = 0.22 USD); on the fork at the parent of the last one the executor was paid 3.66 POL (0.27 USD) for 0.13-0.22 POL gas. Once this bot also takes, the incumbent's fixed 0.5 EP take leaves less each cycle, about 1.0-1.4 POL at the peak, so the bot aims at 2-4 takes a day of 0.08-0.25 USD each, 0.2-0.5 USD a day. The trial measures whether the incumbent keeps its timer and whether anyone else shows up."
executor: scratch/trial-wstep-auction-polygon/contracts/out/CurveAuctionArb.sol/CurveAuctionArb.json
executor_args: "{bot}"
executor_note: "CurveAuctionArb, constructor (owner) only. The auction, pay token, out token, flash pair, both exit pairs, the middle token, wrapped native, the three pair fees, the size and minProfit are call arguments. Callback uniswapV2Call checks msg.sender against the pair set for this transaction (cleared at its end) and sender == the executor. The one approval (EP to the vault) is the exact amount and reset to 0 in the same call. Profit is paid to the bot wallet as POL. probe() and sim() are eth_call helpers (owner only / self only). Runtime 5,017 bytes."
fork_evidence: "scratch/trial-wstep-auction-polygon/proof.py (one script, one lease; result proof-result.json). Reset polygon 97748949 = parent of the incumbent take in block 97748950, deploy, fund, probe, guards, success, repeat. Success 0x6475625a41b6fbdb1e18d5eee3e3e713edc5f476b69e8038f970f4d5c1cc1809 (fork block 97748953, 443,399 gas, 0.2328 EP borrowed, 42.159 FBX from the auction), owner native +3,437,067,880,702,184,431 wei after gas at 500 gwei, paid 3.658767 POL (the eth_call just before said 3.658404). Correct reverts, guard 0xe70e0ebd62c4ce6cc5ed8020dac2299c81311cb2b379d9791323127c55892366 (minProfit 1e24, NoProfit 0x31708d59, 547,292 gas), non-owner 0x41ffb0bc1b210e6f844f08c3b29fa60d3ac95a8a54dfc0558d6c6f591db7299e (NotOwner 0x30cd7471), repeat with the same size and minProfit after the take 0x290a96ec80ed25fea5ad01964299dcbea2308b35ae7bbb0440c292a06a7aa576 (reverts TransferFailed 0x90b8ec18, the auction no longer covers the pair; smaller sizes still showed up to 0.73 POL). Executor leftovers 0 (EP, FBX, USDT, WPOL, native), allowance 0. Paper path, selftest.py at 2026-11-22T09:50:16Z, relay eth_call with the code override, best size 0.119 EP pays 1.197 POL at head, paper_sim success with a cost cap of 0.314 POL."
awaited_events: "No event, accrual is the clock. The vault's FBX book grows about 15 FBX an hour; a take is worth 1.0 POL about 3 h after the incumbent's take when nobody else took. Incumbent takes on 2026-11-22 at 00:28:14Z and 06:28:14Z (block 97748950); its next is due 11:58Z-12:28Z. At 09:50Z the best take was worth 1.197 POL, so the first paper_sim is expected at once and then every look until the incumbent takes."
good_signs: "paper_sim success lines in logs/bot.jsonl in the hours before each incumbent take; live: send_result won 2-4 times a day"
bad_signs: "only building lines for 2 days (the incumbent or a new taker keeps the book below the line, or the EP price on the pair rose); live: send_result lost with winner_block within a few blocks before our send (someone else reads the same line)"
rpc_reads_per_min: 0.6
alchemy_cu_per_day: 22000
legal_note: "A public auction of an ownerless vault whose source says takers buy when their marginal rate meets the market, paid for with a flash swap on a public pair, in one transaction. No mempool watching, no reaction to pending transactions; the trigger is a timer and the confirmed state."
expedite: false
