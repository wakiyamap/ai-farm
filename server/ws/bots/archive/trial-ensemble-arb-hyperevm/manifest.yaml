id: trial-ensemble-arb-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: Ensemble (hyper_tokens) leveraged vault shares BULL and VOL, NAV versus their 0.3 pct HyperSwap V3 pool. The vaults are ERC-4626 with instant deposit and redeem at a NAV read from HyperCore. When the NAV has moved away from the pool by more than the fees, one tx flash-borrows USDC on Morpho Blue and either deposits and sells the shares on the pool, or buys shares on the pool and redeems them, repays, and pays the USDC gain to the bot wallet, or reverts. The NAV has no event, so the bot polls one eth_call of the executor's probe() every 27 s."
copied_from: "flash executor 0xb54e8debf06c26ca906d7d98eb4e01dabd9aed19 of EOA 0x5d03a3f8151d98a1bf9de604e7552caf49034ec3 (actors:278): tx 0x036bd33926b35fab3be4b09a93ed4cb9b4d84ec7f65aa8500141c19badd0b81d (Morpho flash 160 USDC, deposit, exactInputSingle, +0.1425 USDC, 468,997 gas); and the inventory contract 0x4c1e071696dc95e38033c7ffc404e38ffeb2ba83 (actors:281): tx 0x99947fd48c7fba4be4ca2e3d489b849d8c59faf128cdfc6ea7536f0cd4f465e6 (buy VOL + redeem +0.119 USDC, mint BULL + sell +0.091 USDC). Same vaults, pools and router; changed: both directions and both vaults from one flash-funded executor, size chosen by simulation (40-320 USDC)."
capital_usd: 20
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialVaultArb.run reverts NoProfit() unless its USDC balance grew by minProfit > 0 after the flash loan is repaid (scratch/trial-ensemble-arb-hyperevm/contracts/src/TrialVaultArb.sol:101 and :110; a losing route already fails at Morpho's repayment pull), also tx.gasprice <= maxGasPrice and a deadline (:99-100), so a lost attempt costs gas only. Gas cap per send in bot.py:58-66 and evaluate() (bot.py:216): gas limit = eth_estimateGas x 1.2 (at most 1,900,000), maxFeePerGas = base fee x 1.3 + bid, never above 2 gwei (1.9M x 2 gwei = 0.0038 HYPE = 0.25 USD at HYPE 65.6); no send unless that cap valued at the WHYPE/USDT0 pool price x 1.15 is under 0.95 USD and the simulated USDC gain is at least twice it (GAIN_OVER_CAP, bot.py:65); minProfit is set to the cap in USDC. Priority-fee bid: at most 20 pct of simulated gross (BID_SHARE, bot.py:64), never above the fee cap."
expected_value: "trial, win rate to be measured live. Competition, 7 d to block 51,730,945 (Deposit / Withdraw logs of the BULL vault, scratch/r93a5/vault_logs.py): inventory contract 0x4c1e0716 (driver 0x85be4c45) 1,248 fills, 948 of them in the last 3 d (316 a day); 14 evenly spaced txs report gain median 0.079, mean 0.153, max 0.579 USDC for a fee of median 0.000178 HYPE (0.012 USD), tx index 0-11, at the floor gas price in 9 of 14 (no fee auction) = about 48 USD a day gross (scratch/r93a5/profit.json). Flash poller 0xb54e8deb: 52 fills in 3 d, 0.07-0.14 USDC each, polls every 20-25 s. One measured window: at block 51,730,878 the bot's route simulated +0.2119 USDC (BULL redeem 160) and the incumbent took it 20 blocks (about 20 s) later at block 51,730,898 (scratch/trial-ensemble-arb-hyperevm/selftest-result.json). Historical windows cannot be measured (HyperCore reads are not archived). The bot aims at gaps between its own threshold (gain above its gas cap, about 0.03-0.06 USD) and the moment the incumbent fires; one lost attempt is about 620k gas = 0.02-0.04 USD at 0.4-0.83 gwei."
executor: scratch/trial-ensemble-arb-hyperevm/contracts/out/TrialVaultArb.sol/TrialVaultArb.json
executor_args: "{bot}"
executor_note: "Deploy gas 1,169,335 on the fork, below the 2,000,000 HyperEVM cap. constructor(address bot) only (owner is immutable); Morpho, USDC, vault, router, fee, direction, size and limits are Route call arguments. The Morpho callback accepts only this transaction's lender and exact data; both are cleared after the loan. Approvals are for the exact amounts and reset to zero (the Morpho repayment allowance is consumed in full). probe() is an eth_call helper that rolls every candidate back. Profit is paid in HyperEVM USDC 0xb88339cb7199b77e23db6e890353e22632ba630f: reviewer, please confirm this is the gate's configured hyperevm USDC, otherwise the gain would not be swept."
fork_evidence: "FORK SUCCESS TRANSACTION (review fix, run 702a7c3c, 2026-11-20 04:05Z): script scratch/trial-ensemble-arb-hyperevm/proof_fork_success.py (output proof-fork-success.json, run log proof-fork-success-run.txt). The vaults read the HyperCore precompiles 0x080f (margin summary) and 0x0801 (spot balance), which the anvil fork lacks; the script places a fork-only replay fixture (scratch/trial-ensemble-arb-hyperevm/mock/src/PrecompileReplay.sol, anvil_setCode at those two precompile addresses only) that answers each input with the bytes the real precompile returned through the relay at latest about one second earlier. The executor artifact, vaults, pool, router, Morpho and USDC are untouched: no code or storage override on any of them. Fixture controls in the same run: the vaults' previewDeposit / previewRedeem on the fork equal the live ones (BULL previewRedeem(1e18) 1044811 on both), and probe() on the fork returned 22279 / 15450 for BULL mint 40 / 80 while the relay eth_call at latest (code override) returned 22278 / 15449. Fork reset at head 51,738,681, live block 51,738,724, owner 0x1111111111111111111111111111111111111111. Deployment of this artifact 0x3e9145b8bb4fadf35fb35b78cfb43a35567aeaeff847f1e3e3a25b40150961f8 (executor 0x8f7a45ebde059392e46a46dcc14ab24681a961ea, 1,169,335 gas, runtime 5,159 bytes, identical to the paper runtime). SUCCESS 0xe58406f7b344cdb36df2d1419ab1e935640afb41bcab80d87bc9dde31fefb4bb (fork block 51,738,702, status 1, 494,598 gas, run(BULL, deposit and sell, 40 USDC, minProfit 21165)): owner USDC 0 -> 22279 = +0.022279 USDC; after it the executor holds 0 USDC and 0 shares, and its allowances USDC->vault, USDC->router, USDC->Morpho and share->router are all 0. Reverts on the same fork state, real transactions: nothing to take (BULL mint 160, probe 0) 0xa03e4a8e6594aed0aae5ef60ade78184d65a7d254f7325cec40d412f24c4395c reverts at Morpho's repayment pull ('transferFrom reverted'); the open route with minProfit 44558 (2 x the gain) 0xd37e0012cebd44ccfed9e06abd0670477b2ccb699feb3ad3db0ac9f271e01a08 reverts NoProfit 0xe39aafee; non-owner 0x2096b94d8e6ea8d72ea6538f78130aff44c4ca97be737d37c1975064ef8bb327 reverts NotOwner 0x30cd7471. Limits, stated plainly: the proof needs a gap open on mainnet at run time, so a re-run waits for the next one (2 to 5 min on 11-20, `python3 proof_fork_success.py 780`) and gives other hashes and another gain; fork gas includes the fixture's storage reads in place of the precompile cost (mainnet estimate for the same route class 470k-620k). Earlier evidence still valid: proof.py live (proof-live.json), relay eth_call with code override at block 51,730,878: run(BULL, buy and redeem, 160 USDC) returns +0.211948 USDC, minProfit +1 reverts NoProfit; selftest.py: the bot's hand encoder equals cast's bytes. Paper runtime = eth_getCode of the fork deployment."
awaited_events: "No event: the NAV moves with the perp price. The bot polls probe() every 27 s and acts when a candidate's gain exceeds its gas cap. Last seen open: block 51,730,878 (2026-11-20 about 01:58Z, +0.21 USDC). The incumbent fills about 316 times a day, so a gap of some size opens every few minutes."
good_signs: "logs/bot.jsonl: a poll heartbeat every 18 min; opportunity + paper_sim rows several times an hour; live: send_result rows with result won and gas_used about 450k-650k."
bad_signs: "loop_error on every poll (vault upgraded, CircuitBreaker policy now refuses the executor, or the node stopped accepting the override); read_budget before 23:00Z; opportunity_skip gross_under_2x_gas_cap on every gap for a day (base fee too high for these sizes); live send_result lost on every send with blocks_after_winner >= 0 (always late: report as blocks late)."
rpc_reads_per_min: "2.2 (one eth_call per 27 s) plus about 4 reads per evaluated gap"
alchemy_cu_per_day: "about 86,000-98,000 (0.046-0.052 USD): 3,200 probe polls x 26 CU = 83,200, plus 88 CU per evaluated gap; hard cap 98,000 relay CU/day in code, then it sleeps to 00:00 UTC. No feed filter."
legal_note: "Deposit and redeem are the vault's public ERC-4626 functions at its own NAV (maxDeposit for a fresh address is 25,000 USDC) and the pool is a public DEX pool; minting or redeeming against the pool price is plain arbitrage that pulls the share price back to NAV. The bot reads mined state only, watches no mempool and no pending transactions; it may bid a priority fee for a public opportunity. The vault's keeper functions are not used."
