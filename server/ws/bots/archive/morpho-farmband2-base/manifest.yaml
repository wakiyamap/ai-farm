max_loss_guarantee: "executor reverts unless its loan-asset balance ended higher by minProfit AND sweeps the full gain to the owner wallet in the same tx (bot's copy of MorphoFarmLiquidator.sol: require balAfter >= balBefore + minProfit then transfer(owner, profit)); worst case is the 1.3M-gas tx at the 1 gwei maxFeePerGas cap in bot.js (~0.4-1 USD at signing-time ETH/USD), gas-only because any failure reverts the whole tx"
expected_value: "measured 30 d farm-band recount (run 34539444, attempts:1076): 11 sampled captures repaid 100-1500 USD, gross 4.384 pct x repaid = 4.5-237 USD per capture, sum gross ~164 USD / 30 d = ~5.5 USD/day class gross. Countable pinned-monitor EV (fix round 2 recount, run 9ca761d0, README C-1 eligibility table): $0/day - of the three window-measured captures (now all pinned and checked), one is liquidatable at C-1 (1-block eligible->capture, never counts in EV per decision 2026-11-13) with a measured fork wallet delta +21.11 USD and 0.13 USD gas at the block's baseFee, and two become liquidatable only inside their capture block (0-block, same-block race). The route's remaining gap is speed in the wrapper-crossing block, not detection: 221 incumbent wallets take the class flow (235 captures/day) in the crossing block. Honest caveats: the monitored markets liquidate thousands of DISTINCT borrowers per 30 d (cbBTC 3990 events / 3952 borrowers) so the pinned lists reach only a bounded slice even at speed; the debt queue's queued principal is invisible to the deployed getters (it transfers inside the capture liquidate)"
