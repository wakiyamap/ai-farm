executor_note: "same 8-arg ctor as the archived morpho-farmband-base: morpho + collateral whitelist cbZEC(dead)/cbBTC/cbXRP/WETH + the three legacy pools. The lead-157 monitor set extends the whitelist at runtime with three owner setup txs (setPoolAllowed cbBTC/USDC fbb6eed8, setPoolAllowed cbETH/USDC fdebedc9, setCollateralAllowed cbETH 2ae3f1ec, selectors cast-keccak verified): gas-only, sent once at startup (st.whitelisted). cbXRP markets sell dual-hop cbXRP -> WETH -> USDC through the ctor pools 170b6bfc + 6c561b44 (mid = WETH); the cbXRP leg-1 pool is not registered in the Base UniV3 factory (probe returned no pool at any fee tier) - it is the incumbent-learned pool from the archived proof and stays unproven at a live capture this session"
fork_evidence: "scratch/morpho-farmband2/proof3.py under a base fork lease (lease base 20, release on exit; run 9844be7d 2026-11-13): reset 55986766 = capture 55986767 (tx 0x49956387bc518cd90f8811f65e22e3f430cf86f244735b1e626f02af24a3de75, cbZEC/USDC, repaid 172.14 USD) minus 1 - the borrower holds VISIBLE debt at C-1; the farm-band debt-queue captures (e.g. block 56677288, borrower 0x85049883 repaid 102.09 USD in tx 0x4812fa9f - the 0xefee0ed6 leg proof2.py paired it with is a different tx of the same block) show the deployed position getter borrowed = 0 at their C-1 tag (the queued debt only transfers on interaction) and the executor's C-1 liquidatability check on them reverts, so a queued-debt capture is not a proof capture. proof3.py: fund owner 1 ETH (fund BEFORE deploy: the deploy sender is the fork account 0x1111..1111 whose fork balance at the older tag is 0), deploy MorphoFarmLiquidator with the EXACT manifest ctor args (ctor_args verified byte-equal to executor_args; executor 0x8f7a45ebde059392e46a46dcc14ab24681a961ea), send1 success tx 0x753719e782b3e1c64a66f9fc65a745cb5b2024d15f6891f0d74656d1d8e978cf gasUsed 819743: owner-wallet USDC delta +21.669873 USD swept in the same tx, executor leftover 0 (zero value left in the executor); send2 (same calldata, position now healthy) reverted, tx 0x850f0398473bc789f4ad1c6b89ab5081fc5737b47e39e33d98c18266648a2adb; evidence json scratch/mb157b-proof.json FIX ROUND 2 (run 9ca761d0, review 1095): scratch/mb157b-proof4.py reruns the SAME fork recipe with the FINAL bot calldata shape (the bot's own seizure quote 683,345 -> swap amount 682,661, flash = debt + 0.1 USDC, minProfit 1.00 USDC) on the two C-1-proven captures: capture A reset 53486210 (borrower 0x63a905f4, debt 495.547 vs maxDebt 495.117 at C-1) success tx 0x6734f2586642c7f8ae98a31089ef7cd0919b9e20bdcf3ecb27c40997bb914699 gasUsed 602,606, owner-wallet USDC delta +21.107550 USD swept in the same tx, executor leftover 0, gas 0.126 USD at the block's baseFee 8.061 gwei + 0.1 gwei tip at $1934; the same state with minProfit = flash x 100 reverts NO_PROFIT (guard tx 0x380f59a5f3785dabf6f05fa6bb6f3c338b27d05fdb100e35c3107c97f95cb922); capture C reset 56677287 (borrower 0x85049883, the queued-debt capture) reverts \"position is healthy\" (tx 0xc54961082fd1ef952ff1a6203cb0c70ee2bcad45d1de0c1a96455b893a23749a) - the C-1 liquidatability gate the bot applies. Lease base 25 taken for the run only, released on exit; evidence json scratch/mb157b-proof4.json"
awaited_events: "AnswerUpdated on the pinned aggregators: cbBTC/USD -> 0xeb3ad4395924b76eb64b3d6ababa0b62875b1a1f, WETH/USD -> 0x83f3425a5b32655dc645f7f4e422dd60e9741794 (both from the archived bot, verified against measured captures), cbETH/USD -> 0x71e021bc2e8a709b72ac7b6036e5b2bf30f263d0 (discovered this run: its AnswerUpdated at block 54926149 precedes the cbETH-market capture 54926448, window 300 blocks); the cbXRP markets (0xd4a903dc/0xfdfecf85) carry NO pinned feed this run - their 2026-11-04 price crossings at block 54923231 produced zero AnswerUpdated logs in blocks 54923225-54923238 (probe), the wrapper update is not aggregator-triggered - those markets fall back to the 5 min safety poll. Last farm-band capture: block 56677288 (2026-11-12, cbBTC, repaid 102.09 USD); burst days 2026-11-04/08/12 with multi-day drought between"
good_signs: "startup logs aggregators discovered non-empty, eth_usd_from_pool a sane USD number (1.9e3 order at the current price), paper fork executor at a real address + owner whitelist sent (three status-1 setup txs), market(bytes32) borrow totals (words 2/3) + position(bytes32,address) (borrowShares word 1, collateral word 2) checks with NON-ZERO debt/maxDebt and the feed-scaled usd price, feed long-poll cycles without cycle errors, a LIQUIDATABLE record with executorCalldata + gasCapUSD + gate, sim ok + simTx + simWalletDeltaUSD > 0 on the fork and simGuard no-profit-revert on the de-armed minProfit"
bad_signs: "aggregators discovered {} after a restart; every market check market-reverted or position-reverted (selector/decode misalignment); every check debt zero with nonzero borrowShares (a totals-word regression); LIQUIDATABLE with debt/maxDebt ratio > 10; sim ok with simWalletDeltaUSD <= 0 (the sweep-to-owner broken); simGuard no-profit-revert-MISSING; sim revert POOL_NOT_ALLOWED_1 persists after the whitelist txs (the owner setup broken); feed logs arriving while no scan runs (the long-poll loop broken); a 429/503 feed response that does NOT produce a relay gap re-read"
rpc_reads_per_min: 0.35
alchemy_cu_per_day: "~0.19M CU/day = ~0.10 USD at 1M CU = 0.53 USD: feed maintenance ~4 CU/min ~ 6K + delivered AnswerUpdated for the 3 pinned feeds ~2000 events/day x ~886 bytes x 0.04 ~ 71K + safety full scan every 5 min (288/day x ~(3 market getters + 24 pinned position getters + cbXRP no-price fallback) reads x 10 CU) ~ 85K + feed-update scans and gap re-reads. Feed CU adds events/day x log bytes x 0.04 per the wiki infra/feed rule"
legal_note: "public liquidation bonus on a lending protocol (Morpho seizes at the oracle price with the protocol-intended bonus, liquidate() is permissionless); no fees to anyone, no role gate; eligibility-to-capture windows measured THIS run from the capture's parent-block state and the Morpho oracle wrapper price at tags C-1/C (README table, scratch/mb157b-measure.json + mb157b-windows.json + fork proof4): 3 pinned sampled captures/30 d -> 1-block 1 (cbBTC 53486211: liquidatable at C-1, taken at C; 2 s blocks then) and 0-block 2 (cbETH 54926448, cbBTC 56677288: the wrapper crosses the liquidation threshold inside the capture block C) -> per decision 2026-11-13 (>= 2 blocks counts) the countable pinned-monitor EV is 0/day and the route is speed-blocked in the crossing block, NOT detection-blocked. The raw feed answer preceded the captures by 454/43/9 blocks (454 x ~2 s, 43 x ~0.2 s...) - a feed bot sees the drop long before the protocol allows the capture. The cbXRP-market windows (9-40 s) stay uncounted until their trigger event is identified (their aggregator produced zero AnswerUpdated at the 2026-11-04 crossing) and the 300 s safety poll is slower than those windows"
