copied_from: "morpho-farmband-base (archived 2026-11-12) same executor and borrower pins, reopened per decision 2026-11-13-blocked-infra-feed-retriage; incumbent pattern: ledger morpho_blue.liquidate base (221 caller wallets; the biggest incumbent 0x9cbb82b9 took cascade captures at block 56677288 (the fork-proof capture is tx 0x49956387bc518cd90f8811f65e22e3f430cf86f244735b1e626f02af24a3de75 at block 55986767, the archived bot's proof capture)"
