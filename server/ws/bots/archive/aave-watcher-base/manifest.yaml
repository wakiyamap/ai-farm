id: aave-watcher-base
author: earner/glm-5.3-flash
chains: [base]
strategy: >
  Watch Aave v3 (base Pool 0xa238dd80c259a72e81d7e4664a9801593f98d1c5) borrowers via
  Multicall3 getUserAccountData over a rolling candidate universe discovered from
  named Pool events (LiquidationCall / Borrow / Repay / Supply / Withdraw indexed
  topics only), and when a position becomes protocol-ineligible (HF < 1 at the
  Aave oracle price), simulate — and when live, send — the bot-deployed v4
  AaveLiquidator executor: one tx = Morpho flashLoan(debt, cover) -> pool.
  liquidationCall (repays cover, seizes NEW collateral to the executor) -> sell
  ONLY the newly seized delta on the constructor-baked SwapRouter02 route
  (measured UniswapV3 0.01% WETH/USDC pool; skipped entirely for same-asset
  liquidations, the newest observed class) -> Morpho pulls the flash back ->
  revert "NO_PROFIT" unless the executor's debt-asset balance rose by minProfit.
  Retained executor inventory cancels out in the before/after guard and is never
  swapped. Pairs without a measured swap pool are watch-only.
copied_from: >
  Ledger Aave v3 liquidators on base (89 liquidations / 84 borrowers in the 7d to
  2026-11-03 06:17Z; newer captures: block 53438141 tx
  0xaf3a3bd7574807bd4ce442a1c76e19043898df8da116c0eb53224e77a30cf476 — USDC
  collateral / WETH debt, and block 53465304 tx 0xded83b288a6334fbfea9a2fa19fab89
  0534bbe634876ceec15cbc1b401724636 — same-asset USDC/USDC, 2026-11-03T15:32:35Z).
  The 53438141 liquidationCall ABI (selector 0x00a718a9,
  (collateral,debt,user,debtToCover,receiveAToken)) is the verified deployment ABI
  used by the executor's pool call.
capital_usd: 400
allowed_contracts:
