id: trial-moonwell-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: flash-funded Moonwell (Base) liquidation of mUSDC debt (collateral WETH, cbBTC, AERO, VIRTUAL, MORPHO, cbXRP, VVV, EURC or USDC), after a confirmed LiquidateBorrow on the feed or a timed getAccountLiquidity scan"
copied_from: "Public Moonwell Base liquidators, each calling its own executor (attempts:1467): the fork-proof case is tx 0x76a90dcdffd1b0cd4f973fc4299f3e3e4921260f193cc720e7fe7cafd3078659 (block 57520473, 36.32 USDC repaid on borrower 0x2e29d4ad, cbBTC seized); other takers: 0xd9fffdf0c4b18fb7e225da15b2af9f88e55676c3 in tx 0x1ab2dfbef7ae0a9fbd16d9fbe013bcea8922f4cbeb07a2ee9971473205416106, 0x27071f478d4961ddeeacfc2da8564751791a6831 in tx 0x9dc28be9d91735d27cedeaeed8322b7ee20e4469baefc808e09a1f057fab2bfb"
capital_usd: 15
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialMoonwellLiquidator.sol:76 reverts NoProfit unless the USDC balance grew by at least minProfit, and :77-87 pays the whole gain to the bot in the same tx; Compound-style error codes from liquidateBorrow and redeem are checked (:99, :104), so a lost attempt costs gas only. bot.py:373-378 sets the fee ceiling so maxFeePerGas x gasLimit + 0.02 USD L1 allowance < 0.90 USD (never above 0.5 gwei) and requires simulated gross > that signed gas cap, and :383 sets the on-chain minProfit to the gas cap. Priority fee bid is at most 50% of the simulated gross (BID_SHARE, bot.py:374). No principal: the repay is a Morpho flash loan repaid in the tx; the bot wallet holds gas only (15 USD, under the 18 USD Base cap)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7 d (attempts:1467): 492 LiquidateBorrow in 412 txs by 67 senders on the Moonwell core markets, 381 of them on mUSDC (286,520 USDC repaid; median repay 3.69 USDC, 123 events >= 50 USD); winners each use their own executor, tips 0.0009-64 gwei scaling with size. Parent-block check of 9 recent mUSDC captures above 20 USDC (attempts:1682): 4 were already short at the parent block and 300 blocks (60 s) earlier, 5 flipped inside the capture block. The bot aims at the first group (accounts left under water for seconds to minutes); the proof case paid 2.43 USDC for 0.02 USD of gas."
executor: scratch/trial-moonwell-base/contracts/out/TrialMoonwellLiquidator.sol/TrialMoonwellLiquidator.json
executor_args: "{bot}"
executor_note: "Owner-only liquidate(morpho, job, repay, minProfit, unwrap). Debt market, borrower, collateral market, both underlyings, swap router, fee tier, wrapped-native token and flash lender are all call arguments; constructor takes the bot address only; no setup transaction. The flash callback accepts only the lender set for the running call (cleared at the end). Approvals are exact and reset to zero (mToken, router); Morpho pulls exactly the approved repayment. Native received on an mWETH redeem is wrapped before the swap. Profit leaves as USDC (the bot always passes unwrap=false with USDC debt). Live address from EXECUTOR_ADDR_BASE or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/trial-moonwell-base/proof.py (lease, reset base 57520472 = parent of the historical capture 0x76a90dcd..., deploy artifact, fund owner, guards, nothing-to-take, success; output proof-result.json). Success 0x98a5f6032cd94ede938630a8a49899d8127eb609f97031dac7a6f9d117b4299d block 57520477, gas 1304650, owner +2.433237 USDC, native -11707878348163 wei (gas), borrower mUSDC debt 72.640885 -> 36.320460, executor USDC/cbBTC/mcbBTC/WETH/native and mToken/Morpho/router allowances all 0. Correct reverts: NoProfit guard 0x5e4675331d405610dd3d2996bf6994b5b7fa6c08e1403108179adbc234584169 (0xe39aafee); non-owner 0xba8b204af5b37f6e434cf7cb280f57a952953f25e309c4c534a77509f4118ca2 (NotOwner 0x30cd7471); nothing to take 0x51e6eacf44d1a9fe8e11c4d1d061eba1ccea430a934d7b5a0cf457183f08f852 (debt-free account, LiquidateFailed(3) 0x7f268b0c, gas 301525, owner USDC delta 0). The success lands at parent+5 because deploy and the three reverts consume fork blocks. scratch/trial-moonwell-base/selftest.py: bot calldata equals cast calldata; relay eth_call at 57520472 with the paper code override returns 2.433237 USDC."
awaited_events: "mUSDC 0xedc817a28e8b93b03976fbd4a3ddbc9f7d176c22 LiquidateBorrow on the feed (about 54 per day, last in the ledger at block 58420499 on 2026-11-17); every event triggers a scan of the 100 mUSDC borrowers with the least excess liquidity. Full scan of all known mUSDC borrowers every 10 min, near-list poll about every 5 min, new borrowers from Borrow logs every 10 min. Next occurrence is not predictable (price moves)."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is)."
bad_signs: "No opportunity row in 7 days; every send lost by many blocks; simulate_revert on every underwater account (bad debt without seizable collateral, empty market cash); read_budget rows (80k CU cap hit)."
rpc_reads_per_min: "about 1.4: 11 Multicall eth_calls per 10 min (full scan of ~1,070 borrowers in batches of 100), one near-list call per 10 min, one eth_getLogs + eth_blockNumber per 10 min, plus about 10-14 calls per examined underwater account (6 h cooldown when no profitable route)"
alchemy_cu_per_day: "about 62,000 relay CU/day (full scan 11 x 144 x 26 = 41,184; near poll 144 x 26 = 3,744; discovery 144 x 70 = 10,080; attempts about 20 per day x 350 = 7,000) plus feed about 9,000 (54 events/day and idle long-polls) = about 71,000 CU/day = 0.04 USD/day at 0.53 USD per 1M CU. The code stops relay reads at 80,000 CU per UTC day."
legal_note: "Public Moonwell liquidation incentive for repaying under-collateralised debt, open to any caller. Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions. Bidding a priority fee for a public reward is in scope of the trial decision."
expedite: false
