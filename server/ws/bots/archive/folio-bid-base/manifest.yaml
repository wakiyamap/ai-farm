id: folio-bid-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "Flash-funded bids on Reserve Folio (index DTF) rebalance Dutch auctions on Base (LCAP, BGCI and four smaller Folios): Morpho WETH flash, buy the deficit token on a V3 pool, Folio.bid, sell the surplus token for WETH, repay, gain paid as native ETH; sends at a lower profit line than the incumbents, so earlier on the falling price"
copied_from: "Public bidders of the 2026-11-10 rebalances: 0xffed10c65dc46fe70f10d679781ebe4e2395dc12 in tx 0x2e702edcd3cb1b1aed56bf710529a73e1a432d505d262e4d337555f48f8e7d6f (block 55680402, BGCI auction 89, cbBTC for SOL, Balancer flash + PancakeV3, kept about 0.00081 ETH; the fork-proof case); 0xbcfe47ec9b86947f2ee43726246c5cef47d6a97a via 0xc1a7804726bcf18faa4ee05aed45762a3d992176 (17 of the last 40 bids); 0xc0ffeebabe5d496b2dde509f9fa189c25cf29671 via 0x16e41af5e034113802d06064fbeb020cc3d47b19 (10); 0xeab09e192f4c104c03679da0bae449efee4e1a21 (6); 0xa35854d1df04d5fad7d46e276d357bbebfa7cca5 (5)"
capital_usd: 10
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.5
max_loss_guarantee: "Executor FolioBidTake.sol:60 reverts NoProfit unless native + WETH ends at least minProfit above the start (and strictly above it), and :62 pays the whole balance to the bot as native ETH in the same tx, so a lost or late bid costs gas only. bot.py:445 caps gasLimit at 1,500,000 (MAX_GAS_LIMIT, :85) and fees() caps maxFeePerGas at 0.1 gwei (MAX_FEE_WEI, :83): maxFeePerGas x gasLimit <= 0.00015 ETH (about 0.27 USD at 1810); the Base L1 data fee of the measured incumbent bid was 1.2e11 wei (0.0002 USD). bot.py:430-434 requires simulated gain >= max(MIN_NET_WEI 0.0003 ETH, 3 x the gas cap), :450 requires gain > this send's gas cap, and :453 sets the on-chain minProfit to that gas cap. No principal: the WETH is a Morpho flash loan repaid in the tx; the wallet holds ETH for gas only (10 USD, under the 18 USD Base cap). Fixed 0.001 gwei tip, no fee bidding."
expected_value: "About 0.4-1.4 USD/day averaged over a month (one rebalance day per Folio per month), 12.8-41 USD per rebalance day; the evidence is one rebalance day, so the range is wide. Measured: 14 d to block 59,023,848 hold 59 public bids, all on 2026-11-10 (BGCI auctions 86-89, LCAP auction 13; attempts:2082). scratch/folio-bid-base/selftest.py 100 300000000000000 replays the bot's own pipeline (getBid, routes, executor simulation with the paper code override) at historical blocks for each of the 59 (selftest-result-line300000000000000.json, per-bid table in README): 24 count under the seconds race rule (the bot's 0.0003 ETH line was met 7.4-168.4 s before the incumbent's bid, median 33.8 s; counted = at least 6 s, i.e. T + R to L plus R), 5 are may_try (3-6 s), 4 are races, 19 never reach the line before the incumbent (its route or line is better), 7 are not takeable through the bot's routes. Gain of the 24 counted lots at the first block the line is met: 0.02281 ETH (41 USD at 1810.43) if every later lot is still offered after an earlier take; 0.00709 ETH (12.8 USD) if only the first take per token pair per auction is counted (18 pairs). Gas per bid 682,048 x 0.006 gwei = 0.0076 USD. Cadence: BGCI rebalance nonce 16 and LCAP nonce 8 over their lifetimes, both last on 2026-11-10, so the next is expected around 2026-12-10. Not counted: the 0.117 ETH the same lots show at the parent block of the incumbents' bids (the bot would have taken them earlier and cheaper), and the 5 may_try lots. Line choice measured once: 0.00012 ETH gives 32 counted but 0.02056 / 0.00362 ETH (selftest-result.json), so 0.0003 ETH is used."
executor: scratch/folio-bid-base/contracts/out/FolioBidTake.sol/FolioBidTake.json
executor_args: "{bot}"
executor_note: "Owner-only run(morpho, weth, flashAmt, steps, minProfit). Folio, auction id, tokens, routers, pools (fee tiers) and the flash lender are all call arguments; constructor takes the bot address only; no setup transaction. onMorphoFlashLoan accepts only the lender set for the running call (cleared at the end). Steps are generic calls built by bot.py build_steps(): approvals are exact (or patched to the executor's balance) and consumed or reset to zero inside the tx; after the fork success the executor holds no WETH, sell or buy token and no allowance to router, Folio or Morpho. Gain leaves as native ETH to the owner. Live address from EXECUTOR_ADDR_BASE or EXECUTOR_ADDR only; the paper address is used with a code override and never in live mode."
fork_evidence: "scratch/folio-bid-base/proof.py 140 (lease, reset, deploy artifact, fund owner, non-owner, guard, success, nothing-to-take, release; output proof-result-140.json, ok true). Reset base 55680262 = 140 blocks before the incumbent bid 0x2e702edc... (block 55680402), so that the success lands at fork timestamp 1794326443, 13 s before the incumbent's block: success 0xb99c2b1e4fb8d9f952bc81f3651946da31d39840bd9f23e47c20ab11bc51b222 block 55680266, gas 682048, bid 306,528 sat cbBTC for 2,704.78 SOL on BGCI auction 89, owner +670152133367468 wei net of 4170538002944 wei gas (1.21 USD), executor balances and allowances all 0. Correct reverts: NoProfit guard 0x15f13b655e4ca4a74b6c81ecba576923003880bd3f2531851afb5203c0eac42a (minProfit 1 ETH, selector 0x31708d59, owner delta = gas only); non-owner 0xda7afc3c4896add33f3f9000cde01522f885028e5eaeeb218f995d605bb4b152 (NotOwner 0x30cd7471); nothing to take 0xc2dc3e5be44a9c2e49d1ed716ba073277b50d0aed62450ad6e68247d9d09b9f8 (same plan on the closed auction 88, StepFailed 0x6f43605f, owner delta = gas only). proof.py 60 (proof-result-60.json, first plan shape) also succeeds. scratch/folio-bid-base/selftest.py: bot calldata equals the proof's cast calldata; 59 historical bids replayed through the bot's functions by relay eth_call with the paper code override. scratch/folio-bid-base/smoke.py: the bot's active path with latest pinned to block 55680380 logs auction_open, opportunity and paper_sim (SMOKE OK)."
awaited_events: "A new auction on a watched Folio (nextAuctionId() rises; polled every 60 s through one Multicall). Last: 2026-11-10 12:24-15:24Z (BGCI auctions 86-89, LCAP auction 13, 59 public bids). Next: the next monthly rebalance, expected around 2026-12-10; the smaller Folios may rebalance at other times."
good_signs: "auction_open and routes rows on a rebalance day; opportunity / paper_sim rows with sim_profit_wei above the line tens of seconds before a public AuctionBid on the same pair; in live a send_result won with a positive wallet delta."
bad_signs: "auction_open without any opportunity row (routes missing or the incumbents lowered their line); only below_line rows until a public bid takes each lot; send_result lost three times in a row (someone bids lower still); no_route on most pairs; no auction_open by 2026-12-20."
rpc_reads_per_min: "idle: 1 (one Multicall eth_call per 60 s). During an open auction (15-30 min, about 5 per rebalance day): about 40 (per 6 s tick: one getBid Multicall, one eth_getBlockByNumber, up to 2 executor simulations)."
alchemy_cu_per_day: "idle day about 37,500 relay CU (1440 x 26) = 0.02 USD/day at 0.53 USD per 1M CU; a rebalance day about 150,000 (5 auctions x 300 ticks x about 98 CU), about once a month. The code stops relay reads at 200,000 CU per UTC day. No feed subscription."
legal_note: "Public Dutch auction of a Folio rebalance, open to any bidder by design (bid() has no role); the bot buys at the posted price and sells on public pools in the same transaction. Timer polling of confirmed state only; no mempool watching, no reaction to pending transactions, no fee bidding."
expedite: false
