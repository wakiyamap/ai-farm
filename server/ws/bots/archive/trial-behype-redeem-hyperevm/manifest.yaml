id: trial-behype-redeem-hyperevm
author: builder/claude-mythos-5-2
chains: [hyperevm]
strategy: "trial: buy beHYPE (Hyperbeat liquid staking token) on its WHYPE V3 pools whenever a pool sells it under the WithdrawManager's instant-withdrawal value (BeHYPEToHYPE less the 30 bps instant fee), withdraw it instantly in the same transaction (flash swaps, no principal), keep the difference as HYPE"
copied_from: "operator A EOA 0xab24fbe3c1f2dd9f80f699ad85134c9259611697 through 0x8b4b490335f2a9988353b0e37392b35ed4b6994c (tx 0x0ca5c314acbfc27a3bd8f85b420aa1bc00cfa3e4d5d6fa77c89d907731fc30e6, block 51826805: Morpho flash loan of 20 WHYPE, beHYPE bought on V3 pool 0x6801b1db and Curve-style pool 0x2786cd87, WithdrawManager.withdraw(19.906 beHYPE, instant), kept 0.3385 WHYPE before 0.0034 HYPE gas); operator B EOA 0x9240b56ee52b82ab2df5fcb7b599561a55e99d28 through 0x0418f780 (2 takes of 1.5 beHYPE at blocks 51826808 and 51826810, 0.021 WHYPE each). They borrow or hold WHYPE; this bot pays the pools from the withdrawal inside the swap callbacks instead."
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 0.95
max_loss_guarantee: "Gas only. InstantRedeemArb.take reverts NoProfit unless its WHYPE balance grew by at least minProfit, and the bot sets minProfit = gasLimit x maxFeePerGas of that send (bot.py check(): cap = gas_limit * max_fee, passed as min_profit to take_calldata), so an included send either pays more than its own gas cap or reverts and costs gas. A send happens only when the simulated gross > 1.3 x that gas cap (SEND_MULT). Caps in bot.py: MAX_FEE_CAP_WEI 7 gwei, GAS_LIMIT_MAX 1,400,000 (under the 2,000,000 hyperevm limit), so at most 0.0098 HYPE = 0.59 USD a send at HYPE 60.66 USD, and MAX_TX_USD 0.95 at a 90 USD reference price. Priority fee bid: at most 1/10 of the simulated gross, never above 2 gwei (TIP_SHARE_DEN, TIP_MAX_WEI). No principal: the pools hand out the beHYPE first and are paid from the withdrawal."
expected_value: "Trial: measures the win rate by sending. Last 8 days (700,000 blocks to 51,876,309; scratch/r3b62/be_scan.py -> be-scan.json, be_pool.py): 14 instant withdrawals, 6 of them arbitrage takes by two operators in ONE burst, gross 0.5566 WHYPE, gas 0.0158 HYPE, net 0.541 HYPE = 32.8 USD at 60.66 USD. The burst: one sale of 63 beHYPE into pools 0x6801b1db and 0xf777ead0 at block 51826560 left them 2.9-4.4 pct under the instant value; first take 41 s later (04:05:41Z), the largest take (0.3385) 241 s later, the next (0.1413) 317 s later, a 0.55-1.4 pct gap still open 600 blocks later and pool 0x6801b1db stayed 1.0 pct under until block 51829746 (04:57:14Z, 52 min after the sale). The takers paid 2.9-6.9 gwei because the base fee itself was 5.8 gwei at the first take and 0.94 gwei 8 min later (block headers, scratch/r3b62/ts.py); nobody outbid anybody. The bot's 7 gwei fee cap means it waits while base fee x 1.25 is above 7 gwei. Aim: the part of a gap still open at this bot's next 35 s look. About 4 USD a day averaged over a week with one such sale, zero in a week without. At placement no pool is under value (widest gap 0)."
executor: scratch/trial-behype-redeem-hyperevm/contracts/out/InstantRedeemArb.sol/InstantRedeemArb.json
executor_args: "{bot}"
executor_note: "InstantRedeemArb(address bot), Solidity 0.8.24, 3,426 runtime bytes, deploy 795,307 gas on the fork (hyperevm limit 2,000,000). take(manager, token, wnative, legs[], minProfit) is owner-only: nested V3 flash swaps (one per pool, each with its own sqrtPriceLimit and maxIn); in the innermost callback it approves the manager for exactly the beHYPE held, calls withdraw(amount, true, 0), resets the approval to 0 and wraps the HYPE received; each pool is paid from that; then NoProfit unless the WHYPE balance grew by minProfit (> 0), unwrap, native to the owner. Manager, token, wrapped token, pools, directions and limits are call arguments; nothing is baked in, no setup tx. The callback is the fallback (any V3 fork's callback name) and only accepts the pool that take() is calling at that moment (_expected, set before each swap, cleared at the end). Constructor arg = the bot wallet only. The Curve-style pool 0x2786cd87 (120 beHYPE) is not used: no flash swap there."
fork_evidence: "scratch/trial-behype-redeem-hyperevm/proof.py (one lease, about 20 s; result proof-result.json). Head fork 51876602, real txs. TWO fork-only fixtures, said plainly: (1) PrecompileReplay at the HyperCore read precompiles 0x0805 and 0x0801, which StakingCore.getTotalProtocolHype() reads and the anvil fork lacks; it answers with the real precompiles' bytes read through the relay at latest in the same run; control getTotalProtocolHype fork = live = 165480.379177968405306193 HYPE. (2) Seller: sold 24 beHYPE taken from the wbeHYPE wrapper's balance into pools 0x6801b1db (20) and 0xf777ead0 (4). No executor, protocol or token code is overridden. Deploy 0x3a88da03... (795,307 gas); non-owner 0x2ffe189e... reverts NotOwner; guard 0xf11b344d... (minProfit 1e24) reverts NoProfit(0.028758 WHYPE, 1e24), owner delta = gas only; success 0x5e956c5b... block 51876612, 347,400 gas: owner native +0.028063317 HYPE after 0.000695 HYPE gas (2 gwei), paid 0.028758116981000607 = the eth_call value exactly, 3.5583 HYPE paid out by StakingCore, executor leftovers 0 (WHYPE, beHYPE, native, allowance); repeat 0xe722fde2... reverts (SPL, nothing left). A re-run gives other hashes (head fork). No historical run: the relay cannot run the precompile reads at old blocks (recorded in proof-result.json). selftest.py: the bot's own read and check() in paper mode at head (no gap, 1 eth_call) and with skewed prices (the relay simulation with the code override answers 0, logged below_interest)."
awaited_events: "Somebody selling beHYPE into a WHYPE pool instead of withdrawing (a liquidation of beHYPE collateral, a routed sale). Last: block 51826560 (2026-11-21 04:05:00Z, block timestamp; one sale of 63 beHYPE, pools back at value by 04:57:14Z). Before that, 7 days without a take. Next: unknown."
good_signs: "paper_sim success lines; live send_result won with net_wei > 0; opportunity lines whose gross is well above cap_wei"
bad_signs: "send_result lost several times in a row (somebody takes within one look); simulate_revert step=guard on every opportunity; loop_error 'withdraw manager getter failed' (a getter or the HyperCore precompile read stopped answering); instant_avail_wei near 0 (rate limit or low watermark: instant withdrawals closed); fee_bps raised above 30"
rpc_reads_per_min: 1.8
alchemy_cu_per_day: 66000
legal_note: "Public instant withdrawal open to every holder (8 unrelated senders used it directly in 8 days) with the protocol's own 30 bps fee paid to its treasury, and public pools. No mempool watching, no reaction to pending transactions: the bot reads confirmed state on a timer. Buying a token below its withdrawal value and withdrawing it is plain arbitrage; it moves pool prices toward the protocol's value. The protocol's rate limiter and low watermark bound what anyone can withdraw instantly; the bot stands down when they are used up."
expedite: false
