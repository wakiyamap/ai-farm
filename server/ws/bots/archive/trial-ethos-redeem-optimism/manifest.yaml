id: trial-ethos-redeem-optimism
author: builder/claude-mythos-5-2
chains: [optimism]
strategy: "trial: buy ERN below par on the Velodrome ERN/USDC pool with a flash loan, redeem it at par for WETH on Ethos Reserve, sell the WETH, keep the USDC difference, all in one executor call"
copied_from: "OP Mainnet EOAs 0x6ce08b79f97a96cd843035b3d909f1b0853ee5fc (router 0x9873df52c288673ffbed7d45a39e2c6622798e30, 21 takes in 7 days) and 0x67f51077ed4923ece0c1d461afbe19146ae03870 (router 0x69f1844f11d5efe376fd713ed9abf9ae1a83db7b, 10 takes); traced take 0x33f6f2bedba957c23853a45ac8dcc1fb20bc342aa33ff11cef11a1df9a7e3ce1 (block 159710628)"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "EthosRedeemTake.sol take() is owner-only and reverts NoProfit unless the executor's USDC balance grew by minProfit inside the same transaction (flash loan repaid in it); the gain is transferred to the bot wallet as USDC. bot.py check(): gas limit = eth_estimateGas x 1.25 (max 2,000,000), maxFeePerGas = 2 x latest base fee + tip (refused above 0.1 gwei), signed cap = gasLimit x maxFee + 1e11 wei L1 allowance, refused at 0.90 USD or more; it sends only when the simulated gross exceeds that cap, with minProfit = cap + 1 micro-USDC, after simulating the exact guarded call at the signed gas limit. Typical cap 0.004 USD. Priority fee: at most 2,000,000 wei per gas and never more than 15% of the simulated gross (BID_SHARE). Native funding 5 USD, below the 18 USD OP Stack cap; no principal (Balancer V2 flash loan, 0 fee)."
expected_value: "Trial: send-measured win rate, no counted EV. Competition, 7 days (blocks 159,422,043-159,725,031; scratch/trial-ethos-redeem-optimism/tm-logs-7d.json): 31 redemptions = 4.4 per day, all by two EOAs (21 and 10), each with 15, 20 or 25 USDC, tx index 1-177, priority fee 0.001 gwei; net 0.023-0.033 USDC per take against 0.0015-0.0019 USD gas (attempts:2307). Whole pot about 0.13 USD/day; the bot aims at whatever share it wins. The incumbents wait for about 0.02 USDC (calldata minimum 22,085 micro-USDC; gain one block before each take 18,921-62,734). At this bot's threshold (gain >= 4,000 micro-USDC at 5 or 15 USDC; scratch/trial-ethos-redeem-optimism/windows.py -> windows.json, sampled 1/15/30/90/300/900/1800 blocks before each take) 17 of 31 cases were takeable at least 30 s before the incumbent took them, 10 at least 3 min, 3 at least 10 min; the other 14 appeared within the last 30 s. The bot therefore aims at the earlier, smaller gain (0.004-0.02 USDC per take)."
executor: scratch/trial-ethos-redeem-optimism/contracts/out/EthosRedeemTake.sol/EthosRedeemTake.json
executor_args: "{bot}"
executor_note: "Constructor takes the bot owner only. take(Route,minProfit): every target (flash vault, USDC, buy pool, ERN, TroveManager, price feed, collateral, trove, sell router, fee tier) is a call argument. receiveFlashLoan accepts only the vault set for the duration of take() and cleared after it. Approvals are for the exact amount and reset to 0 in the transaction. The partial-redemption NICR hint is computed on-chain from getEntireDebtAndColl and fetchPrice, so a stale off-chain hint cannot cancel the redemption. Live code reads EXECUTOR_ADDR_OPTIMISM or EXECUTOR_ADDR only; paper mode uses an eth_call code override taken from the fork deployment."
fork_evidence: "scratch/trial-ethos-redeem-optimism/proof.py (one optimism fork lease: reset to 159,710,627, the parent of the incumbent's take; deploy the artifact with --args; fund; result proof-result.json). Success 0x9a5fcdae0a86f277bb261b554ea10bb32d54323de12e75742630719f4eaa924f block 159,710,631: 15 USDC flash loan, owner +23,414 micro-USDC (the incumbent got +23,374 in block 159,710,628), 814,171 gas, executor left with 0 USDC / ERN / WETH / allowances. Guard revert NoProfit(23414, 1e12) 0xdc5e3a6f40a47b88717982ebc0b932d47286fed010ac6db0e18146ee60622696, owner USDC delta 0. Non-owner revert NotOwner 0xc3779393cf558fc48b288cd28912c130b5fbd02d84766964717396051910e274. Nothing left to take: the same call repeated right after the success reverts, 0x12190a89c6001ce78c6422855748192ef430b50d7f15da749f3a1004a81f7ee4, owner USDC delta 0. The bot's own check() replayed through the relay (selftest.py): paper_sim success at 159,710,627 (15 USDC, gross 23,374, cap 0.0038 USD), nothing_to_take at 159,710,640."
awaited_events: "Sync(uint256,uint256) on the Velodrome ERN/USDC pool 0x605cce502dee6bd201b493782e351e645d44abbb through the feed (372 in the last day) plus a 120 s timer, since the redemption fee decays and the WETH price moves without a pool event. Last incumbent take 2026-11-18 16:40 UTC (block 159,710,628); 4.4 per day over 7 days, so the next is expected within hours."
good_signs: "opportunity rows with gross_usdc above min_profit_usdc, paper_sim success; live send_result won with a positive USDC delta."
bad_signs: "Only nothing_to_take checks for several days (ERN back at par or the redemption fee above the discount), every send lost to the two incumbents, simulate_revert rows, or read_budget rows."
rpc_reads_per_min: "About 1.5: every 120 s and on pool Sync events (at most one check per 10 s) two eth_call (lowest trove) and one eth_call probe; an opportunity adds 6 eth_call sizes, one fetchPrice eth_call, one eth_getBlockByNumber, one eth_estimateGas and one final eth_call."
alchemy_cu_per_day: "(720 timer + about 372 Sync) checks x 78 CU = 85k worst case if every Sync lands apart from a timer check; measured cadence is closer to 60k. Opportunities (about 5 a day) add 250 CU each. Code cap 80,000 relay CU/day (0.042 USD/day at 0.53 USD per million CU). Feed: one /logs filter (pool Sync), about 372 events a day."
legal_note: "redeemCollateral is the protocol's public par redemption, open to any ERN holder; the pool purchase and the WETH sale are ordinary swaps. The bot reads confirmed state only, watches no pending transactions and moves no price beyond its own 5-40 USDC trade."
expedite: false
