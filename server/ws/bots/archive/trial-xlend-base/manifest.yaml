id: trial-xlend-base
author: builder/claude-mythos-5-2
chains: [base]
strategy: "trial: flash-funded XLend (Extra Finance, Aave v3 fork) Base liquidation (USDC or WETH debt; WETH, cbBTC, USDC, cbETH, wstETH or AERO collateral), after a confirmed LiquidationCall on the feed (XLend or Aave v3 pool) or a 60 s near-HF scan"
copied_from: "Router 0x5ac9bc14376bf2727c6211960cf3cec1e2f295bd, which took all 7 XLend Base liquidations of the last 7 days: tx 0xac759210fc31901e93898a0dcb5da01b606f71aa352bb20823f19da1943cac53 (block 56778471, sender 0xd9fffdf0c4b18fb7e225da15b2af9f88e55676c3, the fork-proof case), 0x2258017c9e19e99e7a4ba25cbc2806ca229da893a657817b290f987a4de4a41a (sender 0xe319d3a838bcc59f797d8a0a56962ca7c16bcf56), 0xf5956fb6500af5d0ca006bf41f12611c56b56306d7de7d3fcb74fe880bc72bbf (sender 0x82885e6f08ce179087e829352319adcfeb1c7903)"
capital_usd: 15
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "Executor TrialXlendBaseLiquidator.sol:70 reverts NoProfit unless the debt-token balance grew by at least minProfit, and :72-81 pays the whole gain to the bot (USDC, or ETH for WETH debt) in the same tx, so a lost attempt costs gas only. bot.py:358-363 sets the fee ceiling so maxFeePerGas x gasLimit + 0.02 USD L1 allowance < 0.90 USD (never above 0.5 gwei, bot.py:73-75) and requires simulated gross > that signed gas cap, and :368 sets on-chain minProfit to the gas cap. Priority fee bid is at most 50% of the simulated gross (BID_SHARE, bot.py:76 and :359). No principal: the cover is a Morpho flash loan repaid in the tx; the bot wallet holds gas only (15 USD, under the 18 USD Base cap)."
expected_value: "Trial: win rate measured by sends, no counted EV. 7 d to 2026-11-18 (attempts:2047): 7 LiquidationCall events in 5 txs, all through one router (0x5ac9bc14, 3 sender EOAs), tx index 2-9, tips 0.083 / 0.149 / 0.102 / 1.471 / 0.001 gwei. Three cases (40-209 USD debt) were under water 2-4 blocks (0.4-0.8 s) before the take, one flipped inside its capture block, and the dust users of block 58096109 stayed under water for more than 100 minutes. 5 of the 7 events had USDC debt (reachable by this bot). The bot aims at takes the router is late for and at users left after a cascade; the proof case pays 6.81 USDC for about 0.005 USD of gas, and the bot would bid a 0.446 gwei tip there (the winner paid 0.149)."
executor: scratch/trial-xlend-base/contracts/out/TrialXlendBaseLiquidator.sol/TrialXlendBaseLiquidator.json
executor_args: "{bot}"
executor_note: "Owner-only liquidate(morpho, job, cover, minProfit, unwrap). Pool, borrower, collateral, debt token, swap router, fee tier and flash lender are all call arguments; constructor takes the bot address only; no setup transaction. The flash callback accepts only the lender set for the running call (cleared at the end). Approvals are exact and reset to zero (pool, router); Morpho pulls exactly the approved repayment. Profit leaves as USDC or native ETH. Live address from EXECUTOR_ADDR_BASE or EXECUTOR_ADDR only (exit if unset); the paper address is used with a code override and never in live mode. Source is a renamed copy of trial-aave-base's executor (same logic), compiled separately."
fork_evidence: "scratch/trial-xlend-base/proof.py (lease, reset base 56778470 = parent of the historical capture 0xac759210..., deploy artifact, fund owner, guards, success, exhausted, release; output proof-result.json). Borrower 0x74e49b3e3fcb2b2d01995c48087d9a71ed347d1a, cbBTC collateral, 209.25 USD of USDC debt, HF 0.999995. Success 0xd733ad5a548957d6098f14bdd4568bb61fdef31f5a473ece0d546439439317c4 block 56778474, gas 673330, owner +6.810296 USDC, native -4212368876509 wei (gas), HF after 1.1531, executor USDC/WETH/cbBTC/native and pool/Morpho/router allowances all 0. Correct reverts: NoProfit guard 0xc9a288e46fb9c47cad4943fa58da76a15299fe3c54e7ba772e7edacf970ba697 (0xe39aafee, owner USDC delta 0); non-owner 0xea0e6c3245629f8631d0c5b6570e236ef2e61631d14385ec05c5b61cfd6b55f2 (NotOwner 0x30cd7471); nothing left to take 0x1c8b55e362310510c8a5fdc09288cbae11943da4e748e70b44294a7c4d9ac568 (second call after success, pool Error 45, owner USDC delta 0). The success lands at parent+4 because deploy and the two guards consume fork blocks. scratch/trial-xlend-base/selftest.py (selftest-result.json): bot calldata equals cast calldata; relay eth_call at 56778470 with the paper code override returns 6.810298 USDC; attempt() replayed at that block logs opportunity and paper_sim; the head revert is recognised as healthy."
awaited_events: "LiquidationCall on the feed from the XLend Pool 0x09b11746dfd1b5a8325e30943f8b3d5000922e03 (about 1 per day; last at block 58096109, about 2026-11-16) or from the Aave v3 Base Pool 0xa238dd80c259a72e81d7e4664a9801593f98d1c5 (wake-up signal only, about 37 per day); each event triggers a scan of the 200 nearest-to-1 health factors. Safety scan of the near list about every 60 s, full universe (1,015 borrowers) hourly, new borrowers from Borrow/Withdraw logs every 10 min. Next occurrence is not predictable (ETH or BTC price moves)."
good_signs: "opportunity rows with gross above the gas cap; in live a send_result won with a positive wallet delta; send_result lost rows with blocks_after_winner of a few blocks (shows how late the farm is)."
bad_signs: "No opportunity row in 7 days; every send lost by many blocks; simulate_revert on every underwater user (routes or unsupported debt); read_budget rows (75k CU cap hit)."
rpc_reads_per_min: "about 1.2: one Multicall eth_call per minute (near scan), 6 per hour (full scan of 1,015 users in batches of 200), one eth_getLogs + eth_blockNumber per 10 min, plus up to about 20 calls per detected opportunity"
alchemy_cu_per_day: "about 51,000 relay CU/day (near scan 1440 x 26 = 37,440; full scan 6 x 24 x 26 = 3,744; discovery 144 x 70 = 10,080) plus feed about 7,000 (38 events/day and idle long-polls) = about 58,000 CU/day = 0.03 USD/day at 0.53 USD per 1M CU. The code stops relay reads at 75,000 CU per UTC day."
legal_note: "Public liquidation bonus of an Aave v3 fork for repaying unhealthy debt, open to any caller. Reacts only to confirmed on-chain logs and timed scans; no mempool watching, no reaction to pending transactions. Bidding a priority fee for a public reward is in scope of the trial decision."
expedite: false
