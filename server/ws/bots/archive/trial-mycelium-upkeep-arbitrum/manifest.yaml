id: trial-mycelium-upkeep-arbitrum
author: builder/claude-mythos-5-2
chains: [arbitrum]
strategy: "trial: take the hourly public upkeep reward of the Tracer / Mycelium Perpetual Pools PoolKeeper on Arbitrum (about 0.8 USDC.e per upkeep to whoever calls first in the due second), with a burst of no-priority-fee executor calls timed around the due second; the reward is sold to USDC in the same transaction"
copied_from: "EOA 0xac7fa3f3a20365aa60cab977979f8c4388c6d21d (direct calls at 0.6 gwei priority, 6 of the last 44 takes, e.g. block 525,544,232 tx index 1 ahead of two 1.85 gwei bidders); keeper contracts 0x84450c615a80ce985d4909ccc17ae33ef829323a (sender 0x72e5d0033d10ba0b526104c4c9ecb7621b6392e4, e.g. tx 0x1f151cb390098e16d4b7fa26a90aa3628b3c0b69bdeff0d63c6a8dee316e2e8a) and 0xdaf506b4b3bd1c0085862d3ff2055bcf20a77c01 (sender 0x91e93002f68848ed3ba114c338078e0c50647a44)"
capital_usd: 5
allowed_contracts: []
send_route: public
max_loss_per_tx_usd: 1
max_loss_guarantee: "UpkeepTake.sol run() is owner-only, reverts NotDue before any external write when the pool's interval has not passed (too early, or someone took it), NoPay when the keeper paid nothing, and NoProfit unless the bot wallet's USDC balance grew by minOut; a lost attempt costs gas only (33,709 gas on the fork). bot.py window(): gas limit = eth_estimateGas x 1.4 (send refused above 3,000,000), maxFeePerGas = base fee x 2 + 1 wei (refused above 0.1 gwei), priority fee 0, send refused when gasLimit x maxFeePerGas is worth more than 0.90 USD at the WETH/USDC pool price or when the simulated gain is not above gasLimit x maxFeePerGas; minOut = that cap in USDC + 1 unit. Priority fee bid: 0 pct of gross (ordering in the due block followed arrival, not the tip, in the measured blocks)."
expected_value: "Trial: send-measured win rate, no counted EV. Competition, last 44 takes (blocks 524,996,772-525,696,772, scratch/eqb/tracer-fee.json): every take in the block whose timestamp is the previous upkeep + 3600 s, tx index 1 in 41; winners 0x72e5d003 23 (1.85 gwei priority), 0x91e93002 13 (1.83 gwei), 0xac7fa3f3 6 (0.6 gwei), two others 1 each; the 0.6 gwei sender sat ahead of both 1.85 gwei bidders inside the same block (scratch/eqb/blkpeek.py), so position is decided by arrival time at the sequencer. Reward median 0.83 USDC.e; a won take costs 349,336 gas = 0.013 USD at the 0.02 gwei base fee, a lost send 0.0012 USD, five sends per hour = at most 0.15 USD per day. The bot aims at any share of the 24 takes per day (about 18 USD per day gross in total); each win nets about 0.74 USD."
executor: scratch/trial-mycelium-upkeep-arbitrum/contracts/out/UpkeepTake.sol/UpkeepTake.json
executor_args: "{bot}"
executor_note: "Constructor takes the owner only. run(keeper, pool, payToken, swapPool, usdc, minOut): every target is a call argument. Checks pool.intervalPassed() (NotDue), calls keeper.performUpkeepSinglePool(pool), NoPay unless its payToken balance grew, sells the whole payToken balance for USDC on one Uniswap-V3-style pool straight to the owner (direction derived from token0/token1, BadPool unless the pool is exactly payToken/USDC; the swap callback checks msg.sender against the pool set for this swap and cleared after; no approvals are given), Leftover unless its payToken balance is 0, NoProfit unless the owner's USDC grew by minOut. No setup transaction, nothing stored between transactions. Live code reads EXECUTOR_ADDR_ARBITRUM or EXECUTOR_ADDR only; paper mode places executor-runtime.hex (eth_getCode of the fork deployment 0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352, taken by proof.py) with an eth_call code override."
fork_evidence: "scratch/trial-mycelium-upkeep-arbitrum/proof.py -> proof-result.json, run 2026-11-19 18:45 UTC by run fa095e42 (one Arbitrum fork lease; fork reset arbitrum 525,686,642 = 26 s before the paid mainnet take 0x1f151cb390098e16d4b7fa26a90aa3628b3c0b69bdeff0d63c6a8dee316e2e8a in block 525,686,742, due second 1795110778; fork deploy of the artifact with --args at 0xb464f7314d55ec6a9a0cf6f7f6df17af8ed5b352; block timestamps pinned). Real fork transactions: non-owner 0x5fc973bc1b93bd27b5dbad13a9f306b86c11767f3b2c79edf7422a40cb738bfe status 0 NotOwner() 0x30cd7471; one second before due (ts 1795110777) 0xf6bf2e4f68f60a691383398996cdfebc4a0ddb36c758fa688d6da6d6cd24e615 status 0 NotDue() 0x47a2375f, 33,709 gas, owner -1,011,270,000,000 wei (gas only); guard at the due second with minOut 1000 USDC 0x8d93843ea9421d52036ae6a6b8bbd19ab2c77a30867c3acb485b31bc8757f5c9 status 0 NoProfit(755074), 409,075 gas, owner USDC unchanged; SUCCESS (ts 1795110779, minOut 679,566) 0x9a45c6d5dacd0992e63491667818a0f34359a33b8567ba6cec78c13f979224c0 block 525,686,647 status 1, 349,336 gas, owner USDC +755,074 units (+0.755074 USDC), native -10,480,080,000,000 wei (0.019 USD at the script's 0.03 gwei); executor native, USDC and USDC.e all 0 after it; the same call after the take 0x6ccb510af504fc001e685112aa67398d62a59209e2cc95178477bf3a324b98d6 status 0 NotDue(), 33,709 gas. sim_relay.py / sim-relay-result.json: the relay's eth_call with the code override and block override time = due second returns NoProfit(757424) and eth_estimateGas 413,096 before the due second."
awaited_events: "pool.lastPriceTimestamp() + updateInterval() (3600 s) on pool 0x3a52ad74006d927e3471746d4eac73c9366974ee: every hour, last 2026-11-19 17:52:58 UTC, next 18:52:58 UTC and hourly after."
good_signs: "paper: one opportunity + paper_sim success + window_result (delay_s 0) row per hour. live: send_result won with the wallet's USDC up; bias rows settling; lost sends at about 34,000 gas."
bad_signs: "skip rows with not_due or no_pay at the due second (pool balances below the reward, or the pool retired); window_result winner null (nobody upkeeps: the pool is dead); live: 100 sends with no win and positions all late even at bias -2 s (our path to the sequencer is slower than the incumbents: close as blocked_infra); send rows with ok false (signer refusal)."
rpc_reads_per_min: "0.25 on average: about 11 relay calls per hourly window plus one lastPriceTimestamp read every 10 minutes."
alchemy_cu_per_day: "Per window about 400 CU (2 eth_call 52, eth_estimateGas 87, block 16, slot0 26, blockNumber 10, getLogs 75 + block 16, up to 5 receipts 75) x 24 = 9,600; idle reads 144 x 26 = 3,700; total about 13,500 CU/day (0.007 USD at 0.53 USD per million CU). Code cap 60,000 CU/day. No feed filter: the due second is known an hour ahead."
legal_note: "performUpkeepSinglePool is a public keeper function whose reward the protocol pays to any caller. The bot reads confirmed state only, never pending transactions, and does not react to other users' transactions; it sends at a time computed from the pool's own schedule. At most 5 small transactions per hour."
expedite: false
