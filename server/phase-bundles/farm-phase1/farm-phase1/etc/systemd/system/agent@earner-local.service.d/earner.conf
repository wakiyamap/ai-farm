# The earner runs as its own user, in a loop: when a session ends, the next starts.
[Unit]
StartLimitIntervalSec=1h
StartLimitBurst=20

[Service]
User=earner
Group=earner
Environment=GLM53FLASH_API_KEY=none
Restart=always
RestartSec=15
RuntimeMaxSec=75min
# Instructions and provider config are root-owned and mounted read-only, so
# the earner can't rewrite its own instructions for later sessions.
BindReadOnlyPaths=/srv/farm/runners/earner-local/prompt.md:/home/earner/.dsh/AGENTS.md
BindReadOnlyPaths=/etc/farm/earner-headless.patch.yml:/home/earner/.dsh/profiles/headless/cordis.patch.yml
