# Second earner instance (phase 12a): same role file, same OS user, same local model as
# agent@earner-local; /opt/farm/context/earner gives it the "measure" lane from its name.
# It uses the second of llama-server's four slots.
[Unit]
StartLimitIntervalSec=1h
StartLimitBurst=20

[Service]
User=earner
Group=earner
Environment=GLM53FLASH_API_KEY=none
Environment=LOCAL_LLM_API_KEY=none
# Same reason as agent@earner-local: dsh's own sandbox breaks sudo for kb/wiki writes.
# The boundary is the OS user, the nftables rules and this unit.
Environment=DSH_PERMISSION_MODE=danger-full-access
Restart=always
RestartSec=300
RuntimeMaxSec=75min
Environment=SESSION_MAX_MIN=75
UMask=0002
# Root-owned instructions and provider config, mounted read-only inside this unit only.
BindReadOnlyPaths=/srv/farm/runners/earner-measure/prompt.md:/home/earner/.dsh/AGENTS.md
BindReadOnlyPaths=/etc/farm/earner-headless.patch.yml:/home/earner/.dsh/profiles/headless/cordis.patch.yml
