# Phase 14b: a scout instance (Qwen, local). Same OS user, model and dsh profile as the earners.
[Unit]
After=qwen-server.service
Wants=qwen-server.service
StartLimitIntervalSec=1h
StartLimitBurst=60

[Service]
User=earner
Group=earner
Environment=GLM53FLASH_API_KEY=none
Environment=LOCAL_LLM_API_KEY=none
Environment=DSH_PERMISSION_MODE=danger-full-access
Restart=no
RuntimeMaxSec=35min
Environment=SESSION_MAX_MIN=35
UMask=0002
ExecCondition=/bin/sh -c 'curl -sf -m 3 http://127.0.0.1:8003/v1/models >/dev/null && ls /srv/farm/ws/scout/queue | grep -c json >/dev/null'
BindReadOnlyPaths=/srv/farm/runners/scout-2/prompt.md:/home/earner/.dsh/AGENTS.md
BindReadOnlyPaths=/etc/farm/earner-headless.patch.yml:/home/earner/.dsh/profiles/headless/cordis.patch.yml
